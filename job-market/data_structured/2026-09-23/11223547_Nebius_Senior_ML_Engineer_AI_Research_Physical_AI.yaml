position:
  title: Senior ML Engineer (AI Research, Physical AI)
  ai_type:
    type: ml-first
    reasoning: |-
      The role shapes model behaviour through training/fine-tuning
      large foundation models and RL/imitation learning for
      robotic agents. The focus is vision-language-action, world
      models, and sim-to-real robotics — classical ML/DL with no
      prompt, retrieval, or LLM-agent shaping; generative
      components here are multimodal/video models trained and
      evaluated rather than steered.
  responsibilities:
  - Design, implement, train, and evaluate large models and learning algorithms for
    robotic agents
  - Develop vision-language-action architectures connecting multimodal perception
    and language understanding with physical control
  - Investigate reinforcement learning and imitation learning methods for sparse or
    difficult-to-verify objectives
  - Build scalable methods for incorporating demonstrations, teleoperation data, video,
    simulation trajectories, and robot experience into foundation models
  - Design capture methodologies, datasets, evaluation protocols, and data-quality
    pipelines for embodied learning
  - Develop simulation environments and conduct sim-to-real experiments on physical
    robotic platforms
  - Write robust research software and distributed training infrastructure for rapid
    experimentation
  - Communicate results through technical reports, open-source releases, demos, and
    publications
  use_cases:
  - Vision-language-action models for general-purpose robotic control
  - Reinforcement and imitation learning from human demonstrations, simulation, and
    real-world experience
  - Scalable collection and curation of multimodal embodied data
  - Simulation, world models, and sim-to-real transfer
  - Dexterous manipulation and whole-body control for robotic agents
  - Multimodal sensing including vision, touch, force, and proprioception
