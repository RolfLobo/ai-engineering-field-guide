description: |
  Overview

  The AI Product Engineer is responsible for accelerating how
  Origami designs, assembles, and ships user-facing product
  experiences on the Origami Risk platform. This role focuses
  on low/no-code and AI-assisted solutions for technology-
  literate systems thinkers who understand services
  architecture, authentication, security, and integration
  patterns and can use AI tools to orchestrate end-to-end
  solutions quickly and safely. This person works directly
  with business and client stakeholders to turn outcomes and
  constraints into working product experiences, while
  partnering with Product, Architecture, DevOps, Security, and
  QA to ensure quality, compliance, and maintainability.

  Starting base pay for this role is between $117,000 and
  $145,000. The actual base pay is dependent upon many
  factors, such as transferable skills, work experience,
  business needs, training, location, and market demands. The
  base pay range is subject to change and may be modified in
  the future. This role will be eligible for a bonus as well
  as competitive medical, dental, and vision benefits,
  wellness reimbursement, life insurance, and a 401(k) with
  company match. We offer vacation and sick leave benefits
  (under a flexible time off policy in most states).

  Responsibilities

  - Translates business problems and user needs into shippable
    experiences and modules aligned to OKRs and ROI.
  - Uses tools like Replit, ClaudeCode, and Cursor to draft,
    synthesize, and assemble functional components,
    integration glue, and configuration—without being a
    traditional software developer.
  - Integrates front‑end experiences with Origami Risk platform
    services (e.g., data, workflow, rules, reporting,
    notifications, external connectors) using approved
    patterns and APIs.
  - Applies SSO/OIDC/OAuth patterns, secrets management,
    role/permission models, data privacy, and auditability
    from day one.
  - Partners with Architecture to choose patterns, ensure
    scalability/resilience, and align with reference
    architectures and guardrails.
  - Iterates quickly with stakeholders and users; harden
    prototypes into maintainable production experiences with
    clear documentation and handoff plans.
  - Collaborates with QA to specify acceptance criteria, test
    data, and automated checks (vulnerability scans,
    accessibility, basic UI tests).
  - Designs features for telemetry (usage, performance, errors),
    defines runbooks, and ensures product health metrics are
    visible post‑launch.
  - Adheres to regulatory and internal controls (e.g., SOC 2,
    HIPAA/PHI, PCI, where applicable), data handling policies,
    and secure SDLC practices.
  - Maintains concise specs, PRDs-lite, architecture notes, and
    user‑facing release notes.
  - Utilizes AI tools, platform capabilities, and approved
    patterns to assemble and ship user experiences and
    integrations at speed.
  - Leverages AI to generate code and configurations as needed
    to ensure solutions meet standards and integrate
    correctly.

  Qualifications

  - Bachelor’s degree in Information Technology, Computer
    Science, or related field.
  - 5+ years in product‑adjacent, solution engineering, systems
    analysis, technical consulting, or platform configuration
    roles.
  - Demonstrable systems thinking: understanding of services
    architecture, APIs, auth (OAuth/OIDC/SSO), data flows, and
    integration patterns.
  - Hands‑on experience assembling solutions via low/no‑code,
    configuration, or AI‑assisted coding tools (Replit,
    ClaudeCode, Cursor, or similar).
  - Strong product sense and UX empathy; ability to translate
    problems into user journeys and working UI.
  - Working knowledge of security and privacy principles (least
    privilege, data minimization, PII/PHI handling, secrets
    management).
  - Excellent written and verbal communication, with crisp
    documentation and stakeholder facilitation skills.

  Preferred Qualifications

  - Familiarity with Origami Risk platform services or similar
    enterprise platforms (policy, claims, risk, workflow,
    rules engines).
  - Exposure to front‑end frameworks (React/Vue) at the
    conceptual level—enough to guide AI tools and evaluate
    output.
  - Experience with API gateways, eventing, webhooks, and
    ETL/ELT concepts.
  - Knowledge of accessibility (WCAG) and design systems.
  - Experience in regulated environments (SOC 2, PCI, HIPAA, ISO
    27001, GDPR).

  Benefits

  - Medical and Dental coverage available for employees,
    dependents, domestic partners, and spouses
  - Paid Time Off – Flexible options plus 10 paid company
    holidays where available**
  - All full-time positions are hybrid, with many eligible to be
    completely remote
  - Fully Paid by Origami Risk – Vision insurance, Short & Long-
    Term Disability Insurance, and Basic Life Insurance
  - Generous family leave options—including adoption and foster
    care placements
  - Pre-Tax Savings Accounts – Flexible Spending Account, Health
    Savings Account, Commuter Benefits, Dependent Care Savings
    Account
  - Retirement Savings – 401(k) with company match up to 4%
  - Employee Assistance Program (EAP) – Confidential & Free
    support offered to colleagues facing personal or work-
    related complications
  - Education Assistance Program – to help colleagues pursue
    industry/role-specific certifications
  - Wellness Benefits – reimbursement program to invest in
    healthy habits as well as support better colleague
    productivity and stress management
  - Additional coverages available – Pet Insurance, Critical
    Illness Insurance, and Voluntary Life & AD&D coverage

  **Flexible PTO not available in California or the UKWho We
  Are

  Origami Risk delivers single-platform SaaS solutions that
  help organizations best navigate the complexities of risk,
  insurance, compliance, and safety management.

  Founded by industry veterans who recognized the need for
  risk management technology that was more configurable,
  intuitive, and scalable, Origami continues to add to its
  innovative product offerings for managing both insurable and
  uninsurable risk; facilitating compliance; improving safety;
  and helping insurers, MGAs, TPAs, and brokers provide
  enhanced services that drive results.

  A singular focus on client success underlies Origami’s
  approach to developing, implementing, and supporting our
  award-winning software solutions.

  Origami Risk is proud to be an equal opportunity employer.
  We thrive and benefit from diversity and are committed to
  creating an inclusive and equitable environment for all
  employees. We do not discriminate against any individual
  based upon race, religion, gender (including pregnancy,
  childbirth, or related medical conditions), sexual
  orientation, gender identity, gender expression, color, sex,
  national origin, age, marital status, military or veteran
  status, disability, or any other characteristic protected by
  applicable law.

  Caution: Be alert to recruiting scams. We have received
  reports of individuals impersonating Origami Risk recruiters
  to deceive candidates into disclosing personal information.
  These impostors use fake Origami Risk domain names and email
  addresses. Please double-check that any email address from
  an Origami Risk recruiter ends with origamirisk.com or
  talent.icims.com. And to confirm the legitimacy of any
  recruiting communication, feel free to email
  transparencycheck@origamirisk.com.
