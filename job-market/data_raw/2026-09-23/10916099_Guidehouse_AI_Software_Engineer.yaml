work_type: FULL_TIME
description: |
  Job Family:

  Software Development & Support

  Travel Required:

  None

  Clearance Required:

  Ability to Obtain Public Trust

  Guidehouse Technology is seeking a motivated AI Software
  Engineer to join our growing team supporting federal
  clients. This role is ideal for an early- to mid-career
  technologist who is passionate about building secure,
  scalable, user-centric AI-enabled solutions that address
  complex government mission challenges.

  What You Will Do

  You will contribute to the design, development, testing, and
  deployment of full-stack web applications on AWS,
  integrating workflow orchestration, relational data systems,
  analytics, and accessible user interfaces. Working with
  cross-functional teams—including senior engineers, data
  scientists, product managers, and mission stakeholders—you
  will help deliver high-impact solutions that combine modern
  engineering practices with Artificial Intelligence
  capabilities.

  This role emphasizes strong engineering fundamentals, hands-
  on development, collaboration, continuous learning, and
  responsible use of Generative AI–assisted coding tools to
  accelerate development, improve quality, and enhance
  delivery velocity.

  - Contribute to the design, development, testing, and
    deployment of AI-enabled full-stack web applications
    deployed on AWS.
  - Develop and maintain application components spanning
    frontend interfaces, backend services, APIs, workflow
    orchestration, and relational database layers.
  - Build and enhance accessible, user-friendly web interfaces
    using ReactJS and related frontend technologies,
    supporting Section 508 and usability standards.
  - Develop backend services using Java or Python, including
    RESTful APIs, business logic, integrations, unit tests,
    and support for microservices-based architectures.
  - Support the design and maintenance of RDBMS-based data
    models and SQL queries using technologies such as
    PostgreSQL, MySQL, or Amazon Aurora.
  - Implement workflow and process automation capabilities to
    support business and mission operations.
  - Develop data visualization and analytics features, including
    dashboards, charts, reports, and interactive UI components
    that support decision-making.
  - Support implementation of AI-enabled features such as
    intelligent search, chatbots, document processing,
    summarization, semantic search, or agent-assisted
    workflows.
  - Use Generative AI–assisted development tools, such as GitHub
    Copilot, Cursor, or Claude Code, for code generation,
    debugging, testing, refactoring, and documentation while
    following code quality and security practices.
  - Participate in a SAFe (Scaled Agile Framework) or Agile
    delivery environment, contributing to sprint planning,
    backlog refinement, demos, retrospectives, and cross-team
    coordination.
  - Support DevSecOps practices by using application security
    tools and processes, including SAST, DAST, SCA, dependency
    scanning, container scanning, and vulnerability
    remediation.
  - Contribute to CI/CD pipeline activities, including automated
    testing, security scanning, deployment automation, and
    compliance checks.
  - Participate in code reviews, technical design discussions,
    troubleshooting, documentation, and peer collaboration to
    improve software quality and maintainability.
  - Collaborate with cross-functional teams to prototype,
    iterate, and deliver scalable, secure, and maintainable
    solutions aligned to mission requirements.

  What You Will Need

  - Must be able to OBTAIN and MAINTAIN a Federal or DoD "PUBLIC
    TRUST"; candidates must obtain approved adjudication of
    their PUBLIC TRUST prior to onboarding with Guidehouse.
    Candidates with an ACTIVE PUBLIC TRUST or SUITABILITY are
    preferred.
  - Bachelor’s degree in Computer Science, Engineering, Data
    Science, Information Systems, or a related technical
    field, OR Additional FOUR (4) years experience in lieu of
    Degree.
  - Minimum of TWO (2) years of professional software
    engineering experience, or a combination of professional
    experience, internships, academic projects, bootcamp
    experience, or equivalent hands-on development experience.
  - Working proficiency in Java or Python for backend
    development, including object-oriented programming,
    debugging, automated testing, and API development.
  - Hands-on experience with ReactJS, JavaScript, HTML, and CSS
    for modern frontend application development.
  - Experience or strong familiarity with building and deploying
    applications in cloud environments, preferably AWS.
  - Experience with RESTful APIs, version control using Git,
    collaborative development workflows, and basic
    microservices or distributed application concepts.
  - Experience with relational databases and SQL, such as
    PostgreSQL, MySQL, or Amazon Aurora.
  - Familiarity with accessibility principles and web interface
    development aligned with Section 508 and usability
    standards.
  - Interest in and practical exposure to AI-enabled software
    capabilities such as intelligent search, chatbots,
    document processing, analytics, summarization, or workflow
    automation.
  - Hands-on experience using or willingness to use Generative
    AI–assisted coding tools to support development, testing,
    refactoring, and documentation.
  - Basic understanding of secure coding, automated testing,
    CI/CD, DevSecOps, and application security concepts.
  - Ability to work effectively in an Agile or SAFe team
    environment and contribute to sprint-based delivery
    activities.
  - Strong analytical, problem-solving, communication, and
    collaboration skills, with the ability to work
    independently on assigned tasks and seek guidance when
    needed.

  What Would Be Nice to Have

  - Experience developing AI/ML-enabled applications, such as
    Retrieval-Augmented Generation (RAG), chatbots, semantic
    search, summarization, document processing, or agentic
    workflows.
  - Familiarity with AI frameworks or libraries such as
    LangChain, Haystack, Semantic Kernel, OpenAI-compatible
    APIs, or similar tools.
  - Experience with AWS services such as Lambda, ECS/Fargate,
    API Gateway, Step Functions, S3, Glue, CloudWatch, IAM, or
    Amazon Bedrock.
  - Exposure to modern data architectures, including data lakes,
    lakehouse patterns, federated query engines, or analytics
    platforms.
  - Experience with data visualization tools and libraries, such
    as D3.js, Plotly, Tableau, Amazon QuickSight, or similar.
  - Familiarity with Infrastructure as Code tools such as
    Terraform, AWS CDK, or CloudFormation.
  - Awareness of federal security and compliance standards,
    including FISMA, FedRAMP, NIST 800-53, or secure software
    development practices.
  - Exposure to application security and DevSecOps tools,
    including SAST, DAST, software composition analysis,
    dependency scanning, or container scanning.
  - SAFe, Agile, AWS, security, or AI-related training or
    certifications.
  - Demonstrated curiosity, adaptability, and commitment to
    continuous learning in AI-enabled, cloud-native software
    development.

  The annual salary range for this position is
  $74,000.00-$124,000.00. Compensation decisions depend on a
  wide range of factors, including but not limited to skill
  sets, experience and training, security clearances,
  licensure and certifications, and other business and
  organizational needs.

  What We Offer:

  Guidehouse offers a comprehensive, total rewards package
  that includes competitive compensation and a flexible
  benefits package that reflects our commitment to creating a
  diverse and supportive workplace.

  Benefits include:

  - Medical, Rx, Dental & Vision Insurance
  - Personal and Family Sick Time & Company Paid Holidays
  - Parental Leave
  - 401(k) Retirement Plan
  - Group Term Life and Travel Assistance
  - Voluntary Life and AD&D Insurance
  - Health Savings Account, Health Care & Dependent Care
    Flexible Spending Accounts
  - Transit and Parking Commuter Benefits
  - Short-Term & Long-Term Disability
  - Tuition Reimbursement, Personal Development, Certifications
    & Learning Opportunities
  - Employee Referral Program
  - Corporate Sponsored Events & Community Outreach
  - Care.com annual membership
  - Employee Assistance Program
  - Supplemental Benefits via Corestream (Critical Care,
    Hospital Indemnity, Accident Insurance, Legal Assistance
    and ID theft protection, etc.)
  - Position may be eligible for a discretionary variable
    incentive bonus

