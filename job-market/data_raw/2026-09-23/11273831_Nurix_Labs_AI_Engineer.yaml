description: |
  Job Title: Artificial Intelligence Engineer

  Location: Bangalore, India

  About Us:

  At Nurix AI, we envision a world powered by super-
  intelligent AI agents that transform how businesses engage
  with customers. Our cutting-edge AI agents do more than just
  solve problems, they create opportunities. From suggesting
  next purchases to boosting revenue while maintaining
  customer satisfaction, to analyzing vast datasets for
  actionable insights, our technologies shape your business
  and product strategies. By resolving queries with precision
  and delivering highly personalized interactions, we redefine
  the customer experience and drive measurable impact.

  Nurix.ai is at the forefront of AI innovation, developing
  cutting-edge AI and LLM solutions to enhance productivity
  and automation. Backed by $27.5M in seed funding, we are
  building next-gen AI-driven applications that redefine
  human-machine collaboration. We are looking for a Technical
  Lead to spearhead our AI engineering efforts and drive
  product innovation.

  We are pioneering the AI revolution as India’s first scaled
  AI services company. We deliver cutting-edge AI and LLM
  solutions tailored for the dynamic needs of the modern
  world. Backed by robust funding we are a vibrant, young team
  set on redefining technological boundaries. Join us in
  shaping the future.

  Join us in building the future, where every interaction is
  smarter, faster and more impactful.

  Role Overview:

  We are seeking a passionate AI Engineers with 1–3 years of
  experience in creating custom solutions, particularly within
  AI or deep tech companies. This role focuses on developing
  and deploying AI/ML applications, collaborating with teams
  to craft tailored solutions and driving impactful results
  for clients. The ideal candidate has a strong foundation in
  AI/ML frameworks and backend technologies, combined with a
  desire to learn and deliver innovative solutions.

  Key Responsibilities:

  Custom Solution Development:

  - Design and implement custom AI applications to meet custom
    requirements.
  - Collaborate with cross-functional teams to ensure seamless
    integration of solutions into client systems.

  AI Application Engineering:

  - Work on deploying AI solutions and maintaining scalable
    applications.
  - Optimize performance and functionality of AI-based solutions
    for real-world use cases.
  - Research and implement machine learning algorithms and
    tools.

  Collaboration and Communication:

  - Work closely with product managers, data scientists and
    engineers to deliver high-quality solutions.
  - Ensure clear communication of technical designs and progress
    with stakeholders.

  Technical Skills:

  - Good understanding of AI application deployment, data
    pipelines and backend architectures.
  - Strong backend development skills with experience in Python,
    Java or similar programming languages.
  - Knowledge of data structures, data modeling, basic
    algorithms and object-oriented and functional design
    principles.
  - Experience in working with cloud environments such as AWS,
    Google Cloud, Azure etc.

  Soft Skills:

  - Strong problem-solving and analytical abilities.
  - Eagerness to learn, innovate and deliver impactful results.

  Education: Bachelor's degree in Computer Science,
  Engineering or a related field. Advanced certifications in
  AI/ML are a plus.

  What We Offer:

  - Opportunity to work on innovative AI projects with cutting-
    edge technologies.
  - A collaborative, inclusive work environment that encourages
    learning and growth.
  - Competitive compensation and benefits to support your career
    development.
