description: |
  POSITION OVERVIEW

  MCI is one of the fastest-growing tech-enabled business
  services companies in the USA, with a strong call center
  footprint and operations that extend across multiple
  countries. We deliver Customer Experience (CX), Business
  Process Outsourcing (BPO), and Anything-as-a-Service (XaaS)
  cloud technology solutions across a wide range of
  industries, including healthcare, retail, government,
  education, telecom, technology e-commerce, and financial
  services. Our contact centers are powered by both on-site
  and remote agents, leveraging advanced technologies to
  enhance customer journeys, drive scalability and reduce
  costs.

  At MCI we are committed to fostering an environment where
  professionals can build meaningful careers, access
  continuous learning and development opportunities and
  contribute to the success of a globally expanding, industry-
  leading organization.

  We are seeking a Senior Generative AI Engineer to lead the
  development of advanced AI-powered products and enterprise
  solutions. This role requires deep expertise in Large
  Language Models, Generative AI architectures, prompt
  engineering, and production-grade AI deployments.

  You will provide technical leadership, mentor engineering
  teams, and drive the design and implementation of innovative
  AI solutions that deliver significant business value.

  To be considered for this role, you must complete a full
  application on our company careers page, including all
  screening questions and a brief pre-employment test.

  POSITION RESPONSIBILITIES

  Key Responsibilities:

  AI Architecture & Solution Leadership

  - Lead the design and implementation of enterprise-scale
    Generative AI solutions.
  - Architect scalable and secure AI platforms and services.
  - Design AI solutions aligned with business and technical
    objectives.
  - Establish development standards and engineering best
    practices.
  - Provide technical leadership across AI initiatives.

  Generative AI Development

  - Build and optimize advanced AI-powered applications.
  - Develop solutions utilizing LLMs and foundation models.
  - Design prompt engineering frameworks and optimization
    strategies.
  - Improve model outputs, accuracy, and user experiences.
  - Support deployment and lifecycle management of AI
    applications.

  Stakeholder Collaboration & Strategy

  - Partner with business and technology leaders to deliver
    impactful AI solutions.
  - Translate business requirements into technical
    architectures.
  - Support AI strategy development and roadmap planning.
  - Provide technical guidance to product and executive
    stakeholders.
  - Assist with AI opportunity assessment and prioritization.

  Governance, Risk & Compliance

  - Ensure AI solutions are secure, compliant, and responsibly
    deployed.
  - Implement governance and monitoring controls.
  - Support AI security and compliance initiatives.
  - Assess risks associated with AI systems and deployments.
  - Promote responsible AI development practices.

  Mentorship & Innovation

  - Support the growth of engineering teams and drive continuous
    innovation.
  - Mentor junior engineers and AI practitioners.
  - Evaluate emerging AI technologies and frameworks.
  - Lead proof-of-concept and experimentation initiatives.
  - Contribute to organizational AI capability development.

  CANDIDATE QUALIFICATIONS

  WONDER IF YOU ARE A GOOD FIT FOR THIS POSITION?

  All positive, and driven applicants are encouraged to apply.
  The Ideal candidates for this position are highly motivated
  and dedicated and should possess the below qualities:

  - Bachelor's Degree in Computer Science, Software Engineering,
    Data Science, Artificial Intelligence, or a related field.
  - Minimum 5 years of software engineering experience.
  - Minimum 3 years of hands-on experience developing Generative
    AI solutions.
  - Extensive experience working with Large Language Models and
    foundation models.
  - Advanced proficiency in Python and modern AI development
    frameworks.
  - Experience designing, developing, and deploying enterprise-
    scale AI solutions.
  - Strong understanding of prompt engineering, model
    evaluation, and optimization techniques.
  - Experience integrating AI capabilities into complex business
    systems.
  - Knowledge of cloud platforms, distributed systems, and
    scalable architectures.
  - Experience mentoring engineers and leading technical
    initiatives.
  - Strong stakeholder management and communication skills.
  - Demonstrated ability to drive innovation and deliver
    business-focused AI solutions.

  Nice to Have

  - Experience with OpenAI, Anthropic, Gemini, Claude, or
    equivalent AI platforms.
  - Experience with LangChain, LangGraph, or LlamaIndex.
  - Knowledge of Retrieval-Augmented Generation architectures.
  - Experience with MLOps and AI lifecycle management.
  - Cloud certifications in AWS, Azure, or GCP.
  - Experience leading AI transformation initiatives.
  - Knowledge of AI governance, ethics, and compliance
    frameworks.
  - Master's Degree in AI, Computer Science, or related
    discipline.

  PHYSICAL REQUIREMENTS

  This job operates in a professional office environment.
  While performing the duties of this job, the employee will
  be largely sedentary and will be required to sit/stand for
  long periods while using a computer and telephone headset.
  The employee will be regularly required to operate a
  computer and other office equipment, including a phone,
  copier, and printer. The employee may occasionally be
  required to move about the office to accomplish tasks; reach
  in any direction; raise or lower objects, move objects from
  place to place, hold onto objects, and move or exert force
  up to forty (40) pounds.

  CONDITIONS OF EMPLOYMENT

  All MCI Locations

  - Must be authorized to work in the country where the job is
    based.

  Subject to the program and location of the position

  - Must be willing to submit up to a LEVEL II background and/or
    security investigation with a fingerprint.  Job offers are
    contingent on background/security investigation results.
  - Must be willing to submit to drug screening.  Job offers are
    contingent on drug screening results. (Does not apply in
    Canada)

