title: "Full-Stack Developer — AI Applications & Integrations"
company: Cognitive Media
location: Beverly Hills, USA
work_type: FULL_TIME
description: |
  We are an AI startup building interactive AI applications
  for businesses. We’re looking for a capable, motivated
  developer to work alongside our existing developer and help
  bring these products to launch. You’ll build customer-facing
  features, develop backend functionality, connect services,
  and improve the reliability and usability of our
  applications.

  This job includes all the benefit of being an early hire at
  our rapidly growing AI company.

  NOTE: This job is on-site at our Beverly Hills office.

  Self-taught and early-career developers are welcome to
  apply.

  We’re looking for someone who:

  ● Has built complete, working applications through
  employment, freelance work, or personal projects.

  ● Has a strong interest in AI and building useful
  applications with it.

  ● Uses Claude Code or comparable tools effectively and can
  understand, review, and troubleshoot the code they produce.

  ● Can work across frontend and backend development.

  ● Can integrate APIs, AI services, databases, and business
  tools.

  ● Can independently take a feature from requirements through
  implementation, debugging, and deployment.

  ● Communicates clearly and collaborates well with other
  developers.


  Extensive formal programming employment is not required. We
  value demonstrated ability, initiative, and sound problem-
  solving. Applicants should be able to show working
  applications and explain their contribution and technical
  decisions.

  To apply: Send a brief introduction, your résumé or
  background summary, and links to applications, demos, or
  projects you’ve built. Tell us what you personally
  contributed and how you use AI coding tools in your
  development process.
