title: "Senior Software Engineer, AI Enablement & Solutions"
company: Morningstar
location: New York, USA
work_type: FULL_TIME
company_size: 11,500 Employees
description: |
  The Group

  Morningstar DBRS provides independent credit ratings,
  research, and risk insights to market participants around
  the world. As AI becomes a practical tool for research,
  analysis, and operational workflows, we're building the
  foundations that allow teams across the business to use it
  responsibly and effectively.

  This team sits at the intersection of software engineering,
  AI, and business transformation. We build the platforms,
  services, and tools that help Morningstar DBRS move from
  experimentation to real-world adoption.

  The Role

  We're looking for a Senior Software Engineer to help shape
  how AI is used across Morningstar DBRS.

  This is not a research role and it is not focused on
  building isolated proofs of concept. You'll develop the
  shared infrastructure, services, and applications that allow
  teams across the organization to deploy AI capabilities into
  production. You'll work closely with engineers, product
  partners, and business stakeholders to identify
  opportunities where AI can improve workflows, reduce manual
  effort, and support better decision-making.

  You'll have significant influence over technical direction
  while remaining hands-on in the design, development, and
  operation of the systems you build.

  What you'll be doing

  • Design and build production AI applications using AWS
  Bedrock and related AWS services, with a focus on
  reliability, security, and maintainability.

  • Develop AI agents, MCP servers, APIs, and shared platform
  capabilities that enable other teams to build and deploy AI-
  powered solutions.

  • Partner with business and technology teams to understand
  complex workflows and identify opportunities where AI can
  deliver measurable improvements.

  • Evaluate and implement approaches such as tool use,
  retrieval-based architectures, orchestration frameworks, and
  model evaluation techniques to improve application
  performance and accuracy.

  • Modernize existing Python-based applications and integrate
  AI capabilities into products and workflows already used
  across Morningstar DBRS.

  • Contribute to technical decisions, engineering standards,
  and delivery planning while helping guide less experienced
  engineers when needed.

  What we're looking for

  • Strong software engineering fundamentals with experience
  building and operating production applications in AWS.

  • Professional experience developing applications and
  services in Python.

  • Experience delivering AI-powered applications beyond
  experimentation, including deploying solutions used by
  internal or external customers.

  • Hands-on experience with AWS Bedrock or comparable
  enterprise AI platforms and the surrounding ecosystem of
  model integration, evaluation, and monitoring.

  • Experience designing and consuming APIs, building
  distributed services, and integrating with enterprise
  systems.

  • A practical approach to software architecture, testing,
  observability, and operational support.

  • Ability to work with both technical and non-technical
  stakeholders to translate business problems into software
  solutions.

  • Bachelor's degree in Computer Science, Engineering, or a
  related field, or equivalent practical experience.

  Base Salary Range: 113,222 to 166,052

  Bonus Target Percentage - 15%

  If you receive and accept an offer from us, we require that
  personal and any related investments be disclosed
  confidentially to our Compliance team. These investments
  will be reviewed to ensure they meet Code of Ethics
  requirements. If any conflicts of interest are identified,
  then you will be required to liquidate those holdings
  immediately. In addition, dependent on your department and
  location of work certain employee accounts must be held with
  an approved broker (for example all, U.S. employee
  accounts). If this applies and your account(s) are not with
  an approved broker, you will be required to move your
  holdings to an approved broker.

  Compensation and Benefits

  At Morningstar we believe people are at their best when they
  are at their healthiest. That’s why we champion your
  wellness through a wide range of programs that support all
  stages of your personal and professional life. Here are some
  examples of the offerings we provide:

  - Financial Health
    - 100% 401k match up to 6% of salary
  - Physical Health
    - Comprehensive health benefits (medical/dental/vision)
      including potential premium discounts and company-
      provided HSA contributions (up to $500-$2,000 annually)
      for specific plans and coverages
    - Additional medical Wellness Incentives - up to $300-$600
      annual
    - Company-provided long- and short-term disability insurance
  - Emotional Health
    - Trust-Based Time Off
    - 6-week Paid Sabbatical Program
    - 6-Week Paid Family Caregiving Leave
    - Competitive 8-24 Week Paid Parental Leave
    - Adoption Assistance
    - Leadership Coaching & Formal Mentorship Opportunities
    - Annual Flex Stipend - $1000 annually to cover personal
      education & well-being expenses
    - Tuition Reimbursement
  - Social Health
    - Charitable Matching Gifts program
    - Dollars for Doers volunteer program
    - Paid volunteering days
    - 15+ Employee Resource & Affinity Groups

  Morningstar's hybrid work environment gives you the
  opportunity to collaborate in-person each week as we've
  found that we're at our best when we're purposely together
  on a regular basis. In most of our locations, our hybrid
  work model is four days in-office each week. A range of
  other benefits are also available to enhance flexibility as
  needs change. No matter where you are, you'll have tools and
  resources to engage meaningfully with your global
  colleagues.
