description: |
  Banyan Software is the best permanent home for software
  businesses that serve specialized industries, their
  employees, and their customers. With a buy-grow-and-hold-
  for-life approach and a permanent capital base, Banyan
  acquires and grows companies worldwide, honoring founder
  legacies and helping portfolio companies modernize through
  shared AI expertise and operational discipline. Founded in
  2016, Banyan operates more than 120 portfolio companies
  across North and South America, Europe, and APAC, and has
  appeared on the Inc. 5000 list for six consecutive years.
  The Banyan Software Foundation, endowed with $100 million in
  Banyan stock, leverages technology to build a greener and
  more equitable world.

  About Anago

  At Anago, more than 55 colleagues have been making a daily
  impact on society for over 25 years. Our software helps
  public organisations plan better, prioritise more
  effectively, and deploy capacity efficiently — enabling
  faster decisions, more effective use of resources, and
  better responses to societal challenges. Think: faster
  procedures for asylum seekers, improved preventive
  healthcare, and better allocation of education budgets.

  We have built a strong position in the Netherlands and are
  now actively expanding internationally, including into the
  United Kingdom. The coming years will be defined by scaling
  up, broadening our market presence, and further
  professionalising our commercial organisation.

  At Anago, we work on impact — combining smart working with a
  warm, collaborative culture.

  The Role

  We are already taking concrete steps to integrate AI
  applications into our products. As Senior AI Engineer you
  have end responsibility for designing, setting up and
  further developing Anago's AI platform. As a front-runner
  you hold a strategic vision on AI adoption within the
  organisation and you put the AI structure in place.

  You build the foundation on which future AI, ML and LLM
  solutions within our organisation are developed, rolled out
  and managed. Because our software is used every day by
  public sector organisations, you steer on security,
  governance, continuity, cost efficiency and explainability.
  After all, AI functionality that supports decisions about
  people must be transparent, auditable and reliable. That is
  also your default way of building.

  You help give direction to how AI is applied within Anago,
  showing technical leadership and taking the lead on further
  AI adoption within Anago and towards our customers. This is
  emphatically not a research role; you spend most of your
  time designing, building, rolling out and managing AI
  systems that are used in production every day.

  Qualifications for Success

  - University (WO) level of education and thinking
  - At least 7 years of experience in software engineering, of
    which at least 3 years with AI, ML or LLM solutions in
    production environments
  - You live within a distance that makes being in the office in
    Den Bosch at least 50% of the time practical and
    sustainable over the long term
  - Demonstrable experience designing, building and managing
    business-critical AI platforms or AI solutions at scale
  - Experience with ML frameworks and MLOps tooling
  - Experience with LLMOps tooling such as LangFuse, LangSmith,
    LangChain or similar
  - Hands-on experience with cloud-native infrastructure and
    deployment, preferably Azure
  - Experience with Docker, Kubernetes, CI/CD pipelines and
    pipeline orchestration (e.g. Airflow)
  - Strong programming skills (for example in Python) and
    experience with production environments
  - Solid knowledge of software architecture, data structures,
    algorithms, API design and distributed systems
  - A strong software engineering foundation with attention to
    testability, maintainability and code quality
  - Experience with code reviews, automated testing, version
    control and modern software development processes
  - Strong communication skills in English and Dutch (minimum
    B1)
  - You take ownership of the solutions you build and feel
    responsible for the result in production
  - You are able to translate technical complexity into
    practical solutions and clear choices

  What can you expect from us?

  You will work in an organisation where substance,
  collaboration and long-term impact come first. We strongly
  believe in the possibilities of AI and are actively building
  an AI-first approach within our products and our
  organisation.

  - A key role in the development of our AI platform
  - A great deal of freedom and responsibility
  - Direct impact on product, technology and organisation
  - Working on AI solutions with social relevance
  - Working in an ambitious and technically strong team
  - Room for development, experimentation and innovation
  - A fixed base salary between €5,291.59 and €7,559.41,
    depending on experience, knowledge and skills
  - Net phone and internet allowance
  - 8% holiday allowance
  - 26 holiday days, with the option to buy 6 extra days or 13
    ADV (reduced working hours) days
  - Flexible working hours and the possibility to work hybrid;
    our office is located close to ’s-Hertogenbosch central
    station, where you can work flexible hours. In addition,
    the possibility to work from home with a fully equipped
    home workspace including a work-from-home allowance
  - A non-contributory pension
  - Top-up of paid parental and partner leave to 100%
  - A delicious catered lunch at the office every day (for a
    small contribution)
  - Regular team outings, drinks and activities, through which
    we regularly give something back to society

  Diversity, Equity, Inclusion & Equal Employment Opportunity
  at Banyan: Banyan affirms that inequality is detrimental to
