  #LI-Hybrid

  Why UJET?

  - Impactful Work: Be at the forefront of innovation, directly
    shaping the future of customer experience.
  - Dynamic Culture: Join a collaborative, inclusive team that
    values big ideas, creative solutions, and powerful
    relationships.
  - Comprehensive Benefits: Medical, dental, vision, 401(k)
    plan, wellness benefits, and more.

  UJET is an Equal Opportunity Employer

  UJET provides equal employment opportunities to all
  employees and applicants for employment and prohibits
  discrimination and harassment of any type without regard to
  race, color, religion, age, sex, national origin, disability
  status, genetics, protected veteran status, sexual
  orientation, gender identity or expression, or any other
  characteristic protected by federal, state or local laws.

  Compliance Responsibilities

  Security, data protection and compliance (SDPC) are
  paramount to the success of our partnerships. All roles at
  UJET require compliance with legal and regulatory
  requirements and acceptance and adherence to all policies
  and standards within UJET. Personnel acknowledges they are
  personally responsible for reporting any suspected
  violations or abuse and are required to complete SDPC
  training and fulfill role-specific SDPC responsibilities.

  AI Use in Our Hiring Process

  UJET uses artificial intelligence (AI) technology to assist
  with the initial review and filtering of job applications
  against the qualifications listed in this posting. AI does
  not make hiring decisions, does not conduct interviews, and
  has no authority to reject or advance a candidate on its
  own. All application review decisions, candidate screening,
  and interviews are conducted by members of our human
  recruiting and hiring teams.

  Reasonable Accommodation

  If you would like to request a reasonable accommodation as
  part of the application process, including an alternative to
  AI-assisted screening, please contact peopleteam@ujet.cx.

  Work Authorization & Sponsorship

  Applicants must be legally authorized to work in the country
  in which this position is located, without the need for
  current or future employer-sponsored visa sponsorship. UJET
  does not sponsor employment visas for this role.
