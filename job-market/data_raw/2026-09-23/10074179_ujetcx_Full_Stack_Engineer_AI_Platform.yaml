description: |
  About Us

  UJET leads the way in AI-powered contact center innovation,
  delivering a future-proof, cloud platform that redefines the
  customer experience with cutting-edge AI, true
  multimodality, and a mobile-first approach. We infuse AI
  across every aspect of your customer journey and contact
  center operations, to drive automation and efficiency.
  UJET's AI solutions empower agents, optimize customer
  journeys, and transform contact center operations for
  elevated experiences and actionable insights. Built on a
  cloud-native architecture with a unique CRM-first approach,
  UJET ensures unmatched security, scalability, and
  prioritized data insights (without storing PII). Designed
  for effortless use, UJET partners with businesses to deliver
  exceptional interactions, smarter decision-making, and
  accelerated growth in the AI-driven world.

  Learn more at www.ujet.cx.

  About the Team

  You’ll join UJET’s Data and AI engineering organization,
  working at the intersection of full-stack product
  engineering, data systems, and AI-enabled customer
  experience. Our teams build and support the data platform,
  analytics foundations, AI integrations, virtual agent
  capabilities, agent assist experiences, and conversation
  intelligence systems that power UJET’s next generation of
  customer experience products.

  This is a great role for an engineer who enjoys moving
  across the stack, learning quickly, and turning ambiguous
  product and data problems into reliable, production-ready
  systems.

  The Opportunity

  We’re looking for a Full Stack Engineer, AI Platform to
  build the internal products and infrastructure that enable
  teams to create agentic applications.

  In this role, you’ll develop full-stack tools, services,
  APIs, workflows, and platform capabilities used by engineers
  and product teams building with AI. You may work on
  developer interfaces, agent orchestration, model and tool
  integrations, evaluation systems, observability, prompt and
  context management, reusable components, and deployment
  workflows.

  You should be comfortable writing production software across
  backend and frontend systems, working with data, and
  learning new technologies as the problem demands. Success
  requires strong engineering fundamentals, curiosity about
  rapidly evolving AI systems, and a practical focus on making
  complex capabilities reliable and easy for others to use.

  This role is ideal for someone with strong Python and
  systems development experience, solid engineering instincts,
  and a demonstrated ability to take initiative in complex
  technical environments.

  Location: This role is US-based. We have a preference for
  someone who lives in Maine, while remaining open to strong
  candidates elsewhere in the United States.

  Responsibilities

  - Build and maintain internal full-stack products that help
    teams design, develop, test, evaluate, deploy, and operate
    AI agents and AI-enabled features
  - Develop backend services, APIs, SDKs, workflows, and
    integrations that connect models, tools, enterprise data,
    and product systems
  - Build reusable platform capabilities for agent
    orchestration, prompt and context management, tool use,
    human review, and workflow automation
  - Develop evaluation, observability, debugging, and quality-
    control systems that make AI behavior measurable and
    reliable
  - Design secure patterns for accessing data, invoking tools,
    managing permissions, and applying appropriate AI safety
    guardrails
  - Partner with infrastructure and application engineering
    teams to understand needs and translate them into durable
    platform capabilities
  - Improve the developer experience through clear abstractions,
    documentation, examples, templates, and paved paths
  - Write maintainable, well-tested code and participate in
    design reviews, code reviews, debugging, release
    processes, and production support
  - Take ownership of ambiguous problems, identify practical
    tradeoffs, and drive work from discovery through
    production adoption
  - Stay current with evolving AI engineering practices and
    apply new approaches thoughtfully rather than adopting
    technology for its own sake

  Requirements

  - At least 2 years of professional software engineering
    experience
  - Strong production experience with Python
  - Experience building full-stack applications, backend
    services, APIs, developer tools, or platform products
  - Experience integrating complex systems and designing
    maintainable service boundaries and APIs
  - Experience with data-intensive applications, data pipelines,
    analytics workflows, or operational data systems
  - Interest in or hands-on experience with LLMs, AI agents,
    model APIs, retrieval systems, workflow automation, or
    other applied AI technologies
  - Strong software engineering fundamentals, including testing,
    version control, code review, debugging, security,
    observability, and maintainable system design
  - Ability to work across multiple layers of a technical stack
    and learn unfamiliar technologies quickly
  - Evidence of self-motivated work, strong ownership, and the
    ability to make progress in ambiguous situations
  - Clear written and verbal communication skills, especially in
    a distributed engineering environment
  - Experience building and operating software on cloud
    platforms

  Annual US Hiring Range: $115,000 - $130,000

  *A candidate’s actual placement within this range will
  depend on geographic location, work experience, education,
  and/or skill level. Applicants must be authorized to work
  for ANY employer in the U.S. We are unable to sponsor or
  take over sponsorship of an employment visa at this time.

