description: |
  Join BLP and help make the world’s business processes
  autonomous!

  Our agentic platform helps finance and operations teams
  worldwide remove manual work from their core business
  processes, so work runs end-to-end with greater control and
  significant productivity gains.

  Today, over 550 enterprise customers use BLP across 1,300+
  deployed projects. In the processes we automate, customers
  achieve productivity improvements of 5 to 10 times.

  To date, BLP remains majority employee-owned, with Goldman
  Sachs holding a minority stake as a growth investor. Our
  success is driven by deep expertise in technology and
  business processes, a superior product with strong product-
  market fit, reflected in an expanding customer base that
  includes Fortune 500 companies.

  BLP is one of Switzerland's fastest-growing SaaS scale-ups;
  we are now entering our next phase of growth. From our
  headquarters on Zürich's Bahnhofstrasse, we're expanding
  globally, with a growing presence across Europe and North
  America.

  Join us and help make autonomous operations the new
  standard.

  About the role

  We're giving you the keys to the machine. As our Applied AI
  Engineer, you'll have a founder-level mandate to build and
  ship AI-powered internal tools that make our hiring, finance
  and ops workflows 10x faster, not 10% faster. You'll work at
  the frontier of what's possible with LLMs, AI agents, and
  emerging AI tooling, and apply it where it matters most:
  inside our own company.



  What you'll do

  - Build and ship AI-powered internal tools fast: we're talking
    days and weeks, not quarters
  - Evaluate, integrate, and chain the latest AI models, APIs,
    and frameworks (LLMs, agent frameworks, embedding
    pipelines, AI coding tools) into production-ready internal
    solutions
  - Create compounding leverage: document and share each tool
    well enough that it frees up hours company-wide, not just
    for you
  - Write clean, maintainable code that integrates with our
    existing systems (APIs, databases, third-party services)
    and doesn't break at scale
  - Own your deployments end-to-end: build it, test it, ship it,
    monitor it, and build it well enough that it runs reliably
    without babysitting



  What you'll bring

  - Technical background with real building experience: CS
    degree, bootcamp, self-taught, we don't care as long as
    you've shipped things that work
  - You've built with modern AI tooling (LLMs, AI coding
    assistants, workflow automation) and you're obsessed with
    what's coming next
  - Startup or entrepreneurial DNA: you've either founded
    something, built an internal tool that became critical
    infra, or hacked together solutions that people actually
    used
  - You move fast, communicate clearly, and love collaborating
    with non-technical teams to understand their pain points
    and turn them into elegant, automated solutions
  - Fluency in English, German is a plus
  - Bonus: experience with tools like Make, n8n, Retool,
    Supabase, or similar, but honestly, we care more about
    your ability to learn any tool in a weekend



  What you'll get

  - Build from zero to one. Take ownership of our internal
    tooling landscape, shaping its foundations and direction
    from the ground up.
  - A founder-level mandate. You decide what gets built and how,
    with direct access to the latest LLMs, agent frameworks,
    and AI coding tools.
  - Speed as the standard. Ship in days and weeks, not quarters,
    and see your tools change how the company runs within the
    same month.



  Learn more about blp and our values at
  blp.digital/company/careers.
