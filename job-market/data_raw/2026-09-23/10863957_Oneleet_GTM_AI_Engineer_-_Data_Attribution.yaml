description: |
  About Oneleet

  Oneleet is one of the fastest-growing security and
  compliance platforms in history. We are on a mission to
  change the compliance and security industry by making
  cybersecurity and compliance effective, easy, and painless.
  We provide a platform that helps companies build, manage,
  and monitor their cybersecurity programs and achieve
  compliance standards such as SOC 2 and ISO 27001
  efficiently, without cutting corners.

  Having just raised a $33 million Series A, we are rapidly
  growing in customers and employees. Our team has decades of
  experience in security and compliance. Join our team of
  opinionated rebels and help us build a category-defining
  company reshaping the broken and fragmented compliance and
  cybersecurity industry.

  Who we’re looking for:

  We value passionate self-starters with a growth mindset and
  a bias for action and personal accountability. If you love
  solving hard problems, thrive in ambiguity, and want to make
  a real impact, you’ll fit right in.

  We’re especially drawn to:

  - Rebels with a cause — frustrated with the status quo and
    eager to disrupt it.
  - Opinionated (but not obstinate) builders — decisive yet
    collaborative, who help us move fast.
  - Clear communicators — who own their ideas and follow
    through.

  Our mission is simple: make effective cybersecurity
  painless. We believe cybersecurity should empower, not
  burden. This belief unites our team and drives every
  decision we make.

  If you’re ready to challenge the status quo and help shape
  the future of cybersecurity, we’d love to meet you.

  Who We’re Looking For

  The GTM AI Engineer - Data & Attribution at Oneleet will own
  the data backbone of our go-to-market motion, from first ad
  click to closed-won deal. You’ll work alongside our GTM
  Engineer, and you will have a deep focus on synthesizing
  funnel insights between marketing and sales. You will be
  responsible for gathering, analyzing, interpreting, and
  visualizing all of our marketing and sales data.

  You will build and maintain the pipeline that pulls data
  from HubSpot, Dreamdata, Google Ads, LinkedIn, PostHog, and
  our website into BigQuery as a single, trustworthy source of
  truth. You will be the person who can explain, with
  certainty, why HubSpot says one number and Google Ads says
  another, and which one to believe. You will turn that clean
  data into dashboards executives actually use, and into
  account intelligence that makes our ABM and outbound motions
  sharper.

  You will thrive here if you get genuinely excited building
  motions from scratch, about reconciling conflicting numbers
  across platforms, if you understand browsers and tracking
  well enough to explain why the discrepancy exists, and if
  you’d rather build a pipeline once, correctly, than patch
  the same spreadsheet every week.

  Key Responsibilities:

  - Data gathering & Pipeline Ownership: Design, build, and
    manage our data pipeline in BigQuery, unifying data from
    HubSpot, Dreamdata, Google Ads, LinkedIn, PostHog, and the
    website into one reliable source of truth. Document the
    pipeline so it scales beyond you and survives tool
    changes.
  - Attribution & Tracking: Maintain deep, working knowledge of
    how browsers work, how data is sent, and how cookies,
    JavaScript, and (server-side) GTM are used. Investigate
    and resolve discrepancies between platforms and explain
    why to stakeholders, not just report the gap.
  - Dreamdata & Revenue Attribution: Configure and continuously
    refine Dreamdata to model the full prospect journey,
    anonymous visitor to closed-won. Use Dreamdata to
    determine which channels and campaigns are actually
    generating pipeline. Partner with sales and marketing to
    translate Dreamdata insights into budget and channel
    decisions.
  - Visualization & Reporting: Build and maintain a clear,
    executive-facing dashboard (Looker/Looker Studio) showing
    the performance by channel: spend, leads, meetings,
    pipeline, and closed-won. Ensure dashboards answer “where
    is revenue actually coming from?” at a glance, with the
    ability to drill into any channel or campaign. Keep
    reporting logic consistent with the underlying attribution
    model so numbers don’t silently diverge.
  - ABM with Clay & AI: Design and run an ABM strategy grounded
    in our ICP, using Clay to enrich and score accounts,
    layering in firmographic, intent, and behavioral signals.
    Leverage AI to personalize messaging at scale in a way
    that actually gets replies.

  Requirements:

  General:

  - 5+ years in GTM operations, revenue operations, marketing
    operations, or analytics engineering at a B2B SaaS
    company, with hands-on ownership of marketing/sales data
    infrastructure.
  - Scientific mindset of experimentation, creating and testing
    hypotheses.
  - Love of working on new platforms that help automate and
    enhance channel performance.
  - Knowledge of how to simplify and act on findings.

  Technical:

  - Strong SQL skills and hands-on experience building and
    maintaining pipelines in BigQuery (or a comparable
    warehouse).
  - Experience building GTM relevant Claude skills that scale.
  - Deep understanding of how browsers, cookies, JavaScript, and
    tracking pixels work. Able to diagnose why numbers differ
    across platforms, not just flag that they do.
  - Hands-on experience with Google Tag Manager, including
    server-side GTM and data layer configuration.
  - Experience with Dreamdata or a comparable B2B attribution
    platform (Bizible, HubSpot Attribution, etc.).
  - Hands-on HubSpot experience (CRM, Marketing Hub, Operations
    Hub): workflows, custom objects, data sync.
  - BI tool proficiency (Looker / Looker Studio, Tableau, or
    similar). Building dashboards, not just reading them.
  - Working knowledge of APIs, webhooks, and data integration
    patterns across platforms not designed to talk to each
    other.

  Strategic:

  - Deep understanding of B2B SaaS funnels, buyer journeys, and
    revenue metrics (MQL, SQL, pipeline, win rate, CAC, LTV).
  - Experience designing and implementing UTM strategies and
    multi-touch attribution models.
  - Understanding of ABM fundamentals: ICP definition, account
    scoring, and personalized outbound at scale.
  - Cross-functional communication skills. Able to explain a
    tracking discrepancy to a sales rep and an attribution
    model to a CEO with equal clarity.

  Nice-to-Have

  - Experience at an early-stage startup as the first or only
    data/ops hire.
  - Experience with Clay (workflows, enrichment, AI columns,
    Claygent).
  - Python scripting for data manipulation and automation.
  - Experience with PostHog or similar product analytics tools.
  - Familiarity with reverse ETL tooling and broader data
    warehousing concepts.
  - HubSpot certifications (Revenue Operations, Marketing Hub,
    Operations Hub).
  - Google Ads campaign management and conversion optimization
    experience.

  Why Oneleet?

  At Oneleet, you’ll join a tight-knit team of rebels
  redefining the cybersecurity industry. We move fast, own our
  work, and challenge outdated models to make security
  effortless and effective for companies.

  Here’s what makes us special:

  - We value impact over titles, autonomy over micromanagement,
    and clarity over jargon.
  - You’ll tackle meaningful, hard problems with real-world
    consequences.
  - You’ll work with smart, kind, and ambitious teammates who
    lift each other up.

  Perks & Benefits

  - Comprehensive health & wellness benefits
  - 20 days PTO per year, plus 8 floating holiday
  - Remote work culture
  - Team off-sites in stunning places (Amsterdam, Italy, etc).
  - Competitive compensation & equity

  We hire globally and compensate competitively within each
  market using geographic pay bands. The range for this role
  reflects a US national baseline. Offers for candidates in
  higher cost-of-labor markets (e.g., San Francisco, New York,
  Zurich) may fall at or above the top of the posted range,
  while offers in other markets are benchmarked to local
  standards and are lower. Within any range, individual
  compensation is determined by work location, skills and
  experience demonstrated through the interview process, and
  relevant education or training. This posting reflects base
  salary only and does not include equity or benefits.

  Remote-First & Global Hiring

  We’re a remote-first company and hire globally in regions
  where we can legally engage talent directly or via our
  employer-of-record (EOR) partner. If you’re based outside
  the U.S., we’ll explore the most compliant hiring
  arrangement for your location. We make hiring decisions
  based on merit, skills, and potential regardless of
  location.

  U.S. Hiring & E-Verify

  For U.S.-based candidates, Oneleet participates in E-Verify
