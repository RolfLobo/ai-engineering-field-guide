description: |
  Adaptfy is growing! We are looking for an AI Solution
  Engineer with 1-4 years of experience for a full-time
  position to join our Data & Analytics team in Amsterdam.

  Who we are

  Adaptfy is a turnkey data & analytics solution for the SHV
  family of companies. We support multiple SHV Groups with
  advanced Data & Analytics in all areas, elevating their
  operations in diverse industries across international
  markets and throughout entire value chains. 

  Adaptfy is a joint venture formed by SHV and Metyis. Metyis
  embodies visionary thinking in the digital world, while SHV
  is a globally established family of companies built on the
  values of integrity, trust, curiosity, passion, and
  inclusivity. 

  SHV has a presence across four continents, with businesses
  spanning energy, heavy lifting and transport, animal
  nutrition & aquaculture, testing, inspection &
  certification, and more. The organisation’s history reflects
  its courage to care—for people, for performance, and for
  future generations. Their success is a testament to constant
  reinvention through innovation. 

  At Adaptfy, we play a pivotal role in bringing SHV’s digital
  vision to life. From optimising supply chains across Europe
  to enhancing operational efficiency in South America, we
  connect the dots for SHV, shaping a data-driven future for
  the entire family of companies

  What we offer 

  - A pioneering role in one of the most rapidly evolving
    disciplines in applied AI, with genuine scope to define
    how it is practiced within a large organization.
  - Deep technical immersion across the full AI stack, from data
    foundations and knowledge graphs to agentic systems and
    LLM orchestration.
  - Close collaboration with both central and local data teams,
    as well as business stakeholders, giving you breadth and
    depth of exposure.
  - The chance to build reusable AI assets and infrastructure
    that generate lasting business value at scale.
  - A culture of experimentation, continuous learning, and
    knowledge sharing within a global, diverse team

  What you will do

  - Design, implement, and continuously refine AI solutions and
    products, working across the full lifecycle from
    prototyping to production deployment.
  - Work closely with central and local data teams to define,
    create, and maintain the organization’s context layer,
    optimized for AI use. This includes knowledge graphs,
    ontologies, governance graphs, data lineage frameworks,
    and RAG pipeline architectures.
  - Apply advanced prompt engineering, context engineering,
    memory engineering, and harness engineering techniques to
    maximize the performance and reliability of AI models in
    production.
  - Translate business requirements and operational challenges
    into AI-transformed use cases and workflows, identifying
    where intelligent automation or augmentation can deliver
    the most value.
  - Stay at the forefront of developments in the AI space,
    including the latest models, tools, and frameworks, and
    bring relevant innovations back into the team's practice.
  - Contribute to the design of agentic AI systems and AI
    orchestration architectures, ensuring they are robust,
    scalable, and aligned with enterprise governance
    requirements.
  - Document methodologies, prompt libraries, and context
    engineering standards to build reusable institutional
    knowledge.

  What you will bring

  - 1-4 years of professional experience as a software engineer,
    data scientist, data engineer, or AI engineer.
  - Strong programming skills in at least one modern language
    (Python is a plus, but not required), proficiency with
    Git, and solid software engineering practices.
  - Hands-on experience building LLM-based systems, including
    prompt engineering and at least one orchestration
    framework (e.g., LangChain, LlamaIndex, LangGraph).
  - Solid understanding of Retrieval-Augmented Generation (RAG)
    pipelines and their design considerations.
  - Deep understanding of general data science principles,
    including data quality, lineage, semantics, and
    governance.
  - Strong awareness of the current AI landscape, including
    leading LLMs, multimodal models, agentic frameworks, and
    orchestration tools.
  - Practical experience with knowledge graphs, ontologies, or
    semantic data models is a plus.
  - Ability to combine technical rigor with practical business
    sense, turning real-world challenges into well-designed AI
    workflows.
  - Strong communication skills, with the ability to explain
    complex AI concepts to non-specialist audiences.
  - Fluency in English; additional languages are a plus.
  - Experience in international, consulting, or scale-up
    environments is a plus.

  We are united by our differences

  At Metyis, we are driven by curiosity and collaboration. We
  value diversity, equity, inclusion, and belonging (DEIB) in
  all its forms as it makes us stronger as an organisation and
  promotes creativity and innovation. We welcome all talents
  and are committed to creating a workplace where every
  employee can make a meaningful impact and grow.

  Recruitment Disclaimer

  Metyis only contacts candidates through verified and
  official channels: LinkedIn (official and verified recruiter
  profiles), emails ending in @metyis.com, and our Applicant
  Tracking System (Recruitee). We do not use WhatsApp, social
  media messaging platforms, or personal accounts for
  recruitment outreach. If you receive suspicious
  communication claiming to be from Metyis, please verify the
  sender and report it through our official website.
