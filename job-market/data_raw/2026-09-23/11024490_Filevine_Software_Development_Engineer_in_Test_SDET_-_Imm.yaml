  About the Role

  Filevine's Immigration AI team owns the platform immigration
  practices use to prepare and manage their clients' cases.
  The team is expanding the product to deliver the
  capabilities our customers are asking for, and is building
  out both the engineering foundation and the feature set to
  get there.

  We are looking for a senior-level SDET to own quality across
  this work. The ideal engineer is equally at home driving
  rigorous backend and API testing, validating customer-facing
  applications, and inventing new approaches to test systems
  that resist conventional, UI-driven automation. This is a
  backend-leaning, tooling-heavy role for an engineer who
  wants to solve hard testing problems and raise the quality
  bar for the entire team, not simply execute existing test
  plans.

