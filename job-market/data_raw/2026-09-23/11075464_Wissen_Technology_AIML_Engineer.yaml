  Job Summary:

  We are looking for an AI ML Engineer with strong experience
  in building Generative AI applications and Agentic AI
  solutions. The ideal candidate should be hands-on with
  modern AI technologies and capable of designing, developing,
  and deploying intelligent, scalable AI-driven applications.

  - Experience: 2 - 5 Years
  - Location: Bangalore
  - Mode of Work: Hybrid
  - Education Qualification: MCA/B.E/B.Tech/MTech

  Key Responsibilities & Duties:

  - Design and develop Generative AI applications using LLMs and
    modern AI frameworks.
  - Build Agentic AI solutions involving autonomous agents,
    multi-agent workflows, tool calling, reasoning, and task
    orchestration.
  - Develop and integrate AI capabilities into enterprise
    applications and business workflows.
  - Work with data, APIs, knowledge sources, and enterprise
    systems to build intelligent AI solutions.
  - Design scalable and production-ready AI architectures with
    focus on performance, reliability, and security.
  - Collaborate with product, engineering, and business teams to
    translate use cases into AI solutions.
  - Evaluate AI models and continuously improve accuracy,
    relevance, and performance.

  Skills Preferred:

  - Strong hands-on experience in Generative AI applications.
  - Proven experience building Agentic AI / Agentic Solutions.
  - Good understanding of LLMs, prompt engineering, AI
    application architecture, and AI integrations.
  - Experience developing and deploying production-grade AI
    solutions.

  Good to Have:

  - Natural Language Processing (NLP)
  - Machine Learning
  - Ontology and Knowledge Representation
  - Knowledge Graphs
  - Experience with RAG, vector databases, embedding, and AI-
    powered search.

  Nice to Have:

  - Computer Vision
  - IoT / Connected Systems
  - Forecasting / Predictive Analytics

  Preferred Experience:

  - Experience with Python and AI/ML frameworks.
  - Exposure to LLM platforms, AI APIs, cloud AI services, or
    open-source AI models.
  - Understanding APIs, microservices, databases, and cloud
    platforms.
  - Strong problem-solving and analytical skills with the
    ability to work on complex AI use cases.

