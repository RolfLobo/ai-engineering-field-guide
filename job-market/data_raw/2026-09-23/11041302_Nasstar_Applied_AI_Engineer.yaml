description: |
  As trusted partners of AWS and Databricks, we help
  organisations design, build and scale intelligent systems
  that deliver measurable business outcomes. We lead from the
  front in Generative and Applied AI adoption — guiding
  clients from uncertainty to confident, production-grade
  delivery. This is a key role in our Engineering practice —
  the building work that takes AI from concept to production.
  As an Applied AI Engineer you'll support the design, build
  and deployment of applied AI systems, learning our tools,
  patterns and standards as you grow. The role is remote based
  in UK with the occasional travel to company events.

  Key Responsibilities

  - Delivery & impact: Contribute to defined build tasks within
    a delivery; complete AI features to standard, with support
    from the team.
  - AI & engineering craft: Build fundamentals across the tech
    stack; apply established patterns and follow engineering
    standards under review.
  - Collaboration: Work effectively within the team; participate
    in code reviews and technical discussions to improve
    engineering quality.
  - Growth & capability: Learn actively and grow your
    capability; contribute to internal knowledge sharing as
    you develop.

  Skills, Knowledge and Expertise

  Essential

  - Degree in Computer Science, Data Science, Artificial
    Intelligence, or a related field.
  - Experience developing and deploying machine learning and/or
    generative AI solutions in production environments.
  - Foundations in programming (Python and/or a related
    language) and a genuine eagerness to learn.
  - Understanding of machine learning, predictive analytics, and
    generative AI concepts.
  - Clear communication skills and ability to work effectively
    in a team environment.
  - A collaborative, curious mindset and clear communication.
  - Exposure to GenAI/LLMs, RAG, cloud platforms (AWS and/or
    Databricks), or modern data/ML tooling.

  Benefits

  - Remote-first working with flexibility around client needs.
  - Private health insurance.
  - Opportunity to work on meaningful AI projects across
    multiple industries.
  - A collaborative culture focused on learning, excellence and
    continuous improvement.
  - Competitive salary with clear progression pathways.

  About We are passionate about helping businesses navigate
  the rapidly changing and complex world of emerging
  technologies. We create well-structured, secure, scalable
  solutions at speed to provide the foundation for
  groundbreaking change.
