description: |
  This is a remote position.



  AI Web Developer & Digital Production Specialist



  About Business Financial Group (BFG)



  Business Financial Group (BFG) is a U.S.-based accounting,
  tax, payroll, CFO advisory, IRS resolution, and business
  consulting firm serving business owners across the United
  States. We help growing businesses build stronger financial
  systems through coordinated accounting, tax planning,
  payroll, financial operations, and advisory solutions.








  BFG is building a rapidly expanding digital ecosystem that
  includes its primary business website, industry-specific
  marketing programs, educational academies, partner programs,
  landing pages, educational resources, webinars, assessments,
  and other digital lead-generation initiatives.








  Position Overview



  We are looking for an AI Web Developer & Digital Production
  Specialist who can combine practical web-development skills
  with modern AI-assisted development workflows.








  This is not a traditional WordPress maintenance position.
  The ideal candidate understands how AI tools can accelerate
  website development, page creation, content publishing,
  testing, troubleshooting, and repetitive web-production work
  without compromising quality, security, or technical
  judgment.








  The candidate should be able to take approved content,
  designs, wireframes, business requirements, screenshots, or
  AI-generated prototypes and rapidly convert them into
  professional, secure, responsive, SEO-friendly, production-
  ready web experiences.








  This role will serve as a key technical resource for BFG's
  website and digital-marketing production, with a focus on
  building scalable, AI-assisted systems that support growing
  content and lead-generation needs.








  Key Responsibilities



  - Build and maintain responsive WordPress websites, landing
    pages, industry pages, academy pages, campaign pages, and
    other BFG digital properties.
  - Use AI-assisted development tools to accelerate coding, page
    creation, testing, troubleshooting, and repetitive
    production work while reviewing AI-generated code before
    deployment.
  - Convert approved content, designs, wireframes, screenshots,
    and prototypes into responsive, production-ready webpages.
  - Create reusable templates and components to support blogs,
    landing pages, resources, webinars, forms, CTAs,
    assessments, and other recurring content.
  - Manage WordPress themes, plugins, HTML/CSS/JavaScript
    updates, staging, deployment, security, backups,
    performance, and technical maintenance.
  - Build efficient publishing workflows that support increasing
    content volumes and reduce repetitive manual work.
  - Implement approved technical SEO requirements, including
    metadata, headings, URLs, internal linking, schema,
    redirects, indexing, image optimization, page speed, and
    mobile usability.
  - Build and maintain lead-generation functionality, including
    forms, scheduling, downloads, assessments, webinar
    registrations, and campaign pages.
  - Support integrations with Zoho applications and other
    marketing/business systems.
  - Implement analytics and conversion tracking using Google
    Analytics, Google Tag Manager, Google Search Console, and
    related platforms.
  - Conduct QA before publication to ensure pages are
    responsive, functional, secure, properly tracked, SEO
    compliant, and consistent with approved branding.








  *AI should improve development speed and productivity, but
  it does not replace technical judgment, testing, security,
  quality assurance, or accountability.








  Websites & Digital Properties



  The role may support BFG's primary website, industry
  marketing pages, BFG Academy, Partner Network, tax and
  campaign pages, webinars, downloadable resources, assessment
  funnels, blogs, and other digital properties developed as
  BFG expands.








  Required Qualifications



  - Strong practical WordPress development experience
  - Strong HTML and CSS skills
  - Working knowledge of JavaScript
  - Experience building responsive websites and landing pages
  - Understanding of hosting, staging, deployment, backups, and
    security
  - Understanding of technical SEO implementation
  - Experience using AI-assisted development/coding tools
  - Ability to review, debug, and correct AI-generated code
  - Strong troubleshooting and problem-solving skills
  - Strong attention to detail
  - Ability to manage multiple development tasks and communicate
    progress clearly








  Preferred Qualifications



  Experience with WP Engine, Zoho One/CRM integrations, Google
  Analytics, Google Tag Manager, Google Search Console,
  conversion tracking, schema markup, APIs, Git/GitHub,
  workflow automation, AI coding agents, or high-volume
  content websites is preferred but not mandatory.



  Experience developing websites for financial services,
  education, or other professional-services businesses is also
  beneficial.








  What We're Looking For



  Someone who combines web-development judgment with an AI-
  first production mindset.








  The ideal candidate:



  - Thinks in terms of reusable systems rather than repeatedly
    rebuilding similar pages.
  - Looks for opportunities to automate repetitive development
    and publishing work.
  - Uses AI to work faster without blindly relying on AI-
    generated code.
  - Understands that BFG's websites are lead-generation and
    business-development platforms, not simply informational
    websites.
  - Works quickly while maintaining quality, security, SEO,
    tracking, and responsiveness.
  - Reads and follows requirements carefully.
  - Asks concise questions when requirements are unclear.
  - Communicates progress and delays proactively.
  - Takes ownership of technical problems and works
    collaboratively with marketing, content, and business
    teams.








  BFG values speed with accountability. Fast development
  without communication, testing, or quality control is not
  acceptable.








  Key Performance Indicators



  Performance will be evaluated primarily on:



  - Development speed and on-time delivery
  - Quality, reliability, and responsiveness of completed
    webpages
  - Technical SEO and website-performance implementation
  - Accuracy of analytics and conversion tracking
  - Effective use of AI-assisted development tools
  - Development of reusable templates, components, and workflows
  - Reduction of repetitive manual development work
  - Troubleshooting and problem-solving
  - Attention to detail and reduction of avoidable errors
  - Communication, documentation, and project-status updates
  - Ability to support increasing digital-production volume








  Expected Evolution of the Role



  Initially, the role will focus on BFG's websites, landing
  pages, industry and academy pages, campaign development,
  reusable templates, and AI-assisted production workflows.








  As BFG's digital operation grows, the role will increasingly
  support publishing automation, reusable components,
  technical SEO, website performance, conversion optimization,
  integrations, analytics, and higher content-production
  volumes.








  The person in this role will be expected to help design
  systems that make this scale possible rather than manually
  processing every publishing task.








  Compensation



  ₹8,00,000 – ₹12,00,000 annual CTC, based on experience,
  demonstrated technical capability, AI proficiency,
  development speed, and overall performance during the
  selection process.








  Application Process



  As part of the selection process, shortlisted candidates
  will be required to complete a time-limited practical
  assessment.








  Candidates may receive approved page copy, a BFG content
  brief, branding guidance, and a required CTA or conversion
  objective. They will be asked to create a functional,
  responsive webpage using the development and AI tools of
  their choice and may subsequently be asked to make revisions
  based on feedback.








  The assessment will evaluate development speed, visual and
  technical quality, mobile responsiveness, SEO fundamentals,
  AI utilization, ability to follow requirements, attention to
  detail, and ability to incorporate feedback.








  We are interested in what you can build, not simply which AI
  tools you can list on a resume.








  The underlying expectation for the role is simple: build
  reusable systems, automate what can be automated, and make
  the next 100 pages easier to produce than the first 10.
