title: "Senior Automation Engineer (Python, AI Agents & Automation)"
company: Precisely
location: USA
remote: true
work_type: FULL_TIME
description: |
  At Precisely, we're not just building software — we're
  shaping the future of data integrity. As a global leader in
  data quality, data enrichment, and location intelligence,
  Precisely helps thousands of the world's most trusted brands
  make confident decisions with data they can rely on. We're
  an AI-first organization, which means artificial
  intelligence isn't a buzzword here — it's woven into how we
  build products, how we work, and how we think about solving
  complex problems for our customers. When you join Precisely,
  you join a team of curious, driven innovators who believe
  that better data makes the world run better. If you're ready
  to do meaningful work at the intersection of AI and data —
  and help define what's possible — we'd love for you to
  apply!

  This position is 100% remote anywhere in the US

  Candidates located in the Eastern or Central time zones are
  preferred to support collaboration with global teams.

  Overview: Senior Automation Engineers at Precisely design,
  build, and scale automation that connects tools, systems,
  and teams across globalization and user assistance
  operations. As a senior member of a global team, you work
  closely with engineers, information developers, localization
  specialists, DevOps, and other cross-functional stakeholders
  in an Agile, agentic-first environment. You lead the design
  and evolution of automation frameworks, reduce manual effort
  at scale, improve system reliability, and enable end-to-end
  workflows through API integrations, scripting, CI/CD, and
  AI-enabled automation.

  What you will do:

  - Lead the design and implementation of automation supporting
    workflows across the documentation and software
    development lifecycle, including content creation,
    validation, publishing, UI localization, translation, and
    delivery.
  - Design, build, and operate production-grade agents, skills,
    scripts, and automation pipelines that replace complex,
    manual, and repetitive processes across documentation,
    localization, and language operations.
  - Architect and integrate systems across documentation,
    localization, and content platforms using MCPs and REST
    APIs to enable reliable, scalable, and secure end-to-end
    workflows.
  - Apply AI and LLM-based capabilities to generate, validate,
    transform, enrich, and manage content in alignment with
    approved security, privacy, and compliance standards.
  - Own the reliability, performance, and maintainability of
    automation systems through monitoring, troubleshooting,
    and continuous improvement.
  - Define and contribute to standards, patterns, and reusable
    components that support consistent and scalable automation
    practices.
  - Mentor team members through technical guidance, design
    reviews, and knowledge sharing.
  - Partner cross-functionally to advance automation maturity,
    innovation, and AI-assisted documentation and localization
    workflows.
  - Other duties may be assigned.

  What we are looking for:

  - BA/BS degree in computer science, engineering, information
    systems, or a related field, or equivalent practical
    experience.
  - 5+ years of experience in automation engineering, software
    engineering, or systems integration, preferably supporting
    developer platforms, documentation, localization, or
    content operations.
  - Strong proficiency in Python, with experience building
    maintainable, testable, production-grade automation and
    agent frameworks.
  - Advanced experience with Git-based workflows such as GitHub,
    including pull requests, code reviews, and repository
    automation.
  - Experience with work-tracking and planning tools such as
    Jira, Linear, or similar systems.
  - Strong understanding of CI/CD concepts and tools such as
    GitHub Actions, GitLab CI, Jenkins, or Azure DevOps.
  - Due to collaboration with global teams, flexibility in
    working hours (including late afternoon meetings) will be
    required.

  AI Skills / Knowledge:

  - Strong experience using AI-assisted engineering tools (e.g.,
    GitHub Copilot, Cursor) with awareness of responsible AI
    practices including security, privacy, bias, and
    traceability.
  - Proven ability to design and operate production automation
    using Python and REST APIs.
  - Hands-on experience building and maintaining automation
    pipelines using Git-based CI/CD systems.
  - Demonstrated experience integrating LLMs via APIs to
    automate documentation and language operations.

  Preferred Skills:

  - Experience designing or operating multi-agent or tool-
    orchestrated AI workflows at scale, including coordination
    and failure recovery.
  - Experience owning or evolving shared automation frameworks
    used across multiple products or teams.
  - Familiarity with observability, metrics, and cost tracking
    for AI-driven automation systems.
  - Experience containerizing, deploying, or operating long-
    running automation or agent services in production
    environments.

