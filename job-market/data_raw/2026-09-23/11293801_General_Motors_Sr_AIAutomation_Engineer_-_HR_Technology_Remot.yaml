title: Sr. AI/Automation Engineer -  HR Technology (Remote India - Night Shift)
company: General Motors
location: USA
remote: true
work_type: FULL_TIME
description: |
  Description Work Arrangement: This role is categorized as
  remote (Night Shift - 5 PM to 1.30 AM IST) .This means the
  successful candidate may be based anywhere in the India and
  is occasionally expected to report to a GM worksite as
  directed by the manager. The Role The Automation Integration
  Engineer is a member of the HR Technology team and
  responsible for designing, building, and implementing
  intelligent plugins and automations that enhance our
  enterprise workflows. In this role, you will be responsible
  for executing the HR Automation and AI product roadmap,
  aligning with HR organization goals and helping maximize
  value from investments in Agentic AI platforms with other
  systems like ServiceNow and Workday HCM. The ideal candidate
  has deep technical expertise in integrations, automation,
  and intelligent workflow design. This senior-level role
  requires someone who is not only an exceptional developer
  but also a strong communicator, partner, and project driver
  who can work across business and technology teams, i.e.
  Business COEs, People Services , HR Technology and IT
  stakeholders to implement scalable solutions. What You'll Do

  - Learn the ins-and-outs of the HR AI and Automation Platforms
    like ServiceNow RPA with hands-on training and hands-on
    project delivery tasks.
  - Collaborate closely with key stakeholders across COEs, HR
    and IT to gather and validate requirements.
  - Lead successful implementation of the Automations &
    integrations by working closely with your team as well as
    key stakeholders.
  - Conduct technical analysis and workshops with IT and
    Solution. Architects to design the integrations for these
    AI agents.
  - Conduct technical analysis and workshops with IT and
    Solution Architects to design the integrations for these
    AI agents.
  - Conduct testing, documentation, and deployment of new
    plugins and enhancements.
  - Ensure security, data integrity, and compliance in all
    integration activities.
  - Prepare Solution Design documents for the AI agents and
    their supporting integrations.
  - Analyze platform capabilities and propose creative, scalable
    technical solutions.


   Your Skills and Abilities (Required Qualifications)

  - Bachelors or Masters in Computer Science or similar areas
    from a premier institute.
  - Strong collaboration and communication skills with the
    ability to work effectively across cross-functional teams
    including IT, PM, HR COEs, People Services, business
    users, and other stakeholders. Must be comfortable asking
    the right questions, simplifying complex concepts, and
    driving alignment across teams.
  - Ability and willingness to play the role of a Business
    Analyst, or closely partner with the Project Management
    team, to help bring projects together end to end during
    the implementation lifecycle.
  - 6+ years of work experience on the HR platforms with heavy
    focus on integrations . Integrations can either be in
    context of HCM or HRSD ( Discovery, Service Mapping) for
    example: integrations with other enterprise applications (
    Workday, ServiceNow, Concur etc.).
  - 3+ years of back-end development experience in at least one
    programming language
  - Strong hands-on experience in APIs and integrations
    technologies.
  - Strong analytical and problem-solving skills with attention
    to detail.
  - General understanding of AI technologies and terminologies.


   What Will Give You A Strong Edge (Preferred Qualifications)

  - Certification in Workday HCM configuration or integrations
  - Certification in ServiceNow .
  - Certification in Automation technologies (Automation
    Anywhere, ServiceNow RPA, Knime, UiPath etc).
  - Hands-on experience with cloud platforms ( Azure, AWS, or
    GCP )


