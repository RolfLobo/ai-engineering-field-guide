description: |
  Job Summary & Responsibilities

  We are looking for a Software Engineer to strengthen AI-
  assisted development capabilities for our existing SmarTest
  customer base. SmarTest is Advantest's software platform for
  developing and executing semiconductor test programs on
  Advantest automated test equipment (ATE). It provides the
  development environment and tools engineers use to create,
  debug and maintain semiconductor test programs. The focus of
  this position is the integration, optimization and quality
  improvement of GitHub Copilot and other AI-assisted
  development capabilities within the Eclipse-based SmarTest
  development environment. You will work on SmarTest-specific
  requirements, implement new functionality, resolve
  integration issues and collaborate with internal development
  teams and external technology partners to provide reliable
  and productive AI-assisted development experience for our
  customers.

  Key Responsibilities • Develop and maintain AI-assisted
  development capabilities within the Eclipse-based SmarTest
  environment • Support and improve the integration of GitHub
  Copilot into the SmarTest development workflow • Analyze and
  resolve defects and integration issues related to GitHub
  Copilot and Eclipse • Implement features required for
  SmarTest-specific customer workflows • Improve the quality,
  stability and usability of AI-assisted development
  functionality • Perform integration testing and quality
  assurance for new plugin versions and features • Investigate
  customer requirements and translate them into technical
  solutions • Provide technical assistance for SmarTest-
  specific GitHub Copilot topics • Collaborate with Microsoft
  and internal Advantest development teams on technical topics
  • Evaluate changes in the GitHub Copilot and Eclipse
  ecosystems and their impact on SmarTest • Align external AI
  technology developments with Advantest requirements and
  customer needs • Continuously improve developer productivity
  and user experience through AI-assisted tooling

  What You Will Work On You will help bring modern AI-assisted
  development capabilities to the existing SmarTest customer
  base. The role connects the established Eclipse-based
  SmarTest development environment with rapidly evolving AI
  technologies and ensures that solutions such as GitHub
  Copilot meet SmarTest-specific requirements regarding
  functionality, quality and usability.

  Preferred Qualifications

  - Experience: 3 to 4+ years’ work experience• Bachelor's or
    Master's degree in Computer Science, Software Engineering
    or a related technical field• Strong software development
    skills, preferably with Java• Experience with object-
    oriented software development• Good understanding of
    software integration and plugin-based architectures•
    Experience with Git and modern software development
    workflows• Strong debugging, troubleshooting and problem-
    solving skills• Ability to analyze complex software
    environments and integration issues• Good written and
    spoken English• Ability to collaborate effectively with
    international development teams and external technology
    partners

  Preferred Qualifications • Experience with Eclipse and
  Eclipse Plugin Development • Knowledge of Eclipse RCP, OSGi
  or related technologies • Experience with GitHub Copilot or
  other AI-assisted software development tools • Understanding
  of Large Language Models and AI-assisted development
  workflows • Experience with automated testing and quality
  assurance • Experience working with large-scale development
  environments or developer tooling • Experience of
  collaborating with external software vendors or technology
  partners
