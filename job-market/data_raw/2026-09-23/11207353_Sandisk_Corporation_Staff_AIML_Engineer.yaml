  we have the power to shape.

  Sandisk meets people and businesses at the intersection of
  their aspirations and the moment, enabling them to keep
  moving and pushing possibility forward. We do this through
  the balance of our powerhouse manufacturing capabilities and
  our industry-leading portfolio of products that are
  recognized globally for innovation, performance and quality.

  Sandisk has two facilities recognized by the World Economic
