description: |
  Job Description

  Millions of events. Thousands of users. One platform built
  to turn data into decisions and you could be the one shaping
  it. As an Senior Data Engineer, you will be at the core of
  the SIXT Data Platform, driving automation, AI powered self
  service, and realtime ML capabilities that redefine how a
  global mobility leader operates. Our central Business
  Intelligence team is hands on, curious, and moving fast and
  we are looking for someone ready to architect what comes
  next. If that sounds like you, apply now and join Team
  Orange!

  YOUR ROLE AT SIXT

  - You lead, explore, and implement the latest AWS and big data
    technologies to uncover hidden opportunities, enable new
    capabilities, and build integrations for the SIXT Data
    Shop
  - You partner with Data Engineers, BI Analysts, and Data
    Scientists to architect optimal solutions for diverse
    analytical use cases, including dashboarding, ad hoc
    analytics, data-as-a-product, and machine learning
  - You contribute to the Data Platform vision and roadmap
    through your expertise, innovative ideas, and intellectual
    curiosity
  - You design and implement multi-agent workflows that automate
    end-to-end data operations from ingestion and
    transformation to quality validation and distribution
    defining clear specs, acceptance criteria, and quality
    gates so agents execute reliably with minimal human
    intervention
  - You drive the adoption of LLM-augmented data capabilities
    within the SIXT Data Shop, including RAG pipelines,
    semantic search over the Data Catalogue, and AI-assisted
    self-service experiences for internal consumers

  YOUR SKILLS MATTER

  - Education You hold a B.Tech, B.E., or Master's Degree in
    Computer Science or a similar discipline
  - Experience You bring at least 7+ years of professional
    experience as a Senior Data Engineer with a strong track
    record in hybrid Data Lake and Data Warehouse
    architectures, including end-to-end automation of data
    models from source systems to analytical dashboards using
    ELT methodologies
  - Tools & Systems You have deep expertise with analytical
    cloud data warehouses (Redshift, Snowflake), data
    transformation using dbt, and orchestrating interdependent
    workflows with Apache Airflow
  - AI & Agentic Skills You have hands-on experience with AI
    coding assistants and agentic workflow automation,
    including leveraging LLMs with contextual data, designing
    RAG systems, and orchestrating LLM-driven agents across
    coding, validation, and data quality stages with
    structured quality gates. Experience with vector and/or
    graph databases is a strong plus
  - Engineering Best Practices You have a strong foundation in
    agile methodologies, code reviews, source control
    (GitHub), CI/CD pipelines (Jenkins), testing, and
    operations, paired with a deep understanding of data
    management fundamentals, distributed systems, and data
    storage and compute principles
  - Technical Proficiency You have advanced proficiency in
    Python and SQL

  WHAT WE OFFER

  - Grow Further, Go Further Advance your skills and unlock your
    potential with our Education Assistance Program
  - Balance Your Career Benefit from a hybrid work environment
    complemented by flexible working hours
  - Fuel Your Day Great work deserves great fuel. Enjoy meal
    benefits that keep you energized and ready to bring your
    A-game
  - Your Wellness Matters We're committed to your well-being
    through comprehensive insurance, wellness programs, health
    checkups, and fitness benefits
  - Recognition That Counts We create a culture of appreciation,
    rewarding your impact through referral incentives and
    loyalty perks as you advance with us
  - Growing Families, Growing Joy As your family grows, we're
    here to celebrate with a special newborn gift for your
    little one

  Additional Information

  About us:

  We are a globally leading mobility service provider with a
  revenue of €4.00 billion and around 9,000 employees
  worldwide. Our mobility platform ONE combines our products
  SIXT rent (car rental), SIXT share (car sharing), SIXT ride
  (taxi, ride, and chauffeur services), and SIXT+ (car
  subscription), giving our customers access to our fleet of
  350,000 vehicles, the services of 4,000 cooperation
  partners, and around 5 million drivers worldwide. Together
  with our franchise partners, we are present in more than 110
  countries at 2,000 rental stations. At SIXT, top-tier
  customer experience and outstanding customer service are our
  highest priorities. We believe in true entrepreneurship and
  long-term stability and align our corporate strategy with
  foresight. Get started with us and apply now!
