title: Senior AI Engineer (f/m/d)
company: Integral Services GmbH
location: Berlin, DEU
work_type: FULL_TIME
company_size: 50 Employees
description: |
  Mission

  Founded in 2024 by Lukas Zörner and Anil Can Baykal,
  Integral set out to redefine how accounting, taxation and
  payroll works for SMEs in Europe, starting with Germany. The
  company is backed by General Catalyst, Cherry Ventures,
  Puzzle Ventures and entrepreneurs across Europe. As Senior
  AI Engineer, you will build intelligent, reliable AI systems
  that help SMEs navigate financial and tax operations. Own
  outcomes, not just output, balancing speed and
  craftsmanship. This role follows a hybrid schedule in our
  Berlin office to collaborate effectively with the team.

  Core responsibilities

  What you'll do

  - Build and deploy AI agents that automate accounting,
    payroll, and tax workflows
  - Develop LLM-based systems using modern frameworks and prompt
    engineering with quality control
  - Integrate AI capabilities with existing systems and APIs
  - Optimize performance, cost, and reliability of AI features

  What makes it special

  - High ownership: you'll shape what we build and how we build
    it
  - Tight feedback loops with domain experts and customers
  - Pragmatic pace: ship, learn, iterate, without sacrificing
    quality

  Your profile

  Your Experience & Mindset

  - You have 5+ years experience in Software Engineering and AI
  - You've worked in early-stage startups or scale-ups where you
    had to wear multiple hats (coding, testing, UI,
    integrations)
  - Hands-on experience building with LLMs (OpenAI, Anthropic,
    or similar): APIs, prompt engineering, structured outputs,
    agent frameworks (LangChain, LangGraph, or similar)
  - You actively use AI coding tools like Cursor, Codex, or
    Claude in your daily workflow — and you can talk about how
    and why
  - Experience with RESTful APIs, cloud services, and testing/QA
    for AI systems
  - You're comfortable with ambiguity and high ownership: you'll
    manage multiple projects simultaneously and organize your
    own delivery

  Preferred experience

  - You came from software engineering and have deliberately
    moved into AI
  - Strong Python skills: you can actually code, not just prompt

  The process

  We like to move fast, and with the right candidate, the
  entire process can be completed in less than two weeks.

  - Intro Call with our Talent Team
  - Deep dive Interview with our CTO & co-founder
  - On-site Coding Interview at our Berlin office with the
    engineering team
  - Founder Conversation with our CEO & co-founder

  Our offer

  - Above-market salary
  - Direct line to the Founders: no filter, no queue, no
    committee
  - Total autonomy on what you build; we measure hours saved
  - The best tools, no questions asked: Claude Max, Cursor,
    OpenAI, whatever ships next week
  - Internal tools and resources purpose-built to support
    agentic AI development at scale, read about how we work at
    engineering.integral.de
  - 28 vacation days per year, plus half-days on December 24 and
    31
  - Either Urban Sports Club membership, coupons via Hrmony or
    Deutschlandticket, your choice
  - Laptop of your choice: MacBook Pro or Windows
  - Company pension scheme (bAV)
  - Modern office in the heart of Berlin Mitte, right next to
    Mauerpark
  - Weekly team lunches on us, office BBQs, and a dinner budget
    for late nights after 8pm
  - A team of 50+ (and growing!) ambitious, diverse people, 20%+
    ex-founders learning and building together
  - The opportunity of a decade to build a category-defining AI-
    native services leader

  We value diversity and hire people based on their abilities
  and capabilities to succeed in this role. We welcome people
  of every background, gender, gender identity, sexual
  orientation, religion, age, disability status, political
  belief or marital status.
