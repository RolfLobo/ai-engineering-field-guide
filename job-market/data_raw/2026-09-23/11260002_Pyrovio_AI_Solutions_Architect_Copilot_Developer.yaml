description: |
  AI Solutions Architect / Copilot Developer

  Human-centered problem-solving meets Microsoft AI technology

  Role Overview

  We're looking for someone who thinks like a strategist,
  debates like a philosopher, and builds like an engineer.
  This role sits inside our AI Solutions Group, where the
  individual will need to reason clearly about ambiguous
  problems, build consensus among stakeholders, and translate
  that thinking into working solutions on the Microsoft Power
  Platform.

  You'll partner directly with clients to figure out where AI
  can provide tangible improvements, gather and interpret
  requirements (even when clients aren't sure what they need),
  build solutions using Power Platform tools, help test and
  validate what you've built, and keep it optimized over time.
  This role is about people, logic, and persuasion as much as
  it is about implementation.

  Why This Role Is Different

  We believe the core skills for working effectively with AI
  aren't primarily technical. They're:

  - Creative problem solving: finding non-obvious paths through
    ambiguous, messy, or "less than optimal" situations

  - Strategic thinking: seeing the whole system, not just the
    ticket in front of you

  - Logic and structured reasoning: the same discipline that
    makes a good philosopher makes a good prompt engineer and
    a good solution architect

  - Communication and diplomacy: building consensus among
    stakeholders with competing priorities, teaching non-
    technical teams, and handholding through change

  If you have a background in philosophy, strategy consulting,
  teaching, mediation, debate, logic, systems thinking, or
  similar disciplines, and you're excited by AI tools, we want
  to talk to you, even if your technical resume looks
  nontraditional.

  What You'll Actually Do

  With Clients

  - Act as a trusted advisor: ask the right questions, challenge
    assumptions, and help clients articulate problems they
    haven't fully defined yet

  - Build consensus across stakeholders with different,
    sometimes conflicting, priorities. This is often the
    hardest part of the job

  - Teach and support end users through change, including
    patient handholding for less AI-fluent teams

  - Translate business problems into technical requirements, and
    technical constraints back into plain language

  Building the Solution

  - Design and develop solutions in Power Automate, Microsoft
    Copilot Studio, and related Power Platform tools

  - When necessary, integrate adaptive cards, connectors,
    triggers, and APIs to extend functionality

  - Craft effective prompts and grounding strategies for
    Copilot, Claude, and related AI tools. This is applied
    logic and language craft as much as coding

  - Build and prototype using Copilot-related AI tools for
    development and automation, always within strict data-
    control guardrails

  - Where possible, apply this same workflow to working with
    Anthropic’s Claude

  Keeping It Working

  - Participate in testing, validation, and quality assurance

  - Support ongoing maintenance, troubleshooting, and
    enhancement of deployed solutions

  - Document decisions and create user guides that make adoption
    easier, not harder

  - Escalate and resolve issues, mentoring teammates along the
    way

  Staying Sharp

  - Continuously evaluate new AI tools and platforms, with a
    healthy respect for compliance, governance, and data
    protection in a regulated environment

  - Bring an "AI mindset": curious, experimental, but never
    careless with sensitive data

  What We're Looking For

  Core (non-negotiable) skills:

  - Strong critical thinking and structured reasoning: you can
    break down a fuzzy problem into a clear plan

  - Excellent written and verbal communication, including the
    ability to present to and persuade skeptical or non-
    technical audiences

  - Diplomacy and consensus-building, with comfort navigating
    disagreement without avoiding it

  - A genuine curiosity about AI and a track record of picking
    up new tools quickly

  - Comfort improvising solutions to non-technical problems,
    including political, organizational, or human friction,
    not just code bugs

  Technical qualifications:

  - Bachelor's degree or real-world experience equivalent, any
    field, with philosophy, humanities, and social sciences
    welcome, and 3+ years of relevant professional experience

  - Hands-on experience (or strong aptitude to quickly gain it)
    with Microsoft Power Platform (Power Apps, Power Automate,
    Dataverse) and Copilot Studio

  - Familiarity with modern AI tools, especially Microsoft
    Copilot and Claude, including prompt engineering and LLM
    behavior

  - Ability to work within a regulated environment with strict
    data controls, balancing experimentation against
    compliance

  Preferred:

  - Background in strategy consulting, teaching, philosophy,
    logic, mediation/facilitation, or debate

  - Understanding of Microsoft Graph API, REST APIs, and system
    integrations

  - Experience with RAG-based architectures

  - Certifications in Power Platform, AI, or Copilot-related
    specialties

  - Experience with Agile/Scrum delivery

  Work Environment

  - Location: United States, Eastern Time Zone

  - Travel: None required

  - Schedule: Remote-first, asynchronous-friendly, with some
    real-time overlap for meetings and collaboration

  The Bigger Picture

  This is a strategic development role on a high-performing
  team helping organizations reimagine how they work with AI,
  using Microsoft Power Platform, Copilot, Claude, and beyond.
  The technology moves fast, and we have a need for people who
  can think clearly, communicate persuasively, and navigate
  ambiguity with grace. If that's you, let’s talk.

  Pyrovio Perks and Benefits:

  - Competitive Compensation

  - Comprehensive Benefits - Medical, Retirement, Holidays, PTO
    etc.

  - Ability to carve your own career path and gain deep
    professional expertise by working with multiple clients
    and engagements and oversee the implementation of your
    recommendations

  - Opportunity to develop and advance within a growing
    organization

  Additional Information:

  - For more information, please visit our website at
    www.pyrovio.com

