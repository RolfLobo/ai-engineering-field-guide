description: |
  About the team

  We’re the company’s internal AI & Data team — a small, fast-
  moving pod. Our mission is to make the rest of the company
  dramatically more capable, using AI and Data to automate
  work, unlock insight, and build the tools and systems teams
  rely on.

  This role is the versatile builder who turns all of that
  into working software — and who can pick up whatever the
  moment demands.

  The role

  You’re a builder, full stop. You’ll work on many things —
  internal tools, services, interfaces, integrations,
  automation. You’ll move fluidly between them as priorities
  shift. This is deliberately a broad, flexible seat: we’re
  not hiring for one stack or one problem, we’re hiring
  someone who can build whatever the company needs next and do
  it well.

  AI is a tool in your kit, not the thing you specialize in.
  You don’t need to design retrieval systems or agents from
  scratch — but you’re comfortable working with them, wiring
  them into products, and shipping the software around them.
  Your superpower is range and reliability: you take things
  from idea to shipped, across the stack, without needing a
  narrow lane.

