  impact, encourage innovation, and support your growth.

  Job Description:

  We are looking for a technically strong AI Engineer / Full
  Stack Developer with 7–10 years of hands-on experience in
  building enterprise-grade applications using .NET Core, C#,
  Angular, Azure, and modern Generative AI technologies.

  The ideal candidate will have strong expertise in full-stack
  application development along with practical experience
  building AI-powered applications, chatbots, AI agents,
  search solutions, and Retrieval-Augmented Generation (RAG)
  pipelines. The role requires a strong understanding of
  application architecture, cloud-native development,
  microservices, APIs, and scalable enterprise solutions.

  You will work closely with the UI Architect, Product Owner,
  Scrum Master, and cross-functional engineering teams to
  design, develop, deploy, and support secure and scalable
  applications on Azure.

  Requirements

  Responsibilities:

  • Collaborate with the UI Architect, Product Owner, and
  Scrum Master to develop front-end applications.

  • Build features like chatbots, AI agents, and search tools
  using models like GPT, Claude

  •Set up Retrieval-Augmented Generation (RAG) pipelines,
  manage context windows, and connect models to external tools
  or databases.

  • Perform hands-on development of high-quality code using
  .NET Core, Angular, and cloud-native services.

  • Identify performance bottlenecks and bugs, and devise
  solutions to mitigate and resolve them.

  • Understand the existing application architecture and
  enterprise solution design.

  • Design and prototype secure, scalable applications and
  services on Azure cloud.

  • Develop frameworks, reusable components, and core platform
  functionality that accelerate engineering teams.

  • Design and develop microservices, APIs, and serverless
  components.

  • Integrate external web and Windows services.

  • Design, develop, deploy, and support applications hosted
  on Azure Cloud.

  • Be an active member of the Agile team and participate in
  all Agile ceremonies.

  Technical Skills:

  • 7-10 years of hands-on experience in full-stack
  application development.

  • Strong working knowledge of the .NET framework, including
  ASP.NET Core 2.0 and above, as well as experience with the
  .NET Full Framework.

  • Proficiency in C# with a solid understanding of its
  ecosystem.

  • Strong working knowledge of Angular 12+.

  • Familiarity with vector databases (like Pinecone or
  Milvus) and embedding models.

  • Hands-on experience using Angular Material/Kendo UI
  (Telerik) controls.

  • Experience working with SQL Server.

  • Experience working with Azure Cloud services such as App
  Services, Azure SQL, and Storage Accounts.

  • Ability to write unit tests using common testing
  frameworks.

  • Strong aptitude for writing clean, readable, and
  maintainable code.

  • Highly Agile-oriented mindset.
