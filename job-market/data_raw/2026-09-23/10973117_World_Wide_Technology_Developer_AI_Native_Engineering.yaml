description: |
  Job Summary & Responsibilities

  Skills Required

  - 5+ years of professional software development experience,
    ideally across multiple technology stacks and
    environments.
    - Proficiency with JavaScript, Node.js and frameworks such as
      Vue.js.
    - Experience with SQL and NoSQL databases (Postgres, MongoDB)
  - Demonstrated experience evaluating, adopting, or integrating
    AI‑related development tools, frameworks, or workflows.
  - Strong understanding of modern engineering practices,
    including DevOps, CI/CD, automated testing, and
    cloud‑native architectures.
  - Ability to research, compare, and operationalize new tools
    or methodologies with minimal oversight.
  - Excellent written documentation skills, with the ability to
    translate technical concepts into clear guidance for broad
    audiences.
  - Experience building training materials, tutorials, or
    enablement content.
  - Strong communication skills for interacting with senior
    leaders, including C‑suite executives, and
    cross‑functional engineering teams.
  - Ability to design and deliver proofs of concept, reference
    implementations, and technical demonstrations.
  - Strong problem‑solving abilities with a pattern‑driven,
    analytical approach to evaluating tools and engineering
    processes.
  - Self‑starter mindset with the ability to lead initiatives
    and collaborate within a Center of Excellence model.
  - Experience developing technical training content ranging
    from higher-level overviews to deep-dive technical
    material, including written documentation, technical
    demonstrations. Creation of short-form videos for on-
    demand access is a plus.
  - Demonstrated experience creating and delivering PowerPoint
    presentations in live sessions, from one-on-one coaching
    through larger audiences.

