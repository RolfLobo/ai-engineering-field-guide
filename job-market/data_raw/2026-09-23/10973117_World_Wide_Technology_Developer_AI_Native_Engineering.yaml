  Preferred Qualifications

  World Wide Technology (WWT) strives to make a new world
  happen. WWT's work benefits clients and partners as much as
  it does its people and community across the globe.

  Founded in 1990, WWT brings together strategy, deep
  technical expertise and world-class partnerships to help
  public and private sector organizations design, build and
  scale intelligent AI, digital, cybersecurity, cloud and
  infrastructure solutions. Through its Advanced Technology
  Center (ATC)—a collaborative ecosystem featuring state-of-
  the-art hardware and software—WWT enables clients and
  partners to conceptualize, test and validate innovative
  technology and then deploy solutions at scale using its
  global integration and distribution capabilities.

  With more than 14,000 team members and over 60 locations
  globally, WWT's culture—grounded in core values and
  leadership philosophies—has been recognized by Fortune® and
  Great Place to Work for its commitment to innovation, trust
  and creating a great place to work for all. WWT provides
  products and services to large enterprise, global service
  provider and public sector clients in up to 130 countries
  across six continents. Softchoice, a World Wide Technology
  company, supports commercial and SMB markets in the U.S. and
  Canada.

  Want to work with highly motivated individuals on high-
  performance teams? Join WWT today!

  What is the Internal WWT IT Team, and why join? 

  The Internal WWT IT team is the backbone of our company’s
  technological infrastructure, ensuring seamless operations
  and continuous innovation. Our team is dedicated to managing
  and supporting the company’s technology infrastructure,
  ensuring the smooth operation of hardware, software,
  networks, and data systems, while providing top-notch
  technical support to employees.

  By joining the Internal WWT IT team, you will play a crucial
  role in maintaining the efficiency and security of our IT
  environment, enabling the company to achieve its strategic
  goals. The Internal IT team offers the opportunity to work
  in a dynamic and collaborative environment, where your
  contributions will have a direct impact on the company's
  success. If you are passionate about technology and eager to
  take on new challenges, we encourage you to apply and join
  our team.

  What will you be doing?

  World Wide Technology (WWT) is seeking an experienced
  Developer to join our newly formed AI Native Engineering
  team within IT. This team is chartered with driving the
  research, development, and adoption of AI native tooling,
  processes, and engineering practices across the enterprise.
  This role carries high visibility across IT and WWT,
  including regular interaction with C‑level executives as we
  define the next generation of AI‑enabled delivery.

  As part of the IT Software Engineering Center of Excellence
  (CoE), this role will help establish foundational standards,
  enablement frameworks, and reference architectures that
  accelerate the way teams across WWT build with AI. We are
  looking for individuals who are innovative, deeply curious,
  and passionate about crafting scalable, human‑centered
  engineering solutions.

  Key Responsibilities

  AI Training and Enablement

  A defining element of this role is hands-on delivery of AI
  training across the IT organization. Successful candidates
  will bring a strong passion for creating and delivering
  training content, and will be energized by helping
  colleagues at every level build practical AI skills.

  - Personally deliver AI training initiatives for team members
    across the entire IT organization.
  - Develop technical AI training content ranging from higher-
    level overviews to deep-dive technical material, including
    written documentation, technical demonstrations and short-
    form videos for on-demand access.
  - Create and deliver PowerPoint presentations in live
    sessions, from one-on-one coaching through audiences of 25
    or more.
  - Facilitate engaging sessions and adapt content and pacing to
    varying levels of technical fluency.
  - Present status updates on training initiatives and outcomes
    to senior leadership.

  AI Tooling & Platform Innovation

  - Research, evaluate, and prototype emerging AI‑native
    engineering tools and platforms to identify high‑value
    opportunities for adoption.
  - Conduct comparative analyses and generate recommendations
    that improve engineering velocity, quality, and developer
    experience.
  - Partner with engineering teams to integrate approved tools
    into workflows and ensure smooth onboarding and
    operationalization.

  AI‑Enhanced Process & Workflow Design

  - Define, refine, and optimize AI‑augmented engineering
    workflows, delivery patterns, and automation strategies.
  - Identify opportunities to streamline development processes
    using AI‑driven approaches, improving consistency and
    reducing manual effort.
  - Collaborate with cross‑functional teams to pilot and scale
    new patterns across the enterprise.

  Documentation, Training & Engineering Enablement

  - Develop high‑quality documentation, guidance, and reference
    materials that codify best practices for AI‑native
    engineering.
  - Create training content, step‑by‑step tutorials, and
    enablement assets that help teams confidently adopt new
    tools and standards.
  - Partner with internal enablement groups to publish and
    socialize new materials across the organization.

  Research, Change Management & Communication

  - Monitor AI and development tooling ecosystems, track
    updates, and translate technical changes into concise,
    actionable insights.
  - Communicate key updates, release notes, and impact
    assessments through newsletters, internal briefings, or
    stakeholder updates.
  - Support organizational change efforts by identifying
    adoption barriers and recommending approaches to drive
    alignment and engagement.

  Proof‑of‑Concept Development & Reference Architectures

  - Lead the design and development of proofs of concept (PoCs)
    that demonstrate practical applications of AI‑native
    engineering.
  - Build and maintain reference architectures and reusable
    frameworks that accelerate enterprise adoption.
  - Collaborate with product and engineering teams to transition
    PoCs into scalable, production‑ready patterns.

  Community Support & Feedback Loop Creation

  - Host recurring open office hours to support engineers
    adopting new tools and workflows.
  - Troubleshoot issues, offer tailored guidance, and provide
    recommendations based on real‑world feedback.
  - Gather insights from teams to inform future standards,
    tooling strategy, and enablement priorities.
