description: |
  Overview

  Overview

  Microsoft AI is looking for a Software Engineer AI Infra to
  help build the SOTA LLM models. We’re looking for someone
  who will bring an abundance of positive energy, empathy, and
  kindness to the team every day, in addition to being highly
  effective. The right candidate enjoys building world-class
  consumer experiences and products in a fast-paced
  environment. You will actively contribute to the development
  of AI models that are powering our innovative products. You
  will wear multiple hats and work on engineering, research,
  and everything in between. Your contributions will span
  model architecture, data curation, training and inference
  infrastructures, evaluation protocols, alignment and
  reinforcement learning from human feedback (RLHF), and many
  other exciting topics at the cutting edge of AI.

  Microsoft AI

  Microsoft AI team’s mission is to empower every person and
  every organization on the planet to achieve more. As
  employees we come together with a growth mindset, innovate
  to empower others, and collaborate to realize our shared
  goals. Each day we build on our values of respect,
  integrity, and accountability to create a culture of
  inclusion where everyone can thrive at work and beyond. This
  role is part of Microsoft created to push the boundaries of
  AI toward Humanist Superintelligence—ultra-capable systems
  that remain controllable, safety-aligned, and anchored to
  human values. Our mission is to create AI that amplifies
  human potential while ensuring humanity remains firmly in
  control. We aim to deliver breakthroughs that benefit
  society—advancing science, education, and global well-being.
  We’re also fortunate to partner with incredible product
  teams giving our models the chance to reach billions of
  users and create immense positive impact. If you’re a
  brilliant, highly-ambitious and low ego individual, you’ll
  fit right in—come and join us as we work on our next
  generation of models! 

  Starting January 26, 2026, MAI employees are expected to
  work from a designated Microsoft office at least four days a
  week if they live within 50 miles (U.S.) or 25 miles
  (non-U.S., country-specific) of that location. This
  expectation is subject to local law and may vary
  by jurisdiction.

  Responsibilities

  - Develop software systems for pre-training, post-training
    infra, such as benchmarking systems, evaluation, router,
    backend systems.

  - Gather data and insights to develop the
    pretraining compute roadmap.

  - Actively contribute to the development of AI models that are
    powering our innovative products.

  - Find a path to get things done despite roadblocks to get
    your work into the hands of users quickly and iteratively.

  - Enjoy working in a fast-paced, design-driven, product
    development cycle.

  - Embody our Culture and Values.

  Qualifications

  Required qualifications

  - Bachelor's Degree in Computer Science or related technical
    field AND 2+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR equivalent experience.

  Preferred qualifications

  - Master's Degree in Computer Science or related technical
    field AND 3+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python OR Bachelor's Degree in
    Computer Science or related technical field AND 5+ years
    technical engineering experience with coding in languages
    including, but not limited to, C, C++, C#, Java,
    JavaScript, or Python
    - OR equivalent experience.
  - Experience with generative AI.
  - Experience with distributed computing.
  - Experience in leading technical projects and supporting
    architectural decisions with data.



