description: |
  About Us

  Seismic is the Go-To-Market Performance company, driving how
  organizations turn their strategy into revenue. Seismic
  brings together signals from customer conversations, buyer
  engagement, governed content, coaching and seller behavior
  to turn intelligence into winning action. Through its AI
  revenue execution platform, the company equips customer-
  facing teams with the insights, governance, and contextual
  guidance they need to execute with confidence and deliver
  measurable business outcomes. Trusted by 2,500 organizations
  and over 3.5 million users around the globe, Seismic is
  headquartered in San Diego with offices across North
  America, Europe and Asia-Pacific. Learn more at seismic.com.

  Seismic is committed to building an inclusive workplace that
  ignites growth for our employees and creates a culture of
  belonging that allows all employees to be seen and valued
  for who they are. Learn more about DEI at Seismic here.

  Overview

  Join us at Seismic, a cutting-edge technology company
  leading the way in the SaaS industry. We specialize in
  delivering modern, scalable, and multi-cloud solutions that
  empower businesses to succeed in today's digital era.
  Leveraging the latest advancements in technology, including
  Generative AI, we are committed to driving innovation and
  transforming the way businesses operate. As we embark on an
  exciting journey of growth and expansion, we are seeking top
  engineering talent to join our AI team in Hyderabad, India.

  Seismic AI:

  AI is one of the fastest growing product areas in Seismic.
  We believe that AI, particularly Generative AI, will empower
  and transform how Enterprise sales and marketing
  organizations operate and interact with customers. Seismic
  Aura, our leading AI engine, is powering this change in the
  sales enablement space and is being infused across the
  Seismic enablement cloud. Our focus is to leverage AI across
  the Seismic platform to make our customers more productive
  and efficient in their day-to-day tasks, and to drive more
  successful sales outcomes.

  Who you are:

  - Experience: 6+ years of experience in software engineering
    and a proven track record of building and scaling
    microservices and working with data retrieval systems.

  - Technical Expertise:

  - 5+ Experience with C# and .NET, unit testing, object-
    oriented programming, and web services.
  - Full Stack experience is a plus.

  - 3+ Experience with Python, with the ability to work
    concurrently on Python and .NET repositories.

  - 3+ Experience with Redis, including expertise in managing
    large-scale Redis clusters

  - 2+ Experience with PostgreSQL, including maintaining and
    performing tuning

  - Proficient in Test Driven Development (TDD) with hands-on
    experience using xUnit and Postman to develop automation
    test scripts."

  - Experience with Infrastructure as Code (Terraform, Pulumi,
    etc.),

  - Experience with Event driven architectures with tools like
    Kafka,

  - Experienced in container technologies such as Docker and
    proficient in microservice frameworks like Kubernetes
    (K8s)

  - Experienced in Continuous Integration and Continuous
    Deployment (CI/CD) with expertise in developing Jenkins
    pipelines using Scala.

  - Experience with DDD (Domain driven development) or feature
    toggle (Launch Darkly) is good to have.

  - NewRelic, Snowflake, Ansible, Ninjia2 experience is a plus

  - Front-end/full stack experience a plus.

  - Cloud Expertise: Experience with cloud platforms like AWS,
    Google Cloud Platform (GCP), or Microsoft Azure. Knowledge
    of cloud-native services for AI/ML, data storage, and
    processing. Experience deploying containerized
    applications into Kubernetes is a plus.

  - Good to have: Search/retrieval/AI: Prefer expertise in
    search platforms like ElasticSearch, Apache Solr, or
    similar. Experience with Natural Language Processing
    (NLP), semantic search and understanding of text
    processing techniques is a plus.

  - SaaS Knowledge: Extensive experience in SaaS application
    development and cloud technologies, with a deep
    understanding of modern distributed system and cloud
    operational infrastructure.

  - Product Development: Experience in collaborating with
    product management and design, with the ability to
    translate business requirements into technical solutions
    that drive successful delivery.  Proven record of driving
    feature development from concept to launch.

  - Proven ability to collaborate effectively with teams across
    different regions.

  - Ability to collaborate effectively with the China team and
    adapt to the China timezone is essential

  - Scrum and JIRA experience a plus

  - Education: Bachelor's or Master's degree in Computer
    Science, Engineering, or a related field.

  - Fast-paced Environment: Experience working in a fast-paced,
    dynamic environment, preferably in a SaaS or technology-
    driven company.

  What you'll be doing:

  As a Senior Software Engineer I for our Aura Agentic
  Interfaces team, you will play a crucial role in developing
  and optimizing backend systems that power our content
  discovery and AI-driven search capabilities. While your core
  expertise lies in building robust, high-performance backend
  systems, you will also own the integration and frontend
  delivery of these features, ensuring a seamless user
  experience. You will collaborate with cross-functional teams
  to design, build, and maintain scalable, high-performance
  systems that deliver exceptional value to our customers.
  This position offers a unique opportunity to make a
  significant impact on our company's growth and success by
  contributing to the technical excellence and innovation of
  our search solutions.

  Key Responsibilities:

  - Full Stack Development & Ownership: Design, develop, and
    maintain scalable backend services for search
    functionality while leading the implementation of
    intuitive, high-performance frontend components to surface
    search results.
  - Distributed Systems Development: Design, develop, and
    maintain backend systems and services for search
    functionality, ensuring high performance, scalability, and
    reliability.
  - Search & Algorithm Optimization: Implement and optimize
    search and AI-driven semantic algorithms, indexing, and
    information retrieval techniques to enhance search
    accuracy and efficiency.
  - Integration: Collaborate with data scientists, AI engineers,
    and product teams to integrate AI-driven search
    capabilities across the Seismic platform.
  - Performance Tuning: Monitor and optimize search performance,
    addressing bottlenecks and ensuring low-latency query
    responses.
  - Technical Leadership: Provide technical guidance and
    mentorship to junior engineers, promoting best practices
    in search backend development.
  - Collaboration: Work closely with cross-functional and
    geographically distributed teams, including product
    managers, frontend engineers, and UX designers, to deliver
    seamless and intuitive search experiences.
  - Continuous Improvement: Stay updated with the latest trends
    and advancements in search technologies, conducting
    research and experimentation to drive innovation.

