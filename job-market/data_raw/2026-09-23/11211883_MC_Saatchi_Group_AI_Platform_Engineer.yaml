description: |
  We’re looking for an AI Platform Engineer to design, build
  and operate the technical foundations underpinning M+C
  Saatchi Group’s AI capability (MICA) as it scales globally.

  This role sits at the core of our AI ecosystem - responsible
  for the platforms, integrations, automation and engineering
  standards that enable AI to operate securely, reliably and
  at scale. Reporting to the Global Head of Enterprise
  Infrastructure & Architecture, and working in close
  partnership with the AI Operations and Adoption Manager, you
  will translate operational requirements into robust,
  production-ready solutions.

  As a key member of the IT function, you will work closely
  with Information Security, Data teams and business
  stakeholders to ensure AI services are engineered to
  enterprise standards and integrated into the Group’s broader
  technology landscape.

  Based in London, with a hybrid working pattern, the role
  operates across a global network of teams.

  ABOUT THE ROLE

  As MICA scales across the Group, we require a dedicated
  engineering capability to build and run the AI platform
  layer that enables it.

  This is a hands-on engineering role focused on platform
  delivery, integration, agentic automation and optimisation.
  It is distinct from AI strategy and adoption - instead
  focused on how AI capabilities are technically delivered,
  governed and scaled in a fast-paced production environment.

  Working in close partnership with the AI Operations and
  Adoption Manager, you will jointly form the core delivery
  engine for AI across the Group - ensuring operational
  requirements are translated into scalable, reliable platform
  capabilities.

  Success in this role will look like:

  - A secure, scalable AI platform architecture integrated into
    enterprise systems
  - Seamless onboarding and lifecycle management of approved AI
    tools
  - Reliable, well-monitored AI services with clear performance
    and cost controls
  - Automated operational processes enabling scale and
    consistency
  - A well-governed technical environment aligned to AI policies
    and frameworks
  - Strong alignment between platform engineering and AI
    operations delivery

  WHAT YOU'LL DO:

  - Design, build and operate the core enterprise AI platform
    infrastructure supporting MICA including AI applications,
    agents, and automation solutions leveraging approved
    platforms and frameworks
  - Translate operational, governance and adoption requirements
    into scalable, reusable platform capabilities
  - Review and assure AI solutions against architecture,
    security, operational, and governance standards before
    production deployment
  - Engineer and maintain integrations with approved AI tools,
    ensuring consistent access, authentication, monitoring and
    usage tracking with secure and governed access to
    organisational knowledge and information
  - Partner closely with the AI Operations and Adoption Manager
    to enable onboarding, rollout and lifecycle management of
    AI services
  - Implement platform-level controls to enforce AI governance,
    including access management, auditability and data
    protection
  - Develop automation for provisioning, configuration,
    monitoring and optimisation of AI environments
  - Monitor platform performance, usage and cost, driving
    continuous optimisation
  - Support incident management, troubleshooting and root cause
    analysis
  - Collaborate with vendors and internal IT teams to deliver
    platform enhancements and resolve dependencies
  - Contribute to the evolution of AI platform standards,
    architecture and engineering practices across the Group

  ABOUT YOU

  You are a hands-on, solutions-oriented platform engineer who
  thrives in building scalable, production-grade systems.

  You are comfortable translating complex operational needs
  into practical engineering solutions, and enjoy working
  across technical and business teams to deliver real-world
  outcomes.

  WHAT YOU'L BRING: (experience and qualifications):

  - Proven experience as a Platform, Cloud or DevOps Engineer in
    a complex environment
  - Strong experience with cloud platforms (Azure, AWS or GCP)
  - Experience designing and managing APIs, integrations or
    event-driven architectures
  - Familiarity with AI/ML platforms, GenAI tools or emerging AI
    ecosystems
  - Experience with infrastructure as code and automation
    tooling
  - Understanding of security, compliance and governance in
    enterprise systems
  - Experience implementing monitoring, logging and
    observability
  - Ability to translate business or operational requirements
    into technical solutions
  - Ability to assess capability of AI tools from a technical
    perspective and translate that into business fit and usage
    opportunities

  Additional desirable experience:

  - Experience supporting AI-enabled platforms or products
  - Familiarity with agent-based workflows, orchestration tools
    or automation frameworks
  - Exposure to data platforms, pipelines or analytics
    ecosystems
  - Experience working in environments with strong governance or
    regulatory requirements

  WHAT YOU’LL GET

  - A critical role in building the AI platform capability of a
    global organisation
  - Direct partnership with AI Operations and Adoption
    leadership shaping how AI is delivered at scale
  - Exposure to enterprise architecture, emerging AI
    technologies and transformation initiatives
  - The opportunity to define and scale AI platform engineering
    as a core capability
  - A collaborative and entrepreneurial working environment
  - Competitive salary and benefits
  - Flexible, hybrid working

  For the right candidate, we will offer a competitive salary
  and benefits package which includes 27 days annual holiday,
  private healthcare, employer contributory pension, life
  assurance and income protection. We also offer a host of
  benefits that support wellbeing including subsidised gym
  membership, whilst our commitment to Diversity and Inclusion
  sees us offer learning opportunities around D&I, mentoring
  programmes and the opportunity for all to participate in a
  number of active Employee Led Networks and associated
  events. Finally, this role will be supported with all the
  necessary personal development required to set someone up
  for success.

  APPLICATIONS CLOSE: Monday, 28th September 2026.

  We will review candidates on a rolling-basis and reserve the
  right to close the job early should we receive a high volume
  of applications - early application is therefore encouraged.

  ABOUT M+C SAATCHI GROUP

  M+C Saatchi Group is a creative solutions company that
  connects specialist expertise, fuelled by data, technology,
  and culture, to help clients navigate, create, and lead
  meaningful change. The Group operates across five core
  divisions: Connected Creativity; Passion Marketing; Global &
  Social Issues; Brand, Experience & Innovation; and
  Performance Media. Headquartered in London, operations span
  23 countries with major hubs in the UK, Europe, US, Middle
  East & Africa, Asia and Australia. M+C Saatchi Group’s two
  principles, Diversity of Thought and Brutal Simplicity of
  Thought, guide how they build teams and solve problems.

  M+C Saatchi Group is an Equal Opportunity Employer which
  does not discriminate, celebrates diversity and bases all
  hiring and promotion decisions solely on talent and
  capability, without regard for any personal characteristics.

  All employee information is kept confidential according to
  General Data Protection Regulation (GDPR).

