  Your Career

  NewRocket is a global team made up of ServiceNow
  professionals who help our customers run and grow their
  ServiceNow environments.  Founded with the insight that
  technology has the power to make people’s lives better and
  recognized as one of the world’s most innovative companies,
  ServiceNow provides a platform that makes workflows work.
  We are hiring for a ServiceNow Lead Engineer , to join our
  award-winning Customer team!

  - As a ServiceNow Lead Engineer - Power BI + AI you will be
    primarily developing and delivering data analytics,
    reporting, and AI-driven solutions leveraging ServiceNow
    data and enterprise platforms.
  - Collaborate with stakeholders to identify business
    requirements and translate them into actionable
    dashboards, reports, and AI-powered insights.
  - Design and optimize data models, integrations, and reporting
    frameworks to support business intelligence initiatives.
  - Interact with technical SMEs to gather data requirements and
    develop scalable analytics and AI solutions.

  Your Experience

  - Experience as a ServiceNow Lead Engineer in ServiceNow.
  - Comprehension of, and the ability to communicate and
    implement business intelligence and analytics solutions.
  - Ability to develop interactive dashboards, visualizations,
    and user-focused reporting solutions using Power BI.
  - Experience developing integrations with ServiceNow and
    external systems using REST APIs and data connectors.
  - Strong understanding of enterprise data architecture, data
    modeling, ETL processes, and data governance.Experience
    working with Power BI, including DAX, Power Query, data
    modeling, and report optimization.
  - Experience implementing AI and Generative AI solutions,
    including predictive analytics, intelligent automation,
    and AI-driven insights.
  - Ability to design and develop data pipelines connecting
    ServiceNow, enterprise applications, and reporting
    platforms.
  - Experience leveraging Azure AI, OpenAI, Copilot, or similar
    AI technologies for business use cases.
  - Knowledge of data integration, transformation, and
    visualization best practices.
  - Proficient in SQL and working with relational and non-
    relational data sources.
  - Experience building and maintaining enterprise-level
    reporting and analytics solutions across multiple
    environments.
  - Ability to define and implement data quality, governance,
    and security standards.
  - Experience in advanced analytics, forecasting, trend
    analysis, and dashboard performance optimization.



