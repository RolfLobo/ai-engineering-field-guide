title: Sr. Full Stack Engineer - NextJS, AWS, AI
company: Perficient
location: USA
remote: true
work_type: FULL_TIME
description: |
  We are seeking a Senior Full Stack AI Engineer to join a
  strategic engagement to help design, build, and support
  next-generation AI-powered applications. This is a hands-on
  role requiring expertise across Next.js, TypeScript, .NET,
  Python, AWS, and Kubernetes, with a strong focus on
  developing scalable, cloud-native solutions that leverage
  modern AI capabilities.

  The ideal candidate is an engineer first, with a passion for
  building across the full technology stack while applying AI
  to solve real business problems. You will work closely with
  architects, product teams, and client stakeholders to
  develop intelligent applications, integrate AI services and
  large language models, and deliver high-quality user
  experiences. In addition to new development, you will
  support and enhance existing applications, ensuring
  reliability, performance, and operational excellence in
  production environments.

  This role is ideal for someone who thrives in fast-paced
  consulting environments, enjoys solving complex technical
  challenges, and is excited about applying Generative AI,
  intelligent automation, and AI-assisted engineering
  practices to accelerate innovation and business value.

  Perficient is always looking for the best and brightest
  talent and we need you! We’re a quickly-growing, global
  digital consulting leader, and we’re transforming the
  world’s largest enterprises and biggest brands. You’ll work
  with the latest technologies, expand your skills, and become
  a part of our global community of talented, diverse, and
  knowledgeable colleagues.





  Responsibilities

  - Participate in technical planning & requirements gathering
    phases including Design, code, test, troubleshoot, and
    document engineering software applications.
  - Design, develop, and maintain full-stack applications using
    Next.js, TypeScript, .NET, and Python.
  - Build and integrate AI-enabled capabilities, including
    Generative AI, LLM-powered experiences, intelligent
    assistants, chat interfaces, and workflow automation.
  - Develop scalable frontend experiences using modern React and
    Next.js frameworks.
  - Design and implement backend services, APIs, integrations,
    and microservices.
  - Architect and deploy cloud-native solutions using AWS and
    Kubernetes.
  - Collaborate with architects, product owners, and client
    stakeholders to translate business requirements into
    technical solutions.
  - Integrate enterprise applications with AI platforms, data
    services, and third-party systems.
  - Participate in application architecture, solution design,
    and technical decision-making.
  - Perform code reviews and contribute to engineering standards
    and best practices.
  - Troubleshoot and resolve complex application and production
    issues.
  - Establish monitoring, observability, and operational
    readiness best practices.
  - Leverage AI-assisted development tools to improve
    engineering productivity and solution quality.
  - Contribute to Agile delivery teams and support successful
    project execution.
  - Ensuring that technical software development process is
    followed on the project, familiar with industry best
    practices for software development.
  - Mentor junior engineers and promote engineering excellence
    across the team.

  Qualifications

  - 7+ years of experience in full-stack software engineering.
  - Strong hands-on experience with Next.js, React, and
    TypeScript.
  - Strong backend development experience with .NET/C# and
    Python.
  - Experience designing and building RESTful APIs,
    microservices, and distributed systems.
  - Hands-on experience developing AI-enabled applications using
    Generative AI technologies and large language models.
  - Experience with OpenAI, Azure OpenAI, Amazon Bedrock,
    Anthropic Claude, LangChain, LangGraph, or similar AI
    platforms.
  - Experience building RAG (Retrieval-Augmented Generation)
    solutions.
  - Experience with vector databases and semantic search
    technologies.
  - Strong experience with AWS cloud services and cloud-native
    development.
  - Experience deploying and supporting applications using
    Kubernetes and containerized architectures.
  - Knowledge of modern software engineering practices including
    CI/CD, automated testing, source control, and DevOps.
  - Bachelor’s Degree in MIS, Computer Science, Math,
    Engineering or comparable major.
  - Strong consulting and communication skills. Ability to work
    effectively with various organizations in pursuit of
    problem solutions.





