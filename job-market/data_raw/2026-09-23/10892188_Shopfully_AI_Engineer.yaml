description: |
  We are the platform turning browsing into shopping. We
  connect 200 million shoppers with deals they love while
  boosting local sales for hundreds of top retailers and
  brands.

  We help consumers save time and money while making smart
  shopping decisions, and we support retailers and brands in
  engaging customers from online research to in-store
  purchases.

  In 2024, Shopfully joined forces with the North American
  company Flipp, creating a global leader in the sector.
  Together, we reach 400 million households and serve over
  1,000 top retailers and brands across 27 markets, including
  Europe, Canada, the USA, Latin America, and Australia.

  Ready to spark your growth with us?

  WHO WE LOOK FOR 🦄

  At Shopfully+Flipp, we’re quickly evolving how we organize
  and work, and we are opening a few positions for people who
  are going to be at the forefront of this change. At the
  center of this transformation is AI, which we are
  integrating deeply into our company. Not because it is
  trendy, but because we truly believe it’s a force multiplier
  for the people who work here.

  Aside from AI, what is changing is the way teams are
  organised: you’ll be working in nimble, talent-dense teams
  supporting the company both on the product side, as well as
  in the adoption and integration of AI tools and shaping our
  platform.

  WHAT YOU WILL DO 🏄

  You will work in the team that is on the frontline of this
  transformation and you’ll contribute to shaping our strategy
  and platform moving forward.  You’ll also support other
  company areas acting like a forward deployed engineer,
  embedded into both product teams as well as other functional
  areas like finance, sales and marketing to introduce agentic
  methodologies in their processes and bringing back what you
  learn into our platform.

  WHAT YOU WILL NEED 🪄

  - Growth mindset. More than your current skills and knowledge,
    your true asset is adaptability. The things you don’t
    know, you are not scared to learn. The things you know,
    they don’t hold you back.
  - Team players. You give not because anyone is keeping score,
    but because you understand a team moves forward when its
    members push each other forward. You build trust and get
    things done across the board.
  - Adaptability. You stay effective under ambiguity and
    pressure. We don’t look for any specific hard skills, but
    we want to build a small team with a heterogeneous
    background: whether you come from software engineering,
    data (engineering or science), or machine learning
    engineering, please do apply if the challenges of this
    position excite you!
  - A product mindset: you care about user impact and business
    value, not just the elegance of the code.
  - A track record of shipping quality code and delivering
    features that hold up in production.
  - Fluent English: you’ll be working in a global, distributed
    environment.

  👉 At our company, we value diversity and actively encourage
  it — we believe a variety of perspectives and backgrounds
  makes us stronger. We focus on potential rather than on
  having a “perfect” CV. If this role excites you and you
  believe you could grow into it — even if you don’t tick
  every single box in the requirements — we’d love to hear
  from you!

  SALARY RANGE ⚖️ : €50,000 – €80,000 fixed gross salary per
  year. Budget is flexible for high-impact candidates who
  exceed requirements!

  LOCATION 🌐

  While we have offices all around the world, you can benefit
  from our flexible hybrid model, empowering you to work where
  you're most effective in Europe.

  Full-remote available from Europe.

  WHAT YOU WILL FIND AT SHOPFULLY 🤗

  🌎 An opportunity to thrive in a rapidly scaling
  multinational company

  🕶️ A vibrant, informal, and inclusive work environment

  🧠 We champion autonomy, flexibility, and a hybrid work
  model, empowering you to own your work

  📚 Access to learning opportunities and regular feedback
  sessions

  🍓 Enjoy our central, modern offices featuring fresh snacks,
  coffee (including vegan options!), and ergonomic setups

  🎉 Engage in meaningful team events: offsites, happy hours,
  company parties and celebrations that unite us beyond daily
  tasks

  💻We provide all the necessary equipment for you to work
  effectively and set up your workspace, wherever you are

  🧰 Benefit from additional country-specific advantages based
  on local contracts and practices

  WHO WE ARE 💜

  We’re a team of 450 people (and counting!), from 30
  different nationalities. We’re on a mission to innovate, and
  we believe the key to that is seeing the world through a
  variety of perspectives. That’s why building a more diverse
  team, as well as bringing in even more talent, is so
  important for us.

  TO FEEL AT HOME 🛋️ IN SHOPFULLY YOU NEED 🎯

  - Progress Over Perfection: We move forward. Always. In a
    fast-moving world, speed with purpose beats certainty
    without action. Momentum matters—not for its own sake, but
    because it drives results.

  - Clarity Through Transparency: We bring each other along. We
    work in teams, not silos. Transparency gives context, and
    context enables action. That means we share decisions
    early, publish work in progress, and document outcomes so
    others can learn, move faster, and build better.

  - Learn Loudly: We grow by doing and by daring. Big bets
    unlock big breakthroughs. But real innovation demands
    risk, and risk always carries the possibility of failure.
    That’s not a flaw. It’s the price of ambition.

  - Challenge with Empathy: We speak up, even when it’s
    hard—because candor shows care, and leads to better
    outcomes. Listening deeply is how we grow. Disagreeing
    openly is how we build trust.

  Always Build Better: We are builders—of products, systems,
  and ideas. But more than that, we are builders of better.
  Better has no finish line. It’s a mindset.

  If you choose to apply for this specific job position and
  submit your application, which may include personal data
  such as your identifying details, contact information,
  curriculum vitae, cover letter, professional qualifications,
  and/or employment history, please be informed that your data
  may be shared with our Affiliates*, including Offerista
  Group GmbH and Flipp Operations Inc. The aforementioned
  entities will act as joint controllers for the limited
  purpose of intra-group sharing related to the evaluation of
  candidates’ applications. This means that your data may be
  processed by the Affiliate to assess your application and,
  if deemed suitable, to contact you regarding potential
  employment opportunities. However, please note that from the
  moment an Affiliate initiates direct contact with you and
  engages in any further processing of your personal data
  beyond the initial intra-group sharing for evaluation
  purposes, such Affiliate shall act as an independent data
  controller. In such cases, the processing of your personal
  data will be subject to the specific privacy policies that
  can be found here.

  * Affiliates shall mean any entity that directly or
  indirectly controls, is controlled by or is under common
  control with ShopFully SpA and its Affiliates’ subsidiaries,
  meaning any entity which is directly or indirectly
  controlled by the Affiliates.
