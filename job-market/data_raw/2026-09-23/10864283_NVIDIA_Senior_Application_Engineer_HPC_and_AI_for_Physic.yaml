title: Senior Application Engineer, HPC and AI for Physics
company: NVIDIA
location: USA
remote: true
work_type: FULL_TIME
description: |
  We are building the software infrastructure for the next era
  of scientific discovery. At NVIDIA, we believe AI will
  transform how new physics for plasmas, lasers, and materials
  at extreme conditions are discovered. We are developing
  software tools to make it possible! We are looking for a
  Senior Application Engineer who is passionate about HPC+AI
  for numerical simulations, and physics translating complex
  research into software that scientists use for real
  discovery. You will work across research, engineering and
  product teams. You will translate learnings from research
  collaborations into feedback to engineering on toolkits and
  libraries for accelerated super-resolution imaging, high
  energy density, plasma, and material physics.

  What you’ll be doing:

  - Develop workflows for experimental processing/analysis and
    numerical simulations with applications in imaging
    science, plasma and high energy physics, and material
    science
  - Profile the application and run benchmarks to identify
    bottlenecks and suggestion recommendations to
    collaborators and product teams
  - Build examples or sample applications for tutorials
  - Represent NVIDIA at leading scientific conferences,
    workshops, and industry events.

  What we need to see:

  - BS, MS, or PhD in computational, theoretical and/or
    experimental physics, applied mathematics, computer
    science or equivalent experience.
  - 5+ years building HPC, AI or machine learning software for
    applications in physics and numerical simulations.
  - Strong experience with GPU-accelerated computing and modern
    ML frameworks.
  - Strong communication skills across technical and non-
    technical audiences.

  Ways to stand out from the crowd:

  - High-impact publications in HPC and AI for numerical
    simulations, plasma physics and imaging science.
  - Deep understanding of numerical simulations such as
    particle-in-cell
  - Experience with CUDA, parallel programming, or performance-
    focused software development.
  - Familiarity with agentic AI workflows for science and
    discovery.

  We work on problems that matter, and with teams that highly
  value technical excellence. This role offers the chance to
  construct a software stack for physics algorithms, numerical
  simulations, data processing/analysis that is supported by
  advanced computing. You will help craft tools that support
  researchers, partners, and developers across the ecosystem.
  It is an opportunity to build technology that can accelerate
  discovery at global scale!

  #LI-Hybrid

  Your base salary will be determined based on your location,
  experience, and the pay of employees in similar positions.
  The base salary range is 140,000 USD - 224,250 USD for Level
  3, and 168,000 USD - 270,250 USD for Level 4.

  You will also be eligible for equity and benefits.

  Applications for this job will be accepted at least until
  August 29, 2026.

