description: |
  Role Purpose

  The AI Engineer will help manage the organization's AI
  technology estate end-to-end — from platform administration
  and licensing through to usage monitoring, cost control, and
  governance. This is a highly technical, operationally-
  focused role suited to someone who enjoys managing
  infrastructure and data-driven reporting, ensuring the
  business gets maximum value and control from its AI tools
  while keeping usage secure, compliant, and cost-effective.

  Key Responsibilities

  - Administer the organization's AI platforms and tools (e.g.,
    Claude, ChatGPT Enterprise, Microsoft Copilot, or
    equivalent), including user provisioning, seat/license
    management, and access controls.

  - Manage the full lifecycle of AI licensing: seat allocation
    across teams, and right-sizing licenses (e.g., Standard
    vs. Premium seats) based on actual usage patterns.

  - Monitor and report on AI usage and spend across the
    organization, building dashboards and regular reports for
    leadership on adoption, cost, ROI, and utilization trends.

  - Set and manage spend limits, usage policies, and cost
    controls at the organizational and user level to prevent
    budget overruns.

  - Configure and maintain integrations, connectors, and admin
    settings (SSO, SCIM, audit logs, data retention policies)
    across AI platforms.

  - Act as the internal point of contact for AI platform
    troubleshooting, access issues, and vendor support
    escalations.

  - Maintain an accurate inventory (the "AI estate") of all AI
    tools, licenses, connectors, and integrations in use
    across the business, including shadow IT discovery where
    relevant.

  - Evaluate new AI tools, features, and licensing models as
    they become available, and make recommendations on
    adoption or consolidation.

  - Ensure AI tool usage aligns with the organization's
    security, data governance, and compliance requirements.

  Required Skills & Experience

  - 3+ years of experience in IT administration,
    systems/platform management, or a similar technical
    operations role.

  - Hands-on experience managing SaaS platform administration
    (user provisioning, licensing, SSO/SCIM configuration) —
    experience with AI platforms (Anthropic Claude,
    OpenAI/ChatGPT Enterprise, Microsoft Copilot, Google
    Gemini, etc.) strongly preferred.

  - Strong analytical skills, with experience building
    usage/cost reports and dashboards (Excel, Power BI, or
    similar).

  - Familiarity with API-based usage billing models and cost
    management practices.

  - Understanding of enterprise IT governance concepts: SSO,
    audit logs, data retention, access controls.

  - Excellent communication skills, with the ability to
    translate technical usage data into business-relevant
    insights for non-technical stakeholders.

  - Experience working with vendor account management/support
    teams for renewals, escalations, and contract queries.

  - A proactive, detail-oriented approach to license
    optimization and cost control.

  Preferred / Nice to Have

  - Prior experience specifically administering an enterprise AI
    platform (e.g., Claude for Enterprise, Microsoft Copilot,
    OpenAI Enterprise).

  - Basic scripting/data skills (Python, SQL) for usage data
    analysis and automated reporting.

  - Exposure to IT asset management (ITAM) or software asset
    management (SAM) practices.

  - Relevant certifications (ITIL, cloud platform
    certifications, or vendor-specific admin certifications).

  Qualifications

  - Bachelor's degree in Computer Science, Information
    Technology, or a related field (or equivalent practical
    experience).

