description: |
  POSITION OVERVIEW

  MCI is one of the fastest-growing tech-enabled business
  services companies in the USA, with a strong call center
  footprint and operations that extend across multiple
  countries. We deliver Customer Experience (CX), Business
  Process Outsourcing (BPO), and Anything-as-a-Service (XaaS)
  cloud technology solutions across a wide range of
  industries, including healthcare, retail, government,
  education, telecom, technology e-commerce, and financial
  services. Our contact centers are powered by both on-site
  and remote agents, leveraging advanced technologies to
  enhance customer journeys, drive scalability and reduce
  costs.

  At MCI we are committed to fostering an environment where
  professionals can build meaningful careers, access
  continuous learning and development opportunities and
  contribute to the success of a globally expanding, industry-
  leading organization.

  We are seeking a Senior AI Prompt Engineer to design,
  optimize, and manage prompts that maximize the effectiveness
  of Large Language Models and AI-powered applications. This
  role is responsible for improving AI response quality,
  consistency, accuracy, and business relevance across a wide
  range of use cases.

  The successful candidate will work closely with AI
  engineers, product managers, trainers, and business
  stakeholders to develop scalable prompting solutions that
  drive measurable business outcomes.

  To be considered for this role, you must complete a full
  application on our company careers page, including all
  screening questions and a brief pre-employment test.

  POSITION RESPONSIBILITIES

  Key Responsibilities:

  Prompt Design & Development

  - Create and maintain prompts that enhance AI system
    performance.
  - Design prompts for conversational AI, automation, and
    business applications.
  - Develop reusable prompt templates and libraries.
  - Optimize prompt structures for different use cases and
    models.
  - Support enterprise AI product development initiatives.

  Prompt Testing & Optimization

  - Improve response quality through experimentation and
    analysis.
  - Conduct prompt testing and A/B evaluations.
  - Analyze AI outputs and identify optimization opportunities.
  - Improve accuracy, consistency, and user experience.
  - Support model tuning and evaluation activities.

  AI Performance Evaluation

  - Measure and monitor AI effectiveness across multiple
    applications.
  - Develop evaluation criteria and quality standards.
  - Review AI responses against business requirements.
  - Track prompt performance and improvement metrics.
  - Provide recommendations for ongoing enhancements.

  Collaboration & Stakeholder Support

  - Work closely with technical and business teams.
  - Collaborate with AI engineers, trainers, and product
    managers.
  - Translate business requirements into prompting strategies.
  - Support AI solution design and implementation efforts.
  - Communicate findings and recommendations to stakeholders.

  Research & Continuous Improvement

  - Drive innovation within prompt engineering practices.
  - Stay current with developments in Generative AI and LLMs.
  - Evaluate new prompting techniques and methodologies.
  - Contribute to prompt engineering best practices.
  - Support AI innovation and experimentation initiatives.

  CANDIDATE QUALIFICATIONS

  WONDER IF YOU ARE A GOOD FIT FOR THIS POSITION?

  All positive, and driven applicants are encouraged to apply.
  The Ideal candidates for this position are highly motivated
  and dedicated and should possess the below qualities:

  - Bachelor's Degree in Computer Science, Artificial
    Intelligence, Linguistics, Communications, Information
    Systems, Business, or a related field.
  - Minimum 5 years of experience in AI, software development,
    content strategy, research, analytics, or a related
    discipline.
  - Minimum 2 years of hands-on experience working with
    Generative AI technologies.
  - Experience designing, testing, and optimizing prompts for
    Large Language Models.
  - Strong understanding of AI model behavior and prompt
    engineering principles.
  - Excellent written communication and language analysis
    skills.
  - Strong analytical and problem-solving abilities.
  - Experience evaluating AI outputs and identifying improvement
    opportunities.
  - Ability to manage multiple projects and priorities
    effectively.
  - Strong stakeholder engagement and collaboration skills.
  - Experience documenting standards, methodologies, and best
    practices.
  - Ability to work effectively in fast-paced and evolving
    environments.

  Nice to Have

  - Experience with OpenAI, Anthropic, Gemini, Claude, or
    similar AI platforms.
  - Experience with Retrieval-Augmented Generation (RAG)
    solutions.
  - Knowledge of AI agents and workflow automation technologies.
  - Familiarity with AI evaluation frameworks and testing
    methodologies.
  - Experience with conversational AI and chatbot development.
  - Understanding of AI governance and responsible AI
    principles.
  - Experience working within SaaS, technology, or BPO
    environments.
  - Advanced certifications or training related to AI and
    Generative AI.

  PHYSICAL REQUIREMENTS

  This job operates in a professional office environment.
  While performing the duties of this job, the employee will
  be largely sedentary and will be required to sit/stand for
  long periods while using a computer and telephone headset.
  The employee will be regularly required to operate a
  computer and other office equipment, including a phone,
  copier, and printer. The employee may occasionally be
  required to move about the office to accomplish tasks; reach
  in any direction; raise or lower objects, move objects from
  place to place, hold onto objects, and move or exert force
  up to forty (40) pounds.

  CONDITIONS OF EMPLOYMENT

  All MCI Locations

  - Must be authorized to work in the country where the job is
    based.

  Subject to the program and location of the position

  - Must be willing to submit up to a LEVEL II background and/or
    security investigation with a fingerprint.  Job offers are
    contingent on background/security investigation results.
  - Must be willing to submit to drug screening.  Job offers are
    contingent on drug screening results. (Does not apply in
    Canada)

