description: |
  Through proprietary software and AI, along with a focus on
  customer delight, Sleek makes the back-office easy for micro
  SMEs.

  We give Entrepreneurs time back to focus on what they love
  doing - growing their business and being with customers.
  With a surging number of Entrepreneurs globally, we are
  innovating in a highly lucrative space.

  We operate across 3 business segments:

  Corporate Secretary: Automating the company incorporation,
  secretarial, filing, Nominee Director, mailroom and
  immigration processes via custom online robots and
  SleekSign. We are the market leaders in Singapore with ~5%
  market share of all new business incorporations

  Accounting & Bookkeeping: Redefining what it means to do
  Accounting, Bookkeeping, Tax and Payroll thanks to our
  proprietary SleekBooks ledger, AI tools and exceptional
  customer service

  FinTech payments: Overcoming a key challenge for
  Entrepreneurs by offering digital banking services to new
  businesses

  Sleek launched in 2017 and now has around 17,500 customers
  across our offices in Singapore, Hong Kong, Australia and
  the UK. We have around 600 staff with an intact startup
  mindset. We have recently raised Series B financing off the
  back of >70% compound annual growth in Revenue over the last
  5 years. Sleek has been recognised by The Financial Times,
  The Straits Times, Forbes and LinkedIn as one of the fastest
  growing companies in Asia. Backed by world-class investors,
  we are on track to be one of the few cash flow positive,
  tech-enabled unicorns based out of Asia Pacific.

  Requirements

  Mission of the role

  As an AI Solutions Engineer, you will be one of Sleek's most
  senior individual contributors, responsible for turning AI
  and automation opportunities into deployed, measurable
  business capabilities across our Accounting, Corporate
  Secretarial, Compliance, Sales, Marketing, HR and Finance
  teams.

  This is a highly hands-on role. You will take ambiguous,
  manual business processes from discovery and specification
  through coding, deployment, monitoring, support and eventual
  handover to the business team.

  You will work closely with non-technical subject-matter
  experts and senior leadership to identify high-value
  opportunities, build practical AI solutions, and prove that
  they deliver measurable business value.

  The role requires someone who is equally comfortable writing
  production code, talking to a business stakeholder,
  challenging assumptions, and demonstrating why an automation
  is worth building.

  You will also take ownership of existing automations and be
  expected to independently diagnose and resolve technical
  issues rather than relying on external technical support.

  Key outcomes in the first 6–12 months

  Outcome 1: Deliver Production AI Automations

  Lead and deliver at least 3 end-to-end business automations
  within the first 6 months, taking each initiative from
  identifying the problem through discovery, specification,
  development, deployment and production support.

  Build against real business systems and data, including LLM
  APIs and SDKs, databases and warehouses, accounting APIs,
  Slack, document-generation workflows and scheduled jobs.

  Take ownership of stabilising and improving existing
  automations where required, ensuring they are reliable,
  maintainable and supported by Sleek-owned infrastructure.

  Outcome 2: Generate Measurable Business Value

  Target SGD $100,000+ in annualized value across 12 months,
  setting clear baselines and ROI metrics before building.

  Measure success holistically through cost savings, capacity
  released, faster turnarounds, error reduction, or revenue
  enablement.

  Track usage, costs, and adoption from day one, regularly
  auditing the portfolio to scale winning solutions or stop
  low-impact builds.

  Outcome 3: Build and Hand Over Sustainable Solutions

  Design low-code/config-driven interfaces that allow non-
  technical teams to safely operate and update daily
  workflows.

  Provide documentation, safeguards, and power-user training
  for daily ops, keeping core code and infrastructure
  maintained under technical scope.

  Build on Sleek-owned credentials with documented fallbacks,
  clear rollback procedures, and no reliance on personal
  accounts or single-point failures.

  Outcome 4: Become a Trusted AI Partner Across the Business

  Build strong relationships with stakeholders across
  Accounting, Corporate Secretarial, Compliance, Sales,
  Marketing, HR and Finance across Sleek's four markets.

  Independently conduct discovery with subject-matter experts,
  turn ambiguous requirements into practical specifications
  and challenge assumptions using actual business volumes and
  data.

  Identify opportunities proactively rather than waiting for
  fully defined projects, and communicate technical concepts
  and solutions clearly to non-technical colleagues and senior
  leadership.

  Must-have experience

  - Production Software Engineering: 10+ years of professional
    technology/industry experience, including at least 4+
    years of hands-on software development/coding experience.
    Proven experience independently building, deploying,
    monitoring, debugging and supporting production software.
  - Python: Strong hands-on Python development experience is
    essential, with the ability to independently diagnose and
    resolve technical issues in production.
  - Production AI/LLM Systems: Proven experience building and
    deploying LLM-based systems into production for real
    users. This must go beyond prompt experimentation or using
    AI chat tools.
  - Agentic Development Tools: Hands-on and current experience
    using agentic coding tools such as Claude Code, Cursor,
    Replit, Codex or similar tools. These should be tools the
    candidate actively uses rather than tools they are
    planning to learn.
  - AI Automation: Demonstrable experience building AI-powered
    automations, agents, workflows or applications that solve
    real business problems.
  - Data & Systems: Comfortable working with SQL, data
    warehouses, third-party APIs, file and document formats,
    and integrations between different business systems.
  - End-to-End Ownership: Proven experience building a system or
    significant application from scratch and taking
    responsibility for it through production, rather than only
    contributing to an existing codebase.
  - Enablement: Demonstrable experience taking a non-technical
    colleague or business team from little or no development
    experience to independently maintaining or extending a
    tool.
  - Business Partnership: Experience working directly with non-
    technical stakeholders to understand problems, gather
    requirements, define solutions and manage expectations.
  - Commercial Acumen: Able to establish a business baseline,
    develop an ROI case and measure whether an automation has
    delivered genuine business value.
  - Startup Environment: Experience working in a startup, scale-
    up or smaller team environment where engineers are
    expected to operate independently, move quickly and take
    broad ownership.

  Must-have attributes

  Ownership & Accountability: Takes full responsibility for
  outcomes and sees problems through to resolution.
  Comfortable owning a system from idea to production rather
  than waiting for someone else to define the next step.

  Initiative & Bias for Action: A proactive self-starter who
  actively looks for problems worth solving and prefers to
  ship, learn and iterate rather than over-engineer.

  Strong Communication: Personable and confident when working
  with both technical and non-technical stakeholders. Able to
  extract requirements from busy subject-matter experts and
  communicate technical concepts in plain language.

  Commercial Mindset: Thinks beyond whether something can be
  built and asks whether it should be built. Comfortable
  defending an ROI case and stopping projects when the
  expected value is not materialising.

  Curiosity & AI Enthusiasm: A genuine self-learner who
  actively experiments with new AI technologies and applies
  them to practical problems.

  Structured Thinking: Able to take ambiguous problems, break
  them down into manageable components, establish priorities
  and make pragmatic decisions.

  Humility: Open to feedback, willing to acknowledge knowledge
  gaps and comfortable learning from subject-matter experts
  across the business.

  Resilience: Comfortable troubleshooting problems
  independently and working through technical or business
  obstacles without becoming blocked.

  Nice-to-have experience

  - Experience working in a regulated, multi-jurisdiction or
    professional-services environment.
  - Experience in accounting, bookkeeping, corporate
    secretarial, compliance or fintech operations.
  - Experience working with accounting platforms or APIs such as
    Xero.
  - Experience with BigQuery or other cloud data warehouses.
  - Experience building integrations with Slack or similar
    collaboration platforms.
  - Experience with document-generation and document-processing
    workflows.
  - Experience building AI agents, tool-calling systems or
    multi-step AI workflows.
  - Experience working with evaluation frameworks, golden sets
    and production LLM monitoring.

  Behavioural fit is also important at Sleek And We will be
  looking for candidates who have a proven track record of
  embodying the below attributes in their recent roles:

  Ownership: This shows reliability and helps build trust
  within the team. We move fast and need to know that everyone
  will see things through to completion and proactively help
  to get things back on track when challenges arise.
  Accountability is really important to us.

  Humility: There is so much we don't know. Humility allows
  for open-mindedness to feedback and a willingness to learn
  from others. It paves the way for collaboration and creates
  a positive work environment. It is a key ingredient of self-
  awareness and emotional intelligence.

  Structured Thinking: Our business is complex with many
  layers (many services, many countries, many cultures).
  Regardless of whether you're more analytical or creative in
  nature, being able to show sound judgement is important to
  us. It ensures solutions are pragmatic and balance the needs
  of the organisation, team and customers.

  Attention to detail: AI systems and automations need to work
  reliably with real business data. You'll need to identify
  gaps, edge cases, errors and failure modes before they
  create problems for users.

  Excellent listener and clear communicator: We have a variety
  of nationalities and for many people, English isn't their
  first language. For you to excel, you'll need to be present
  in your conversations, extract what stakeholders actually
  need and communicate solutions clearly to technical and non-
  technical audiences.

  Initiative: We are looking for someone who actively
  identifies opportunities rather than waiting for a fully
  defined project. You should be comfortable approaching a
  business team, understanding their problems and proposing a
  practical solution.

  The interview process

  The successful candidate will participate in the following
  interview stages. We anticipate the process to last no more
  than 3 weeks from start to finish.

  TA Screen: The initial interview with Talent Acquisition
  will assess the candidate's relevant experience, motivation,
  communication, ownership and practical AI experience.

  Technical Interview: Candidates will be assessed on their
  experience building and deploying production software and
  AI/LLM systems.

  Soft Skills Interview: A 45-60-minute interview to assess
  the behavioural skills.

  Reference Verification: Prior to final offer confirmation,
  we will conduct one professional reference check with your
  recent direct manager or supervisor. To keep the process
  moving smoothly, this step may be initiated during the final
  interview stages.

  Requirement for background screening

  Please be aware that Sleek is a regulated entity and as such
  is required to perform different levels of background checks
  on staff depending on their role. This may include using
  external vendors to verify:

  - Your education
  - Any criminal history
  - Any political exposure
  - Any bankruptcy or adverse credit history

  We will ask for your consent before conducting these checks.
  Depending on your role at Sleek, an adverse result on one of
  these checks may prohibit you from passing probation.

  By submitting a job application, you confirm that you have
  read and agree to our Data Privacy Statement for Candidates,
  found at Sleek.com.

  Benefits

  Some other great things about working at Sleek…

  Humility and kindness: Humility is a core attribute we hire
  for, which means we have a culture of not taking ourselves
  too seriously and being able to laugh. Kindness is also
  incredibly important. We are committed to creating and
  nurturing a diverse and inclusive environment.

  Flexibility: You’ll be able to work remotely. If you need to
  start early or start late to cater to your family or other
  needs, we don’t mind, so long as you get your work done and
  proactively communicate. You can also work fully remote from
  anywhere in the world for 1 month each year

  Financial benefits: We pay competitive market salaries and
  provide staff with generous paid time off and holiday
  schedules. Certain staff at Sleek are also eligible for our
  employee share ownership plan and can share in the upside of
  our stellar growth trajectory as we work toward listing on a
  prominent stock exchange in the Asia Pacific region.

  Personal growth: You’ll get a lot of responsibility and
  autonomy at Sleek - we move at a fast pace so you’ll be
  making decisions, making mistakes and learning. There’s also
  a range of internal and external facing training programmes
  we run. We’re also at the forefront of utilising AI in our
  space and are developing a regional centre of AI excellence.
  It is our intention that if you leave Sleek, you leave as a
  more well-rounded person and professional.

  Sleek is also a proudly certified B Corp. Since we started
  our journey in 2017, we’ve been committed to building Sleek
  as a force for good. In just over 5 years, we’ve joined a
  community of industry leaders like Patagonia, Ben & Jerry's,
  and P&G who are building an inclusive, equitable, and a
  regenerative economy.
