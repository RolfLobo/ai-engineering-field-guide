description: |
  Driving Innovation and Trust: Ten’s Journey to Redefine
  Service Excellence 

  Ten is on a mission to become the most trusted service
  business in the world. Technology-driven Product is at the
  centre of our strategy to create a hugely successful service
  and business.  Millions of members already have access to
  Ten's services across lifestyle, travel, dining and
  entertainment on behalf of over 50 clients including HSBC,
  Swisscard, Visa, Mastercard and American Express. Ten's
  partnerships are based on multi-year contracts generating
  revenue through platform-as-a-service and technology fees. 

  We have the advantages of already being at scale globally
  with a critical mass of high-net-worth members via stable,
  multi-year revenue-generating contracts.  We already have a
  market leading consumer proposition and credibility (and
  many integrations) with the leading suppliers/partners
  across our ‘big 4’ service categories of
  restaurants/travel/entertainment and luxury retail.   

  We are debt-free, profitable and the first B Corp listed on
  the London Stock Exchange (AIM market). 

  Our plans are to continue to invest into technology
  (including AI) to become the main way that our members
  organise their leisure lives. The next few years will see
  Ten speed up our progress via our Growth Engine strategy
  making the next huge steps to achieve our ambitions
  together.

  For more information about Ten, please check out our Welcome
  to Ten video and this article.

  🌟 Join Our Team as an AI Engineer! 🌟

  Ten is currently building a bigger team of AI engineers in
  London, and as part of those efforts, we’re currently
  looking for an AI Engineer who will play a critical role in
  designing, building, deploying, and monitoring AI systems
  that scale across the business and to our millions of
  members globally.

  Your role will involve working in a cross-functional team,
  collaborating with product, data and platform teams to
  produce high quality working software released to a frequent
  cadence. The team adopts a ‘you build it, you run it’ and
  DevOps mindset and likes to be hands-on in all aspects of
  development. You will be responsible for ensuring the
  software meets quality through rigorous automated testing
  and metrics. You will also be responsible for assessing and
  choosing the right solution for the task at hand whilst
  considering cost implications and timelines.

  If you have a curiosity and passion for AI, whilst a firm
  grounding in software engineering principles enabling you to
  build industry leading products, we'd love to hear from you!

  Requirements

  - Proficiency in at least one programming language. I.e
    Python, C#, JavaScript, Kotlin, Java, Go..

  - Experience with Gen AI tools (e.g LangGraph, CrewAI, Hugging
    Face, OpenAI APIs etc)

  - Experience in building and optimising systems for
    performance, scalability, and reliability

  - Understanding of ML fundamentals (training, evaluation,
    deployment) and LLM-specific challenges (prompt
    engineering, latency, cost optimisation, hallucinations,
    evaluation)

  - Experience with cloud platforms (AWS, GCP, Azure) and
    infrastructure-as-code (Terraform etc).

  - Hands-on with DevOps/Infra tooling (CI/CD, Docker, K8s) and
    observability (Prometheus, Grafana, Datadog etc)

  - Experience building distributed systems

  - Knowledge and hands-on experience with multiple datastores
    (both SQL and NoSQL)

  - Desired experience in building agents and workflows (e.g
    autonomous systems or multi-agent architectures)
  - A passion for AI Engineering
  - Fluent in English (C2 proficiency)

  Guidelines for Hybrid/Home Office :

  - Located in London
  - Please note that if you live within a commutable distance of
    the office you will be asked to enter into a hybrid
    working arrangement - at least 2/3x a week in the office.
  - A secure home office at your confirmed address, free from
    background noise or other distractions.
  - You must meet our minimum internet speeds if you want to
    work remotely / in our hybrid model and this will be
    checked during the recruitment process and again when you
    join. We also have a great office that you can work from
    as an alternative.

  Benefits

  Our people are at the heart of the business, and we have a
  culture of recognition and reward - both through regular
  appraisals but also annual Extra Mile Awards where we
  celebrate those who have gone that extra mile in their role.
  We also encourage all our staff to incorporate their
  aspirations and interests into their career at Ten and we
  are there every step of the way in supporting development.

  Rewards designed around you:

  - A competitive salary will be offered depending on experience
  - Offer flexible work arrangements including Hybrid work
    possibilities
  - Annual Leave of 25 days per annum and an additional 3 extra
    days of annual leave in the third year
  - One (1) month paid Sabbatical after every 5 years of
    Service, without tapping into annual leave
  - Employer-contributory company pension (with a scheme that
    allows full decision making about what investments are
    made, levels of risk, ethical funds etc.)
  - Lucrative Ten Loyalty Rewards program
  - Remote Working Holidays - Travel and Work for up to 4 weeks
    per year!
  - Access to lots of great travel and entertainment discounts
    as our clients’ members would!
  - Be part of our global, dynamic, and inclusive Team, with
    diversity at its core.
  - Possibility of growth within a dynamic and international
    company

  Who Are We

  Ten is a leading lifestyle and concierge company helping our
  clients discover, organise, enjoy and get the most from
  life. We partner with global financial institutions and
  other premium brands to attract and retain wealth and mass
  affluent clients. Established in the UK in 1998 and with
  over 25 years of experience, Ten operates in over 20 cities
  worldwide, in over 26 languages, with 65% of our workforce
  globally distributed and is publicly listed on the London
  Stock Exchange ('TENG'). We were the first concierge
  business to be awarded the B Corp certification in the UK in
  2023.

  Ten’s strategy focuses on four key areas: deliver a world-
  class member experience, invest in technology, expand
  contracts with new and existing clients as well as develop
  our foothold in new markets by leveraging our market-leading
  service proposition.

  At Ten, you’ll be part of a global, dynamic, and inclusive
  team, with diversity at its core and endless opportunities
  for growth.

  Join us and experience a workplace where you can truly
  thrive. https://tenlifestylegroup.com/ten-tv/

  Commitment to Diversity

  We encourage diverse philosophies, cultures, and
  experiences. We appreciate diversity and are dedicated to
  creating an inclusive work environment for our employees.
  This idea unites the teams at TEN. All aspects of our
  relationship, including the decision to hire, promote,
  discipline, or terminate, will be based on merit,
  competence, performance and business needs.

  “Ten works with a small preferred supplier list of
  recruitment agencies only. Please note we are not accepting
  any further recruitment agencies at this time. Ten Group is
  not responsible for any fees related to unsolicited
  resumes.”
