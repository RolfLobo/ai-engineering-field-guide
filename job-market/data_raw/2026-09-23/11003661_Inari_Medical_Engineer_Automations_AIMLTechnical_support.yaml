description: |
  Work Flexibility: Hybrid or Onsite

  Why Technical Support at Stryker?

  At Vocera now a part of Stryker we are dedicated to
  improving lives, with a passion for researching and
  developing new medical device products. Technical Support
  organization is part of Acute Care business unit and
  supports all products under the Vocera line of products.
  Vocera empowers integrated, intelligent communication for
  mission-critical workflows in healthcare, hospitality,
  energy, retail and other mobile work environments. Vocera is
  widely recognized for developing smarter ways to communicate
  that improve patient and customer satisfaction.

  As a Software Automation Engineer, you will be proud of the
  work that you will be doing, using cutting-edge technologies
  to make healthcare better. Here, you will work in a
  supportive culture with other incredibly talented and
  intelligent people, creating industry-leading medical
  technology products. You will also have growth opportunities
  as we have a culture that supports your personal and
  professional development.

  We are proud to be named one of the World’s Best Workplaces
  and a Best Workplace for Diversity by Fortune Magazine!
  Learn more about our award-winning organization by visiting
  stryker.com

  Position Description:

  - Stryker Vocera is looking for a dedicated, hands-on
    Automations (AI/ML Engineer. You will be responsible for
    creating automation scripts, support tools and AI/ML
    solutions used by our Technical Support team. This
    position reports to the Director, Technical Support
    Operations

  Responsibilities:

  - Works with key stakeholders from Support, Quality,
    Engineering on scoping, designing, and building new
    internal tools/automation to support the troubleshooting
    of Vocera products
  - Support several tools (CAFI, ASL, CI/CD Data Pipelines) used
    by Technical Support, Quality and Engineering to gather
    and analyze customer log files to support the
    troubleshooting of Vocera products
  - You will develop innovative solutions to fulfill project
    requirements and deliver features within project timelines
  - Develop automation scripts to help eliminate manual
    processes and drive operational efficiency.
  - Collaborate with other development teams to ensure features
    and enablers are effective
  - Follow software engineering best practices
  - Document designs and product capabilities as needed

  Competencies

  - Proficiency in programming with one or more of the following
    technologies: Java, Python, Javascript, HTML, CSS, and
    Powershell/Unix shell
  - Proficiency in Database fundamentals, SQL, NoSQL, data
    modeling and visualization
  - Familiarity with the usage of version control and build
    automation systems like Git
  - Experience with backend frameworks such as Flask, FastAPI
  - Experience with data processing libraries like Numpy,
    Pandas, Airflow
  - Experience developing with AI tools such as Cursor,
    Microsoft Copilot
  - Experience with systems design concepts
  - Experience with version control and build automation systems
    like Git and Jenkins
  - Experience with productivity tools and software project
    management tools such as Jira, BitBucket, and
    Confluence/Atlassian Wiki
  - Experience with ETL frameworks such as Apache Airflow,
    PySpark, ElasticSearch
  - Knowledge of frontend frameworks such as React, AngularJS
  - Knowledge of infrastructure automation tools like Ansible,
    Terraform, and VMWare
  - Knowledge of data visualization tools such as Tableau,
    Apache Superset, Microsoft PowerBI
  - Proven ability to design, build, deliver, and support
    scalable and highly available enterprise solutions
  - Demonstrated passion to build great software systems in the
    right way
  - Dedicated in the face of ambiguous requirements; unafraid to
    explore new ideas and technologies
  - Independent self-starter; able to complete projects on time
    with minimal guidance
  - Excellent analytical, verbal, and written communication
    skills with the ability to work within a dynamic and
    diverse team

  Requirements

  - 2-4 years of experience in AI/ML and/or Process Automation
  - BS in Computer Science/AI or related field, or equivalent
  - Track record of delivering high quality technical results
    within committed time parameters
  - Familiarity with SCM, code review processes, and Agile
    development methodologies
  - No travel required

  Travel Percentage: None
