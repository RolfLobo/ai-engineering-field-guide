description: |
  GAQ226R75

  About the Role

  We are looking for a Senior Full Stack Developer to design,
  build, and deploy modern, scalable AI agents and
  applications that leverage Large Language Models (LLMs).
  This role requires a strong focus on end-to-end agent
  development, including building a high-performance React
  frontend, designing the agentic logic in Python, integrating
  with backend services, and ensuring production readiness.

  Key Responsibilities:

  - Design, develop, and deploy AI agents for business-critical
    workflows, with a focus on LLM orchestration and tooling.
  - Implement complex agentic behaviours using frameworks like
    LangChain or LangGraph, including ReAct loops for
    reasoning and action.
  - Design and develop a high-performance React application for
    the agent's user interface.
  - Collaborate with backend teams to integrate APIs and
    services, and build tools for agents.
  - Work with middleware (Python/Node.js) to orchestrate agent
    calls and data flow.
  - Implement comprehensive observability and tracing for agent
    runs and system performance.
  - Build reusable, scalable UI components.
  - Optimise application performance, responsiveness, and
    scalability.
  - Participate in architectural discussions and contribute to
    solution design.
  - Write clean, maintainable, and testable code with proper
    documentation.

  Required Skills & Experience

  - 5+ years of experience in full-stack development, with
    strong expertise in Python and React.js.
  - Proven experience in designing, building, and deploying at
    least 1 production-deployed AI agent or LLM application.
  - Deep expertise in LLM orchestration, prompt engineering, and
    utilizing tools/plugins to extend agent capabilities.
  - Experience with agent frameworks like LangChain or
    LangGraph, including implementing reasoning patterns like
    the ReAct loop.
  - Experience with observability, logging, and tracing for AI
    agents.
  - Experience building large-scale, enterprise-grade
    applications.
  - Strong experience with API integration (REST/GraphQL).
  - Experience working in Agile/Scrum environments.
  - Strong problem-solving and system design skills
  - Ability to work across frontend and backend integration
    layers
  - Ownership mindset with attention to detail
  - Good communication and collaboration skills

  Preferred / Good to Have

  - Experience with Node.js or Python for middleware development
  - Understanding of Salesforce APIs (REST, Apex, RLM/CPQ)
  - Experience with event-driven architectures (webhooks, CDC,
    async processing)
  - Knowledge of CI/CD pipelines and DevOps practices
  - Experience with Databricks platform and Mosaic AI

