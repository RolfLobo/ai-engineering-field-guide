title: AI Product Engineer / Forward Deployed Engineer
company: Raydar
location: USA
remote: true
work_type: FULL_TIME
description: |
  Our client is a YC-backed company building the complete
  trust platform for voice AI agents, spanning pre-deployment
  simulation, adversarial red-teaming, and production
  observability. Its systems have analyzed more than 10
  million production voice-agent calls and tested more than
  10,000 agents for customers in regulated industries,
  including major banks, healthcare organizations, and telecom
  companies. Founded in 2024, the company has raised $4.3M and
  operates with a small, highly entrepreneurial team.

  This is a hybrid product engineering and forward-deployed
  engineering role for an early-career builder who wants equal
  ownership of customer discovery and hands-on coding. You
  will work directly with technical enterprise customers, turn
  incomplete requirements into clear product decisions, and
  ship complete features across the frontend and backend
  without handoffs.

  What you'll do

  • Work directly with enterprise engineers to understand
  product gaps, debug live issues, and define the right
  solution.

  • Own features from discovery through prototype,
  implementation, launch, and iteration across the frontend
  and backend.

  • Support proofs of concept and post-sales customer success
  as a high-agency technical partner.

  • Turn one-off customer requests into reusable platform
  capabilities.

  • Build across TypeScript, Python, React, Next.js, Node.js,
  APIs, data systems, and user interfaces.

  • Use tools such as Cursor, Claude Code, and Codex as a core
  part of your daily product-development workflow.

  • Communicate decisions, progress, and next steps clearly
  while shipping at a fast cadence.

  • Travel for customer visits, conferences, and team offsites
  as needed.

  Requirements

  • Zero to three years of experience as a product engineer,
  forward-deployed engineer, solutions architect, founder, or
  similarly hands-on builder.

  • A degree from one of the target universities identified
  for this search, including schools such as Stanford, MIT, UC
  Berkeley, Harvard, Carnegie Mellon, the IITs, Waterloo, the
  University of Pennsylvania, Columbia, Cornell, Cambridge,
  and Oxford.

  • Evidence that you have shipped a product, project, or side
  project to real users or customers.

  • Experience in a startup, founder-led company, or high-
  velocity team with end-to-end ownership.

  • Daily fluency with AI coding tools such as Cursor, Claude
  Code, or Codex, with a concrete example of how they changed
  what you built or how quickly you shipped.

  • Proficiency in TypeScript and Python, with the ability to
  work across APIs, data, and UI to deliver a complete product
  slice.

  • Strong product and design judgment when turning vague
  customer asks into crisp, shippable features.

  • Comfort working directly with technical enterprise
  stakeholders, including live demos, customer questions, and
  debugging.

  • High ownership, fast execution, and clear written
  communication.

  • Comfort with approximately 10% to 20% travel each year.

  Bonus points

  • Founder or entrepreneurial experience, including a
  startup, YC application, or side project with meaningful
  traction.

  • Experience supporting enterprise customers or working in a
  forward-deployed engineering model.

  • Experience with voice AI, LiveKit, Pipecat, Vapi, Retell
  AI, ElevenLabs, Temporal, AWS, Kubernetes, PostgreSQL,
  Redis, Terraform, OpenTelemetry, or Figma.

  Benefits

  • $140K-$180K base salary, with flexibility for exceptional
  candidates.

  • Competitive equity.

  • Remote-first work for candidates based in North America,
  with San Francisco or Austin preferred. London may also be
  considered.

  • Approximately 10% to 20% travel for customer visits,
  conferences, and team offsites.

  • H-1B and other existing visa transfers may be considered,
  including OPT. New sponsorship from scratch is not
  available.
