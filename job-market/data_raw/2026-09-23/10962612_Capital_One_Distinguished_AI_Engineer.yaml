description: |
  Voyager (94001), India, Bangalore, Karnātaka Distinguished
  AI Engineer At Capital One, we are creating responsible and
  reliable AI systems, changing banking for good. For years,
  Capital One has been an industry leader in using machine
  learning to create real-time, personalized customer
  experiences. Our investments in technology infrastructure
  and world-class talent - along with our deep experience in
  machine learning - position us to be at the forefront of
  enterprises leveraging AI. From informing customers about
  unusual charges to answering their questions in real time,
  our applications of AI & ML are bringing humanity and
  simplicity to banking. We are committed to continuing to
  build world-class applied science and engineering teams to
  deliver our industry leading capabilities with breakthrough
  product experiences and scalable, high-performance AI
  infrastructure. At Capital One, you will help bring the
  transformative power of emerging AI capabilities to
  reimagine how we serve our customers and businesses who have
  come to love the products and services we build. Team
  Description: The Intelligent Foundations and Experiences
  (IFX) team is at the center of bringing our vision for AI at
  Capital One to life. Our Generative AI models and platforms
  empower teams across Capital One to enhance their products
  by composing powerful, safe and explainable AI capabilities
  such as agentic workflows, and shared services such as
  guardrails, observability and evals coupled with
  foundational model power of open-weight and proprietary
  frontier models. The team is also delivering capabilities on
  top of the platform to optimize the software development
  life-cycle to dramatically enhance developer productivity
  and model-development life cycle to improve time-to-market
  of machine learning models. In this role, you will:

  - Partner with a cross-functional team of engineers, research
    scientists, technical program managers, and product
    managers to deliver AI-powered products that change how
    our associates work and how our customers interact with
    Capital One.
  - Design, develop, test, deploy, and support AI software
    components including foundation model training, large
    language model inference, similarity search, guardrails,
    evals engine, experimentation, governance, and
    observability, etc.
  - Leverage a broad stack of Open Source and SaaS AI
    technologies such as AWS Ultraclusters, Huggingface,
    VectorDBs, Nemo Guardrails, PyTorch, and more.
  - Invent and introduce state-of-the-art LLM optimization
    techniques to improve the performance - scalability, cost,
    latency, throughput - of large scale production AI
    systems.
  - Devise novel context generation techniques that optimize
    cost / quality trade-offs.
  - Design and implement capabilities for automated monitoring,
    anomaly detection and RCA for multi-turn and headless
    agentic applications.
  - You will collaborate with lines of businesses to design and
    implement high value agentic applications
  - Finally you will coach and evangelize, mentoring Staff,
    Principal and Senior engineers, authoring technical design
    documents and blogs and representing Capital One at Tier1
    AI conferences.

  The Ideal Candidate:

  - Passion for staying abreast of the latest research, and an
    ability to intuitively understand scientific publications
    and judiciously apply novel techniques in production.
  - You adapt quickly and thrive on bringing clarity to big,
    undefined problems. You love asking questions and digging
    deep to uncover the root of problems and can articulate
    your findings concisely with clarity. You have the courage
    to share new ideas even when they are unproven.
  - You are deeply Technical. You possess a strong foundation in
    engineering and mathematics, and your expertise in
    hardware, software, and AI enable you to see and exploit
    optimization opportunities that others miss.
  - You are a resilient trail blazer who can forge new paths to
    achieve business goals when the route is unknown.

  Basic Qualifications:

  - Bachelor's degree in Computer Science, Electrical
    Engineering or Computer Engineering
  - At least 6 years of experience developing AI and ML
    algorithms or technologies
  - At least 8 years of experience programming with Python, Go,
    Scala, or Java

  Preferred Qualifications:

  - 10+ years of experience deploying scalable and responsible
    solutions on cloud platforms (e.g. AWS, Google Cloud,
    Azure, or equivalent private cloud)
  - 4+ years of experience architecting, designing, developing,
    integrating, delivering, and supporting complex AI systems
  - 6+ years of experience developing AI and ML algorithms or
    technologies (e.g. LLM Inference, Similarity Search and
    VectorDBs, Guardrails, Memory) using Python, C++, C#,
    Java, or Golang
  - 2+ years of experience with Agentic frameworks (LangChain,
    CrewAI, AutoGen etc.)
  - 2+ years of experience leading GenAI or LLM-Powered
    application architectures in production
  - 2+ years of experience developing and applying state-of-the-
    art techniques for optimizing training and inference
    software to improve hardware utilization, latency,
    throughput, and cost
  - 2+ years of experience with Observability and Evals for
    agentic applications
  - Passion for staying abreast of the latest AI research and AI
    systems, and judiciously apply novel techniques in
    production
  - Demonstrated ability to lead and mentor multiple engineering
    teams and influence cross-functional stakeholders up to
    the VP level
  - Excellent communication and presentation skills, with the
    ability to articulate complex AI concepts to peers
  - Master's or Ph.D in Computer Science, Computer Engineering,
    especially in AI/ML areas.

