description: |
  About us

  Appnovation is a global, full-service digital partner that
  combines Strategy, Experience & Design, Engineering and
  Managed Services. We build digital solutions that deliver
  real impact today and serve as foundations for future
  growth.  Bold ambition. Practical action. Endless
  possibilities.

  About the Role

  As a Full-Stack AI Engineer, you'll transform business ideas
  into production-ready applications using cutting-edge AI
  design tools and modern full-stack frameworks. With a strong
  bias toward frontend development, you specialize in the
  critical early stages—from concept through pre-totype to
  prototype—where design systems meet AI-augmented
  development. You're an expert at leveraging tools like
  v0.dev, bolt.new, and Lovable to rapidly generate
  components, then building out the complete stack to meet
  enterprise standards for accessibility, performance,
  responsive design, and scalability. You must be able to
  think fast, work outside the box, and have a passion for
  pushing the boundaries of what AI can achieve. You will join
  a team that thrives on experimentation, moving at a rapid
  pace from initial concepts through prototypes to production-
  ready applications.

  Key Responsibilities

  - Rapidly transform concepts into interactive prototypes using
    v0.dev, bolt.new, Lovable, and similar AI design tools.
  - Build full-stack applications from prototype to production,
    with emphasis on frontend excellence and solid backend
    foundations.
  - Ensure all components align with existing design systems
    (design tokens, color palettes, typography, spacing) and
    brand guidelines.
  - Develop production-ready UI components using modern
    frameworks (React.js, Vue.js, Nuxt.js) with best practices
    for accessibility, performance, and responsive design.
  - Design and implement RESTful APIs and backend services using
    platforms like Supabase to support frontend functionality.
  - Work with databases (SQL and NoSQL) to manage application
    data efficiently.
  - Implement authentication, caching strategies, and optimize
    application performance across the stack.
  - Collaborate with UX Designers, AI Builders, and Innovation
    Leads throughout the development lifecycle.
  - Utilize GitHub Spec-kit and/or Open Spec to streamline
    development workflows and maintain specification
    standards.
  - Leverage Figma and design system tooling to maintain
    component libraries and streamline design-dev handoff.
  - Document design decisions and technical implementation in
    Jira as part of the ticket-driven workflow.

  Qualification

  - 4+ years in full-stack development with strong frontend
    expertise in modern UI frameworks (React.js, Vue.js,
    Nuxt.js). Bonus points if you have experience working in a
    startup or rapid prototyping environment.
  - Proven experience with PHP and Python.
  - Desired experience with NodeJS and Express.
  - Proven hands-on experience with AI design tools such as
    v0.dev, bolt.new, Lovable, or similar platforms.
  - Experience with Spec driven development like GitHub Spec-kit
    and Open Spec.
  - Experience with workflow automation platforms such as N8N.
  - Strong track record of delivering production-grade full-
    stack applications.
  - Solid understanding of backend development, including API
    design (REST, GraphQL), server-side logic, and database
    management.
  - Experience with platforms like Supabase for rapid backend
    development and both SQL (PostgreSQL, MySQL) and NoSQL
    (MongoDB) databases.
  - Proficiency with authentication mechanisms (OAuth, JWT) and
    security best practices.
  - Understanding of caching strategies, performance
    optimization, and scalability patterns.
  - Deep understanding of design systems, design tokens, and
    component-driven development.
  - Expert-level proficiency with Figma, including design system
    management and component libraries.
  - Experience with CSS frameworks (e.g. TailwindCSS) and modern
    styling approaches.
  - Strong collaboration and creative problem-solving skills.
  - Experience with TypeScript and modern JavaScript/ES6+
    features.
  - Familiarity with cloud platforms (AWS, Azure, GCP) and
    deployment workflows.
  - A portfolio showcasing full-stack applications you've built,
    including work with design systems and AI design tools.
  - Strong attention to detail and a passion for innovation.
  - Ability to work in a fast-paced and dynamic environment.

  What Appnovation Offers

  - Challenging and rewarding work with real impact
  - Growth opportunities for personal and professional
    development
  - Exposure to exciting projects and high-profile clients
  - Supportive work environment with access to company leaders
  - Hybrid working model

  Here are a few more reasons why you should apply:

  - Work-life Balance
  - Lots of opportunities for personal and professional growth
  - Health Benefits Package
  - Mental Health Support
  - Personal Days Off
  - Fertility and Menopause Leave
  - Fitness Allowance
  - D,E&I Initiatives
  - And much more...



  Thank you for your interest in a career with Appnovation
  Technologies! Please note that only those selected for an
  interview will be contacted.



  At Appnovation, we recognize that diverse teams are the
  strongest teams. Diversity, Equity & Inclusion is not only
  something that we embrace - we celebrate it! We are proud to
  be an Equal Opportunity Employer and we encourage applicants
  from all backgrounds, lived experiences and industries to
  apply. Come join us at Appnovation, and learn more about how
  we stay true to our company values as we build better lives
  through better digital.

  Accommodations are available upon request throughout the
  recruitment process.
