title: Senior Software Engineer - Agentic AI Applications
company: Serko Limited
location: USA
remote: true
work_type: FULL_TIME
description: |
  At Serko, we believe something incredible happens when
  people come face-to-face. That’s why we’re on a mission to
  engineer a frictionless, next-generation business travel
  marketplace. We don’t just manage travel; we are leveraging
  advanced AI and cutting-edge tech to eliminate the
  complexity of global movement.

  When you join Serko, you join a global collective of
  passionate technologists who show up as their true selves to
  build world-class products. With established hubs across New
  Zealand, Australia, North America, India and China - your
  code and ideas will impact millions of corporate travelers
  worldwide.  If you're ready to challenge the status quo and
  build the future of travel tech, your next journey starts
  here.

  We’re hiring a Senior Full Stack Engineer to own the end-to-
  end development of our next-gen AI products for candidates
  available in Washington or California states.

  Requirements

  You'll bridge the gap between complex AI capabilities and
  beautiful user experiences, developing the customer-facing
  features, high-performance APIs, and reliable backend
  services that make intelligent, autonomous workflows
  reality.

  What You’ll Do

  - Build Meaningful Experiences: Partner closely with a cross-
    functional team of designers, product managers, and ML
    engineers to shape and deliver thoughtful, high-quality
    AI-powered user experiences.
  - Bridge Frontend & Backend: Co-create and refine full-stack
    features, utilizing React/Next.js for intuitive frontends
    and Python or Node.js to power robust, reliable backend
    services.
  - Bring AI to Life: Integrate LLM APIs and innovative agentic
    frameworks into fluid product features—crafting
    interactive streaming UIs, clear tool-call results, and
    helpful agent status displays.
  - Design Accessible Connections: Cultivate and maintain clean
    REST and/or GraphQL APIs that seamlessly support user
    data, smooth session management, and helpful agent
    interactions.
  - Champion Quality Together: Write thoughtful unit,
    integration, and end-to-end tests to ensure product
    excellence, and engage in constructive, supportive code
    reviews that help the whole team grow.
  - Support Team Resilience: Contribute to a shared,
    collaborative on-call rotation, working as a team to
    support production systems, document thoughtful learnings,
    and keep our platform running smoothly.
  - Shape Our Technical Future: Share your unique perspective in
    architectural discussions and contribute technical
    proposals that help our systems scale sustainably.

  ﻿What you'll bring

  - A Passion for Full-Stack & AI: Deep, hands-on experience
    building full-stack applications, with a special focus on
    native AI stack development.
  - Core Technical Comfort: A strong foundational comfort with
    TypeScript (React, Next.js) on the front end, paired with
    Python and SQL on the backend.
  - AI Integration Experience: Experience successfully bringing
    AI to life in production, specifically by integrating with
    LLM APIs or crafting intuitive AI-powered features.
  - Thoughtful System Design: A clear understanding of RESTful
    API design, database management (such as PostgreSQL or
    Redis), and cloud ecosystems.
  - An Eye for Real-Time UX: Familiarity with creating smooth,
    real-time user experiences using streaming responses (like
    SSE or WebSockets) so our AI feels fluid and responsive.
  - DevOps Awareness: Comfort collaborating on continuous
    integration and delivery (CI/CD), containerization
    (Docker), and smooth cloud deployments.
  - Empathetic Communication: Highly developed communication
    skills and a natural ability to listen, share ideas, and
    partner effectively within a cross-functional team.

  Nice to Have

  - If you have experience in any of these areas, that’s
    wonderful! If not, we are excited to support your learning
    on the job:
  - Familiarity with agentic frameworks like LangChain or
    LangGraph.
  - Exposure to building vector search or RAG-based
    capabilities.
  - A background or interest in crafting interactive interfaces
    like chat, copilots, or workflow automation tools.

  Benefits

  At Serko, we aim to create a place where people can come and
  do their best work.  This means you’ll be operating in an
  environment with great tools and support to enable you to
  perform at the highest level of your abilities, producing
  high-quality and delivering innovative and efficient
  results. Our people are fully engaged, continuously
  improving, and encouraged to make an impact.

  Some of the benefits of working at Serko are:

  - A competitive base pay
  - Medical Benefits
  - Discretionary incentive plan based on individual and company
    performance
  - Focus on development: Access to a learning & development
    platform and opportunity for you to own your career
    pathways
  - Flexible work policy
  - The pay range is between $152,000 - $230,000 USD as a base
    salary offering annually.

  A Note on Work Authorization: Applicants must be authorized
  to work for any employer in the U.S. At this time, we are
  unable to provide sponsorship or assume sponsorship for
  employment visa status (e.g., H-1B visa status).
