description: |
  About the Team

  The mission of the Applied AI Engineering team is to enable
  the secure and impactful implementation of Agentic
  solutions. In this international Government role, you will
  deliver clearly scoped AI use cases with public-sector
  customers, from a mission need through hands-on
  implementation, architecture, evaluations, measurable
  adoption, and documented handoff. Account-aligned technical
  and commercial owners retain ongoing account ownership.

  About the Role

  We are looking for a driven solutions leader with a product
  mindset to partner with our international public-sector
  customers and ensure they achieve tangible value with GenAI.
  You will pair with government agencies, policymakers, and
  other public institutions to establish a GenAI strategy and
  identify the highest value applications. You’ll partner with
  their technical teams, subject matter experts, regional
  cloud providers, systems integrators, and implementation
  partners to move from prototype through production. You’ll
  design architectures using supported OpenAI technologies and
  approved services, with explicit data, inference,
  evaluation, and production-readiness boundaries. You will
  collaborate closely with regional Sales and Solutions
  Engineering, Global Affairs, Applied Research, Product,
  Legal, and Security teams.

  This role is based in London. We use a hybrid work model of
  3 days in the office per week and offer relocation
  assistance to new employees.

  In this role, you will:

  - Deliver clearly scoped technical implementations with
    sophisticated international public-sector customers,
    serving as their hands-on engineering partner to build
    applications on supported model APIs, Codex, and other
    approved OpenAI technologies.
  - Work with senior customer stakeholders to identify the best
    applications of GenAI in their industry and to
    build/qualify a comprehensive backlog to support their AI
    roadmap.
  - Intervene directly to accelerate customer time to value
    through building hands-on prototypes and/or by delivering
    impactful strategic guidance, often in collaboration with
    systems integrators and implementation partners.
  - Forge and manage relationships with our customers’ and
    implementation partners’ leadership and stakeholders to
    ensure the successful deployment and scale of their
    applications.
  - Contribute to our open-source developer and enterprise
    resources.
  - Scale the Applied AI Engineering function through sharing
    knowledge, codifying best practices, and publishing
    notebooks to our internal and external repositories.
  - Validate, synthesize, and deliver high-signal feedback to
    the Product, Engineering, and Research teams.

  You will thrive in this role if you:

  - Bring substantial technical consulting or hands-on delivery
    experience with international public-sector or similarly
    regulated customers, bridging regional technical teams and
    senior stakeholders.
  - Have successfully led GenAI or traditional ML
    implementations for government agencies in close
    collaboration with systems integrators and implementation
    partners.
  - Understand network and cloud architecture, including on-
    premise deployments, and show practical judgment about
    privacy, data residency, model-inference location,
    sovereign or regulated environments, identity,
    procurement, and customer authorization.
  - Are an effective and polished communicator who can translate
    business and technical topics to all audiences, including
    cross-cultural communication with public-sector
    executives, regional delivery partners, and legal/security
    stakeholders.
  - Have industry experience in programming languages like
    Python, Go, or Typescript.
  - Own problems end-to-end and are willing to pick up whatever
    knowledge you're missing to get the job done.
  - Have a humble attitude, an eagerness to help your
    colleagues, and a desire to do whatever it takes to make
    the team succeed.
  - Are an effective, high throughput operator who can drive
    multiple concurrent projects and prioritize ruthlessly.
  - Can work with stakeholders in the target region's business
    hours and travel when required for customer delivery.
  - Existing UK Developed Vetting (DV) clearance is strongly
    preferred, particularly for work with UK intelligence and
    defense customers.

  About OpenAI

  OpenAI is an AI research and deployment company dedicated to
  ensuring that general-purpose artificial intelligence
  benefits all of humanity. We push the boundaries of the
  capabilities of AI systems and seek to safely deploy them to
  the world through our products. AI is an extremely powerful
  tool that must be created with safety and human needs at its
  core, and to achieve our mission, we must encompass and
  value the many different perspectives, voices, and
  experiences that form the full spectrum of humanity.

  We are an equal opportunity employer, and we do not
  discriminate on the basis of race, religion, color, national
  origin, sex, sexual orientation, age, veteran status,
  disability, genetic information, or other applicable legally
  protected characteristic.

  For additional information, please see OpenAI’s Affirmative
  Action and Equal Employment Opportunity Policy Statement.

  Background checks for applicants will be administered in
  accordance with applicable law, and qualified applicants
  with arrest or conviction records will be considered for
  employment consistent with those laws, including the San
  Francisco Fair Chance Ordinance, the Los Angeles County Fair
  Chance Ordinance for Employers, and the California Fair
  Chance Act, for US-based candidates. For unincorporated Los
  Angeles County workers: we reasonably believe that criminal
  history may have a direct, adverse and negative relationship
  with the following job duties, potentially resulting in the
  withdrawal of a conditional offer of employment: protect
  computer hardware entrusted to you from theft, loss or
  damage; return all computer hardware in your possession
  (including the data contained therein) upon termination of
  employment or end of assignment; and maintain the
  confidentiality of proprietary, confidential, and non-public
  information. In addition, job duties require access to
  secure and protected information technology systems and
  related data security obligations.

