description: |
  We're building an agentic AI platform that helps enterprises
  transform complex business workflows into AI-powered
  operations. We work with leading global companies to
  identify high-value workflows, deploy AI agents into real
  business environments, and help organizations move from
  experimentation to measurable enterprise impact.

  We believe AI adoption inside the enterprise isn't just a
  technology challenge. It requires business context, workflow
  understanding, change management, trust, ownership, and a
  clear path to value. That's where this role comes in.



  We are a well-funded, early-stage startup, building our
  Founding Solutions Engineering team to help build and own
  our enterprise customer motion from the ground up. This role
  is perfect for a hands-on, technically deep builder who
  thrives in fast-moving environments, enjoys making things
  work in the real world, and partners closely with founders,
  Product, and R&D to deploy and scale complex, AI-driven
  enterprise solutions.

  You will own the technical side of the post-sale customer
  journey, from deployment and integration through adoption,
  expansion, and ongoing success, while helping define how our
  delivery function evolves as we grow.

  Your Impact

  Customer Onboarding & Process Analysis

  - Engage with customers post-close to understand workflows,
    operational processes, and deployment requirements.
  - Translate findings into clear implementation plans for AI-
    powered solutions.

  Data, AI Models & Workflow Development

  - Partner with customers to assess data readiness and gather
    inputs for AI workflows.
  - Configure and integrate AI components into tailored, AI-
    driven workflows.
  - Collaborate with R&D to close data gaps and extend product
    capabilities when needed.

  Deployment & Proof of Value

  - Own end-to-end solution deployment and ensure models meet
    performance and business value expectations.
  - Define success metrics and drive adoption post-launch.

  Integration, Security & Rollout

  - Lead integrations with enterprise systems (e.g., Finance,
    ERP, email platforms), ensuring scalability and security.
  - Guide customers through security, compliance, and IT
    approval processes.
  - Plan and execute rollout to drive smooth implementation and
    adoption.

  What It Takes

  - 7+ years of experience in Implementation Engineering,
    Solutions Engineering, Technical Consulting, Professional
    Services or a similar post-sale customer-facing role.
  - Strong analytical skills with the ability to translate
    business needs into technical solutions.
  - Strong understanding of AI concepts and their enterprise
    applications.
  - High adoption of modern AI tools and workflows.
  - Experience supporting deployments across cloud environments
    and enterprise system integrations.
  - Excellent communication and stakeholder management skills.
  - Demonstrated ability to manage solution delivery across the
    full post-sale customer lifecycle.

  Nice to Have

  - Experience with process mining, workflow mapping, or
    operational analytics
  - Familiarity with enterprise platforms
  - Financial services industry experience

  Compensation

  The expected salary for this role is $180,000 to $230,000
  OTE. This is a good-faith estimate but does not include
  equity or other forms of compensation. Pay will be based on
  experience level, and those outside the salary band are
  welcome to apply.
