  Mandatory Skills

  - Strong Python development experience (3-5 years).
  - Experience developing APIs using FastAPI, Flask, or Django.
  - Hands-on experience with Generative AI and LLMs (OpenAI,
    Azure OpenAI, Gemini, Claude, or open-source models).
  - Experience building RAG (Retrieval-Augmented Generation)
    applications with knowhow of Embeddings, Semantic and
    Hybrid search and Vectors
  - Strong understanding of Prompt Engineering.
  - Experience with AI frameworks such as LangChain, LlamaIndex,
    Semantic Kernel, CrewAI, AutoGen, or LangGraph.
  - Experience with MongoDB and MS SQL Server.
  - Hands-on experience with Selenium, BeautifulSoup, or Scrapy
    for web scraping and data extraction.
  - Experience with Docker and Kubernetes for containerized
    deployments.
  - Strong understanding of REST APIs, software design
    principles, and system integration.

