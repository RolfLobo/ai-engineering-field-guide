  - LLM sdk, with python service integration
  - AI Agent and multi-Agent application development.
  - Experience with Vector Databases such as PGVector or FAISS.
  - NLP and document processing experience.
  - Conversational AI development.

  Key Responsibilities

  - Design, develop, and deploy AI-powered applications using
    LLMs and Generative AI technologies.
  - Develop scalable Python-based APIs and backend services.
  - Integrate AI solutions with enterprise applications,
    databases, and external systems.
  - Develop document ingestion, indexing, retrieval, and
    knowledge management pipelines.
  - Build web scraping and automated data collection solutions.
  - Deploy, monitor, and optimize applications using Docker and
    Kubernetes.
  - Ensure application scalability, security, reliability, and
    performance.
  - Collaborate with cross-functional teams to deliver AI-driven
    business solutions.
  - Stay current with evolving AI technologies, frameworks, and
    industry best practices.

