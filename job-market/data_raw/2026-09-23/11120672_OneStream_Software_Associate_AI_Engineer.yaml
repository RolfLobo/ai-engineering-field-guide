description: |
  Associate AI Engineer

  Location:  Hybrid, United States

  Employment Type: Full-Time

  Benefits Offered: Vision, Medical, Life, Dental, 401K

  Gross Annual Base Salary: USD 86,000 - 115,000

  Additional variable compensation and benefits may apply.
  Total compensation is based on experience, skills, and
  location using objective, job-related criteria.

  This role requires the candidate to work from one of the
  following OneStream office locations: Birmingham, MI, Fort
  Lauderdale, FL, New York, NY, or Chicago, IL.

  Summary:

  As an Associate AI Engineer you will be a critical member in
  executing our AI initiatives within the OneStream platform.
  The AI Product and Engineering team is focused on bridging
  the gap between AI research and AI products, bringing
  tangible and quantifiable value to our end users. Our AI
  solutions incorporate applications across the AI and machine
  learning spectrum, including (but not limited to) time
  series forecasting, anomaly detection, and natural language
  processing. Our mission is to lower the barrier for
  organizations and people to get value out of AI
  capabilities.

  Primary Duties and Responsibilities:

  - Develop scalable, high-performance applications and services
    using a variety of software architecture design patterns.
  - Implement robust software systems and functionalities using
    Python and SQL/NoSQL, ensuring optimal performance and
    scalability.
  - Troubleshoot and debug issues across the full stack, from
    the user interface to the database layer.
  - Participate in technical design sessions to decompose and
    design complex systems and interfaces.
  - Collaborate with cross-functional teams to ensure technical
    and user requirements are met.
  - Must be a self-starter, continuously be learning both best
    code practices and the latest technologies in the Software
    ecosystem.
  - Must understand data analysis and how to apply data science
    solutions into end products.

  Required Education and Experience

  - Bachelor's Degree or similar work experience.
  - CS/EE/CE Degree or similar experience.
  - 1-2 years of experience building and deploying production-
    level machine learning solutions or similar experience.
  - 1-2 years of strong programming experience with one of the
    following: Python, C++, C, CSharp, Java, Rust, or Go (or
    similar experience).

  Preferred Education and Experience:

  - Experience building and deploying production-level software
    solutions or similar experience.
  - Experience with webservices and API frameworks (Flask,
    FastAPI, etc.).
  - Experience with relational or non-relational databases (MS
    SQL Server).
  - Knowledge of distributed systems and cloud-based computing
    (Azure).
  - Familiarity with machine learning frameworks and libraries
    (e.g., TensorFlow, PyTorch, Sklearn).

  Knowledge, Skills, and Abilities

  - Self-Starter to decompose a problem and plan a solution.
  - Ability to quickly learn new technologies and adapt to
    changes in technology and the business environment.
  - Highly adaptive to changing circumstances, with the ability
    to tackle problems quickly.
  - Excellent written and verbal interpersonal skills.
  - Excellent organization, scheduling, project management and
    multi-tasking skills.
  - Ability to write clean, efficient, and well-documented code.
  - Interest in continuous learning opportunities as the
    software landscape continues to evolve.
  - Capable and comfortable effectively presenting in front of
    your peers.
  - Proficient in effectively prioritizing and executing tasks
    in fast-paced, high-pressure environments.
  - Highly self-motivated and proactive.
  - Demonstrates meticulous attention to detail.
  - Comfortable engaging and presenting to C-level executives
    from time to time.
  - Employee must be legally authorized to work in the country
    of the job position as a precondition of employment.

  Travel

  Minimal travel required.

  Who We Are

  OneStream is how today’s Finance teams can go beyond just
  reporting on the past and Take Finance Further™ by steering
  the business to the future. It’s the only enterprise finance
  platform that unifies financial and operational data, embeds
  AI for better decisions and productivity, and empowers the
  CFO to become a critical driver of business strategy and
  execution.    Our vision is to be the AI operating system
  for modern finance, digitizing core financial functions and
  empowering the CFO to become a critical driver of business
  strategy. To learn more visit www.onestream.com.

  Why Join the OneStream Team

  - Transparency around corporate structure, salary, and
    benefits
  - Core value of customer success
  - Variety of project work (not industry specific)
  - Strong culture and camaraderie
  - Multiple training opportunities

  Benefits at OneStream

  OneStream employees are passionate, hardworking individuals
  who go above and beyond to keep our customers happy and
  follow through on our mission statement. They consistently
  deliver the best and in turn, we make every effort to keep
  them cared for and happy. A sample of the benefits we
  provide are:

  - Excellent Medical Plan
  - Dental & Vision Insurance
  - Life Insurance
  - Short & Long Term Disability
  - Vacation Time
  - Paid Holidays
  - Professional Development
  - Retirement Plan

  All candidates must be legally authorized to work for any
  company in the country where this position is located
  without sponsorship.

  OneStream is an Equal Opportunity Employer.

