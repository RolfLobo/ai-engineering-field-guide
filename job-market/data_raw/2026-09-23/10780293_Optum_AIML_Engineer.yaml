description: |
  Requisition Number: 2373270 Optum is a global organization
  that delivers care, aided by technology to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. Primary Responsibilities:

  - Develop and deploy innovative AI solutions to various
    business problems. You will have the opportunity to learn
    and apply some of the most cutting-edge AI technologies
  - Research and evaluate new data sources, AI technology trends
    and methodologies to enhance Organization level data
    science capabilities and solutions
  - Perform data analysis, pre-processing and feature
    engineering required to ensure quality and reliability of
    the AI models and optimize them for performance and
    robustness
  - Comply with the terms and conditions of the employment
    contract, company policies and procedures, and any and all
    directives (such as, but not limited to, transfer and/or
    re-assignment to different work locations, change in teams
    and/or work shifts, policies in regards to flexibility of
    work benefits and/or work environment, alternative work
    arrangements, and other decisions that may arise due to
    the changing business environment). The Company may adopt,
    vary or rescind these policies and directives in its
    absolute discretion and without any limitation (implied or
    otherwise) on its ability to do so

  Required Qualifications:

  - Graduate degree or equivalent experience
  - Bachelor's degree or higher in computer science engineering
    with a focus on language processing
  - 6+ years of experience in AI ML roles
  - Experience implementing multiple machine learning and AI
    techniques such as supervised, unsupervised, reinforcement
    learning, Deep learning, NLP
  - Proven good knowledge of and hands-on skills with repository
    management and GPU use, and the ability to rapidly set up
    NLP pipelines for testing new ideas
  - Familiarity with NLP literature, thrust areas, conference
    venues, and code repositories
  - Familiarity with UI tools like Streamlit, flask etc , FAST
    APIs , Rest APIs , Docker containers is must
  - Understanding of common NLP tasks such as text
    classification, entity recognition, entity extraction, and
    question answering
  - Understanding of Both Opensource and Open AI LLMs and RAG
    architecture
  - Proficiency in Python, pytorch , SQL and other programming
    languages for data analysis and modeling
  - Proficiency in libraries such as Hugging face and OpenAI API
  - Proficiency with cloud development environments such as
    Azure, AWS, and GCP has context menu
  - Proven exposure to developing solution in NLP space and
    relevant projects
  - Proven excellent analytical and problem-solving skills,
    including the ability to disaggregate issues, identify
    root causes and recommend solutions
  - Proven good grasp of using LLMs, Deploying LLMs

  Preferred Qualification:

  - Experience in ML and NLP R&D with demonstrable impact

  At UnitedHealth Group, our mission is to help people live
  healthier lives and make the health system work better for
  everyone. We believe everyone-of every race, gender,
  sexuality, age, location and income-deserves the opportunity
  to live their healthiest life. Today, however, there are
  still far too many barriers to good health which are
  disproportionately experienced by people of color,
  historically marginalized groups and those with lower
  incomes. We are committed to mitigating our impact on the
  environment and enabling and delivering equitable care that
  addresses health disparities and improves health outcomes -
  an enterprise priority reflected in our mission.
