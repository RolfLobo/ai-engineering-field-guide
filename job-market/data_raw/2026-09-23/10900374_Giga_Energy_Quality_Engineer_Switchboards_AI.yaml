title: "Quality Engineer, Switchboards & AI"
company: Giga Energy
location: Long Beach, USA
work_type: FULL_TIME
description: |
  About Giga

  Giga is building gigawatts of AI data centers to hasten a
  future of intelligence and abundance. We build data centers
  fast and at scale by combining the capabilities of an
  equipment supplier, engineering firm, general contractor,
  and real estate developer under one roof. Our team moves
  quickly and thinks practically. If you're ready to make an
  impact in an industry that matters, we're looking for people
  like you.

  Why join Giga

  - The Pace: We're building at a speed most companies talk
    about but never actually operate at. If you've been bored
    somewhere else, you won't be here.
  - The Impact: Every person at Giga touches the work that
    matters. No layers, no waiting for approval chains. You'll
    see your fingerprints on what we ship.
  - The Team: A team of operators defining the future of AI
    infrastructure. We recruit A-players from the most
    innovative companies in the world, and they choose Giga
    because the work here means more.
  - The Moment: AI doesn't run without power, and that's us.
    Giga is the picks and shovels behind the AI revolution.
    This industry is about to explode, and you'll be in the
    room where it's already happening.

  What you’ll do

  Giga Energy builds mission-critical power and cooling
  infrastructure for AI datacenters — chillers, e-houses,
  switchgear, and fully integrated AI pods delivered to
  hyperscaler and utility customers across North America. As
  Quality Engineer, you will be the hands-on quality owner for
  our newest and most complex product lines — the AI-specific
  equipment that's driving Giga's next phase of growth. You'll
  run incoming, in-process, and final inspection for these
  components, chase down supplier quality issues, and be the
  person who catches a defect before it ships. This is a
  technical, in-the-weeds role: less about building the
  quality org from scratch and more about being excellent at
  the day-to-day execution that keeps AI pod quality airtight
  as volume ramps.

  Where you’ll work

  We are an in-office culture — velocity matters when you're
  building physical infrastructure, and the best decisions
  happen in the room. This role is based in our Long Beach, CA
  office, with full-time onsite expectations.

  Responsibilities

  Quality System Execution

  - Execute quality procedures and work instructions for AI pod
    components (chillers, e-houses, switchgear) in alignment
    with the site's ISO 9001 QMS
  - Support internal and external audits, including ISO
    certification efforts, for AI product lines
  - Maintain the product compliance matrix mapping chillers,
    e-houses, switchgear, and AI pods to applicable UL, NEC,
    NEMA, and customer-specific requirements
  - Interface with UL Compliance Officers and third-party
    agencies during audits for AI equipment

  Supplier Quality — China, Mexico & India

  - Support supplier qualification, periodic re-qualification
    audits, and scorecard reviews for AI component suppliers
  - Execute Supplier Quality Agreements (SQAs) covering material
    certifications, First Article Inspection (FAI), critical
    specs, and dimensional tolerances
  - Issue Supplier Corrective Action Requests (SCARs) and drive
    to closure using 8D methodology; investigate root cause on
    repeat escapes
  - Support pre-shipment inspection checkpoints at overseas CM
    facilities to prevent quality escapes from reaching Giga
    facilities
  - Verify incoming materials meet specifications — manage PPAP-
    equivalent documentation (material certs, CoC, test
    reports)

  Incoming, In-Process & Final Inspection

  - Execute the incoming quality control (IQC) process for
    chillers, e-houses, and switchgear components — AQL-based
    sampling plans, accept/reject criteria, and non-conforming
    material (NCM) disposition
  - Build and maintain inspection checklists for critical AI pod
    components: bus bars, breakers, CTs, SPDs, chiller
    assemblies, and e-house structural/electrical elements
  - Execute in-process quality control plans (QCPs) and visual
    work instructions (VWIs) for safety-critical assembly
    operations — bus bar torquing, wiring termination, CT
    secondary connections
  - Perform final outgoing inspection and electrical test
    protocol: insulation resistance, continuity, CT polarity,
    and breaker functional tests — 100% on every unit
  - Maintain serialized test records and Certificate of
    Conformance (CoC) for every AI pod shipment
  - Execute routine, type, and special test protocols for
    chillers, e-houses, switchgear, and integrated AI pods

  Continuous Improvement

  - Lead root cause analysis using structured tools — 8D,
    Fishbone, 5-Why — for internal non-conformances and field
    failures on AI product lines
  - Collaborate with manufacturing engineers on Lean/Six Sigma
    initiatives to reduce defects, scrap, and rework
  - Track and report quality KPIs for AI components: incoming
    PPM, first-pass yield (FPY), scrap and rework rate, and
    warranty claim rate
  - Support digital systems used to capture, track, and resolve
    NCRs, SCARs, and customer complaints; maintain the
    calibration register for gauges and test equipment used on
    AI lines

  Customer & Compliance

  - Support the customer complaint process for AI product lines
    — intake, on-site investigation, 8D report, and formal
    closure within SLA (containment within 24 hours, full 8D
    within 30 days)
  - Support warranty claim investigation; represent Quality at
    customer sites during field investigations and
    commissioning inspections for AI pods
  - Ensure compliance with applicable safety and environmental
    regulations
  - Support interfacing with customers and regulatory agencies
    during audits, UL inspections, and project quality reviews

  Requirements

  - Degree in Mechanical, Electrical, Industrial Engineering, or
    a related technical field
  - 3+ years of experience in quality engineering in electrical,
    power, cooling, or industrial manufacturing
  - Solid understanding of UL 891/67 compliance or equivalent LV
    switchgear/panelboard standards
  - Experience with supplier quality processes in an
    international CM environment — audits, corrective actions,
    and FAI documentation
  - Proficiency in IQC sampling methodology and incoming
    inspection practices
  - Hands-on experience with PFMEA, control plans, and visual
    work instructions
  - Strong root cause analysis skills — 8D, Fishbone, 5-Why
  - Strong communicator — able to write clear technical reports
    and interface with cross-functional teams
  - Ability to collaborate effectively with cross-border
    engineering and production teams (China, Mexico, India,
    US)

  Bonus points

  - ASQ Certified Quality Engineer (CQE), Six Sigma Green Belt,
    or equivalent certification
  - Experience with cooling systems (chillers) or
    modular/prefabricated electrical enclosures (e-houses)
  - Experience using digital quality tools — ERP quality modules
    — to track NCRs, SCARs, and KPIs

  Pay Transparency

  The range provided below is the role’s Base Salary range.
  This salary range may be inclusive of several career levels
  at Giga and will be narrowed during the interview process
  based on a number of factors, including the candidate’s
  experience and qualifications. Additional benefits include
  401(k) plan plus subsidized medical, dental, and vision
  benefits.

  Base Pay Range

  $120,000—$150,000 USD

  How We Work

  We value people who take ownership, raise risks early,
  communicate directly, and follow through. Incomplete
  information is part of the job. Make the best decision you
  can, document it, and adjust as the facts change. Move
  quickly on reversible decisions and take more care when
  security, safety, financial, employee, or customer risk is
  involved.

  Benefits

  - Subsidized health, dental, and vision insurance
  - Equity (options) in a rapidly growing startup
  - 401(k) with 4% employer match
  - Unlimited PTO
  - Parental leave
  - Healthcare and Dependent Care Flexible Spending Accounts
    (FSA) or Health Savings Account (HSA)
  - Commuter benefits, where applicable
  - Opportunities to collaborate in person at periodic team and
    company on-sites

