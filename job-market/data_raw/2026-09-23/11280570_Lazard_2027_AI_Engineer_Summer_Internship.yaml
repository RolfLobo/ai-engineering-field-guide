description: |
  Lazard is one of the world’s preeminent financial advisory
  and asset management firms. Our people and culture make the
  difference. While global in presence and reach, ours is a
  close, collaborative community of just over 3,000
  professionals. Lazard is a place of continuous knowledge
  sharing, skill development and relationship building, where
  professionals grow and succeed together. Our entrepreneurial
  culture, flat structure and embrace of individual
  differences, allow creative ideas, original concepts, and
  unique perspectives to drive our business forward — and for
  careers to take flight.



  The Lazard AI and Data Group brings together data
  scientists, data engineers, AI engineers, and software
  engineers to develop advanced AI and data-driven solutions
  that enhance decision-making across Lazard’s Financial
  Advisory and Asset Management businesses. The team delivers
  practical insights and technology that support client
  engagements, strengthen strategic partnerships, and help the
  firm remain competitive and efficient in a rapidly evolving
  financial landscape.

  Operating as Lazard’s internal innovation engine, the group
  identifies opportunities to improve business processes
  through technology and develops solutions from end to
  end—from concept development and design through deployment,
  performance analysis, and continuous iteration.

  The AI Engineer Summer Intern will work within the AI & Data
  Team. The primary responsibility is to design, prototype,
  test, and deploy AI-driven applications and data products
  that leverage machine learning, natural language processing,
  and generative AI. Team members at every level have
  meaningful agency throughout the product-development cycle,
  with direct interaction and rapid feedback loops from senior
  investment bankers in Financial Advisory and portfolio
  managers in Asset Management.

  We’re all-in on the cloud and are a leader in the adoption
  of new technologies. Successful candidates should have a
  strong programming, machine learning, and problem-solving
  background.

  Eligibility Criteria:

  - Ability to start internship June 7, 2027 and end August 13,
    2027
  - Ability to be in NYC for the duration of the internship

  In addition to above, we will also need to see:

  - A Bachelor or advanced degree in Computer Science, Machine
    Learning, Artificial Intelligence, or a related field.
  - Strong programming skills in Python. Experience with object-
    oriented or functional programming.
  - Familiar with large language model (LLM) frameworks.
  - Interested in (and ideally some exposure to) agentic
    workflows, autonomous AI systems, and MCP (Model Context
    Protocol) agent development.
  - Knowledge of unstructured data processing and NLP techniques
    (e.g., entity recognition, text classification, sentiment
    analysis, RAG).
  - Exposure to cloud platforms such as AWS, Azure, or GCP.
  - Familiarity with APIs and microservices frameworks.
  - Experience with relational and NoSQL databases.
  - Comfortable working with Git, CI/CD tools, and modern
    development workflows. Exposure to containerization and
    orchestration tools.
  - A passion for building innovative, high-quality AI
    applications.
  - The ability to work both independently and collaboratively
    as a team player.
  - Interested in the finance industry, especially the
    investment banking or asset management divisions.

  Does this sound like you?

  Apply! We’ll get in touch and let you know the next steps.

  We expect the prorated salary for this role to be
  approximately $135,000 USD for the duration of the duration
  of the internship. The internship will be approximately 10
  weeks starting in June of 2027 and concluding in August
  2027.


  Representation at Lazard

  Lazard is an intellectual capital business committed to
  delivering the best advice and solutions to clients. To
  achieve these objectives, we focus on attracting, developing
  and retaining the best talent. We believe that a workforce
  comprised of people who represent a wide array of
  backgrounds, experiences and perspectives creates a rich
  variety of thought that empowers us to challenge
  conventional wisdom, solve problems creatively and make
  better decisions.

  Lazard was built on the premise that a multicultural firm
  can best serve a global clientele. As a global firm that has
  grown organically from local roots in different countries,
  we have a deep tradition of respecting and appreciating
  individual differences. Doing so has been core to our
  success for over 175 years. We are committed to sustaining
  an environment where every colleague is supported in their
  professional pursuits, can maximize their individual
  potential and contribute to our collective success.
