description: |
  The Opportunity As an AI Engineer specializing in AML and
  Sanctions, you will leverage data and analytics to provide
  strategic insights and drive informed decision-making for
  clients within our Risk & Regulatory practice. You will
  develop and implement innovative solutions to optimize
  business performance and enhance competitive advantage. As a
  Manager, you will motivate, develop, and inspire others to
  deliver quality, while coaching and leveraging team members'
  unique strengths to meet client expectations. You will play
  a crucial role in identifying opportunities that contribute
  to the success of our firm, leading with integrity and
  authenticity, and embracing technology and innovation to
  enhance delivery. In this role at PwC, you will analyze and
  identify the interactions between system components, take
  ownership of projects, and validate successful planning,
  budgeting, execution, and completion. You will engage in
  difficult conversations with clients and team members,
  addressing conflicts and escalating issues when necessary.
  Your growing business knowledge will be instrumental in
  articulating our purpose and values meaningfully,
  encouraging others to develop skills beyond their comfort
  zones. You will uphold professional and technical standards,
  reinforcing the firm's code of conduct and independence
  requirements. Responsibilities
  - Leading the development and implementation of data-driven
    solutions to optimize business performance
  - Guiding teams in the strategic planning and execution of
    analytics initiatives
  - Utilizing advanced analytics techniques to provide strategic
    insights and drive informed decision-making for clients
  - Building and maintaining relationships with stakeholders to
    identify and address data challenges
  - Developing scalable data visualization and analytics
    solutions to enhance competitive advantage
  - Promoting the use of innovative technologies and leading
    practices across analytics teams
  - Validating data integrity, security, and compliance within
    analytics frameworks
  - Identifying opportunities for optimizing data utilization
    and improving business outcomes
  - Mentoring team members to leverage their unique strengths
    and manage performance effectively
  - Analyzing and identifying linkages and interactions between
    system components to enhance delivery
  What You Must Have
  - At least a Bachelor's degree
  - At least 5 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Accounting, Analytics/Data Science,
    Biology/Biomedical Sciences, Business
    Administration/Management, Computer Science/Information
    Systems, Economics, Engineering, Finance, Financial
    Mathematics/Quantitative Finance, Health
    Administration/Public Health, Mathematics/Statistics,
    Operations/Supply Chain, Project/Technology Management,
    Risk Management/Insurance, Science
  - Demonstrating proficiency in Python and data analytics tools
  - Utilizing Business Intelligence Development Studio for
    strategic insights
  - Excelling in data visualization with platforms like Spotfire
  - Applying analytical thinking to solve complex financial
    crimes
  - Embracing continuous process improvement in client
    engagements
  - Leading teams in developing innovative AI solutions
  The salary range for this position is: $99,000 - $232,000.
  Actual compensation within the range will be dependent upon
  the individual's skills, experience, qualifications and
  location, and applicable employment laws. All hired
  individuals are eligible for an annual discretionary bonus.
