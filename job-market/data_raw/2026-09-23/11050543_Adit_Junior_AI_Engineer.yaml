description: |
  About the Role:

  We are looking to hire for enthusiastic and driven Junior
  Software Engineers to join our AI Team. The ideal candidates
  should have foundational experience in AI/LLM development
  and Python, along with a strong interest in building and
  enhancing AI-driven solutions. This role offers an excellent
  opportunity to work on cutting-edge AI and LLM projects
  while collaborating with cross-functional teams.

  Key Responsibilities:

  - Assist in the deployment of AI/LLM-based applications and
    tools.
  - Work with senior team members to implement and fine-tune
    machine learning and large language model (LLM) solutions.
  - Analyze, interpret, and validate outputs generated by AI
    tools such as ChatGPT.
  - Support research activities related to AI, LLMs, and
    emerging technologies.
  - Collaborate with the team to troubleshoot issues and
    optimize existing models and scripts.
  - Prepare clear documentation for code, experiments, and
    project workflows.

  Required Qualifications:

  - 6 Months to 1 year of experience in AI/LLM development and
    Python programming.
  - Candidates with relevant AI internships or hands-on academic
    projects will also be considered.
  - Strong understanding of Python fundamentals and basic
    machine learning concepts.
  - Familiarity with AI frameworks or tools (e.g., TensorFlow,
    PyTorch, Hugging Face) is a plus.
  - Ability to comprehend, interpret, and reason with outputs
    generated by LLM tools such as ChatGPT.
  - Strong communication skills and the ability to work in a
    collaborative, research-driven environment.

  Desired Skills:

  - Knowledge of prompt engineering or experience experimenting
    with LLM APIs.
  - Understanding of data processing workflows and NLP concepts.
  - Problem-solving skills with a willingness to learn and
    explore new technologies.

  Why Adit?

  ► We trust our people and offer completely remote
  opportunities.

  ► Flexible work schedules for better work-life balance.

  ► Group of 700+ Agile, Smart and Dynamic IT Professionals.

  ► Supportive and collaborative work environment.

  ► 5 days working company (Monday - Friday). All weekends are
  Off!

  ► Great working and learning environment

  ► Company Sponsored Insurance!
