description: |
  The Applications Development Senior Programmer Analyst is an
  intermediate level position responsible for participation in
  the establishment and implementation of new or revised
  application systems and programs in coordination with the
  Technology team. The overall objective of this role is to
  contribute to applications systems analysis and programming
  activities. Responsibilities:

  - Design, develop, and maintain high-performance, scalable,
    and resilient enterprise applications using Java, Spring
    Boot, and Hibernate.
  - Develop and consume RESTful APIs and microservices to
    support various business functions.
  - Implement and manage real-time data processing pipelines and
    messaging systems using Kafka.
  - Build responsive, user-friendly front-end interfaces and
    single-page applications using Angular.
  - Write efficient, complex SQL queries, and perform database
    management, including schema design, optimization, and
    data modeling.
  - Design, develop, and integrate AI/ML models and solutions
    into enterprise applications, leveraging Python and AI
    development kits.
  - Utilize frameworks like LangChain to build advanced natural
    language processing and generative AI applications.
  - Participate in all phases of the software development
    lifecycle (SDLC), including analysis, design,
    construction, testing, and implementation.
  - Conduct feasibility studies, provide time and cost
    estimates, and contribute to IT planning and risk
    assessment.
  - Collaborate with business analysts and users to understand
    requirements and translate them into technical solutions,
    including AI/ML solutioning.
  - Recommend and implement security best practices to ensure
    the integrity and safety of application systems.
  - Provide operational support, troubleshoot production issues,
    and consult with users and other technology groups to
    provide advanced programming solutions.
  - Serve as a subject matter expert (SME) and mentor to junior
    analysts, helping to define operating standards and
    essential procedures, particularly in full-stack and AI
    development.
  - Appropriately assess risk when business decisions are made,
    demonstrating particular consideration for the firm's
    reputation and safeguarding Citigroup, its clients, and
    assets.

  Recommended Qualifications:

  Technical Skills

  - Programming Languages: Proficient in Java and Python.
  - Frameworks & Libraries: Extensive experience with Spring
    Boot, Hibernate, Angular, and AI frameworks like
    LangChain.
  - Messaging Systems: Hands-on experience with Apache Kafka for
    building event-driven architectures.
  - Database: Strong proficiency in SQL and experience with
    relational database management systems (e.g., Oracle,
    PostgreSQL).
  - Architecture: Solid understanding of microservices
    architecture, RESTful services, design patterns, and AI/ML
    system architecture.
  - AI Development Kits: Experience with AI Development Kits
    (e.g., ADK).
  - Experience: 5-8 years of relevant experience in full-stack
    systems analysis and programming of software applications,
    with a focus on integrating AI/ML capabilities.

  Professional Skills

  - Proven experience in managing and implementing successful
    projects, including those with AI/ML components.
  - Working knowledge of consulting and project management
    techniques/methods.
  - Excellent problem-solving skills with the ability to analyze
    complex issues and make sound evaluative judgments,
    especially in complex full-stack and AI environments.
  - Ability to operate with a limited level of direct
    supervision and exercise independence of judgment and
    autonomy.
  - Strong communication and interpersonal skills to act as an
    advisor to senior stakeholders and team members, including
    explaining complex AI concepts.
  - Ability to work effectively under pressure and manage
    deadlines or unexpected changes in requirements

  Education:

  - Bachelor’s degree/University degree or equivalent experience
    in Computer Science, Engineering, or a related field.

  This job description provides a high-level review of the
  types of work performed. Other job-related duties may be
  assigned as required.

