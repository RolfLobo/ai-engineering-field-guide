description: |
  About Chubb

  Chubb is a world leader in insurance. With operations in 54
  countries and territories, Chubb provides commercial and
  personal property and casualty insurance, personal accident
  and supplemental health insurance, reinsurance and life
  insurance to a diverse group of clients. The company is
  defined by its extensive product and service offerings,
  broad distribution capabilities, exceptional financial
  strength and local operations globally. Parent company Chubb
  Limited is listed on the New York Stock Exchange (NYSE: CB)
  and is a component of the S&P 500 index. Chubb employs
  approximately 40,000 people worldwide. Additional
  information can be found at: http://www.chubb.com/

  About Chubb India

  At Chubb India, we are on an exciting journey of digital
  transformation driven by a commitment to engineering
  excellence and analytics. With a team of over 2500 talented
  professionals, we foster a startup mindset that promotes
  collaboration, diverse perspectives, and a solution driven
  attitude. We are dedicated to building expertise in
  engineering, analytics, and automation, empowering our teams
  to excel in a dynamic digital landscape. We offer an
  environment where you will be part of an organization that
  is dedicated to solving real-world challenges in the
  insurance industry. Together, we will work to shape the
  future through innovation and continuous learning.

  Position Details:

  Job Title: Principal Engineer

  Function/Department: Technology

  Location: Hyderabad/Bangalore

  Employment Type: Full-time

  We are looking for a Principal Engineer who is a force
  multiplier who shapes technical direction, eliminates
  ambiguity, and raises the ceiling of what teams believe is
  possible. You are deeply technical, opinionated, and you
  default to building with AI. You have integrated LLMs, built
  RAG pipelines, or designed agentic systems — not as a side
  project, but as production-grade work. You will set the
  architectural north star for our .NET and Azure platforms
  while driving the AI engineering standard across the
  engineering organization.

  Key Responsibilities:

  - Embed AI natively into system design — LLM-powered features,
    intelligent pipelines, semantic layers, and AI-augmented
    developer tooling are part of your design vocabulary.
  - Evaluate and adopt AI/ML tools, frameworks, and services for
    enterprise use — with genuine hands-on depth, not vendor
    briefings.
  - Define engineering standards: CI/CD, observability, testing,
    IaC, and AI model lifecycle management.
  - Own the technical strategy and architecture for large-scale,
    cloud-native systems on Azure (.Net and/or Java).
  - Be the last line of technical defence: complex design
    challenges, cross-system dependencies, and high-stakes
    architectural decisions land with you.
  - Mentor senior engineers and future principals; invest
    seriously in technical talent development.
  - Partner with senior business and technology stakeholders to
    translate strategic intent into executable architecture.
  - Drive performance, cost efficiency, security, and compliance
    in Azure-based deployments.

  What We're Looking For:

  - Mastery of Java Stack or .NET Stack, Entity Framework, async
    programming, and advanced system design.
  - Deep hands-on Azure experience: App Services, Functions,
    Service Bus, Event Hubs, Azure SQL, Cosmos DB, Key Vault,
    API Management.
  - You have built production systems that integrate LLMs,
    semantic search, or agentic workflows — this is mandatory,
    not preferred.
  - Strong understanding of microservices, distributed systems,
    containerization (Docker, Kubernetes), and cloud-native
    patterns.
  - Experience with Azure DevOps, GitHub Actions, IaC with
    ARM/Bicep/Terraform.
  - Ability to engage C-suite and senior business stakeholders
    with clarity and conviction.
  - Prior experience in insurance, fintech, or banking is
    advantageous.

  Qualifications

  Qualifications:

  - Degree in Computer Science, Engineering, or equivalent.
  - 15+ years in software engineering, with at least 5 years in
    technical/architectural leadership.
  - Depth of AI-native delivery is the key signal, not years
    alone.

  Why Join Us?

  - Be at the forefront of digital transformation in the
    insurance industry.
  - Lead impactful initiatives that simplify claims processing
    and enhance customer satisfaction.
  - Work alongside experienced professionals in a collaborative,
    innovation-driven environment.

  Why Chubb?

  Join Chubb to be part of a leading global insurance company!

  Our constant focus on employee experience along with a
  start-up-like culture empowers you to achieve impactful
  results.

  - Industry leader: Chubb is a world leader in the insurance
    industry, powered by underwriting and engineering
    excellence
  - A Great Place to work: Chubb India has been recognized as a
    Great Place to Work® for the years 2023-2024, 2024-2025
    and 2025-2026
  - Laser focus on excellence: At Chubb we pride ourselves on
    our culture of greatness where excellence is a mindset and
    a way of being. We constantly seek new and innovative ways
    to excel at work and deliver outstanding results
  - Start-Up Culture: Embracing the spirit of a start-up, our
    focus on speed and agility enables us to respond swiftly
    to market requirements, while a culture of ownership
    empowers employees to drive results that matter
  - Growth and success: As we continue to grow, we are steadfast
    in our commitment to provide our employees with the best
    work experience, enabling them to advance their careers in
    a conducive environment

  Employee Benefits

  Our company offers a comprehensive benefits package designed
  to support our employees’ health, well-being, and
  professional growth. Employees enjoy flexible work options,
  generous paid time off, and robust health coverage,
  including treatment for dental and vision related
  requirements. We invest in the future of our employees
  through continuous learning opportunities and career
  advancement programs, while fostering a supportive and
  inclusive work environment. Our benefits include:

  - Savings and Investment plans: We provide specialized
    benefits like Corporate NPS (National Pension Scheme),
    Employee Stock Purchase Plan (ESPP), Long-Term Incentive
    Plan (LTIP), Retiral Benefits and Car Lease that help
    employees optimally plan their finances
  - Upskilling and career growth opportunities: With a focus on
    continuous learning, we offer customized programs that
    support upskilling like Education Reimbursement Programs,
    Certification programs and access to global learning
    programs.
  - Health and Welfare Benefits: We care about our employees’
    well-being in and out of work and have benefits like
    Hybrid Work Environment, Employee Assistance Program
    (EAP), Yearly Free Health campaigns and comprehensive
    Insurance benefits.

  Application Process

  Our recruitment process is designed to be transparent, and
  inclusive.

  - Step 1: Submit your application via the Chubb Careers
    Portal.
  - Step 2: Engage with our recruitment team for an initial
    discussion.
  - Step 3: Participate in Hacker Rank
    assessments/technical/functional interviews and
    assessments (if applicable).
  - Step 4: Final interaction with Chubb leadership.

  Join Us

  With you Chubb is better. Whether you are solving challenges
  on a global stage or creating innovative solutions for local
  markets, your contributions will help shape the future. If
  you value integrity, innovation, and inclusion, and are
  ready to make a difference, we invite you to be part of
  Chubb India’s journey.

