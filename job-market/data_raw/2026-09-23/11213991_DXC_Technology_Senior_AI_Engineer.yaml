description: |
  Job Description:

  Senior Generative AI Engineer

  Job Location : Hyderabad / Bangalore / Chennai / Kolkata /
  Noida/ Gurgaon / Pune / Indore / Mumbai

  Experience: 4 to 16 Years

  Expertise: 2-3 years of experience in designing and
  implementing generative AI solutions, including knowledge of
  various generative and autoregressive models. Ability to
  apply generative AI techniques to diverse use cases such as
  image generation, text generation, and creative content
  synthesis.

  • 2 years of experience in prompt engineering, fine tuning,
  agentic framework, GenAI SDK’s

  • 1-2 years of experience in Agentic AI frameworks like
  Autogen, Lanngraph, MS Agent SDK, A2A, MCP, A2P, memory
  concepts, multi agent orchestration

  • 7+ years of experience in Python

  • 5+ years of experience in software development

  • Azure Proficiency: 3-5 years of experience with Azure
  cloud services relevant to AI, including Azure Machine
  Learning, Azure Cognitive Services, Azure Databricks, and
  Azure Kubernetes Service (AKS). 2+ years of experience in
  Azure's capabilities to architect end-to-end AI solutions
  and optimize performance.

  • Architecture Design: 3-5 years of skills with the ability
  to design scalable, reliable, and cost-effective
  architectures for AI solutions. Proficiency in designing
  distributed systems, microservices architectures, and
  containerized solutions using technologies such as Docker
  and Kubernetes.

  At DXC Technology, we believe strong connections and
  community are key to our success. Our work model prioritizes
  in-person collaboration while offering flexibility to
  support wellbeing, productivity, individual work styles, and
  life circumstances. We’re committed to fostering an
  inclusive environment where everyone can thrive.

