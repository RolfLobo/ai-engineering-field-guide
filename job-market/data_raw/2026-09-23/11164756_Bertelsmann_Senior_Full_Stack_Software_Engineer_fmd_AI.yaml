description: |
  Company Description

  Remote in our day-to-day work. On-site when it matters. We
  work remote by default – focused, efficient, and with full
  ownership. For larger features, architectural decisions, and
  real brainstorming sessions, we come together in Berlin –
  fast, hands-on, and without unnecessary meeting overhead.

  We use AI to accelerate – not to replace thinking. We design
  the system, steer the output, and take responsibility for
  what we ship. Fast where it makes sense. Careful where it
  matters.

  Job Description

  You stopped coding. And that’s exactly why we want you.

  Software is changing. AI agents are changing how people
  interact with products – and we’re building for what comes
  next.

  Join our UI Engineering team and build production-grade
  products at the intersection of AI, engineering, UX and
  product. You’ll shape not just how our products look and
  work, but how people will interact with them in the future.

  Be an engineer. Think like a Product Builder.

  Your Mission

  Own the experience. Own the technology. Build what comes
  next.

  - Build production-grade applications with React, Next.js,
    TypeScript and Node.js – from UI to APIs and services.
  - Design AI-native experiences: conversational UIs, agent-
    driven workflows and natural-language interactions.
  - Use AI as an engineering multiplier. Explore, prototype,
    implement, debug and test faster – while staying firmly in
    control of architecture, quality and the final result.
  - Understand the customer, the business and the problem before
    deciding what to build.
  - Challenge assumptions, simplify complexity and turn
    ambiguity into products people actually use.
  - Shape scalable architectures, APIs and data structures
    across the stack.
  - Collaborate with Product, UX/UI and Engineering to make
    better decisions together.
  - Raise the bar for testing, performance, maintainability and
    engineering quality.

  You’re not here to turn tickets into components. You’re here
  to decide what should be built – and then build it.

  Qualifications

  Your Skills



  - Think and work AI-native. You already use AI as part of your
    engineering workflow and have developed your own approach
    to getting from idea to production-ready code.
  - Bring 5+ years of hands-on full-stack JavaScript experience
    and a strong track record of shipping real applications.
  - Bonus: AWS, Jenkins, Grafana, Graylog, Confluence, Jira,
    shell scripting.
  - Master React, Next.js, TypeScript and Node.js and understand
    modern web architectures.
  - Make confident technical decisions around architecture,
    performance, scalability and maintainability.
  - Build and test production-grade software. Hands-on
    experience with Jest, Vitest or Node.js testing is
    essential.
  - Work confidently with APIs and data: REST, database design
    and SQL; GraphQL is a plus.
  - Think beyond the code. You’re curious about customers,
    products and the business and use that context to make
    better technical decisions.
  - Take ownership of outcomes, not just implementation.
  - Stay curious about what’s next. Experience with AI-first
    interfaces, agent workflows or natural-language products
    is a plus.

  Additional Information

  Why you’ll love working with us

  - Ownership over tickets: You’re trusted with real
    responsibility, not just tasks. No unnecessary
    bureaucracy, no micromanagement – we rely on you to take
    things forward.
  - Build > Talk: We test what works – not what sounds good.
    Fail fast, learn faster.
  - High standards, low ego: We take our work seriously, but not
    ourselves. Direct feedback, honest collaboration, no
    drama.
  - Stay sharp: Hackathons, conferences, community – we invest
    in your growth and keep you at the cutting edge.
  - And yes – the fundamentals are covered too: 30 days of
    vacation + Dec 24 & 31 off, Smart Fridays (4 days week
    possible), mobility (Germany ticket & JobRad), sports &
    health offerings, mental health support, corporate
    benefits, RTL+ access, and more.

  Your CV is just the starting point.

  What matters more to us than your resume: a portfolio, a
  side project, a demo repo – anything that shows you don’t
  just talk about code, you ship it. Production-ready. Thought
  through. Done.

