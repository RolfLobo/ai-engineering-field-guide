  - Leadership & Collaboration:
    - Solid leadership, communication, and stakeholder management
      skills
    - Proven ability to mentor teams, lead architectural
      decisions, and conduct technical reviews across cloud,
      AI/ML, and data domains
    - Ability to present complex technical concepts and analytical
      insights to both technical and non-technical audiences
    - Solid foundation in data science concepts, including
      statistics, probability, optimization, simulation, and
      data modeling

