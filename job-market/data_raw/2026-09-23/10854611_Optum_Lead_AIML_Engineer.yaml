  - Technical Skills:
    - Cloud & IaC: Hands-on experience with AWS, Azure, GCP, and
      Infrastructure as Code tools like Terraform and
      CloudFormation
    - Databases: Solid proficiency in MongoDB and relational
      databases such as PostgreSQL, MySQL, and SQL Server
    - Security & Compliance: Expertise in designing secure systems
      aligned with enterprise standards (IAM, KMS, secret
