  Required Qualifications:

  - Bachelor's or Master's degree in Computer Science, Data
    Science, or a related field
  - 10+ years of experience in software engineering with a
    proven track record in building high-quality, scalable
    applications
  - 6+ years of expertise in Java, NodeJS, and GraphQL
  - 3+ years of hands-on experience with cloud platforms (AWS,
    Azure, GCP), with solid proficiency in AWS
  - 3+ years of experience with GraphQL and NodeJS
  - 1+ years of experience in AI/ML engineering, including
