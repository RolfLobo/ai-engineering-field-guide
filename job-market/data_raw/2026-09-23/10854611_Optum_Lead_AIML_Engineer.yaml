      evaluation, optimization, and production deployment
  - AI Strategy & Governance
    - Define architectural roadmaps, reference frameworks, and
      standard operating procedures (SOPs)
    - Ensure solutions align with organizational standards for
      reliability, fairness, transparency, and security
  - Team Leadership
    - Provide technical leadership and mentorship across cloud,
      AI/ML, and data engineering teams
