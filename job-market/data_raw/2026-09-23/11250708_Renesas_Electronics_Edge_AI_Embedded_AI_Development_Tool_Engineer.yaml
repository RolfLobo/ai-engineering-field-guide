title: Edge AI / Embedded AI Development Tool Engineer
company: Renesas Electronics
location: IND
remote: true
work_type: FULL_TIME
company_size: 10,040 Employees
description: |
  Job Description

  【Background】

  Edge AI is one of Renesas’s key secular growth areas.Within
  this domain, Reality AI delivers advanced AI for sensing
  applications and is a critical solution that will also
  support the newly evolving Renesas365 platform. Our team is
  strengthening the development of solutions for Edge AI, and
  we are looking for individuals who can drive the development
  of AI tools. In this role, you will simplify customers' AI
  software development and make cutting-edge Edge AI
  accessible and practical, creating a highly rewarding
  opportunity to drive real-world impact.

  【Job Description】

  Technical Domain: Development tools for Embedded AI (PC-
  based tools and cloud-based tools)

  Target Products: Reality AI, Renesas365

  Project Overview: You will develop tool products that enable
  deployment of AI models onto embedded devices, as well as
  visualization and tuning of their performance and results.
  The role requires consideration of resource constraints
  typical of embedded systems (such as performance and
  memory), along with designing intuitive and user-friendly
  UIs that allow engineers to proceed with development
  smoothly and efficiently.

  Responsibilities: Specification definition, design,
  implementation, and evaluation of tool products

  ※The full details regarding your position scope as well as
  any future potential changes in work location and job scope
  will be provided during the interview process.



  Qualifications

  【MUST】

  - Basic knowledge of AI / machine learning, or hands-on
    experience with frameworks such as TensorFlow or PyTorch
  - Fundamental understanding of embedded software (C language)
  - Experience in developing PC-based and/or cloud-based
    applications
  - Japanese: Business Level (JLPT N2)
  - English: Communication Level

  【WANT】

  - Experience in designing and developing GUI applications
    using Java or C#, including user-centric UI/UX design
  - Experience owning the full software development lifecycle,
    from specification and design through implementation and
    evaluation
  - Experience in designing and developing cloud tools and web
    applications, including architecture design, APIs, and
    front-end and back-end development

  Additional Information

  ルネサスは、「To Make Our Lives Easier（人々の暮らしをより豊かで快適にする）」というPurpos
  eのもと、組込み半導体ソリューションを提供するグローバル企業です。世界30か国以上で活躍する21,000人を超えるエンジ
  ニアや課題解決のプロフェッショナルとともに、自動車、産業、インフラ、IoT分野における世界最先端のテクノロジー開発に携わ
  り、より安全で、健康的で、環境にやさしく、スマートな未来の実現に貢献しています。



  ルネサスでは、「TAGIE（Transparent、Agile、Global、Innovative、Entreprene
  urial）」を企業文化の中核としています。TAGIEは、私たちの働き方や成長のあり方、そしてPurposeの実現に向け
  た取り組みを支える共通の価値観です。この協調的な精神と挑戦するマインドセットが、半導体技術を通じた産業の変革と、世界中の
  人々の暮らしへの貢献を可能にしています。



  私たちは、競争力のある報酬制度に加え、充実した福利厚生をご用意しています。福利厚生の詳細については、選考プロセスの中でご
