description: |
  At Bristol Myers Squibb, our employees often ask, “Who are
  you working for?”—a question that fuels collaboration,
  accountability, and urgency in our work. Our purpose-driven
  culture inspires us to discover, develop, and deliver
  innovative medicines to prevail over serious diseases. We
  offer uniquely interesting and meaningful work,
  opportunities for growth, and a supportive environment that
  values inclusion, wellbeing, flexibility, and comprehensive
  benefits. This is work that transforms the lives of
  patients, and the careers of those who do it.

  Working With Us

  Challenging. Meaningful. Life-changing. Those aren’t words
  that are usually associated with a job. But working at
  Bristol Myers Squibb is anything but usual. Here, uniquely
  interesting work happens every day, in every department.
  From optimizing a production line to the latest
  breakthroughs in cell therapy, this is work that transforms
  the lives of patients, and the careers of those who do it.
  You’ll get the chance to grow and thrive through
  opportunities uncommon in scale and scope, alongside high-
  achieving teams. Take your career farther than you thought
  possible.

  Bristol Myers Squibb recognizes the importance of balance
  and flexibility in our work environment. We offer a wide
  variety of competitive benefits, services and programs that
  provide our employees with the resources to pursue their
  goals, both at work and in their personal lives. Read more:
  careers.bms.com/working-with-us.

  Role Overview

  We are seeking a motivated early-career professional
  (EG-100) to support AI-driven initiatives within the Quality
  organization.

  This role will contribute to the design, implementation, and
  continuous improvement of digital and AI-enabled solutions
  that enhance quality processes, compliance, and operational
  efficiency.

  This is an excellent opportunity for someone passionate
  about learning emerging technologies while working closely
  with Quality, IT, and cross-functional teams in a regulated
  environment.

  Key Responsibilities

  Support development and implementation of AI-enabled
  solutions to improve Quality processes

  Collaborate with Quality stakeholders to understand
  requirements and translate them into technology solutions

  Assist in data preparation, analysis, and validation for
  AI/ML models

  Contribute to digital transformation across laboratory and
  quality systems

  Support integration and enhancement of systems such as LIMS

  Document processes and workflows in a compliant environment

  Participate in testing, validation, and deployment

  Continuously learn and apply new technologies

  Basic Qualifications

  Bachelor’s degree in Computer Science, Engineering, Life
  Sciences, or related field

  Minimum 2 years of relevant experience

  Strong communication skills

  Ability and willingness to learn new technologies

  Strong work ethic

  Preferred Qualifications (Nice to Have)

  Familiarity with LIMS systems (LabWare, LabVantage, etc.)

  Exposure to laboratory environments or Quality processes

  Basic understanding of AI/ML or data analytics

  Experience with cloud platforms (e.g., AWS)

  Experience with workflow automation tools

  Experience in GxP environments

  Key Competencies

  Curiosity and passion for AI and digital innovation

  Strong problem-solving skills

  Collaboration and teamwork

  Adaptability in a fast-paced environment

  High integrity and accountability

  We hire for skills and capabilities, not just credentials –
  if this role excites you, but doesn’t perfectly match your
  resume, we encourage you to apply anyway.

