description: |
  Overview

  Are you insatiably curious, deeply passionate about the
  realm of databases and analytics, and ready to tackle
  complex challenges in a dynamic environment in the era of
  AI? If so, we invite you to join our team as a Solution
  Engineer - Cloud & AI Data Platform in Innovative Data
  Platform for commercial customers at Microsoft. Here, you'll
  be at the forefront of innovation, working on cutting-edge
  projects that leverage the latest technologies to drive
  meaningful impact. Join us and be part of a team that
  thrives on collaboration, creativity, and continuous
  learning.

  Databases & Analytics is a growth opportunity for Microsoft
  Azure, as well as its partners and customers. It includes a
  rich portfolio of products including IaaS and PaaS services
  on the Azure Platform in the age of AI. These technologies
  empower customers to build, deploy, and manage database and
  analytics applications in a cloud-native way.

  As an Solution Engineer - Cloud & AI Data Platform, you will
  play a pivotal role in helping enterprises unlock the full
  potential of Microsoft’s cloud database and analytics stack
  across every stage of deployment. You’ll collaborate closely
  with engineering leaders and platform teams to accelerate
  the Fabric Data Platform, including Azure Databases and
  Analytics, through hands-on engagements like Proof of
  Concepts, hackathons, and architecture workshops. This
  opportunity will allow you to accelerate your career growth,
  develop deep business acumen, hone your technical skills,
  and become adept at solution design and deployment. You’ll
  guide customers through secure, scalable solution design,
  influence technical decisions, and accelerate database and
  analytics migration into their deployment workflows. In
  summary, you’ll help customers modernize their data platform
  and realize the full value of Microsoft’s platform, all
  while enjoying flexible work opportunities.

  As a trusted technical advisor, you’ll guide customers
  through secure, scalable solution design, influence
  technical decisions, and accelerate database and analytics
  migration into their deployment workflows. In summary,
  you’ll help customers modernize their data platform and
  realize the full value of Microsoft’s platform.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  - Drive technical sales with decision makers using demos and
    PoCs to influence solution design and enable production
    deployments.
  - Lead hands-on engagements—hackathons and architecture
    workshops—to accelerate adoption of Microsoft’s cloud
    platforms.
  - Build trusted relationships with platform leads, co-
    designing secure, scalable architectures and solutions.
  - Resolve technical blockers and objections, collaborating
    with engineering to share insights and improve products.
  - Maintain deep knowledge in Analytics Portfolio: Microsoft
    Fabric (OneLake, DW, real-time intelligence, BI, Copilot),
    Azure Databricks, Purview Data Governance and Azure
    Databases: SQL DB, Cosmos DB, PostgreSQL.
  - Maintain and grow knowledge in on-prem EDW (Teradata,
    Netezza, Exadata), Hadoop & BI solutions.
  - Represent Microsoft through thought leadership in cloud
    Database & Analytics communities and customer forums.
  - Embody our culture and values

  Qualifications

  Required Qualifications:

  - 3+ years technical pre-sales or technical consulting
    experience, OR Bachelor's Degree in Computer Science,
    Information Technology, or related field AND 2+ years
    technical pre-sales or technical consulting experience OR
    Master's Degree in Computer Science, Information
    Technology, or related field AND 1+ year(s) technical pre-
    sales or technical consulting experience OR equivalent
    experience



  Other Requirements:

  - This position is not eligible for visa sponsorship.
    Candidates must have authorization to work in the United
    States that does not now or in the future require employer
    sponsorship.



  Preferred Qualifications:

  - 5+ years technical pre-sales, technical consulting, or
    technology delivery, or related experience OR equivalent
    experience
  - 3+ years experience with cloud and hybrid, or on premises
    infrastructure, architecture designs, migrations, industry
    standards, and/or technology management
  - Experience in data warehouse & big data migration including
    on-prem appliance (Teradata, Netezza, Oracle), Hadoop
    (Cloudera, Hortonworks) and Azure Synapse Gen2



