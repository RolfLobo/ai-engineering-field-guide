  - Implement data quality checks, logging, alerting, and
    observability for production pipelines
  - Collaborate with analytics, product, and platform teams to
    enable downstream data consumption
  - Participate in architecture design, code reviews, and
    technical decision-making
  - Troubleshoot and resolve complex production issues across
