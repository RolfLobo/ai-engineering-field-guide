  Required Qualifications:

  - B.Tech./MCA/Graduation
  - 4+ years of total experience
  - Solid hands-on experience with Databricks (Spark / PySpark)
    in production environments
  - Experience building and hosting REST APIs / data services
    using Python frameworks
  - Solid experience with Microsoft Azure, including cloud-
    native architecture and best practices
  - Experience with CI/CD pipelines, Git-based version control,
    and deployment automation is a plus
  - Proven expertise with Apache Airflow for workflow
    orchestration and dependency management
  - Solid working experience with Snowflake, including data
    modeling and performance tuning
  - Advanced Python programming skills for data engineering and
    API development
  - Solid understanding of data warehousing, ELT patterns, and
    modern cloud data architecture
  - Ability to independently own, design, and deliver end-to-end
    data engineering solutions

