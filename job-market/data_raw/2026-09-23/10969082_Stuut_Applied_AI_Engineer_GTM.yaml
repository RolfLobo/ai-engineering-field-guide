description: |
  Stuut is transforming how B2B companies turn revenue into
  cash. Businesses worldwide have trillions tied up in
  receivables, yet the work between order and payment still
  relies on fragmented systems and labor-intensive manual
  processes. Stuut’s AI agent works across order management,
  credit, collections, payments, cash application, disputes
  and deductions, carrying context through every step.
  Customers reduce DSO by 47%, collect 40% more cash and
  eliminate 70% of manual work without replacing their ERP.
  Stuut is already trusted by finance teams at companies
  including Honeywell, NCR and ZoomInfo, from Fortune 10
  enterprises to scaling mid-market businesses. We are backed
  by a16z, Khosla Ventures, Activant, 1984 Ventures, Page One
  and Microsoft.

  The Role

  We are hiring a Go-to-Market Engineer to further build and
  scale our audience acquisition engagement, and conversion
  efforts. You will work across every channel and medium at
  our disposal, improving what we’ve built and finding new
  ways to turn the right audiences into revenue.

  You will connect efforts across Marketing, Sales, and RevOps
  to make each one more effective. This is a high-ownership
  role for someone with a builder mindset, commercial
  instinct, unusual creativity, and technical aptitude. Your
  mission is to find and scale new demand, improve targeting
  and follow-up, reduce manual work, and turn the right
  companies into qualified meetings and pipeline.

  Audience Acquisition: Partner with the team to improve
  existing audience acquisition and use signals to find new
  channel or motion opportunities that produce qualified
  pipeline.

  Lead Response: Route each lead into the right follow-up or
  nurture workflow based on fit, source, intent, and behavior.

  Funnel Conversion: Improve conversion from lead to meeting
  to qualified meeting to S1, with channel-level visibility.

  Workflow Automation: Own the marketing technology and
  operational layer end to end—including campaigns, copy,
  workflows, and reporting—to reduce manual work and increase
  the speed and value of every lead.

  What You’ll Do

  - Activate demand by finding creative ways to reach the right
    audiences, improve what is already in market, and act on
    new segments, signals, and channels.
  - Orchestrate scalable, AI-enabled systems across every
    channel and medium so leads are captured, enriched,
    routed, nurtured, and converted. No lead gets left behind.
  - Continuously optimize audience acquisition and conversion
    through focused experiments, using data to scale what
    works and stop what doesn’t.
  - Automate content and workflows to reduce manual work and
    help the team scale.
  - In time, as the core funnel improves, take on broader
    ownership of Stuut’s channels and acquisition mix.

  You Might Be a Fit If You…

  - You have 2–5 years of experience in GTM engineering, growth
    engineering, RevOps, or performance roles.
  - You are a creative GTM builder who turns buyer insight,
    signals, and new ways of reaching buyers into pipeline.
  - You are highly technical and can build scalable workflows
    with modern GTM systems, data, automation, and AI.
  - You understand the full path from audience acquisition to
    qualified opportunity and use data and buyer behavior to
    find friction, test fixes, and scale what works.
  - You understand how buyers discover and evaluate products
    across the modern media landscape.
  - You earn buy-in across teams and create the momentum to put
    your plays in market.

  Compensation

  - Top-of-market salary and equity package
  - Benefits (for U.S.-based full-time employees)
  - Medical, dental & vision insurance coverage for you
  - 401(k) & Match
  - Equity
  - Flexible PTO
  - Parental Leave
