description: |
  At Almetra, we’re on a mission to reinvent how factories
  work.

  We help manufacturers - one of the most essential and
  overlooked sectors of our economy - run better. Every car,
  wind turbine, medical device, and washing machine comes from
  a factory. But factories today are running out of people.
  They struggle with efficiency, safety, and quality - and
  they desperately need better tools to understand what’s
  happening on the shop floor.

  That’s where we come in. Almetra builds AI-powered computer
  vision systems that give manufacturers deep visibility into
  how their production lines actually run - and the insights
  to improve them. We don’t sell ads or marketing software. We
  help real factories solve real problems.

  As a Solution Engineer, you’ll bridge two worlds: deep
  operational expertise and cutting-edge AI. You’ll work
  directly with our SDRs, AEs, and our Improvement team to
  land new customers, expand existing ones, and ensure every
  deployment delivers measurable impact.

  If you’ve worked in Continuous Improvement, Lean, or
  operational excellence, and you want to apply that expertise
  in a fast-moving tech company then this role is for you.

  Why join us

  - Impact that matters. You’ll help manufacturers solve real
    operational problems, not just implement software.
  - Shape the future of industrial AI. Your domain knowledge
    will directly influence product evolution and customer
    outcomes.
  - Cross-functional seat at the table. You’ll partner with
    Sales, Product, and Engineering to make deals successful
    and scalable.
  - Career acceleration. You’ll become an expert at translating
    factory processes into AI-powered improvements across
    global customers.

  What you’ll do

  - Partner with Sales to win deals by bringing credibility in
    operations, CI, and Lean.
  - Lead discovery sessions to understand current processes,
    bottlenecks, and improvement opportunities.
  - Translate real-world factory workflows into clear use cases
    and value stories for prospects.
  - Support pilots and deployments with the Improvement team to
    demonstrate measurable ROI.
  - Build playbooks for value quantification, before-after
    analysis, and operational storytelling.
  - Work with multiple stakeholders (ops, quality, engineering,
    production, CI, plant managers).
  - Help expand existing customers by identifying new use cases
    and improvement pathways.
  - Feed insights from the field back into Product to shape our
    roadmap.

  What we’re looking for

  - 3+ years in Continuous Improvement, Lean, Operational
    Excellence, digital transformation, or industrial
    engineering.
  - Experience in manufacturing operations, either at a plant or
    as a consultant.
  - Strong ability to analyze processes, identify bottlenecks,
    and quantify value.
  - Comfortable with shop-floor environments and talking to
    operators, engineers, and plant leaders.
  - Clear communicator who can explain complex processes simply
    and confidently.
  - Ability to run discovery, map workflows, and build
    compelling business cases.
  - Collaborative mindset and willingness to work closely with
    Sales, Product, and Engineering.
  - Curious about AI, automation, and the future of
    manufacturing.

  Bonus points

  - Experience with time studies, MTM, value stream mapping, or
    OEE programs.
  - Background supporting large-scale CI programs or Kaizen
    events.
  - Familiarity with enterprise software deployments in
    industrial environments.
  - Interest in turning CI knowledge into scalable, repeatable
    playbooks.
  - Fluent / Business German speaker

  What we offer

  Employee Share Options Program for all permanent employees*

  An increasing benefits list: currently includes Urban Sports
  club and quarterly team retreats.

  Be on the forefront in defining what artificial intelligence
  means in manufacturing

  Gain hands-on experience in working in an AI-first software
  company

  Supportive and inclusive culture that values diversity and
  promotes the advancement of underrepresented groups within
  the company

  Collaborate with a diverse (currently more than 10
  nationalities) and talented team, working on cutting-edge
  projects with real-world impact

  Network with professionals and leaders in the field, opening
  doors to potential future career opportunities

  We have a very flat hierarchy, open 360° feedback, and
  flexible working hours

  Ethics⚖: We are committed to developing ethical AI software
  Don't meet all the requirements?

  Almetra is committed to creating a workplace that is
  diverse, fair, and inclusive. We encourage candidates from
  all backgrounds, even if they do not meet every
  qualification, to submit their application. We firmly
  believe that having a team with diverse perspectives only
  strengthens our company and drives innovation. Our
  commitment also extends to providing an accessible
  environment for everyone, including those with disabilities.
  Please let us know if you require any accommodations during
  the application process or while working with us, and we
  will do our best to support you.

  *Only full-time, permanent roles are eligible for stock
  options. Part-time roles, contract roles, work-student,
  internships and freelance roles are not eligible for stock
  options.
