description: |
  Senior Manager, Product Management - Developer Experience,
  AI Coding Tools & Developer Research Product Management at
  Capital One is a booming, vibrant craft that requires
  reimagining the status quo, finding value creation
  opportunities, and driving innovative and sustainable
  customer experiences through technology. We believe our
  portfolio of businesses and investments in growth and
  transformation will result in a company with the scale,
  brand, capabilities, talent, and values to succeed as the
  digital revolution transforms our society and our industry.
  About the Team As a Senior Manager of Product Management for
  Inner Loop, you will own the measurement and acceleration of
  how 14K+ developers write, test, and ship code at Capital
  One. You'll define the metrics that engineering leaders use
  to invest, build data products that quantify developer
  productivity, and shape how the enterprise measures the
  impact of AI coding tools on the software development
  lifecycle. By turning developer experience data into
  actionable insights, you will directly influence how Capital
  One builds software faster, with higher quality, and less
  friction. We are looking for a data-driven product leader
  who is obsessed with measurement methodology and believes
  that what gets measured well gets improved. The team is
  hiring multiple positions across the following areas: CODE
  Metrics - Own the enterprise's developer productivity
  measurement platform. You'll define metrics that shape how
  engineering leaders invest, drive CODE Metrics framework
  expansion, and partner with Distinguished Engineers on
  methodology. AI Telemetry - Own the unified measurement
  framework for AI coding tools (Claude Code, Windsurf,
  Copilot). You'll define how we measure risk, utilization,
  and impact of AI across the SDLC, a brand-new space with
  executive visibility. Flight Attendant + DX Research - Own
  our in-house telemetry platform and developer experience
  research program. You'll drive coverage across 14K+
  developers and turn raw telemetry into enterprise insights.
  Capital One Product Framework In this role, you'll be
  expected to demonstrate proficiency in five key areas which
  we consider to be the foundation for successful Product
  management:

  - Human Centered - Obsesses about internal and external
    customer needs to reimagine and innovate product solutions
  - Business Focused - Delivers game-changing outcomes by
    focusing on leverage and execution excellence
  - Technology Driven - Leverages technology to deliver
    innovative and resilient solutions that enable both near
    term and long term value
  - Integrated Problem Solving - Identifies and resolves complex
    problems to deliver outcomes while mitigating product
    risks
  - Transformational Leadership - Leads cross functional teams
    to solve customer problems and drive organizational
    alignment

  Basic Qualifications:

  - Currently has, or is in the process of obtaining one of the
    following with an expectation that the required degree
    will be obtained on or before the scheduled start date:
    - A Bachelor's or Master's Degree in a quantitative field
      (Statistics, Economics, Operations Research, Analytics,
      Mathematics, Computer Science, Computer Engineering,
      Software Engineering, Mechanical Engineering,
      Information Systems or a related quantitative field),
      Business or Marketing

  OR

  - Bachelor's degree in any field and at least 4 years of
    Product Management experience

  Preferred Qualifications:

  - Experience translating business strategy and analysis into
    consumer facing digital products
  - Experience exploring, prototyping, or implementing emerging
    technologies and AI automation tools (such as Gemini,
    Claude, Claude Code, or Google Apps Script)
  - Experience developing tools for CI/CD and DevOps
  - Strong data fluency in SQL, metrics design, and data
    pipelines

