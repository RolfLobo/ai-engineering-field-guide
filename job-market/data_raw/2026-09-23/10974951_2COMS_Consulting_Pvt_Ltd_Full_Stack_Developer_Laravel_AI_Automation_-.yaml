description: |
  Full Stack Developer (Laravel / AI / Automation)

  Experience: 4-7 years

  Location: Kolkata/Hyderabad

  About the Role:

  We are looking for a hands-on Full Stack Developer with
  strong Laravel/PHP experience who can independently deliver
  features across frontend, backend, APIs, databases, testing,
  automation, and deployment. The ideal candidate will also
  have practical experience with Playwright, n8n, and AI/LLM
  integrations.

  Key Responsibilities:

  Develop, maintain, and enhance scalable Laravel/PHP web
  applications and REST APIs.

  Build frontend features using JavaScript, HTML, CSS, and
  React or equivalent technologies.

  Design and optimize MySQL databases, queries, relationships,
  migrations, and integrations.

  Integrate third-party APIs, webhooks, payment services, and
  external systems.

  Develop automated end-to-end and functional tests using
  Playwright.

  Design and implement business workflows and API-based
  automation using n8n.

  Integrate AI/LLM APIs into applications and automation
  workflows.

  Use AI coding assistants and prompt engineering to improve
  development productivity.

  Work with concepts including LLMs, tokens, context,
  embeddings, RAG, AI agents, and model limitations.

  Use Git/GitLab for branching, merge requests, code reviews,
  and controlled releases.

  Handle deployment, environment configuration, application
  publishing, and production support. Debug application, API,
  database, and production issues and perform root-cause
  analysis.

  Follow secure coding, testing, performance, and
  maintainability best practices.

  Collaborate with QA, UI/UX, Product, DevOps, and
  stakeholders to deliver features end-to-end.

  Guide and review junior developers when required.

  Requirements

  4-7 years of professional development experience.

  Strong hands-on experience with PHP and Laravel.

  Strong knowledge of Laravel MVC, Eloquent, authentication,
  middleware, queues/jobs, events, validation, APIs, and
  security.

  Strong experience with REST APIs and MySQL/SQL.

  Good frontend development skills with JavaScript, HTML, CSS,
  and preferably React.

  Hands-on experience with Playwright automated testing.

  Hands-on experience with n8n workflow automation, webhooks,
  and API integrations.

  Practical experience with AI/LLM APIs, prompt engineering,
  and AI-assisted development.

  Understanding of Git/GitLab, CI/CD, deployment, debugging,
  and production environments.

  Strong problem-solving, ownership, communication, and code-
  quality mindset.
