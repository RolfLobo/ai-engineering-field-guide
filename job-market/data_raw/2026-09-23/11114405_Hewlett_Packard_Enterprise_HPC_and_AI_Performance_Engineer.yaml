description: |
  HPC and AI Performance Engineer



  This role has been designed as 'Hybrid' with a requirement
  that you will work on average 2 days per week from an HPE
  office.

  Who We Are:

  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.

  Job Description:



  High Performance Computing, AI and Labs is a critical
  element of HPE. We are focused on delivering innovative
  solutions that accelerate our customers’ digital
  transformation, enabling them to tackle their complex, and
  data-intensive workloads. Combining deep expertise and the
  development of the world’s most cutting-edge, high-
  performance supercomputers, is defining the next era of
  computing delivering valuable insight & innovation. Join us
  and redefine what’s next for you. HPE is seeking a High-
  Performance Computing (HPC) Benchmarking Performance
  Engineer to support scientific application benchmarking and
  performance optimization on HPE supercomputing platforms. In
  this role, the engineer will work with standard HPC and
  scientific application benchmarks to support HPE’s sales,
  development, and marketing initiatives. The position
  requires strong technical knowledge of HPC systems,
  performance analysis tools, and optimization techniques to
  help deliver optimal benchmark and application performance
  on HPE supercomputers deployed at customer sites worldwide.
  The ideal candidate will bring experience with HPC
  scientific applications, a solid understanding of HPC
  hardware and architecture, and strong collaboration and
  communication skills. Candidates who meet a subset of the
  qualifications and demonstrate a strong willingness and
  ability to learn are also encouraged to apply for this role.

  HPE operates in a dynamic, fast-paced business environment
  and is looking for motivated engineers who can consistently
  deliver the high-quality results expected by HPE’s HPC
  customers. This role requires clear and independent
  thinking, along with the ability to apply innovative
  approaches to work activities and problem solving. HPE
  values a constructive, collaborative, and results-oriented
  work style.

  What you will do:

  - Conduct scientific application performance benchmarking in a
    timely manner, often under tight deadlines, to support HPE
    sales engagements and internal product decision-making.
    This includes benchmarking scientific Independent Software
    Vendor (ISV) applications as well as open-source
    applications widely used across the HPC community.
  - Optimize HPC benchmarks on HPE systems to generate
    performance results and insights that help HPE submit
    competitive proposals for customer opportunities.
  - Develop and apply a strong understanding of HPC
    architectural components, system features, and performance
    estimation methodologies to assess benchmark performance
    on current and future HPE systems.
  - Analyze benchmark results to identify performance
    bottlenecks across compute, memory, accelerator,
    interconnect, MPI, and I/O subsystems, and recommend
    optimization approaches for improved application
    performance on HPE HPC platforms.
  - Stay current on HPE and competitor HPC products, along with
    relevant performance optimization techniques, to support
    delivery of high-quality benchmark results for sales
    opportunities.
  - Collaborate closely with colleagues across HPE and with
    external technical peers to achieve optimal benchmark
    performance on HPE platforms.
  - Provide benchmarking consultation and technical guidance to
    Sales, Marketing, and Development teams to support
    business growth and customer success.

  What you need to bring:

  Education and Experience Required:

  - Bachelor’s degree in a technical field such as Computer
    Science, Mathematics, Engineering, Physics, Chemistry,
    Environmental Science, or a related discipline; Master’s
    or PhD preferred.
  - Typically 5+ years experience.

  Knowledge and Skills:

  - Academic or industry experience in HPC, with a strong
    understanding of scientific and engineering application
    benchmarks used in the HPC market.
  - Demonstrated ability to evaluate, tune, and optimize
    computational application benchmark performance on Linux-
    based HPC systems.
  - Python, shell scripting, and other automation or scripting
    languages
  - Ability to collaborate effectively with cross-functional
    teams to achieve defined technical, customer, and business
    objectives.
  - Ability to communicate complex technical concepts, benchmark
    results, and performance recommendations clearly to
    internal and external audiences.
  - Strong analytical, troubleshooting, and problem-solving
    skills, with the ability to diagnose and resolve complex
    performance issues.
  - Experience with several of the following programming models,
    tools, and environments, with the ability to quickly learn
    additional technologies as needed:
  - MPI-based parallel programming and runtime environments
  - Compilers and programming languages such as C, C++, and
    Fortran
  - OpenMP and other shared-memory parallel programming
    approaches
  - Linux operating environments, command-line tools, and
    system-level workflows
  - Performance profiling, tracing, analysis, and debugging
    tools
  - Experience with, or the ability to quickly develop
    proficiency in, the following HPC technologies and
    concepts:
  - Processor technologies, including CPUs, GPUs, and
    accelerators, from both user and programmer perspectives
  - Accelerator programming technologies such as CUDA, OpenACC,
    and related GPU programming models
  - Understanding of different MPI implementations and best
    practices for achieving optimal application performance
    with each
  - Parallel file systems such as Lustre, GPFS, or other HPC
    storage technologies
  - Running and scaling applications and benchmarks on large-
    scale HPC systems
  - Analyzing, interpreting, and assessing benchmark and
    application performance across different HPC architectures
    and system configurations
  - Excellent written and verbal communication skills, with the
    ability to document technical findings and present results
    clearly.
  - Willingness and ability to work with leading-edge
    technologies, proactively identify and resolve issues,
    manage multiple priorities, and deliver results under
    demanding deadlines in a fast-paced environment.

