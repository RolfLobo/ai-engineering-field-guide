description: |
  Lead Software Engineer (Python, AWS, AI, Snowflake
  Databricks) Do you love building and pioneering in the
  technology space? Do you enjoy solving complex business
  problems in a fast-paced, collaborative, inclusive, and
  iterative delivery environment? At Capital One, you'll be
  part of a big group of makers, breakers, doers and
  disruptors, who solve real problems and meet real customer
  needs. We are seeking a Full Stack Software Engineer who is
  passionate about marrying data with emerging technologies.
  As a Capital One Lead Software Engineer, you'll have the
  opportunity to be on the forefront of driving a major
  transformation within Capital One. The Enterprise Platform
  Tech team transforms customer experiences, and the platforms
  that enable them, at the optimal time through the preferred
  channel, to empower 100+ million customers on their
  financial journeys and beyond. What You'll Do:

  - Lead a portfolio of diverse technology projects and a team
    of developers with deep experience in distributed
    microservices, and full stack systems to create solutions
    that help meet regulatory needs for the company
  - Share your passion for staying on top of tech trends,
    experimenting with and learning new technologies,
    participating in internal & external technology
    communities, mentoring other members of the engineering
    community
  - Collaborate with digital product managers, and deliver
    robust cloud-based solutions that drive powerful
    experiences to help millions of Americans achieve
    financial empowerment
  - Utilize programming languages like JavaScript, Java,
    HTML/CSS, TypeScript, SQL, Python, and Go, Open Source
    RDBMS and NoSQL databases, Container Orchestration
    services including Docker and Kubernetes, and a variety of
    AWS tools and services

  Basic Qualifications:

  - Bachelor's Degree
  - At least 4 years of experience in software engineering
    (Internship experience does not apply)
  - At least 1 year experience with cloud computing (AWS,
    Microsoft Azure, Google Cloud)

  Preferred Qualifications:

  - Master's Degree
  - 7+ years of experience in at least one of the following:
    JavaScript, Java, TypeScript, SQL, Python, or Go
  - 3+ years of experience with AWS, GCP, Microsoft Azure, or
    another cloud service
  - 4+ years of experience in open source frameworks
  - 1+ years of people management experience
  - 2+ years of experience in Agile practices
  - Experience leveraging interactive AI tooling to accelerate
    productivity, utilizing capabilities beyond basic code
    completion

  At this time, Capital One will not sponsor a new applicant
  for employment authorization, or offer any immigration
  related support for this position (e.g. H1B, F-1 OPT, F-1
  STEM OPT, F-1 CPT, J-1, TN, E-3, and O-1, or any other forms
  of work authorization that require immigration support from
  an employer).  The minimum and maximum full-time annual
  salaries for this role are listed below, by location. Please
  note that this salary information is solely for candidates
  hired to perform work within one of these locations, and
  refers to the amount Capital One is willing to pay at the
  time of this posting. Salaries for part-time roles will be
  prorated based upon the agreed upon number of hours to be
  regularly worked. Chicago, IL: $179,400 - $204,700 for Lead
  Software Engineer McLean, VA: $197,300 - $225,100 for Lead
  Software Engineer New York, NY: $215,200 - $245,600 for Lead
  Software Engineer Plano, TX: $179,400 - $204,700 for Lead
  Software Engineer Richmond, VA: $179,400 - $204,700 for Lead
  Software Engineer Candidates hired to work in other
  locations will be subject to the pay range associated with
  that location, and the actual annualized salary amount
  offered to any candidate at the time of hire will be
  reflected solely in the candidate's offer letter. This role
  is also eligible to earn performance based incentive
  compensation, which may include cash bonus(es) and/or long
  term incentives (LTI). Incentives could be discretionary or
  non discretionary depending on the plan. Capital One offers
  a comprehensive, competitive, and inclusive set of health,
  financial and other benefits that support your total well-
  being. Learn more at the Capital One Careers website .
  Eligibility varies based on full or part-time status, exempt
