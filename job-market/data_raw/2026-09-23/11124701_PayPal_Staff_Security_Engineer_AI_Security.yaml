  https://careers.pypl.com/contact-us.

  For the majority of employees, PayPal's balanced hybrid work
  model offers 3 days in the office for effective in-person
  collaboration and 2 days at your choice of either the PayPal
  office or your home workspace, ensuring that you equally
  have the benefits and conveniences of both locations.

  Our Benefits:

  At PayPal, we’re committed to building an equitable and
  inclusive global economy. And we can’t do this without our
  most important asset-you. That’s why we offer comprehensive,
  choice-based programs, to support all aspects of personal
  wellbeing—physical, emotional, and financial—delivering
