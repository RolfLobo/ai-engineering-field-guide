description: |
  ShuruTech is a rapidly growing B2B IT services company
  specializing in building scalable, secure, and tailored
  software solutions for global clients. Our focus spans
  across CRM development, product engineering, cloud
  transformation, and automation. We’re passionate about
  empowering businesses to innovate and grow with custom
  technology solutions.

  We are seeking a forward-looking Senior AI Software Engineer
  to design, build, and scale next- generation applications
  leveraging cloud-native architectures, AI/ML capabilities,
  and modern engineering practices. The ideal candidate is a
  strong software engineer with expertise in distributed
  systems, AWS cloud technologies, platform engineering, and
  AI-powered application development. This individual will
  help establish foundational capabilities for AI agents,
  enable scalable agent orchestration frameworks, and drive
  adoption of AI-assisted software development practices
  across the engineering organization.

  Job Responsibilties

  - Design, develop, and maintain scalable cloud-based
    applications using AWS services.
  - Build and integrate AI/ML-powered features and agents into
    applications using AWS AI services.
  - Leverage AWS Kiro and AI-assisted development tools to
    accelerate software delivery, automate tasks, and improve
    code quality. Apply AI-assisted development tools to
    accelerate software delivery, automate repetitive tasks,
    and improve code quality.
  - Collaborate with cross-functional teams to define, design,
    and ship new features.
  - Implement best practices for cloud architecture, security,
    and performance.
  - Automate deployment, monitoring, and management of cloud
    applications.
  - Write clean, efficient, and maintainable code and contribute
    to both front-end and back-end development as a full-stack
    engineer.
  - Troubleshoot and resolve issues related to cloud
    infrastructure and applications.
  - Mentor and guide junior engineers, fostering a culture of
    continuous improvement.
  - Stay up-to-date with the latest AWS technologies and
    industry trends.

  Requirements

  - 5+ years of experience in software development, with a focus
    on cloud technologies.
  - Proficiency in AWS services such as EC2, S3, Lambda, RDS,
    and CloudFormation.
  - Strong programming skills in languages such as Python, Java,
    or Node.js.
  - Experienced in deploying and managing applications using Red
    Hat OpenShift Service on AWS
  - (ROSA), leveraging its robust platform for scalable and
    efficient cloud solutions.
  - Experience with containerization technologies like Docker
    and Kubernetes.
  - Familiarity with DevOps practices and tools.
  - Knowledge of CI/CD pipelines and tools like Jenkins, GitLab,
    or AWS CodePipeline.
  - Hands-on experience with AWS cloud services and building
    distributed systems.
  - Experience integrating AI/ML capabilities into applications
    (e.g., personalization, NLP, recommendations).
  - Familiarity with AWS AI/ML services such as Amazon
    SageMaker, Bedrock, and AgentCore.
  - Demonstrated experience using AI-assisted development tools
    (e.g., GitHub Copilot, Claude, Kiro) to accomplish tasks
    such as generating and reviewing code, writing and
    maintaining tests, creating documentation, and debugging,
    with the judgment to validate and own AI-generatedoutput.

  Benefits

  - Competitive salary and benefits package.
  - Opportunity to work with a team of experienced product and
    tech leaders.
  - Continuous learning and development opportunities
  - Chance to make a significant impact on diverse and
    innovative projects
