description: |
  About Ramp

  Ramp is building the smart infrastructure for finance teams,
  embedded in the transaction flow of every dollar a business
  spends. We automate how over $200B in annualized spend flows
  in and out of 70,000+ companies: authorizing payments,
  flagging risk, categorizing spend, and closing books.

  The problems are high-stakes, data-dense, and unforgiving.

  We hire people with high agency and high urgency. We look
  for slope over intercept. We care less about where you
  trained and more about what you’ve built. At Ramp, everyone
  is a builder who owns problems end to end and makes
  consequential decisions that shape the outcome.

  The median Ramp customer saves 5% and grows revenue 16% in
  their first year – far in excess of businesses operating
  without Ramp. We believe every ambitious company deserves
  the same.

  If you want to build systems that directly shape how
  companies move and manage billions, Ramp is the place to do
  it.

  About the role

  Ramp is building a new AI business, and you’ll be one of its
  first technical sellers. Your job is to turn technically
  complex AI products into closed revenue.

  You’ll sell a growing portfolio spanning AI-powered
  applications and agents for finance teams, as well as
  infrastructure that helps companies deploy and manage AI
  with greater control, security, and cost efficiency. This is
  a product-focused, quota-carrying technical sales role.
  You’ll help customers evaluate and purchase Ramp’s AI
  products, translating complex capabilities into clear
  business value and guiding opportunities from discovery
  through close.

  This is a high-velocity commercial role, not a traditional
  pre-sales position where success ends with a great demo.
  You’ll be accountable for turning technical evaluations into
  commercial wins from start to finish. You’ll lead discovery,
  shape deal strategy, build executive-level business cases,
  deliver tailored demonstrations, navigate technical and
  commercial objections, and create urgency around a clear
  path to purchase.

  You’ll move comfortably between technical and executive
  conversations. In one meeting, you may discuss model
  routing, APIs, integrations, data governance, and security
  with Engineering and IT teams. In the next, you may help
  Finance and executive leaders understand the ROI, total cost
  of ownership, and operational impact of adopting Ramp’s AI
  products.

  You’ll join at a formative moment for Ramp’s AI business. As
  one of the first dedicated sellers for these products,
  you’ll help identify the strongest use cases, refine how we
  position and sell the portfolio, influence the customer
  experience, and build the playbook the broader team will
  eventually scale. You’ll own the full customer lifecycle
  from discovery and evaluation through close, implementation,
  and adoption, helping customers translate their purchase
  into a successful deployment. This role combines Ramp’s
  resources and customer reach with the ownership, speed, and
  ambiguity of an early-stage team.

  What you’ll do

  - Carry a revenue quota and own the progression of AI product
    opportunities from initial discovery through purchase,
    ensuring business value is clear, technical requirements
    are validated, and obstacles to a decision are resolved.
  - Lead discovery with business and technical buyers to
    understand their goals, workflows, challenges, decision
    criteria, existing systems, and AI strategy.
  - Translate Ramp’s AI applications and infrastructure into
    compelling solution narratives tied to measurable business
    outcomes.
  - Build ROI and total cost of ownership analyses that quantify
    the value of Ramp’s AI products and create executive-level
    justification for investment.
  - Help customers identify high-value use cases, set realistic
    expectations, and establish a credible path from
    evaluation to production.
  - Deliver tailored demonstrations, technical workshops, and
    proofs of concept with clear success criteria that
    establish value and build confidence in a purchase
    decision.
  - Build relationships with champions and decision-makers
    across Engineering, IT, Security, Finance, Operations,
    Procurement, and executive leadership.
  - Navigate questions related to APIs, integrations, model
    capabilities and limitations, data flows, architecture,
    privacy, security, governance, implementation, and
    tradeoffs among quality, cost, latency, and control.
  - Apply strong commercial judgment to qualify opportunities,
    create urgency, address objections, identify risk, and
    keep customers moving toward a decision.
  - Lead customers through implementation after purchase,
    including deployment planning, stakeholder alignment,
    workflow design, technical coordination, enablement, and
    adoption.
  - Partner with Account Executives and collaborate with
    Product, Engineering, Security, Marketing, and post-sales
    teams to remove deployment blockers and deliver a strong
    customer experience from evaluation through production.
  - Bring structured customer and market feedback to internal
    teams to improve the products, positioning, sales
    execution, and customer experience.
  - Turn early customer conversations into repeatable messaging,
    demonstrations, qualification criteria, value stories, and
    sales plays as we build this go-to-market motion from the
    ground up.

  What you’ll bring

  - 5+ years of experience in Solutions Engineering, Solutions
    Consulting, technical sales, Solutions Architecture,
    enterprise software sales, or a related customer-facing
    role.
  - Direct quota-carrying or deal-closing ownership of the pre-
    sale cycle—not only experience delivering demonstrations
    or supporting post-sale implementation.
  - A track record of independently influencing and winning
    complex B2B sales opportunities with clear revenue
    accountability.
  - Strong discovery and value-selling skills, with the ability
    to connect technical capabilities to measurable business
    outcomes.
  - Demonstrated ability to build executive-level business
    cases, including ROI and total cost of ownership analyses;
    this capability will be central to success in the role.
  - Commercial instincts and comfort taking meaningful ownership
    of deal strategy, momentum, and results.
  - Technical fluency across modern AI systems, including
    applications and agents, model capabilities and
    limitations, APIs, integrations, data flows, security,
    governance, and tradeoffs among quality, cost, latency,
    and control.
  - Excellent executive communication and presentation skills,
    including the ability to make complex concepts clear and
    relevant to different audiences.
  - The ability to explain probabilistic, rapidly evolving AI
    technology with credibility and precision without
    overpromising what the product can do.
  - Experience building champions and navigating multi-threaded
    buying groups with competing priorities.
  - High ownership, curiosity, sound judgment, and comfort
    operating in a fast-moving environment where you’ll build
    structure as you go rather than inherit it.
  - Energy for zero-to-one work and the opportunity to build a
    sales motion rather than simply inherit one.

  Nice to have

  - Experience selling AI infrastructure, AI applications or
    agents, developer tools, data platforms, security
    products, finance technology, or workflow automation
    software.
  - Experience helping launch a new product or develop an early
    go-to-market motion.
  - Familiarity with AI gateways, model routing, usage controls,
    data governance, or enterprise AI deployment.
  - Experience selling to developers, IT, Security, Finance,
    Operations, Procurement, or executive stakeholders.
  - Experience creating reusable sales assets, demonstrations,
    value frameworks, or enablement programs.

