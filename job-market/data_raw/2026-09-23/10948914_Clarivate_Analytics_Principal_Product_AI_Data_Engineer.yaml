title: Principal Product AI Data Engineer
company: Clarivate Analytics
location: Bengaluru, IND
work_type: FULL_TIME
company_size: 10,549 Employees
description: |
  We are seeking a Principal Product AI Data Engineer to join
  our MedTech team in Bangalore. In this role, you will lead
  the design and delivery of AI-enabled data products and
  intelligent workflows that drive innovation in the Life
  Sciences and Healthcare domain.

  You will collaborate across product, engineering, analytics,
  and enterprise teams to build scalable, high-quality
  solutions that deliver measurable business impact.



  About You – experience, education, skills, and
  accomplishments  

  - Bachelor’s Degree or equivalent in Computer Science,
    Software Engineering, Artificial Intelligence, or related
    field
  - 10+ years of experience building and delivering production-
    grade software, including deployment of AI-powered product
    capabilities
  - Strong experience with Python, PySpark, Snowflake,
    Databricks, Airflow, Delta Lake, and cloud platforms such
    as AWS or Azure
  - Strong SQL and database expertise across platforms such as
    PostgreSQL, Oracle, Snowflake, and Databricks
  - Experience partnering with product, analytics, and business
    stakeholders to drive measurable outcomes
  - Strong verbal and written communication skills

  It Would Be Great If You Also Had

  - Understanding of healthcare data and regulations
  - Experience with SpecKit or OpenSpec for spec-driven
    development
  - Experience building and scaling big data platforms

  What Will You Be Doing in This Role?

  - Lead the design, architecture, and delivery of complex
    Generative and Agentic AI systems across teams and
    platforms
  - Execute high-impact AI initiatives ensuring solutions are
    scalable, reliable, and aligned with business goals
  - Establish engineering standards and guide implementation
    best practices
  - Drive cross-functional collaboration and mentor engineers to
    foster technical growth
  - Design innovative AI solutions including data pipelines,
    architectures, and agentic workflows
  - Partner with product, design, and business leaders to align
    AI capabilities with strategic priorities

  AI/ML Engineering Responsibilities

  - Collaborate with Data Scientists to productionize machine
    learning models
  - Design and implement feature engineering pipelines
  - Develop scalable ML data pipelines and model-serving
    architectures
  - Support MLOps practices, including model deployment,
    monitoring, retraining, and governance
  - Integrate Generative AI, LLMs, and AI agents into enterprise
    applications
  - Build and optimize vector databases, RAG architectures, and
    AI-driven workflows

  Stakeholder Management

  - Work closely with Product Managers, Architects, Business
    Analysts, and Executive Leadership
  - Present technical solutions and architecture recommendations
    to stakeholders
  - Drive roadmap planning and technology adoption initiatives
  - and measurable outcomes.

  Product you will be developing

  Supporting and developing AI-enabled solutions for a suite
  of products that track medical devices and supplies across
  various markets and regions and provide valuable insights to
  our Biotech and Pharmaceutical clients.



  About the Team   

  This role works closely with the product managers, data
  analytics and operations teams, other internal IT teams, and
  external vendors and partners. The team has over 15
  engineers and reports to the Director of Software
  Engineering.



  Hours of Work  

  - Full-time

  - 40 hrs/week

  - Hybrid working model

  At Clarivate, we are committed to providing equal employment
  opportunities for all  qualified persons with respect to
  hiring, compensation, promotion, training, and other terms,
  conditions, and privileges of employment. We comply with
  applicable laws and regulations governing non-discrimination
  in all locations.
