description: |
  Job Description

  Purpose of the role

  To  lead and manage engineering teams, providing technical
  guidance, mentorship, and support to ensure the delivery of
  high-quality software solutions, driving technical
  excellence, fostering a culture of innovation, and
  collaborating with cross-functional teams to align technical
  decisions with business objectives.

  Accountabilities

  - Lead engineering teams effectively, fostering a
    collaborative and high-performance culture to achieve
    project goals and meet organizational objectives.
  - Oversee timelines, team allocation, risk management and task
    prioritization to ensure the successful delivery of
    solutions within scope, time, and budget.
  - Mentor and support team members' professional growth,
    conduct performance reviews, provide actionable feedback,
    and identify opportunities for improvement.
  - Evaluation and enhancement of engineering processes, tools,
    and methodologies to increase efficiency, streamline
    workflows, and optimize team productivity.
  - Collaboration with business partners, product managers,
    designers, and other stakeholders to translate business
    requirements into technical solutions and ensure a
    cohesive approach to product development.
  - Enforcement of technology standards, facilitate peer
    reviews, and implement robust testing practices to ensure
    the delivery of high-quality solutions.

  Vice President Expectations

  - To contribute or set strategy, drive requirements and make
    recommendations for change. Plan resources, budgets, and
    policies; manage and maintain policies/ processes; deliver
    continuous improvements and escalate breaches of
    policies/procedures..
  - If managing a team, they define jobs and responsibilities,
    planning for the department’s future needs and operations,
    counselling employees on performance and contributing to
    employee pay decisions/changes. They may also lead a
    number of specialists to influence the operations of a
    department, in alignment with strategic as well as
    tactical priorities, while balancing short and long term
    goals and ensuring that budgets and schedules meet
    corporate requirements..
  - If the position has leadership responsibilities, People
    Leaders are expected to demonstrate a clear set of
    leadership behaviours to create an environment for
    colleagues to thrive and deliver to a consistently
    excellent standard. The four LEAD behaviours are: L –
    Listen and be authentic, E – Energise and inspire, A –
    Align across the enterprise, D – Develop others..
  - OR for an individual contributor, they will be a subject
    matter expert within own discipline and will guide
    technical direction. They will lead collaborative, multi-
    year assignments and guide team members through structured
    assignments, identify the need for the inclusion of other
    areas of specialisation to complete assignments. They will
    train, guide and coach less experienced specialists and
    provide information affecting long term profits,
    organisational risks and strategic decisions..
  - Advise key stakeholders, including functional leadership
    teams and senior management on functional and cross
    functional areas of impact and alignment.
  - Manage and mitigate risks through assessment, in support of
    the control and governance agenda.
  - Demonstrate leadership and accountability for managing risk
    and strengthening controls in relation to the work your
    team does.
  - Demonstrate comprehensive understanding of the organisation
    functions to contribute to achieving the goals of the
    business.
  - Collaborate with other areas of work, for business aligned
    support areas to keep up to speed with business activity
    and the business strategies.
  - Create solutions based on sophisticated analytical thought
    comparing and selecting complex alternatives. In-depth
    analysis with interpretative thinking will be required to
    define problems and develop innovative solutions.
  - Adopt and include the outcomes of extensive research in
    problem solving processes.
  - Seek out, build and maintain trusting relationships and
    partnerships with internal and external stakeholders in
    order to accomplish key business objectives, using
    influencing and negotiating skills to achieve outcomes.

  All colleagues will be expected to demonstrate the Barclays
  Values of Respect, Integrity, Service, Excellence and
  Stewardship – our moral compass, helping us do what we
  believe is right. They will also be expected to demonstrate
  the Barclays Mindset – to Empower, Challenge and Drive – the
  operating manual for how we behave.

  Join us as an AI Platform Engineer at Barclays, innovation
  isn’t just encouraged; it’s expected. You will be required
  to have an experience in SOLD Simplification. It is a
  multiyear initiative to make the platform compliant to most
  valuable environment, hardware refresh and removing
  redundant functionalities. You will be required to lead the
  overall engineering & development of this initiative. You
  will be an AI Engineering and required to coordinate &
  support requirement Discovery, initiative & delivery
  planning, roadmap and stakeholder management.

  To be successful as an AI Platform Engineer, you should have
  experience with:

  • Cloud Platform Engineering (Azure preferred), including
  Kubernetes, containerisation, Infrastructure as Code
  (Terraform/Bicep), and platform operations.

  • Software Engineering & API Development using Python and/or
  Java, with experience building scalable services, APIs, and
  integration frameworks.

  • AI Platform & MLOps Engineering, including deployment and
  operationalisation of LLMs, model lifecycle management,
  prompt orchestration, vector databases, and AI
  observability.

  • DevSecOps & Enterprise Security, including CI/CD
  pipelines, automated testing, secrets management,
  vulnerability remediation, and secure-by-design engineering
  practices.



  Some other highly valued skills may include:

  • Financial Services Domain Knowledge, particularly
  Payments, Cash Management, Liquidity, Treasury, or
  Transaction Banking platforms.

  • Data Engineering & Analytics, including data pipelines,
  data quality controls, metadata management, and retrieval-
  augmented generation (RAG) architectures.

  • AI Governance & Risk Management, including model risk
  controls, AI guardrails, responsible AI practices, and
  regulatory compliance requirements.

  • Site Reliability Engineering (SRE) & Platform Operations,
  including monitoring, resiliency engineering, incident
  management, capacity planning, and operational excellence.

  You may be assessed on the key critical skills relevant for
  success in role, such as risk and controls, change and
  transformation, business acumen strategic thinking and
  digital and technology, as well as job-specific technical
  skills.

  This role is based in our Pune office.
