description: |
  About the company



  Turning marketing into a market-domination weapon, we
  created a new category — the marketplace for future
  customers. Businesses shop for leads as they shop for
  products in e-commerce: you see everything about a lead
  before you buy — full transparency, control, and predictable
  outcomes. We're the #1 lead marketplace in the USA, and
  we're accelerating.



  Role overview



  We're looking for a Senior AI Product Engineer to build the
  AI operating layer behind our marketplace. You take a
  valuable but unclear business problem — improve lead
  quality, cut refunds, automate a manual workflow, extract
  intelligence from calls — and turn it into a dependable
  production system end-to-end: investigate, define success,
  design, build, deploy, and improve on real usage data. You
  are a one-person AI product team for high-leverage problems,
  not a spec-taker.



  We are expanding beyond real estate into new service-
  business niches, and growth is powered by reusable software
  and automation — not proportional growth in manual work.
  Every system you ship either compounds into that leverage or
  exposes where it leaks — no in-between.



  Why this role exists



  Our growth is not limited by ideas or data — we already run
  40K+ members, 750+ verified daily leads, and 50B data points
  powering AI. It's limited by how fast we can turn ambiguous,
  high-value problems into shipped AI systems that actually
  move business metrics. We need a builder who owns the
  complete production outcome — not a prompt tinkerer, not a
  researcher, not a PM who delegates the build.



  Requirements:



  - Strong record of building and shipping production software
    end-to-end, ideally in a SaaS, marketplace, or workflow
    product — with real users and real revenue on the line.
  - Strong Python and/or TypeScript, plus solid backend
    fundamentals: APIs, databases, auth, data models, testing,
    and deployment.
  - Hands-on experience shipping LLM-powered functionality using
    model APIs, structured outputs, tool/function calling,
    retrieval, context engineering, and agentic workflows.
  - Production automation experience: webhooks, events, queues,
    schedules, retries, idempotency, monitoring, and failure
    recovery — not just happy-path demos.
  - Practical evaluation skills: test sets, traces, quality
    metrics, regression checks, feedback loops, and root-
    causing real production failures.
  - Daily fluency with AI coding agents (Claude Code, Codex,
    Cursor, or equivalent) — you review, test, refactor, and
    secure generated work, not ship it raw.
  - English C1+; our stakeholders, users, and business owners
    are US-based, and communication must be sharp and clear.
  - AI-first by default — if you are not already using AI to 3x
    your own output, you will be behind the rest of
    engineering.
  - Product ownership and strong judgment in ambiguous, fast-
    moving environments — you clarify goals, make tradeoffs,
    and connect every technical decision to a business KPI.



  What You'll Be Doing:



  - Discover high-value product and operational problems by
    working directly with users, business owners, and internal
    teams, then frame clear success criteria before writing
    code.
  - Design and ship customer-facing AI features and internal
    automations across lead quality, matching, prediction,
    call intelligence, CRM, support, and operations.
  - Build agents and workflows that safely use tools, APIs,
    databases, calls, SMS, email, and other company systems —
    with human approval where risk requires it.
  - Create the context layer around models: instructions,
    retrieval, memory, structured outputs, tool definitions,
    permissions, and feedback loops.
  - Build reliable event-driven and scheduled automation using
    webhooks, queues, schedulers, retries, idempotency, audit
    logs, and graceful fallbacks.
  - Create evaluation datasets and automated checks that measure
    usefulness, accuracy, failure modes, regressions, latency,
    and cost — before and after release.
  - Investigate real production failures and improve the
    complete system, not just the prompt or the model
    response.
  - Turn successful solutions into reusable components and
    patterns that support additional iSpeedToLead niches
    without rebuilding from zero.
  - Own architecture, quality, security, and business outcomes —
    not just the pull request.



  This is not for you if



  - You want a prompt-only role or a research position focused
    on training foundation models.
  - You do no-code-only automation and can't own real production
    code.
  - You call yourself a product manager who delegates the build.
  - You ship unreviewed "vibe coding" and call it done.
  - You need a complete spec before you can start.
  - You optimize for demo quality instead of measurable business
    impact.



  What we expect from you (first 3 months)



  We don't do long onboarding: access on day one, context in
  days, first shipped improvement in the first 30.



  - Days 1–30 — Understand and ship: you have learned the
    product, data, and workflows, identified the best first
    problem with evidence, and released one useful, low-risk
    improvement in production.
  - Days 31–60 — Own the workflow: you have launched one
    meaningful AI product or automation with evaluation,
    monitoring, clear ownership, and a human fallback —
    running against real marketplace volume.
  - Days 61–90 (the bar) — Prove and repeat: the system shows
    measurable business impact (fewer manual hours, faster
    verification, lower refunds, better matching, higher
    conversion, or shorter time from idea to production),
    reliability is proven, and the solution is turned into a
    reusable pattern for future workflows or niches.



  Nice to Have:



  - Voice AI, call transcription, telephony, SMS, email, CRM, or
    customer-support automation experience.
  - Lead generation, marketplaces, real estate, sales
    technology, or marketing automation background.
  - Ranking, scoring, prediction, experimentation, or data
    pipeline experience.
  - Cloud deployment, Docker, CI/CD, observability, security,
    and handling sensitive customer data.
  - MCP, vector search, LangGraph or equivalent orchestration,
    Temporal, n8n, or custom workflow engines.
  - Track record taking a product or automation from zero to one
    in a fast-moving startup.



  What We Offer:



  - Impact: Own visible, high-value problems with direct access
    to decision-makers, users, and production feedback at the
    core of a product-led, AI-powered marketplace.
  - Autonomy: High ownership, low bureaucracy, and real
    authority to choose tools based on results and define the
    reusable AI architecture for multiple future niches.
  - Flexibility: Remote-first culture with flexible hours and
    async-friendly communication. 4+ hour overlap with
    Asia/Dubai required for weekly reviews.
  - Compensation: Competitive fixed base salary above the market
    average.
  - Team: Join a smart, passionate team that moves fast,
    supports each other, and builds cool stuff.
  - Time Off: 15 paid vacation days plus 5 paid sick days
    annually.
  - Growth: Unlimited learning policy — paid courses, books, and
    growth resources.
  - AI-Heavy Environment: AI is deeply embedded across
    prospecting, research, engineering, and workflows.
  - Ownership: Real decision-making power and direct ownership
    of your outcomes.



  Location: Remote, 4+ hour overlap with Asia/Dubai
