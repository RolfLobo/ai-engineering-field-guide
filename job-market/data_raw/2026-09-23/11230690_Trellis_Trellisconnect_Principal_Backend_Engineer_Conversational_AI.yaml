title: Principal Backend Engineer, Conversational AI
company: Trellis (Trellisconnect)
location: USA
remote: true
work_type: FULL_TIME
description: |
  About Trellis

  Trellis is rewriting the insurance experience from the
  inside out. We’re the tech company behind Savvy, our
  licensed insurance agency, and we’re bringing clarity and
  ease to a space known for… the opposite. With powerful
  tools, clean design, and a customer-first mindset, we’re
  making insurance shopping refreshingly effortless.

  We’re a profitable, fast-growing Series A startup backed by
  General Catalyst, QED, NYCA, and Amex Ventures. As a remote-
  first team, we move quickly, experiment boldly, and build
  with intention.

  If you’re craving meaningful impact, energized by ambiguity,
  and are ready to build alongside exceptional teammates,
  you’re going to love doing your best work at Trellis.

  The Opportunity

  As a Principal Software Engineer on the Conversational AI
  team at Trellis, you’ll play a critical role in shaping the
  future of our AI-driven customer experiences. You’ll
  architect and build intelligent systems that power natural,
  engaging conversations between users and our platform.
  Working closely with cross-functional partners, you’ll
  transform high-level product initiatives into scalable,
  well-tested technical solutions.

  You’ll lead the way on complex projects by defining scope,
  setting technical direction, and mentoring teammates along
  the way. You’ll guide the team through tough challenges,
  offer thoughtful code reviews, and contribute to a culture
  of continuous learning and collaboration. Whether you're
  onboarding new teammates or refining our LLM-driven
  infrastructure, you’ll be a key force behind our AI
  innovation.

  You will report directly to John Hartley, Head of
  Conversational AI Engineering.



  What You’ll Do

  - Guide your team in delivering high quality, well tested
    technical solutions providing technical and project
    oversight
  - Lead by example through the quality of your code and your
    approach to your work
  - Own projects through the entire software development
    lifecycle - from planning and development to validation,
    iteration, and maintenance
  - Translate conceptual work into well-crafted tech plans for
    review by technical leadership and key stakeholders
  - Leverage your understanding of the business and engineering
    strategies to design experiments and high-value projects
    that impact the work your team is doing
  - Expertly navigate complex systems and domains to identify
    key challenges and create plans to address them
  - Own system quality and hold your team members accountable
    through constructive and actionable feedback
  - Level up the team through code review feedback and knowledge
    sharing sessions
  - Assist in the onboarding of new engineering hires

  What You’ll Need

  - 5+ years’ experience developing software in a production
    environment
  - 2+ years’ experience in a senior engineer role
  - Production experience with Node.js and Typescript
  - Proven experience working in backend systems, designing
    RESTful APIs and codifying business logic on top of data
    stores
  - Exceptional ability to communicate clearly and concisely,
    particularly in Slack and technical documents
  - Experience in product development where you were a key
    decision maker
  - Deep expertise in system architecture and design
  - Proven success in operational excellence
  - Cross-functional leadership and collaboration experience
  - Familiarity with cloud environments, especially the Google
    Cloud stack

  Who You Are

  - Meticulous: You pay attention to detail and take pride in
    what you deliver
  - Articulate: You succinctly and effectively communicate
    verbal and written technical and non-technical ideas and
    topics
  - Kind, not (just) nice: You provide tough feedback in a clear
    and concise manner that does not diminish or belittle the
    recipient
  - Opinionated: You bring strong opinions to discussions but
    are willing to change your mind when presented with new or
    better information
  - Product-minded: You focus on the “why” just as much as the
    “what” or “how”
  - Collaborative: You work within your team and cross-
    functionally to build consensus and achieve results
  - Autonomous: You are self-motivated, able to hold yourself
    accountable, and can generate high-value work with little
    direct supervision

  Why Trellis? Because you deserve a career that’s exciting,
  meaningful, and surrounded by people who lift you up.

  We’re a group of curious, mission-driven humans rewriting
  the insurance experience and having a lot of fun along the
  way. At Trellis, you’ll make a real impact on a product
  millions rely on, and grow alongside a company that’s
  scaling fast.

  What sets Trellis apart:

  ✨ A transparent, collaborative culture where ideas win, not
  titles 🚀 Big opportunities to take ownership and chart your
  growth 💰 Competitive compensation (75th+ percentile) 🏡 Fully
  remote across the US & Canada 🎉 Quarterly virtual and/or in-
  person events that keep us connected

  Plus, the benefits are built to support your whole life:

  🌴 Flexible vacation (yes, actually flexible) 🩺 Health
  insurance starts day one

  🧘 Wellness programming, because balance matters 💸 401(k) and
  HSA contributions, FSAs, bonuses & equity opportunities 🐣
  Paid parental leave

  👉 If you want a role where you’ll grow, be trusted, and
  build something that genuinely improves people’s lives,
  Trellis is the place. Join us.

  We are an equal opportunity employer. We celebrate diversity
  and are committed to creating an inclusive environment for
  all employees.

  Note: all employees must complete a background check prior
  to starting employment with Trellis or its subsidiaries
