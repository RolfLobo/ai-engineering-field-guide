description: |
  The Role:

  Joining Moderna offers the unique opportunity to be part of
  a pioneering team that's revolutionizing medicine through
  mRNA technology, with a diverse pipeline of development
  programs across various diseases.

  As an employee, you'll be part of a continually growing
  organization, working alongside exceptional colleagues and
  strategic partners worldwide, contributing to global health
  initiatives.

  Moderna's commitment to advancing the technological frontier
  of mRNA medicines ensures a challenging and rewarding career
  experience, with the potential to make a significant impact
  on patients' lives worldwide.

  We are seeking a Power Platform & AI Engineer to support the
  development, administration, and adoption of Microsoft Power
  Platform and AI-powered automation solutions within
  Moderna's Power Platform Center of Excellence (CoE). This
  role combines platform administration, governance, hands-on
  development, and enterprise enablement to scale secure, AI-
  driven automation across the organization.

  This is a high‑impact, hands‑on role for a self‑starter who
  operates with a product mindset, treating the Power Platform
  as an internal product and driving both adoption and
  business value.

  Here’s What You’ll Do

  Your Key Responsibilities Will Be

  Microsoft Power Platform Administration & Governance

  - Support administration of Power Platform across development,
    validation, and production environments.
  - Support implementation and maintenance of the Power Platform
    CoE governance framework, including:
  - Environment strategy and lifecycle management
  - Data Loss Prevention (DLP) policies and connector governance
  - Security roles, licensing, and access controls
  - Apply and support platform guardrails to ensure solutions
    are secure, compliant, scalable, and supportable.
  - Manage solution lifecycle (ALM), including promotion,
    versioning, and change management.
  - Partner with Security, Compliance, and Enterprise
    Architecture to ensure adherence to enterprise standards.
  - Maintain the platform in a GxP-qualified state, ensuring
    compliance with validation requirements in regulated
    environments.
  - Maintain system documentation and support updates as
    platform capabilities evolve, including System
    Administration SOP, Use and Operation SOP,
    Configuration/Design Specifications (CDS).
  - Ensure all changes follow appropriate validation,
    documentation, and audit readiness processes.

  AI Automation Architecture & Delivery

  - Design, develop and support AI-first automation solutions
    using Power Apps, Power Automate and Copilot Studio.
  - Contribute to solution design decisions and recommend
    appropriate use of Power Apps, Power Automate, Copilot
    Studio, or hybrid approaches.
  - Develop production-grade solutions, including:
  - Power Apps applications (Canvas and Model-Driven Apps)
  - Power Automate workflows and process automations
  - Copilot Studio agents and conversational experiences
  - Lead prompt engineering and conversational design, including
    topics, triggers, and escalation paths.
  - Partner with business stakeholders to identify and implement
    AI-driven automation opportunities.
  - Integrate solutions with Microsoft 365 and enterprise
    platforms (e.g., ServiceNow, Jira, APIs).
  - Contribute reusable patterns, templates, and components to
    support scalable development.
  - Ensure operational excellence with logging, monitoring,
    alerting, and exception handling.
  - Evaluate when to extend solutions with RPA technologies
    (e.g., UiPath).

  CoE Enablement, Adoption & Citizen Developer Support

  - Support enterprise-wide adoption of Power Platform.
  - Contribute to adoption metrics and reporting, including
    Active makers, Automation usage, Business value delivered,
    etc..
  - Develop and deliver structured training programs, workshops,
    and onboarding pathways.
  - Participate in Community of Practice (CoP) activities and
    knowledge-sharing initiatives.
  - Support office hours and hands-on advisory sessions to
    support makers.
  - Provide architecture guidance, design reviews, and
    production readiness reviews.
  - Provide guidance and support to citizen developers and
    business users on secure, scalable patterns.
  - Enable a federated development model with strong central
    governance.

  Platform Operations, Monitoring & Continuous Improvement

  - Monitor platform health, performance, usage, and failures
    across AI and automations.
  - Build dashboards (Power Platform analytics, Power BI) to
    track:
  - Adoption and engagement
  - Operational risk and failures
  - Business impact
  - Contribute to continuous improvement of governance, tooling,
    and development standards.
  - Stay current on Microsoft roadmap and new platform
    capabilities and share recommendations with the team.

  Here’s What You’ll Need (Minimum Qualifications)

  - 5+ years of demonstrated experience as Microsoft Power
    Platform administrator and hands-on developer in an
    enterprise environment.
  - Deep expertise in Microsoft Power Platform, including Power
    Apps, Power Automate, and Copilot Studio.
  - Experience designing and developing enterprise-grade Power
    Apps (Canvas Apps and/or Model-Driven Apps).
  - Experience designing end-to-end Power Platform solutions
    that combine Power Apps, Power Automate, Copilot Studio,
    Microsoft 365, Dataverse, APIs, and enterprise systems.
  - Experience designing and delivering AI-driven automation
    solutions.
  - Experience integrating with enterprise systems via APIs or
    MCP servers.
  - Strong troubleshooting skills and ability to support
    production‑grade AI and automations.

  Here’s What You’ll Bring to the Table (Preferred
  Qualifications):

  - Experience with UiPath (development and/or administration).
  - Experience in regulated environments (e.g., pharma,
    healthcare, GxP, SOX).
  - Experience with scripting (PowerShell, Python) to complement
    automation workflows.
  - Power Platform certifications (PL‑400, PL-500, PL‑600,
    PL-200, PL-100, Copilot Studio‑related certifications).
  - Strong communication skills and comfort working within a
    centralized CoE supporting distributed teams.Top of
    FormBottom of Form

  Pay & Benefits

  At Moderna, we believe that when you feel your best, you can
  do your best work. That’s why our benefits and well-being
  resources are designed to support you—at work, at home, and
  everywhere in between.

  - Competitive healthcare, plus voluntary benefit programs to
    support your unique needs
  - A holistic approach to well-being, with access to fitness,
    mindfulness, and mental health support
  - Family planning benefits, including fertility, adoption, and
    surrogacy support
  - Generous paid time off, including vacation, volunteer days,
    sabbatical, global recharge days, and a discretionary
    year-end shutdown
  - Savings and investments to help you plan for the future
  - Location-specific perks and extras

  The salary range for this role is $109,200.00 - $174,600.00.
  This is the lowest to highest salary we in good faith
  believe we would pay for this role at the time of this
  posting. An individual’s position within the salary range
  will be based on several factors including, but not limited
  to, specific competencies, relevant education,
  qualifications, certifications, experience, skills,
  performance, and business or organizational needs.

  The successful candidate may be eligible for an annual
  discretionary bonus, other incentive compensation, or equity
  award, subject to company plan eligibility criteria and
  individual performance.

  About Moderna

  Since our founding in 2010, we have aspired to build the
  leading mRNA technology platform, the infrastructure to
  reimagine how medicines are created and delivered, and a
  world-class team. We believe in giving our people a platform
  to change medicine and an opportunity to change the world.

  By living our mission, values, and mindsets every day, our
  people are the driving force behind our scientific progress
  and our culture. Together, we are creating a culture of
  belonging and building an organization that cares deeply for
  our patients, our employees, the environment, and our
  communities.

  We are proud to have been recognized as a Science Magazine
  Top Biopharma Employer, a Fast Company Best Workplace for
  Innovators, and a Great Place to Work in the U.S.

  If you want to make a difference and join a team that is
  changing the future of medicine, we invite you to visit
  modernatx.com/careers to learn more about our current
  opportunities.

  Our Working Model 

  As we build our company, we have always believed an in-
  person culture is critical to our success. Moderna champions
  the significant benefits of in-office collaboration by
  embracing a 70/30 work model. This 70% in-office structure
  helps to foster a culture rich in innovation, teamwork, and
  direct mentorship. Join us in shaping a world where every
  interaction is an opportunity to learn, contribute, and make
  a meaningful impact.

  Moderna is a smoke-free, alcohol-free, and drug-free work
  environment.

