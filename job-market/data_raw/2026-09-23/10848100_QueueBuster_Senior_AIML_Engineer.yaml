description: |
  Position Title:    Senior AI/ML Engineer

  Location:            Noida

  Position Type:   Full time (Onsite)

  Experience:       3+ Year

  About Us:

  QueueBuster, founded in 2016 is India’s business super app.
  It is a powerful Android-based Mobile POS application for
  all kinds of businesses. From large format retail stores to
  small carts and kiosks, QueueBuster has everything that you
  need to run your business with ease. With features like
  Billing, Inventory, Khata, Online Dukaan, Customers, and
  Loyalty, it is the most sought-after solution for every
  business.

  Job Description:

  We are seeking an accomplished Senior AI/ML Engineer to
  spearhead the design, development, and deployment of
  intelligent agent-based systems and advanced machine
  learning solutions. This role combines technical expertise,
  product-focused innovation, and hands-on engineering
  expertise to deliver scalable AI capabilities that power
  next-generation enterprise applications.

  Skills and Qualifications:

  Strategy & Execution

  - Contribute to AI/ML Development - Design, build, and
    optimize AI/ML models and systems that align with product
    and business objectives
  - Technical Road map Execution - Translate defined technical
    road maps into actionable engineering tasks, ensuring
    timely delivery of high-quality solutions
  - Cross-Functional Collaboration - Work closely with Product,
    Engineering, and Business teams to implement AI-driven
    features and support transformation initiatives
  - Continuous Learning & Innovation - Stay updated on emerging
    AI/ML technologies and apply them to enhance product
    capabilities and performance

  AI Agent Development

  - Architect and implement intelligent autonomous agents
    powered by Large Language Models (LLMs)
  - Build agent-based systems using frameworks such as Lang-
    chain, AutoGPT, Crew AI, and other emerging technologies
  - Design multi-agent collaboration frameworks and task
    orchestration pipelines for complex workflows.

  Integration & Scalability

  - Integrate AI agents with enterprise APIs, databases, and
    external systems
  - Optimize performance, reliability, and scalability of
    deployed AI solutions
  - Apply best practices in MLOps, CI/CD, and cloud-native ML
    workflows.

  Innovation & Governance

  - Stay updated on emerging AI/ML trends, including Generative
    AI, multi-modal architectures, and reinforcement learning
  - Promote adoption of Responsible AI frameworks, ensuring
    fairness, transparency, and compliance
  - Document workflows, experiments, and outcomes to support
    organizational knowledge sharing.

  Required Skills & Qualifications:

  - Bachelor’s/Master’s/PhD in Computer Science, Artificial
    Intelligence, Machine Learning, or related field
  - 3+ years of experience in AI/ML engineering
  - Strong programming expertise in Python (experience with
    LangChain, TensorFlow, PyTorch, Hugging Face is a plus)
  - Proven track record of deploying ML models and agent-based
    systems at scale in cloud environments (AWS, Azure, GCP)
  - Solid understanding of multi-agent architectures, NLP,
    reinforcement learning, and workflow orchestration
  - Excellent problem-solving, analytical, and stakeholder
    management skills
  - Hands-on experience with Generative AI, LLM fine-tuning, and
    advanced deep learning architectures
  - Knowledge of Responsible AI frameworks and bias mitigation
    techniques
  - Contributions to open-source AI/ML projects on forecasting &
    credit score preferred
  - Experience in building AI platforms or internal ML tooling
    for product organizations

  What We Offer:

  - Opportunity to lead cutting-edge AI/ML initiatives in a
    fast-growing product organization
  - Collaborative, innovation-driven environment with exposure
    to real-world enterprise challenges
  - Competitive compensation and benefits package
  - Professional growth through leadership opportunities and
    continuous learning
