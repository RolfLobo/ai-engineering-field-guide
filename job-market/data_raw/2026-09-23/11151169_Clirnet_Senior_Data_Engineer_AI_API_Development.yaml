description: |
  📍 Location: Kolkata📅 Type: Full-Time🧑‍💻 Department:
  Artificial Intelligence / Software Engineering🌟 About the
  Role

  We are looking for a Senior Data Engineer with a passion for
  Data Warehousing, AI research and API development to join
  our growing team. In this role, you will be responsible for
  building scalable, high-performance APIs and contributing to
  AI/ML research and implementation. You will work closely
  with data scientists, researchers, and product teams to
  design and deploy intelligent systems that power our next-
  generation applications.

  🛠️ Key Responsibilities

  - Design, develop, and maintain Python-based APIs for AI/ML
    models and services and data pipelines
  - Collaborate with AI researchers to implement and optimize
    machine learning models interfacing with data warehouse
  - Conduct research into new AI/ML techniques and evaluate
    their applicability to business problems
  - Build RESTful and GraphQL APIs using frameworks like
    FastAPI, Flask, or Django REST Framework
  - Write clean, testable, and maintainable Python code with a
    focus on performance and scalability
  - Participate in code reviews, mentor junior developers, and
    contribute to best practices
  - Integrate AI models with backend systems and frontend
    applications
  - Stay up-to-date with AI/ML trends, Python libraries (e.g.,
    PyTorch, TensorFlow, Scikit-learn), and API design
    patterns
  - Work in an agile environment, delivering high-quality
    software in iterative sprints

  🎓 Qualifications

  - Bachelor’s or Master’s degree in Computer Science, Data
    Science, or a related field
  - 4 + years of professional experience in software
    development, with 3 + years in Python
  - Strong experience with Python web frameworks (e.g., FastAPI,
    Flask, Django)
  - Hands-on experience with AI/ML model deployment and
    integration
  - Familiarity with machine learning libraries such as
    TensorFlow, PyTorch, or Scikit-learn
  - Experience with API design and development, including REST
    and GraphQL
  - Solid understanding of software architecture, design
    patterns, and best practices
  - Excellent problem-solving skills and attention to detail
  - Strong communication skills and the ability to work in a
    collaborative, cross-functional team
  - Bonus: Experience with Docker, Kubernetes, CI/CD pipelines,
    and cloud platforms (AWS, GCP, Azure)

  🧠 What We’re Looking For in a Candidate

  - A curious mind with a passion for AI and software
    development
  - A team player who can mentor and guide others
  - A self-starter who can take initiative and deliver results
  - A lifelong learner who stays current with emerging
    technologies and trends

  🌐 Why Join Us?

  - Work on cutting-edge AI projects with real-world impact
  - Collaborate with top-tier researchers and engineers
  - Flexible work environment and remote-friendly options
  - Competitive salary and performance-based incentives
  - Opportunities for professional growth and leadership
  - A culture that values innovation, collaboration, and
    continuous learning

  📬 How to Apply

  If you're a Python developer with a passion for AI and API
  development, we’d love to hear from you. Please submit your
  resume, GitHub profile, and a brief summary of your
  experience with Python and AI projects.
