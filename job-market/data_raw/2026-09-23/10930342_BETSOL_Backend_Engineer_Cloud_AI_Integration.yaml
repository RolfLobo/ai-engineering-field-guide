  Job Description

  About the Role

  We are looking for a Backend Engineer, Cloud & AI
  Integration, to build and maintain backend services, APIs,
  and integrations that support AI product and internal tools.

  This role will focus on Python-based backend services, REST
  APIs, data models, third-party integrations, and cloud-
  native workflows on AWS. The engineer will work closely with
  Full Stack Engineers to provide reliable backend services
  that can support scalable product development.

  This is a mid-level backend engineering role suited for
  someone with strong hands-on experience in backend
  development, cloud services, APIs, and production systems.
  AI and Human-in-the-Loop workflows will be taught as part of
  the role, so prior AI or ML experience is not mandatory.

  Responsibilities

  - Develop and maintain backend services and REST APIs using
    Python.
  - Build and manage integrations with third-party platforms and
    internal systems.
  - Support AI-powered features and Human-in-the-Loop workflows
    where AI output is reviewed by a person before the next
    step.
  - Design reliable data models, backend workflows, and business
    logic.
  - Build serverless and cloud-native backend applications on
    AWS.
  - Troubleshoot and resolve production issues across backend
    services.
  - Collaborate with Full Stack Engineers to deliver end-to-end
    product features.
  - Own the backend development scope for assigned features and
    integrations.
  - Contribute to code reviews, testing, documentation, and
    release activities.
  - Ensure backend services are reliable, scalable, well-tested,
    and maintainable

  Looking For

  - 5+ years of total experience with 3+ years of experience in
    backend application development and production support.
  - Hands-on experience building and maintaining Python-based
    backend services.
  - Strong experience designing and consuming REST APIs.
  - Experience working with AWS and cloud-native application
    development.
  - Experience with relational and/or NoSQL databases in
    production environments.
  - Experience integrating third-party APIs and external
    services.
  - Familiarity with Git-based development workflows.
  - Ability to work in a mid-level engineering role with strong
    execution and collaboration.
  - Comfortable working with Full Stack Engineers, owning the
    backend side of feature delivery.

  Mandatory Skills

  A. Technical Skills

  - Python backend development
  - REST API design and development
  - AWS cloud services
  - Cloud-native backend application development
  - Relational and/or NoSQL databases
  - Third-party API integrations
  - Serverless backend workflows
  - Git-based development
  - Production issue troubleshooting
  - Backend service testing and documentation

  B.Soft Skills

  - Strong problem-solving skills
  - Good communication and collaboration
  - Ability to work with cross-functional engineering teams
  - Ownership of assigned backend deliverables
  - Attention to code quality, reliability, and documentation
  - Ability to troubleshoot issues in a production environment

  Good to Have Skills

  - Serverless application development experience
  - Experience with asynchronous processing, messaging, or
    event-driven architecture
  - Experience working in Agile software development teams
  - Exposure to AI-powered product features
  - Exposure to Human-in-the-Loop workflows
  - Track record of writing clean, well-tested, and well-
    documented code



  Qualifications

  Bachelor’s degree in Computer Science, Engineering, or a
  related field is preferred.

  Additional Information

  This would be a contract role for four months
