description: |
  About this role: Wells Fargo is seeking a Lead Software
  Engineer. In this role, you will:

  - Lead complex technology initiatives including those that are
    companywide with broad impact
  - Act as a key participant in developing standards and
    companywide best practices for engineering complex and
    large scale technology solutions for technology
    engineering disciplines
  - Design, code, test, debug, and document for projects and
    programs
  - Review and analyze complex, large-scale technology solutions
    for tactical and strategic business objectives, enterprise
    technological environment, and technical challenges that
    require in-depth evaluation of multiple factors, including
    intangibles or unprecedented technical factors
  - Make decisions in developing standard and companywide best
    practices for engineering and technology solutions
    requiring understanding of industry best practices and new
    technologies, influencing and leading technology team to
    meet deliverables and drive new initiatives
  - Collaborate and consult with key technical experts, senior
    technology team, and external industry groups to resolve
    complex technical issues and achieve goals
  - Lead projects, teams, or serve as a peer mentor

  Required Qualifications:

  - 5+ years of Software Engineering experience, or equivalent
    demonstrated through one or a combination of the
    following: work experience, training, military experience,
    education

  Desired Qualifications:

  - Deep expertise in AIOps platforms and tools (e.g.,
    Prometheus, AppDynamics, Splunk, ITRS Geneos, BigPanda,
    OpenTelemetry ecosystems)
  - Strong experience with AI/ML for IT operations, including
    anomaly detection, event correlation, forecasting, and
    intelligent alerting
  - Hands-on experience with automation frameworks (e.g.,
    Ansible, Terraform, or similar) and event-driven
    architectures
  - Strong understanding of SRE principles, SLIs/SLOs, error
    budgets, and reliability engineering practices
  - Experience building self-healing systems and closed-loop
    remediation workflows
  - Proficiency in cloud platforms and cloud-native
    architectures (Kubernetes, microservices)
  - Knowledge of data pipelines, streaming platforms (Kafka),
    and telemetry ingestion/processing
  - Familiarity with GenAI/LLM-assisted operations, including
    incident summarization, knowledge mining, and automated
    runbook generation
  - Ability to operate across complex organizational structures
    with strong stakeholder management and communication
    skills
  - Proven ability to define target-state architecture,
    operating models, and actionable roadmaps

  Job Expectations:

  - Ability to manage multiple high-complexity engineering
    initiatives with significant enterprise impact
  - Strong analytical, problem-solving, and architectural design
    skills
  - Excellent communication and documentation skills (e.g.,
    Confluence, Git, architecture diagrams)
  - Comfortable driving transformation and influencing senior
    leadership in a fast-paced, evolving environment
  - This position is not open to visa initiation or transfer

  This role sits at the core of CCIBT's Zero Touch Production
  (ZTP) transformation agenda, driving the strategy,
  architecture, and execution of next-generation AIOps
  capabilities across the enterprise. You will define and
  deliver intelligent, autonomous operations by leveraging
  AI/ML, observability, automation, and event-driven
  architectures to minimize manual intervention, improve
  resilience, and enable self-healing systems. You will
  partner closely with senior engineering, platform, SRE, and
  business leaders to accelerate AIOps adoption, embed
  intelligence into production ecosystems, and deliver
  measurable improvements in availability, efficiency, and
  operational risk reduction. Posting End Date: 24 Sep 2026
  *Job posting may come down early due to volume of
  applicants. We Value Equal Opportunity Wells Fargo is an
  equal opportunity employer. All qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, sex, sexual orientation, gender identity,
  national origin, disability, status as a protected veteran,
  or any other legally protected characteristic. Employees
  support our focus on building strong customer relationships
  balanced with a strong risk mitigating and compliance-driven
  culture which firmly establishes those disciplines as
  critical to the success of our customers and company. They
  are accountable for execution of all applicable risk
  programs (Credit, Market, Financial Crimes, Operational,
  Regulatory Compliance), which includes effectively following
  and adhering to applicable Wells Fargo policies and
  procedures, appropriately fulfilling risk and compliance
  obligations, timely and effective escalation and remediation
  of issues, and making sound risk decisions. There is
  emphasis on proactive monitoring, governance, risk
  identification and escalation, as well as making sound risk
  decisions commensurate with the business unit's risk
  appetite and all risk and compliance program requirements.
