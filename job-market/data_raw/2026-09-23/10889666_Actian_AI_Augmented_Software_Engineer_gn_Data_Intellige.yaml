description: |
  Actian is the company behind the Data Intelligence Platform
  — an enterprise solution that helps organisations discover,
  govern, and trust their data at scale. Our platform connects
  metadata, data lineage, data quality, and business context
  into a single knowledge graph, enabling enterprises to turn
  raw data into reliable decisions. We operate globally, move
  fast, and build for the long term.

  Software engineering is being redefined. The engineers who
  will shape the next decade of product development are not
  the ones who write the most code — they are the ones who
  know how to think clearly, ship confidently, and use every
  tool available to them, including AI, to multiply their
  impact.

  We are looking for an AI-First Software Engineer who is a
  builder by instinct. You are comfortable picking up a
  feature end-to-end, making architectural decisions, writing
  production-grade code, and shipping without waiting to be
  told what to do next. You treat AI coding assistants not as
  a novelty but as a core part of your workflow, using them to
  accelerate development, reduce boilerplate, explore
  solutions faster, and stay focused on what actually requires
  your judgment.

  You will join one of our feature teams working on the Actian
  Data Intelligence Platform.

