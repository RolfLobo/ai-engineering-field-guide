job_id: 10943736
title: Developer Relation Manager - Edge AI and Robotics
company: NVIDIA
location: USA
remote: true
work_type: FULL_TIME
description: |
  We are building the future of intelligent edge systems — and
  we need someone who can bring our developers and customers
  along for the ride! As a Developer Relations Manager for the
  Jetson Platform, you will be the go-to resource connecting
  customers and developers to the full depth of the Jetson SW
  stack: BSP, security, OTA, real-time workloads, mixed-
  criticality systems, AI libraries, and agentic AI.

  You will work directly with developers and customers to help
  them build and ship powerful, optimized solutions for edge
  AI and robotics on Jetson. At the same time, you will bring
  their challenges and insights back to our engineering and
  product teams — shaping the platform roadmap from the ground
  up.

  What you’ll be doing:

  - Build and own relationships across our Jetson ecosystem —
    ISVs, OEMs, ODMs, and robotics companies — and drive deep,
    sustained adoption of the Jetson SW stack.
  - Guide customers through the Jetson platform — BSP, security,
    OTA, real-time behavior, and mixed-criticality workloads —
    helping them move from integration to production
    confidently.
  - Champion NVIDIA AI libraries and frameworks on Jetson,
    helping developers extract peak performance for their edge
    AI and robotics applications.
  - Enable deployment of AI models and agentic pipelines on
    Jetson — on-device LLM inference, vision-language models —
    matching developers to the right capabilities and
    practices.
  - Feed developer insights directly into our product and
    engineering teams, shaping platform priorities, reference
    designs, and go-to-market strategy.
  - Stay sharp on the edge AI and robotics landscape to inform
    platform positioning and continuously improve the
    developer experience.

  What We Need to See:

  - 8+ years in embedded systems, platform engineering,
    developer relations, or technical evangelism in a
    hardware-software ecosystem, with a Bachelor's degree in
    CS, EE, or equivalent experience.
  - Solid understanding of embedded Linux platforms — BSP,
    kernel, device drivers, security, OTA, and real-time
    considerations — sufficient to guide customers through
    tough integration challenges.
  - Proven track record building developer and customer
    relationships and driving technical adoption at scale
    across a diverse partner portfolio.
  - Excellent communication skills — able to make complex
    platform internals accessible to developers and translate
    developer needs clearly back to engineering teams.

  Ways to Stand Out From the Crowd:

  - Hands-on experience with NVIDIA Jetson platforms (Orin,
    Xavier) and the JetPack SDK.
  - Experience productizing or deploying agentic AI, on-device
    LLM inference, or VLMs for edge or robotics applications.

  We are a team of engineers and technologists obsessed with
  making Jetson the world's best platform for edge AI and
  robotics. We sit at the intersection of research and real-
  world deployment, partnering with companies building
  autonomous machines, industrial systems, healthcare devices,
  and smart infrastructure. If that excites you, we want to
  hear from you!

  Your base salary will be determined based on your location,
  experience, and the pay of employees in similar positions.
  The base salary range is 184,000 USD - 287,500 USD for Level
  4, and 224,000 USD - 356,500 USD for Level 5.

  You will also be eligible for equity and benefits.

  Applications for this job will be accepted at least until
  September 4, 2026.

  This posting is for an existing vacancy.

  NVIDIA uses AI tools in its recruiting processes.

  NVIDIA is committed to fostering an inclusive work
  environment and proud to be an equal opportunity employer.
