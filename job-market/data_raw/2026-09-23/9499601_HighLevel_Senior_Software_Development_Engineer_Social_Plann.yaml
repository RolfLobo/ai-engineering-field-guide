  About the Team:

  The Social Planner team is a dedicated product group within
  HighLevel’s Leadgen organization, focused on delivering a
  seamless social media management experience. We empower
  agencies and businesses to create, schedule, and manage
  posts across multiple platforms, while also providing
  automation, analytics, and engagement tools.

  Our primary objectives are to drive Social Planner adoption,
  improve feature retention, and maximize user engagement by
  making social publishing effortless and impactful.

  We are responsible for:

  Post Publishing & Scheduling We enable agencies to publish
  and schedule posts across major social platforms, ensuring
  timely and consistent content delivery.

  Post Automation We support advanced publishing workflows,
  including CSV uploads, RSS-to-post, Review Posts, Category
  Queues, and Recurring Queues—giving agencies full
  flexibility to manage content at scale.

  Engagement & Insights Through Social Statistics, Comment
  Management, and Social Listening, we provide agencies with
  deep insights into performance and engagement, enabling
  data-driven content strategies.

  Best Time to Post We surface AI-driven recommendations on
  when to post for maximum reach and engagement, helping
  agencies optimize their content strategy.

  Multi-Platform Integration We currently support integrations
  with 9 major platforms—Google Business Profile, Facebook,
  Instagram, LinkedIn, TikTok, YouTube, Pinterest, Threads,
  and Bluesky—along with HighLevel’s internal Community
  product.

  About the Role:

  Millions of businesses post to social media through
  HighLevel's Social Planner. Hundreds of thousands of posts
  go out every day across every major social platform, each
  with its own API, rate limits and frequent changes. Our job
  is to make that look easy. We're a small team with a big
  surface area, and we're building the next layer on top of
  publishing: understanding what the internet is saying about
  our customers, at scale, with AI. We're hiring a senior full
  stack engineer who wants to own that.

  Responsibilities

  Requirements

  - 4+ years building and operating production distributed
    systems.
  - Experience with large-scale data engineering: ingestion,
    ETL/ELT, data warehousing (ClickHouse, BigQuery, Snowflake
    or similar), and analytics over billions of rows. Social
    listening, NLP or sentiment analysis is a big plus.
  - Strong fundamentals in any language. We write TypeScript
    (Node.js, NestJS, Vue.js).
  - Customer-first mindset. You start from the problem, not the
    tech.
  - Hands-on experience with AI-assisted development. You use AI
    coding tools daily, can explain your workflow and stand
    behind the output.
  - Genuine passion for software. You follow the industry for
    fun and want to grow as fast as the product does.

