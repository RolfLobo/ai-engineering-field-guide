description: |
  About Mercor

  Mercor's mission is to organize human intelligence to power
  the AI economy. We're a leading AI data company, building
  the layer between human expertise and frontier models.
  Millions of domain experts on the platform are paid over $4
  million per day to train frontier AI models. Mercor's APEX
  benchmark family measures AI's real-world impact on
  professional work. Mercor Enterprise brings this same
  infrastructure to Fortune 500 companies: helping companies
  capture how their best people actually work, translating
  that expertise directly back into agents.



  Mercor is creating a new category of work where expertise
  powers AI advancement. Achieving this requires an ambitious,
  fast-paced and deeply committed team. You’ll work alongside
  researchers, operators, and AI companies at the forefront of
  shaping the systems that are redefining society. Mercor is a
  profitable Series C company valued at $10 billion. We work
  in-person five days a week in our San Francisco, NYC, or
  London offices.

  About the Role

  As a Software Engineer, Applied AI on Mercor's Enterprise
  team, you'll operate at the intersection of engineering,
  product, and customer success. Engineers on this team are
  builders first, embedding directly with enterprise clients
  to design and implement technical solutions that unlock the
  full value of Mercor's platform while applying strong
  systems and product thinking where it matters. The work
  spans everything from architecting integrations and writing
  production-grade code to deploying scalable solutions in
  production environments, always tied closely to measurable
  business outcomes. You'll collaborate with customer
  stakeholders and internal teams to deliver systems that
  directly shape how AI-powered human intelligence integrates
  into complex enterprises.

  You will:

  - Embed with enterprise customers to understand technical
    requirements and business goals.
  - Architect and implement custom integrations, APIs, and
    workflows on top of Mercor’s platform.
  - Deploy scalable solutions in client environments and drive
    successful launches and expansions.
  - Build internal tools and reusable components that accelerate
    future deployments.
  - Translate ambiguous enterprise needs into clear technical
    plans and shipped systems.

  What We’re Looking For

  - Computer Science background or a degree in a related field
    (Electronics Engineering, Physics, Mathematics,
    Statistics, etc.)
  - Strong software engineering fundamentals in at least one
    modern language (Python, Go, Rust, etc.).
  - Experience building and deploying production systems in
    cloud environments (AWS/GCP/Azure).
  - Comfort working directly with customers and explaining
    technical concepts to non-technical stakeholders.
  - High ownership mindset with the ability to navigate
    ambiguity and operate autonomously in high-stakes
    environments.

  Why Mercor

  - Impact: Your work defines how leading enterprises deploy AI-
    powered human intelligence systems.
  - Learning: Gain deep exposure to real-world applications of
    AI across industries and use cases.
  - Growth: Work across engineering and product with fast paths
    to ownership.

  Benefits

  - Bi-annual performance bonus structure
  - Generous equity grant vested over 4 years
  - Up to $15k Relocation bonus
  - $10K housing bonus (if you live within 0.5 miles of our
    office)
  - $1.5K monthly stipend for meals
  - Free Equinox membership
  - $200 monthly laundry reimbursement
  - $200 monthly personal wellness reimbursement
  - Health, Dental, Vision insurance
