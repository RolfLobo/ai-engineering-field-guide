description: |
  In the Technology division, we leverage innovation to build
  the connections and capabilities that power our Firm,
  enabling our clients and colleagues to redefine markets and
  shape the future of our communities. This is a Data &
  Analytics Engineering position at the Associate level, which
  is part of the job family responsible for providing
  specialist data analysis and expertise that drive decision-
  making and business insights as well as crafting data
  pipelines, implementing data models, and optimizing data
  processes for improved data accuracy and accessibility,
  including applying machine learning and AI-based techniques.

  Role Overview This role is to build out the ISG GenAI & Data
  Analytics strategy, specifically working on the Chat With
  Your Data solution (DaiZy), integrating with Enterprise AI
  solutions and preparing datasets for GenAI usage. Candidates
  are expected to have hands-on data platform and LLM
  experience to design, build, and deploy scalable services
  and integrations for business-critical applications. Strong
  Python skills, production-ready coding standards, and
  effective collaboration in a client-facing consulting
  environment.

  What you'll do in the role:

  - Design, build, and maintain backend services, REST APIs, and
    integrations using Python (FastAPI, Flask, or Django);
    some Node.js/TypeScript as needed.
  - Build distributed services in a microservices architecture
    with token-based auth and role-based access controls.
  - Integrate internal apps with third-party systems, external
    APIs, and Snowflake (data access, transformation,
    integration).
  - Develop LLM-powered features: model APIs, prompt workflows,
    structured outputs, and retrieval-based (RAG)
    applications.
  - Write clean, modular, secure code with unit, integration,
    and automated tests.
  - Participate in code reviews, Git workflows, and CI/CD
    pipelines.
  - Troubleshoot application, integration, data, and production
    issues.
  - Collaborate with architects, engineers, data teams, product
    owners, and clients; translate requirements into
    implementation plans and clear technical documentation.

  What you'll bring to the role:

  - 3–5 years of software development or consulting experience.
  - Strong Python proficiency with at least one framework
    (FastAPI, Flask, or Django); working knowledge of
    Node.js/TypeScript.
  - Solid grasp of REST API design, microservices, auth, and
    service-to-service integration.
  - Experience with Git workflows, CI/CD, and automated testing.
  - Hands-on Snowflake experience (data migration, querying and
    app integration).
  - Proficiency integrating LLMs via hosted model APIs or
    enterprise AI platforms.
  - Strong debugging, communication, and problem-solving skills;
    able to work independently and within multidisciplinary
    teams.
  - Finance business understanding

  WHAT YOU CAN EXPECT FROM MORGAN STANLEY:

   At Morgan Stanley, we raise, manage and allocate capital
  for our clients – helping them reach their goals. We do it
  in a way that’s differentiated – and we’ve done that for 90
  years.  Our values - putting clients first, doing the right
  thing, leading with exceptional ideas, committing to
  diversity and inclusion, and giving back - aren’t just
  beliefs, they guide the decisions we make every day to do
  what's best for our clients, communities and more than
  80,000 employees in 1,200 offices across 42 countries. At
  Morgan Stanley, you’ll find an opportunity to work alongside
  the best and the brightest, in an environment where you are
  supported and empowered. Our teams are relentless
  collaborators and creative thinkers, fueled by their diverse
  backgrounds and experiences. We are proud to support our
  employees and their families at every point along their
  work-life journey, offering some of the most attractive and
  comprehensive employee benefits and perks in the industry.
  There’s also ample opportunity to move about the business
  for those who show passion and grit in their work.

  To learn more about our offices across the globe, please
  copy and paste https://www.morganstanley.com/about-
  us/global-offices into your browser.

  Expected base pay rates for the role will be between $95,000
  and $135,000 per year at the commencement of employment.
  However, base pay if hired will be determined on an
  individualized basis and is only part of the total
  compensation package, which, depending on the position, may
  also include commission earnings, incentive compensation,
  discretionary bonuses, other short and long-term incentive
  packages, and other Morgan Stanley sponsored benefit
  programs.

  Morgan Stanley is an equal opportunity employer committed to
  building and maintaining a workforce that is diverse in
  experience and background.  Our recruiting efforts reflect
  our strong commitment to a culture of inclusion, where
  individuals are hired, developed, and advanced based on
  their skills and talents.

  Our workforce reflects a broad cross-section of the global
  communities in which we operate, bringing a variety of
  backgrounds, talents, perspectives, and experiences.

  For more information, please visit:
  https://www.morganstanley.com/people-opportunities/eeo.
