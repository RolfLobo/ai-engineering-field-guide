  Company Overview

  At Motorola Solutions, we believe that everything starts
  with our people. We’re a global close-knit community, united
  by the relentless pursuit to help keep people safer
  everywhere. We build and connect technologies to help
  protect people, property and places. Our solutions foster
  the collaboration that’s critical for safer communities,
  safer schools, safer hospitals, safer businesses, and
  ultimately, safer nations. Connect with a career that
  matters, and help us build a safer future.

  Department OverviewBased in Bengaluru, India, the AI
  Scientist will be a hands-on technical contributor
  responsible for designing, developing, and deploying state-
  of-the-art machine learning models that power Motorola
  Solutions’ mission-critical security and public safety
  products. This role requires deep technical acumen in
  specific AI domains, focusing on translating research into
  scalable, high-performance production systems. The AI
  Scientist will be a core member of our central AI
  organization, contributing directly to the foundational
  models and algorithms consumed by downstream product teams.
  Key Responsibilities The AI Scientist will be responsible
  for the research, development, and delivery of AI/ML models
  across the following core areas: Model Research &
  Development: Conduct end-to-end development of AI/ML models
  from initial concept and literature review through to
  production deployment and monitoring. Data Lifecycle
  Management: Collaborate with data engineering teams on
  large-scale dataset creation, annotation, quality control,
  and pipeline optimization to ensure high-quality training
  data. Algorithm Optimization: Focus on optimizing model
  performance for real-time and edge deployment constraints,
  including latency, throughput, and computational efficiency.
  Specialized AI Focus in at one of or more of the following
  areas: Voice AI/Natural Language Processing: Evaluate, adapt
  and/or train robust speech recognition, translation, natural
  language understanding, and audio understanding models
  tailored for noisy, real-world public safety and security
  environments. Computer Vision & Video Analytics: Develop and
  enhance models for complex object detection, tracking, re-
  identification, video search capabilities, and scene
  understanding from diverse video sources. Foundational Model
  Fine-Tuning: Evaluate, fine-tune, and adapt large pre-
  trained and foundational models (e.g., LLMs, large vision
  models) for specific security-focused tasks and domain-
  specific knowledge integration. Collaboration: Partner with
  software engineers to integrate models into the enterprise-
  scale cloud and edge AI platforms, ensuring reliability and
  scalability. Evaluation & Validation: Establish rigorous,
  metric-driven evaluation frameworks (e.g., Precision,
  Recall, F1-Score) to benchmark model performance and drive
  continuous improvement on quantifiable customer outcomes.
  Job Description

  As an AI Research Scientist, you will be part of a
  multidisciplinary team of engineers and researchers in our
  AI R&D team. Our goal is to build advanced vision models
  that contribute to a safer world. Your responsibilities will
  include researching, designing, and developing the
  underlying algorithms to solve practical problems, creating
  prototypes, and collaborating with various product
  development teams to deliver high-quality solutions for both
  edge computing and cloud environments.

  Key Responsibilities

  - Conduct cutting-edge research in machine learning and
    computer vision, focusing on solutions for public safety
    and video security.
  - Stay up-to-date with the latest advancements in the field by
    regularly reviewing published research papers.
  - Generate high-quality patents in applied computer vision.
  - Collaborate with software development teams to deploy the
    vision models you design and train.
  - Contribute to the continuous improvement of the
    organization's machine learning deployment processes and
    tools.

  Basic Requirements:

  - PhD in a technical field.
  - 5+ years of professional experience in applied AI research.
  - A deep understanding of Transformer architectures and
    Vision-Language Models.
  - Experience in Python programming and working with deep
    learning frameworks such as PyTorch.

  Differentiators:

  - Experience in C++ programming and working with embedded
    systems.
  - Experience with Docker and Kubernetes.
  - Proven ability to write clean, efficient, and well-
    documented production-level code.

