title: Guidewire AI Developer, Senior Associate
company: PwC
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  The Opportunity As a Guidewire AI Developer, Senior
  Associate, you will specialize in developing and customizing
  applications using the Guidewire platform, a comprehensive
  software suite designed for insurance companies to manage
  policy administration, claims, and billing. Within our
  Business Application Consulting practice, you will analyze
  client needs, implement software solutions, and provide
  training and support to optimize operational efficiency and
  help clients achieve their strategic objectives. As a Senior
  Associate, you will focus on building meaningful client
  connections and learning how to manage and inspire others.
  You will navigate increasingly complex situations, growing
  your personal brand and deepening your technical skills. You
  are expected to anticipate the needs of your teams and
  clients, delivering quality solutions while embracing
  ambiguity and using these moments as opportunities for
  growth. In this role, you will design, code, and test
  software solutions tailored to the specific needs of
  insurance organizations. You will leverage your skills to
  interpret data, inform insights, and uphold professional and
  technical standards. This position offers a dynamic
  environment where you can develop a deeper understanding of
  the business context and contribute to the broader
  objectives of your projects. Responsibilities
  - Developing and customizing applications using the Guidewire
    platform to meet insurance industry needs
  - Designing, coding, and testing software solutions for policy
    administration, claims management, and billing
  - Analyzing client requirements to implement software
    solutions that optimize operational efficiency
  - Providing training and support for seamless integration and
    utilization of business applications
  - Collaborating with clients to understand their strategic
    objectives and deliver tailored solutions
  - Utilizing AI fluency and analytical thinking to enhance
    software development processes
  - Engaging in AI-human collaboration to improve system
    development and integration
  - Configuring Guidewire BillingCenter and ClaimCenter to align
    with client specifications
  - Applying software development methodologies to manage and
    execute project deliverables
  - Embracing change and demonstrating learning agility to adapt
    to evolving business contexts
  - Interpreting data to inform insights and recommendations for
    client engagements
  - Upholding professional and technical standards in all
    aspects of software development and client interactions
  What You Must Have
  - At least a Bachelor's degree
  - At least 3 years of experience
  What Sets You Apart
  - Preference for a Master's or Masters of Business
    Administration degree in at least one of the following
    fields of study: Actuarial Science, Business
    Administration/Management, Business Analytics, Commerce,
    Computer and Information Science, Computer Applications,
    Computer Engineering, Computer Engineering & Accounting,
    Data Processing/Analytics/Science, Economics, Electrical
    Engineering, Engineering, Engineering and Business,
    Finance, Information Technology, Management Information
    Systems, Mathematics, Mechanical Engineering, Operations
    Management/Research, Risk Management, Software App,
    Statistics
  - Demonstrating proficiency in Guidewire BillingCenter and
    ClaimCenter configuration
  - Utilizing AI fluency to enhance software development
    methodologies
  - Embracing change and adapting to complex insurance sector
    technology
  - Developing intellectual curiosity and learning agility in
    client support
  - Navigating ambiguity while building meaningful client
    relationships
  - Interpreting data to inform insights and recommendations
  The salary range for this position is: $77,000 - $202,000.
