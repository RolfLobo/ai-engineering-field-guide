  Profile Summary:

  The AI Principal Engineer (IC Director) role is responsible
  for leading the design and delivery of complex, production-
  grade AI systems with significant business impact. This role
  serves as a technical leader across multiple initiatives,
  owning major components or domains and influencing
  architectural direction, engineering practices, and solution
  quality. The position operates with a high level of
  independence, driving delivery outcomes while collaborating
  with product, engineering, and governance partners. The role
  is accountable for ensuring AI solutions are scalable,
  reliable, and aligned with enterprise standards in a
  regulated environment.

  Profile Description:

  - Lead the design, development, and deployment of complex AI
    solutions, including LLM-based applications, retrieval
    pipelines, and model-driven services
  - Own technical direction for major components or domains
    within AI platforms or products
  - Drive engineering best practices for model evaluation,
    testing, monitoring, and operationalization
  - Partner with product, data, and business stakeholders to
    translate requirements into scalable AI solutions
  - Contribute to architecture decisions, including model
    selection, system integration, and API design
  - Ensure solutions meet enterprise standards for security,
    privacy, and responsible AI
  - Mentor and guide engineers, contributing to team capability
    and engineering quality
  - Identify technical risks and implement appropriate
    mitigation strategies

  Knowledge & Experience:

  - Bachelor’s degree in Computer Science, Engineering,
    Mathematics, or a related field; advanced degree preferred
  - Significant experience delivering production AI/ML systems,
    including model deployment and operationalization
  - Strong proficiency in programming languages such as Python,
    TypeScript, or Rust
  - Experience with AI/ML frameworks, LLM technologies, and data
    pipelines
  - Knowledge of model lifecycle management, MLOps, and
    production reliability practices
  - Demonstrated ability to lead complex technical initiatives
  - Strong problem-solving skills and ability to work across
    disciplines

