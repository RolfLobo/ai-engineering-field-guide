description: |
  Do you want your voice heard and your actions to count?

  Discover your opportunity with Mitsubishi UFJ Financial
  Group (MUFG), one of the world’s leading financial groups.
  Across the globe, we’re 150,000 colleagues, striving to make
  a difference for every client, organization, and community
  we serve. We stand for our values, building long-term
  relationships, serving society, and fostering shared and
  sustainable growth for a better world.

  With a vision to be the world’s most trusted financial
  group, it’s part of our culture to put people first, listen
  to new and diverse ideas and collaborate toward greater
  innovation, speed and agility. This means investing in
  talent, technologies, and tools that empower you to own your
  career.

  Join MUFG, where being inspired is expected and making a
  meaningful impact is rewarded.

  MUFG, a globally respected financial institution, is seeking
  an Associate Vice President AI Engineer to join their
  Corporate Technology team in London. This role offers you
  the opportunity to work at the forefront of AI innovation
  within a supportive and inclusive environment, where your
  expertise will help shape the future of digital delivery
  across EMEA. You will be part of a knowledgeable and
  dependable team that values collaboration, training
  opportunities, and flexible working arrangements. As an AVP
  AI Engineer, you will play a pivotal role in designing,
  delivering, and supporting advanced Generative AI solutions,
  including retrieval augmented generation (RAG) and agentic
  architectures, while contributing to MUFG’s commitment to
  responsible technology and business value. If you are
  passionate about embedding AI into organisational processes
  and driving its adoption, this is your chance to make a
  meaningful impact within a company renowned for its generous
  pension contributions, supportive leadership, and dedication
  to professional growth.

  - Join MUFG’s Corporate Technology team in London and
    contribute to cutting-edge AI engineering projects that
    drive digital transformation across EMEA.
  - Work collaboratively with business stakeholders and Digital
    Transformation teams to design, deliver, and operate high-
    quality Generative AI solutions in a regulated financial
    services environment.
  - Benefit from flexible working opportunities, generous
    pension contributions, ongoing training programmes, and a
    culture that values inclusivity, knowledge sharing, and
    supportive leadership.

  What you'll do:

  As an Associate Vice President AI Engineer at MUFG in
  London, you will immerse yourself in the collaborative
  design and delivery of advanced Generative AI solutions that
  transform business operations across EMEA. Your day-to-day
  responsibilities will involve engaging with stakeholders
  from both technology and business domains to capture
  requirements accurately before translating them into robust
  technical designs. You will investigate emerging
  technologies such as RAG architectures and evaluate their
  suitability based on strategic alignment with MUFG’s goals.

  - Collaborate closely with Digital Transformation (DX&T) teams
    and business stakeholders to understand requirements,
    prioritise opportunity pipelines, and define success
    measures for AI initiatives.
  - Investigate technology options including models and
    platforms, reporting findings based on business value,
    cost analysis, risk assessment, strategic alignment, and
    long-term supportability.
  - Follow MUFG’s Systems Delivery Lifecycle (SDLC) process as
    well as team governance protocols by ensuring thorough
    planning, documentation, release readiness, risk
    management, and regular reporting.
  - Adhere strictly to architectural principles, engineering
    standards, best practices, and quality controls when
    developing AI solutions for the organisation.
  - Provide comprehensive L1, L2, and L3 support across all
    services owned by the AI Engineering team to ensure
    operational excellence.
  - Work with Digital Transformation teams and business owners
    to track outcomes, costs, and return on investment using
    evidence-based approaches to improve or scale solutions as
    appropriate.
  - Ensure all activities comply fully with relevant policies,
    procedures, regulatory requirements, and internal controls
    while maintaining strict adherence to change management
    processes.
  - Embrace MUFG’s values-led culture by promoting inclusivity
    and diversity within the team while helping build a
    delivery-driven environment that strengthens business
    relationships.
  - Proactively identify new AI technologies and champion best
    practices in disciplines such as RAG architectures and
    agentic systems.
  - Collaborate with colleagues across departments to share
    expertise, enhance ways of working together, and provide
    support for others’ development.

  What you bring:

  Your proven track record as an Associate Vice President AI
  Engineer will demonstrate your deep understanding of
  technology delivery within regulated environments such as
  financial services. You bring hands-on expertise in
  deploying custom Generative AI solutions using cloud
  platforms like Azure or AWS, ensuring production-grade
  reliability through robust architecture design. Your
  familiarity with RAG architectures enables you to implement
  advanced vector database strategies alongside prompt
  engineering methods that optimise model performance. You are
  adept at navigating complex governance processes while
  maintaining strict compliance with security protocols and
  data privacy regulations. Your interpersonal skills allow
  you to communicate technical concepts effectively across
  multidisciplinary teams; this ensures seamless collaboration
  between technology specialists and business stakeholders
  alike.

  - Demonstrated experience in technology delivery or operations
    within AI engineering, machine learning or data science
    environments, preferably in financial services or other
    regulated industries.
  - Proven ability in building custom Generative AI solutions on
    Azure (preferred) or AWS platforms with hands-on
    experience in production-grade deployments.
  - Expertise in designing RAG architectures including vector
    databases, prompt engineering techniques, model evaluation
    frameworks and responsible AI practices.
  - Ability to follow technical standards rigorously while
    documenting architectural decisions clearly; skilled at
    assessing alternative technologies or vendors for optimal
    delivery approaches.
  - Comprehensive understanding of security protocols, privacy
    considerations, data governance principles and model risk
    management relevant to global financial organisations.
  - Excellent communication skills enabling you to simplify
    complex technical concepts for diverse audiences including
    business stakeholders.
  - Familiarity with orchestration tools such as
    LangChain/LangGraph plus proficiency in Python programming
    language for developing scalable AI applications.
  - Experience providing effective 1st-, 2nd-, and 3rd-line
    support across multiple business areas ensuring dependable
    service continuity.
  - Knowledge of machine learning techniques including
    predictive analytics or agentic AI; ability to design
    LLMOps or similar operational practices for large-scale
    deployments.
  - Degree-educated in Computer Science or Data Science or
    equivalent practical experience with proven ability to
    adapt small/large language models (SML/LLM) for domain-
    specific contexts.

  What sets this company apart:

  MUFG stands out as one of the world’s leading financial
  institutions renowned for its commitment to integrity,
  dependability and inclusive growth leadership. The
  organisation fosters a supportive environment where
  employees are encouraged to collaborate openly, sharing
  knowledge across teams while benefiting from flexible
  working opportunities tailored around individual needs. MUFG
  invests heavily in professional development through ongoing
  training programmes designed to nurture talent at every
  stage of your career journey. Generous pension contributions
  reflect their dedication not only towards employee wellbeing
  but also long-term financial security. The company’s values-
  led culture places emphasis on diversity, ensuring everyone
  feels welcome regardless of background and promotes communal
  achievement through shared goals rather than individual
  competition. Supportive leadership is embedded throughout
  the hierarchy; managers actively encourage personal growth
  while providing guidance during challenging projects. At
  MUFG you’ll find yourself surrounded by knowledgeable
  colleagues who value teamwork above all else, making it an
  ideal place for those seeking both professional advancement
  and genuine kinship within their workplace.



  What's next:

  If you are ready to take your career forward by joining a
  collaborative team at MUFG where your expertise will help
  shape the future of artificial intelligence in financial
  services—apply now!

  Apply today by clicking on the link provided.

  We are open to considering flexible working requests in line
  with organisational requirements.

  MUFG is committed to embracing diversity and building an
  inclusive culture where all employees are valued, respected
  and their opinions count. We support the principles of
  equality, diversity and inclusion in recruitment and
  employment, and oppose all forms of discrimination on the
  grounds of age, sex, gender, sexual orientation, disability,
  pregnancy and maternity, race, gender reassignment, religion
  or belief and marriage or civil partnership.

  We make our recruitment decisions in a non-discriminatory
  manner in accordance with our commitment to identifying the
  right skills for the right role and our obligations under
  the law.
