  Resilinc is hiring a Senior Digital Learning & AI Content
  Developer to build and scale a modern, AI-forward Academy
  experience for customers, partners, and internal teams.

  This is a hands-on individual-contributor role for someone
  who can take complex product and domain knowledge and
  quickly turn it into clear, engaging, high-quality digital
  learning content.

  The ideal candidate is a strong content creator, video
  producer, learning technologist, and AI-enabled builder.
  They should be comfortable researching, scripting,
  producing, editing, publishing, and improving digital
  learning assets using modern AI and multimedia tools.

  Because this is expected to be a lean or solo function
  initially, the successful candidate must be highly self-
  directed and capable of owning the full content lifecycle
  from idea to published experience.

