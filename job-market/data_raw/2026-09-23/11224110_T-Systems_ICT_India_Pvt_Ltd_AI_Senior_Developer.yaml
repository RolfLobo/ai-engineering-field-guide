  Job Description

  Job Description - AI Senior Developer (GenAI & Agentic AI)

  Experience: 4+ Years Location: Hyderabad

  Role Overview

  We are seeking an experienced AI Senior Developer with
  expertise in Generative AI, LLMs, RAG, and AI Agent
  development. The ideal candidate will be responsible for
  building, integrating, and deploying enterprise-grade AI
  applications while working closely with solution architects
  and business teams.

  Key Responsibilities

  - Develop and deploy LLM-based applications and GenAI
    solutions.
  - Build scalable RAG pipelines and AI-powered knowledge
    systems.
  - Develop AI Agents and Agentic workflows for automation and
    business processes.
  - Integrate AI services with enterprise applications through
    APIs and microservices.
  - Optimize prompts, embeddings, and model performance.
  - Collaborate with architects and cross-functional teams to
    deliver production-ready AI solutions.
  - Stay updated with the latest advancements in AI, GenAI, and
    Agentic AI technologies.

  Technical Skills

  - Strong programming skills in Python.
  - Experience with TensorFlow, PyTorch, Scikit-learn
    (preferred).
  - Expertise in Generative AI, LLMs, RAG, Vector Databases, AI
    Agents, and Agentic AI Solutions.
  - Hands-on experience with LangChain, LlamaIndex, Semantic
    Kernel, LangGraph, CrewAI, AutoGen, or similar frameworks.
  - Experience building LLM-powered applications, RAG systems,
    AI Agents, and workflow automation solutions.
  - Knowledge of Prompt Engineering, Embedding Models, Tool
    Calling, and Function Calling.
  - Familiarity with Model Context Protocol (MCP) and agent
    integration concepts.
  - Experience with Azure OpenAI, OpenAI GPT Models, Claude,
    Gemini, Llama, Mistral, or similar foundation models.
  - Experience with Vector Databases such as Pinecone, ChromaDB,
    Weaviate, Qdrant, FAISS, or Azure AI Search.
  - Experience with APIs, microservices, Docker, Kubernetes, and
    cloud-native architectures.
  - Understanding of LLMOps, AI monitoring, evaluation, and
    production deployment.
  - Knowledge of SQL, NoSQL databases, and data engineering
    concepts.

  Preferred Qualifications

  - Experience with Azure, AWS, or GCP AI services.
  - Familiarity with GraphRAG, Knowledge Graphs, and Search
    Systems.
  - Exposure to AI governance and Responsible AI practices.
  - Experience working in Agile teams and enterprise-scale AI
    implementations.

  What We Offer

  - Opportunity to work on cutting-edge AI technologies.
  - Collaborative and innovative work environment.
  - Competitive compensation and benefits.

