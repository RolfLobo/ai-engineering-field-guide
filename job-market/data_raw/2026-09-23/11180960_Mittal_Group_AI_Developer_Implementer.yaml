description: |
  Job Description – AI Developer & Implementer

  Designation: AI Developer & Implementer

  Department: IT / AI & Technology

  Location: Head Office, Pune

  Experience: 2–3 Years

  Employment Type: Full-Time

  Job Summary

  We are looking for a hands-on AI Developer & Implementer who
  can develop AI-powered solutions, automate business
  processes, integrate APIs, and build practical software
  applications.

  Key Responsibilities

  • Develop and implement AI-based applications and business
  solutions.

  • Build web applications using JavaScript/TypeScript and
  React.js.

  • Develop and integrate REST APIs, webhooks, and third-party
  services.

  • Create business automations using n8n or similar tools.

  • Integrate AI solutions with CRM, ERP, and other business
  systems.

  • Work with databases, cloud platforms, Git/GitHub, and
  CI/CD.

  • Test, debug, deploy, and maintain applications.

  • Understand business requirements and independently
  implement suitable technology solutions.

  Must-Have Skills

  1.Programming & Development

  • JavaScript & TypeScript

  • React.js

  • Python

  • REST APIs & Webhooks

  2.AI & Automation

  • Hands-on experience with AI tools / AI application
  development

  • ChatGPT/Codex, Claude/Claude Code, GitHub Copilot or
  similar AI coding tools

  • AI-assisted coding, debugging, testing & code review

  • n8n or similar automation tools

  3.Database & Development Tools

  • SQL with PostgreSQL / MySQL

  • Git & GitHub – branches, pull requests, merge & conflict
  resolution

  • Basic understanding of CI/CD and GitHub Actions

  Qualifications & Experience

  • BCA / BCS / BE / B.Tech in Computer Science, IT, AI/ML or
  related field.

  • 2–3 years of relevant hands-on experience.

  • Must have at least one practical AI/software project.

  • Strong problem-solving and debugging skills.

  • Good communication and ability to work independently.

  Good to Have

  • Next.js / Node.js

  • Django

  • Docker

  • AWS / GCP

  • CRM/ERP integration experience

  • AI Agents / RAG / LLM application development
