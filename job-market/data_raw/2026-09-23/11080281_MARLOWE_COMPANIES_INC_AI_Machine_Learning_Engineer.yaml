description: |
  POSITION OVERVIEW

  MCI is one of the fastest-growing tech-enabled business
  services companies in the USA, with a strong call center
  footprint and operations that extend across multiple
  countries. We deliver Customer Experience (CX), Business
  Process Outsourcing (BPO), and Anything-as-a-Service (XaaS)
  cloud technology solutions across a wide range of
  industries, including healthcare, retail, government,
  education, telecom, technology e-commerce, and financial
  services. Our contact centers are powered by both on-site
  and remote agents, leveraging advanced technologies to
  enhance customer journeys, drive scalability and reduce
  costs.

  At MCI we are committed to fostering an environment where
  professionals can build meaningful careers, access
  continuous learning and development opportunities and
  contribute to the success of a globally expanding, industry-
  leading organization.

  We are seeking a highly analytical and technically skilled
  AI / Machine Learning Engineer to develop, deploy, and
  optimize machine learning solutions that drive business
  innovation and operational efficiency. This role is
  responsible for building scalable AI systems, developing
  predictive models, and transforming complex datasets into
  actionable insights that support strategic decision-
  making.You will collaborate with data scientists, software
  engineers, product teams, and business stakeholders to
  deliver robust AI solutions that solve real-world challenges
  and create measurable business value.

  To be considered for this role, you must complete a full
  application on our company careers page, including all
  screening questions and a brief pre-employment test.

  POSITION RESPONSIBILITIES

  Key Responsibilities:

  Machine Learning Development

  - Design, develop, and deploy machine learning models that
    support business objectives and enhance operational
    performance.
  - Build and train supervised, unsupervised, and deep learning
    models.
  - Develop predictive analytics and intelligent automation
    solutions.
  - Perform feature engineering and data preparation activities.
  - Evaluate model performance and implement continuous
    improvements.

  Model Deployment & Production Support

  - Ensure machine learning solutions are scalable, reliable,
    and production-ready.
  - Deploy models into production environments.
  - Develop and maintain model serving infrastructure.
  - Monitor model performance and address drift or degradation.
  - Support model retraining and lifecycle management processes.

  Data Engineering & Optimization

  - Develop efficient data pipelines and workflows that support
    AI initiatives.
  - Collaborate with data teams to prepare and process large
    datasets.
  - Optimize data collection, transformation, and storage
    processes.
  - Ensure data quality and integrity across machine learning
    workflows.
  - Support integration with enterprise systems and platforms.

  Governance, Quality & Compliance

  - Maintain high standards of quality, security, and compliance
    across AI solutions.
  - Implement testing and validation procedures.
  - Ensure models align with governance and regulatory
    requirements.
  - Document methodologies, processes, and technical solutions.
  - Support responsible AI and ethical AI practices.

  Research & Innovation

  - Stay current with advancements in AI and machine learning
    technologies.
  - Evaluate emerging machine learning frameworks and tools.
  - Research innovative approaches to solving business
    challenges.
  - Recommend enhancements to AI architectures and development
    practices.
  - Contribute to continuous improvement initiatives across the
    AI function.

  CANDIDATE QUALIFICATIONS

  WONDER IF YOU ARE A GOOD FIT FOR THIS POSITION?

  All positive, and driven applicants are encouraged to apply.
  The Ideal candidates for this position are highly motivated
  and dedicated and should possess the below qualities:

  - Bachelor's Degree in Computer Science, Data Science,
    Mathematics, Statistics, Engineering, Artificial
    Intelligence, or a related field.
  - Minimum 3 years of experience developing machine learning or
    AI solutions.
  - Strong proficiency in Python and machine learning
    development practices.
  - Experience building, training, evaluating, and deploying
    machine learning models.
  - Knowledge of supervised, unsupervised, and deep learning
    methodologies.
  - Experience working with large datasets and data
    preprocessing techniques.
  - Understanding of statistical modeling, predictive analytics,
    and model optimization.
  - Experience integrating machine learning solutions into
    production environments.
  - Familiarity with software engineering principles and version
    control systems.
  - Knowledge of cloud computing platforms and distributed
    computing environments.
  - Strong analytical thinking and problem-solving capabilities.
  - Ability to communicate complex technical concepts to
    technical and non-technical stakeholders.

  Nice to Have

  - Experience with TensorFlow, PyTorch, Scikit-learn, XGBoost,
    or similar frameworks.
  - Experience with MLOps, CI/CD pipelines, and model lifecycle
    management.
  - Exposure to Generative AI and Large Language Models.
  - Experience with data engineering or ETL pipelines.
  - Knowledge of containerization technologies such as Docker
    and Kubernetes.
  - Familiarity with data visualization and reporting tools.
  - Experience in NLP, computer vision, or recommendation
    systems.
  - Industry certifications related to AI, machine learning, or
    cloud technologies.

  PHYSICAL REQUIREMENTS

  This job operates in a professional office environment.
  While performing the duties of this job, the employee will
  be largely sedentary and will be required to sit/stand for
  long periods while using a computer and telephone headset.
  The employee will be regularly required to operate a
  computer and other office equipment, including a phone,
  copier, and printer. The employee may occasionally be
  required to move about the office to accomplish tasks; reach
  in any direction; raise or lower objects, move objects from
  place to place, hold onto objects, and move or exert force
  up to forty (40) pounds.

  CONDITIONS OF EMPLOYMENT

  All MCI Locations

  - Must be authorized to work in the country where the job is
    based.

  Subject to the program and location of the position

  - Must be willing to submit up to a LEVEL II background and/or
    security investigation with a fingerprint.  Job offers are
    contingent on background/security investigation results.
  - Must be willing to submit to drug screening.  Job offers are
    contingent on drug screening results. (Does not apply in
    Canada)

