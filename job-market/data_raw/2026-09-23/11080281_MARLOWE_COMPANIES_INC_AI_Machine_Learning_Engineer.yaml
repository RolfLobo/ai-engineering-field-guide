  ABOUT MCI (PARENT COMPANY)

  MCI helps customers take on their CX and DX challenges
  differently, creating industry-leading solutions that
  deliver exceptional experiences and drive optimal
  performance. MCI assists companies with business process
  outsourcing, staff augmentation, contact center customer
  services, and IT Services needs by providing general and
  specialized hosting, software, staff, and services.

  In 2019, Marlowe Companies Inc. (MCI) was named by Inc.
  Magazine as Iowa’s Fastest Growing Company in the State of
  Iowa and was named the 452nd Fastest Growing Privately
  Company in the USA, making the coveted top 500 for the first
  time. MCI’s subsidiaries had previously made Inc. Magazine's
  List of Fastest-Growing Companies 15 times, respectively.
  MCI has ten business process outsourcing service delivery
  facilities in Georgia, Florida, Texas, New Mexico,
  California, Kansas, Nova Scotia, South Africa, and the
  Philippines.

  Driving modernization through digitalization, MCI ensures
  clients do more for less. MCI is the holding company for a
  diverse lineup of tech-enabled business services operating
  companies. MCI organically grows, acquires, and operates
  companies that have synergistic products and services
  portfolios, including but not limited to Automated Contact
  Center Solutions (ACCS), customer contact management, IT
  Services (IT Schedule 70), and Temporary and Administrative
  Professional Staffing (TAPS Schedule 736), Business Process
  Management (BPM), Business Process Outsourcing (BPO), Claims
  Processing, Collections, Customer Experience Provider (CXP),
  Customer Service, Digital Experience Provider (DXP), Account
  Receivables Management (ARM), Application Software
  Development, Managed Services, and Technology Services, to
  mid-market, Federal & enterprise partners. MCI now employs
  10,000+ talented individuals with 150+ diverse North
  American client partners across the following MCI brands:
  MCI BPO, MCI BPOaaS, MarketForce,  GravisApps, Gravis
  Marketing, MarchEast, Mass Markets, MCI Federal Services
  (MFS), OnBrand24, The Sydney Call Center, Valor Intelligent
  Processing (VIP), BYC Aqua, EastWest BPO, TeleTechnology,
  and Vinculum.

