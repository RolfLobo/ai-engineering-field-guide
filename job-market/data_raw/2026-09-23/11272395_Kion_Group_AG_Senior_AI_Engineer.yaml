description: |
  Accountabilities Design, develop and operate in-house GenAI
  applications aligned with KION’s AI Strategy and AI
  Governance Engineer advanced LLM-powered solutions using
  techniques such as Prompt Engineering, Context Architecture,
  and Retrieval-Augmented Generation (RAG) Implement build-
  test-deploy pipelines for AI and agent solutions, ensuring
