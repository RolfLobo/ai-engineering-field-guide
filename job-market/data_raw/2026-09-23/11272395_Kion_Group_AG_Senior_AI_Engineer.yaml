  offer:

  Experience

  - At least 4-5 years of professional experience as an
    application developer, ideally in AI/ML or backend service
    development
  - Strong hands-on experience with LLMs (Azure OpenAI,
    Anthropic, Gemini) and modern AI-assisted development
    workflows
  - Expertise in AI application development (e.g., Prompt
    Engineering, Context Management, and AI search/RAG
    pipeline design) for enterprise applications
  - Proficient in Python, SQL, and JavaScript/TypeScript; strong
    experience in client-server communication development (API
    and MCP)
  - Working knowledge of Infrastructure as Code (Terraform) for
    managing cloud resources (GCP/Azure)
  - Familiarity with LLMOps/AgentOps tooling, orchestration
    engines (LangChain/LangGraph, ADK), and vector databases
    (pgvector)
  - Experience building trustworthy AI systems by implementing
    evaluation frameworks, hallucination mitigation,
    explainability (traceability, source attribution,
    reasoning transparency), and AI guardrails
  - Experience deploying reliable and scalable AI applications
    to production environments
  - Experience translating business requirements into technical
    solutions, working closely with stakeholders and cross-
    functional teams, with a strong usability and user-
    friendly mindset
  - Experience monitoring, troubleshooting and continuously
    improving production AI services
  - Strong problem-solving skills and the ability to
    troubleshoot complex data issues
  - Creative, hands-on mindset with willingness to experiment
    and innovate
  - Excellent communication skills, experience in an enterprise
    context is a plus

  Tasks and Qualifications:

  Main purpose of the position

  - The Senior AI Engineer is part of KION’s central Big Data &
    AI team within IT. The position is responsible for
    designing, developing, and operating secure, scalable, and
    trustworthy Generative AI applications and reusable
    platform components in alignment with KION’s AI Strategy
    and AI Governance
  - The role supports the adoption of AI across KION by
    translating business requirements into production-ready AI
    solutions, including LLM-powered applications, Retrieval-
    Augmented Generation solutions, AI agents and related APIs
    and platform services
  - The Senior AI Engineer contributes to safe, transparent, and
    business-value-driven implementation of GenAI use cases
    across KION

  Qualifications/Specialization

  - Bachelor’s degree in computer science, engineering, or a
    related field
  - Specialisation or demonstrable expertise in AI/ML,
    Generative AI, software engineering, data engineering, and
    development
  - Certification such as GitHub Certified: Agentic AI Developer
    or Claude Certified Architect - Foundations (CCA-F) is an
    advantage
  - Very good knowledge of English
