description: |
  Position: Lead AI Engineer

  Experience Required: 5 + Years

  Company: Academian (EdTech Domain)

  Work Location: Pune

  Role Overview

  We are seeking an experienced Lead AI Engineer to spearhead
  the development and deployment of cutting-edge AI solutions.
  The ideal candidate will have strong foundations in AI
  algorithms, hands-on expertise with machine learning and
  deep learning frameworks, and a forward-thinking approach to
  leveraging emerging AI technologies like Agentic AI, RAG,
  LangGraph, LangChain, Graph Databases, and open-source LLMs.

  This role involves designingand implementing advanced AI
  capabilities, building real-time data pipelines, integrating
  with modern cloud AI platforms, and mentoring junior
  engineers to deliver scalable, efficient, and impactful AI
  products aligned with the EdTech domain.

  Key Responsibilities:

  - Design, develop, test, and deploy AI-powered applications,
    workflows, and agents.
  - Build solutions using large language models, retrieval-
    augmented generation, APIs, vector databases, and
    structured data.
  - Translate business requirements into technical designs,
    implementation plans, and production-ready solutions.
  - Use AI coding agents effectively to accelerate development,
    testing, documentation, and code modernization.
  - Direct coding-agent workflows by providing clear
    specifications, context, constraints, and acceptance
    criteria.
  - Determine the appropriate level of agent autonomy and
    establish checkpoints for human review.
  - Review, validate, and improve AI-generated code for
    correctness, security, scalability, and maintainability.
  - Customize coding-agent environments with project standards,
    tools, reusable instructions, and development workflows.
  - Integrate AI solutions with enterprise platforms, content
    repositories, data sources, and third-party systems.
  - Implement evaluation, monitoring, guardrails, and human-in-
    the-loop processes for AI applications.
  - Collaborate with architects, product managers, domain
    experts, QA, DevOps, and client teams.
  - Maintain technical documentation and contribute reusable
    components, patterns, and engineering standards.

  High-Level Skills Required:

  - Strong software-engineering fundamentals, including
    application architecture, APIs, databases, testing,
    debugging, and version control.
  - Proficiency in Python and/or modern application-development
    languages and frameworks.
  - Experience building and deploying applications using large
    language models and generative AI.
  - Understanding of prompting, context management, structured
    outputs, tool calling, RAG, embeddings, and vector
    databases.
  - Hands-on experience with AI coding agents such as Codex,
    Claude Code, GitHub Copilot, or similar tools.
  - Ability to plan and direct agent workflows, manage autonomy,
    and review agent-generated work.
  - Experience integrating AI capabilities into cloud-based and
    enterprise applications.
  - Familiarity with cloud platforms, containers, CI/CD
    pipelines, observability, and secure development
    practices.
  - Understanding of AI evaluation, hallucination management,
    responsible AI, data privacy, and security controls.
  - Ability to convert ambiguous business needs into clear
    technical requirements and working solutions.
  - Strong analytical, problem-solving, communication, and
    cross-functional collaboration skills.

  Why Join Us

  - Opportunity to lead AI initiatives that shape the future of
    education technology.
  - Work in a collaborative, mission-driven environment with a
    focus on innovation.
  - Engage with impactful projectsand cutting-edge AI
    technologies.
  - Competitive salary,benefits, and opportunities for
    professional growth.

  Employee Benefits

  - Health Insurance: Employee + Spouse + Two Children+ Parents
  - GPA Coverage for Employee
  - Hybrid Work Model
  - Compliance: PF and Gratuity

