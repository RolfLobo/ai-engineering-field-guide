description: |
  We are seeking a highly technical and strategic Senior
  Developer Relations Manager - EMEA AI Natives to join our
  team, with a focus on engaging developer ecosystems across
  emerging technology domains. In this pivotal role, you will
  work directly with software solution providers, developers,
  and industry professionals to foster the adoption of
  NVIDIA’s advanced AI and computing platforms.

  The ideal candidate brings a blend of deep technical
  expertise and commercial go-to-market experience, combined
  with a passion for developer advocacy and a talent for
  communicating how NVIDIA technology can solve complex, real-
  world challenges.

  What You'll Be Doing:

  - Serve as the trusted technical advisor, problem solver, and
    champion for the developer ecosystem in EMEA AI Natives
    with multi-functional partners to drive adoption of NVIDIA
    technologies.
  - Accelerate critical workloads by demonstrating ground
    breaking solutions that integrate the core NVIDIA stack
    into developer products, platforms, and pipelines.
  - Advise on the technical enablement resources—such as sample
    code, guides, demonstration pipelines, and tools to
    highlight the application of technologies in solving real-
    world problems for EMEA AI Natives
  - Guide partners and startups through onboarding and
    integration with NVIDIA’s programs, fostering co-
    innovation and the development of next-generation
    solutions.
  - Map, track, and monitor the developer ecosystem to identify
    growth opportunities, inform technology roadmaps, and
    shape adoption strategies.
  - Collaborate multi-functionally with solution architects,
    engineering, product management, and marketing to drive
    developer engagement and optimize partner adoption
    strategies.
  - Engage with partner engineering teams, technical leaders,
    and decision-makers to identify goals, solve technical
    challenges, and promote best practices for successful
    integrations.
  - Represent and advocate for the partner technical needs and
    feedback to NVIDIA’s internal product and engineering
    teams, supplying actionable insights from field
    deployments to influence product roadmaps.

  What We Need to See:

  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field (or equivalent practical
    experience).
  - A minimum of 8+ years of overall professional experience in
    the technology industry in software engineering, developer
    relations, technical partnerships, including 5+ years of
    direct hands-on experience in your designated ecosystem
    (e.g., Telco, MarTech, etc.).
  - Proven experience leading, partnering, and scaling developer
    programs at major technology companies, EMEA AI Natives,
    ISVs, or within relevant verticals.
  - Significant technical proficiency guiding EMEA AI Natives in
    high-performance computing, cloud, AI/ML, and/or vertical-
    specific frameworks and libraries.
  - Excellent interpersonal skills with the ability to distill
    complex technical concepts for diverse technical and non-
    technical audiences from engineers to executives.
  - Experience leading technical collaborations with engineering
    and product teams - including architectural design, code
    reviews, technical mentorship, and delivery of technical
    talks or workshops
  - Proven ability to structure and implement complex technical
    engagements, negotiate requirements, prioritize issues,
    and collaborate with internal or external stakeholders
    (across sales, legal, product or marketing teams as
    needed).

  Ways to Stand Out from the Crowd:

  - Hands-on experience building or optimizing vertical-specific
    solutions for Generative & Agentic AI
  - Familiarity with advanced computing, AI, and/or GPU
    acceleration platforms
  - Track record in crafting and implementing systems for real-
    time processing and low-latency decision-making.
  - Successful history of building and scaling developer
    communities and delivering impactful technical enablement
    programs.

  With competitive salaries and a generous benefits package,
  we are widely considered to be one of the world’s most
  desirable employers! We have some of the most forward-
  thinking and hardworking people in the world working for us
  and, due to outstanding growth, our best-in-class
  engineering teams are rapidly growing. If you're a creative
  and autonomous person with a real passion for technology, we
  want to hear from you.
