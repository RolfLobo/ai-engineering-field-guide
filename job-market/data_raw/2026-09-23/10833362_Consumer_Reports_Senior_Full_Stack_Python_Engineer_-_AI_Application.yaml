description: |
  WHO WE ARE

  Consumer Reports is an independent, nonprofit organization
  dedicated to a fair and just marketplace for all. CR is
  known for our rigorous testing and trusted ratings on
  thousands of products and services.  We report extensively
  on consumer trends and challenges, and survey millions of
  people in the U.S. each year. We leverage our evidence-based
  approach to advocate for consumer rights, working with
  policymakers and companies to find solutions for safer
  products and fair practices.

  Our mission starts with you. We offer medical benefits that
  start on your first day as a CR employee that include
  behavioral health coverage, family planning and a generous
  401K match. Learn more about how CR advocates on behalf of
  our employees.

  OVERVIEW

  We’re hiring a Senior Full-Stack Engineer to turn our AI and
  machine learning capabilities into real products used by
  millions of consumers and internal teams.

  This is a product engineering role,not model training.
  You’ll focus on delivering AI through scalable, intuitive
  applications.

  You’ll report to the Associate Director, AI/ML & Data
  Science and work closely with AI/ML engineers and data
  scientists to bring models, APIs, and data pipelines into
  production-ready experiences.

  You’ll own the full stack, from frontend to backend to
  cloud—ensuring performance, reliability, and usability at
  every layer. You’ll also partner with product and design to
  create AI experiences that are clear, trustworthy, and
  impactful.

  If you enjoy turning complex technology into products people
  actually use, this is your role.

  This is a hybrid position with some onsite expectation; it
  is not eligible for sponsorship or relocation assistance.

  How You'll Make An Impact

  You’ll help power a multi-year AI strategy focused on
  consumer value, employee tools, and responsible AI.

  In this role, you will:

  - Build full-stack applications, data APIs, and AI-powered
    dashboards
  - Develop backend services (Python: FastAPI/Django, Node.js)
  - Integrate with Databricks and AWS SageMaker
  - Create responsive frontends (React, Next.js, TailwindCSS)
  - Deploy cloud-native apps (AWS, GCP, or Azure)
  - Connect RAG pipelines, vector databases, and model endpoints
  - Implement authentication, data access, and API management
  - Build CI/CD pipelines, testing, and performance optimization
  - Collaborate with product and design on AI-driven experiences

  ABOUT YOU

  You’ll Be Highly Rated If:

  - You have the experience. 5+ years building production full-
    stack applications with Python, JavaScript, and SQL/NoSQL
    systems.
  - You've earned the degree. Bachelor's in Computer Science,
    Engineering, or a related field.
  - You've integrated software with AI/ML services, data APIs,
    or model endpoints — as a consumer of those services.
  - You've deployed on AWS, GCP, or Azure, ideally with
    Databricks or SageMaker.

  You'll Be One of Our Top Picks If:

  - You love turning complex AI models into products people
    actually use.
  - You move fluently across frontend, backend, and cloud.
  - You're as comfortable debating UX as you are optimizing a
    data pipeline.

  FAIR PAY AND A JUST WORKPLACE

  At Consumer Reports, we are committed to fair, transparent
  pay and we strive to provide competitive, market-informed
  compensation.  The salary range for this position is based
  on the candidate’s work location. It is anticipated that
  most qualified candidates will fall near the middle of the
  applicable range.  Compensation for the successful candidate
  will be informed by their particular combination of
  knowledge, skills, competencies, and experience.

  Consumer Reports has three locations: Yonkers, NY,
  Washington, DC and Colchester, CT. We are registered to do
  business in and can only hire from the following states and
  federal district: Arizona, California, Connecticut,
  Illinois, Maryland, Massachusetts, Michigan, New Hampshire,
  New Jersey, New York, Texas, Vermont, Virginia and
  Washington, DC.

  Salary ranges

  - New York Metropolitan Area, California,  Chicago, Boston,
    and Washington, DC $140K-$160K annually*
  - Colchester, CT and additional approved CR locations:
    $133K-$152K

  *The higher geographic range also applies to employees who
  commute to Consumer Reports’ Yonkers, NY facility. For
  designated metropolitan areas, eligibility is based on
  residing within 60 miles of the applicable metropolitan
  area.

  Consumer Reports is an equal opportunity employer and does
  not discriminate in employment on the basis of actual or
  perceived race, color, creed, religion, age, national
  origin, ancestry, citizenship status, sex or gender
  (including pregnancy, childbirth, related medical conditions
  or lactation), gender identity and expression (including
  transgender status), sexual orientation, marital status,
  military service or veteran status, protected medical
  condition as defined by applicable state or local law,
  disability, genetic information, or any other basis
  protected by applicable federal, state or local laws.
  Consumer Reports will provide you with any reasonable
  assistance or accommodation for any part of the application
  and hiring process.
