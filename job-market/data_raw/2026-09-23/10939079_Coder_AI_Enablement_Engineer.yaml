title: AI Enablement Engineer
company: Coder
location: USA
remote: true
work_type: FULL_TIME
description: |
  Coder is looking for an AI Enablement Engineer to help
  execute our Smart AI roadmap and make AI and vibe coding
  easier across the company. You’ll work directly with
  employees to understand what they’re trying to build, answer
  questions about Smart AI best practices, and remove the
  technical or process barriers getting in their way.

  You’ll also turn those needs into shipped improvements. That
  means building and refining Smart AI journeys, reusable
  skills, paved paths, and infrastructure enhancements, while
  partnering closely with the Smart AI Program lead on roadmap
  execution. You’ll also teach through office hours and
  sessions, but most of your time will be spent listening,
  building, troubleshooting, and improving the system around
  our internal AI community.

  What you’ll do here

  - Act as a hands-on technical partner for Coder employees
    using Smart AI, helping them understand best practices,
    choose the right approach, and work through blockers.
  - Meet with employees across the company to understand their
    needs, requirements, workflows, and impediments as they
    build with AI.
  - Answer questions in Slack, meetings, and working sessions
    about Smart AI tools, models, prompts, harnesses,
    development environments, and recommended patterns.
  - Identify recurring needs across our internal AI community
    and translate them into clear requirements for the Smart
    AI roadmap.
  - Execute against the existing Smart AI roadmap by building
    and improving reusable journeys, skills, templates, system
    instructions, and other paved paths.
  - Contribute directly to infrastructure enhancements that make
    internal AI development easier, more reliable, and more
    consistent.
  - Build alongside users when useful, using tools like Claude
    Code and other AI-assisted development workflows to
    prototype solutions and validate new approaches.
  - Help improve the dedicated development environment employees
    use for vibe coding, including integrations, connectors,
    APIs, model access, and supporting infrastructure.
  - Turn one-off questions into reusable solutions when a
    pattern emerges, so the next employee can start from a
    better place.
  - Partner closely with the Smart AI Program lead to connect
    day-to-day employee feedback with roadmap priorities and
    execution.
  - Host office hours, workshops, lunch and learns, and other
    enablement sessions that help employees build confidence
    and develop stronger AI working habits.
  - Create clear guidance, examples, and documentation for Smart
    AI capabilities as new journeys, skills, tools, and best
    practices are introduced.

  What we’re looking for

  - 3+ years of experience working in technology, preferably in
    a startup environment.
  - An engineering background or meaningful hands-on experience
    building with tools like Claude Code. You understand how
    software is built, orchestrated, and deployed.
  - The ability to learn new tools and technologies quickly
    through independent study and experimentation.
  - A high degree of empathy for users, especially those working
    with cutting-edge technology for the first time.
  - A proven ability to identify user roadblocks and create
    practical solutions that remove them.
  - A tinkering mindset. You look for ways to improve, automate,
    and simplify, then act on them.
  - PM-like pattern recognition. You can spot recurring signals
    in user feedback and requests, then turn them into clear,
    repeatable golden paths.
  - Strong communication skills across technical ability levels.
    You can explain how something works, help someone debug
    it, and adjust your approach based on the person in front
    of you.
  - Comfort moving between requirement gathering and
    implementation. You can understand the problem, define
    what good looks like, then help build the solution.
  - The judgment to distinguish a one-off user issue from a
    systems problem worth solving for everyone.

  Bonus tacos if you have

  - An entrepreneurial mindset and a habit of finding useful
    things to create, test, and build.
  - Familiarity with Coder or other remote development
    environment tools, including Gitpod, DevPod, or GitHub
    Codespaces.
  - Experience in business analysis, learning and development,
    or developer relations.
  - Experience supporting an internal developer platform, AI
    enablement program, developer community, or technical
    center of excellence.
  - Familiarity with Model Context Protocol (MCP), API
    integrations, or connecting AI tools to systems like
    Slack, GitHub, Salesforce, or internal databases.
  - Experience creating technical workshops, documentation,
    examples, or enablement programs for users with different
    levels of technical experience.

  About Coder

  Coder is the leading platform for AI development
  Infrastructure, enabling enterprises to securely run human
  and AI-driven development workflows in consistent, governed
  environments. Coder provides self-hosted, agent-ready
  workspaces that unify developer productivity and platform
  governance. With Coder, enterprises can confidently evolve
  from human-only development to AI-assisted and autonomous
  workflows, without sacrificing security, compliance, or
  performance. Learn more at coder.com.

  Interview process

  We believe that the interview process should be transparent,
  consistent, and enjoyable. We value your time and hope to
  complete the interview process in two to four weeks, if
  schedules allow. Through your interviews, you will meet a
  mix of individual contributors, managers, and senior
  leaders.

  AI use during the interview process

  As an AI company, Coder embraces the use of AI tools, and we
  want to be transparent about our expectations as you
  navigate our interview process.

  Not permitted: Using AI assistance during conversational
  interviews.

  Permitted: Using AI tooling for take-home assessments.
  Please flag where and to what extent it was used in your
  take-home. Your submission will not be penalized for using
  AI as long as it is done honestly.

  Our use of AI in hiring

  We use AI tools to help manage our recruitment process
  efficiently and fairly. Specifically:

  - Ashby helps us review inbound applications by surfacing
    candidates who best match the role requirements we've
    defined. This tool does not make hiring decisions; it
    helps our team prioritize which applications to review
    first.
  - Granola takes notes during our interview calls so our team
    can focus on the conversation with you.

  All hiring decisions are made by humans. Our team reviews
  applications, conducts interviews, and makes final
  selections. AI tools assist us but never replace human
  judgment, and these practices are conducted in compliance
  with applicable data protection, AI governance, and labor
  laws. Your data is not used to train AI models.

  In accordance with New York City Local Law 144, an
  independent bias audit has been conducted on "Automated
  Employment Decision Tools"; results are available for Ashby.

  If you're applying for a role at Coder and have questions
  about how we use AI in our process, or if you'd like to
  request information about the data we collect, please
  contact careers@coder.com.



