description: |
  At Broadridge, we've built a culture where the highest goal
  is to empower others to accomplish more. If you’re
  passionate about developing your career, while helping
  others along the way, come join the Broadridge team.

  Broadridge is Growing! We are seeking an AI Prompt Engineer
  to join a stellar team on contract basis. The AI Prompt
  Engineer will design, develop, test, and optimize prompts,
  workflows, and AI-assisted solutions for enterprise
  applications and internal business use cases. This role will
  work closely with software engineers, product owners,
  business stakeholders, quality assurance teams, and data/AI
  teams to build reliable, secure, and scalable AI-enabled
  capabilities.

  Work Mode: We are made up of high performing teams that meet
  in person to learn and collaborate as needed.  This role is
  considered hybrid, which means you’ll be coming into the
  office 2 days a week and given the flexibility to work
  remotely the rest of the time.

  Responsibilities:

  - Design, develop, test, debug, and implement prompts, prompt
    templates, AI workflows, and automation patterns for
    existing and new applications or systems.
  - Analyze project requirements and translate business needs
    into effective AI interaction patterns, prompt strategies,
    and technical specifications.
  - Develop and maintain reusable prompt libraries, evaluation
    criteria, and documentation for AI-assisted solutions.
  - Perform prompt testing, regression testing, and quality
    evaluation to ensure AI outputs are accurate, consistent,
    safe, and aligned with business requirements.
  - Work with users, software engineers, QA, and product teams
    to validate AI-generated outputs and resolve reported
    defects, inaccuracies, or usability issues.
  - Partner with application development teams to integrate
    prompts and AI capabilities into enterprise systems, APIs,
    workflows, and user experiences.
  - Evaluate AI model behavior across different use cases,
    including summarization, classification, content
    generation, code assistance, data extraction, workflow
    automation, and knowledge retrieval.
  - Apply prompt engineering techniques such as role prompting,
    structured output design, few-shot examples, chain-of-
    thought alternatives, tool-use prompting, retrieval-
    augmented generation patterns, and guardrail design.
  - Support the development of AI governance practices,
    including responsible AI usage, data privacy
    considerations, prompt safety, output validation, and
    compliance with enterprise policies.
  - Create system documentation, user guidance, prompt usage
    instructions, and training materials for business and
    technical users.
  - Assist with defining project requirements, acceptance
    criteria, success metrics, and evaluation benchmarks for
    AI-enabled features.
  - Monitor prompt and workflow performance in production and
    recommend improvements based on user feedback, quality
    metrics, and model behavior.
  - Collaborate with engineering teams on version control,
    release management, testing automation, and continuous
    improvement of AI solutions.
  - Mentor junior team members and help establish best practices
    for prompt design, AI solution testing, and responsible AI
    adoption.
  - Lead small project teams or workstreams focused on AI
    solution design, prompt optimization, or AI-assisted
    application features.

  Qualifications:

  - Bachelor of Science in Computer Science, Data Science,
    Information Systems, Engineering, or equivalent education
    and experience.
  - 6+ years of experience in software development, application
    systems, data solutions, AI implementation, automation, or
    related technical environments.
  - Hands-on experience designing, testing, and improving
    prompts for large language models or generative AI tools.
  - Experience with Java, SQL, Python, JavaScript/TypeScript, or
    similar programming and scripting languages.
  - Experience working with APIs, JSON, structured outputs,
    application integrations, and enterprise software
    development practices.
  - Familiarity with AI concepts such as large language models,
    embeddings, retrieval-augmented generation, vector search,
    model evaluation, grounding, hallucination reduction, and
    prompt safety.
  - Experience with databases and data platforms such as Oracle,
    PostgreSQL, Snowflake, or similar technologies.
  - Experience with development tools and environments such as
    GitLab, Jenkins, Windows, Linux, application servers, and
    CI/CD pipelines.
  - Experience in SDLC development methodologies, including
    Agile.
  - Strong analytical, troubleshooting, and problem-solving
    skills with the ability to evaluate AI output quality and
    identify root causes of poor results.
  - Strong written communication skills with the ability to
    create clear prompts, documentation, requirements, and
    user-facing instructions.
  - Experience collaborating with cross-functional teams,
    including business users, QA, developers, architects,
    product owners, and security or compliance partners.
  - Experience mentoring members of development or technical
    teams.

  Preferred Skills

  - Experience with enterprise AI platforms, model providers, or
    internal AI tooling.
  - Experience with prompt evaluation frameworks, automated
    testing of AI outputs, or model performance benchmarking.
  - Experience designing prompts for secure enterprise use cases
    involving sensitive, confidential, or regulated
    information.
  - Knowledge of responsible AI practices, data protection,
    information security, and AI governance principles.
  - Experience with knowledge management systems, search
    technologies, vector databases, or retrieval-augmented
    generation solutions.
  - Experience building AI assistants, chatbots, agentic
    workflows, document analysis tools, or developer
    productivity solutions.

  Hourly range $70-85/hr

  Broadridge considers various factors when evaluating a
  candidate's final salary including, but not limited to,
  relevant experience, skills, and education.

