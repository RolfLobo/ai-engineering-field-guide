description: |
  About the Role

  We are looking for a passionate and skilled AI Developer
  with 2–3 years of hands-on experience in building AI/ML-
  based applications and intelligent automation solutions. The
  ideal candidate should have strong programming skills,
  practical exposure to machine learning models, LLM
  integrations, APIs, and backend development, along with the
  ability to work in a fast-paced product environment.

  The candidate will work closely with product managers,
  backend developers, cybersecurity teams, and business
  stakeholders to design and implement AI-driven solutions.

  Key Responsibilities

  · Design, develop, and deploy AI/ML-based applications and
  services.

  · Build and integrate Large Language Model (LLM) solutions
  using OpenAI, Claude, Gemini, or similar platforms.

  · Develop AI-powered automation workflows, chatbots,
  recommendation systems, and intelligent assistants.

  · Work on prompt engineering, Retrieval-Augmented Generation
  (RAG), vector databases, and AI integrations.

  · Fine-tune and optimize AI models for performance and
  scalability.

  · Integrate AI modules with backend systems, APIs, and
  databases.

  · Collaborate with frontend and backend teams for end-to-end
  implementation.

  · Participate in architecture discussions and technical
  solution design.

  · Perform testing, debugging, monitoring, and optimization
  of AI applications.

  · Stay updated with the latest advancements in AI, ML,
  GenAI, and automation technologies.

  · Maintain proper technical documentation and code
  standards.

  Required Skills & Qualifications

  Technical Skills

  · Strong knowledge of:

  o Python

  o AI/ML concepts

  o REST APIs

  o Backend development

  · Experience with:

  o OpenAI APIs / LLM integrations

  o LangChain / LlamaIndex

  o Vector Databases (Pinecone, Weaviate, ChromaDB, FAISS,
  etc.)

  o Prompt Engineering

  o RAG Architecture

  o NLP concepts

  · Familiarity with:

  o FastAPI / Flask / Django

  o Git & version control

  o SQL / NoSQL databases

  o Docker basics

  o Cloud platforms (AWS/Azure/GCP)

  Preferred Skills

  · Experience in AI agent development.

  · Exposure to cybersecurity or enterprise SaaS products.

  · Understanding of model deployment and MLOps basics.

  · Knowledge of OCR, speech-to-text, or document AI
  solutions.

  · Experience with frontend integration is a plus.

  Educational Qualification

  · Bachelor’s degree in:

  o Computer Science

  o IT

  o Artificial Intelligence

  o Data Science

  o Or related field

  Soft Skills

  · Strong problem-solving and analytical thinking.

  · Good communication and collaboration skills.

  · Ability to work independently with ownership mindset.

  · Quick learner with research-oriented thinking.

  · Ability to handle multiple tasks in a startup/product
  environment.

  What We Offer

  · Opportunity to work on real-world AI and cybersecurity
  products.

  · Exposure to cutting-edge AI technologies and enterprise
  solutions.

  · Collaborative and innovation-driven work culture.

  · Career growth and learning opportunities.

  · Flexible working environment.

  Preferred Candidate Profile

  · Candidates with working demo projects, GitHub portfolio,
  or AI-based product experience will be preferred.

  · Immediate joiners or short notice candidates preferred.
