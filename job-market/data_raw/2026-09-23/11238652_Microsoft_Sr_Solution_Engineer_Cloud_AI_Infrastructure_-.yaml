description: |
  Overview

  Are you curious, enthusiastic about infrastructure, and
  ready to solve complex challenges in the Frontier AI era?
  Join us as a Sr Solution Engineer, Cloud & AI Infrastructure
  for commercial customers at Microsoft.

  In this technical sales role, you will help customers design
  secure, scalable, resilient, and sovereign cloud
  architectures that support their Frontier transformation and
  modernization goals and guide organizations through
  modernization, migration, and transformation — translating
  technical capabilities into significant business outcomes.

  You will collaborate across teams to deliver impactful
  solutions that enhance agility, reduce costs, and unlock
  value through AI-powered infrastructure.

  As a Sr Solution Engineer, Cloud & AI Infrastructure, you
  will play a key role in helping customers modernize their
  Platform Estate, including hardware, software, applications,
  databases, security and networking with the full value of
  Microsoft’s cloud. You will work directly with technical and
  business stakeholders to design secure, scalable, resilient,
  compliant, and sovereign architectures that support
  business-critical applications and Frontier AI
  transformation. As a trusted technical advisor, you’ll guide
  customers and win their technical decisions on Azure
  solutions and deployment.

  You bring deep expertise in migrating core
  workloads—including Windows, Linux, and Oracle—to Azure.
  Beyond migration, you lead customers through modernization
  using the 6R strategy, containerization best practices, and
  Azure-native services like AKS, while exploring how Agentic
  AI and Tooling (e.g., Azure Copilot, GitHub Copilot, Agentic
  Assessment) can accelerate Frontier transformation.

  You complement this with strong networking knowledge to
  design hybrid and cloud-native solutions, including virtual
  networks, VPNs, secure routing architectures and trusted
  partner solutions to ensure secure, optimized, and scalable
  solutions.

  As you join the team, you will have the opportunity to
  accelerate your career growth, develop deep business acumen,
  hone your technical skills, and become adept at solution
  design and deployment. In summary, you’ll help customers
  modernize their existing platforms to realize the full value
  of Microsoft’s platform, all while enjoying flexible work
  opportunities.

  Responsibilities

  - Lead Platform Estate modernization & Sovereign Cloud
    customer engagements.
  - Drive technical workshop using live technical demos, co-
    create with customers whiteboarding & architecture, rapid
    prototyping, hands-on proofs of concept & pilots to
    resolve technical blockers.
  - Prove technical solutions, co-create or re-use existing
    architecture to influence solution design and enable
    customer commitment for deployments.
  - Maintain deep expertise in cloud migration (Windows, Linux,
    app workloads), resiliency, security, and compliance.
  - Know main market enterprise apps: SAP, Oracle and VMware.



  Qualifications

  Required Qualifications:

  - Master's Degree in Computer Science, Information Technology,
    or related field AND 3+ years technical pre-sales or
    technical consulting experience OR Bachelor's Degree in
    Computer Science, Information Technology, or related field
    AND 4+ years technical pre-sales or technical consulting
    experience OR 5+ years technical pre-sales or technical
    consulting experience OR equivalent experience.

  Other Requirements:

  Security Clearance Requirements: Candidates must be able to
  meet Microsoft, customer and/or  government security
  screening requirements are required for this role. These
  requirements include, but are not limited to the following
  specialized security screenings: • The successful candidate
  must have an active U.S. Government Top Secret Security
  Clearance. Ability to meet Microsoft, customer and/or
  government security screening requirements are required for
  this role. Failure to maintain or obtain the appropriate
  clearance and/or customer screening requirements may result
  in employment action up to and including termination. •
  Clearance Verification: This position requires successful
  verification of the stated security clearance to meet
  federal government customer requirements. You will be asked
  to provide clearance verification information prior to an
  offer of employment. • Microsoft Cloud Background Check:
  This position will be required to pass the Microsoft Cloud
  background check upon hire/transfer and every two years
  thereafter. • Citizenship & Citizenship Verification: This
  position requires verification of U.S. citizenship due to
  citizenship-based legal restrictions. Specifically, this
  position supports United States federal, state, and/or local
  United States government agency customer and is subject to
  certain citizenship-based restrictions where required or
  permitted by applicable law. To meet this legal requirement,
  citizenship will be verified via a valid passport, or other
  approved documents, or verified US government Clearance

  Preferred Qualifications:

  - Proven experience in cloud infrastructure, including
    migration of workloads such as Windows, Linux, VM.
  - Experience designing or selling solutions involving hybrid
    networking, secure connectivity, or network performance
    optimization in enterprise environments.
  - Hands-on experience with GitHub Copilot (GHCP), Agentic
    tooling, Windows Server, Linux, SQL Server, PostgreSQL,
    Azure Kubernetes Service (AKS), Azure Container Apps, and
    Defender for Cloud.
  - Strong understanding of Azure services, including
    networking, security, compliance, and hybrid cloud
    scenarios.
  - Proven ability to lead technical engagements (e.g.,
    prototyping, pilot, PoCs) that drive production-scale
    outcomes.
  - 6+ years technical pre-sales, technical consulting, or
    technology delivery, or related experience
  - 4+ years experience with cloud and hybrid, or on premises
    infrastructure, architecture designs, migrations, industry
    standards, and/or technology management
  - Familiarity with enterprise platforms such as SAP, Oracle,
    and ISVs like NetApp, VMware, and RedHat.
  - Knowledge of regulatory frameworks such as GDPR, HIPAA, and
    Public Sector compliance standards.





