  Compensation is based on the geographic location in which
  the role is located and is subject to change based on work
  location.

  - Have run NPS at a company where the number was reported
    externally or to a board, with the scrutiny that brings
  - Know the difference between a journey map that generated
    consensus and one that generated decisions
  - Have worked across both product and post-sale organizations
    and can speak either language

