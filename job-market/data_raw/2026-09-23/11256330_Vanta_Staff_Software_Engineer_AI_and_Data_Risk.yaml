description: |
  At Vanta, our mission is to help businesses earn and prove
  trust. We believe that security should be monitored and
  verified continuously, and we empower companies to practice
  better security and prove it with ease. Vanta has a kind and
  talented team, and while some have prior security
  experience, many have been successful at Vanta without it.

  Our Staff Software Engineers identify key strategic
  technical initiatives, deliver significant value to our
  customers and business, and set the tone for engineering
  excellence and culture. As an early engineering hire on the
  growing AI and Data Risk team based in London, you will play
  a key role in bolstering our engineering presence in Europe.
  You'll partner with product management, product design, and
  your growing engineering team to drive the discovery and
  development of privacy features that expand Vanta’s value
  for its customers. Your work will accelerate product
  development and create a consistent customer experience for
  all of our customer segments.

  Vanta’s team and technology surface are growing quickly, and
  it’s essential that we invest in the right abstractions and
  systems to enable us to scale with our business. As a Staff
  Software Engineer, you’ll be responsible for identifying key
  strategic technical initiatives that impact our entire
  engineering team and deliver significant value to our
  business. You will set a high bar for engineering culture
  and excellence, and your past experience will be leveraged
  to enable and accelerate Vanta’s growth.

  Our business has found incredible product-market fit and has
  monetized effectively since the day we signed our first
  customer. We’re growing at a blistering pace, which presents
  career-defining opportunities for engineers to accelerate
  their growth and to contribute to a rapidly-scaling company.

  Vanta has a kind and talented team, and while some have
  prior security experience, many have been successful at
  Vanta without it. We’d love for you to join us!

  What you’ll do as a Software Engineer at Vanta:

  - Identify, scope, and lead large technical projects, laying
    the groundwork for core products to evolve and scale into
    highly performant, reliable, and customizable systems
  - Design, develop, and own new product functionality and/or
    infrastructure leveraging modern frameworks and tooling
    (TypeScript, React, Node.js)
  - Make effective tradeoffs that consider business priorities,
    user experience, and a sustainable technical foundation
  - Assist in interviewing, hiring, and onboarding new
    engineering teammates in the United Kingdom and/or
    Ireland.
  - Act as a cultural beacon, setting an example for effective,
    collaborative engineering and helping mentor junior team
    members

  How to be successful in this role:

  - At least 10 years of industry experience as a software
    engineer
  - Served as a technical lead for large projects (6+ months in
    length), including defining the roadmap for complex
    projects spanning multiple teams and functions
  - Built successful SaaS products for both startup and
    enterprise users
  - Have previous startup experience, or worked in an
    environment that prioritizes a bias for action
  - Upleveled teams of engineers by mentoring and leading by
    example
  - Experience working at rapidly scaling startups and large
    companies, especially with environments that prioritise a
    bias for action
  - Open to using AI to amplify their skills and strengthen
    their work - demonstrating curiosity, a willingness to
    learn, and sound judgment in applying AI responsibly to
    improve efficiency and impact

  What you can expect as a Vanta’n:

  - Industry-competitive salary and equity
  - 100% covered medical, dental, and vision benefits with
    dependents coverage
  - 16 weeks paid Parental Leave for all new parents
  - Health & wellness stipend
  - Remote workspace, internet, and mobile phone stipend
  - Commuter benefits and lunch allowance for team members who
    attend the office
  - Pension matching
  - 25 days of Annual Leave per year and unlimited sick time
  - 8 company-paid holidays
  - Virtual team-building activities, lunch and learns, and
    other company-wide events!
  - Offices in SF, NYC, London, Dublin, Tel Aviv, and Sydney

  #LI-hybrid

  At Vanta, we are committed to hiring diverse talent of
  different backgrounds and as such, it is important to us to
  provide an inclusive work environment for all. We do not
  discriminate on the basis of race, gender identity, age,
  religion, sexual orientation, veteran or disability status,
  or any other protected class. As an equal opportunity
  employer, we encourage and welcome people of all backgrounds
  to apply.

  About Vanta

  We started in 2018, in the wake of several high-profile data
  breaches. Online security was only becoming more important,
  but we knew firsthand how hard it could be for fast-growing
  companies to invest the time and manpower it takes to build
  a solid security foundation. Vanta was inspired by a vision
  to restore trust in internet businesses by enabling
  companies to improve and prove their security. From our
  early days automating security monitoring for compliance
  standards like SOC 2, HIPAA and ISO 27001 to creating the
  world's leading Trust Management Platform, our vision
  remains unchanged.

  Now more than ever, making security continuous—not just a
  point-in-time check— is essential. Thousands of companies
  rely on Vanta to build, maintain and demonstrate their
  trust— all in a way that's real-time and transparent.

  Referral Instructions

  If you are being referred for the role, please contact that
  person to apply on your behalf.
