description: |
  At Mitratech, we are a team of innovators focused on
  building world-class products that simplify operations in
  the Legal, Risk, Compliance, and HR functions. We are a
  close-knit, globally dispersed team that thrives in an
  ecosystem that supports individual excellence and takes
  pride in its diverse and inclusive work culture centered
  around great people practices, learning opportunities, and
  having fun! Our culture is the ideal blend of
  entrepreneurial spirit and enterprise investment, enabling
  the chance to move at a rapid pace with some of the most
  complex, leading-edge technologies available.

  For over 35 years, the experts at Mitratech have been
  focused on solving the complex needs. Today, we serve 20,000
  client companies of all sizes globally, representing 30% of
  the Fortune 500 and over 500,000 users in over 160
  countries.

  As we continue to grow, we’re always looking for
  resourceful, enthusiastic, and fresh perspectives. Join our
  global team and see what makes Mitratech a truly exceptional
  place to work!

  Role Overview

  We are looking for a Principal AI Engineer to guide a
  distributed team of developers in building modern, scalable,
  and AI-integrated software solutions. As a technical leader,
  you'll be responsible for architectural oversight, system
  design, and AI strategy. You will play a crucial role in
  mentoring our global distributed developers, helping them
  decompose complex features into clear, modular tasks and
  leveraging AI tools to improve the speed, quality, and
  innovation of our delivery.

  This is a highly impactful role, ideal for someone who
  thrives at the intersection of software engineering, AI-
  assisted development, and technical leadership.

  Key Responsibilities

  - Technical Leadership & Architecture: You will provide
    technical leadership for the team, guiding the design,
    development, and deployment of software solutions that
    leverage AI to solve complex business problems. You will
    be responsible for designing scalable, modular systems and
    communicating architectural decisions across services and
    domains. You will ensure all development aligns with
    modern architectural principles like domain-driven design
    and micro-services.
  - Agentic AI & Prompt Engineering: You will be a subject
    matter expert in Agentic AI integration. This includes
    architecting and building robust MCPs/APIs and AI Agents
    to facilitate AI capabilities within our existing
    platforms. You will also develop and refine prompt
    strategies to guide AI agents in writing code,
    documentation, and tests, leveraging LLM tools to automate
    repetitive tasks and improve overall development
    efficiency.
  - System Design & Task Decomposition: You'll translate high-
    level product goals into actionable engineering tasks that
    are optimized for both human and AI execution. You will
    also provide in-depth code reviews (for both human- and
    AI-generated code), ensuring performance, security, and
    correctness across our entire codebase.
  - Mentorship & Coaching: You will actively mentor our globally
    distributed developers, providing technical guidance and
    fostering a learning culture focused on AI tool adoption,
    clean code practices, and modern software design.
  - DevOps & CI/CD: You will collaborate on optimizing our build
    and deployment pipelines by integrating AI-enhanced review
    and testing steps to streamline our delivery process.

  Qualifications

  Essential Qualifications

  - 10+ years of software engineering experience, with a focus
    on design/architectural technical leadership.
  - 2+ years of experience working with AI/ML models in a
    production environment.
  - A strong background in backend or full-stack technologies
    (Python).
  - Demonstrated experience leveraging AI-assisted development
    tools like Claude Code, Devin AI, GH Copilot or various
    GPT APIs.
  - Strong system design (focused on RAG/Agentic systems) and
    task decomposition skills.
  - Proven experience leading distributed engineering teams.
  - Excellent written and verbal communication skills in
    English.
  - Exposure to AI agent frameworks (e.g., LangChain, LangGraph,
    CrewAI, AutoGPT, AgentCore).
  - Experience with domain-driven design (DDD) or MCPs/Micro-
    services architecture.
  - Experience with vector/graph databases, embeddings, or other
    LLM infrastructure.

  Preferred Qualifications

  - A portfolio or examples of previous work demonstrating a
    passion for AI-driven software development.
  - Prior experience in a fast-paced SaaS or startup
    environment.
  - Knowledge of the HR, Legal, or Risk industries.

  What You'll Gain

  This isn't just a leadership role; it's a chance to be at
  the forefront of AI-integrated development. You will have
  the unique opportunity to shape how AI tools are used in
  modern software delivery and help us build a more efficient,
  innovative engineering organization. You will be part of a
  collaborative, mentorship-focused team where you can make a
  significant and lasting impact.

  We will disclose intended pay ranges in our job ads for US-
  based opportunities – This role can be performed 100% remote
  anywhere in the US. Anticipated Pay Range: $180K – $200K
  Annually USD

  Total compensation includes US employee benefits and annual
  bonus eligibility.

  Benefits we offer:

  - Health, Dental & Vision Insurance *
  - 401 (k) + Employer Match *
  - Open PTO + 11 Paid Holidays + 4 Annual Paid Global Wellness
    Days Off
  - STD, LTD & Group Life Insurance
  - Paid Parental Leave
  - Pet Insurance
  - FSA & HSA Options
  - Employee Assistance Program

  Perks we offer:

  - Remote Work
  - Career Advancement & Professional Development Opportunities
  - Employee Recognition
  - LinkedIn Learning Platform

