description: |
  Company Overview

  Deepgram is the leading platform underpinning the emerging
  trillion-dollar Voice AI economy, providing real-time APIs
  for speech-to-text (STT), text-to-speech (TTS), and building
  production-grade voice agents at scale. More than 200,000
  developers and 1,300+ organizations build voice offerings
  that are ‘Powered by Deepgram’, including Twilio,
  Cloudflare, Sierra, Decagon, Vapi, Daily, Cresta, Granola,
  and Jack in the Box. Deepgram’s voice-native foundation
  models are accessed through cloud APIs or as self-hosted and
  on-premises software, with unmatched accuracy, low latency,
  and cost efficiency. Backed by a recent Series C led by
  leading global investors and strategic partners, Deepgram
  has processed over 50,000 years of audio and transcribed
  more than 1 trillion words. There is no organization in the
  world that understands voice better than Deepgram.

  Company Operating Rhythm

  At Deepgram, we expect an AI-first mindset—AI use and
  comfort aren’t optional, they’re core to how we operate,
  innovate, and measure performance.

  Every team member who works at Deepgram is expected to
  actively use and experiment with advanced AI tools, and even
  build your own into your everyday work. We measure how
  effectively AI is applied to deliver results, and
  consistent, creative use of the latest AI capabilities is
  key to success here. Candidates should be comfortable
  adopting new models and modes quickly, integrating AI into
  their workflows, and continuously pushing the boundaries of
  what these technologies can do.

  Additionally, we move at the pace of AI. Change is rapid,
  and you can expect your day-to-day work to evolve just as
  quickly. This may not be the right role if you’re not
  excited to experiment, adapt, think on your feet, and learn
  constantly, or if you’re seeking something highly
  prescriptive with a traditional 9-to-5.

  About the Role

  We are building the next generation of People Operations at
  Deepgram. We're looking for an early-career engineer to
  partner directly with our Head of People to identify,
  design, and build AI-powered workflows that fundamentally
  change how People Ops operates.

  You will not be maintaining an HRIS or administering
  traditional People systems. You will build the systems that
  sit on top of them.

  You'll take manual, repetitive, high-friction People
  processes and turn them into intelligent workflows using AI,
  automation, APIs, internal tools, and agents.

  You'll work across People, Engineering, IT, and other
  functions to build secure, scalable solutions that allow
  employees and managers to get answers and complete workflows
  without requiring a People team member for every
  interaction.

  This is a highly hands-on role for someone who loves
  building, experimenting, and finding ways to make work
  dramatically more efficient.

  What You'll Do

  - Partner directly with the People & Talent Team to identify
    high-impact opportunities to apply AI and automation
    across People Operations.
  - Build an AI-first onboarding experience that is scalable, up
    to date, and provides an exceptional experience.
  - Turn manual People workflows into automated, AI-powered
    systems.
  - Build AI agents and workflows that can answer questions,
    gather information, initiate processes, and complete
    defined actions.
  - Integrate AI systems with existing tools, including HRIS,
    Slack, recruiting, performance, compensation, and other
    internal systems.
  - Build internal tools and interfaces that make People
    processes dramatically easier for employees, managers, and
    the People team.
  - Prototype quickly, test with real users, learn from what
    works, and iterate.
  - Establish appropriate human-in-the-loop controls, escalation
    paths, permissions, and safeguards for sensitive People
    workflows.
  - Partner with Engineering and IT on architecture, security,
    access controls, and productionizing successful
    prototypes.
  - Measure whether what you build actually saves time, improves
    the employee experience, or increases the quality and
    consistency of People Operations.

  Notice: We're aware of individuals impersonating Deepgram
  recruiters. All legitimate Deepgram recruiting communication
  comes from an @deepgram.com email address. If you've
  received a message claiming to be Deepgram, please forward
  it to careers@deepgram.com.
