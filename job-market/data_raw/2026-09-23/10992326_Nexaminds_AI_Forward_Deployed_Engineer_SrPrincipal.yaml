description: |
  Unlock Your Future with Nexaminds!

  At Nexaminds, we're on a mission to redefine industries with
  AI. We're passionate about the limitless potential of
  artificial intelligence to transform businesses, streamline
  processes, and drive growth.

  Join us on our visionary journey. We're leading the way in
  AI solutions, and we're committed to innovation,
  collaboration, and ethical practices. Become a part of our
  team and shape the future powered by intelligent machines.
  If you're driven by ambition, success, fun, and learning,
  Nexaminds is where you belong.

  Nexaminds is looking for a Senior/Principal AI Forward
  Deployed Engineer to work at the intersection of
  engineering, product, and customers. In this role, you'll
  work directly with customer teams to design, build, and
  deploy AI-powered solutions using modern LLM and agentic
  technologies. You'll turn ambiguous business and technical
  challenges into production-ready systems while helping shape
  product and engineering priorities based on real-world
  customer needs.

  Location: Mexico (Remote)

  Qualifications we are looking for:

  - 8+ years of professional software engineering experience,
    with significant experience building and deploying
    production systems.
  - Hands-on experience working with LLMs and modern AI/agentic
    architectures, including prompting, evaluation, retrieval,
    tool use, and orchestration.
  - Proven experience working directly with customers or
    internal stakeholders to define ambiguous problems and
    deliver production-ready solutions.
  - Strong full-stack engineering capabilities, with experience
    across backend systems, APIs, integrations, and data
    pipelines.
  - Experience designing and building scalable, production-grade
    AI-powered applications.
  - Strong understanding of software architecture, cloud
    technologies, APIs, integrations, and distributed systems.
  - Excellent communication skills, with the ability to lead
    technical discussions and workshops with both engineering
    teams and business stakeholders.
  - Strong ownership and problem-solving skills, with a bias
    toward action and iterative delivery.
  - Comfortable working independently in ambiguous, fast-paced
    environments and managing multiple projects
    simultaneously.
  - Willingness to travel to customer sites as needed.
  - Proven experience partnering with business and technical
    stakeholders to understand business goals, processes, and
    challenges, translate them into technical requirements,
    and deliver practical, production-ready solutions.

  Nice to have:

  - Experience in Forward Deployed Engineering, Solutions
    Engineering, or Field Engineering within an enterprise
    software or AI company.
  - Experience deploying AI solutions in regulated or complex
    enterprise environments.
  - Familiarity with security reviews, data governance, and
    legacy system integrations.
  - Experience with AI evaluation frameworks, vector databases,
    RAG, or AI orchestration platforms.
  - Proven experience providing product feedback that directly
    influenced product or engineering roadmaps.

  Job duties:

  - Work directly with customers as a technical owner to
    understand their data, workflows, systems, and business
    requirements.
  - Design and build production-grade AI applications,
    integrations, pipelines, and workflows that connect
    Nexaminds' AI/LLM capabilities with customer systems.
  - Rapidly prototype AI solutions with customers, gather
    feedback, and transform successful prototypes into
    reliable production systems.
  - Integrate LLMs, AI agents, retrieval systems, tools, and
    orchestration workflows into customer environments.
  - Diagnose and resolve complex technical issues across AI
    models, infrastructure, integrations, and customer-
    specific systems.
  - Lead technical workshops and architecture discussions with
    customer engineering and technical leadership.
  - Establish reusable technical patterns, components, and best
    practices across multiple customer deployments.
  - Act as the technical voice of the customer internally,
    translating field learnings into actionable feedback for
    Product and Engineering.
  - Partner with Product, Sales Engineering, Customer Success,
    and Engineering teams to ensure successful customer
    deployments.
  - Mentor other forward-deployed and customer-facing engineers
    and help raise technical standards across the team.
  - Support customer go-live milestones and travel to customer
    sites when required.

  What you can expect from us

  Here at Nexaminds, we're not your typical workplace. We're
  all about creating a friendly and trusting environment where
  you can thrive. Why does this matter? Well, trust and
  openness lead to better quality, innovation, commitment to
  getting the job done, efficiency, and cost-effectiveness.

  - Stock options 📈
  - Remote work options 🏠
  - Flexible working hours 🕜
  - Benefits above the law
  - But it's not just about the work; it's about the people too.
    You'll be collaborating with some seriously awesome IT
    pros.
  - You'll have access to mentorship and tons of opportunities
    to learn and level up.

  Ready to embark on this journey with us? 🚀🎉 If you're
  feeling the excitement, go ahead and apply!
