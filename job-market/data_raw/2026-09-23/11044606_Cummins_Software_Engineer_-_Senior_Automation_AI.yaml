  Qualifications

  The role is responsible for the end-to-end engineering of
  enterprise automation solutions, with UiPath as the core
  automation platform. Designs, develops, tests, deploys,
  supports, and optimizes secure, scalable, and reliable
  automations and contributes to the engineering and operation
  of the underlying automation platform and infrastructure.

  The role works across automation development, integrations,
  production support, platform operations, infrastructure and
  emerging AI/agentic technologies to deliver reliable
  business outcomes.

  Key Responsibilities

  - Design, develops, deploys and support enterprise automation
    solutions using UiPath, APIs, workflows, reusable
    components, and appropriate automation technologies.
  - Translate business requirements into technical designs
    considering scalability, security, performance,
    availability, maintainability, and other NFRs.
  - Troubleshoot production failures across automation code,
    applications, APIs, credentials, integrations, platform,
    and infrastructure and perform root-cause analysis, drives
    solutions through cross functional teams.
  - Support automation platform and infrastructure activities
    including provisioning, configuration, patching, upgrades,
    migrations, capacity management, performance optimization,
    and disaster recovery.
  - Participate, lead and perform hands on platform upgrades and
    compatibility testing when underlying enterprise
    applications such as ERP, SAP, Salesforce, or other
    integrated systems undergo major releases.
  - Implement monitoring, logging, alerting, and observability
    using enterprise tools such as Splunk, Dynatrace, and
    ServiceNow.
  - Apply enterprise security, IAM, credential management,
    auditability, compliance, and DevSecOps standards across
    the automation lifecycle.
  - Develop and integrate advanced automation capabilities using
    UiPath APIs, Integration Service, Coded Apps, Maestro,
    AI/agentic capabilities, where applicable.
  - Contribute to hybrid automation solutions integrating UiPath
    with Power Platform, AWS services, Python, APIs,
    Generative AI, and agentic technologies.
  - Demonstrates strong problem-solving skills and the ability
    to quickly learn, adapt, and apply new technologies to
    solve evolving business and technical challenges.

  Qualification

  - Bachelor’s degree in computer science, Information
    Technology, Business, or a related field, or equivalent
    relevant experience.
  - 10-12 years of overall professional experience.
  - Preferred certifications: AWS / Azure Cloud Certifications,
    UiPath Solution Architect, UiPath Infrastructure Engineer.
  - Hands-on experience as Design, develop, Support

  Technical Skills & Experience

  - Strong hands-on experience with UiPath Studio, Orchestrator,
    Robots/Runtimes, Queues, Assets, Triggers, Libraries, APIs
    and enterprise integrations.
  - Expertise in UiPath Automation Cloud/Automation Suite,
    Integration Service, Apps/Coded Apps, Maestro and agentic
    capabilities is desirable.
  - Experience with C#/.NET, Python, Typescript, React
    framework, SQL, REST APIs, JSON/XML, OAuth and enterprise
    application integrations.
  - Experience supporting automation environments, Windows
    servers/VMs, robot machines, runtimes, service accounts,
    IAM, credentials, networking and platform dependencies.
  - Experience in Microsoft Power Platform, PowerBI, AWS/Azure
    cloud services, Generative AI, RAG, LLM APIs and agentic
    automation is preferred.
  - Working knowledge of monitoring/observability and ITSM tools
    such as Splunk, Dynatrace and ServiceNow. Knowledge of
    using VS Code.
  - Experience integrating automation platforms with AI services
    and enterprise APIs is advantageous.

