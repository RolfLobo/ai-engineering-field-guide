description: |
  Job Title: Full Stack Engineer (AI-focused)

  Location: Remote

  Job Summary:

  We are seeking a highly skilled and motivated Full Stack
  Engineer to join our dynamic team. The ideal candidate will
  have a strong background in building and maintaining
  scalable web applications using either Spring Boot or
  Node.js, with proficiency in Python. This role requires a
  passion for both front-end and back-end development, along
  with exposure to Artificial Intelligence and a solid
  understanding of DevOps practices, specifically writing
  GitHub Actions for CI/CD pipelines.

  Key Responsibilities:

  - Design, develop, and maintain both client-side and server-
    side architecture for our web applications.
  - Build robust, scalable, and high-performance backend
    services and RESTful APIs using either Spring Boot (Java)
    or Node.js.
  - Develop responsive and user-friendly front-end interfaces
    using modern JavaScript frameworks (e.g., React, Angular,
    Vue.js).
  - Utilize Python for scripting, data manipulation, and
    integrating AI/ML models into our applications.
  - Collaborate with data scientists and AI engineers to
    integrate and deploy machine learning models and AI-driven
    features.
  - Create, manage, and optimize CI/CD pipelines using GitHub
    Actions to automate the build, testing, and deployment
    processes.
  - Work with and manage both SQL (e.g., PostgreSQL, MySQL) and
    NoSQL (e.g., MongoDB) databases.
  - Troubleshoot, debug, and upgrade existing software to ensure
    optimal performance and security.
  - Write clean, maintainable, and well-documented code, and
    participate in code reviews to maintain high standards of
    quality.
  - Stay up-to-date with the latest industry trends and
    technologies in full-stack development, AI, and DevOps to
    drive continuous improvement.

  Required Qualifications:

  - Bachelor’s degree in Computer Science, Engineering, or a
    related field, or equivalent practical experience.
  - Proven experience as a Full Stack Engineer or similar role.
  - Strong proficiency in either Java with Spring Boot or
    JavaScript with Node.js.
  - Solid experience with Python and its application in a web
    development context
  - Hands-on experience with front-end technologies such as
    HTML, CSS, and modern JavaScript frameworks (React,
    Angular, or Vue.js).
  - Experience with creating and consuming RESTful APIs
  - Demonstrable experience with version control systems,
    particularly Git.

  Preferred Qualifications:

  - Exposure to Artificial Intelligence, Machine Learning, or
    integrating AI APIs (e.g., OpenAI, Hugging Face
  - Hands-on experience writing and maintaining GitHub Actions
    for CI/CD pipelines
  - Familiarity with containerization technologies like Docker
    and orchestration tools like Kubernetes
  - Experience with cloud platforms such as AWS, Google Cloud
    Platform (GCP), or Azure
  - Understanding microservice architecture.
  - Excellent problem-solving skills and the ability to work in
    a fast-paced, agile environment.
  - Strong communication and collaboration skills.

  Compensation, Benefits and Duration

  Minimum Compensation: USD 32,000 Maximum Compensation: USD
  112,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full-time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
