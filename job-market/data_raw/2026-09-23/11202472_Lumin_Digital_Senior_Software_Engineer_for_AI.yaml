title: Senior Software Engineer for AI
company: Lumin Digital
location: USA
remote: true
work_type: FULL_TIME
description: |
  We are looking for a Senior Software Engineer for AI to join
  our engineering team. In this role, you will design, build,
  and ship AI-powered features that directly impact our
  platform and our clients' members. You'll collaborate
  closely with product, engineering, security, and data teams
  to integrate large language models and other AI/ML
  capabilities into Lumin's core products and developer
  tooling.

  Essential Functions and Responsibilities:

  - Design and build AI-powered features across Lumin's digital
    banking platform, including natural language interfaces,
    intelligent assistants, and automated workflows
  - Integrate LLMs and AI APIs (Anthropic Claude, OpenAI, etc.)
    into production systems with robust prompt engineering,
    output validation, and safety guardrails
  - Evaluate AI outputs critically, ensuring accuracy,
    reliability, and compliance with financial services
    regulations
  - Collaborate cross-functionally with product managers,
    designers, QE engineers, and other engineering teams to
    deliver end-to-end AI features
  - Contribute to Lumin's internal AI knowledge base,
    documenting patterns, best practices, and learnings for
    the broader engineering organization
  - Champion security and compliance in AI feature development,
    with awareness of fintech regulatory requirements (SOC 2,
    data privacy, etc.)
  - Conduct and participate in code reviews, raising the
    technical bar for AI-related work across the organization
  - Evaluate and recommend new AI tools and frameworks as the
    ecosystem evolves, helping Lumin stay at the forefront of
    applied AI in financial services

  Position Specifications

  Education:

  - Bachelor's degree in Computer Science or 5 years equivalent
    experience

  Experience:

  - 5+ years of professional software engineering experience
  - 1–2 years of hands-on experience with AI/ML integration or
    LLM-based product development
  - Proficiency with LLM APIs such as Anthropic Claude or
    OpenAI, including prompt engineering and tool/function
    calling
  - Proficiency in TypeScript/Node.js
  - Experience with RESTful APIs, microservices architecture,
    and cloud infrastructure (AWS preferred)
  - Demonstrated ability to critically evaluate AI-generated
    outputs — knowing when to trust, verify, and push back
  - Strong written and verbal communication skills; ability to
    explain complex AI concepts to non-technical stakeholders



  Travel:

  - Minimal, generally 12 days or less per year, ~2X team get
    togethers a year

  Benefits include: Medical, dental, and vision insurance;
  401(k) with company match; flexible PTO plus 12 paid
  holidays; paid sick leave; paid parental and family leave;
  lifestyle spending account; tuition reimbursement; and cell
  phone stipend. Additional details provided during the
  interview process.

  LIFE AT LUMIN DIGITAL

  Lumin Digital is a trailblazer in digital banking solutions,
  driven by a unique approach to technology, service, and
  people. We empower credit unions and banks by creating
  cutting-edge digital experiences that continuously serve,
  engage, and grow their membership base — and as a 100%
  cloud-native company, we're purpose-built to unlock the full
  advantages of the cloud for financial institutions and their
  users.

  At Lumin, we thrive on curiosity and innovation. Our culture
  is built on trust in our expertise and decisions, respect
  for diverse perspectives and talents, and boldness in
  pursuing new ideas. These values shape a workplace where
  collaboration thrives, ideas flourish, and new possibilities
  are discovered every day. We encourage our team to explore,
  experiment, and challenge the status quo — because
  continuous improvement isn't just a goal, it's how we
  operate.

