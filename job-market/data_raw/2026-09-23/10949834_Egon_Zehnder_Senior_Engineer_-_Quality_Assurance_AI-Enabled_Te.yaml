  Knowledge Centre India (KCI)

  Established in January 2005, KCI in Gurgaon, works in close
  collaboration with the Global offices of Egon Zehnder. There
  are 5 teams that make up KCI: Research, Research Operations,
  Visual Solutions, Projects/CV Capture and Digital IT.

  Who we are!

  We are part of Digital-IT team established 17 years ago in
  Gurgaon, India to provide technology support and rollout
  digital initiatives to 60 plus global offices. Digital IT
  has six key pillars – Collaboration Technology; Functional
  Technology; Digital Technology; Security & Architecture;
  Infrastructure & Services, Digital Success to support
  business and to take lead on digital transformation
  initiatives with the total strength of 150+ team members
  across the globe

  RequirementsRole Summary

  We are looking for a Senior Engineer - Quality Assurance to
  lead the adoption of AI-assisted quality engineering and
  test automation across our cloud-native platform ecosystem.
  The role focuses on leveraging AI to improve test design,
  automation coverage, release quality and engineering
  productivity while ensuring reliability across React
  applications, Azure integrations, event-driven architectures
  and AI-powered solutions.

  Key Responsibilities

  - Champion AI-assisted testing practices across the SDLC.
  - Utilize AI tools for test case generation, test data
    creation, automation development, risk identification and
    regression optimization.
  - Design, develop and maintain automation frameworks for
    functional, regression, integration and end-to-end
    testing.
  - Automate testing of React applications and REST APIs.
  - Validate Azure Event Hubs, Azure Functions, Azure SignalR,
    Azure ADI and Azure OpenAI based solutions.
  - Perform prompt testing, AI response validation and AI
    regression testing.
  - Integrate automated testing into Azure DevOps build and
    release pipelines and implement quality gates.
  - Execute performance, reliability and security testing.

  Required Qualifications

  - 5-8 years of experience in Quality Engineering, QA
    Automation or SDET roles.
  - Strong experience with AI-assisted testing tools and quality
    engineering practices.
  - Hands-on experience with React, API testing and Azure
    services
  - Experience integrating automation into Azure DevOps CI/CD
    pipelines.
  - Proficiency in JavaScript/TypeScript and modern automation
    frameworks.

  Technical Skills

  - AI-Driven Testing
  - Playwright, Cypress, Selenium, Jest, React Testing Library
  - REST APIs, Postman, Swagger/OpenAPI, Contract Testing
  - Azure Functions, Event Hubs, SignalR, ADI, Azure OpenAI
  - Azure DevOps, CI/CD, Git

