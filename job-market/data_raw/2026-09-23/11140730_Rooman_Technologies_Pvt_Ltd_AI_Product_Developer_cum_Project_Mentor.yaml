description: |
  Rooman Technologies Pvt. Ltd. is looking for an enthusiastic
  and motivated AI Product Developer cum Project Mentor to
  join our team. The ideal candidate should be passionate
  about software development, AI technologies, website
  development, and supporting student projects and training
  activities.

  This role offers an internship period with the opportunity
  to transition into a full-time role based on performance and
  learning capability.

  Required Skills:

  - Basic programming and software development knowledge
  - Interest in AI tools and emerging technologies
  - Website development knowledge (preferred)
  - Good communication and coordination skills
  - Ability to learn quickly and work in a team environment
  - Training or mentoring interest is an added advantage.

  Key Responsibilities:

  - Develop application software for internal and client
    requirements
  - Learn and use AI tools in software and application
    development
  - Design, develop, and maintain websites and web-based
    solutions
  - Support students in academic and real-time project execution
  - Deliver training and guidance in relevant technologies and
    tools
  - Coordinate project-related activities and provide technical
    support

  RequirementsEducational Qualification:

  - BE / BTech / BCA / MCA / MSc / Relevant Technical
    Qualification
  - Freshers and entry-level candidates may apply.

  Work Location:

  Bangalore office with willingness to travel for project or
  client assignments if required.

  Employment Terms:

  - Company policies and confidentiality rules apply
  - No parallel employment/business without approval
  - One-month notice period or salary in lieu of notice
  - Employment subject to document and background verification

  Documents Required at Joining:

  - Educational certificates and mark sheets
  - Government ID proof (Aadhar / PAN / Passport)
  - Passport-size photographs
  - Bank account details
  - Experience/relieving letters (if applicable)

  Joining Date:

  As per company requirement / Offer confirmation.

  Application Process:

  Interested candidates can apply and confirm their acceptance
  as per company guidelines.

  If you want, I can also convert this into a ready-to-copy
  Zoho Recruit field-wise format (Job Opening Title, Industry,
  Work Experience, Salary Range, Skills, Job Description box,
  etc.) for direct paste into Zoho Recruit.

  BenefitsCompensation & Benefits:

  Internship Period (1 Month): ₹10,000 per month

  Post Internship (From Month 2 onwards): ₹25,000 to ₹35,000
  per month (subject to successful completion and
  confirmation)
