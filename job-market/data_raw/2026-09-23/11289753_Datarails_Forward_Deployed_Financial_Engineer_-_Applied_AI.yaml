  or mental disability, genetic information or characteristic,
  gender identity and expression, veteran status, or other
  non-job related characteristics or other prohibited grounds
  specified in applicable federal, state, and local laws.
  Datarails’ policy is to comply with all applicable laws
  related to nondiscrimination and equal opportunity and will
  not tolerate discrimination or harassment based on any of
  these characteristics. This policy applies to all terms and
  conditions of employment, including recruiting, hiring,
  placement, promotion, termination, layoff, recall, transfer,
  leaves of absence, compensation, and training.
