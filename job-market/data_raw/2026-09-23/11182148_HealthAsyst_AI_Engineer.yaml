description: |
  About HealthAsyst

  HealthAsyst® is an IT service and product company. It is a
  leading provider of IT services to some of the largest
  healthcare IT vendors in the United States. We bring the
  value of cutting-edge technology through our deep expertise
  in product engineering, custom software development,
  testing, large-scale healthcare IT implementation and
  integrations, on-going maintenance and support, BI &
  Analytics, and remote monitoring platforms. As a true
  partner, we help our customers navigate a complex regulatory
  landscape, deal with cost pressures, and offer high-quality
  services. As a healthcare transformation agent, we enable
  innovation in technology and accelerate problem-solving
  while delivering unmatched cost benefits to healthcare
  technology companies. HealthAsyst is now a Great Place to
  Work-Certified™ & our product has also been consistently
  recognized for high customer credibility by Gartner,
  Capterra etc.

  Role Overview:

  Looking for AI Engineers with experience in building voice
  agents, chat agents, and agentic AI solutions for enterprise
  use cases.

  Key Responsibilities:

    - Build and deploy AI voice & chat agents
    - Develop agentic solutions using LLMs
    - Work on prompt engineering, APIs & integrations
    - Improve performance and scalability of AI systems

  Required Skills:

    - 2–5 years in AI/ML,Python
    - Hands-on experience in GenAI / LLMs
    - Experience building chatbots / voice bots / AI agents
    - Knowledge of API integration & backend systems
    - Basic understanding of RAG / NLP concepts

  What you will get:

  Bi-Annual Salary Reviews

  Flexible working hour

  Three Day Hybrid Model

  Market competitive pay

  GMC (Group Mediclaim): Provides Insurance coverage of Rs. 3
  lakhs + a corporate buffer of 2 Lakhs per family. This is a
  family floater policy, and the company covers all the
  employees, spouse, and up to two children

  Employee Wellness Program- HealthAsyst offers unlimited
  online doctor consultations for self and family from a range
  of 31 specialties for no cost to employees. And OPD
  consultations with GP Doctors are available in person for No
  Cost to employees

  GPA (Group Personal Accident): Provides insurance coverage
  of Rs. 20 lakhs to the employee against the risk of
  death/injury during the policy period sustained due to an
  accident

  GTL (Group Term Life): Provides life term insurance
  protection to employees in case of death. The coverage is
  one time of the employee’s CTC

  Employee Assistance Program: HealthAsyst offers complete
  confidential counselling services to employees & family
  members for mental wellbeing

  Sponsored upskills program: The company will sponsor up to 1
  lakh for certifications/higher education/skill upskilling.

  Flexible Benefits Plan – covering a range of components like

  ·     National Pension System.

  ·     Internet/Mobile Reimbursements.

  ·     Fuel Reimbursements.

  ·     Professional Education Reimbursement
