description: |
  Full Stack AI Engineer

  ? Location: Anywhere in India

  ? Experience: 5–6 Years

  ? CTC: ₹25–35 LPA

  ⏳ Notice Period: Immediate Joiners / Up to 30 Days

  About the Role

  We are looking for a hands-on Full Stack AI Engineer with
  strong software engineering skills and practical experience
  building Generative AI / LLM-powered applications.

  The ideal candidate should have experience across backend
  and frontend development, AI/LLM integration, APIs,
  databases, and cloud platforms, with the ability to build
  scalable, production-ready AI applications.

  Key Responsibilities

  - Design, develop and maintain full-stack Generative AI
    applications.
  - Build robust backend systems and APIs for AI-driven products
    and agent-based applications.
  - Integrate LLMs and GenAI models into production-ready
    applications.
  - Develop user-facing applications using modern frontend
    technologies.
  - Work with agentic AI frameworks such as LangChain, LangGraph
    or Semantic Kernel.
  - Develop and integrate REST/GraphQL APIs and work with
    SQL/NoSQL databases.
  - Containerise applications using Docker and deploy solutions
    on cloud platforms.
  - Implement logging, monitoring, tracing and validation for AI
    applications.
  - Follow strong software engineering practices including code
    reviews, testing and documentation.
  - Collaborate with AI engineers, data scientists and technical
    teams to deliver end-to-end AI solutions.

  Required Skills

  - 5–6 years of professional software engineering/full-stack
    development experience.
  - Strong hands-on experience with Python, preferably Django.
  - Strong experience with JavaScript/TypeScript and React.
  - Experience building backend systems, APIs and data-driven
    applications.
  - Practical experience with Generative AI, LLMs and AI-powered
    applications.
  - Experience/exposure to LangChain, LangGraph, Semantic Kernel
    or similar frameworks.
  - Strong understanding of REST/GraphQL APIs, backend
    architecture and data modelling.
  - Experience with SQL and/or NoSQL databases.
  - Hands-on experience with Docker and cloud platforms such as
    GCP/Azure.
  - Good understanding of software design principles and system
    design.
  - Strong problem-solving and debugging skills.

  Preferred

  - Experience taking AI/GenAI applications from development to
    production.
  - Exposure to model deployment, monitoring, guardrails and LLM
    application security.
  - Experience in consulting, product or start-up environments.
  - Familiarity with machine learning, data science and large-
    scale data processing.

  Interested candidates can apply with their updated resume.
