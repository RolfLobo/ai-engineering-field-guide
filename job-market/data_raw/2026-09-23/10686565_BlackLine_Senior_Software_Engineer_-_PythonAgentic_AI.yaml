  or mental disability, ancestry, color, marital status,
  sexual orientation, military or veteran status, status as a
  victim of domestic violence, sexual assault or stalking,
  medical condition, genetic information, or any other
  protected class or category recognized by applicable equal
  employment opportunity or other similar laws.

  BlackLine recognizes that the ways we work and the workplace
  itself has shifted. We innovate in a workplace that
  optimizes a combination of virtual and in-person
  interactions to maximize collaboration and nurture our
  culture. Candidates who live within a reasonable commute to
  one of our offices will work in the office at least 3 days a
  week.

  Accommodations:

  BlackLine is committed to creating an inclusive and
  accessible experience for all candidates. If you require a
