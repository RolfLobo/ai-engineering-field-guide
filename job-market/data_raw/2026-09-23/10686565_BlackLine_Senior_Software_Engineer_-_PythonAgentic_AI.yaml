description: |
  Make Your Mark:

  BlackLine¯SaaS is the system of interaction for finance and
  accounting teams and it integrates with numerous ERPs, CRMs,
  Payment systems, Point of Sale systems and other
  applications.     As a Senior AI Engineer, you will play a
  crucial role in building the next generation of BlackLine
  application. You will be driving innovation into our product
  suite by designing, developing, troubleshooting,
  maintaining, optimizing and scaling cloud-based applications
  and services. In addition to being a hands-on engineer, you
  will also lead and mentor other engineers in the team. If
  you have a passion for delivering products that make a
  difference, are driven to make things better in all that you
  do and are eager to work in a collaborative agile
  environment where developers are dedicated to solving
  customer problems and innovating, we would love to talk to
  you.

  You'll Get To:

  - Provide technical expertise in requirements analysis,
    design, effort estimation, development, testing, and
    delivery of highly scalable and secure distributed backend
    and AI-powered services
  - Design, develop, and deploy intelligent agents and AI-driven
    features to enhance our product capabilities.
  - Utilize Python and its ecosystem of libraries to build,
    train, and deploy machine learning models and agentic
    systems.
  - Work with product management, architects, and other
    engineering teams to understand stated and unstated needs
    and turn them into functional and technical requirements.
  - Maintain a strong sense of business value and return on
    investment in planning, design, and communication.
  - Support technical design and architecture discussions and
    help drive technical decisions while making appropriate
    trade-offs on technology, functionality, robustness,
    performance, and extensibility.
  - Estimate the work scope and timelines, and consistently
    deliver on those commitments.
  - Implement, refine, and enforce software development
    techniques to ensure that the delivered features meet
    software integration, performance, security, and
    maintainability expectations.
  - Research, test, benchmark, and evaluate new tools and
    technologies, and recommend ways to implement them in
    product development.
  - Maintain high standards of software quality and technical
    excellence within the team by establishing good practices
    and writing clean, testable, maintainable, and secure
    code.
  - Contribute to a forward-thinking team of developers, acting
    as an agent of change and evangelist for a quality-first
    culture within the organization.
  - Mentor and coach team members to guide them to solutions on
    complex design issues and do peer code reviews.
  - Proactively identify issues, bottlenecks, gaps, or other
    areas of concern or opportunities and work to either
    directly affect change or advocate for that change.
  - Perform critical maintenance, deployment, and release
    support activities, including occasional off-hours
    support.

  What You'll Bring:

  Education: Bachelor's/Master's degree in Computer Science or
  related disciplines.

  - Technical/Specialized Knowledge, Skills, and Abilities:
  - 6+ years of professional experience in building Web scale,
    highly available, multi-tenant SaaS with a focus on
    backend platforms, frameworks, RESTful APIs, and
    microservices.
  - Extensive hands-on experience with Python programming,
    particularly for AI/ML and backend development.
  - 3+ years of active experience in AI/ML projects, with a
    strong focus on developing and implementing agentic AI
    systems, AI Agents, large language models (LLMs), and
    natural language processing (NLP).
  - Proven experience with deep learning frameworks such as
    TensorFlow or PyTorch.
  - 2+ years of experience with a public cloud (AWS, Azure, or
    GCP) and a solid understanding of cloud-native services.
  - Hands-on Experience with C# programming using .NET
    framework/.NET Core is a plus.
  - Extensive experience with SQL, relational database design,
    and SQL query optimization.
  - A solid computer science foundation including data
    structures, algorithms, and design patterns, with a proven
    track record of writing high concurrency, multi-threaded,
    secure, and scalable code.
  - Proven experience in working with one or more services such
    as API gateway, identity management, authentication,
    messaging (Kafka or RabbitMQ), workflow orchestration, job
    scheduling, and search.
  - Superior analytical, problem-solving, and system-level
    performance analysis abilities.
  - Excellent written and verbal communication skills.Adaptable
    team player with strong collaboration skills and a focus
    on results and value delivery.
  - Experience working in an Agile development environment.
  - Passion for engineering excellence through automation, unit
    testing, and process improvements.

  We’re Even More Excited If You Have:

  - Experience with public cloud architectures (Azure, ASW or
    GCP) and cloud native services.
  - Experience designing and scaling high performance systems.
  - Experience with API gateway, identity management,
    authentication, messaging platforms (e.g: Kafka, SQS,
    RabbitMQ), workflow orchestration tools, job scheduling
    and search.

  Thrive at BlackLine Because You Are Joining:

  - A technology-based company with a sense of adventure and a
    vision for the future. Every door at BlackLine is open.
    Just bring your brains, your problem-solving skills, and
    be part of a winning team at the world's most trusted name
    in Finance Automation!
  - A culture that is kind, open, and accepting. It's a place
    where people can embrace what makes them unique, and the
    mix of cultural backgrounds and varying interests
    cultivates diverse thought and perspectives.
  - A culture where BlackLiner's continued growth and learning
    is empowered. BlackLine offers a wide variety of
    professional development seminars and inclusive affinity
    groups to celebrate and support our diversity.

