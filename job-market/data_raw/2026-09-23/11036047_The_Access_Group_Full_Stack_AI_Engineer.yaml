description: |
  We’re looking for people to join the Access family, who
  share our passion for believing in better, and who will help
  us continue to grow.

  Love Work. Love Life. Be You. - is central to our success
  and how we give our customers the freedom to do more of
  what's important to them.

  What does Access offer you? 

  We offer a blended approach to office working, encouraging
  you to collaborate and connect in one of our thriving
  offices. We deliver on what we say, taking the development
  of our people seriously. We’ll work with you to progress
  your success plan and provide opportunities to accelerate
  your career. 

  About you: 

  This is a role with real ownership. Full Stack Engineers in
  the F&B platform are expected to

  ship production software, hold the quality bar, grow the
  engineers around them, and use the

  best tools available — including the use of cutting edge AI
  tools — to deliver excellent

  outcomes for hospitality operators and their guests.

  Day-to-day, you will: 

  - Design, build and ship production software across the F&B
    product portfolio backend services, frontend interfaces,
    APIs and integrations.
  - Own the reliability, performance and quality of the software
    you ship, end-to-end and
  - in production.
  - Partner with product teams across F&B to deliver features
    that create measurable
  - value for operators and their guests.
  - Apply sound engineering principles: clean, testable code;
    CI/CD discipline;
  - observability; and incremental delivery over big-bang
    releases.
  - Treat security and compliance as first-class concerns —
    auth, secrets management,PII handling and access controls
    built in by design, not bolted on.
  - Contribute to architectural decisions across the F&B
    platform, evaluating tools and patterns and feeding
    evidence back into platform-wide choices.
  - Use AI tooling actively in your day-to-day engineering
    workflow — coding assistance,code review, test generation
    and incident triage. The role is designed to be AI-
    augmented and experience here is a strong differentiator.
  - Champion engineering quality standards across the team: code
    review culture,
  - documentation, dependency management and security patching.
  - Contribute to the growth of junior engineers through code
    review, knowledge sharing and day-to-day collaboration

  Your skills and experiences might also include:

  - Commercial software engineering experience with a track
    record of shipping production systems — you understand
    what the AI is generating, can spot when it’s wrong, and
    can work without it when needed.
  - Clean code, automated testing and CI/CD discipline — you own
    what you ship, AI generated or otherwise.
  - Comfortable across the stack — backend, frontend or full-
    stack — and able to use AI to accelerate ramp-up in
    unfamiliar areas.
  - Solid SQL and relational database skills; exposure to cloud-
    hosted databases in a production environment.
  - Experience with RESTful APIs and/or event-driven
    architectures.
  - Familiarity with containerisation (Docker, Kubernetes or
    equivalent)

  Desirable Technologies

  - C# / .NET — backend services, APIs and platform components.
  - TypeScript / React — frontend and web-based ordering and
    management interfaces.
  - Java — present across several F&B product areas.
  - Azure — our primary cloud platform; experience with Azure-
    native services (App
  - Service, Service Bus, SQL, AKS, Key Vault) is valuable.
  - AWS — also present across parts of the F&B portfolio.

  What are we all about? 

  The Access Group is one of the largest UK-headquartered
  business management software providers. It provides
  solutions that empower more than 160,000 small and mid-sized
  organisations in commercial and non-profit sectors across
  Europe, USA and APAC, giving every employee the freedom to
  do more of what's important. Its innovative cloud solutions
  and integrated AI software experience across multiple Access
  products transform how business technology is used.

  With over 9,300 talented individuals driving innovation and
  customer excellence, we’re shaping the future of work. And
  we want you to be part of it. At Access, people are at the
  heart of everything we do. We’re committed to creating an
  inclusive, high-performing culture where everyone feels
  valued, respected, and empowered to thrive. If you’re
  excited about this role - even if your experience doesn’t
  tick every box - you might be exactly who we’re looking for.

  We believe in equality for all and the transformative power
  of diversity. So why not join our vibrant team, where you
  can love what you do, love how you live, and most
  importantly, be authentically you?

  Let’s make a difference together.

  Love Work. Love Life. Be You.
