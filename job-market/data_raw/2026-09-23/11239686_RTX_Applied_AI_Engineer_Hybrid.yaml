  At RTX, the world's largest aerospace and defense company,
  185,000 great minds are united by purpose and inspired to
  make a difference solving the world’s most complex problems.
  With our three market leading businesses, world-class
  operations and investments in research and development, we
  offer capabilities and opportunity no one else can.
  Together, we push the boundaries of known science and find
  new ways to connect and protect our world. Join us and help
  shape the future of aerospace and defense.

  The following position is to join our RTX Enterprise
  Services team:

  We are seeking an experienced Applied AI Engineer to design,
  build, evaluate, and deploy production-grade Artificial
  Intelligence and Machine Learning solutions that address
  complex business and engineering problems across RTX.

  The ideal candidate combines strong software engineering
  fundamentals with hands-on AI/ML expertise and experience
  applying Generative AI, large language models, retrieval,
  and agentic AI to real-world problems. You will work closely
  with business teams, AI Architects, AI Platform Engineers,
  data teams, product teams, and other engineering
  organizations to take AI solutions from early concepts and
  prototypes through production deployment and measurable
  business outcomes. This is a hands-on engineering role for
  someone who understands how AI systems behave, how they
  fail, and how to engineer reliable solutions around them.

  What You Will Do

  - Design, develop, and deploy production-grade AI and ML
    solutions using the appropriate combination of traditional
    machine learning, Generative AI, retrieval-augmented
    generation, agentic AI, and software engineering.
  - Build AI agents and intelligent workflows that reason, use
    tools, interact with enterprise applications and data, and
    execute complex multi-step processes with appropriate
    human oversight.
  - Develop retrieval and context-engineering solutions using
    enterprise data, embeddings, vector and enterprise search,
    knowledge sources, prompts, memory, and other grounding
    techniques.
  - Integrate AI solutions with enterprise applications, APIs,
    data sources, and tools using standard interfaces and
    emerging interoperability approaches such as Model Context
    Protocol (MCP).
  - Evaluate and select models and solution approaches based on
    quality, reliability, latency, cost, security,
    scalability, and business requirements, and develop
    systematic evaluation cases to measure solution
    performance.
  - Develop production-quality software, APIs, integrations,
    tools, and reusable AI components required to deliver end-
    to-end AI solutions while leveraging enterprise platform
    capabilities wherever appropriate.
  - Diagnose and improve AI system behavior using evaluations,
    traces, telemetry, user feedback, and failure analysis,
    and address issues related to groundedness, task
    completion, robustness, and production reliability.
  - Partner with AI Architecture, Platform Engineering, Data,
    Evaluation, Cybersecurity, and business teams to move
    solutions from experimentation into secure, scalable
    production environments.

  What You Will Learn

  - How AI and ML technologies are applied to complex business,
    engineering, manufacturing, and operational challenges
    across a global aerospace and defense enterprise.
  - How Generative AI and agentic AI systems are engineered to
    securely interact with enterprise data, applications,
    APIs, tools, and workflows.
  - How enterprise AI platforms provide reusable capabilities
    for models, agents, tools, identity, deployment,
    evaluation, and observability across multiple RTX business
    units.
  - How to design and evaluate AI systems across commercial
    cloud, hybrid, on-premises, and restricted computing
    environments.
  - How emerging models, agent frameworks, interoperability
    standards, and AI engineering practices can be evaluated
    and applied to practical enterprise problems.
  - How production feedback, evaluation, and operational
    telemetry can be used to continuously improve AI system
    quality and business outcomes.

  Qualifications You Must Have

  - A University Degree in Computer Science, Artificial
    Intelligence, Machine Learning, Engineering, or a related
    STEM discipline and a minimum of 8 years of relevant
    professional experience, or an Advanced Degree in a
    related field and a minimum of 5 years of relevant
    professional experience.
  - A minimum of 3 years of hands-on experience developing,
    integrating, or deploying AI/ML solutions, including
    experience taking AI or ML capabilities beyond
    experimentation into production or production-like
    environments.
  - Software engineering experience, including hands-on
    programming with Python and experience developing
    production-quality, tested, maintainable software.
  - Experience building applications using Generative AI and
    large language models, including prompt or context
    engineering, model integration, structured outputs,
    retrieval, or tool use.
  - Experience integrating software with APIs, databases,
    enterprise applications, cloud services, or other external
    systems.
  - Experience applying software development practices including
    source control, automated testing, CI/CD,
    containerization, and production deployment.
  - Experience working with machine learning fundamentals, model
    evaluation, and the tradeoffs involved in selecting and
    applying AI models to business problems.

  Qualifications We Prefer

  - Experience building production AI agents, agentic workflows,
    or multi-agent systems involving orchestration, tool use,
    state, memory, and human-in-the-loop interaction.
  - Experience with retrieval-augmented generation, embeddings,
    vector databases, enterprise search, knowledge graphs, or
    advanced context-engineering techniques.
  - Experience with AI frameworks or platforms such as
    LangGraph, CrewAI, IBM watsonx, AWS Bedrock, Microsoft AI
    platforms, n8n, or similar technologies.
  - Experience with MCP, function or tool calling, secure
    enterprise integrations, or other agent interoperability
    patterns.
  - Experience developing AI evaluation frameworks or using
    evaluation, tracing, observability, guardrails, and
    production monitoring to improve AI system quality.
  - Experience with traditional machine learning, model serving,
    model lifecycle management, MLOps, or production ML
    systems.
  - Experience deploying AI solutions using cloud-native
    technologies such as Docker, Kubernetes, public cloud
    services, or hybrid and on-premises environments and
    familiarity with AI security, Responsible AI, privacy,
    governance, and the challenges of deploying AI within
    aerospace, defense, manufacturing, engineering, or other
    regulated environments.
  - Demonstrated ability to independently solve complex
    technical problems, collaborate across multidisciplinary
    teams, and communicate technical concepts and tradeoffs
    effectively.

  What We Offer

  Whether you’re just starting out on your career journey or
  are an experienced professional, we offer a robust total
  rewards package with compensation; healthcare, wellness,
  retirement and work/life benefits; career development and
  recognition programs. Some of the benefits we offer include
  parental (including paternal) leave, flexible work
  schedules, achievement awards, educational assistance and
  child/adult backup care.

  Learn More & Apply Now!

