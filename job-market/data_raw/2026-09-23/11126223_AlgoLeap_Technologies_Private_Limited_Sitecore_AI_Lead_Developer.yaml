  Job Summary

  We are seeking a highly experienced Sitecore AI Lead
  Developer / Architect to drive the design, architecture,
  implementation, and adoption of AI-powered digital
  experience solutions using the Sitecore ecosystem.

  The ideal candidate will possess deep expertise in
  traditional Sitecore implementations as well as emerging
  Sitecore AI capabilities. This role requires a hands-on
  technical leader who can architect enterprise solutions,
  lead migrations from legacy Sitecore platforms to Sitecore
  AI-enabled platforms, guide development teams, and actively
  contribute to daily development and support activities.

  The candidate should be passionate about learning emerging
  AI technologies, mentoring engineering teams, and driving AI
  adoption across the organization.

  Key Responsibilities

  - Define
       the overall architecture and technical roadmap for
  Sitecore AI initiatives.
  - Design,
       develop, and support enterprise-scale Sitecore
  applications and digital experience solutions.
  - Lead
       migration and modernization programs from traditional
  Sitecore implementations (XP/XM) to Sitecore AI-enabled
  platforms and XM Cloud.
  - Implement
       AI-driven personalization, search, content generation,
  content optimization, and customer engagement capabilities.
  - Architect
       scalable and secure solutions using Sitecore AI,
  Sitecore Search, Personalize, Content Hub, Connect,
  Experience Edge and Generative AI technologies.
  - Implement
       and manage Sitecore Content Serialization (SCS) for
  source control and deployment automation.
  - Design
       and optimize Coveo Search and Sitecore Search solutions
  for improved relevance, discoverability, and user
  experience.
  - Develop
       headless solutions using Sitecore JSS, React, Next.js,
  and modern composable architecture patterns.
  - Design
       and integrate REST APIs, Microservices, AI services,
  and cloud-native solutions.
  - Establish
       engineering best practices for security, scalability,
  performance, observability, and DevOps.
  - Act
       as a technical mentor and coach for development teams.
  - Conduct
       knowledge-sharing sessions and train engineers on
  Sitecore AI capabilities, architecture patterns, and
  implementation best practices.
  - Stay
       current with new Sitecore AI releases and evaluate
  their applicability to business use cases.
  - Provide
       hands-on support for production issues, enhancements,
  and ongoing development activities.

