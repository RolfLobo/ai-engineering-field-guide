description: |
  Experience: 7+ years

  Location: Chennai, India (work from office)

  Shift: US Eastern overlap, approximately 1:00 PM to 10:00 PM
  IST

  Skills: Databricks or AI/Claude or GCP Big Query

  About the role

  We are building a three-person engineering team to deliver
  intelligent automation and analytics. The work spans AI-
  powered workflow automation, data pipelines and alerting.

  Each engineer joins anchored in the track they are strongest
  in. Over time you will work across the others through
  pairing, shared code review and rotating work, so this is a
  role where you grow beyond the specialization you arrive
  with.

  The two tracks

  - AI engineering Building with LLM APIs and SDKs such as
    Claude, OpenAI or Gemini, including prompt design, tool
    calling, RAG or Agentic patterns, and shipping AI features
    into production
  - Data engineering Building and scaling pipelines on platforms
    such as Databricks, Spark, Snowflake, Airflow or dbt,
    including data modelling, transformation and
    orchestration.

  What you will do

  - Build automation that replaces manual operational work
  - Develop pipelines and analytics logic that surface
    actionable insights
  - Ship AI features into production and integrate them with
    internal tools
  - Build alerting and anomaly detection
  - Document your work clearly and share knowledge across the
    team
  - Work with business stakeholders to map manual processes and
    automate them

  Essential

  - 7+ years in software, data or platform engineering
  - Strong API and data handling experience
  - Depth in at least one of the three tracks above (e.g
    Databricks or AI/Claude or GCP Big Query)
  - Track record of delivering production systems, not just
    prototypes
  - Genuine interest in working across tracks over time
  - Strong communication skills, written and verbal

  Requirements
