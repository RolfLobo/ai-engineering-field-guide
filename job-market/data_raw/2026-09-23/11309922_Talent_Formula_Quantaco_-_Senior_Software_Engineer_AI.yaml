description: |
  Quantaco is an Australian company that combines bespoke
  technology and hospitality-focused expertise to deliver
  innovative, tech-enabled accounting services to clients in
  the Hospitality sector in Australia.

  About the Team & Role:

  At Quantaco, we deliver state-of-the-art predictive
  financial data services for the Australian hospitality
  industry. We are the eighth-fastest growing company in
  Australia as judged by Australia's flagship financial
  newspaper, Australian Financial Review in 2022 and we are
  accelerating through hyper-automation. Our people are
  thought leaders in the business and provide significant
  input into the design and direction of our technology. Our
  roles are not singular in their focus. You will develop new
  data models and predictive models, ensure pipelines are
  fully automated and run with have bullet-proof reliability.

  We are a friendly and collaborative team. We work using a
  mature, design-first development process, focused on
  delivering new features to enhance our customer's
  experience. You'll always be learning at Quantaco. The role
  will allow you to grow into a leaders as we scale our
  technical operations in Hyderabad.

  Culture and Values:

  Quantaco is a happy and diverse group of professionals who
  value a strong worth ethic, authenticity, creativity, and
  flexibility. We support and work hard for each other and for
  our customers, having fun along the way. If you've got a
  passion for creating new and impactful technology and want
  to realise your potential in a team that values your ideas,
  then we want to hear from you.

  Role outline:

  We are seeking an experienced Full Stack Engineer with
  strong expertise in Python (Django), FastAPI and React, and
  a solid background in building AI-driven applications.

  The ideal candidate will design, develop, and enhance
  products supporting accounting and finance operations,
  ensuring high performance, scalability, and seamless
  integration with existing systems.

  Key responsibilities:

  - Full Stack Development
    - Design and develop scalable web applications using Django
      (backend) and React (frontend)
    - Build clean, maintainable, and efficient code across the
      full stack
    - Develop responsive, user-friendly interfaces
    - Ensure high performance and responsiveness of applications
  - Backend Development
    - Develop and maintain robust APIs using Python and Django
    - Design database schemas and manage data effectively
    - Implement business logic and ensure data integrity
    - Optimise backend performance and scalability
  - Frontend Development
    - Build modern, responsive UIs using React
    - Work with state management and component-based architecture
    - Integrate frontend applications with backend APIs
    - Ensure cross-browser compatibility and performance
  - System Integration
    - Integrate applications with third-party services and APIs
    - Collaborate with internal teams to ensure seamless system
      integration
    - Maintain and improve existing systems and workflows
  - Performance & Optimisation
    - Identify bottlenecks and improve system performance
    - Ensure applications are scalable and efficient
    - Monitor and troubleshoot issues in production environments
  - Error Handling & Reliability
    - Implement proper error handling and logging
    - Ensure system stability and reliability
    - Handle edge cases and unexpected system behaviour
  - Continuous Improvement
    - Maintain and enhance existing applications
    - Stay up to date with modern development practices and
      technologies
    - Contribute to improving development processes and standards.

  Personal attributes:

    - You are organised and a fast learner
    - Expertise in prompt engineering to optimize LLM performance
      and accuracy.
    - Proficient in using Google Cloud's Vertex AI for model
      building, deployment, and management.
    - Strong Python programming skills, especially in AI and
      machine learning development.
    - Experienced in using Django for developing and deploying web
      applications with AI integration.
    - Skilled in integrating AI and machine learning models into
      existing software systems.
    - Strong analytical and problem-solving abilities for AI model
      integration and optimization.
    - Effective communication and collaboration skills with cross-
      functional teams.
    - Commitment to continuous learning and staying updated on AI
      advancements.

  Skills, knowledge and experience:

  - Core Engineering
    - Strong proficiency in Python
    - Strong experience with Django (or similar backend
      frameworks)
    - Strong experience with React
    - Experience building and consuming RESTful APIs
    - Solid understanding of full stack architecture
  - Frontend
    - Strong knowledge of JavaScript, HTML, and CSS
    - Experience with modern frontend tooling and frameworks
    - Understanding of responsive design principles
  - Backend & Databases
    - Experience with relational databases (e.g. PostgreSQL,
      MySQL)
    - Understanding of ORM frameworks (Django ORM preferred)
    - Experience designing efficient data models
  - Cloud & DevOps
    - Familiarity with cloud platforms such as Google, AWS, or
      Azure
    - Experience with deployment, CI/CD pipelines, and version
      control (Git)
  - Best Practices
    - Knowledge of security and data protection best practices
    - Writing clean, maintainable, and testable code
    - Experience debugging and troubleshooting production issues
