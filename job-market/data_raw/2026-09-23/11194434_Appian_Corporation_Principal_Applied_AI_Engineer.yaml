description: |
  Here at Appian, our values of Intensity and Excellence
  define who we are. We set high standards and live up to
  them, ensuring that everything we do is done with care and
  quality. We approach every challenge with ambition and
  commitment, holding ourselves and each other accountable to
  achieve the best results. When you join Appian, you’ll be
  part of a passionate team dedicated to accomplishing hard
  things, together.

  Principal Applied AI Engineer

  Location: Remote (US)

  Lead the engineering of software that matters — driving AI
  automation for the world's largest enterprises.



  ABOUT THE TEAM

  Appian Engineering spans the full depth of our platform:
  from the foundational layers that power enterprise scale, to
  the AI capabilities redefining what automation can do. We
  operate in a highly collaborative, fast-paced environment
  focused on technical precision, continuous learning, and
  high code quality. By joining our team, you will solve real-
  world problems that directly shape how Appian delivers our
  AI-Powered Process Automation platform to enterprises around
  the world.

  THE OPPORTUNITY

  As a Principal Applied AI Engineer, you will serve as the
  technical linchpin for applied AI on the team, bringing deep
  hands-on expertise in designing and operating production LLM
  systems and a track record of influencing engineering
  direction beyond your immediate scope. Equipped with
  cutting-edge AI tooling, you will drive the design and
  delivery of high-complexity AI systems — spanning code
  generation, agents, retrieval, structured generation, tool
  use, model routing, evaluation, and observability — set the
  technical bar for the team, and lead other engineers towards
  solutions of real complexity to ensure flawless Enterprise-
  Grade Orchestration.

  WHAT YOU'LL DO

  - Develop Clean Software: Architect, build, and optimize high-
    performance production LLM systems while maintaining a
    strong personal technical presence on the team.
  - Lead Platform Modernization: Spearhead strategic
    technological changes and champion code refactoring
    efforts to keep the core Appian codebase — and the AI
    systems built on it — cutting-edge, modern, and
    performant.
  - Engineer with AI: Use AI coding tools fluently as a force
    multiplier: generating, reviewing, and critically
    evaluating AI-assisted code to ship faster without
    compromising quality or correctness.
  - Lead Architecture & Delivery: Drive technical story
    breakdowns, acceptance criteria, and architectural design
    across complex, multi-tier and AI-powered application
    layers — from feature scoping through implementation.
    Build prototypes to de-risk novel AI approaches and
    establish the standards others build on.
  - Optimize Performance & Scale: Manage product availability,
    latency, scalability, and efficiency by engineering deep
    reliability into our core software systems and performing
    advanced system tuning.
  - Drive Engineering Excellence: Radiate development best
    practices across the department, perform meticulous code
    reviews on design and implementation, and build automation
    frameworks to prevent problem recurrence.
  - Lead & Grow Engineers: Actively coach and mentor engineers
    at multiple levels, identify and close skill gaps on the
    team, and take ownership of accelerating the technical
    growth of those around you.
  - Influence Technical Documentation: Share your expert domain
    knowledge regularly across the department, building a
    reputation as a vital resource and publishing high-quality
    content to Engineering’s permanent documentation site.

  REQUIRED QUALIFICATIONS

  - Education: Minimum of a Bachelor of Science degree in
    Computer Science or a related technical/analytical
    discipline. (Equivalent experience is not accepted in lieu
    of a degree).
  - Experience: 10+ years of relevant software development
    experience with a BS (or 8+ years of experience paired
    with a Master of Science in Computer Science or related
    field).
  - Production LLM Systems: Deep hands-on experience designing
    and operating production LLM systems.
  - AI Systems Expertise: Demonstrated expertise across code
    generation, agents, retrieval, structured generation, tool
    use, model routing, evaluation, and observability.
  - AI-Augmented Development: Demonstrated experience using AI
    coding assistants and a strong ability to evaluate, coach
    others on, and selectively apply AI-generated code in a
    production engineering context.
  - Domain Expertise: Strong distributed-systems, API, security,
    and reliability foundations, with the ability to
    contribute meaningfully at a senior individual contributor
    level within that space.
  - Cross-Team Influence: Demonstrated ability to drive
    technical decisions and shape engineering practices beyond
    a single team or project scope.
  - Production Mastery: Proven experience developing,
    optimizing, and maintaining a high-volume, mission-
    critical production service environment.
  - Communication & Alignment: Exceptional ability to
    communicate highly technical architectures verbally,
    visually, and in writing to diverse engineering audiences.

  PREFERRED QUALIFICATIONS

  - Compilers & Program Analysis: Experience with compilers,
    program analysis, formal or executable specifications, or
    legacy modernization is strongly preferred.
  - We value experience with enterprise platforms such as
    Salesforce or ServiceNow, as these skills translate well
    into our Enterprise-Grade Orchestration environment.

  The base salary range represents a good faith and reasonable
  estimate of the range at the time of posting. Actual
  compensation will be dependent on a number of factors
  including, but not limited to, the candidate’s relevant work
  experience, qualifications, internal peer equity, and market
  and business conditions that exist when extending an offer.
  A discretionary bonus may be awarded in recognition of
  individual and company performance.

  In addition, Appian provides generous benefits offerings
  that include a 401(k) plan with company match, flexible time
  off, paid parental leave, medical, dental, and vision plans,
  life insurance, disability insurance, wellness programs,
  flexible spending accounts, health savings account
  contributions, an employee referral bonus program, and
  learning and development resources. Certain positions may be
  eligible for equity awards.

  Pay and benefits are subject to change at any time,
  consistent with the terms of any applicable compensation,
  commission, bonus, or benefit plans.

  Base Salary Range

  $200,000—$350,000 USD

  Tools and Resources

  - Training and Development: During onboarding, we focus on
    equipping new hires with the skills and knowledge for
    success through department-specific training. Continuous
    learning is a central focus at Appian, with dedicated
    mentorship and the First-Friend program being widely
    utilized resources for new hires.
  - Growth Opportunities: Appian provides a diverse array of
    growth and development opportunities, including our
    leadership program tailored for new and aspiring managers,
    a comprehensive library of specialized department training
    through Appian University, skills based training, and
    tuition reimbursement for those aiming to advance their
    education. This commitment ensures that employees have
    access to a holistic range of development opportunities.
  - Community: We’ll immerse you into our community rooted in
    respect starting on day one. Appian fosters inclusivity
    through our 8 employee-led affinity groups. These groups
    help employees build stronger internal and external
    networks by planning social, educational, and outreach
    activities to connect with Appianites and larger
    initiatives throughout the company.

  Benefits

  Appian offers a comprehensive benefits package designed to
  support your health, wellbeing, and financial future.
  Benefits may include health coverage, Employee Assistance
  Program (EAP) with free mental health support, life and
  disability insurance, an Employee Stock Purchase Program
  (ESPP), a retirement/pension plan, wellness dollars, tuition
  reimbursement, family-forming benefits and more. Benefits
  vary by country—please ask your Talent Acquisition contact
  for details specific to the location you are applying to.

  About Appian

  Appian provides AI automation for the most important
  business processes at the world’s largest organizations. Our
  platform is known for its unique power, reliability, and
  scale. We’ve been automating processes for more than 25
  years and understand enterprise operations like no one else.
  For more information, visit appian.com.

  Follow Appian: LinkedIn, YouTube, Instagram, Facebook, and
  X.

