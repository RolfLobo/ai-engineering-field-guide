  RSW-P3-12

  AI Accelerated Applications Engineer



  Location: Cambridge, Hybrid

  Department: Information Technology - Data and AI

  Job type: Permanent, Full-time



  Join us and make a difference when it matters most!

  At Mundipharma, we are proud of the work we do to bring
  innovative treatments to patients. We challenge ourselves
  constantly to deliver more for patients, healthcare
  professionals, our partners, and our employees.



  The Team

  You will be joining our Data & AI team during an exciting
  transition from business analytics into cutting-edge GenAI
  application delivery. We are a stable, supportive team that
  prioritizes curiosity, hands-on learning, and an
  entrepreneurial mindset over decades of experience. Working
  closely alongside senior leaders and tech experts across the
  business, you’ll have plenty of room to develop your skills,
  experiment with emerging tech, and grow your career while
  building real-world AI solutions.



  Job Purpose



  This role covers the design, delivery, engineering and
  support of AI applications and agents. It has a strong focus
  on AI both in terms of the tools and techniques used to
  deliver solutions and embedding AI in those solutions.



  The role is required to stay abreast of the developments in
  the field while maintaining control of the portfolio of
  technologies required to support and deliver solutions.

  The role will require great team cooperation and business
  analysis skills and to form tight and effective
  relationships within IT and with our customer base.



  Role and Responsibilities

  - Collaborate on requirement definitions with Customers, and
    Business Partners leveraging AI where beneficial to add
    value and improve processes / workflows / systems etc.

  - Design of software, AI, BI and Data Integration solutions
    which result in High- and Low-Level Documents and test
    plans. Ensure designs deliver maintainable solutions which
    comply with our technical strategies, architecture
    principles, “definition of done”, change management and
    compliance frameworks. Operational monitoring, after-care
    and contribution to continual service improvement.

  - Managing contracted workers and third parties and ensuring
    that delivery is in accordance with LLD and architecture
    principles.

  - Governance of applications and automations to ensure they
    align with Mundipharma standards, are supportable and fit
    for purpose

  - Research, assess and justify new tools and solutions to
    fulfil business and IT needs, where requirements need an
    innovative design with emerging technologies. Provide
    advice on technical strategy, the role will have a
    specific focus on technical excellence, architecture and
    lifecycle.

  - Assess internal processes, architecture and solutions for
    simplification and develop data and AI solutions with a
    view to increasing efficiency and reducing support
    overheads.[Text Wrapping Break]



  What you’ll bring

  - AI-Accelerated Development: Around 2+ years of software
    delivery experience, with hands-on practice using AI
    coding tools (e.g., GitHub Copilot, Claude Code, Cursor)
    to write, review, and refactor production-ready code.

  - Agentic AI & Automation: Exposure to developing AI agents,
    harnesses, or workflows (e.g., via Copilot Studio, AI
    Foundry, or similar frameworks).

  - Azure Application Stack: Practical experience deploying
    applications, web portals, or containerized apps within an
    Azure environment (using Azure Functions, Logic Apps, or
    DevOps).

  - Core Engineering Foundations: Solid grasp of modern
    programming languages (such as Python, JavaScript,
    TypeScript, or SQL) and source control (GitHub).

  - Stakeholder Communication: Strong interpersonal skills with
    the confidence to articulate technical concepts, present
    ideas, and engage directly with senior business leaders.

  - Curiosity & Drive: A genuine passion for emerging
    tech—you’re the type of person who loves experimenting,
    learning new frameworks, or building side projects in your
    spare time.



  (Bonus: Experience or familiarity with GxP/GDPR or the
  Pharmaceutical industry is a nice-to-have, but certainly not
  a dealbreaker!)



  What we offer in return

  - Flexible benefits package

  - Opportunities for learning & development through our varied
    programme

  - Collaborative, inclusive work environment



  Diversity and inclusion

  Building an inclusive environment where people can thrive,
  grow and achieve their full potential is a priority. We
  believe this isn’t just the right thing, but also the smart
  thing to do. We are on a journey and will seek to move
  forward together through education and awareness to build a
  culture that welcomes and celebrates diversity and
  uniqueness. We will create a workplace environment where
  everyone can, every day, bring their authentic selves and is
  treated with dignity and respect.



  About Mundipharma



  Mundipharma is a global healthcare company focussing on
  customers across Africa, Asia Pacific, Canada, Europe, Latin
  America, and the Middle East.

  Mundipharma is dedicated to bringing innovative treatments
  to patients in the areas of pain management, infectious
  disease as well as other severe and debilitating disease
  areas. Their guiding principles, centered around Integrity
  and Patient-Centricity, are at the heart of everything they
  do. For more information visit www.mundipharma.com.



  Join our talent pool



  If you’re not sure this role is right for you but you’re
  keen to hear about future opportunities at Mundipharma, join
  our talent community and be the first to hear about new
  roles.

