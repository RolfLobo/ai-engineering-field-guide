description: |
  ROLE SUMMARY Own the orchestration layer and agent
  architecture behind the Innovation, Data & Analytics team's
  AI-based workflows, building and hardening agentic systems
  that translate analytical methodology into reliable
  production tools. ROLE RESPONSIBILITIES Agentic Systems
  Design & Build

  - Own orchestration frameworks and agent architecture for AI-
    based workflows
  - Build and harden agentic workflows for production use
  - Design prompt architecture and tool/API integrations across
    agentic systems
  - Translate the Senior Data Scientist's methodology and
    evaluation criteria into deployed, production-grade agents

  Production Reliability & Collaboration

  - Partner with the Data Engineer to ensure agents consume
    clean, well-structured data
  - Partner with the Senior Data Analyst to ensure agentic
    workflows meet governance, audit, and compliance
    requirements
  - Implement monitoring, evaluation, and cost controls for LLM-
    based systems in production
  - Document agent architecture, prompt design, and tool
    integrations to support governance and audit needs
  - Proactively identify opportunities to improve workflow
    reliability, latency, and cost

  BASIC QUALIFICATIONS Candidate demonstrates strong technical
  execution and the ability to operate independently in a
  fast-paced, regulated environment, partnering effectively
  across data science, data engineering, and governance
  functions.

  - Degree in Computer Science, Software Engineering, Machine
    Learning, or a related field
  - Experience (8+ years with Bachelor's; 7+ years with
    Master's) in software or ML engineering, notably in the
    healthcare/pharma sector
  - Experience with agentic frameworks (e.g., LangGraph,
    Pydantic AI, or similar)
  - Strong software engineering background, including production
    system design and testing
  - Experience integrating LLM APIs and exposure to MLOps
    practices (evaluation, monitoring, cost control)
  - Healthcare data experience preferred
  - Effective English verbal and written communication with
    flexibility to be clear, consistent, compliant, and
    appropriate for a variety of settings including
    scientific/technical, regulatory, and business audiences

  Technical:

  - Anticipates Customer and Market Needs - Knows the industry
    and technology landscape; is dedicated to meeting the
    expectations of internal and external customers; always
    focused on patient safety first.
  - Acts Decisively - Makes timely and effective engineering
    decisions; acts with urgency and removes barriers that
    hinder productivity.
  - Builds Change-Agile Systems - Designs agentic systems that
    are flexible and adaptive to evolving business needs.
  - Strategic and Innovative Thinking - Demonstrates insightful
    thinking by developing creative approaches to agentic
    system design.
  - Is a role model of Pfizer's values and behaviors.

  Demonstrate ability to:

  - Drive transformational change
  - Engage diverse technical and business stakeholders
  - Understand the applications of technology to the Life
    Science sector

  Other Job Details:

  - Last Date to Apply for Job: September 23rd, 2026.
  - Locations: NYHQ or PA-Collegeville or MA-Cambridge or CT-
    Groton or Europe any Pfizer site or QC - Montreal
  - NOT Eligible for Relocation Package
  - Position is hybrid and will require to work 2 to 3 days per
    week on site

