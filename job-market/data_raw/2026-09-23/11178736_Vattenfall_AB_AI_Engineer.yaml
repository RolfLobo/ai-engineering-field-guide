description: |
  Company Description

  Vattenfall is a European energy company with approximately
  21 000 employees. For more than 100 years we have
  electrified industries, supplied energy to people’s homes
  and modernized our way of living through innovation and
  cooperation. We are looking for talented individuals who, in
  addition to their passion for their own role, also have
  strong team spirit and want to contribute to supporting a
  meaningful corporate mission.

  Business Area IT We design and build the digital backbone
  that moves Vattenfall forward — from modern infrastructure
  to large-scale digital transformation initiatives. We
  connect people, processes and technology while enabling
  automation, innovation and an intuitive user experience. By
  doing so, we create a smart and connected organisation that
  is ready for tomorrow's energy transition.

  Job Description

  Do you want to build AI solutions that empower thousands of
  employees across Europe?

  There is a way to shape the future of AI while contributing
  to one of Europe's largest energy companies. As an AI
  Engineer within Digital Platform Enablement, you will help
  create the intelligent services, platforms and digital
  capabilities that enable colleagues across Vattenfall to
  work smarter, find information faster and unlock new
  business value.

  What will you do?

  Artificial Intelligence is rapidly transforming how
  organizations operate. In Digital Platform Enablement, we
  are building enterprise-scale AI capabilities that help
  colleagues discover knowledge, automate processes and make
  better decisions every day.

  As an AI Engineer, you will work alongside software
  engineers, architects, data specialists, business
  stakeholders and Microsoft experts to develop the next
  generation of AI-powered solutions. Your work will
  contribute directly to Vattenfall's digital transformation
  and support our ambition to create sustainable business
  value through technology.

  Your tasks and responsibilies:

  - Designing, developing and maintaining production-grade AI
    applications and services running on Microsoft Azure
  - Building Retrieval Augmented Generation (RAG) solutions,
    enterprise search capabilities and intelligent knowledge
    discovery platforms
  - Developing APIs and integrations connecting AI solutions
    with platforms such as SharePoint, ServiceNow, HR systems
    and internal data services
  - Evaluating, connecting and onboarding enterprise data
    sources for AI consumption
  - Developing AI agents and automation capabilities that
    simplify work and improve employee experiences
  - Contributing to AI architecture, governance, platform
    enablement and best practices across Vattenfall
  - Conducting proofs of concept and assess emerging AI
    technologies, frameworks and engineering approaches
  - Collaborating closely with business stakeholders to
    translate opportunities into scalable and secure solutions
  - Influencing future platform choices and strategic decisions
    regarding enterprise AI adoption

  Location

  Amsterdam

  Qualifications

  Your profile

  You enjoy turning complex challenges into practical
  solutions and are curious about how new technologies can
  create measurable value. You combine strong software
  engineering skills with a genuine interest in AI, cloud
  platforms and enterprise environments.

  We believe you will thrive in this role if you bring:

  - A Master's degree in Computer Science, Artificial
    Intelligence, Data Science, Machine Learning or a related
    discipline
  - Solid experience in software engineering, preferably using
    Python
  - Experience developing cloud-native applications and services
  - Understanding of machine learning concepts and modern AI
    technologies
  - Experience working with APIs, integrations and distributed
    systems
  - Strong communication skills and the ability to work together
    with both technical and non-technical stakeholders
  - A careful and structured approach to problem solving and
    solution design
  - Curiosity, learning agility and enthusiasm for exploring
    emerging technologies

  It is considered an advantage if you have experience with:

  - Microsoft Azure and Azure AI services
  - Large Language Models (LLMs) and Generative AI
  - Retrieval Augmented Generation (RAG) architectures
  - LangChain and LangGraph
  - Databricks and modern data platforms
  - CI/CD pipelines, automated testing and Infrastructure as
    Code
  - Enterprise search, knowledge management and information
    governance

  Technologies you will be working with:

  AI & Machine Learning

  - Large Language Models (LLMs)
  - Retrieval Augmented Generation (RAG)
  - LangChain
  - LangGraph
  - Prompt Engineering
  - AI evaluation frameworks and quality assessment

  Software Engineering

  - Python
  - FastAPI
  - Quart
  - Pydantic
  - Pytest
  - REST APIs

  Cloud & Platforms

  - Microsoft Azure
  - Azure AI Services
  - Azure Storage
  - Azure Key Vault
  - Azure Identity Services
  - Databricks
  - PostgreSQL

  DevOps & Engineering Excellence

  - GitHub
  - GitHub Copilot
  - CI/CD Pipelines
  - Automated Testing
  - Infrastructure as Code

  Additional Information

  Our offer  A challenging and independent job in an informal,
  dynamic working environment. You can play a part in shaping
  the future of a company where the only constant is change.
  Besides being a challenging and inspiring place to work, we
  value a great work atmosphere!

  At Vattenfall, we are convinced that striving for diversity
  helps building a more profitable efficient and attractive
  company. Therefore we seek a harmonious balance of employees
  in terms of gender, age, and ethnic and cultural
  backgrounds. We believe in work life balance and the
  flexibility to work from home.

  More Information  This position is primarily intended for
  internal candidates within Vattenfall. In case of equal
  qualifications, preference will be given to colleagues from
  Business Unit IT (YI). We value internal growth and
  encourage you to apply.”

  We welcome your application in English, no later than, 28th
  of September 2026. We kindly request that you do not send
  applications by any means other than via our website as we
  cannot guarantee that we will be able to process
  applications that are not made via our website.

  For more information about the role, please contact the
  Hiring Manager Matthias Krüger:
  matthias.krueger@vattenfall.de for more information about
  the recruitment process you are welcome to contact our
  Recruiter Marius Gläßge (marius.glaessge@vattenfall.de).

  Trade union representatives in Sweden (IT) are Sofi Wadström
  (Akademikerna), Patricia Ek (Unionen), Christer Gustafsson
  (Ledarna), Juha Siipilehto (SEKO). To get in contact with
  the representatives, please call Vattenfall´s switchboard
  +46 8 739 50 00.

  At Vattenfall we are convinced that diversity contributes to
  build a more profitable and attractive company and we strive
  to be good role model regarding diversity. Vattenfall works
  actively for all employees to have the same opportunities
  and rights regardless of gender, ethnicity, age, transgender
  identity or expression, religion or other belief, disability
  or sexual orientation.

  The security of Vattenfall and its employees is essential.
  For that reason, a pre-employment screening will be part of
  your recruitment process. The screening is based on the role
  you will fulfill within Vattenfall. The screening will be
  performed by a third party, DISA.

  We look forward to receiving your application!
