description: |
  About Truelogic

  At Truelogic we are a leading provider of nearshore staff
  augmentation services headquartered in New York. For over
  two decades, we’ve been delivering top-tier technology
  solutions to companies of all sizes, from innovative
  startups to industry leaders, helping them achieve their
  digital transformation goals.

  Our team of 600+ highly skilled tech professionals, based in
  Latin America, drives digital disruption by partnering with
  U.S. companies on their most impactful projects. Whether
  collaborating with Fortune 500 giants or scaling startups,
  we deliver results that make a difference.

  By applying for this position, you’re taking the first step
  in joining a dynamic team that values your expertise and
  aspirations. We aim to align your skills with opportunities
  that foster exceptional career growth and success while
  contributing to transformative projects that shape the
  future.

  Our Client

  A VC-backed, early-stage B2B SaaS startup building an AI-
  native financial system to modernize bookkeeping, reporting,
  and payroll for growing companies.

  Job Summary

  As a Founding Product Engineer, you will take full ownership
  of critical customer problems from inception to deployment,
  building a modern financial system powered by AI agents. You
  will work directly with founders and finance teams to design
  user experiences, architect technical solutions across the
  full stack, and establish the core engineering culture. The
  ideal candidate is a highly autonomous, product-minded
  builder who excels in ambiguous, early-stage environments
  and is eager to ship complex, consequential software that
  directly impacts how businesses operate.

  Responsibilities

  - Talk directly with founders, operators, and finance teams to
    define the right product solutions.
  - Design and build full-stack solutions across frontend,
    backend, AI, data, and external integrations.
  - Develop AI finance agents to automate workflows for
    invoicing, collections, payroll, reporting, and month-end
    close.
  - Architect reliable infrastructure for permissions, audit
    trails, exact financial reconciliation, observability, and
    AI evaluation.
  - Build seamless integrations with banking, accounting,
    payroll, payment, and communication platforms like
    QuickBooks, Plaid, and Stripe.
  - Create intuitive user interfaces that translate complex
    financial data into understandable insights for business
    owners.
  - Ship work to production rapidly, observe customer usage, and
    iterate based on real-world feedback.
  - Help establish and shape the company’s foundational
    engineering culture, architecture, and product standards.



  Qualifications and Job Requirements

  - 3+ years of professional software engineering experience
    with a proven track record of shipping real products to
    production.
  - Proven ability to work across the frontend and backend,
    ideally with experience in React, TypeScript, Python,
    FastAPI, and PostgreSQL.
  - Strong product sense with the ability to move seamlessly
    between strategic product thinking and rigorous technical
    implementation.
  - High degree of curiosity and discipline to learn complex,
    rules-heavy domains like financial systems and accounting.
  - Excellent communication skills to challenge ideas
    constructively and collaborate directly with founders and
    early customers.
  - Experience building AI agents, production LLM applications,
    or working with Model Context Protocol (MCP) is a plus.
  - Background in fintech, accounting, payments, banking, or
    building financial data pipelines is preferred.
  - Previous experience owning a product area at an early-stage
    startup is highly preferred.
  - Experience designing APIs, distributed workflows, and
    systems where security, auditability, and absolute
    correctness matter is a strong plus.

  What We Offer

  - 100% Remote Work: Enjoy the freedom to work from the
    location that helps you thrive. All it takes is a laptop
    and a reliable internet connection.
  - Highly Competitive USD Pay: Earn an excellent, market-
    leading compensation in USD, that goes beyond typical
    market offerings.
  - Paid Time Off: We value your well-being. Our paid time off
    policies ensure you have the chance to unwind and recharge
    when needed.
  - Work with Autonomy: Enjoy the freedom to manage your time as
    long as the work gets done. Focus on results, not the
    clock.
  - Work with Top American Companies: Grow your expertise
    working on innovative, high-impact projects with Industry-
    Leading U.S. Companies.

  Why You’ll Like Working Here

  - A Culture That Values You: We prioritize well-being and
    work-life balance, offering engagement activities and
    fostering dynamic teams to ensure you thrive both
    personally and professionally.
  - Diverse, Global Network: Connect with over 600 professionals
    in 25+ countries, expand your network, and collaborate
    with a multicultural team from Latin America.
  - Team Up with Skilled Professionals: Join forces with senior
    talent. All of our team members are seasoned experts,
    ensuring you're working with the best in your field.

  Apply now!
