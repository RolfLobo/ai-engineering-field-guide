description: |
  Your work days are brighter here.

  We’re obsessed with making hard work pay off, for our
  people, our customers, and the world around us. As a Fortune
  500 company and a leading AI platform for managing people,
  money, and agents, we’re shaping the future of work so teams
  can reach their potential and focus on what matters most.
  The minute you join, you’ll feel it. Not just in the
  products we build, but in how we show up for each other. Our
  culture is rooted in integrity, empathy, and shared
  enthusiasm. We’re in this together, tackling big challenges
  with bold ideas and genuine care. We look for curious minds
  and courageous collaborators who bring sun-drenched optimism
  and drive. Whether you're building smarter solutions,
  supporting customers, or creating a space where everyone
  belongs, you’ll do meaningful work with Workmates who’ve got
  your back. In return, we’ll give you the trust to take
  risks, the tools to grow, the skills to develop and the
  support of a company invested in you for the long haul. So,
  if you want to inspire a brighter work day for everyone,
  including yourself, you’ve found a match in Workday, and we
  hope to be a match for you too.

  About the Team

  The Architecture & AI (AAI) organization is the engine
  driving Workday’s growth through architectural thought
  leadership, innovation, and trusted data excellence. Our
  team brings together diverse expertise in data science,
  machine learning, AI strategy, and product management to
  orchestrate a secure, accurate, and accessible data flow
  across the company. We transform complex datasets into
  actionable insights, positioning Workday at the forefront of
  the tech industry. Within AAI, you will join the Data
  Platform Engineering Organization in Business Technology. We
  are the team that turns strategic data goals into reality.
  By building next-generation, highly scalable, self-service
  data platforms and reusable frameworks in the AWS cloud, we
  drastically reduce decision latency and empower data
  engineers, scientists, statisticians, and business partners.

  About the Role

  We are looking for a passionate and hands-on Data Platform
  Engineer to help shape the future of our data ecosystem. In
  this role, you will tackle exciting technical challenges
  through independent research and close collaboration with
  our data engineering teams.

  You will be instrumental in executing the overarching vision
  of our data platform. Drawing on your extensive experience
  delivering big data platforms and scalable pipelines in the
  public cloud, you will actively plan and drive a product
  roadmap that prioritizes efficiency, flexibility, and
  scalability to empower our internal teams.

  Responsibilities

  As a Platform Engineer, your core focus will be building the
  foundational tools, frameworks, and infrastructure that
  empower our teams to operate efficiently and securely.

  As a Platform Engineer, your primary objective will be to
  construct the essential infrastructure, frameworks, and
  tools necessary to enable our teams to function with maximum
  efficiency and security.

  Key Responsibilities

  - Platform & Tooling Development: You will be responsible for
    the design, construction, and testing of scalable cloud
    data platforms. These capabilities will facilitate a self-
    service architecture tailored to empower cross-functional
    teams.
  - Security & Compliance: You will engineer tools designed to
    speed up workflows while strictly enforcing privacy
    protection, lineage, and data security. This applies to
    data both at rest and in transit, ensuring adherence to
    strict regulatory standards including PII, PCI, CCPA, SOX,
    and GDPR.
  - Reliability & Automation: You will boost the reliability of
    the platform by creating and refining internal tools that
    can automatically identify anomalies and data quality
    problems.
  - Technical Documentation: You will play a key role in
    contributing to and reviewing release notes and technical
    documentation. This effort will help guide users, promote
    best practices, and enhance the overall developer
    experience.
  - Strategic Architecture: You will design highly scalable
    solutions based on a profound understanding of our
    instance strategy and technology stack. A strong emphasis
    will be placed on the intelligent reuse of resources and
    alignment with the broader software development lifecycle.
  - Continuous Innovation: You will maintain a position at the
    cutting edge of industry trends. By actively evaluating
    novel packages and tools, you will continually expand the
    platform's capabilities and push boundaries.
  - Global Collaboration: You will engage in effective, seamless
    collaboration with partners and team members distributed
    across various time zones.

  About You

  - 5+ years of experience in the field of data engineering.
  - Strong hands-on experience with modern data stack
    technologies, including deep expertise in leveraging the
    Databricks platform.
  - Proficiency in at least one core programming language
    commonly used in data engineering (e.g., Python, Scala,
    Java), coupled with advanced SQL skills.
  - Extensive experience designing, building, and operating
    large-scale data pipelines in cloud environments (AWS,
    GCP, or Azure), utilizing Terraform for Infrastructure as
    Code (IaC) and GIT for version control and collaborative
    development workflows.
  - Proven track record of leading teams to successfully deliver
    complex, cross-functional data projects from initial
    concept through to production deployment.
  - Solid understanding of data modeling, data architecture, and
    performance optimization strategies for heavy analytical
    workloads.
  - Strong communication and stakeholder management skills,
    demonstrating the ability to distill and explain complex
    technical concepts to non-technical business partners.

  Our Approach to Flexible Work


  With Flex Work, we’re combining the best of both worlds: in-
  person time and remote. Our approach enables our teams to
  deepen connections, maintain a strong community, and do
  their best work. We know that flexibility can take shape in
  many ways, so rather than a number of required days in-
  office each week, we simply spend at least half (50%) of our
  time each quarter in the office or in the field with our
  customers, prospects, and partners (depending on role). This
  means you'll have the freedom to create a flexible schedule
  that caters to your business, team, and personal needs,
  while being intentional to make the most of time spent
  together. Those in our remote "home office" roles also have
  the opportunity to come together in our offices for
  important moments that matter.

