description: |
  Overview

  The Microsoft AI Frameworks team, develops the software,
  performance systems, and engineering tools that
  enable state-of-the-art AI models to run reliably and
  efficiently at cloud scale. We work across model
  architectures, frameworks, compilers, runtimes, libraries,
  observability, benchmarking, and hardware
  platforms—including NVIDIA and AMD GPUs and Microsoft
  silicon. Our Senior Software Engineers partner with model
  developers, researchers, hardware teams, and production
  services to accelerate model onboarding, improve performance
  and reliability, reduce deployment time and hardware
  footprint, and turn performance insights into durable
  platform capabilities. 

  This is a hands-on individual-contributor role for engineers
  who enjoy solving ambiguous, end-to-end systems problems.
  Successful candidates combine strong software engineering
  fundamentals with curiosity about AI workloads, disciplined
  measurement, and a willingness to work across organizational
  boundaries to deliver production impact. 

  As a Senior Software Engineer, you will own significant
  components and projects across AI performance, benchmarking,
  automation, and developer tooling. You will independently
  translate model and platform needs into robust software,
  investigate complex performance and reliability issues, and
  collaborate with partner teams to deliver measurable
  improvements into production.

  At Microsoft, our mission to empower every person and every
  organization on the planet to achieve more guides how we
  partner with customers to deliver trusted, impactful
  solutions. With a growth mindset culture, we innovate
  responsibly and measure success by shared progress people,
  teams, and customers. Join us to do meaningful work that
  changes the world and helps shape what’s next for everyone. 

  Responsibilities

  - Design, implement, test, and operate production-quality
    components across AI frameworks, runtimes, benchmarking
    systems, performance tooling, and service integrations.

  - Benchmark, profile, debug, and optimize large language model
    training and inference workloads across GPUs and Microsoft
    hardware.

  - Build automation and observability that detect regressions,
    improve reproducibility, surface actionable insights, and
    accelerate model and hardware onboarding.

  - Drive scoped projects from problem definition through
    deployment, balancing delivery speed, maintainability,
    reliability, and measurable customer or capacity impact.

  - Partner with researchers, model teams, infrastructure
    owners, and hardware vendors to diagnose cross-stack
    issues and deliver production-ready solutions.

  - Contribute to technical design reviews, engineering
    standards, operational health, and mentoring of other
    engineers.

  - Embody Microsoft’s culture and values.

  Qualifications

  Required/Minimum Qualifications:

  - Bachelor’s Degree in Computer Science or a related technical
    field and 4+ years of technical engineering experience
    coding in languages such as C++, or Python, or equivalent
    experience.

  Other Requirements:

  - Ability to meet Microsoft, customer and/or government
    security screening requirements are required for this
    role. These requirements include but are not limited to
    the following specialized security screenings: Microsoft
    Cloud Background Check: This position will be required to
    pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Additional or Preferred qualifications:

  - Expertise in GPU or equivalent accelerator programming and
    kernel optimization using CUDA, Triton, or comparable
    technologies.

  - Experience using profiling and benchmarking to deliver
    measurable performance improvements, with an understanding
    of memory hierarchy, parallel execution, synchronization,
    and hardware utilization.

  - Familiarity with vLLM, SGLang, or equivalent inference
    frameworks, including their model execution, scheduling,
    batching, and KV-cache mechanisms.

  - Demonstrated technical ownership and cross-team
    collaboration, including independently delivering complex
    engineering changes into production.

  - Ability to use AI-assisted development tools effectively
    while maintaining sound engineering judgment and
    accountability for correctness, performance, and
    maintainability

