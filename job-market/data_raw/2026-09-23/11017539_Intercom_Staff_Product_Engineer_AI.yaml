description: |
  Fin, now part of Salesforce, is on a mission to help
  businesses provide perfect customer experiences.

  Our AI Agent Fin is the highest-performing AI Customer Agent
  on the market today, enabling businesses to deliver
  impeccable, always-on customer support across the customer
  journey, from service, to sales, to ecommerce. Powered by
  our own AI models, Fin resolves complex customer issues end-
  to-end across every channel, with minimal set-up and
  integration. Fin can also be combined with our natively
  integrated Intercom help desk, giving modern support teams
  one single system.

  Together with Salesforce, the #1 AI CRM, where humans with
  agents drive customer success, we're building the future of
  customer experience. Here, ambition meets action. Tech meets
  trust. And innovation isn't a buzzword, it's a way of life.
  The world of work as we know it is changing, and we're
  looking for Trailblazers who are passionate about bettering
  business and the world through AI.

  Ready to level up your career at the company leading
  workforce transformation in the agentic era? You're in the
  right place. Agentforce is the future of AI, and you are the
  future of Salesforce.

  What's the opportunity?

  We’re looking for Staff Product Engineers to join the AI
  Group to build Fin's AI-powered products. Product Engineers
  working in ML work closely with both our ML Scientists and
  product teams. They must deeply understand our product, our
  customers, our ML tech stack and our broader product stack.

  Our group is responsible for defining new ML features,
  researching appropriate algorithms and technologies, and
  rapidly getting first prototypes in our customers’ hands.

  We are an extremely product focussed team. We work in
  partnership with Product and Design functions of teams we
  support. Our team's dedicated Engineers enable us to move to
  production fast, often shipping to beta in weeks after a
  successful offline test.

  We are very passionate about applying machine learning
  technology, and have productized everything from classic
  supervised models, to cutting-edge unsupervised clustering
  algorithms, to novel applications of transformer neural
  networks. We test and measure the real customer impact of
  each model we deploy.

  If you are an experienced product engineer who takes an
  analytical approach to development and has some hands-on
  experience with ML systems, we'd love to hear from you!

  What will I be doing?

  Product Engineers in the AI Group

  - Build the systems that power Fin's flagship AI products.
    This usually means working in our ML Python tech stack,
    but at times also means working across the product on our
    Rails app too.
  - Work alongside our ML Scientists bring proof-of-concept code
    to production; ensuring it’s robust and scalable for real-
    world use.
  - Partner with product teams outside of our group, to shape
    the best AI-powered product experience for our customers..
  - Contribute to all phases of software development including
    ideation, prototyping, and implementation and testing.
  - Play an active role in the hiring, mentoring, and career
    development of other engineers.
  - Raise the bar for technical standards, performance,
    reliability, and operational excellence within the group
    and across Fin.

  Profile we’re looking for

  These are meant to be indicative, not hard requirements.

  - 10+ years of experience shipping high-quality products.
  - No ML experience required. We believe you can be highly
    effective immediately by bringing excellent software
    engineering skills, and learn ML as you work on the team.
  - You can demonstrate significant impact in the work that you
    have done.
  - You take pride in having strong technical fundamentals; you
    love learning and are willing to work hard to invest in
    your development.
  - Deep knowledge of a high-level programming language (for
    example, Ruby, Python, Javascript etc.) but it doesn’t
    need to be a language that we use here!
  - Strong willingness to fight for good outcomes
  - Bias towards progress over perfection
  - BSc in Computer Science, Maths or Statistics or related
    discipline

  Bonus skills & attributes

  - Previous experience in data analytics, or statistical role

  #LI-Hybrid

  Unleash Your Potential

  When you join Salesforce, you’ll be limitless in all areas
  of your life. Our benefits and resources support you to find
  balance and be your best, and our AI agents accelerate your
  impact so you can do your best. Together, we’ll bring the
  power of Agentforce to organizations of all sizes and
  deliver amazing experiences that customers love. Apply today
  to not only shape the future — but to redefine what’s
  possible — for yourself, for AI, and the world.

  In the United States, compensation offered will be
  determined by factors such as location, job level, job-
  related knowledge, skills, and experience. Certain roles may
  be eligible for incentive compensation, equity, and
  benefits. At Fin, we want to give people what they need to
  do the best work of their careers. Our benefits and programs
  are designed to support your health and wellbeing, your
  family, your time away from work, and your financial future.
  Offerings vary by location in line with local practices and
  requirements. Learn more about working at Fin and the
  benefits we offer at fin.ai/careers. Pursuant to the San
  Francisco Fair Chance Ordinance and the Los Angeles Fair
  Chance Initiative for Hiring, Salesforce will consider for
  employment qualified applicants with arrest and conviction
  records.

  Policies

  Fin has a hybrid working policy. We believe that working in
  person helps us stay connected, collaborate easier and
  create a great culture while still providing flexibility to
  work from home. We expect employees to be in the office at
  least three days per week.

  We have a radically open and accepting culture at Fin. We
  avoid spending time on divisive subjects to foster a safe
  and cohesive work environment for everyone. As an
  organization, our policy is to not advocate on behalf of the
  company or our employees on any social or political topics
  out of our internal or external communications. We respect
  personal opinion and expression on these topics on personal
  social platforms on personal time, and do not challenge or
  confront anyone for their views on non-work related topics.
  Our goal is to focus on doing incredible work to achieve our
  goals and unite the company through our core values.

  Salesforce is an equal opportunity employer and maintains a
  policy of non-discrimination with all employees and
  applicants for employment. What does that mean exactly? It
  means that at Salesforce, we believe in equality for all.
  And we believe we can lead the path to equality in part by
  creating a workplace that’s inclusive, and free from
  discrimination. Know your rights: workplace discrimination
  is illegal. Any employee or potential employee will be
  assessed on the basis of merit, competence and
  qualifications – without regard to race, religion, color,
  national origin, sex, sexual orientation, gender expression
  or identity, transgender status, age, disability, veteran or
  marital status, political viewpoint, or other
  classifications protected by law. This policy applies to
  current and prospective employees, no matter where they are
  in their Salesforce employment journey. It also applies to
  recruiting, hiring, job assignment, compensation, promotion,
  benefits, training, assessment of job performance,
  discipline, termination, and everything in between.
  Recruiting, hiring, and promotion decisions at Salesforce
  are fair and based on merit. The same goes for compensation,
  benefits, promotions, transfers, reduction in workforce,
  recall, training, and education.
