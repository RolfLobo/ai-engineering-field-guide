description: |
  Job Details:

  Job Description: Drive Intel's XeSS and related AI-based
  graphics technologies for Client Graphics, with direct
  impact across XeSS Super Resolution, XeSS Frame Generation,
  Neural Rendering, and next generation AI rendering
  capabilities. In this role, you will contribute to technical
  direction, drive execution across teams, and contribute to
  the future of AI-based graphics at Intel. You will work
  across research, software, hardware architecture,
  validation, and ecosystem teams to bring new AI graphics
  technologies from concept to product. You will play a
  significant role in end-to-end development across model
  design, datasets, training, visual quality, performance
  optimization, and product integration. You will also help
  guide how modern AI model architectures are applied to
  future graphics workloads.

  Qualifications:- Bachelor's degree in Computer Science,
  Computer Engineering, Electrical Engineering, Applied
  Mathematics, or related field, with 10+ years of experience,
  or Master's degree with 8+ years of experience.
   - Strong expertise in AI/ML for real-time graphics, imaging,
     or video, such as super resolution, frame generation,
     denoising, reconstruction, optical flow, or related AI
     rendering workloads.
   - Experience contributing to AI technology development from
     research to productization, including model architecture,
     datasets, training, evaluation, optimization, and
     deployment.
   - Strong understanding of GPU architecture, performance,
     memory, latency, and hardware-aware optimization.
   - Demonstrated ability to lead technical initiatives and
     collaborate across cross-functional teams spanning
     research, software, and hardware.

  Preferred Qualifications

  - Experience with XeSS, Neural Rendering, or adjacent AI-based
    graphics technologies.
  - Good understanding of modern AI model architectures, such as
    LLMs, Vision Transformers, Diffusion, and related
    architectures.
  - Experience with high-performance GPU compute, inference
    kernels, or production AI deployment.
  - Experience with dataset capture, processing, and training
    infrastructure for graphics AI models.
  - Experience with SDK, API, or cross-platform AI
    productization.
  - Experience influencing future GPU, NPU, or accelerator
    features based on AI workload analysis.



