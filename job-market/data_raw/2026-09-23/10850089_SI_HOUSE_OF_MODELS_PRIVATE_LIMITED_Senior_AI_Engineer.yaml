  About the Role

  You’ll work on integrating and scaling AI models in
  production to power features like personalization, search,
  and campaign generation.

  What You’ll Own

  - Integrate and scale LLMs and vision models
  - Build AI pipelines with performance and cost in mind
  - Collaborate with product and backend teams
  - Own real-time inference and finetuning workflows
  - Work on embeddings, RAG, and vector search
  - Optimize model usage across cloud platforms

  What We’re Looking For

  - Overall experience with similar background of 6+ years
  - Deep expertise in either Python or NodeJS
  - Advanced understanding of Generative AI, LLMs, Diffusers and
    DiTs
  - Practical experience calling foundation-model APIs (OpenAI,
    Anthropic, open-source LLMs), embedding models, RAG
    patterns, or agentic frameworks.
  - Proficiency in Git, agile development, CI/CD
  - Experience with API integrations
  - Problem-solving mindset to navigate ambiguity in a fast-
    paced startup
  - Passion for building revolutionary AI products
  - Strong communication and collaboration skills
  - Comfortable with Docker, cloud services (AWS/GCP/Azure), and
    basic infra-as-code tools
  - Ability to explain complex systems to both technical and
    non-technical teammates

  You’ll Thrive If You Are

  - Python or NodeJS
  - ComfyUI, n8n, CrewAI or similar orchestration engines

  Our Values

  - Embrace extreme ownership and bias for action
  - Act with integrity and empathy
  - Pursue relentless innovation and experimentation
  - Prioritize user needs and experience
  - Invest in personal growth and team collaboration

  What We Offer

  - Competitive salary
  - Health & wellness benefits
  - Work from our vibrant Bangalore (HSR Layout)
  - Direct mentorship from founders and advisors across Gen AI,
    product, and design
  - A fast-paced, builder-led team solving meaningful, technical
    problems
  - High ownership, low bureaucracy culture

  Location

  We're hiring in Bangalore (no remote for this role).

  💡 Why Join Us?

  - Work on cutting-edge AI products redefining commerce.
  - Build with founders who’ve done this before.
  - Be part of a high-growth, high-impact journey.
