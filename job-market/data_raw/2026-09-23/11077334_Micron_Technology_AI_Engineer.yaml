description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever.

  - Design, develop, and deploy AI and machine learning
    solutions at scale.
  - Build and optimize deep learning models for computer vision,
    speech recognition, signal analytics, and intelligent
    automation use cases.
  - Develop and evaluate neural network architectures including
    CNNs, Transformers, Vision Transformers (ViTs), Whisper-
    based ASR models, multimodal models, and foundation
    models.
  - Contribute to agentic AI solutions leveraging reasoning,
    planning, orchestration, and autonomous task execution.
  - Design and implement speech-to-text systems, voice analytics
    pipelines, and audio AI capabilities.
  - Build signal processing and time-series analytics pipelines
    for sensor data, industrial telemetry, and edge inference
    workloads.
  - Deploy AI models to edge devices and embedded systems
    including NVIDIA Jetson, Raspberry Pi, and ARM-based
    platforms.
  - Design and implement AWS-based AI architectures using
    SageMaker, Bedrock, Lambda, Step Functions, IoT Core, and
    Greengrass.
  - Develop and maintain software systems supporting AI model
    lifecycle management, MLOps, and CI/CD pipelines.
  - Participate in AI security assessments, model evaluation,
    adversarial robustness testing, and responsible AI
    practices.
  - Present technical findings and project outcomes to
    engineering leadership.

