description: |
  Staff Software Engineer- AI

  Are you passionate about building AI-driven software that
  transforms how professionals work? Join a dynamic and highly
  skilled team at Thomson Reuters, where we invest deeply in
  AI technologies and explore emerging fields with the backing
  of a globalleader. As a Staff Software Engineer – AI, you
  will play a lead role in developing intelligent systems that
  power the next generation of expert solutions across legal,
  tax, risk, and compliance domains.

  About The Role

  As a Staff Software Engineer – AI, you will:

  - You will spearhead the development of cutting-edge AI-
    powered solutions and driving technical strategy. You will
    collaborate with senior stakeholders, product leadership,
    and cross-functional teams to architect, build, and scale
    enterprise-grade AI systems that transform how our
    organization delivers value to customers.

  - Design and lead the implementation of complex, enterprise-
    scale AI systems, including sophisticated multi-component
    pipelines, advanced retrieval-augmented generation (RAG)
    architectures, and autonomous AI agents with multi-step
    reasoning capabilities .
  - Architect scalable AI model integration strategies for
    production software through robust APIs, distributed data
    pipelines, and microservices architectures.
  - Lead the adaptation and customization of AI models for
    specialized domains, driving innovation in expert systems
    for legal, tax, fraud and compliance.
  - Define technical standards and best practices for AI system
    architecture across the organization

  - Lead evaluation and strategic adoption of cutting-edge AI
    techniques to solve complex business challenges.
  - Oversee proof-of-concept projects and guide technical
    feasibility assessments for new AI-driven features.
  - Stay at the forefront of AI research and emerging
    technologies, translating insights into actionable
    technical roadmaps.
  - Drive innovation initiatives and establish the
    organization's position in emerging AI technology areas

  - Lead technical architecture decisions and translate high-
    level business requirements into comprehensive, scalable
    technical specifications.
  - Mentor a team of senior and junior Software engineers,
    fostering technical growth and career development.
  - Champion MLOps and LLMOps practices across the organization,
    leading both design and implementation initiatives.
  - Serve as a senior thought leader, driving technical
    discussions in executive forums and representing the
    organization at industry conferences and events.

  - Design and implement comprehensive testing frameworks,
    monitoring systems, and observability solutions for AI
    model performance at scale.
  - Lead compliance initiatives ensuring adherence to ethical AI
    principles, security standards, and regulatory
    requirements.
  - Conduct advanced systems analysis and drive operational
    improvements across AI infrastructure.
  - Establish governance frameworks for AI model lifecycle
    management

  - Partner with AI researchers, senior engineering leadership,
    design, and product teams to translate AI capabilities
    into market-leading applications.
  - Drive optimization of AI system performance across multiple
    dimensions including latency, resource usage, cost
    efficiency, and user experience.
  - Lead strategic initiatives for application feature
    enhancements through advanced AI capabilities.
  - Influence product strategy through deep technical expertise
    and market understanding.

  About You

  You are a fit for the position of Staff Software Engineer -
  AI if your background includes:

  - Bachelor's degree in computer science, Engineering, or
    equivalent experience.
  - Master's degree preferred • 8+ years of experience in
    software engineering with at least 4 years in senior or
    lead roles focused on AI/ML
  - Expert-level proficiency in Python and extensive experience
    with AI/ML frameworks (PyTorch, TensorFlow, JAX) • Deep
    understanding of machine learning principles, advanced
    evaluation methodologies, and distributed system design.
  - Proven experience with MLOps/LLMOps and managing thecomplete
    lifecycle of enterprise AI-powered applications.
  - Demonstrated expertise integrating AI models into large-
    scale production systems using APIs, data pipelines, and
    cloud-native architectures.
  - Advanced experience with cloud platforms (AWS,Azure, GCP)
    and orchestration tools (Docker, Kubernetes, Terraform) •
  - Strong leadership experience driving technical initiatives
  - Excellent strategic thinking, problem-solving skills, and
    ability to operate effectively in complex, fast-paced
    environments.
  - Outstanding communication and presentation skills with
    experience influencing senior stakeholders

  - Experience leading teams in building AI-driven systems,
    agent-based architectures, or enterprise integrations with
    AI APIs from providers like OpenAI, Anthropic, and others.
  - Advanced knowledge of vector databases, embeddings, semantic
    search, andinformation retrieval systems.
  - Domain expertise in legal, tax, accounting, or other
    regulated industries.
  - Track record of successful AI product launches and scaling
    AI systems to enterprise customers.
  - Portfolio demonstrating leadership in innovative LLM-based
    solutions and AI product development.
  - Experience with AI governance, model risk management, and
    regulatory compliance.
  - Publications, patents, or speaking experience in AI/ML
    domains

  #LI-VGA1

  What’s in it For You?

  - Hybrid Work Model: We’ve adopted a flexible hybrid working
    environment (2-3 days a week in the office depending on
    the role) for our office-based roles while delivering a
    seamless experience that is digitally and physically
    connected.
  - Flexibility & Work-Life Balance: Flex My Way is a set of
    supportive workplace policies designed to help manage
    personal and professional responsibilities, whether caring
    for family, giving back to the community, or finding time
    to refresh and reset. This builds upon our flexible work
    arrangements, including work from anywhere for up to 8
    weeks per year, empowering employees to achieve a better
    work-life balance.
  - Career Development and Growth: By fostering a culture of
    continuous learning and skill development, we prepare our
    talent to tackle tomorrow’s challenges and deliver real-
    world solutions. Our Grow My Way programming and skills-
    first approach ensures you have the tools and knowledge to
    grow, lead, and thrive in an AI-enabled future.
  - Industry Competitive Benefits: We offer comprehensive
    benefit plans to include flexible vacation, two company-
    wide Mental Health Days off, access to the Headspace app,
    retirement savings, tuition reimbursement, employee
    incentive programs, and resources for mental, physical,
    and financial wellbeing.
  - Culture: Globally recognized, award-winning reputation for
    inclusion and belonging, flexibility, work-life balance,
    and more. We live by our values: Obsess over our
    Customers, Compete to Win, Challenge (Y)our Thinking, Act
    Fast / Learn Fast, and Stronger Together.
  - Social Impact: Make an impact in your community with our
    Social Impact Institute. We offer employees two paid
    volunteer days off annually and opportunities to get
    involved with pro-bono consulting projects and
    Environmental, Social, and Governance (ESG) initiatives.
  - Making a Real-World Impact: We are one of the few companies
    globally that helps its customers pursue justice, truth,
    and transparency. Together, with the professionals and
    institutions we serve, we help uphold the rule of law,
    turn the wheels of commerce, catch bad actors, report the
    facts, and provide trusted, unbiased information to people
    all over the world.

  About Us

  Thomson Reuters informs the way forward by bringing together
  the trusted content and technology that people and
  organizations need to make the right decisions. We serve
  professionals across legal, tax, accounting, compliance,
  government, and media. Our products combine highly
  specialized software and insights to empower professionals
  with the data, intelligence, and solutions needed to make
  informed decisions, and to help institutions in their
  pursuit of justice, truth, and transparency. Reuters, part
  of Thomson Reuters, is a world leading provider of trusted
  journalism and news.

  We are powered by the talents of 26,000 employees across
  more than 70 countries, where everyone has a chance to
  contribute and grow professionally in flexible work
  environments. At a time when objectivity, accuracy,
  fairness, and transparency are under attack, we consider it
  our duty to pursue them. Sound exciting? Join us and help
  shape the industries that move society forward.

  As a global business, we rely on the unique backgrounds,
  perspectives, and experiences of all employees to deliver on
  our business goals. To ensure we can do that, we seek
  talented, qualified employees in all our operations around
  the world regardless of race, color, sex/gender, including
  pregnancy, gender identity and expression, national origin,
  religion, sexual orientation, disability, age, marital
  status, citizen status, veteran status, or any other
  protected classification under applicable law. Thomson
  Reuters is proud to be an Equal Employment Opportunity
  Employer providing a drug-free workplace.

  We also make reasonable accommodations for qualified
  individuals with disabilities and for sincerely held
  religious beliefs in accordance with applicable law. More
  information on requesting an accommodation here.

