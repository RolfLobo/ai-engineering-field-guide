description: |
  🚀 About WRITER

  WRITER is where the world's leading enterprises orchestrate
  AI-powered work. Our vision is to expand human capacity
  through superintelligence. And we're proving it's possible –
  through powerful, trustworthy AI that unites IT and business
  teams together to unlock enterprise-wide transformation.
  With WRITER's end-to-end platform, hundreds of companies
  like Mars, Marriott, Uber, and Vanguard are building and
  deploying AI agents that are grounded in their company's
  data and fueled by WRITER's enterprise-grade LLMs. Valued at
  $1.9B and backed by industry-leading investors including
  Premji Invest, Radical Ventures, and ICONIQ Growth, WRITER
  is rapidly cementing its position as the leader in
  enterprise generative AI.

  Founded in 2020 with office hubs in San Francisco, New York
  City, Seattle, Austin, Chicago, and London, our team thinks
  big and moves fast, and we're looking for smart, hardworking
  builders and scalers to join us on our journey to create a
  better future of work with AI.

  📐 About the role

  Imagine stepping into a role where your code directly
  empowers the world's largest enterprises to safely adopt
  superintelligence. As a software engineer, generative ai at
  WRITER, you'll be at the forefront of expanding human
  capacity by building the secure, scalable foundation that
  allows our generative AI solutions to thrive in complex
  corporate environments. The impact of this work is massive –
  for example, in the consumer packaged goods industry alone,
  our AI adoption is driving 69% revenue increases and 72%
  cost reductions.

  This role is designed for a well-rounded engineering
  generalist who leans heavily into generative AI while
  bringing a whole-systems mindset to architectural design. If
  you thrive on proactivity without red tape and love owning
  projects from proposal to deployment, you'll shape the
  future of AI and contribute to a product that’s changing how
  the world works. This is a hybrid role based out of our San
  Francisco, New York City, or London hubs. You'll report to
  an engineering director or a senior engineering manager.

  We are open to hiring for this role at multiple levels, with
  compensation ranges scaled to match your experience,
  expertise, and the scope of the role.

  🦸🏻‍♀️ What you'll do

  - Design and develop robust, secure, and scalable generative
    AI services and applications using Python and modern
    frameworks to drive enterprise-wide transformation
  - Build and optimize high-performance, low-latency APIs and
    microservices to integrate advanced AI models and
    sophisticated agentic workflows into our core platform
  - Act as a whole-systems thinker by making meaningful system
    design decisions and owning the architecture of core
    platform components from initial proposal through
    production deployment
  - Implement and maintain responsive user interfaces using
    technologies like React and TypeScript to deliver
    intuitive user experiences and bridge the gap between
    backend services and frontend enablement
  - Drive proactivity without red tape by clearly communicating
    changes, plans, and proposals to cross-functional teams
    and collaborating closely with product managers, data
    scientists, and DevOps engineers
  - Partner with DevOps teams to build continuous deployment,
    logging, and monitoring systems that ensure top-tier
    performance, security, and reliability across distributed
    workloads

  ⭐️ What you need

  - 3-5+ years of hands-on experience as a software engineer
    with a strong emphasis on Python development in production
    environments
  - Proven expertise in building and deploying generative AI
    applications, leveraging LLMs, vector databases like
    Pinecone, Weaviate, or pgvector, and modern open-source
    agentic frameworks
  - Practical experience with microservices architecture,
    RESTful APIs, cloud platforms such as AWS, GCP, or Azure,
    and containerization with Docker and Kubernetes
  - Solid grasp of modern web technologies including FastAPI,
    Asyncio, database systems like PostgreSQL, and hands-on
    experience leveraging AI developer tooling like Claude,
    Cursor, or GitHub Copilot to accelerate your engineering
    workflows
  - Exposure to enterprise architecture including practical
    experience implementing IAM, SSO, SAML, OAuth, OIDC, RBAC,
    robust security best practices, or building services for
    enterprise administration and billing systems
  - A Connect mindset that thrives in collaborative settings
    where you actively engage with cross-functional teams and
    mentor other engineers, a Challenge spirit that drives you
    to tackle complex technical hurdles and proactively
    suggest innovative improvements, and an Own attitude where
    you take full accountability for delivering high-quality,
    resilient, and scalable code from conception to production

  🍩 Benefits & perks (US Full-time employees)

  - Generous PTO, plus company holidays
  - Medical, dental, and vision coverage for you and your family
  - Paid parental leave for all parents (16 weeks)
  - Fertility and family planning support
  - Early-detection cancer testing through Galleri
  - Flexible spending account and dependent FSA options
  - Health savings account for eligible plans with company
    contribution
  - Annual work-life stipends for:
    - Wellness stipend for gym, massage/chiropractor, personal
      training, etc.
    - Learning and development stipend
  - Company-wide off-sites and team off-sites
  - Competitive compensation, company stock options and 401k

  WRITER is an equal-opportunity employer and is committed to
  diversity. We don't make hiring or employment decisions
  based on race, color, religion, creed, gender, national
  origin, age, disability, veteran status, marital status,
  pregnancy, sex, gender expression or identity, sexual
  orientation, citizenship, or any other basis protected by
  applicable local, state or federal law. Under the San
  Francisco Fair Chance Ordinance, we will consider for
  employment qualified applicants with arrest and conviction
  records.

  By submitting your application on the application page, you
  acknowledge and agree to WRITER's Global Candidate Privacy
  Notice.
