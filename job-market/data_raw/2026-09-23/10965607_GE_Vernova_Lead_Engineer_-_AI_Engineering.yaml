description: |
  Job Description SummaryGE Vernova is embracing cutting-edge
  technologies to streamline operations, improve customer
  experiences, and drive growth. As part of this vision, we
  are building a dedicated team to leverage Generative AI and
  redefine how we engage with our industry. The ultimate goal
  of the team is to automate prompting, develop a framework
  for prompting across use cases to maximize reuse as well as
  sharing across businesses. We are seeking a highly motivated
  and talented AI Engineer to join our dynamic team. The
  successful candidate will be responsible for creating and
  optimizing prompts for LLMs, collaborating with domain
  experts and end users to develop software solutions that
  address both internal and external needs. This position
  offers a great opportunity to work at the intersection of
  advanced technology and traditional industry, making a
  tangible impact on our business processes. As a GE Vernova
  accelerator, AI Foundry is driving strategy and leading
  research & development efforts to execute on the business’s
  mission to help power the energy transition. We forge the
  collaborations and help invent the technologies required to
  electrify and decarbonize for a zero-carbon future.
  Representing virtually every major scientific and
  engineering discipline, our researchers are collaborating
  with GE Vernova’s businesses, the U.S. government, and more
  than 420 entities at the forefront of technology to execute
  on 150+ energy-focused projects. Collectively, these
  research programs and initiatives aim to solve near term
  technical challenges, deliver next generation product
  advances, and drive long term breakthrough innovation to
  enable more affordable, reliable, sustainable, and secure
  energy.

  Job Description

  Key Responsibilities:

  - Design, implement, and optimize AI Agents using LLMs,
    reinforcement learning, planning algorithms, and decision-
    making frameworks.
  - Develop scalable multi AI Agent architectures supporting
    long horizon reasoning, autonomy, planning, interaction,
    and complex task completion.
  - Integrate AI Agents with APIs, backend services, databases,
    and enterprise applications.
  - Prototype, deploy, and maintain AI-driven systems ensuring
    reliability and performance in production environments.
  - Optimize agent behavior through continuous feedback,
    reinforcement learning, and user interaction.
  - Collaborate closely with research, engineering, product, and
    deployment teams to iterate on agent capabilities and
    innovate continuously.
  - Monitor AI Agent performance, conduct rigorous evaluations,
    implement safety guardrails, and ensure ethical AI
    practices.
  - Document AI Agent architectures, design decisions,
    workflows, and maintain comprehensive technical
    documentation.
  - Stay current with emerging AI technologies, contribute to
    platform and tooling improvements, and share knowledge
    within the team.
  - Your mission is to push the boundaries of planning,
    reasoning, and agentic intelligence. You will design and
    implement large-scale AI/ML solutions integrating the
    latest state of the art research in our global products

  Core Technical Skills:


  - Proficiency in Python and/or languages like JavaScript,
    TypeScript, Node.js, or Java, Go, with strong coding and
    software engineering practices.
  - Expertise with AI/ML libraries and frameworks such as
    LangChain, OpenAI APIs, PyTorch, TensorFlow, commercial or
    open source LLMs.
  - Hands-on experience with LLMs, prompt engineering, and
    natural language processing (NLP).
  - Knowledge of agent orchestration platforms and multi-agent
    systems (e.g., AutogenAI, LangGraph, MCP protocol).
  - Familiarity with data management, vector databases, semantic
    retrieval, and real-time data pipelines.
  - Experience deploying AI systems on cloud platforms (AWS,
    Google Cloud) with container orchestration (Docker,
    Kubernetes).
  - Strong understanding of machine learning model training,
    fine-tuning, and evaluation techniques.
  - Awareness of AI ethics, data privacy, and secure handling of
    sensitive information.

  Qualifications:

  - Masters' degree in Computer Science, AI/ML, Engineering,
    Mathematics, or related field with 3+ years of relevant
    experience.
  - Thorough experience in AI, GenAI application development &
    deployment particularly with autonomous agent systems or
    related AI software engineering roles.
  - Demonstrated ability to work independently in fast-paced,
    experimental environments.
  - Hands-on experience designing and building GenAI apps that
    allow users to experience AI use cases supporting features
    like agent orchestration, multi-step reasoning, prompt
    engineering, RAG integration, and model selection
  - Expertise with LLMs and deep learning models, machine
    learning lifecycle management, data generation methods,
    model training & validation coupled with strong
    fundamentals and passion in software engineering and
    system architecture
  - Must be willing to work out of an office located in
    Bangalore
  - Must be 18 years or older.
  - You must submit your application for employment on the
    careers page at www.careers.gevernova.com to be
    considered.

  Additional Information

  Relocation Assistance Provided: Yes
