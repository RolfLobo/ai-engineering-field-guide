  believe diversity is a benefit to our employees, our
  company, our customers, and our community.  All aspects of
  employment at MCI are based solely on a person's merit and
  qualifications.  MCI maintains a work environment free from
  discrimination, one where employees are treated with dignity
  and respect. All employees share in the responsibility for
  fulfilling MCI's commitment to a diverse and equal
  opportunity work environment.

  MCI does not discriminate against any employee or applicant
