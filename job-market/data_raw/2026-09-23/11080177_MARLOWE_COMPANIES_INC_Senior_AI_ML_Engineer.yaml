description: |
  POSITION OVERVIEW

  MCI is one of the fastest-growing tech-enabled business
  services companies in the USA, with a strong call center
  footprint and operations that extend across multiple
  countries. We deliver Customer Experience (CX), Business
  Process Outsourcing (BPO), and Anything-as-a-Service (XaaS)
  cloud technology solutions across a wide range of
  industries, including healthcare, retail, government,
  education, telecom, technology e-commerce, and financial
  services. Our contact centers are powered by both on-site
  and remote agents, leveraging advanced technologies to
  enhance customer journeys, drive scalability and reduce
  costs.

  At MCI we are committed to fostering an environment where
  professionals can build meaningful careers, access
  continuous learning and development opportunities and
  contribute to the success of a globally expanding, industry-
  leading organization.

  We are seeking a highly experienced Senior AI / Machine
  Learning Engineer to lead the design, development, and
  deployment of advanced AI and machine learning solutions
  that drive innovation and business transformation. This role
  combines deep technical expertise with leadership
  responsibilities, ensuring machine learning systems are
  scalable, reliable, and aligned with organizational
  objectives.

  You will work closely with data scientists, engineers,
  product teams, and business leaders to deliver enterprise-
  grade AI solutions while mentoring technical teams and
  establishing best practices.

  To be considered for this role, you must complete a full
  application on our company careers page, including all
  screening questions and a brief pre-employment test.

  POSITION RESPONSIBILITIES

  Key Responsibilities:

  Machine Learning Architecture & Development

  - Lead the design and implementation of machine learning
    solutions that address complex business challenges.
  - Architect scalable machine learning systems and frameworks.
  - Develop, train, and optimize predictive and AI-driven
    models.
  - Establish model development standards and best practices.
  - Drive technical decision-making across AI initiatives.

  Production Deployment & MLOps

  - Ensure machine learning solutions are production-ready and
    operationally efficient.
  - Design deployment strategies for machine learning models.
  - Support MLOps practices and model lifecycle management.
  - Monitor model performance and address drift or degradation.
  - Optimize infrastructure and deployment pipelines.

  Data Strategy & Optimization

  - Drive data quality and effectiveness across AI initiatives.
  - Collaborate with data engineering teams on data
    architecture.
  - Improve feature engineering and model training processes.
  - Ensure data quality, consistency, and governance standards.
  - Support scalable data processing frameworks.

  Governance, Security & Compliance

  - Promote responsible and secure AI development practices.
  - Implement model validation and testing frameworks.
  - Ensure compliance with regulatory and governance
    requirements.
  - Support AI risk management initiatives.
  - Maintain documentation and technical standards.

  Leadership & Innovation

  - Provide technical leadership and contribute to
    organizational AI strategy.
  - Mentor engineers and machine learning practitioners.
  - Evaluate emerging AI and machine learning technologies.
  - Lead proof-of-concept and innovation initiatives.
  - Support AI transformation and modernization efforts.

  CANDIDATE QUALIFICATIONS

  WONDER IF YOU ARE A GOOD FIT FOR THIS POSITION?

  All positive, and driven applicants are encouraged to apply.
  The Ideal candidates for this position are highly motivated
  and dedicated and should possess the below qualities:

  - Bachelor's Degree in Computer Science, Data Science,
    Artificial Intelligence, Mathematics, Statistics,
    Engineering, or a related field.
  - Minimum 5 years of software engineering, machine learning,
    or AI development experience.
  - Strong expertise in machine learning algorithms, model
    development, and deployment.
  - Advanced proficiency in Python and machine learning
    frameworks.
  - Experience building enterprise-scale AI solutions.
  - Strong understanding of statistical analysis and predictive
    modeling.
  - Experience deploying machine learning models into production
    environments.
  - Knowledge of cloud computing and distributed systems.
  - Experience mentoring technical teams and leading projects.
  - Strong analytical and problem-solving skills.
  - Excellent communication and stakeholder engagement
    abilities.
  - Experience working in Agile software development
    environments.

  Nice to Have

  - Experience with TensorFlow, PyTorch, Scikit-learn, or
    XGBoost.
  - Experience with Generative AI and Large Language Models.
  - Knowledge of MLOps and CI/CD pipelines.
  - Cloud certifications in AWS, Azure, or GCP.
  - Experience with NLP, computer vision, or recommendation
    systems.
  - Knowledge of AI governance and responsible AI frameworks.
  - Master's Degree in AI, Data Science, or related field.
  - Experience leading enterprise AI transformation initiatives.

  PHYSICAL REQUIREMENTS

  This job operates in a professional office environment.
  While performing the duties of this job, the employee will
  be largely sedentary and will be required to sit/stand for
  long periods while using a computer and telephone headset.
  The employee will be regularly required to operate a
  computer and other office equipment, including a phone,
  copier, and printer. The employee may occasionally be
  required to move about the office to accomplish tasks; reach
  in any direction; raise or lower objects, move objects from
  place to place, hold onto objects, and move or exert force
  up to forty (40) pounds.

  CONDITIONS OF EMPLOYMENT

  All MCI Locations

  - Must be authorized to work in the country where the job is
    based.

  Subject to the program and location of the position

  - Must be willing to submit up to a LEVEL II background and/or
    security investigation with a fingerprint.  Job offers are
    contingent on background/security investigation results.
  - Must be willing to submit to drug screening.  Job offers are
    contingent on drug screening results. (Does not apply in
    Canada)

  REASONABLE ACCOMMODATION

  Consistent with the Americans with Disabilities Act (ADA),
  it is the policy of MCI and its affiliates to provide
  reasonable accommodations when requested by a qualified
  applicant or employee with a disability unless such
  accommodations would cause undue hardship. The policy
  regarding requests for reasonable accommodation applies to
  all aspects of employment. If reasonable accommodations are
  needed, please contact Human Resources.

