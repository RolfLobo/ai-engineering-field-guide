title: "Corporate Sales Lead – AI Training & Developer Enablement"
company: Codistry Academy
location: USA
remote: true
work_type: FULL_TIME
description: |
  Help bring AI-driven software development to the world’s
  best teams.

  Codistry Academy is on a mission to make AI-driven software
  development practical, accessible, and impactful. We deliver
  high-quality, outcome-focused training—from self-guided
  online programs to intensive, in-person workshops—designed
  for everyone from non-technical professionals to senior
  engineers and tech leads.

  Our clients don’t buy “courses.” They invest in capability
  upgrades and team up-skilling.

  What We Do

  - AI-driven software development training
  - Customized programs for real team needs
  - Small, focused cohorts (5–20 people)
  - Formats ranging from 1-day intensives to 14-day deep dives
  - Corporate clients from startups to large enterprises

  The Role

  We’re looking for a high-caliber Corporate Sales
  Professional to own and grow Codistry Academy’s U.S.
  corporate sales pipeline.

  This is a remote, commission-based role to start, with a
  clear path to base salary + commission as revenue
  stabilizes.

  You’ll be responsible for taking warm interest and outbound
  opportunities, understanding real business problems, and
  turning them into tailored training engagements.

  This is not a transactional sales role. It’s consultative,
  relationship-driven, and solution-oriented.

  What You’ll Do

  - Own end-to-end corporate sales for the U.S. market
  - Engage decision-makers at small, mid-market, and enterprise
    companies
  - Understand client goals and translate them into tailored
    training solutions
  - Sell multi-day training programs and ongoing enablement
  - Build long-term client relationships, not one-off deals
  - Collaborate directly with leadership and instructors
  - Help shape pricing, packaging, and go-to-market strategy

  Who You Are

  - A self-starter who thrives with autonomy and ownership
  - Experienced in B2B / corporate / enterprise sales
  - Comfortable selling high-value, intangible offerings
    (training, consulting, education, SaaS, or services)
  - Professional, credible, and confident with senior
    stakeholders
  - Strong communicator who can explain value—not just features
  - Ready to hit the ground running in a growing business

  Experience selling technical training, professional
  services, or developer-focused products is a strong plu, but
  not required if you learn fast.

  Why Join Codistry

  - 100% remote (U.S.-focused clients)
  - High-impact product with real demand
  - Direct access to founders and decision-makers
  - Commission-based upside with a clear path to guaranteed base
  - Opportunity to help shape a fast-growing AI education brand
  - Sell something that actually helps people and teams level up
industries:
