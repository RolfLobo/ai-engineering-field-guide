title: Lead Software Engineer- NLP, Gen AI
company: Gartner
location: Gurugram, IND
work_type: FULL_TIME
company_size: 17,843 Employees
description: |
  About this role:

  AI-focused Software Development position responsible for the
  architecture, implementation, design, and deployment of
  algorithms and Python based applications to help fulfill our
  Research & Consulting Delivery strategy.

  What you’ll do:

  - Establish methodologies for quickly rolling out new data
    analysis capabilities for standalone data-driven products
    and services to support our associates using AI, ML, and
    LLMs.
  - Lead architecture and technical design discussions to ensure
    data science solutions align with the organization's
    strategic objectives.
  - Continuously improve models through experimentation and
    optimization techniques.
  - Analyze unstructured text data to discover insights and
    patterns using advanced data science techniques, including
    machine learning and natural language processing
  - Use a combination and quantitative (science) and qualitative
    (art) methodologies to prioritize AI initiatives.
  - Stay on top of fast-moving AI/ML models and technologies.
    Understand and follow disruptive data science solutions.
    Evangelize new technologies and drive their adoption.
  - Create Data Science packages and APIs for use across the
    organization
  - Mentor junior members of the team on effective technical
    practices and non-technical acumen
  - Be accountable for the scalability, stability, and business
    adoption of data science solutions

  What you’ll need:

  7-9 years of experience in algorithms and statistics and
  experience in data mining, machine learning, deep learning
  and natural language processing. Ability to provision
  packages and APIs for production data science code.

  Must have:

  - Education qualification as graduate or postgraduate degree
    in Engineering or Data Science is required.
  - Experience in Machine learning models and techniques like
    NLP, BERT, Transformers, Deep learning.
  - Experience using LLMs (e.g., OpenAI, Cohere, Anthropic,
    Llama, etc) to deliver business outcomes.
  - Experience building Generative AI and Agentic AI solutions
    using LangChain, LangGraph, Langfuse, RAG, and prompt
    engineering.
  - Stay on top of fast-moving AI/ML models and technologies.
    Understand and follow disruptive data science solutions.
    Evangelize new technologies and drive their adoption.
  - Demonstrated ability to translate quantitative analysis into
    actionable business strategies.
  - Ability to work collaboratively across business, data
    science and technical stakeholders.

  Who you are

  - Graduate/Postgraduate in BE/B tech, ME/MTech or MCA are
    preferred.
  - Excellent communication and prioritization skills.
  - Able to work independently or within a team proactively in a
    fast-paced AGILE-SCRUM environment.
  - Owns success – Takes responsibility for successful delivery
    of the solutions.
  - Ardent desire to improve upon their skills in software
    development, frameworks, and technologies.

  Don’t meet every single requirement? We encourage you to
  apply anyway. You might just be the right candidate for
  this, or other roles.

  #LI-JJ3

  Who are we?

  At Gartner, Inc. (NYSE:IT), we guide the leaders who shape
  the world.

  Our mission relies on expert analysis and bold ideas to
  deliver actionable, objective business and technology
  insights, helping enterprise leaders and their teams succeed
  with their mission-critical priorities.

  Since our founding in 1979, we’ve grown to 20,000 associates
  globally who support over 13,000 client enterprises in ~90
  countries and territories. We do important, interesting and
  substantive work that matters. That’s why we hire associates
  with the intellectual curiosity, energy and drive to want to
  make a difference. The bar is unapologetically high. So is
  the impact you can have here.

  What makes Gartner a great place to work?

  Our vast, virtually untapped market potential offers
  limitless opportunities – opportunities that may not even
  exist right now – for you to grow professionally and
  flourish personally. How far you go is driven by your
  passion and performance.

  We hire remarkable people who collaborate and win as a team.
  Together, our singular, unifying goal is to deliver results
  for our clients.

  Our teams are inclusive and composed of individuals from
  different geographies, cultures, religions, ethnicities,
  races, genders, sexual orientations, abilities and
  generations.

  We invest in great leaders who bring out the best in you and
  the company, enabling us to multiply our impact and results.
  This is why, year after year, we are recognized worldwide as
  a great place to work.

  Gartner is the world authority on AI

  At Gartner, you’ll join a company at the very center of the
  AI revolution. Gartner has proactive, objective guidance
  throughout clients’ AI journeys. We set the standard for how
  organizations leverage artificial intelligence to drive
  meaningful impact. You’ll have access to unmatched
  resources, expertise, and technology, and play a key role in
  helping Gartner and our clients innovate and grow as we
  leverage AI to transform business and technology landscapes.



  It’s an exciting time to be at Gartner, with limitless
  opportunities to make a real impact, grow your skills, and
  build a lasting, meaningful career in a field that’s
  reshaping the way we operate. If you’re passionate about AI
  and want to be part of a team that’s guiding the leaders who
  shape the world, Gartner is the place for you.

  What do we offer?

  Gartner offers world-class benefits, highly competitive
  compensation and disproportionate rewards for top
  performers.

  In our hybrid work environment, we provide the flexibility
  and support for you to thrive — working virtually when it's
  productive to do so and getting together with colleagues in
  a vibrant community that is purposeful, engaging and
  inspiring.

  Ready to grow your career with Gartner? Join us.

