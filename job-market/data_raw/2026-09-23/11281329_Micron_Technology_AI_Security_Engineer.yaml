location: Hyderabad, IND
work_type: FULL_TIME
company_size: 45,000 Employees
description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever. ## Key responsibilities
  - Design, build, and deploy AI agents and automation for CDR
    Sub-Towers and other AI Security initiatives
  - Follow direction set by Program Manager and Program Lead
  - Participate in peer review of other embed engineers' designs
    and receive review on your own
  - Coordinate with sub-tower leaders on their roadmap
    priorities
  - Contribute learnings, patterns, and reusable components back
    to the CDR AI Security team
  - Follow threat modeling and secure development practices set
    by the AI Security Program Lead
  --- ## Required qualifications
  - 5+ years of software engineering experience
  - Working knowledge of AI/ML product development - familiarity
    with LLMs, agents, RAG, or automation frameworks
  - Solid engineering fundamentals - auth, data handling, error
    handling, secure coding
  - Willingness to work closely with various CDR sub-towers -
    daily partnership, not remote arm's-length delivery
  - Comfort with peer review culture and shared standards
  - Domain-relevant curiosity - you'll be building for
    cybersecurity workflows, so willingness to learn CDR's
    sub-tower's domain deeply matters
  --- ## What success looks like in year 1
  - You've deployed multiple production AI Security capabilities
    used by various sub-towers
  - You've contributed patterns, tools, or learnings back to the
    CDR AI Security team
  - You've followed standards and passed peer/architectural
    review consistently
  --- ## Who this role isn't for
  - Engineers who want to work in isolation - daily partnership
    and teamwork is the model
  - Engineers who dislike shared standards - reference
    architectures and patterns are enforced, not suggested
  - Engineers who want infrastructure/platform engineering work
    - this is application-level engineering on top of an
    existing enterprise platform
