description: |
  Why Us

  NewRocket is the AI-first Elite ServiceNow Partner that
  activates real value on the Now Platform. As a trusted
  advisor to enterprise leaders, we combine industry
  expertise, human-centered design, and enterprise-grade AI to
  help organizations navigate change and scale with
  confidence.With two decades of experience guiding clients to
  realize the full potential of the ServiceNow AI Platform, we
  are one of the largest pure-play ServiceNow partners,
  uniquely focused on enabling enterprises to adopt AI they
  trust—AI that delivers lasting business value.

  We #GoBeyondWorkflows to create new kinds of experiences for
  our customers.

  Come join our Crew!

  The Role

  NewRocket is a global team made up of ServiceNow
  professionals who help our customers run and grow their
  ServiceNow environments. We are hiring a ServiceNow Senior
  Software Engineer -AI with strong ServiceNow development &
  implementation experience. The Senior Software
  Engineers/Software Engineers who provide the development of
  project professional services for customers.

   We will provide support and guidance to get you up to speed
  on some of the most amazing projects! We provide official
  ServiceNow training so you can achieve multiple
  certifications. We will set expectations for what success
  looks like. Then we will allow you use your skills and
  experience to come up with innovative solutions to achieve
  customer goals.

  We are #GoingBeyond Come join our crew!

  What You Will Be Doing

  - As a ServiceNow Senior Software Engineer- AI , you will
    interface with end-users, IT teams and key stakeholders to
    gather systems requirements.

  - Design, develop, and deploy AI-driven applications and
    workflows on the ServiceNow platform.

  - Integrate machine learning, natural language processing
    (NLP), and predictive analytics solutions into any of the
    ServiceNow modules (ITSM, ITOM, CSM, HRSD).

  - Manage all aspects of application development, including
    design, coding, debugging, testing, troubleshooting, and
    documenting systems.

  - Write complete programming and perform testing and debugging
    of applications using current programming language and
    techniques.

  - Design custom or product-based solutions based on ServiceNow
    applications

  - Configuring integrations between ServiceNow via REST/SOAP
    web and other applications

  - Reflect impact assessment rules within service maps and
    validate with technical SMEs and stakeholders

  - Participate in user acceptance testing of the resulting
    maps, impact rules and event management work

  - Promote your update sets and data across applicable SN
    environments

  - Remediate any production incidents that arise related to
    this scope

  - Align with existing SN technical lead for map/event work to
    ensure consistent approach that does not break shared
    patterns

  What You Bring Along

  - 3+ years’ experience supporting the implementation,
    administration, configuration, and/or development of
    ServiceNow in 2 or more capabilities (i.e. ITSM,ITOM etc.)

  - Strong experience with ServiceNow AI and automation
    capabilities, including Virtual Agent, Predictive
    Intelligence, Performance Analytics, and Now Assist,
    leveraging AI-driven insights to improve service delivery
    and operational efficiency.

  - Hands-on experience implementing and optimizing Now Assist
    features such as AI-powered case summarization, resolution
    recommendations, and conversational workflows.

  - Experience with integration between ServiceNow and other
    systems/platforms using both mid servers and cloud to
    cloud

  - Experience working with Web Services Integration (SOAP,
    REST) and any bi-directional, automated integration
    between two systems.

  - Data Extraction Technologies (e.g. JDBC, ODBC) or ETL
    integrations

  - Proven experience with implementing ServiceNow CMDB,
    Discovery, Software Asset Management, ITSM, Service
    Catalog, and Workflows to meet business requirements

  - Experience in aspects of ServiceNow scripting including
    Business Rules, Client Scripts, UI Builder, Scripted REST
    APIs, and Scripting.

  - Thrive in strategic planning, resource allocation,
    production methods, and coordination of people and
    resources.

  - Adapts quickly in a fast-paced environment

  Education: 

  - Bachelor’s or Master’s degree in Computer Science,
    Information Technology, AI/ML, or related field.

  Certifications & Knowledge 

  The candidate must be willing and able to continue their
  education within the ServiceNow platform and beyond. It is
  expected that the candidate will be able to complete
  ServiceNow competency Certifications as well as Module
  Accreditations. 

  Preferred Certifications:

  - ITIL Foundation

  - ServiceNow CSA and CAD

  We Take Care of Our People 

  NewRocket is committed to a diverse and inclusive
  workplace. We value and celebrate diversity, believing that
  every employee matters and should be respected and
  heard.  We are proud to be an equal opportunity workplace
  and affirmative action employer, committed to providing
  employment opportunity regardless of sex, race, creed,
  color, gender, religion, marital status, domestic partner
  status, age, national origin, or ancestry, physical or
  mental disability, medical condition, sexual orientation,
  pregnancy, citizenship, military, or Veteran status. For
  individuals with disabilities who would like to request an
  accommodation, please contact hr.in@newrocket.com.
