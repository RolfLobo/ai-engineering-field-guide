description: |
  Senior Security DevOps Engineer (SAP & AI Automation)

  Maersk is going through times of unprecedented change. As we
  aspire to secure sustainable growth of our businesses, we
  need to re-think the way we engage with our customers and
  partners.

  If you are passionate about working in an entrepreneurial
  and ever-changing environment, developing new products that
  engage and provide an enhanced customer experience – you
  maybe what we are looking for.

  We Offer

  Joining Maersk will embark you on a great journey with
  career development in a global organization. As an Senior
  Security DevOps Engineer you will be working with the new
  age SAP Platform, you will gain broad business knowledge of
  the company’s activities globally, as well as take part in
  the transformation of the transport and logistics industry.

  You will work and communicate across geographical and
  cultural borders that will enable you to build a strong
  professional network. We will provide you with opportunities
  that broaden your knowledge and strengthen your technical
  and professional foundation.

  - 8+ years of experience in implementing various SAP Products
    such as SAP ECC 6.0, S/4HANA, SAP Fiori, SAP GRC , SAP BW,
    BTP, IAG, cloud, and AI automation.
  - 3-4 years of Experience in  AI Automations for SAP
  - Strong communication skills coupled with interpersonal
    skills showcasing high leadership qualities and values
  - Promote a culture of learning and feedback.
  - Lead technical discussions and proactively propose best
    practice approaches for SAP Security.
  - Work with the SAP Enablement Platform engineering teams to
    ensure the security and integrity of the Platform is
    maintained through the development and enforcement of
    controls for vulnerability scanning and patch management.

  Key responsibilities.

  - Experience in AI automations; develop comprehensive SAP
    Security design(s), including detailed low-level
    implementation guidance that aligns with the overall
    strategic and security architecture, and includes
    understanding of infrastructure security, SAP system
    security, and the business controls that secure the SAP
    Enablement Platform.• Responsible for driving security
    improvement from design through delivery and into
    operations through good practices and representing the
    importance and business benefit. Act as security
    evangelist and ‘mentor’ to the business, SAP security and
    development teams.• Embedding Maersk’s Secure-by-Design
    and Secure Development Life Cycle principles into the SAP
    Enablement Platform.• Provide build oversight and
    management support for the SAP project team to ensure
    security considerations are carried forward throughout the
    implementation project• Lead SAP Security projects as
    needed, potentially spanning multiple technology platforms
    and functional areas, including facilitating coordination
    across multiple third-party partners.• Provide support for
    ongoing controls and audit activities, including SAP
    Security system monitoring.• Work with the Platform team
    and external partners to develop an appropriate security
    posture for the entire SAP landscape• Work with the Cyber
    Security organisation, highlighting and informing risks
    for inclusion on the Risk Register.• Ability to apply
    security principles and good practice to manage security
    in SAP environments.• Discuss and analyse requirements
    with business stakeholders, and creating developing the
    backlog items with the broader SAP Security team.• Work
    with multiple solution design options, and recommend the
    most appropriate solution considering business priorities,
    technical feasibility, return on investment and delivery
    timelines.• Participate in work estimation, scope
    definition and delivery planning activities through an
    Agile DevOps model.• Lead a cross-skilled SAP Security
    SME’s and Engineers geared towards building and delivering
    solutions that support strategic business outcomes.• Be a
    true servant-leader to the teams by removing roadblocks
    and helping them deliver value to Maersk’s customers.•
    Help your team members grow their careers through regular
    1:1s and coaching• Contribute to discussions on the
    technical roadmap to the platform architecture team by
    helping to connect the dots between teams and the wider
    SAP Platform.• Build and maintain a solid understanding of
    the application areas and the business areas.• Monitors
    implementation of design and/or architecture concepts
    together with the development team. Coaches and consult
    development teams on Security engineering aspects.•
    Experience in vulnerability management within SAP.• Has
    experience in more than 4-5 Full Lifecycle SAP
    Implementation projects. Experience in implementing SAP
    for the logistics industry is a plus.• Experience in
    architecting SAP Security and integrating the SAP systems
    with other SIEM and Log management tools. Experience in
    SAP log management is a plus.• Perform GRC configurations
    and use GRC tools (Access Controls, Process Controls and
    Risk Management) in the creation and maintenance of
    security roles.• Experience in implementing SAP SNC and
    SAP SSO 2 solutions like SAML/ X.509 is required.•
    Experience in implementing SAP interface security and EDI
    security is required.• Working experience with other
    security mechanisms and AI Automations, such as OAUTH /
    HTTPS or any other token-based platform from both the
    application and Database layer (including SAP Kernel at
    the infrastructure layer).• Cloud security experience is
    required. Knowledge of Microsoft Azure security is a
    plus.• Have a strong understanding of Compliance: GDPR,
    SOX, PCI and SoD involved.• SAP GRC Access Controls, SAP
    Certified Technology Professional - System Security
    Architect.• SAP ECC 6.0 to SAP S/4 HANA migration
    experience• SAP systems merger experience• Excellent
    written and verbal communication skills with Stakeholder
    management and interpersonal skills at both a technical
    and non-technical level.• Ability to manage conflicting
    priorities and multiple tasks.• Proven ability to work and
    effectively prioritise in a dynamic, collaborative and
    decentralised work environment.• High attention to detail.

