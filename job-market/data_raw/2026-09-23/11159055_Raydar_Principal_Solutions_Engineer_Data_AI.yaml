title: "Principal Solutions Engineer, Data & AI"
company: Raydar
location: USA
remote: true
work_type: FULL_TIME
description: |
  Our client is a fast-growing MedTech SaaS company building a
  revenue-acceleration platform for medical device and
  diagnostics commercial teams. Founded in 2021, the 38-person
  company combines healthcare claims intelligence, data
  products, and AI-powered workflows to help sales teams bring
  life-changing medical innovations to more patients. The
  company has raised more than $30M from investors including
  Andreessen Horowitz, Fulcrum Equity Partners, Stage 2
  Capital, and LiveOak Ventures.

  We are hiring a Principal Solutions Engineer, Data & AI to
  become the company's founding technical pre-sales and data
  expert. You will define the solutions-engineering function
  from scratch, own the technical outcome of major enterprise
  deals, and connect commercial teams, customers, product, and
  engineering. This is a senior individual-contributor role
  for a hands-on builder who thrives in ambiguity and can
  translate complex healthcare data and AI capabilities into
  clear customer outcomes.

  What you'll do

  • Lead technical discovery, solution design, RFPs, security
  reviews, proof-of-value programs, and data-delivery scoping
  for enterprise deals

  • Help customers configure data and AI products and deliver
  data into Snowflake, Databricks, APIs, and CRM environments

  • Translate customer needs into product requirements and
  technical capabilities into compelling buyer narratives

  • Own the technical narrative for AI and MCP products,
  including agentic workflows powered by healthcare claims
  intelligence

  • Build reusable demo environments, discovery guides, answer
  libraries, and architecture patterns that scale beyond your
  direct involvement

  • Partner closely with commercial, product, data, and
  engineering teams to drive deals forward without waiting for
  direction

  Requirements

  • 5 to 10 years of customer-facing solutions engineering,
  sales engineering, or solutions architecture experience

  • A track record of owning full technical evaluations in
  complex enterprise deals

  • Hands-on experience with modern data platforms such as
  Snowflake, Databricks, and SQL

  • Strong healthcare industry fluency, including practical
  experience with claims data such as CPT, HCPCS, ICD-10, and
  NPI

  • The ability to explain complex data concepts to both
  technical and non-technical customers

  • Daily, hands-on use of modern AI tools such as Claude,
  ChatGPT, Cursor, or similar products

  • US work authorization without current or future visa
  sponsorship

  Bonus points

  • Experience in MedTech, diagnostics, digital health, or
  healthcare commercial data

  • Familiarity with REST APIs, CRM platforms, BI tools,
  Python, Delta Sharing, HIPAA, or SOC 2 requirements

  • Experience with agentic workflows, Model Context Protocol,
  or other LLM-powered enterprise products

  • A background at a healthcare claims, provider-
  intelligence, or real-world-data company

  Benefits

  • Base salary of $175K-$200K

  • Target total earnings of $275K-$325K, including
  $100K-$125K in variable compensation

  • Competitive equity

  • Fully covered medical, vision, and dental insurance

  • 401(k), learning and development budget, home-office
  stipend, and health and wellness stipend

  • Fully remote within the United States

  • Company and team on-sites approximately twice per year

  • Full-time senior individual-contributor position
