description: |
  Your work days are brighter here.

  We’re obsessed with making hard work pay off, for our
  people, our customers, and the world around us. As a Fortune
  500 company and a leading AI platform for managing people,
  money, and agents, we’re shaping the future of work so teams
  can reach their potential and focus on what matters most.
  The minute you join, you’ll feel it. Not just in the
  products we build, but in how we show up for each other. Our
  culture is rooted in integrity, empathy, and shared
  enthusiasm. We’re in this together, tackling big challenges
  with bold ideas and genuine care. We look for curious minds
  and courageous collaborators who bring sun-drenched optimism
  and drive. Whether you're building smarter solutions,
  supporting customers, or creating a space where everyone
  belongs, you’ll do meaningful work with Workmates who’ve got
  your back. In return, we’ll give you the trust to take
  risks, the tools to grow, the skills to develop and the
  support of a company invested in you for the long haul. So,
  if you want to inspire a brighter work day for everyone,
  including yourself, you’ve found a match in Workday, and we
  hope to be a match for you too.

  About the Team

  The AI Practice team is part of Workday’s Professional
  Services organization and is responsible for the technical
  realization of Workday AI for our customers. Our technical
  consultants work across architecture, integrations, data,
  and configuration to ensure that Native AI Agents, the
  Workday Agent Platform, and Sana are deployed in a
  performant, secure, and scalable way.

  About the Role

  As a Senior AI Deployment Engineer, you will be the lead
  technical architect responsible for designing and overseeing
  the delivery of end‑to‑end AI solutions for Workday’s most
  complex global customers. You will work across Native AI
  Agents, the Workday Agent Platform, external LLMs, and Sana
  to define how data flows, integrations, and configurations
  come together to produce trustworthy, high‑impact AI
  experiences.

  You will lead technical workstreams, advise C‑suite and
  technical stakeholders, and collaborate closely with Product
  and Engineering to shape how Workday AI is deployed at
  scale.

  Key Responsibilities

  - Solution Design:Architect end‑to‑end AI solutions across the
    Workday ecosystem, including data flows, integration
    patterns, and technical controls that connect Native
    Agents, custom agents on the Workday Agent Platform, and
    Sana’s knowledge and content capabilities.
  - Strategic Advisory:Act as a trusted technical advisor to
    C‑suite and senior technical leaders, translating AI
    architecture choices into clear business value, risk
    considerations, and long‑term digital transformation
    roadmaps.
  - Technical Leadership:Lead technical delivery for AI
    workstreams, providing oversight for configuration,
    integrations, data preparation, privacy and security
    controls, and model‑related tuning within the Workday
    environment.
  - Innovation & Feedback:Partner closely with Workday Product
    and Engineering teams to share real‑world insights from
    customer deployments, informing the evolution of the Agent
    Platform, AI tooling, and Sana integration capabilities.
  - Ecosystem Integration:Design and validate patterns for how
    Workday AI interacts with third‑party systems and external
    LLMs, ensuring data integrity, security, and adherence to
    Workday’s Ethical AI principles.

  About You

  Basic Qualifications

  Senior Level

  - 5+ years of experience in enterprise software
    implementation, technical architecture, and technical
    consulting (e.g., Workday, HCM/FIN, or similar platforms),
    including leading complex, multi‑system initiatives
  - 1+ years of hands‑on experience with enterprise AI/ML or
    intelligent automation deployments (e.g., LLM‑based
    solutions, RAG architectures, or AI‑driven workflows)

  Principal Level

  - 8+ years of experience in enterprise software
    implementation, technical architecture, and technical
    consulting (e.g., Workday, HCM/FIN, or similar platforms),
    including leading complex, multi‑system initiatives
  - 2+ years of hands‑on experience with enterprise AI/ML or
    intelligent automation deployments (e.g., LLM‑based
    solutions, RAG architectures, or AI‑driven workflows)

  Other Qualifications

  - Strong background in technical architecture, with experience
    designing data flows, integration patterns, and security
    models across SaaS ecosystems and external services
  - Deep familiarity with the Workday ecosystem (HCM and/or
    Financials), including core configuration concepts,
    integration frameworks, and security models, or equivalent
    experience with similar enterprise platforms
  - Practical experience with AI concepts such as LLMs,
    retrieval‑augmented generation (RAG), prompt design, and
    orchestration layers, and how these can be applied in an
    enterprise context
  - Experience in professional services or consulting, leading
    technical delivery for high‑stakes customer programs and
    collaborating closely with engagement managers, functional
    consultants, and customer IT teams
  - Excellent communication skills, with the ability to explain
    complex AI and architectural topics to non‑technical
    stakeholders while engaging deeply with developers, data
    engineers, and product teams
  - Demonstrated decision‑making and work management skills:
    prioritizing technical tradeoffs, managing technical risk,
    and organizing complex work across multiple parallel
    workstreams
  - Experience driving process improvements in technical
    delivery practices (e.g., establishing reference
    architectures, reusable patterns, or automation that
    improves consistency and quality)
  - Strong alignment with Workday’s Ethical AI principles, with
    a focus on designing solutions that are transparent, fair,
    secure, and compliant with data privacy requirements

