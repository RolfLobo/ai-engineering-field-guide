  Employee Wellbeing Initiatives: Programs focused on mental
  health, financial planning, and wellness resources to help
  you thrive inside and outside of work.

  Make an Impact: At bswift, your work directly contributes to
  transforming how organizations approach benefits
  administration and client engagement. Join us to be part of
  an organization that is making a meaningful difference in
  the lives of our clients and their employees.

  At bswift, our mission is clear: Become the preeminent
  benefits administrator through exceptional people,
  innovative technology, and delighted customers. And our
  values are at the heart of everything we do to accomplish
  that mission. We Pursue Excellence, Embrace Accountability,
  Deliver Superior Service, and strive to Be A Great Place To
  Work. We take pride in having an engaged, collaborative team
  that goes the extra mile to get the job done right.

   bswift has been regularly named one of Chicago’s Best and
  Brightest Companies to Work For®, as well as one of the
