description: |
  The Opportunity As an SRE - Enterprise & Cloud Security - AI
  Driven Security - Manager, you will play a pivotal role in
  transforming raw data into actionable insights, enabling
  informed decision-making and driving business growth. Within
  our Cyber, Data & Tech Risk practice, you will apply data,
  algorithms, and software engineering to build and deploy AI
  and Machine Learning solutions at scale. As a Manager, you
  will lead teams and manage client accounts, focusing on
  strategic planning and mentoring junior staff. You are
  accountable for confirming project success and maintaining
  standards. Enhancing your leadership style, you motivate,
  develop, and inspire others to deliver quality. You are
  responsible for coaching, leveraging team members' unique
  strengths, and managing performance to deliver on client
  expectations. With your growing knowledge of how business
  works, you play an important role in identifying
  opportunities that contribute to the success of our Firm.
  You are expected to lead with integrity and authenticity,
  articulating our purpose and values in a meaningful way. You
  embrace technology and innovation to enhance your delivery
  and encourage others to do the same. Responsibilities
  - Leading the design and development of AI-driven security
    solutions to enhance enterprise and cloud security
  - Managing and mentoring teams to deliver data and analytics
    engineering projects that transform raw data into
    actionable insights
  - Implementing machine learning models and AI systems to
    support scalable software and platform solutions
  - Overseeing the integration and deployment of data
    infrastructure and pipelines to support AI and machine
    learning initiatives
  - Utilizing programming languages such as Python and C++ to
    develop and optimize AI algorithms and models
  - Conducting complex data analysis to identify patterns and
    insights that drive business growth and decision-making
  - Collaborating with stakeholders to address data challenges
    and improve data quality and integration
  - Promoting the adoption of innovative technologies and
    practices within the cybersecurity and privacy domain
  - Confirming compliance with professional and technical
    standards in all deliverables
  - Encouraging team development by fostering an environment of
    learning and skill enhancement
  What You Must Have
  - At least a Bachelor's degree
  - At least 5 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Demonstrating proficiency in AI implementation and machine
    learning libraries
  - Excelling in strategic planning and mentoring junior staff
  - Embracing technology and innovation to enhance client
    delivery
  - Managing projects with a focus on planning, budgeting, and
    execution
  The salary range for this position is: $99,000 - $232,000.
  Actual compensation within the range will be dependent upon
  the individual's skills, experience, qualifications and
  location, and applicable employment laws. All hired
  individuals are eligible for an annual discretionary bonus.
