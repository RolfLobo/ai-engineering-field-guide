title: AI/ML Engineer - Dragonfly Portfolio
company: Dragonfly
location: Los Angeles, USA
remote: true
work_type: FULL_TIME
description: |
  Dragonfly is a crypto-native Venture Capital and research
  firm with $3.6B+ in assets under management and 160+
  portfolio companies. Our Talent team connects people with
  roles across our portfolio, opening the door to
  opportunities through our Talent Network.

  This is not a listing for an internal role at Dragonfly.
  This posting connects you directly with one or more
  companies in our portfolio that are actively hiring AI/ML
  Engineers.

  What We’re Looking For:

  - Comfort operating across the full stack, from model
    integration to product-facing features
  - Building autonomous AI agents, agentic workflows, or agent-
    to-agent systems
  - Familiarity with agentic payments, machine-to-machine
    transactions, or AI-native economic primitives
  - Building and deploying AI systems, LLM-powered applications,
    or ML pipelines in production
  - Working with foundation models, fine-tuning, RAG pipelines,
    agents, or inference optimization

  About the role(s):

  Depending on the team, you could be:

  - Building and shipping AI-native products and features end-
    to-end
  - Designing and optimizing LLM pipelines, RAG systems, and
    agentic workflows
  - Integrating AI capabilities into crypto-native
    infrastructure, protocols, or consumer products
  - Working on model evaluation, fine-tuning, and inference
    optimization at scale
  - Collaborating with small, high-ownership teams shipping
    quickly in fast-moving environments

  Even if you don't match every point above but are an
  engineer passionate about AI and/or crypto, we encourage you
  to apply. There may be other opportunities that fit your
  skill set.

  Process:

  - We’ll confidentially match you with portfolio companies
    aligned with your background, skill set, and interests
  - If mutual interest exists between you and a team, we’ll
    facilitate a warm introduction
  - If there isn’t a match today, we’ll keep you top of mind for
    future opportunities

  Compensation

  - Early Career: $110,000–$150,000
  - Mid: $150,000–$200,000
  - Senior: $180,000–$250,000
  - Staff/Leadership: $230,000–$330,000

  The compensation range reflects variation by seniority,
  location, and hiring company. Final compensation is
  confirmed with the specific hiring company.

  Submit your information below, and we’ll reach out if
  there’s a potential fit.
