  Additional Information

  As an employer, we have a lot to offer you. Here’s what you
  get from us:

  - A gross monthly salary starting from €5.216,- to a maximum
    of €7.843,-, depending on your work experience, based on a
    40-hour workweek.
  - Fixed 13th-month bonus: part of it is paid out monthly and
    part in January of the following year. Alternatively, you
    can allocate it to a FLEX & BOOST goal of your choice.
    Click here to read more about it.
  - Annual individual and collective salary increase in
    accordance with our Collective Labour Agreement (CLA).
  - €1,500 per year as a sustainable employability budget, which
    you can use as you see fit for training, coaching,
    courses, or other development activities.
  - Flexible leave days: our colleagues can decide themselves
    (in consultation with their manager) how they manage their
    time off.
  - A healthy work-life balance, including hybrid working (for
    example, 2 days in the office and 3 days from home),
    transition leave, and the option to exchange public
    holidays for a religious or cultural holiday of your
    choice.
  - A home-office webshop to help you set up an optimal
    workspace at home, including a mobile phone and laptop.
  - 50% discount on our products and services, allowing you to
    enjoy affordable internet, calling, and streaming.
  - Excellent commuting allowance: your public transport costs
    are reimbursed in full, or you receive €0.23 per kilometre
    when travelling by car. Prefer cycling? You can claim our
    cycling allowance of €0.40 per kilometre.
  - The option to purchase a lease bike, with a monthly
    contribution from KPN (for employees with a permanent
    contract). From city bikes to e-bikes and from racing
    bikes to speed pedelecs, you choose what you ride.
  - Excellent pension benefits: a total pension contribution of
    25% of your pensionable salary, with KPN contributing
    17.5% and you contributing 7.5%.
