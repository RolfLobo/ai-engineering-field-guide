description: |
  Intetics Inc., a leading American technology company
  specializing in custom software application development,
  distributed professional teams creation, software product
  quality assessment, and “all-things-digital” solutions, is
  looking for a AI Developer (LLM / RAG / Agentic AI) to join
  its innovative team.

  Candidate Profile: Senior AI Developer with 8+ years of
  experience. Strong Python expertise and hands-on experience
  with LLMs, Generative AI, RAG architectures, Agentic AI, and
  Multi-Agent Systems. Experience with Azure AI Foundry, Azure
  OpenAI, Azure AI Search, Azure App Service, Azure Functions,
  LangChain, LangGraph, Semantic Kernel, AutoGen, and CrewAI.
  Knowledge of CI/CD, Docker, GitHub Actions, and Azure
  DevOps. US citizenship is required. English level B2+.

  Core Skills: Python, LLMs, Generative AI, RAG, Vector
  Databases, Agentic AI, Multi-Agent Systems, Azure AI Stack,
  LangChain, LangGraph, Semantic Kernel, AutoGen, CrewAI,
  CI/CD, Docker, GitHub Actions, Azure DevOps.

  Project Responsibilities:

  • Design and develop AI-powered applications using Large
  Language Models (LLMs).

  • Build Retrieval-Augmented Generation (RAG) solutions using
  embeddings, vector databases, and enterprise knowledge
  sources.

  • Develop Agentic AI applications with autonomous planning,
  reasoning, and tool usage.

  • Design and implement multi-agent orchestration frameworks
  where multiple AI agents collaborate to execute complex
  workflows.

  • Deploy and manage AI solutions using Azure AI Foundry,
  Azure OpenAI, Azure AI Search, and Azure App Service.

  • Build APIs and backend services using Python.

  • Collaborate with architects, product teams, and business
  stakeholders to deliver production-ready AI solutions.

  • Participate in architecture discussions and contribute to
  AI best practices and technical standards. Duration: 6
  months+ and more

  Candidate's Portrait:

  Experience: 8+ years

  US citizenship is mandatory.

  Must-haves:

  • Strong proficiency in Python.

  • Hands-on experience with LLMs and Generative AI solutions.

  • Experience implementing Retrieval-Augmented Generation
  (RAG) architectures.

  • Knowledge of Agentic AI concepts and Multi-Agent Systems.

  • Experience with Azure AI Foundry, Azure OpenAI, Azure AI
  Search, Azure App Service, Azure Functions, Azure Storage,
  and Azure Key Vault.

  • Practical experience with LangChain, LangGraph, Semantic
  Kernel, AutoGen, and/or CrewAI.

  • Experience with vector databases and embedding-based
  search solutions.

  • Knowledge of CI/CD pipelines, Docker, GitHub Actions, and
  Azure DevOps.

  • Experience building REST APIs and backend services using
  Python.

  Nice to Have:

  • Experience working in enterprise AI projects.

  • Knowledge of prompt engineering and evaluation frameworks.

  • Experience with monitoring, observability, and AI
