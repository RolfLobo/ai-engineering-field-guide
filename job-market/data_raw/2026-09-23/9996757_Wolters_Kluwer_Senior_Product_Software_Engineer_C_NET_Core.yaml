description: |
  Senior Product Software Engineer

  Experience: 6.5 to 10 years

  Job Summary:

  We are seeking a highly skilled Senior Software Developer
  with strong hands-on experience in Generative AI and Agentic
  Workflow development. The ideal candidate will have a proven
  track record of building real-world, production-grade AI
  solutions using LLMs, multi-agent systems, and AI automation
  frameworks, with a strong emphasis on security, scalability,
  and cost optimization. Experience in Tax, Finance, or
  Banking domains is highly preferred.

  Key Responsibilities

  - Design, develop, and maintain Generative AI–based
    applications and Agentic Workflows
  - Build and orchestrate multi-agent systems leveraging Large
    Language Models (LLMs)
  - Implement Retrieval Augmented Generation (RAG) pipelines,
    embeddings, and vector search solutions
  - Ensure AI security best practices, including data privacy,
    access control, and prompt safety
  - Optimize LLM usage and operational costs through token
    optimization, caching, batching, and model selection
    strategies
  - Architect and deliver scalable, cloud-native AI solutions
    for production environments
  - Collaborate with product, business, and domain teams to
    deliver domain-specific AI solutions
  - Participate in architecture and design reviews, mentor and
    guide junior engineers
  - Implement monitoring, logging, and observability for AI
    systems in production

   Required Skills & Qualifications

  - 6.5 - 10 years of total software development experience in
    the IT industry.
  - 1–2+ years of hands-on experience in Agentic AI / AI
    Workflow development.
  - Strong expertise in building enterprise-scale web and GenAI
    solutions using .NET technologies (C#, ASP.NET, .NET Core)
    with solid OOP fundamentals.
  - Hands-on experience developing modern, responsive front-end
    applications using (Angular/React/Javascript/Typescript)
  - Proficiency HTML5, CSS, and UI frameworks.
  - Hands-on experience with Generative AI and LLM platforms
    such as Azure OpenAI, OpenAI, Anthropic, etc.
  - Solid understanding of Generative AI fundamentals,
    including:
    - Prompt engineering
    - Retrieval Augmented Generation (RAG)
    - Embeddings and vector databases
  - Experience building Agentic Workflows / Agent-based systems
    (AI orchestration knowledge is a plus)
  - Experience using AI-assisted developer productivity tools
    (e.g., GitHub Copilot)
  - Strong experience with cloud platforms, preferably Microsoft
    Azure (AWS/GCP acceptable)
  - Solid understanding of scalable system design
    (Microservices, REST APIs, Cloud-native architectures)
  - Proven experience implementing cost-optimized GenAI
    solutions, including:
    - Token usage optimization
    - Model selection and fallback strategies
    - Caching and batching techniques
  - Experience with CI/CD pipelines, DevOps practices, and
    production deployments

  Preferred Qualifications

  - Domain experience in Tax, Finance, or Banking, particularly
    in compliance-driven systems
  - Experience delivering enterprise-scale, production-grade AI
    solutions
  - Familiarity with governance, compliance, and responsible AI
    practices

