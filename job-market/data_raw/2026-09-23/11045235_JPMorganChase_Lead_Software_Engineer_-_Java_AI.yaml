description: |
  Join us on the Graphite team, where you can help deliver a
  best-in-class payments processing platform that powers
  global expansion. You will work on mission-critical systems,
  leveraging your passion for technology and AI to create
  high-performing, low-latency solutions. Experience the
  excitement of building impactful products that support
  diverse payment flows. We offer a collaborative, agile
  environment where your ideas and expertise are valued, and
  your work directly supports business growth.

  Job Summary:

  As a Lead Software Engineer at JPMorgan Chase within the
  Payments team, you will develop technical solutions for a
  fully cloud-based payments application, focusing on high
  performance and low latency. You will build new payment
  flows end to end, from understanding business requirements
  to coding and supporting solutions in production. In this
  agile team, you will enhance, build, and deliver trusted
  technology products, contributing across multiple technical
  areas to support our objectives. Your role is central to
  driving innovation and operational stability in a rapidly
  expanding business..

  Job Responsibilities:

  - Execute creative software solutions, design, development,
    and technical troubleshooting
  - Develop secure, high-quality production code and review and
    debug code written by others
  - Drive team adoption of enterprise-authorized AI-assisted
    engineering practices to improve code quality, delivery
    speed, and operational outcomes
  - Establish consistent validation standards, including secure
    coding, peer review, and automated testing
  - Promote reuse of effective patterns across the team
  - Apply knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities
  - Lead evaluation sessions with internal teams to assess
    architectural designs and technical credentials
  - Lead communities of practice across Software Engineering to
    promote new and leading-edge technologies
  - Contribute to a team culture of diversity, opportunity,
    inclusion, and respect

  Required Qualifications, Capabilities, and Skills:

  - Hands-on coding experience with a proven track record for
    success
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity, secure handling of
    inputs/outputs, and adherence to resiliency and security
    expectations
  - Experience coaching engineers on safe, compliant adoption of
    AI within delivery practices
  - Practical experience delivering system design, application
    development, testing, and operational stability
  - Advanced proficiency in one or more programming languages,
    ideally Java
  - Proficiency in automation and continuous delivery methods
  - Proficient in all aspects of the Software Development Life
    Cycle
  - Advanced understanding of agile methodologies, including
    CI/CD, Application Resiliency, and Security
  - Demonstrated proficiency in software applications and
    technical processes within a technical discipline (such as
    cloud, artificial intelligence, machine learning, or
    mobile)
  - Knowledge of the financial services industry, IT systems,
    and practical cloud-native experience

  Preferred Qualifications, Capabilities, and Skills:

  - Hands-on AI experience with coding and understanding core
    concepts
  - Ability to self-drive delivery and take ownership end to end

