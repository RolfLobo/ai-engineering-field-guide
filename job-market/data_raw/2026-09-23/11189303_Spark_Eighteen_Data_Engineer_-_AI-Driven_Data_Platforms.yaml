title: Data Engineer - AI-Driven Data Platforms
company: Spark Eighteen
location: New Delhi, IND
work_type: FULL_TIME
company_size: 154 Employees
description: |
  We are seeking a Data Engineer with 5+ years of experience
  in data architecture, ETL, BI, and analytics. The ideal
  candidate should have strong problem-solving and analytical
  skills, experience working in fast-paced production
  environments, and the ability to communicate effectively
  with technical and non-technical stakeholders. AWS and
  healthcare industry experience are preferred.

  Requirements

  - 5+ years of professional software engineering experience,
    with a strong focus on data architecture and BI systems
  - Build and maintain ETL pipelines, data transformations, and
    data models to support reporting and analytics
  - Design and develop BI dashboards and reports that translate
    data into business insights
  - Strong programming skills in Python or Java
  - Strong relational database skills, including schema design,
    scalability, and SQL for querying and extracting data
  - Solid understanding of data concepts including ETL, data
    structures, metadata management, and workflow
    orchestration
  - Experience solving complex data and technology problems in
    production environments
  - Experience with AWS
  - Experience with Agile methodologies (Scrum, Kanban) and bug
    tracking tools such as JIRA
  - Comfortable working in a fast-paced environment with
    enterprise-grade release cycles and short, iterative SaaS
    product cycles
  - Healthcare industry experience, with familiarity with HIPAA,
    SOC, and HITRUST compliance requirements
  - Strong analytical skills with a detail-oriented mindset
  - Strong communication skills, able to translate data-driven
    insights and technical approaches for technical and non-
    technical stakeholders
  - B.S. in Computer Science, Engineering, or a related field

  Benefits

  - Comprehensive insurance coverage that gives you peace of
    mind, so you can focus on doing your best work
  - Flexible work arrangements designed to support sustained
    productivity, personal well-being, and work-life balance
  - Continuous learning and accelerated skill development
    through hands-on projects and mentorship from experienced
    industry leaders
  - Global client exposure across 20+ countries, offering real-
    world experience with diverse markets and business
    environments.
  - Opportunity to work on high-impact, large-scale projects
    that have collectively generated over $1B in measurable
    business value
  - Competitive, market-aligned compensation packages that
    recognize performance, expertise, and long-term
    contribution
  - Monthly demo days that celebrate innovation, showcase your
    work, and give you a real voice in what we build
  - Annual recognition programs and performance-driven awards in
    a truly meritocratic environment
  - Referral bonuses that reward you for helping grow a strong,
    like-minded team
  - A strong problem-solving culture with opportunities to
    tackle meaningful, real-world challenges
  - A positive, people-first workplace that supports happiness,
    balance, and long-term growth
