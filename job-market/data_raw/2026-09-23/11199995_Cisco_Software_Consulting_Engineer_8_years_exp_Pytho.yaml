description: |
  Meet the Team

  CX is a team of outstanding technical guides whose #1 focus
  is to deliver a premier customer experience. We help take on
  the toughest business challenges with network-centric
  solutions that accelerate customer and partner success and
  dedication. Our success is validated through outstanding
  financial results, growing customer happiness metrics,
  industry recognition, and employee happiness scores.

  Your Impact

  - Lead & drive software design, optimization/implementation,
    execution, for projects/accounts to accelerate customer
    outcomes.
  - Support presales activities and translate business
    requirements into solution design.
  - Participate in Statement of Work scoping, review, and
    creation, kick-off meetings
  - Provide/assist customers with development, integration and
    implementation of tools, systems, and service assurance
    for Cisco technologies.
  - Build customer simulations in internal labs to
    resolve/validate issues.
  - Create and deliver customer collateral, portals,
    documentation, and knowledge transfer. Conceptualize and
    deliver Customer Requirements Document, Implementation
    Plan and High Level Design Document
  - Ability to understand and communicate project scope and map
    it to customer business goals and objectives.
  - Receives limited supervision. Resolves methods and
    procedures on new assignments.
  - Involved in strategic projects with high visibility. Active
    participant and initiator.
  - Support solution implementation and strategy plans.
  - Best practices, success stories and IP Collection curation
    and sharing
  - Associate with customers along with appropriate internal and
    external resources (e.g. Cisco account teams, partners) on
    the optimization /strategy/deployment of Cisco services
    and solutions.
  - Acts as a focal point for problem resolution for assigned
    customer engagements. Assures accurate and quick
    resolution of major customer problems across an
    appropriate range of technologies.
  - Create and deliver trainings for new and junior technical
    resources within the team.
  - Provides guidance and mentoring to other engineers. Mentor /
    develop others.

  Minimum Qualifications

  - BE/B.Tech/BSC Computer Science or equivalent 8+ plus years
    professional experience in software development or
    technical consulting.
  - Proficiency in programming using Python, adept in efficient
    usage of AI coding tools.
  - Expertise in Data Structures & Algorithms, Database
    management (MySQL/PostgreSQL/noSQL) finetuning and
    optimization , API design (RESTful services), parsing and
    REGEX, Kafka and Golang
  - Expertise in  software design principles(design patterns),
    Version Control Systems and Linux troubleshooting
  - Experience in all phases of software development lifecycle
    with good working exposure to agile development
    methodologies, software automation/workflow orchestration,
    microservices, containers/K8s, cloud, databases, open
    source etc
  - Exposure to Generative AI, Agentic AI frameworks, LLM-based
    application development
  - Capable of leading interactions with external customers or
    internal stakeholders in consultative manner and guiding
    junior team members.

  Preferred Qualifications

  - Knowledge of Network fundamentals
  - Background in Service Architecture, Service Fulfilment and
    System Integration
  - Good knowledge around topics of Site Reliability Engineering
    (SRE), DevOps, SecOps etc
  - Desirable to have experience in NETCONF, RESTCONF & Yang
    Modelling
  - Prior experience in serverless workflows, bpmn, apache
    airflow or similar.
  - Proven ability to manage multiple projects simultaneously in
    a fast-paced environment with strong verbal, written, and
    presentation skills to effectively communicate complex
    technical concepts to non-technical stakeholders.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.

