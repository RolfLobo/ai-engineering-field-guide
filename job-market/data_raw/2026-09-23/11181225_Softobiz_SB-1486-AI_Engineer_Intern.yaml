  Qualifications & Certifications

  - Pursuing or recently completed B.Tech / B.E. / M.Tech / MCA
    in Computer Science or a related field from a reputable
    institution (or equivalent).
  - Final-year students and recent graduates welcome; strong
    fundamentals matter more than years of experience.
  - Strong data structures, algorithms, and problem-solving
    skills — a competitive-programming track record
    (Codeforces / LeetCode / ICPC / similar) is a strong plus.
  - Hands-on Python, plus any exposure to LLM / agentic AI
    through academic projects or self-learning — with clear
    eagerness to go deep on LangGraph and context engineering.

  Preferred Certifications

  - Any recognised AI/ML or agentic-AI online course or
    certification (e.g. DeepLearning.AI, Anthropic, Microsoft
    Azure AI Fundamentals).
  - Any cloud fundamentals certification (Azure / AWS / GCP) is
    a plus.

  Soft Skills & Cultural Fit

  - Strong analytical mindset with a structured approach to
    design, debugging, and root-cause analysis.
  - Clear written and verbal communication — able to explain
    your approach to technical and non-technical people.
  - Eagerness to learn, high coachability, and the ability to
    take and act on feedback.
  - Collaborative team player who contributes to shared
    standards, code reviews, and knowledge sharing.
