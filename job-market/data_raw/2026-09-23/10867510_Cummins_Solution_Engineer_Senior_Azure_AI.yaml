title: Solution Engineer Senior (Azure + AI)
company: Cummins
location: Pune, IND
work_type: FULL_TIME
company_size: 35,251 Employees
description: |
  Job Summary:

   Responsible for analyzing and gathering business and
  technical requirements to design and document fit-for-
  purpose solutions. Contributes to solution development,
  design, integration and testing, and configuration of
  technology solutions ensuring that delivered solutions
  adhere to defined architecture and security standards. Works
  closely with with cross-functional teams, vendors, and
  business partners to ensure smooth execution and continuous
  improvement in solution performance and quality. Ensure
  seamless solution implementation and effective issue
  resolution.

  Key Responsibilities:

   Supports the design of fit-for-purpose solutions by
  collaborating with stakeholders to identify integration
  points and ensure alignment with business processes and
  goals. Supports technical analysis, design and customization
  of potential solutions including evaluating the technical
  fit and viability of commercial-off-the-shelf products
  versus custom built solution. Develops and maintains
  technical design documents, workflows, and architecture
  diagrams. Assists in defining and executing the test
  strategy and validating solutions against business
  objectives. Ensures smooth interoperability by validating
  integrations and documenting configuration steps. Identifies
  and communicates potential technical dependencies and risks.
  Works with vendors and IT service providers to address
  technical issues, evaluate and improve product functionality
  and ensure proper configuration according to design
  specifications. Designs and implements data migration
  solutions to ensure data accuracy and reliability. Develops,
  designs, tests, maintains and configures solutions and
  systems as needed. Serves as subject matter expert and point
  of contact on content, processes, procedures and
  functionality associated with assigned applications for
  projects and application support (as needed). Documents
  recommendations to enhance business process efficiency and
  increase adoption of standard application features and
  capabilities, aligning solutions with enterprise standards.
  Supports continuous improvement initiatives by following
  established design standards and learning to identify
  potential enhancements in solution design or workflow
  efficiency. Assists technical and infrastructure groups in
  understanding the solution design and specifications. Works
  closely with IT technical service providers to ensure
  outsourced work packages are delivered to specifications,
  meeting key parameters of quality, schedule, cost, data
  privacy, security, performance, and scalability.
  Participates in formal design reviews, cybersecurity reviews
  and code reviews (where applicable) to ensure the detailed
  design specifications have been understood and coding
  standards and cybersecurity regulations have been adhered to
  by the development team(s).

  ResponsibilitiesCompetencies: Security & Compliance
  Principles - Applies standards, tools, and best practices to
  embed security, privacy, and compliance into the
  design/build/test/operate lifecycle for products, services,
  apps, systems, software, and configurations—balancing
  protection, efficiency, and cost. Programming Principles -
  Applies programming languages, frameworks, and patterns to
  design, write, configure, test, and maintain
  software/solutions/systems that are efficient, secure,
  scalable, and reliable. Data Principles - Governs, models,
  secures, implements, and observes data flows to ensure
  integrity, quality, and compliance—enabling trusted,
  scalable, cost-conscious data use. Modern Development
  Practices - Applies modern engineering practices and
  tools—such as Agile/DevSecOps, CI/CD, automated testing, and
  infrastructure as code—to accelerate delivery, improve
  quality, and reduce risk across the SDLC. Solution Design -
  Translate business requirements into integrated designs,
  architectures, patterns, and system interactions that
  deliver customer value and align with enterprise standards
  and subject-matter platforms. Demonstrating Mastery -
  Maintains essential knowledge and proficiency in relevant
  domains, tools, technologies, methodologies, or frameworks
  through targeted credentials and rigorous proficiency,
  future-proofing organizational skills against strategic
  needs. Strategic and Innovative Thinking - Evaluates
  business and technology trends, anticipates future needs,
  develops creative approaches, and frames innovations to
  shape strategy and create durable value with cost-aware
  innovation. Technical Passion & Drive - Models curiosity and
  excitement for technology by self-initiating continuous
  development, experimenting with emerging technologies, and
  identifying insertion opportunities that accelerate business
  performance. Driving Effective Outcomes - Takes ownership,
  acts with urgency, and initiates action to turn goals into
  clear plans, decisions, guardrails, and cadences while
  navigating ambiguity and change to drive momentum and
  deliver consistent results. Engaging with Impact -
  Communicates with clarity and purpose to align stakeholders,
  foster collaboration, build trust, and influence coordinated
  action across teams and functions to accelerate outcomes.
  Values Differences - Recognizing the value that different
  perspectives and cultures bring to an organization. Ensuring
  Customer Success - Embraces a customer-first mindset to
  deliver outcomes by linking customer needs and business
  priorities to aligned solutions, delivery, adoption,
  satisfaction, and realized value through sustained
  engagement that builds partnership and trust. Education,
  Licenses, Certifications: College, university, or equivalent
  degree in Computer Science, Information Technology,
  Business, or related subject, or relevant equivalent
  experience required. This position may require licensing for
  compliance with export controls or sanctions regulations.
  Experience: Intermediate level of relevant work experience
  required. 3-5 years of experience.

