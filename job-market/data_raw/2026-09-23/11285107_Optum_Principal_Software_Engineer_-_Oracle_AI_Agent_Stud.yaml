  Connecting. Growing together. The Oracle AI Agent Studio
  Engineer is responsible for building, testing, and
  supporting AI-powered solutions within Oracle Fusion Cloud.
  This role will work closely with product owners, architects,
  and business teams to deliver AI-enabled workflows,
  integrations, and automation capabilities across Oracle
  applications. The ideal candidate has strong Oracle
  technical skills, experience with enterprise applications,
  and a passion for emerging AI technologies. Primary
  Responsibilities:

  - Configure and maintain Oracle AI Agents and Agentic
    Applications
  - Develop prompts, workflows, actions, and integrations within
    Oracle AI Agent Studio
  - Translate business requirements into scalable technical
    solutions
  - Perform testing, debugging, and defect remediation
    activities
  - Support deployments, environment migrations, and production
    support
  - Collaborate with integration, security, and functional teams
  - Monitor agent performance and investigate production issues
  - Create technical documentation and implementation artifacts
  - Participate in design reviews, testing cycles, and release
    activities
  - Stay current on Oracle AI technologies and industry trends
  - Comply with the terms and conditions of the employment
    contract, company policies and procedures, and any and all
    directives (such as, but not limited to, transfer and/or
    re-assignment to different work locations, change in teams
    and/or work shifts, policies in regards to flexibility of
    work benefits and/or work environment, alternative work
    arrangements, and other decisions that may arise due to
    the changing business environment). The Company may adopt,
    vary or rescind these policies and directives in its
    absolute discretion and without any limitation (implied or
    otherwise) on its ability to do so

  Required Qualifications:

  - Bachelor's degree in Computer Science, Information
    Technology, Engineering, or related field
  - 3+ years of Oracle Cloud technical experience
  - Experience with Oracle HCM, ERP, or Oracle Fusion
    technologies
  - Experience with APIs, integrations, and data analysis
  - Proven solid troubleshooting and debugging skills
  - Proven excellent written and verbal communication skills
  - Demonstrated ability to work effectively in a global team
    environment

  Preferred Qualifications

  - Oracle Cloud certifications
  - Oracle AI Agent Studio experience
  - Oracle Integration Cloud (OIC) experience
  - Generative AI or AI agent development experience
  - Experience with Python, JavaScript, SQL, or similar
    technologies

