description: |
  Meet the Team

  You will be part of a world class Network Security team
  working on the latest security technologies and responsible
  for AI Agentic development of test workflows, System
  testing, Product security testing, Automation and Validation

  Our team works on leading security and threat mitigation
  solutions that are high-performing, scalable and easily
  manageable. we take pride in delivering higher quality
  releases to our customers.

  The Firewall team in India is looking for talented and
  motivated individuals who can work effectively in a team-
  oriented environment and lead/contribute to the development
  and test of our next generation firewall technologies.

  Your Impact

  Architecture & Operations:

  Lead the design, deploy, and optimize enterprise Next-
  Generation Firewalls (NGFW) and cloud-native security
  services.

  Complex Troubleshooting:

  Provide escalation support, isolate network faults, and
  perform deep packet analysis and root cause analysis (RCA)
  during test executions.

  AI, Automation & Scripting:

  Drive Agentic security autonomous flow and build framework
  using the latest AI technologies leveraging Python, REST
  APIs, or configuration automation tools.

  Collaboration:

  Partner with various engineering teams to file critical
  software bugs and scope future product feature requests.

  Minimum Qualifications

  AI Knowledge

  Hands-on experience with LLMs (GPT, Claude) for test
  automation

  Familiarity with Python-based AI libraries and REST API
  integrations

  Knowledge on Docker/Containers

  Networking & Security Protocols:

  Deep mastery and hands-on experiences of TCP/IP, BGP, OSPF,
  IPSec, SSL-VPN, NAT, and DNS/DHCP.

  Cloud & Virtualization:

  Practical knowledge of public cloud environments (AWS,
  Azure, GCP) and containerization/hypervisors (Docker,
  Kubernetes, VMware ESXi).

  Host based Tools and Traffic Generators:

  Working experience and well-versed with Host (Linux/Windows)
  Tools and Traffic Generators to replicate client production
  environments, stress-test firewall capabilities, validate
  Firewall functionalities and find network anomalies.

  Certifications:

  Industry credentials such as the CCNP/CCIE are strongly
  preferred with practical knowledge



  Preferred Qualifications

  Advanced Debugging & RCA: Strong ability to troubleshoot
  complex application, OS, networking, and platform issues and
  drive them to root cause.

  AI/Agentic Engineering: Hands-on experience building AI/LLM-
  based workflows for test generation, failure triage,
  debugging, log analysis, and engineering productivity.

  Technical Leadership: Ability to independently lead complex
  technical initiatives, drive design reviews, and influence
  cross-functional teams.

  Customer & Production Mindset: Ability to translate customer
  and field issues into product-quality improvements and
  proactively identify production risks.

  Communication: Strong communication skills to clearly
  articulate technical risks, trade-offs, quality metrics, and
  recommendations to engineering stakeholders.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.

