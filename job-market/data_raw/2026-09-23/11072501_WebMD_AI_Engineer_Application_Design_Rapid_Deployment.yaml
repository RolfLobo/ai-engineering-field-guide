description: |
  AI Engineer (Application Design & Rapid Deployment)Role
  Overview

  As an AI Engineer, you will serve as one of our "Tiger Team"
  engineers:  a highly versatile, full-stack application
  specialist who designs, builds, and deploys high-impact AI
  applications from end to end. You excel at taking a vague
  business problem and turning it into a production-ready AI
  solution in record time. Leveraging expertise in advanced
  orchestration frameworks like LangGraph and cutting-edge
  developer tools like Claude Code, you will act as the
  primary designer of our user-facing AI applications.

  Beyond execution, you will play a vital role as an
  organizational enabler. You will build the evaluation
  systems necessary to guarantee model performance, integrate
  AI capabilities into workflows safely and effectively.

  Key Responsibilities

  AI Application Design & Rapid Execution

  - End-to-End Application Design: Serve as designer and builder
    for new AI applications, mapping out how the user
    interface, backend logic, and AI agents interact.
  - Advanced Agentic Workflows: Build complex, stateful, multi-
    agent systems and cyclic workflows using LangGraph inside
    and out to handle sophisticated enterprise use cases.
  - Rapid Prototyping: Utilize full-stack capabilities and AI-
    assisted development tools (e.g., Claude Code) to build
    high-fidelity minimum viable products (MVPs) at an
    accelerated pace.

  Evaluation & Quality Assurance

  - LLM Evaluation Tools: Design, build, and maintain automated
    testing and evaluation frameworks (e.g., Ragas, TruLens,
    or custom LLM-as-a-judge pipelines) to measure accuracy,
    latency, hallucinations, and regression across
    applications.
  - Framework Stress-Testing: Act as power-user of our internal
    AI Development Framework, enabling its capabilities in
    real-world scenarios and providing direct feedback to the
    core architecture team.

  Qualifications & SkillsExperience

  - Industry Tenure: 5+ years of professional full-stack
    software development experience.
  - AI Engineering Specialization: Proven track record of
    designing and deploying production-grade LLM applications,
    with a heavy emphasis on multi-agent architectures.
  - The "Tiger Team" Mindset: Experience thriving in fast-paced,
    high-agility environments where requirements evolve
    rapidly and execution speed is critical.

  Technical Skills

  - Orchestration Mastery: Deep, production-level expertise with
    LangGraph for building stateful, multi-agent workflows,
    alongside standard libraries.
  - AI Tooling & Full-Stack Stack: Hands-on mastery of Claude
    Code for accelerated development, combined with robust
    backend skills (Python, Node.js) and modern frontend
    frameworks (React/Next.js).
  - AI Evaluation & MLOps: Strong understanding of LLM
    evaluation methodologies, dataset curation for testing,
    and semantic logging/tracing tools (e.g., LangSmith).
  - Data Layer: Proficient with vector databases (e.g.,
    Pinecone, Qdrant, Milvus), relational databases, and
    integrating unstructured data pipelines.
  - Prompt Engineering: Excellent at prompt engineering best
    practices and with good linguistic intuition for LLM best
    performance.

  Soft Skills & Leadership

  - Excellent communication and collaboration skills.
  - Self-driven and eager to mentor and share knowledge.
  - strong product sense; the ability to balance complex AI
    logic with intuitive user experiences and immediate
    business value.
  - A self-starter who can own an application from a blank text
    document to a live production URL with minimal
    supervision.

  At Internet Brands, we carefully consider a wide range of
  factors when determining compensation, including your
  background and experience. These considerations can cause
  your compensation to vary. We expect the compensation for
  this role to depend on your skills, qualifications, and
  experience. We encourage all interested candidates to apply.
  We expect the compensation for this role starting in the low
  $100ks.

  In addition to our awesome culture, we offer a comprehensive
  benefits package designed to support the health and well-
  being of you and your family. Our benefits include health
  insurance options such as medical, dental, and vision
  coverage, flexible spending accounts (FSA) for medical and
  dependent care, short-term and long-term disability
  insurance, and life and AD&D insurance. We also provide a
  401(k) retirement savings plan with a company match, paid
  time off (PTO), paid holidays, commuter benefits as well as
  access to our Employee Assistance Program (EAP) and well-
  being coaching services. In addition, employees can take
  advantage of voluntary benefits such as home, auto and pet
  insurance, and discounted legal and financial services. For
  more details, feel free to inquire during the interview
  process.

  Internet Brands®, headquartered in El Segundo, Calif, is a
  fully integrated online media and software services company
  focused on four high-value vertical categories: Health,
  Automotive, Legal, and Home/Travel. The company's properties
  and platforms include the WebMD, Medscape, and Henry Schein
  ONE networks, which are the global leaders in their markets;
  Nolo, Avvo, and Martindale, which form the largest consumer
  information provider in the legal market; and CarsDirect,
  Fodor's Travel, and many others which are leaders in their
  key vertical markets. Internet Brands' award-winning
  consumer websites lead their categories and serve more than
  250 million monthly visitors, while a full range of web
  presence offerings has established deep, long-term
  relationships with SMB and enterprise clients. The company's
  powerful, proprietary operating platform provides the
  flexibility and scalability to fuel the company's continued
  growth. Internet Brands is a portfolio company of KKR and
  Warburg Pincus.

  Internet Brands is an equal opportunity employer, and we
  welcome applicants from all backgrounds. We comply with all
  applicable laws and regulations, including the City of Los
  Angeles Fair Chance Initiative for Hiring Ordinance (FCIHO).

  Notice to California residents: you can find information
  about our privacy practices, on:
  https://www.internetbrands.com/work-with-us/cpra
