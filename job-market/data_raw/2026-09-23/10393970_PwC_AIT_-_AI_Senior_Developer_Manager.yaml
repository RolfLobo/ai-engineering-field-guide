description: |
  The Opportunity As an AI Senior Developer Manager, you will
  lead the charge in developing innovative software solutions
  that drive digital transformation and enhance business
  performance. Within our Assurance practice, you will focus
  on designing, coding, and testing applications that
  revolutionize industries and deliver exceptional user
  experiences. As a Manager, you will motivate, develop, and
  inspire your team to deliver quality results. You will be
  responsible for coaching and leveraging team members' unique
  strengths to meet client expectations. You are expected to
  lead with integrity and authenticity, articulating our
  purpose and values in a meaningful way. In this role at PwC,
  you will take ownership of projects, confirming their
  successful planning, budgeting, execution, and completion.
  You will analyze and identify the linkages and interactions
  between the component parts of an entire system, while also
  developing skills outside your comfort zone and encouraging
  others to do the same. By embracing technology and
  innovation, you will enhance your delivery and encourage
  your team to follow suit. This is an opportunity to play a
  pivotal role in identifying opportunities that contribute to
  the success of our firm. Responsibilities
  - Leading the development and implementation of innovative
    software solutions to drive digital transformation
  - Managing and mentoring a team of software engineers to
    deliver quality software products
  - Designing, coding, and testing applications to enhance user
    experiences and meet client needs
  - Utilizing programming languages and software development
    methodologies to create scalable solutions
  - Overseeing the application lifecycle management, including
    planning, development, and maintenance
  - Collaborating with cross-functional teams to identify and
    address software engineering challenges
  - Implementing continuous integration and delivery practices
    to streamline software deployment
  - Conducting code reviews and quality assurance testing to
    maintain software standards
  - Analyzing system components to identify linkages and
    interactions for optimized performance
  - Encouraging team development and skill enhancement through
    coaching and feedback
  What You Must Have
  - At least a Bachelor's degree
  - At least 4 years of experience
  What Sets You Apart
  - Building scalable AI-enabled applications using LLM
    integrations, RAG pipelines, model APIs, data pipelines,
    observability, testing, and secure deployment practices
  - Guiding engineering quality across the team by mentoring
    developers, reviewing designs and code, troubleshooting
    complex issues, and reinforcing software engineering best
    practices
  - Utilizing Acceptance Test Driven Development (ATDD)
    methodologies
  - Excelling in API Management and Application Development
  - Demonstrating proficiency in Continuous
    Integration/Continuous Delivery (CI/CD)
  - Leveraging skills in Business Process Improvement and
    Management
  - Applying knowledge of Microservices and Enterprise
    Application Integration
  - Developing expertise in Software Project Management and
    Planning
  - Embracing change and fostering innovation in software
    engineering
