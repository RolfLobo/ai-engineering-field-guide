description: |
  Core Software AI (CAIE) team is dedicated to inventing and
  deploying the next generation of intelligent, generative AI
  and machine learning technologies that will shape Nokia’s
  future. This team represents a strategic investment and
  unification of our AI initiatives—transitioning from
  isolated features to a cohesive, powerful product and
  platform portfolio. As a central driver of Nokia’s future
  growth, CAIE is building a suite of best-in-class
  technologies recognized across the industry.

  Responsibilities

  - Design, develop, and deploy advanced AI/ML models and
    algorithms to analyze and interpret complex data.
  - Design and implement machine learning models to improve a
    wide range of applications including search, forecasting,
    text mining and more.
  - Develop and implement agentic-based systems for a wide range
    of applications including anomaly detection, root-case
    analysis and more.
  - Optimize existing machine learning models and pipelines for
    performance, scalability, and resource efficiency.

  Qualifications

  Must have:

  - 10+ years of relevant machine learning experience.
  - Experience with machine learning frameworks (e.g.,
    TensorFlow, PyTorch), deep-learning algorithms and LLMs.
  - Experience with search engines and vector databases, along
    with their underlying algorithms.
  - Experience with big data frameworks and technologies such as
    Spark, Kafka, Cassandra.

  Nice to have:

  - MS or PhD in Computer Science or Engineering, Mathematics,
    or a related field.
  - Experience with deployment technologies such as Docker, k8s,
    etc.

  About Us

   Advancing connectivity to secure a brighter world.



  Nokia is a global leader in connectivity for the AI era.
  With expertise across fixed, mobile and transport networks,
  powered by the innovation of Nokia Bell Labs, we’re
  advancing connectivity to secure a brighter world.

