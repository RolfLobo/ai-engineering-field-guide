description: |
  Job Description

  AI Engineer

  Pune

  About the Job:

  NIQ Discover connects businesses around the world to the
  latest cloud-based technology powered by the most accurate
  and trusted data in the industry. It helps businesses
  differentiate and win in a competitive environment by
  uncovering meaningful market and consumer insights from one
  source of truth. Discover reduces the cost and time spent
  managing and analyzing data, empowering companies of all
  sizes to make better strategic decisions, identify growth
  opportunities, and innovate.

  Role Overview

  We are looking for an Engineer to join the Discover AI
  engineering team and contribute to the development of AI-
  powered features and cloud-native applications. This role is
  ideal for early-career engineers who are passionate about
  software engineering, backend development, and emerging AI
  technologies.

  You will work closely with senior engineers, architects,
  product managers, and data scientists to build scalable
  services, APIs, and AI-enabled solutions. The ideal
  candidate has foundational experience in Python development,
  software engineering principles, and a strong willingness to
  learn modern AI engineering frameworks and cloud
  technologies.

  You will contribute to feature development, testing,
  deployment, and production support while gaining exposure to
  enterprise-scale AI systems and microservice architectures.

  Key Responsibilities

  - Develop and enhance backend services using Python, FastAPI,
    and REST APIs.

  - Support implementation of AI-powered workflows and LLM-based
    features.

  - Assist in developing and optimizing RAG, semantic search,
    and vector-search capabilities.

  - Build and maintain APIs, integrations, and microservices for
    Discover platform features.

  - Write clean, maintainable, and testable code following
    engineering best practices.

  - Create and execute unit tests and support automated testing
    initiatives.

  - Participate in code reviews and incorporate feedback from
    senior engineers.

  - Troubleshoot defects and support production issue
    resolution.

  - Contribute to CI/CD pipelines, deployment activities, and
    cloud-native development practices.

  - Monitor application behavior and help improve reliability,
    performance, and observability.

  - Collaborate with cross-functional teams to understand
    requirements and deliver customer-focused solutions.

  - Actively learn new technologies, frameworks, and AI
    engineering practices.

  Qualifications

  Qualifications

  - Bachelor's degree in computer science, Engineering,
    Information Technology, or related field.

  - 1 to 2 years of professional software development
    experience.

  - Strong foundation in Python programming and software
    engineering concepts.

  - Understanding REST APIs and modern web service development.

  - Familiarity with object-oriented programming and design
    principles.

  - Basic understanding of databases and data modeling concepts.

  - Exposure to cloud platforms and modern development
    workflows.

  - Familiarity with Git-based source control and Agile
    development practices.

  - Strong analytical thinking and problem-solving skills.

  - Effective communication and collaboration abilities.

  Preferred Technical Exposure

  OpenAI, Azure OpenAI, LangChain, LangGraph, Prompt
  Engineering, RAG, Vector Search, Semantic Search, Node.js,
  TypeScript, Snowflake, Docker, Kubernetes, Azure AKS, GitHub
  Actions, Distributed Systems, AI-Powered Applications.

  Additional Information

  Our Benefits

  - Flexible working environment
  - Volunteer time off
  - LinkedIn Learning
  - Employee-Assistance-Program (EAP)

