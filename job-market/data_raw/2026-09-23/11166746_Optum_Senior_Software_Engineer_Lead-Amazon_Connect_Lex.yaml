      collaboration skills
    - Proven ability to balance delivery commitments, innovation,
      and technical excellence

  Preferred Qualifications:

  - Certifications in AI/ML, Cloud, Agile, Scrum, or DevOps
  - Experience with AWS, Azure, or Google Cloud AI services
  - Experience with Genesys, NICE, Amazon Connect, Five9, or
    similar CCaaS platforms

