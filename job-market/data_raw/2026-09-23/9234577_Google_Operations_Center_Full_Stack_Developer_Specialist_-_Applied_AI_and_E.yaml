description: |
  Join Us!

  At Google Operations Center we help Google users and
  customers solve problems and achieve their goals—all while
  enjoying a culture focused on improving continuously and
  being better together. We work hard, we play hard, and we
  want you to join us!

  As a Full Stack Specialist, you will be responsible for
  designing and building solutions while coordinating with
  different engineering groups which can help  automate Google
  processes across geographies.

  Position Responsibilities:

  - Build/Design automation framework and the new automation
    solutions.
  - Execute automation opportunities to gain maximum business
    value and operational efficiency gain.
  - Build new Tools and Automation across your business areas
    considering a long term view.
  - Responsible for leading and helping businesses improve the
    efficiency of processes by specializing in leading
    automation opportunities.
  - Own and track the automation initiatives till closure while
    creating visibility of the business gain.

  Minimum Qualifications:

  - Excellent English communication (both written and oral),
    strong problem-solving approach with the ability to absorb
    complex technical concepts and communicate them to a non-
    technical audience.
  - 4+ years of technology experience and knowledge where you
    have been exposed to  frontend (web, mobile, others),
    dashboards, reporting, scripting, databases, etc. and have
    built/executed end to end solutions
  - 2+ years of proven experience of building  business
    automation products/tools using various technologies like
    AI/ML, GCP or any other process automation technology.
  - 3+ years of strong programming experience in languages such
    as Python, JavaScript, or Java.

  Preferred Qualifications:

  - Experience in building tools and automating processes using
    Google stack/products
  - Knowledge of Databases, Rest API, integration, cloud, devops
  - Exposure to business process automation and leading
    automation teams to deliver solutions for operations
  - Experience in evaluating business process automations and
    prioritizing them using different process frameworks like
    Lean, Six Sigma etc.
  - Proficiency in Agile methodologies, with experience in user
    story creation and sprint backlog management.

  Benefits

  - We support you with competitive wages and with comprehensive
    health care including medical, dental and vision coverage
  - We support your family with gender-neutral baby bonding
    leave, 26 week birth-parent maternity leave, and generous
    life, accident and disability insurance minimums
  - Employees who work onsite can enjoy free meals and snacks,
    and fun onsite experiences

