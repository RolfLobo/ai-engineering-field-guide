description: |
  We are seeking a Staff Engineer to join our growing team to
  provide technical direction and implement core parts of a
  new platform we are building to make it easier for customers
  to build AI applications using MongoDB.

  As a Staff Engineer on this new team, you will be
  responsible for providing technical leadership to teams
  developing cutting edge technologies related to enabling
  deployment at scale of AI applications. You will take on
  challenging, high-visibility projects that improve and
  enhance the performance, scalability, and reliability of the
  distributed systems infrastructure for this new product.
  MongoDB engineering teams pride themselves on building high-
  quality software and living MongoDB cultural values every
  day. We value intellectual curiosity and honesty, and
  building together in an environment that prioritizes
  collaboration over competition.

  We're looking to speak with candidates based in the New York
  City area for our hybrid or in-office working models.

  Position Expectations

  - Work closely with product management, product engineering,
    product design peers as well as other teams within the
    company to define the first version and future evolution
    of the service
  - Design, build and deliver well-tested core pieces of the
    platform in collaboration with other vested parties
  - Contribute to shaping architecture, code reviews and
    development practices, developer experience as the teams
    and product grow
  - Mentor fellow engineers and assume ownership and
    accountability of projects

  Qualifications

  - Strong background in building core components for high scale
    compute and data distributed systems
  - 8+ years experience of building distributed systems, and/or
    foundational cloud services at scale and an interest in
    working with Python, Go and Java
  - Proven success in designing, writing, testing, debugging,
    performance tuning, possessing a strong grip on the
    foundational materials of computer science and maintaining
    distributed and/or highly concurrent software systems in
    large, long-lived code bases
  - Track record of identifying problems, implementing solutions
    and delivering complex projects in distributed systems or
    databases
  - Experience leading 15-20 people projects involving
    distributed systems infrastructure from conception to
    successful delivery.
  - Good verbal and written technical communication skills,
    desire to collaborate with colleagues
  - Bonus points for experience with containerization and
    orchestration platforms (e.g. Kubernetes) and AI
    frameworks and tools
  - Be a force multiplier in our software development process.
    Enable teams to deliver great products through leadership
    and technical contributions
  - Eager to learn, with a strong technical background

  About MongoDB

  MongoDB is built for change, empowering our customers and
  our people to innovate at the speed of the market. We have
  redefined the data platform for the AI era, enabling
  builders to create, transform, and disrupt industries with
  software. MongoDB’s unified data platform, the most widely
  available, globally distributed data platform on the market,
  helps organizations modernize legacy workloads, embrace
  innovation, and unleash AI. Our cloud-native platform,
  MongoDB Atlas, is the only globally distributed, multi-cloud
  data platform and is available across AWS, Google Cloud, and
  Microsoft Azure.

  With offices worldwide and over 67,000 customers, including
  AI-native startups and approximately 75% of the Fortune 100,
  relying on MongoDB for their most important applications,
  we’re powering the next era of software.

  Our compass at MongoDB is our Leadership Commitment, guiding
  how and why we make decisions, show up for each other, and
  win. It’s what makes us MongoDB.

  To drive the personal growth and business impact of our
  employees, we’re committed to developing a supportive and
  enriching culture for everyone. From employee affinity
  groups, to fertility assistance and a generous parental
  leave policy, we value our employees’ wellbeing and want to
  support them along every step of their professional and
  personal journeys. Learn more about what it’s like to work
  at MongoDB, and help us make an impact on the world!

  MongoDB is committed to providing any necessary
  accommodations for individuals with disabilities within our
  application and interview process. To request an
  accommodation due to a disability, please inform your
  recruiter.

