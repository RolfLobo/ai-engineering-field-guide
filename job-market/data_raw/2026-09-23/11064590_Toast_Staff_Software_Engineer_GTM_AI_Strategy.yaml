title: "Staff Software Engineer, GTM & AI Strategy"
company: Toast
location: USA
remote: true
work_type: FULL_TIME
description: |
  Toast creates technology to help restaurants and local
  businesses succeed in a digital world, helping business
  owners operate, increase sales, engage customers, and keep
  employees happy.

  Toast is looking for a hands-on Staff Software Engineer to
  join the GTM & AI Strategy Engineering team. In this role,
  you will be a primary builder of 0-to-1 tools designed to
  revolutionize how our sales teams operate. This isn't about
  maintaining legacy systems; it’s about writing the code and
  building the intelligence models that eliminate friction
  across the Go-To-Market stack.

  As a technical lead, you will be responsible for building
  and productionizing agentic workflows and RAG pipelines to
  automate sales processes. You will integrate AI services
  into the tech stack while maintaining rigorous standards for
  observability and performance monitoring.

  A day in the life (Responsibilities)  Hands-on Execution:
  Spend the majority of your time "hands-on-keyboard",
  architecting and coding high-performance backend services
  and ML pipelines.

  - 0-to-1 Development: Build and prototype new internal
    products from scratch that leverage LLMs and Agentic AI to
    automate account research, lead prioritization, and
    complex quoting logic.
  - Infrastructure Integration: Develop the backend connective
    tissue between our custom quoting engine, Salesforce, and
    internal data lakes to ensure a seamless, low-latency end-
    to-end experience.
  - Technical Problem Solving: Act as a key executor to solve
    complex synchronization and architectural challenges
    across the GTM stack, ensuring systems are scalable and
    resilient.
  - Build Great Products: Deliver significant core capabilities
    that have broad impact; take high-level goals and turn
    them into sequenced, production-ready code.
  - Problem Solve: Anticipate shifts in product needs and build
    flexible, decoupled backend systems that can evolve with
    our AI strategy.
  - Deliver Quality: Ensure the reliability of GTM tools by
    building deep observability into every service you ship.

  What you'll need to thrive (Requirements)

  - Deep Backend Expertise: Extensive experience in backend
    languages (Java, Go, Python) with a track record of
    building complex, distributed systems.
  - Applied AI/ML Skills: Practical, hands-on experience
    building LLM agents in a production environment.
  - Systems Architecture: Ability to implement event-driven
    architectures and manage data flow across disparate
    systems with high integrity.
  - Education: Bachelor’s or Master’s degree in Computer
    Science, or a related technical Field.

  What will help you stand out (Nonessential Skills/Nice to
  Haves)

  - Experience building internal "Sales Tech" or "Fintech" tools
    that directly impact revenue.
  - Familiarity with AWS data services (SageMaker, Lambda, SQS).
  - A passion for removing "human-in-the-loop" friction through
    intelligent automation.

  AI at Toast

  At Toast, one of our company values is that we're hungry to
  build and learn. We believe learning new AI tools empowers
  us to build for our customers faster, more independently,
  and with higher quality. We provide these tools across all
  disciplines, from Engineering and Product to Sales and
  Support, and are inspired by how our Toasters are already
  driving real value with them. The people who thrive here are
  those who embrace changes that let us build more for our
  customers; it’s a core part of our culture.

  Our Total Rewards Philosophy  We strive to provide
  competitive compensation and benefits programs that help to
  attract, retain, and motivate the best and brightest people
  in our industry. Our total rewards package goes beyond great
  earnings potential and provides the means to a healthy
  lifestyle with the flexibility to meet Toasters’ changing
  needs. Learn more about our benefits at
  https://careers.toasttab.com/toast-benefits.

  The base salary range for this role is listed below. The
  starting salary will be determined based on skills,
  experience, and geographic location. In addition to base
  salary, our total rewards components include cash
  compensation (overtime, bonus/commissions if eligible),
  equity, and benefits. You can learn more about how we align
  pay with local labor markets in our Geographic Pay Zone
  Philosophy.

  Zone A

  $193,000—$309,000 USD

  Zone B

  $168,000—$269,000 USD

  Zone C

  $151,000—$242,000 USD

  How Toast Uses AI in its Hiring Process

  Throughout the hiring process, our goal is to get to know
  you. We use AI tools to support our recruiters and
  interviewers with tasks like note-taking, summarization, and
  documentation of interviews to ensure they can be fully
  focused on your conversation. All hiring decisions are made
  by people. We ask that you complete interviews and
  assessments on your own, without real-time AI tools,
  recording, or transcription bots, unless we tell you
  otherwise in advance. To learn more:
  https://careers.toasttab.com/ai-in-hiring

  Our Approach to Hybrid Working We embrace a hybrid work
  model that fosters in-person collaboration while valuing
  individual needs. Our goal is to build a strong culture of
  connection as we work together to empower the hospitality
  community, regardless of location. Please visit the
  Locations page on our career site to learn more about our
  in-office expectations by region:
  https://careers.toasttab.com/locations-toast

  People Are the Secret Ingredient in Our Recipe for Success

  At Toast, our employees are our secret ingredient—when they
  thrive, we thrive. The restaurant industry brings together
  people with a wide range of backgrounds, experiences, and
  perspectives, and we value that same breadth at Toast. We
  strive to build a culture grounded in authenticity, respect,
  and humility, where every Toaster has a real opportunity to
  grow, contribute, and do their best work—raising the bar in
  delivering exceptional experiences for our customers and
  each other.

