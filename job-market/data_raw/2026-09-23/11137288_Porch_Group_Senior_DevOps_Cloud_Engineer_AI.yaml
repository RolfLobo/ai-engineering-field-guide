  Job Title: Senior DevOps Cloud Engineer, AI

  Location: India

  Workplace Type: Remote

  Job Summary

  The future is bright for the Porch Group, and we'd love for
  you to be a part of it as our Senior DevOps Cloud Engineer
  with the Information Technology team.

  Help us build world class infrastructure in public cloud,
  mainly GCP and AWS. We are seeking a Senior DevOps Cloud
  Engineer with a strong focus on AI-enabled platforms and
  automation to design, build, and operate highly scalable,
  secure, and intelligent cloud infrastructure.

  As a Senior DevOps Cloud Engineer, you will be responsible
  for designing, building, and operating highly scalable,
  secure, and intelligent cloud infrastructure, while
  maintaining and improving the reliability and performance of
  our company's technology stack.

  You will work closely with development teams to design
  scalable and highly reliable software systems, play a
  critical role in optimizing CI/CD pipelines using AI
  insights, and leverage automation to improve reliability,
  performance, and cost efficiency across cloud environments.

  Your role will involve identifying and resolving complex
  issues before they impact customers, implementing automation
  to streamline our operations, and advocating for best
  practices in reliability, scalability, and maintainability.
  As a senior member of the team, you will mentor junior
  engineers, drive technical initiatives, and collaborate
  across departments to achieve our reliability goals.

  What You Will Do As A Senior DevOps Cloud Engineer

  - Build infrastructure/systems that balance operational
    excellence, security, reliability, performance efficiency,
    and cost optimization.
  - Improve the observability of our systems to anticipate and
    address issues before they become critical, leveraging
    strategies like infrastructure as code, system operational
    and health metrics, CI/CD pipelines, and infrastructure
    automation.
  - Contribute to DevOps roadmaps, helping balance priorities
    like modernizing past infrastructure, supporting new
    projects and deployments, and improving/hardening systems
    where it is needed most.
  - Integrate AI-powered tools into DevOps workflows for
    predictive monitoring, anomaly detection, intelligent
    alerting, and auto-remediation.
  - Leverage AI/ML insights to optimize CI/CD pipelines,
    deployment strategies, and infrastructure performance and
    cost.
  - Build and maintain self-healing systems using AI-based
    observability platforms.
  - Support our initiatives for modernizing/centralizing our
    cloud footprint in partnership with business, analytics,
    software, InfoSec, and data science teams.
  - Design and enforce SDLC, InfoSec, and compliance
    requirements.
  - Assist with root cause analysis/remediation for system
    incidents.
  - Provide support to the engineering team in basic database
    operations (SQL Server, MySQL) in running SQL scripts,
    creating database objects, and troubleshooting performance
    and connection issues.
  - Manage, patch, and monitor MySQL and SQL Server databases
    running in AWS and GCP.
  - Implement Infrastructure as Code (IaC) using Terraform.
  - Design, build, and maintain CI/CD pipelines in GitHub
    Actions for build, test, and deployment workflows.
  - Manage repository structure, branch protection, and access
    controls across the GitHub Organization.
  - Automate release processes and deployment workflows using
    GitHub Actions and Infrastructure as Code.
  - Configure and manage Cloudflare services: DNS, CDN caching
    rules, Page Rules/Rulesets, Load Balancing, Workers, WAF,
    and Zero Trust (Access/Tunnel).
  - Provide 24x7x365 monitoring, incident response, and on-call
    support as part of the DevOps team.
  - Perform other IT related duties or projects, as assigned.

  What You Will Bring As A Senior DevOps Cloud Engineer

  - Bachelor's degree in Computer Science, Software or Systems
    Engineering preferred, or equivalent experience.
  - 8+ years of relevant experience.
  - Expertise with cloud-based systems and containerized
    infrastructure (Linux/OS fundamentals, Kubernetes,
    database systems, cloud networking).
  - Deep expertise with GCP required, with significant expertise
    across two or more (GCP and AWS) preferred.
  - Experience supporting AI/ML platforms and integrating AI-
    powered DevOps tools.
  - Experience working with and supporting database
    infrastructure, mainly MySQL and SQL Server databases, in
    AWS and GCP.
  - Familiarity with LLM-based systems, vector databases, or AI
    APIs.
  - Expertise building common web/internet platform components
    (e.g. proxies, caches, load balancers, firewalls, app/web
    server tiers, DB systems).
  - Unix scripting experience required, and a willingness to
    learn/support technologies you may not presently know.
  - Conceptual and practical knowledge of modern DevOps
    techniques, such as CI/CD, IaC, configuration management,
    and secrets/vault management.
  - Expertise in troubleshooting that spans systems, network,
    and applications in a distributed/microservice
    environment.
  - Hands-on experience with Cloudflare.
  - Strong hands-on experience with GitHub Actions for CI/CD.
  - Experience managing GitHub Organizations, repo permissions,
    and branch protection policies.
  - Candidates that have worked in IT for a United States based
    publicly owned company preferred.
  - Excellent written and communication skills in the English
    language.
  - Proven experience working with US based business teams.
  - Ability to work within core US business hours / time zone
    expectations - Eastern Standard Time (EST) overlap.
  - Working Hours: 8 Hours (Excluding breaks)  4 Core US Hours
    Overlap (7:30pm- 11:30pm IST)  4 flexible hours (IST)
  - Workspace: A quiet, dedicated space to work, and a reliable
    internet connection with a minimum speed of 50 Mbps.

  What You Will Get As A Porch Group Team Member

  Pay Range*: ₹24,75,000 – ₹34,65,000 INR Annually

  *Please know your actual pay at Porch will reflect a number
  of factors among which are your work experience and
  skillsets, job related knowledge, alignment with market and
  our Porch employees, as well as your geographic location.

  Our benefits package will provide you with comprehensive
  coverage for your health, life, and financial wellbeing.

  - Our benefits include medical insurance, accident insurance
    and retiral benefits
  - Our wellness programs include 12 company-paid holidays, 2
    flexible holidays, privilege/earned leave, casual/sick
    leave, paid maternity and paternity leaves, and weekly
    wellness events.

