description: |
  About Us

  Since 1989, SHI International Corp. has helped organizations
  change the world through technology. We’ve grown every year
  since, and today we’re proud to be a $16 billion global
  provider of IT solutions and services.



  Over 17,000 organizations worldwide rely on SHI’s concierge
  approach to help them solve what’s next. But the heartbeat
  of SHI is our employees – all 7,000 of them. If you join our
  team, you’ll enjoy:

  - Our commitment to diversity, as the largest minority- and
    woman-owned enterprise in the U.S.
  - Continuous professional growth and leadership opportunities.
  - Health, wellness, and financial benefits to offer peace of
    mind to you and your family.
  - World-class facilities and the technology you need to thrive
    – in our offices or yours.

  Job Summary

  Join SHI's Applied AI team and help build the next
  generation of AI-powered business applications. You'll
  develop Python services, APIs, and data-driven solutions
  across cloud and on-premises environments while working with
  technologies from NVIDIA, Microsoft, and Google. This role
  is ideal for engineers who love solving complex problems,
  building production software, and learning new technologies
  in a fast-moving AI landscape.

  Role Description

  - Design and develop Python-based services, APIs, and AI-
    enabled applications that solve real business problems.
  - Build applications that process and present data from
    enterprise systems, databases, and external services.
  - Integrate AI capabilities into production software using
    modern techniques such as prompt orchestration, RAG, tool
    use, and agent-based workflows.
  - Design application architectures that balance scalability,
    maintainability, security, and performance.
  - Implement modern authentication and authorization patterns
    across application and API layers.
  - Contribute across the full stack, including React-based user
    interfaces and data integration.
  - Work with technologies and platforms across the Microsoft,
    Google, NVIDIA, and broader AI ecosystems.

  Behaviors and Competencies

  - Communication: Can effectively communicate complex ideas and
    information, and can adapt communication style to the
    audience.
  - Listening: Can recognize underlying messages and non-verbal
    cues in communication, responding appropriately to both
    explicit and implicit information.
  - Presenting: Can prepare and deliver presentations,
    addressing key points and responding to questions with
    clarity.
  - Adaptability: Can adjust to changes in the work environment,
    manage multiple tasks, and effectively handle uncertainty.
  - Problem-Solving: Can identify problems, propose solutions,
    and take action to resolve them without explicit
    instructions.
  - Initiative: Can identify opportunities for improvement,
    propose solutions, and take action without explicit
    instructions.
  - Prioritization: Can identify critical tasks, arrange them
    based on importance, and execute without explicit
    instructions.
  - Time Management: Can generally use time effectively and is
    working towards improving task prioritization and deadline
    management.
  - Technical Expertise: Can apply technical knowledge and
    skills effectively in most situations, with occasional
    guidance.
  - Teamwork: Can work effectively in a team, contributing ideas
    and effort, and respecting the contributions of others.

  Skill Level Requirements

  - Bachelor's degree or equivalent professional experience.
  - 4+ years of professional software development experience
    building production applications.
  - Strong Python development skills.
  - Experience building APIs, backend services, and data-centric
    applications.
  - Experience working with SQL and relational databases.
  - Experience with React or another modern web framework.
  - Familiarity with cloud-native development, containers,
    source control, and CI/CD practices.
  - Ability to learn and apply new technologies in a rapidly
    evolving environment.
  - Strong problem-solving and communication skills.
  - Ability to travel up to 10%.

  Preferred Qualifications

  - Experience building AI-enabled applications using LLMs, RAG,
    agents, MCP, or similar technologies.
  - Experience with Microsoft Azure, Google Cloud, NVIDIA AI
    software, or similar platforms.
  - Experience designing distributed or event-driven systems.
  - Consulting or customer-facing delivery experience.
  - Experience with NVIDIA Blueprints, NIMs, and CUDA.

  The estimated annual pay range for this position is $125,000
  - $150,000 which includes a base salary and bonus. The
  compensation for this position is dependent on job-related
  knowledge, skills, experience, and market location and,
  therefore, will vary from individual to individual. Benefits
  may include, but are not limited to, medical, vision,
  dental, 401K, and flexible spending.

  Equal Employment Opportunity – M/F/Disability/Protected
  Veteran Status
