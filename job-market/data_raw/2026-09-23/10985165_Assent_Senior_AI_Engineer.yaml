description: |
  Company Description

  Assent empowers manufacturers and distributors with the
  intelligence to build sustainable products, meet global
  compliance requirements and drive better business outcomes.

  At the center of our offering is the Assent Network, the
  industry’s most complete Product Intelligence Network,
  bringing together trusted parts and supplier intelligence,
  advanced AI and deep regulatory expertise to help
  organizations identify risk, make informed decisions and
  stay ahead of evolving requirements.

  Trusted by more than 1,000 customers worldwide, Assent helps
  organizations stay ahead of evolving regulations across
  areas including responsible sourcing, human rights due
  diligence, PFAS reporting, Digital Product Passports, and
  other emerging requirements. Our platform empowers
  manufacturers to navigate change with confidence while
  building stronger supplier relationships and driving
  measurable business value.

  With more than 1000 team members across India, North
  America, Malaysia, the European Union, and Kenya, Assent
  brings together global expertise, diverse perspectives, and
  a shared commitment to innovation. Our hybrid work model
  enables teams to collaborate across regions while staying
  connected to the communities where they live and work. As a
  certified B Corporation, we meet rigorous standards of
  social and environmental performance, transparency, and
  accountability, reflecting our commitment to creating
  lasting value for our customers, our people, and the planet.

  People First. Technology Forward.

  Our commitment to People, Culture & Community (PCC) is
  rooted in building a diverse, inclusive, and high-performing
  team. We recruit and retain team members with a range of
  backgrounds, experiences, and perspectives, while fostering
  a culture of belonging where all Assentees are respected,
  supported, and empowered to contribute.

  As we continue to embed AI into how we work, we do so
  thoughtfully, enhancing human potential, supporting better
  decision-making, and prioritizing appropriate oversight,
  privacy, and fairness.

  At Assent, we value your privacy and are committed to
  maintaining transparency in how we handle your personal
  information. As part of our talent acquisition and
  management processes, we may use AI technologies to support
  activities such as resume screening, candidate
  communication, and talent analytics.

  Job Description

  We are seeking an experienced Senior AI Engineer with deep
  expertise in designing and building advanced AI/ML systems,
  Large Language Models (LLMs), Retrieval-Augmented Generation
  (RAG), and agent-based architectures. This role is ideal for
  a highly skilled technologist with 10+ years of software
  development experience (including 3+ years in AI/ML) who
  thrives at the intersection of systems engineering, cloud
  infrastructure, and cutting-edge AI and machine learning
  applications.

  As a Senior AI Engineer, you will architect, implement, and
  optimize AI-driven solutions for enterprise-scale
  environments. You will collaborate closely with cross-
  functional engineering, product, and research teams to
  integrate intelligent features into products and services.
  You will also play a key role in operationalizing AI
  systems, ensuring reliability, security, and performance at
  scale.

  The Senior AI Engineer is a systems-oriented innovator who
  is passionate about building reliable AI platforms, pushing
  the boundaries of applied AI, and driving measurable
  business value through innovation.

  Key Requirements & Responsibilities

  - Design and Develop AI Systems: Design, build, and optimize
    advanced AI solutions including LLMs, RAG pipelines, and
    agent-based architectures.
  - Operationalize AI Agents: Deploy, orchestrate, and manage
    multi-agent systems for enterprise-scale use cases,
    leveraging standards and frameworks like MCP, LangChain
    Agents, CrewAI, AutoGen, or A2A/ADK.
  - Agent Lifecycle Management: Establish practices for agent
    state management, role coordination, monitoring,
    retraining, and rollback to ensure reliability and
    accountability.
  - Autonomy Guardrails: Implement policies, controls, and
    observability to bound agent behavior, prevent runaway
    actions, and align with Responsible AI standards.
  - Integration Architecture: Connect agents with APIs,
    microservices, and message-driven systems to orchestrate
    seamless collaboration across agents, humans, and
    enterprise services.
  - Responsible AI & Security: Apply governance, fairness,
    security, and compliance controls to ensure safe, ethical,
    and regulatory-aligned agent operations.
  - Collaborate Cross-Functionally: Partner with product
    managers, designers, and engineers to co-create AI
    features that deliver business value and improve user
    experience.
  - Drive Continuous Innovation: Stay ahead of emerging trends
    in AI engineering, evaluate and adopt emerging
    tools/frameworks to strengthen the AI platform strategy.
  - Be familiar with corporate security policies and follow the
    guidance set out by processes and procedures of Assent.

  Qualifications

  We strongly value your talent, energy and passion. It will
  also be valuable to Assent if you have the following
  qualifications

  - Master’s or Bachelor’s degree in Computer Science or
    Software Engineering.
  - Industry Experience: 8+ years of professional software
    development, including 3+ years in AI/ML systems (LLMs,
    RAG, agent-based architectures).
  - Programming Excellence: Expert-level coding skills in
    Python, C# and Angular/JavaScript, and experience with
    coding assistants.
  - Agentic AI Tooling: Hands-on experience with standards and
    frameworks such as MCP, A2A/ADK, LangChain, CrewAI, and
    AutoGen.
  - Cloud Expertise: Strong working knowledge of AWS
    (preferred), Azure, or GCP; comfort with cloud-native
    services for LLM workloads.
  - Systems Thinking: Deep understanding of event-driven
    architectures, distributed systems, message brokers
    (Kafka, Rabbitmq, Solace PubSub+), and microservices.
  - DevOps Fluency: Familiarity with CI/CD, Docker, and
    infrastructure-as-code; able to collaborate with DevOps
    teams to ensure scalable and reliable agent operations.
  - Responsible AI Awareness: Understanding of AI security,
    fairness, governance, and compliance frameworks.
  - Product Orientation: Ability to translate business
    challenges into AI/ML solutions, define use cases, and
    engage in early-stage ideation and problem-solving.
  - Collaboration & Communication: Strong ability to engage with
    cross-functional teams, influencing product direction
    while articulating technical trade-offs.
  - Innovation Mindset: Curiosity and passion for applying
    emerging AI/ML techniques to enterprise integration
    challenges.

  Additional Information

  Life at Assent

  Wellness: We believe that you and your family’s well being
  is important. As a result, we offer vacation time that
  increases with tenure, comprehensive benefits packages
  (details vary by country), life leave days and more.

  Financial Benefits: It’s not all about the money – well,
  it’s a little about the money. We understand that financial
  health is important and we offer a competitive base salary,
  a corporate bonus program, retirement savings options and
  more.

  Life at Assent: There is purpose beyond your work. We
  provide our team members with flexible work options,
  volunteer days and opportunities to get involved in
  corporate giving initiatives.

  Lifelong Learning: At Assent, curiosity is not only valued
  but encouraged. You will receive professional development
  days that are available to you the day you start.

  At Assent, we are committed to growing and sustaining an
  environment where our team members feel included, valued,
  and heard. Our diversity and equal opportunity practices are
  guided and championed by our Diversity and Inclusion Working
  Group and our Employee Resource Groups (ERGs).

  Our commitment to diversity, equity and inclusion includes
  recruiting and retaining team members from diverse
  backgrounds and experiences, and fostering a culture of
  belonging where all team members are included, treated with
  dignity and respect, promoted on their merits, and placed in
  positions to contribute to business success.

  If you require assistance or accommodation throughout any
  part of the interview and selection process, please contact
  talent@assent.com and we will be happy to help.

  We use AI to support parts of our recruitment process, such
  as note-taking and initial shortlisting based on job-related
  qualifications. AI does not make hiring decisions. All
  candidates will speak with a real person, and final
  decisions are always made by our recruitment team.
