description: |
  About Snorkel

  At Snorkel, we believe meaningful AI doesn’t start with the
  model, it starts with the data.

  We’re on a mission to help enterprises transform expert
  knowledge into specialized AI at scale. The AI landscape has
  gone through incredible changes since 2015, when Snorkel
  started as a research project in the Stanford AI Lab, to the
  generative AI breakthroughs of today. But one thing has
  remained constant: the data you use to build AI is the key
  to achieving differentiation, high performance, and
  production-ready systems. We work with some of the world’s
  largest organizations to empower scientists, engineers,
  financial experts, product creators, journalists, and more
  to build custom AI with their data faster than ever before.
  Excited to help us redefine how AI is built? Apply to be the
  newest Snorkeler!

  About The Team

  Snorkel's AI Platform organization builds the infrastructure
  and systems that power AI development at scale - synthetic
  data generation, evaluation, agentic workflows, simulation
  environments, LLM infrastructure, and distributed compute.
  Our platform enables engineering and research teams to
  rapidly experiment with models and agents, measure their
  behavior, and turn successful experiments into reliable
  production systems.

  We're a small team operating at the intersection of
  distributed systems and applied AI, and we're in the middle
  of a foundational shift toward agent-first workflows where
  models interact with tools, environments, data, and other
  agents over long-running trajectories. The systems we build
  need to make these inherently non-deterministic workloads
  observable, reproducible, measurable, and scalable. You will
  help define how we do that.

  About The Role

  We're looking for AI Engineers who combine strong software
  and distributed systems fundamentals with experience
  operating AI systems in production. You'll build the
  infrastructure that lets teams create, experiment with,
  evaluate, and operate LLM and agentic workloads at
  significant scale - from synthetic data and evaluation
  pipelines to simulation environments, orchestration systems,
  and LLM infrastructure.

  You'll work on systems where correctness is not defined by a
  single deterministic output. Instead, you'll build the
  infrastructure needed to understand behavior across models,
  prompts, tools, environments, and multi-step trajectories,
  and to continuously improve those systems through
  experimentation and evaluation.

  We are looking to grow our team of AI Engineers, and are
  hiring at multiple levels.

  What You'll Do

  - Design and build infrastructure for running large-scale
    agentic workloads, including multi-step agents interacting
    with tools, external services, sandboxes, and simulated
    environments
  - Build scalable synthetic data generation and automated
    labeling systems that allow teams to create, refine, and
    evaluate high-quality training and evaluation datasets
  - Design evaluation infrastructure for measuring AI system
    behavior across models, prompts, tools, environments, and
    multi-step trajectories - including reproducible
    experiments, benchmark execution, regression detection,
    and continuous evaluation
  - Build orchestration and distributed compute systems for
    running thousands to millions of AI experiments and
    simulations reliably across heterogeneous compute
    environments
  - Develop infrastructure for agent simulation environments,
    including environment provisioning, isolation, lifecycle
    management, and scalable execution
  - Build and operate LLM infrastructure for routing, rate
    limiting, retries, caching, provider failover, cost
    attribution, and efficient execution across multiple model
    providers
  - Instrument agent and model workloads so failures are
    observable and debuggable - capturing traces, model
    interactions, tool calls, environment state, evaluation
    results, latency, reliability, and cost
  - Design systems that make non-deterministic workloads
    reproducible and measurable, allowing engineers to compare
    experiments, diagnose behavioral regressions, and
    understand why an agent succeeded or failed
  - Improve the developer experience for AI experimentation by
    building APIs, SDKs, workflow abstractions, and tooling
    that make it easy to move workloads from local development
    to large-scale production execution
  - Collaborate with research, product, and engineering teams to
    turn experimental AI workflows into reliable, reusable
    platform capabilities

  What You'll Bring

  - 5+ years building production software systems, with
    experience in AI/ML infrastructure, ML platforms,
    distributed systems, data platforms, or backend
    infrastructure
  - Experience operating non-deterministic AI or ML workloads in
    production or at significant scale — you are comfortable
    reasoning about behavior across models, tools,
    environments, and multi-step execution
  - Experience building infrastructure for experimentation,
    evaluation, model development, synthetic data, agentic
    workflows, training, inference, or production ML systems
  - Strong proficiency in Python and experience building
    production-quality APIs, services, and developer tooling
  - Strong background in distributed systems and cloud platforms
    (AWS preferred), including compute orchestration, storage,
    networking, isolation, and failure handling
  - Experience with workflow or distributed execution frameworks
    such as Prefect, Airflow, Dagster, Ray, Kubernetes, or
    similar systems
  - Strong understanding of production system fundamentals -
    observability, telemetry, reliability, performance,
    debugging, incident response, and cost management
  - Ability to reason about AI system quality beyond traditional
    service metrics, including evaluation design, experiment
    reproducibility, behavioral regressions, and model or
    agent variability
  - Track record of leading complex engineering initiatives,
    influencing stakeholders, and delivering measurable impact
  - Ability to work in a fast-paced environment with strong
    technical communication skills
  - Fluency with modern AI and developer tooling and a
    willingness to rapidly evaluate and adopt new models,
    frameworks, infrastructure, and techniques as the
    ecosystem evolves

  Nice to Have

  - Experience building or operating LLM or agent
    infrastructure, including model gateways, agent runtimes,
    tool execution, tracing, or multi-agent systems
  - Experience building evaluation or experimentation platforms
    for LLMs, agents, or other probabilistic systems
  - Experience with synthetic data generation, automated
    labeling, data refinement, or dataset quality systems
  - Experience building reinforcement learning environments,
    agent simulations, benchmarks, or other environment-based
    evaluation systems
  - Experience running large-scale distributed AI workloads
    across containers, Kubernetes, serverless compute,
    sandboxes, or heterogeneous compute environments
  - Experience with LLM observability, tracing, prompt/version
    management, token and cost attribution, rate limiting,
    caching, or multi-provider routing
  - Experience designing isolation and sandboxing infrastructure
    for executing model-generated code or tool calls safely
  - Experience building shared AI platform libraries or SDKs
    consumed by multiple teams, including versioning,
    backwards compatibility, and migration support
  - Experience in hyper-growth startup environments or scaling
    engineering organizations
  - Prior experience as a Tech Lead, Team Lead, or hands-on
    Engineering Manager

  Why This Role

  You'll have meaningful ownership over the infrastructure
  that determines how quickly Snorkel can experiment with,
  evaluate, and productionize new AI systems. This isn't a
  role focused on training a single model or maintaining
  traditional ML pipelines - you'll build the platform that
  makes large-scale AI experimentation possible.

  You'll work on some of the hardest emerging infrastructure
  problems in AI: operating non-deterministic systems
  reliably, reproducing agent behavior across environments,
  evaluating long-running trajectories, scaling simulations
  and experiments, and turning rapidly evolving research
  workflows into robust production systems.

  The architecture decisions made by this team will define how
  Snorkel builds and operates AI systems for years to come.

