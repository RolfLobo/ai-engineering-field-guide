description: |
  Shuru is an AI, Product and Technology Engineering company
  helping startups and enterprises build, scale and modernise
  digital products. Our teams work with high ownership, first-
  principles thinking and an AI-native approach to solve
  meaningful business problems and ship production-grade
  technology.

  We are looking for a hands-on AI Engineer who enjoys turning
  ambiguous problems into working products. You will build AI
  agents, intelligent systems, AI-powered workflows,
  automations, and integrations, taking ideas from prototype
  to production. This role is ideal for a strong builder who
  can work across AI, backend systems, APIs, and real-world
  business workflows. You will work closely with product,
  engineering, and business stakeholders to understand
  problems, experiment with solutions, and ship reliable AI
  systems into production.

  What You’ll Build

  - AI agents capable of reasoning, tool usage, knowledge
    retrieval, and multi-step task execution.
  - Production-grade AI workflows designed around real business
    problems rather than isolated demos.
  - AI-powered applications and automations that improve
    business processes and user experiences.
  - Backend services, APIs, and integrations connecting AI
    systems with databases, business applications, and third-
    party platforms.
  - Knowledge-driven and memory-based AI experiences.
  - Automation solutions across areas such as legal operations
    and other domain-heavy workflows, depending on client
    requirements.
  - Reliable AI systems with evaluation, monitoring, error
    handling, observability, and continuous improvement.

  Requirements

  - Hands-on experience building AI agents, LLM-powered
    applications, automations, or workflow systems.
  - Strong experience with Python, APIs, backend development,
    and system integrations.
  - Experience working with:
  - LLMs and prompt engineering
  - Tool/function calling
  - Structured outputs
  - RAG and knowledge retrieval
  - Agentic workflows
  - Memory and contextual systems
  - Ability to translate ambiguous business requirements into
    practical technical solutions.
  - Strong debugging, experimentation, and problem-solving
    skills.
  - A builder mindset -you enjoy shipping, testing, iterating,
    and improving systems in production.
  - Comfort working with ownership in a fast-moving startup
    environment with limited hand-holding.
  - Strong communication skills and the ability to work with
    product, engineering, and business teams.

  Nice to Have

  - Experience working in legal tech, fintech, climate tech, or
    other domain-heavy environments.
  - Previous experience in an early-stage or high-growth
    startup.
  - Exposure to agent frameworks such as LangGraph, LangChain,
    CrewAI, or similar tools.
  - Experience with vector databases, evaluation frameworks,
    observability, and production AI infrastructure.
  - Experience designing systems where knowledge, memory, and
    business context are core to the user experience.
  - Experience deploying and operating AI applications in
    production.

  Benefits

  - Work on international projects: Be part of a global team
    working with clients from across the world.
  - Regular team outings: Even with remote work, we believe in
    building strong team bonds through regular social and
    team-building events.
  - Collaborative & growth-oriented: Learn from senior
    engineers, work in a collaborative environment, and grow
    professionally with opportunities for career development.
  - Competitive Salary and Benefits
