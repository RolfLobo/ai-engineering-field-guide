  Qualifications & Certifications

  • Bachelor's degree in Computer Science, IT, Engineering, or
  a related field.

  • 4+ years of Full Stack development experience, including
  hands-on experience with Supabase and modern JavaScript
  frameworks.

  • Demonstrated experience working on AI-enabled products,
  not only traditional web applications.

  Preferred Certifications:

  • No certifications are mandatory for this role.

  • Anthropic/OpenAI API or prompt engineering certifications
  (preferred, not required).

  • Cloud platform certifications, e.g., Cloudflare or general
  cloud fundamentals (preferred, not required).

  Soft Skills & Cultural Fit

  • Comfortable maintaining and extending AI-generated
  codebases without needing to rebuild from scratch.

  • Able to independently debug complex issues across
  frontend, backend, database, and automation layers.

  • Strong written communication for technical and product
  documentation in a documentation-driven, specification-first
  environment.

  • Can collaborate directly with founders, translating
  business ideas into concrete product enhancements with
  minimal hand-holding.

  • Comfortable working independently in a startup environment
  with shifting priorities and limited process overhead.

  What We Offer

  • The opportunity to own and shape a production AI SaaS
  platform end to end, not just a single module.

  • Direct, close collaboration with founders on product
  direction and technical decisions.

  • Hands-on exposure to modern AI tooling, including Claude
  Code and AI-assisted engineering workflows.

  • A fast-moving, low-bureaucracy environment where your
  technical decisions have visible, immediate impact.

  • Competitive compensation and room to grow into a technical
  leadership role as the platform scales.

