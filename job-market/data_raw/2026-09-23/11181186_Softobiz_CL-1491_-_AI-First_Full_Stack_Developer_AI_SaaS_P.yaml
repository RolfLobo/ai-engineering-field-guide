description: |
  Job Description:

  We are seeking an experienced AI-First Full Stack Developer
  to support the ongoing development, maintenance, and
  enhancement of an AI-powered SaaS platform focused on
  content creation and audience engagement. You will work
  across intelligent content generation agents, customer
  profiling systems, training resources, and automation
  pipelines that power the platform end to end.

  This role exists because the platform has moved beyond
  initial build and now needs an engineer who can reliably
  maintain, troubleshoot, and scale a production-ready AI
  application while continuing to enhance its AI-driven
  workflows. You will be comfortable working in an AI-assisted
  development environment, extending AI-generated codebases,
  and collaborating directly with founders to turn business
  ideas into shipped product enhancements.

  Your impact will be measured by platform stability, the
  speed and quality of bug resolution, and your ability to
  independently ship improvements across the frontend,
  backend, database, and automation layers.

  Key Responsibilities

  Platform Enhancement & Maintenance

  • Investigate and resolve production issues and customer-
  reported bugs.

  • Maintain existing AI-driven application workflows.

  • Optimize system performance, reliability, and scalability.

  • Improve code maintainability and technical documentation.

  AI Workflow Development

  • Enhance AI-powered content generation modules.

  • Support chatbot and AI assistant functionality.

  • Maintain AI memory, context retention, and user
  personalization workflows.

  • Integrate and optimize LLM-powered features.

  • Support AI prompt orchestration and workflow
  configuration.

  Automation & Integrations

  • Build and maintain automation workflows using n8n.

  • Develop and maintain API integrations between platform
  components.

  • Troubleshoot third-party service integrations.

  • Manage background workflows, triggers, and data
  synchronization.

  Platform Operations

  • Manage development, staging, and production environments.

  • Support deployment and release processes.

  • Ensure platform stability and uptime.

  • Monitor and troubleshoot backend services and
  infrastructure.

  Documentation & AI-Assisted Development

  • Work within a documentation-driven development
  methodology.

  • Maintain detailed product and technical documentation.

  • Utilize Claude Code and AI-assisted engineering tools
  effectively.

  • Follow specification-driven development practices.

