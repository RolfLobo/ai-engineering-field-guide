  Company Description

  Please note:  If you apply and you don't have a good numbers
  of years working in Angular in a professional hands on
  engineering setting, you will be rejected.  This is a
  Principal Angular Engineer role.  Your React experience is
  no good here :-)

  Did you build something using Angular last week? Great! Read
  on!

  We're building a new AI-first planning and simulation
  product from the ground up, and we need a Principal Engineer
  with current, hands-on Angular experience at a senior/lead
  level — this is non-negotiable. If your recent frontend work
  has been in React (even with Angular somewhere in your
  history), this role isn't the right fit, and your
  application won't move forward.

  Backend language is flexible — Go, Python, Java or .NET/C#
  all count — but we do need genuine experience building AI-
  native user experiences: interfaces that generate themselves
  dynamically and respond to natural-language input, not just
  apps that call an AI API. This is enterprise SaaS work, not
  startup or greenfield-website territory, so a background in
  complex, data-heavy applications matters more than a trendy
  stack.



