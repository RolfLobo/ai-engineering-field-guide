  Job Description

  We are seeking a Lead / Principal Engineer (Developer) to
  build a new planning and simulation product from scratch.
  This is a hands-on technical leadership role with a strong
  focus on frontend engineering, combined with the full-stack
  capability to contribute to backend services and
  architectural ownership across UI, data-heavy workflows, and
  integrations with backend APIs.

  You will work within a modern platform environment to
  deliver scalable, secure, and high-performance UI solutions,
  designing AI-first UI patterns that surface automated status
  updates and proactive suggestions rather than relying on
  manual, click-driven interactions. While experience in
  utilities or asset-intensive industries is valuable, the
  primary focus is on enterprise SaaS product development.

  This role suits an engineer who wants to code, lead, and
  shape architecture — primarily on the frontend, with the
  range to work across the stack — while adopting AI-first and
  modern engineering practices, and who is comfortable working
  in a fast-evolving product environment where requirements
  are still being shaped.

  Qualifications

  What You'll Be Doing

  - Building the frontend for a new planning and simulation
    product from scratch, with a strong focus on frontend
    architecture and delivery.

  - Designing UI patterns for an AI-first workflow — surfacing
    automated status updates and proactive suggestions rather
    than manual click-driven interactions.

  - Working closely with backend, UX and product while
    requirements are still being shaped.

  - Handling large, data-heavy views (scheduling, capacity,
    simulation output) with a strong eye on performance.

  - Delivering end-to-end features, from UI through APIs to data
    and deployment, and contributing to backend services in Go
    where needed.

  - Building and maintaining enterprise integrations
    (internal/external systems, APIs, identity services).

  - Contributing to cloud-native architecture (containers,
    CI/CD, observability).

  - Working within and extending platform frameworks.

  - Providing technical leadership: architecture decisions, code
    reviews, mentoring, standards.

  - Ensuring quality, performance, security, and maintainability
    across the stack.

  - Collaborating closely with Product, UX, and cross-functional
    teams.

