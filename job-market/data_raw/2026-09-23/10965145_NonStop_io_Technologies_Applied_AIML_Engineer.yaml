description: |
  About NonStop io Technologies:

  NonStop io Technologies is a value-driven company with a
  strong focus on process-oriented software engineering. We
  specialize in Product Development and have a decade's worth
  of experience in building web and mobile applications across
  various domains. NonStop io Technologies follows core
  principles that guide its operations and believes in staying
  invested in a product's vision for the long term. We are a
  small but proud group of individuals who believe in the
  'givers gain' philosophy and strive to provide value in
  order to seek value. We are committed to and specialize in
  building cutting-edge technology products and serving as
  trusted technology partners for startups and enterprises. We
  pride ourselves on fostering innovation, learning, and
  community engagement. Join us to work on impactful projects
  in a collaborative and vibrant environment.

  Brief Description:

  We're seeking an AI/ML Engineer to join our team. As AI/ML
  Engineer, you will be responsible for designing, developing,
  and implementing artificial intelligence (AI) and machine
  learning (ML) solutions to solve real-world business
  problems. You will work closely with engineering teams,
  including software engineers, domain experts, and product
  managers, to deploy and integrate Applied AI/ML solutions
  into the products that are being built at NonStop io. Your
  role will involve researching cutting-edge algorithms and
  data processing techniques, and implementing scalable
  solutions to drive innovation and improve the overall user
  experience.

  Responsibilities:

  ● Applied AI/ML engineering; Building engineering solutions
  on top of the AI/ML tooling available in the industry today.
  Eg: Engineering APIs around OpenAI

  ● AI/ML Model Development: Design, develop, and implement
  machine learning models and algorithms that address specific
  business challenges, such as natural language processing,
  computer vision, recommendation systems, anomaly detection,
  etc.

  ● Data Preprocessing and Feature Engineering: Cleanse,
  preprocess, and transform raw data into suitable formats for
  training and testing AI/ML models. Perform feature
  engineering to extract relevant features from the data

  ● Model Training and Evaluation: Train and validate AI/ML
  models using diverse datasets to achieve optimal
  performance. Employ appropriate evaluation metrics to assess
  model accuracy, precision, recall, and other relevant
  metrics

  ● Data Visualization: Create clear and insightful data
  visualizations to aid in understanding data patterns, model
  behaviour, and performance metrics

  ● Deployment and Integration: Collaborate with software
  engineers and DevOps teams to deploy AI/ML models into
  production environments and integrate them into various
  applications and systems

  ● Data Security and Privacy: Ensure compliance with data
  privacy regulations and implement security measures to
  protect sensitive information used in AI/ML processes

  ● Continuous Learning: Stay updated with the latest
  advancements in AI/ML research, tools, and technologies, and
  apply them to improve existing models and develop novel
  solutions

  ● Documentation: Maintain detailed documentation of the
  AI/ML development process, including code, models,
  algorithms, and methodologies for easy understanding and
  future reference.

  Qualifications & Skills

  ● Bachelor's, Master's, or PhD in Computer Science, Data
  Science, Machine Learning, or a related field. Advanced
  degrees or certifications in AI/ML are a plus

  ● Proven experience (Min 4 Years) as an AI/ML Engineer, Data
  Scientist, or related role, ideally with a strong portfolio
  of AI/ML projects

  ● Proficiency in programming languages commonly used for
  AI/ML. Preferably Python

  ● Familiarity with popular AI/ML libraries and frameworks,
  such as TensorFlow, PyTorch, scikit-learn, etc.

  ● Familiarity with popular AI/ML Models such as GPT3, GPT4,
  Llama2, BERT etc.

  ● Strong understanding of machine learning algorithms,
  statistics, and data structures

  ● Experience with data preprocessing, data wrangling, and
  feature engineering

  ● Knowledge of deep learning architectures, neural networks,
  and transfer learning

  ● Familiarity with cloud platforms and services (e.g., AWS,
  Azure, Google Cloud) for scalable AI/ML deployment

  ● Solid understanding of software engineering principles and
  best practices for writing maintainable and scalable code

  ● Excellent analytical and problem-solving skills, with the
  ability to think critically and propose innovative solutions

  ● Effective communication skills to collaborate with cross-
  functional teams and present complex technical concepts to
  non-technical stakeholders
