title: Software Developer, Creature Performance (Brahma AI - A DNEG Dedicated Unit of Brahma)
company: BRAHMA AI
location: London, GBR
work_type: FULL_TIME
company_size: 3,001 Employees
description: |
  As a Software Developer in the Creature Performance team,
  you will participate in the development of technologies that
  will deliver new and better deformers, kinematics, solvers
  and frameworks for rigging, Creatures FX, crowds and
  animation. You will work with your peers to ensure these
  technologies interoperate nicely to deliver a consistent
  ecosystem and the best user experience for our artists.

  We are looking for candidates who are passionate about
  digital Creatures technology, knowledgeable about C++ and
  capable of applying and expanding their knowledge in
  algorithms designed to improve the performance and quality
  of our Creatures.



  As well as demonstrating technical skill and initiative,
  your ability to communicate between technical developers,
  non-technical artists and end users will help you thrive in
  this role. We encourage a technically creative attitude and
  are looking for individuals who are willing and able to
  bring their own solutions and ideas to the table.



  We follow Agile development methodologies and you will work
  closely with Product Owners and Stakeholders to understand
  artist needs and deliver bespoke software products. You will
  have influence in all aspects of the software development
  life-cycle; designing, supporting and maintaining software
  as well as integrating tools into our existing pipeline.

  This is an exciting opportunity to join a growing Product
  Development department, contributing to the technology
  behind exceptional VFX and Feature Animation work,
  partnering with smart, creative and versatile teams of
  technologists and artists.



  Must Have

  - Degree in Computer Science, Computer Engineering, or
    relevant professional experience.
  - Programming experience in C++ and Python.
  - Some experience in fields like geometry processing,
    deformable objects or kinematics.
  - Experience developing plug-ins using the Maya or Houdini
    SDK.

  Nice to Have

  - Experience developing solutions for crowds, rigging, cfx,
    animation or motion-capture.
  - GPU programming experience.
