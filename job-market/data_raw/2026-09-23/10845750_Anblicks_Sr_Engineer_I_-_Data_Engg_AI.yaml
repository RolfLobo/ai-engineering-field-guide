description: |
  Job Role: Data Analytics Engineer

  📍 Location: Hyderabad

  💼 Experience: 7+ Years

  About Anblicks

  Anblicks is a Great Place to Work® Certified organization
  and a leading Data, AI, and Cloud consulting company helping
  global enterprises modernize their data platforms and
  accelerate digital transformation. We empower organizations
  with cutting-edge solutions across Data Engineering,
  Analytics, Cloud, and AI.

  We are looking for a passionate Data Analytics Engineer with
  strong SQL and Snowflake expertise to build scalable
  analytics solutions and enable data-driven decision-making
  for enterprise customers.

  Key Responsibilities

  - Design, develop, and maintain curated Silver and Gold layer
    data models in Snowflake.
  - Develop complex SQL queries for data transformation,
    validation, aggregation, and performance optimization.
  - Build interactive dashboards and reports using Sigma
    Computing or other leading BI tools.
  - Translate business requirements into scalable analytics
    solutions and reusable data models.
  - Collaborate with business stakeholders to understand
    reporting needs and deliver actionable insights.
  - Validate data quality, troubleshoot discrepancies, and
    ensure accuracy across reporting solutions.
  - Optimize queries and reporting performance in a cloud-based
    analytics environment.
  - Document data models, business logic, and reporting
    processes.
  - Identify opportunities to improve data quality, reporting
    automation, and analytics capabilities.

  Required Skills & Qualifications

  - 7+ years of experience in Data Analytics, Business
    Intelligence, Analytics Engineering, or Data Engineering.
  - Strong hands-on experience with Snowflake.
  - Advanced SQL skills including Joins, CTEs, Window Functions,
    Aggregations, Query Optimization, and Data Transformation.
  - Experience building dashboards using Sigma Computing, Power
    BI, Tableau, or similar BI platforms.
  - Good understanding of Data Warehousing, Dimensional
    Modeling, and cloud-based analytics architectures.
  - Experience working with business stakeholders to gather
    requirements and deliver reporting solutions.
  - Strong analytical, troubleshooting, and problem-solving
    skills.
  - Bachelor's degree in Computer Science, Information
    Technology, Engineering, or a related field.

  Preferred Skills

  - Experience with Sigma Computing.
  - Knowledge of ETL/ELT processes and modern data integration
    practices.
  - Exposure to cloud platforms such as Azure, AWS, or Google
    Cloud Platform (GCP).
  - Experience supporting enterprise reporting in Healthcare,
    Finance, Retail, or similar domains.
  - Understanding of data quality, governance, and reporting
    best practices.
  - Self-motivated, quick learner with the ability to work
    independently in a fast-paced environment.

  Technical Skills

  Snowflake | SQL | Sigma Computing | Power BI | Tableau |
  Data Warehousing | Data Modeling | Business Intelligence |
  Analytics Engineering | ETL | ELT | Cloud Data Platforms |
  Azure | AWS | GCP
