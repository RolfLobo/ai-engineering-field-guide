description: |
  About the Company

  Meraki Labs is a forward-thinking technology company at the
  forefront of AI innovation. We are dedicated to developing
  cutting-edge solutions that leverage artificial intelligence
  to solve complex real-world problems. Our team comprises
  passionate engineers, researchers, and designers committed
  to pushing the boundaries of what's possible with AI.

  Responsibilities

  - Assist in the design, development, and deployment of AI
    models and applications.
  - Conduct research to stay updated with the latest
    advancements in AI and machine learning.
  - Collaborate with senior engineers to integrate AI solutions
    into existing products and services.
  - Participate in code reviews and contribute to maintaining
    high code quality.
  - Help in data collection, preprocessing, and analysis for
    various AI projects.
  - Document technical specifications and project progress.

  Requirements

  - Currently pursuing a degree in Computer Science, Information
    Technology, Computer Engineering, AI-ML, or AI-DS from a
    top-tier institution (IIT, IISc, BITS, IIIT-
    Hyderabad/Delhi/Bangalore, ISI, top NITs, other NITs and
    IIITs, DTU, NSUT, Jadavpur, COEP, VJTI, PSG, Anna CEG,
    Thapar, Manipal, VIT).
  - Exceptional candidates from non-computing backgrounds from
    top-tier institutes will also be considered.
  - Demonstrable proof of work through contributions to open-
    source projects (GSoC, Outreachy, merged PRs), published
    packages, or projects with actual users.
  - Strong academic performance, indicated by JEE/GATE rank,
    olympiad achievements, ICPC/Codeforces ratings, Kaggle
    standing, or a CGPA of 9+ (department topper preferred).
  - Prior internships at research labs, product companies, or
    funded startups, with longer durations preferred.
  - Hands-on experience with LLM work (agents, RAG, evals, fine-
    tuning) is a significant advantage, though strong
    fundamentals are prioritized for intern-level candidates.
  - A public GitHub profile with readable repositories is
    mandatory for shortlisting.
  - Proficiency in at least one programming language (e.g.,
    Python).
  - Familiarity with AI/ML frameworks (e.g., TensorFlow,
    PyTorch) is a plus.
  - Excellent problem-solving skills and a keen interest in AI
    development.
  - Ability to work effectively in a team environment.
  - Strong communication and interpersonal skills.
