description: |
  Who We Are

  Maybern is transforming the way private fund managers
  effectively manage their funds through cutting edge
  technology: an operating system with deterministic guard
  rails underneath, agents on top. Maybern is founded by top
  engineering experts with deep knowledge of the fund
  management space.

  Private funds manage $15T in capital and are growing at 20%
  YoY, but with increasing regulatory scrutiny and investor
  demands for transparency, the need for more modern, fully
  agentic solutions to help private fund CFOs is crucial.

  This is where Maybern comes in.

  We are equipping fund managers with a fully agentic
  operating system for private fund management, enabling
  private investment managers to focus on what they do best:
  driving returns for their investors. We are backed by
  leading venture capital firms and a large number of
  strategic investors.

  Maybern is an NYC based company with a strong in-office
  culture to drive collaboration, and we are looking to make
  strong additions to our team.

  What We’re Looking For

  We are looking for a seasoned product-focused AI engineer
  that is not afraid to get into the weeds in order to drive
  solutions on our most challenging agentic product problems.
  The problems we solve are highly complex, spanning fund-
  accounting workflows and customer-facing AI experiences, and
  require a product-driven mindset, expert-level technical
  skills, and business acumen to drive the best outcomes for
  our customers. Ideally you have spent a few years working
  hands-on with agentic systems, translating them into
  reliable, real-world product capabilities.

  What You’ll Do

  - Build agentic product experiences: Develop and expand
    customer-facing AI capabilities including Maybern's
    Chatbot, embedded agent assistance, and in-product
    workflows that turn complex, multi-step tasks into simple
    ones.
  - Expand Maybern's MCP: Define and implement the patterns that
    let agents safely and effectively interface with Maybern
    data, broadening what the MCP can do as new use cases
    emerge.
  - Own reconciliation workflows: Build agentic workflows, like
    automated spreadsheet reconciliation, that turn manual,
    error-prone data processes into reliable, one-click
    experiences.
  - Shape product direction: Partner with product, domain
    experts, customers, and engineers to identify where agents
    create the most value across Maybern's product surface.
  - Evolve agent capabilities: Advance how May handles customer
    skills, complex multi-step tasks, and a unified experience
    across agent sessions and email-triggered workflows.

  Who You Are

  - Systems Thinking: You can reason through complex software
    architecture, data flows, and dependencies between product
    surfaces and agents. You design solutions that hold up as
    the MCP and agent capabilities expand.
  - Product Vision: You connect technical decisions to customer
    value. You're excited to understand fund-accounting
    workflows deeply and build agentic experiences that solve
    meaningful problems for customers.
  - AI Fluency: You're comfortable building with and evaluating
    agentic AI systems — critically assessing outputs,
    understanding failure modes, and identifying where agents
    can reliably replace manual work.
  - Navigating Ambiguity: You can make progress when the
    product, technology, and best practices are still
    evolving. You bring structure and judgment to open-ended
    problems without waiting for perfect clarity.

  This Could Be a Great Fit If You

  - Want to build AI-powered products that solve real customer
    problems.
  - Have built agents, chatbots, MCPs, or other AI-powered
    product experiences.
  - Are a strong hands-on software engineer who enjoys shipping
    production software.
  - Can explain how agentic systems should fit into a broader
    product ecosystem.
  - Are excited to learn fund-accounting workflows and apply AI
    to real product problems in fund management.
  - Enjoy partnering with product managers, engineers, domain
    experts, customers, and other stakeholders.
  - Are comfortable working in a small team where priorities
    move quickly and ownership is broad.
  - Believe AI should augment strong engineering judgment, not
    replace the ability to reason about systems and
    architecture.

  Benefits

  - We offer a competitive salary + equity package,
    comprehensive benefits, and a flexible family-friendly
    work environment. Some of our perks include:
    - Comprehensive healthcare benefits
      - Maybern covers 100% of medical, dental, and vision premiums
        for individuals
      - HSA & FSA plans
    - Family-Friendly policies
      - Paid parental leave
    - Flexible schedule
      - Flexible PTO / sick leave
      - WFH as needed to fit your needs
    - 401k
