description: |
  Position: AI Engineer Location: Noida Experience: 7–8 Years
  Job Overview

  We are looking for an experienced AI/ML Engineer with strong
  hands-on expertise in Python, Pandas, Machine Learning, and
  AI to develop and deploy data-driven solutions.

  Key Responsibilities

  - Develop and implement ML/AI models for business
    requirements.
  - Analyze large datasets and identify trends and insights.
  - Build and maintain ML pipelines and workflows.
  - Collaborate with data engineers and cross-functional teams.
  - Work with deep learning frameworks such as TensorFlow,
    PyTorch, or Keras.
  - Support AI/ML model integration and production deployment.
  - Stay updated with emerging AI/ML technologies.

  Required Skills

  - 7–8 years of experience in AI/ML/Data Science.
  - Strong Python, Pandas, Machine Learning, and Statistics
    skills.
  - Experience with Data Analysis & Visualization.
  - Hands-on experience with TensorFlow/PyTorch/Keras.
  - Experience handling large datasets and databases.
  - Bachelor's degree in Computer Science, Mathematics,
    Statistics, or related field.
  - Strong communication and problem-solving skills.

  Preferred

  - Working knowledge of MERN Stack (MongoDB, Express.js, React,
    Node.js).
  - Experience integrating AI/ML models into production
    applications.
