title: AI-Accelerated Full-Stack Engineer
company: Coditude
location: Pune, IND
work_type: FULL_TIME
company_size: 103 Employees
description: |
  Key Responsibilities

  ● End-to-End Delivery: Own features from conception to
  deployment, writing clean, maintainable

  code across the frontend and backend.

  ● AI-Native Workflows: Actively leverage AI development
  workflows (using Claude, LLMs, and nextgen IDEs) to
  accelerate delivery, automate repetitive tasks, and bypass
  traditional roadblocks.

  ● Database & Storage Management: Design, query, and optimize
  database schemas while handling

  cloud storage integration for application assets.

  ● Containerization & Deployment: Use Docker to containerize
  applications, ensuring seamless

  deployment and environment consistency from local setup to
  the cloud.

  ● Independent Problem Solving: Research, troubleshoot, and
  resolve complex technical challenges

  independently before asking for help.

  Technical Stack & Requirements

  ● Experience: 1–3 years of professional software development
  experience.

  ● Frontend: Strong proficiency in Next.js and React.

  ● Backend: Hands-on experience building robust APIs using
  Node.js and/or Python.

  ● Databases: Solid understanding of relational (e.g.,
  PostgreSQL, MySQL) or non-relational (e.g.,

  MongoDB) databases.

  ● Cloud Infrastructure (AWS): An overall understanding of
  cloud computing concepts. Hands-on

  familiarity with deploying, hosting, and managing
  applications on AWS — specifically utilizing EC2

  or ECS, alongside cloud storage solutions like AWS S3.

  ● Docker: Basic-to-medium proficiency with Docker (writing
  Dockerfiles, managing container

  lifecycles, and managing multi-container local
  environments).

  ● AI Fluent: Expert-level familiarity with leveraging Claude
  (via Workbench, APIs, or advanced

  prompting techniques) and other AI coding assistants to
  maximize your engineering velocity.

  Soft Skills & Culture Fit

  ● Zero Hand-Holding: You are highly resourceful. When you
  get stuck, your first instinct is to dive

  into docs, logs, or prompt your AI assistant to help you
  debug before escalating.

  ● High Initiative: You don't wait to be told what to do. If
  you see a broken process, a performance

  bottleneck, or an optimization opportunity, you take charge
  and fix it.

  ● Unabashed Enthusiasm: You genuinely love building software
  and exploring new technologies.

  Your energy elevates the team.
