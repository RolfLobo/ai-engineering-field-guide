description: |
  Job Title: Spec-Driven AI-Assisted Software Developer (AI-
  First / Prompt Engineering Architecture-Led Engineering)

  Employment Type: Full Time

  Experience: 3 to 7yrs



  Position Overview:

  We are seeking a new-age Spec-Driven AI-Assisted Software
  Developer who builds software faster and smarter by
  combining structured specifications, AI copilots, and
  automation with strong engineering fundamentals. This role
  blends software engineering, system design, prompt
  engineering, and AI-driven workflows. Instead of starting
  directly with code, you will follow an AI-first delivery
  approach:

  Think → Specify → Generate → Validate → Refine.



  The ideal candidate already uses AI tools such as ChatGPT,
  GitHub Copilot, Claude or Cursor as part of daily
  development and treats AI as an engineering partner rather
  than just a utility.



  Key Responsibilities:

  Convert business and product requirements into structured
  technical artefacts including: -Technical specifications

  -API contracts

  -ER diagrams

  -Flow diagrams

  -Acceptance criteria

  Create AI-ready, well-structured specifications to enable
  faster and more reliable implementation

  Use AI tools to generate boilerplate code, scaffold APIs and
  services, write automated tests, refactor legacy code and
  produce documentation

  Design and maintain high-quality prompts and reusable AI
  workflows

  Validate, optimise and secure all AI-generated code before
  production use

  Design and build scalable backend and frontend systems using
  .NET, Node.js, React and Next.js

  Develop and maintain REST and GraphQL APIs

  Build backend services, frontend applications, system
  integrations and automation scripts

  Write automated unit and integration tests and ensure
  overall solution quality

  Review AI-generated outputs for performance, security and
  maintainability

  Reduce manual engineering effort by introducing automation
  and internal tooling

  Document engineering patterns, architecture decisions and
  development playbooks

  Create and maintain reusable prompt templates and AI
  delivery frameworks

  Actively contribute to building an AI-first engineering
  culture within the team

  Required Skills & Experience

  3–7 years of hands-on software development experience

  Strong coding skills in at least one of the following: .NET,
  Node.js, TypeScript or React

  Solid experience in API development (REST and/or GraphQL)

  Good understanding of relational and/or NoSQL databases

  Working knowledge of Git and Docker

  Strong understanding of system design and software
  architecture

  Hands-on experience using AI coding tools such as ChatGPT,
  GitHub Copilot, Claude, Cursor or similar

  Strong prompt-engineering and structured-thinking mindset

  Experience creating and working with detailed technical
  specifications

  Ability to review, refine and production-harden AI-generated
  code

  Strong communication, collaboration and documentation skills

  Automation-first and design-first engineering mindset

  Good to Have (Technical Exposure)

  Experience with AWS, Terraform and DevOps tooling

  Exposure to microservices and event-driven architectures

  Experience with AI workflows such as RAG or internal AI
  platforms

  Experience building internal developer tools or accelerators

  Startup or fast-paced product engineering background

  Experience working with GraphQL at scale

  Preferred Qualifications:

  Exposure to cloud-native and modern CI/CD practices

  Prior experience contributing to architectural decisions and
  platform design.

  Demonstrated interest in AI-driven software engineering and
  developer productivity tooling
