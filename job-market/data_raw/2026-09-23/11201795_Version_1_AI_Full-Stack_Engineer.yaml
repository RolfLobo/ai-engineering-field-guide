  Job Description

  Senior AI Full-Stack Engineer

  Build production AI for the future of financial markets.

  Join Version 1 to build intelligent products for a leading
  US-based financial technology and digital assets business
  operating across institutional trading, investment
  management and AI infrastructure.

  You will ship production-grade AI that supports high-value
  decisions across trading, risk and portfolio management.
  Collaborating directly with an experienced US-based
  engineering team, you will build advanced LLM applications,
  real-time data integrations and intelligent products that
  solve genuine problems across financial markets. This is AI
  built for measurable business impact.

  Working directly with Financial Services and engineering
  stakeholders in the United States, you will help identify
  where AI can create meaningful business value and build the
  technology that delivers it.

  Why this opportunity stands out

  - Build greenfield AI products rather than maintain legacy
    applications.

  - Solve genuine challenges across trading, risk and portfolio
    management.

  - Own the journey from business problem and prototype through
    to production.

  - Work across React, Python, AWS, LLMs, agentic workflows and
    real-time data.

  - Influence product direction, architecture and measurable
    business outcomes.

  - Collaborate directly with senior US-based product and
    engineering teams.

  What you will do

  - Partner with product and business stakeholders to understand
    complex Financial Services challenges and define clear
    outcomes.

  - Design and build full-stack AI applications using React,
    Python and AWS.

  - Create responsive, real-time user experiences for AI-powered
    features.

  - Build secure, scalable backend services that integrate with
    LLMs, agentic workflows and enterprise data.

  - Transform AI prototypes into reliable production products by
    addressing security, performance, scalability and
    supportability.

  - Own automated testing, CI/CD, observability and deployment
    using Docker, Kubernetes and Terraform.

  - Advise teams on where AI can create measurable value and
    develop reusable engineering patterns for production-ready
    AI products.

  - Mentor engineers and communicate technical recommendations
    clearly to business and engineering stakeholders.

  Qualifications

  Qualifications

  We are looking for an experienced product engineer who
  combines technical depth with commercial awareness and a
  genuine interest in Financial Services.

  Essential experience

  - 7+ years of professional software engineering experience,
    including ownership of production-grade applications.

  - Strong full-stack engineering experience across frontend,
    backend and cloud infrastructure.

  - Recent hands-on development experience with Python and
    React, or a comparable modern frontend framework.

  - Experience designing APIs and building secure, scalable
    backend services.

  - Strong hands-on AWS experience, including building and
    operating cloud-native applications.

  - Experience with containers, infrastructure as code, CI/CD,
    automated testing and observability.

  - Experience taking prototypes or early-stage products through
    to secure, scalable production.

  - Strong product judgement and the ability to connect
    technical decisions to customer and business outcomes.

  - Experience within Financial Services, fintech, capital
    markets, banking or another regulated environment.

  - A genuine interest in trading, investment management,
    digital assets and cryptocurrency.

  - Confidence communicating architecture, trade-offs and
    recommendations to technical and business stakeholders.

  Technology environment

  React | Python | FastAPI | AWS | Amazon Bedrock | SageMaker
  | AgentCore | Kubernetes | Terraform | Docker | PostgreSQL |
  Databricks | Redis | REST APIs | Server-Sent Events |
  WebSockets | LLMs | Agentic workflows

  You do not need experience with every technology listed. We
  value strong engineering fundamentals, relevant technical
  depth and the judgement to choose the right solution for the
  business problem.

  Valuable additional experience

  - Capital markets, trading, risk or portfolio management
    platforms.

  - Digital assets, cryptocurrency, blockchain or tokenisation.

  - LLM or agentic AI products, retrieval-augmented generation,
    embeddings or vector search.

  - Designing AI products around accuracy, latency, resilience,
    user trust and graceful degradation.

  - Authentication and authorisation using OAuth2, OIDC, SSO or
    RBAC.

  - Technical leadership or mentoring across engineering teams.



