description: |
  Role: AI/ML Engineer

  Qualification: B.E./B.Tech.

  Experience: 3 years of relevant experience

  Job Description:

  As an AI/ML Engineer, you will focus on integrating and
  scaling GenAI and ML features within our cloud-based test
  automation platform. You’ll collaborate with the product and
  engineering teams to design, implement, and optimize AI-
  driven functionality, ensuring it enhances the customer
  experience while being reliable and scalable.

  Responsibilities:

  - Enhance our platform by integrating generative AI and ML
    features for intelligent test automation.
  - Build, deploy, and manage ML models on cloud platforms.
  - Improve and extend existing AI/ML capabilities already
    integrated into the product.
  - Collaborate with engineering to ensure smooth integration of
    AI/ML features into the SDLC.
  - Monitor performance of deployed models, troubleshoot issues,
    and optimize results.
  - Automate and streamline deployment workflows using CI/CD
    pipelines.
  - Stay current with advancements in GenAI, ML, and cloud tools
    to identify opportunities for the product.

  Required Skills:

  - 3 years of experience building and deploying ML/AI solutions
    in production.
  - Proficiency in Python and experience with ML frameworks
    (TensorFlow, PyTorch, scikit-learn, or Keras).
  - Hands-on experience deploying ML solutions on cloud
    platforms.
  - Familiarity with generative AI models / LLMs and their use
    in applied business cases.
  - Experience in LLM fine-tuning and integrating models into
    applications.
  - Strong understanding of ML algorithms, deep learning, and
    data preprocessing.
  - Experience with CI/CD pipelines and automation in a cloud
    environment.
  - Knowledge of software testing practices (a plus for aligning
    with our platform).

  Nice to have:

  - Experience with AWS services (Bedrock, SageMaker, etc.)
  - Prior experience in test automation or DevOps tooling
  - Hands-on work with LLM fine-tuning and prompt engineering
  - Exposure to test automation frameworks and related tools

  Why AlgoShack?

  AlgoShack is a cutting-edge IT product-based company focused
  on software test automation. At AlgoShack, you'll work on
  innovative projects with the latest technologies in a
  collaborative environment. We offer ample growth
  opportunities, a culture that values work-life balance, and
  competitive benefits.
