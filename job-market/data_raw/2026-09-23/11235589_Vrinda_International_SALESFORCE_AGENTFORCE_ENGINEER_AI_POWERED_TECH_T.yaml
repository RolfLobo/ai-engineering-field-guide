  • Review configurations and Salesforce code

  • Troubleshoot agent behavior and performance issues

  • Collaborate with stakeholders and guide development teams

  • Support solution design, estimation and technical
  leadership

  • Ensure scalability, security and platform best practices

   MUST-HAVE SKILLS

   Agentforce & Agentforce Vibes

   Salesforce Development

   Apex & LWC

   Salesforce Flows

  REST/SOAP Integrations

   Conversational AI / Agent-based workflows

   Governor Limits & Performance Optimization

   CERTIFICATIONS

  • Salesforce Platform Developer I – Mandatory

  • Salesforce Administrator – Mandatory

  • Agentforce Specialist – Mandatory / In Progress

  • Salesforce AI Associate – Preferred

  ADDITIONAL REQUIREMENTS

  • 8–12 years of overall experience

  • Strong Salesforce implementation experience

  • Hands-on Agentforce implementation experience

  • Agile/Scrum experience

  • Strong stakeholder communication & technical leadership
