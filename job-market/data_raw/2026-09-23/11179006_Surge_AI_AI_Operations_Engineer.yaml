description: |
  About Us

  Our mission is to raise AGI with the richness of human
  intelligence — curious, witty, imaginative, and full of
  unexpected brilliance.

  Surge was founded by engineers and researchers who dreamed
  of building the next generation AI. We're building a
  platform that powers the most powerful models in the world
  in partnership with companies like Anthropic, Google,
  Microsoft, and Meta.

  At Surge, we believe the path to AGI isn't just about
  scaling compute—it's about embracing the unlimited ceiling
  of human intelligence and creativity in the data that shapes
  these systems. Our platform combines elite human expertise
  with cutting-edge tools for scalable oversight, from
  building rich RL environments to conducting rigorous
  evaluations that go beyond benchmarks. We've run a
  profitable business from day one without raising venture
  funding.

  The Role

  As an AI Operations Engineer at Surge, you'll lead
  initiatives that directly impact our products and our
  customers. You'll be part of our operations team and
  collaborate closely with engineering solve our most complex
  challenges.

  This role is ideal for someone earlier in their career — or
  looking to apply a technical background in a new context —
  who thrives in rapidly scaling, high-ambiguity environments.
  You'll spend a meaningful portion of your time designing and
  building — whether that's data processing pipelines, custom
  internal tooling, or AI-powered systems that improve how we
  deliver and evaluate work at scale. You'll also own the end-
  to-end design and execution of data collection projects for
  frontier AI labs — defining task structures, building
  quality frameworks, and shipping datasets that directly
  improve the world's most advanced models.

  What You’ll Do

  - Design and build scalable systems and tooling — including
    data processing pipelines, automation workflows, and AI-
    based quality control tools — working closely with
    engineering to ship solutions to real operational
    problems.
  - Establish and expand scalable processes to enhance customer
    support and value delivery.
  - Drive execution of multiple simultaneous cross-functional
    projects, setting timelines and managing deadlines.
  - Interface with a variety of technical and non-technical
    stakeholders.

  What We’re Looking for

  - Background in CS, engineering, or another quantitative field
    preferred.
  - Hands-on coding experience (Python or similar) and comfort
    building tools and systems from scratch — not just
    scripting, but designing solutions to real operational
    problems.
  - Proven track record of navigating ambiguity and executing
    complex, cross-functional projects in a high-performing
    environment.
  - Strong interpersonal skills that enable you to influence
    without authority and build cross-organizational
    alignment.
  - Comfortable working through trade-offs, balancing competing
    priorities, and having your mind changed.
  - Deep interest in AI systems — direct AI/ML experience valued
    but not required.
