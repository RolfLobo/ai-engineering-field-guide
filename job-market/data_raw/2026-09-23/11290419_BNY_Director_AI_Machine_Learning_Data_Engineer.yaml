description: |
  Director, AI / Machine Learning Data Engineer

  At BNY, our culture allows us to run our company better and
  enables employees’ growth and success. As a leading global
  financial services company at the heart of the global
  financial system, we influence nearly 20% of the world’s
  investible assets. Every day, our teams harness cutting-edge
  AI and breakthrough technologies to collaborate with
  clients, driving transformative solutions that redefine
  industries and uplift communities worldwide.

  Recognized as a top destination for innovators and champions
  of inclusion, BNY is where bold ideas meet advanced
  technology and exceptional talent. Together, we power the
  future of finance – and this is what #LifeAtBNY is all
  about. Join us and be part of something extraordinary.

  We’re seeking a future team member for the role of Director,
  AI / Machine Learning Data Engineer to join our AI Hub team.
  This role is located in New York, NY or Lake Mary, FL

  In this role, you’ll make an impact in the following ways:

  - Managing multiple, complex development projects, often
    global in scope
  - Defining resource requirements and allocations, monitoring
    and improving quality, and ensuring best practice
    development techniques
  - Providing subject matter expertise to teams, as needed
  - Developing group-wide business plans and participating in
    firm-wide initiatives as per the direction from management
  - Leading identification of risks and proposing and
    implementing mitigation plans
  - Handling escalations and acting as an advocate for change
    management, encouraging innovation and creativity in
    technology solutions

  To be successful in this role, we’re seeking the following:

  - Bachelor's degree in computer science engineering or a
    related discipline, or equivalent work experience
    required; advanced degree is beneficial
  - 12+ years of experience in software development required;
    experience in the securities or financial services
    industry is a plus
  - At least 6-8 years of experience managing development
    project teams
  - Experience in the securities or financial services industry
    is a plus

  At BNY, our culture speaks for itself, check out the latest
  BNY news at:

  BNY Newsroom

  BNY LinkedIn

  Here’s a few of our recent awards:

  - America’s Most Innovative Companies, Fortune, 2025
  - World’s Most Admired Companies, Fortune 2025
  - “Most Just Companies”, Just Capital and CNBC, 2025

  Our Benefits and Rewards:

  BNY offers highly competitive compensation, benefits, and
  wellbeing programs rooted in a strong culture of excellence
  and our pay-for-performance philosophy. We provide access to
  flexible global resources and tools for your life’s journey.
  Focus on your health, foster your personal resilience, and
  reach your financial goals as a valued member of our team,
  along with generous paid leaves, including paid volunteer
  time, that can support you and your family through moments
  that matter.

  BNY assesses market data to ensure a competitive
  compensation package for our employees. The base salary for
  this position is expected to be between $127,000 and
  $228,000 per year at the commencement of employment.
  However, base salary if hired will be determined on an
  individualized basis, including as to experience and market
  location, and is only part of the BNY total compensation
  package, which, depending on the position, may also include
  commission earnings, discretionary bonuses, short and long-
  term incentive packages, and Company-sponsored benefit
  programs. This position is at-will and the Company reserves
  the right to modify base salary (as well as any other
  discretionary payment or compensation) at any time,
  including for reasons related to individual performance,
  change in geographic location, Company or individual
  department/team performance, and market factors.

  BNY is an Equal Employment Opportunity/Affirmative Action
  Employer - Underrepresented racial and ethnic
  groups/Females/Individuals with Disabilities/Protected
  Veterans.
