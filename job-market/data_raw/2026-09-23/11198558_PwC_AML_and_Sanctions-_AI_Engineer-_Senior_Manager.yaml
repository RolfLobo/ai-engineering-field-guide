description: |
  The Opportunity As an AML and Sanctions- AI Engineer- Senior
  Manager, you will leverage data and analytics to provide
  strategic insights and drive informed decision-making for
  clients. Within our Risk & Regulatory practice, you will
  develop and implement innovative solutions to optimize
  business performance and enhance competitive advantage. As a
  Senior Manager, you will apply your skills and influence to
  deliver quality results, motivating and coaching teams to
  solve complex problems. You will navigate through ambiguity,
  applying sound judgment to recognize when to take action and
  when to escalate. In this role at PwC, you will craft and
  convey clear, impactful messages that tell a holistic story,
  applying systems thinking to identify underlying problems
  and opportunities. You will validate outcomes with clients,
  share alternative perspectives, and act on client feedback.
  Your ability to develop and sustain diverse and inclusive
  teams, along with your commitment to excellence, will
  contribute to the success of our firm. This position offers
  the chance to deepen your skills, stay relevant, and make
  impactful decisions that resolve issues hindering team
  effectiveness. Responsibilities
  - Leading the development and implementation of innovative
    data-driven solutions to optimize business performance
  - Guiding teams in leveraging advanced analytics techniques to
    provide strategic insights for clients
  - Utilizing skills in data architecture development and data
    pipeline management to enhance data quality and
    accessibility
  - Building and maintaining relationships with stakeholders to
    identify and address data challenges in the banking and
    capital markets sector
  - Developing and overseeing the deployment of scalable data
    visualization and analytics solutions to drive informed
    decision-making
  - Promoting continuous process improvement and embracing
    change to enhance competitive advantage
  - Validating outcomes with clients and acting on feedback to
    refine strategies and solutions
  - Directing teams through complex and uncertain situations,
    demonstrating composure and sound judgment
  - Initiating open and honest coaching conversations to develop
    high-performing, diverse, and inclusive teams
  - Applying systems thinking to identify underlying problems
    and opportunities within financial crimes and sanctions
    contexts
  What You Must Have
  - At least a Bachelor's degree
  - At least 7 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Accounting, Analytics/Data Science,
    Biology/Biomedical Sciences, Business
    Administration/Management, Computer Science/Information
    Systems, Economics, Engineering, Finance, Financial
    Mathematics/Quantitative Finance, Health
    Administration/Public Health, Mathematics/Statistics,
    Operations/Supply Chain, Project/Technology Management,
    Risk Management/Insurance, Science
  - Leveraging advanced skills in data analysis and
    interpretation
  - Utilizing Python for developing innovative AI solutions
  - Demonstrating strategic questioning to drive impactful
    decisions
  - Applying systems thinking to identify opportunities in
    complex scenarios
  - Excelling in stakeholder engagement and relationship
    building
  - Leading teams through ambiguity with composure and clarity
  The salary range for this position is: $124,000 - $280,000.
