  See yourself at Twilio

  Join the team as our next Staff Engineer, Enterprise
  Security

  About the job

  As a Staff Enterprise Security Engineer, you will be a
  technical leader within the EntSec team, responsible for the
  foundational security posture of our organization. You will
  serve as an SME on the technical strategy and engineering
  execution for securing the AI ecosystem in our Enterprise,
  moving beyond policy into building the foundational
  "decision infrastructure" and technical guardrails that
  allow the enterprise to innovate with AI at scale.

  You will also guide strategic direction and collaboration
  across enterprise security domains. You will need a
  background in security engineering and the cross-functional
  influence necessary to solve ambiguous, large-scale
  problems. Leveraging expertise in security assessments,
  threat modeling, identity and access control principles, and
  data protection, you will architect and build preventative
  guardrails and mitigate new risks introduced by first and
  third-party AI agents in our Enterprise.

  Responsibilities

  - Design and implement secure reference architectures for
    Enterprise AI platforms that secures every Twilion’s
    engagement with them, ensuring data integrity, regulatory
    compliance, and resilience against evolving AI threats.
  - Establish a definitive framework for AI vetting, driving the
    cultural and policy shifts needed to institutionalize this
    strategic mindset across the organization.
  - Collaborate with cross functional partners to develop and
    set the long term roadmap for agentic AI identity and
    posture management, ensuring cohesive strategies for
    reducing risk from agentic AI use.
  - Maintain and improve our enterprise security posture through
    high-quality code (Python, Go, or similar) and
    infrastructure management via IAC.
  - Act as a technical mentor to junior engineers and a
    strategic advisor to leadership on the evolving AI
    landscape.

  Qualifications:

  Not all applicants will have skills that match a job
  description exactly. Twilio values diverse experiences in
  other industries, and we encourage everyone who meets the
  required qualifications to apply.

  Required:

  - 7+ years of experience in security engineering or
    infrastructure security
  - 2+ years of experience leading teams in a technical
    capacity/staff engineering capacity at an enterprise.
  - Expertise in cloud security (AWS, GCP) and container
    security (Kubernetes).
  - Proven track record of designing and deploying complex
    security systems at scale.
  - Strong proficiency in programming languages such as Python,
    Go, or Java.

  Desired:

  - Experience in building, deploying and reviewing automation
    for complex security workflows, including use of both AI-
    driven and traditional automation tools.
  - Excellent communication skills with the ability to explain
    complex AI security risks to non-technical stakeholders.

  Location

  This role will be remote, but is not eligible to be hired in
  San Francisco, CA, Oakland, CA, San Jose, CA, or the
  surrounding areas.

  Travel

  We prioritize connection and opportunities to build
  relationships with our customers and each other. For this
  role, you may be required to travel occasionally to
  participate in project or team in-person meetings.

