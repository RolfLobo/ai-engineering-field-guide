description: |
  ServiceNow Lead Engineer – AI (India)

  Join the Crew That’s #GoingBeyond

  At NewRocket, a global Elite ServiceNow Partner, we don’t
  just implement technology—we help the world’s top
  enterprises navigate change with confidence. Now we’re
  building the next frontier: Agentic AI in ServiceNow.

  We’re looking for a ServiceNow Lead Engineer (India) to
  spearhead our AI/ML development efforts. This is your chance
  to lead a high-impact team and design AI solutions that
  transform workflows, boost intelligence, and set new
  industry standards.

  What You’ll Do

  As the Principal Architect, you’ll take charge of design,
  development, and leadership across our AI/ML practice:

  - Lead & Inspire – Mentor a team of AI/ML developers while
    shaping next-gen Agentic AI solutions in ServiceNow.
  - Build AI at Scale – Develop, train, and deploy ML models for
    predictive analytics, classification, and clustering.
  - Cloud Power – Work across AWS (SageMaker, Lambda, S3),
    Azure, and Google Cloud (Vertex AI) to deliver scalable
    solutions.
  - NLP Innovation – Fine-tune Hugging Face transformer models
    (BERT, GPT) for classification, summarization, and
    sentiment analysis.
  - Smart Automation – Build chatbots and AI automations with
    Microsoft Teams, Azure AI, and ServiceNow.
  - Big Data Mastery – Harness Apache Spark and Snowflake for
    large-scale analytics and data processing.
  - Data Engineering – Design ETL pipelines ensuring quality,
    transformation, and validation.
  - Database Excellence – Optimize SQL, MySQL, PostgreSQL, and
    MongoDB for performance.
  - Visual Storytelling – Turn insights into impact using
    Tableau and Power BI.
  - LLM Leadership – Train and deploy Large Language Models for
    conversational AI, generation, and summarization.
  - Agentic AI – Engineer autonomous, adaptive AI agents capable
    of real-time learning and decision-making.

  What You Bring

  - 5+ years applying AI & automation within ServiceNow
    ecosystems.
  - Proven track record in a senior/lead role, mentoring
    developers and guiding complex projects.
  - Strong coding expertise in Python & SQL, with ML frameworks
    (TensorFlow, PyTorch, Scikit-learn).
  - Deep knowledge of algorithms, OOP, and functional design
    principles.
  - Proficiency with Pandas, NumPy, Matplotlib, Seaborn for
    analytics.
  - Cloud fluency: AWS, Azure, Google Cloud.
  - Experience in big data processing (Spark, Snowflake).
  - NLP expertise with Hugging Face and cloud AI services.
  - Strong grasp of databases, data warehousing, and
    optimization.
  - Skilled with data visualization tools (Tableau, Power BI).
  - A collaborative spirit, eager to adapt, learn, and lead in
    an evolving AI landscape.
  - Exceptional problem-solving and analytical skills.

  Education:

  - Bachelor’s degree in Computer Science, Data Science, AI/ML,
    or related field.

  Why Join Us?

  - Work on cutting-edge AI/ML projects with global enterprises.
  - Be at the forefront of Agentic AI in ServiceNow.
  - Join a culture where your voice matters, your growth
    matters, and YOU matter.

  We’re not just building AI—we’re building the future of
  intelligent enterprises. Come join our crew. Go Beyond with
  NewRocket.
