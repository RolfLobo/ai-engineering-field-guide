description: |
  Who are we and why should you join us?

  BetterHelp is on a mission to remove the traditional
  barriers to therapy and make mental health care more
  accessible to everyone. Founded in 2013, we are now the
  world’s largest online therapy service, providing affordable
  and convenient therapy across the globe. Our network of over
  30,000 licensed therapists has helped millions of people
  take ownership of their mental health and change their lives
  forever. And we’re not stopping there – as the unmet need
  for mental health services continues to grow, BetterHelp is
  committed to being part of the solution.

  As the Staff AI Enablement Engineer at BetterHelp, you’ll
  join a diverse team of licensed clinicians, engineers,
  product pros, creatives, marketers, and business leaders who
  share a passion for expanding access to therapy. And as a
  mental health company, we take employee mental health just
  as seriously as we do our mission. We deeply invest in our
  team’s well-being and professional development, because we
  know that business and individual growth go hand-in-hand. At
  BetterHelp, you’ll carve your own path, make an immediate
  impact, and be challenged every day – with a supportive
  community behind you the whole way.

  What are we looking for?

  We're looking for a builder. This is a first-of-its-kind
  role at BetterHelp: you will be the person who makes our
  engineering org dramatically more effective with AI.
  Developers, data, and devops are the first customers.
  Product, design, analytics, and research are close behind.

  You are an expert in the modern AI stack: coding agents, MCP
  servers and connectors, prompt and context engineering,
  retrieval, workflow automation. You use these tools daily
  and have taken them from experimentation to production
  inside a real organization. Just as important, you know that
  shipping the tool is half the job: you've driven behavior
  change across a large org, and you know what causes
  initiatives fail.

  This is a senior individual contributor role on the Platform
  team, reporting to Platform's engineering manager, who owns
  the AI enablement roadmap. You own what ships against it and
  whether the org adopts it. You'll have unusual latitude in
  how the work gets built, and unusual accountability for
  whether it gets used

  What will you do?

  - Build against the AI enablement roadmap for the engineering,
    product, and design org: what we adopt, what we build
    ourselves, in what order, and how we'll know it's working.
    The roadmap is set with your manager. Turning it into
    working software is yours.
  - Build the internal stack hands-on: AI agents and automations
    for recurring engineering workflows, MCP connectors into
    our systems of record, shared prompt and skill libraries,
    and the governed knowledge layer that gives every AI
    surface company context.
  - Own your experiments end to end. You'll have an AWS account
    separate from production, write Terraform to blow away and
    rebuild in minutes, and deploy & maintain secure, well
    thought out solutions.
  - Ship experiments first, double down on what works.

  What will you NOT do?

  - You will NOT worry about "runway", "cash left", or "how much
    time we have until the next round". We have the startup
    DNA but we're fully backed and funded, all the way to
    success.
  - You will NOT be confined to your "job". You will get
    involved in product, marketing, business strategy, and
    almost everything we do.
  - You will NOT be bogged down by office politics, ego, or bad
    attitude. Only positive, pleasure-to-work-with people are
    allowed here!
  - You will NOT get yourself burned out. We work hard but we
    believe in maintaining a sustainable work/life balance.
    Really.

  Can I work remotely?

  Yes. We operate on PST and candidates in any time zone are
  welcome to apply. We ask employees to travel to our San
  Jose, CA office up to three times per year plus one company-
  wide offsite to collaborate in person and strengthen working
  relationships. Travel expenses are covered and reasonable
  accommodations are made for those under unique circumstances
  who cannot travel.

  Requirements

  - 6+ years in fast-moving technology organizations, including
    hands-on software engineering (platform engineering,
    developer experience, internal tools, or infrastructure)
  - Daily, hands-on fluency with the modern AI stack: coding
    agents (e.g. Claude Code, Cursor), MCP servers and
    connectors, prompt and context engineering, retrieval-
    augmented generation, and workflow automation platforms.
    Expect to show, not tell!
  - Infrastructure competence you can demonstrate:
    infrastructure as code (Terraform or equivalent), a major
    cloud provider, and secrets and access management. You can
    stand up your own environment and explain the security
    decisions in it
  - Comfort working inside CI/CD. Several of our highest-value
    surfaces run on pull requests, so you can reason about
    pipeline cost, latency, and failure modes, not just
    prompts
  - Demonstrated change management across a medium to large
    organization: champions programs, enablement content,
    training, and an operating rhythm that kept momentum after
    the launch announcement
  - Governance fluency: data privacy, safe-use policy, vendor
    evaluation, and access control, with the judgment to move
    fast inside a regulated environment rather than around it.
    You can point to something real you shipped through an
    approval process, not around one
  - A self-starter. You don't wait for prescriptive instructions
    or oversight. Once you've been greenlighted you operate
    with autonomy, and you know when to escalate to get
    unblocked instead of sitting on it

  Benefits

  - Remote work with regular in-person bonding experiences
    sponsored by the company
  - Competitive compensation
  - Holistic perks program (including free therapy, employee
    wellness, and more)
  - Excellent health, dental, and vision coverage
  - 401k benefits with employer matching contribution
  - The chance to build something that changes lives – and that
    people love
  - Any piece of hardware or software that will make you happy
    and productive
  - An awesome community of co-workers

  The base salary range for this position is $170,000 -
  $215,000. In addition to the base salary, this position is
  eligible for a performance bonus and the extensive benefits
  listed here (subject to eligibility requirements): Teladoc
  Health Benefits 2025. Total compensation is based on several
  factors – including, but not limited to, type of position,
  location, education level, work experience, and
  certifications. This information is applicable to all full-
  time positions.

  At BetterHelp we thrive on difference and individuality, and
  as part of the Teladoc Health family, we are proud to be an
  Equal Opportunity Employer. We never have and never will
  discriminate against any job candidate or employee due to
  age, race, ethnicity, religion, sex, color, national origin,
  gender, gender identity, sexual orientation, medical
  condition, marital status, parental status, disability, or
  Veteran status. Notice to Candidates: BetterHelp has been
  made aware of fraudulent job postings and unaffiliated third
  parties posing as our recruiting team – please know that we
  have no affiliation or connection to these situations. We
  only post open roles on our career page
  (betterhelp.com/careers) or reputable job boards like our
  official LinkedIn or Indeed pages, and all official
  BetterHelp recruitment emails will come from the domain
  @betterhelp.com. Our commitment is to ensure a safe and
  transparent hiring experience for all candidates.  We will
  never ask you for money, gift cards, or any form of payment
  during our hiring process, and we will never send money or
  checks to candidates. If you experience this, it is a scam.
