title: "Senior Innovation Hub Engineer | AI, Cloud & Manufacturing"
company: Microsoft
location: Schiphol, NLD
work_type: FULL_TIME
company_size: 206,870 Employees
description: |
  Overview

  Join Microsoft's Innovation Hub and help some of the world's
  largest manufacturing organisations accelerate their AI
  transformation. This is a highly customer-facing role that
  combines technical expertise, business consulting and
  innovation. You'll work directly with senior business and
  technology leaders to shape strategy, solve complex
  challenges and bring AI-powered solutions to life through
  immersive engagements and workshops. This is an on-site role
  based in the Microsoft Innovation Hub.

  Responsibilities

  - Lead customer workshops, strategy sessions and innovation
    engagements focused on AI and digital transformation
  - Advise executive stakeholders on how to use AI, data and
    cloud technologies to achieve business outcomes
  - Design scalable, secure and high-impact solution
    architectures that address complex business challenges
  - Partner across sales, engineering and technical teams to
    drive customer success and accelerate adoption
  - Act as a trusted technical advisor, connecting innovation
    opportunities to measurable business value

  Qualifications

  - Proven technical pre-sales, solution architecture or
    technical consulting experience
  - Experience engaging CIO, CTO and board-level stakeholders to
    shape business and technology strategy
  - Ability to design end-to-end enterprise architectures
    spanning cloud, AI, data, applications and security
  - Strong discovery and consulting skills, translating business
    objectives into technical solutions and customer outcomes
  - Manufacturing industry expertise, including Industry 4.0,
    smart factory and IT/OT transformation initiatives
  - Hands-on experience building prototypes, proof of concepts
    and solution demonstrations for enterprise customers



  Solution Engineering IC5 - The typical base pay range for
  this role across Netherlands is € 86,300.00 - € 170,800.00
  per year. Certain roles may be eligible for benefits and
  other compensation.



  Find additional benefits and pay information here:
  https://careers.microsoft.com/v2/global/en/corporate-
  pay/netherlands-corporate-pay.html

  This position will be open for a minimum of 5 days, with
  applications accepted on an ongoing basis until the position
  is filled.

  Microsoft is an equal opportunity employer. All qualified
  applicants will receive consideration for employment without
  regard to age, ancestry, citizenship, color, family or
  medical care leave, gender identity or expression, genetic
  information, immigration status, marital status, medical
  condition, national origin, physical or mental disability,
  political affiliation, protected veteran or military status,
  race, ethnicity, religion, sex (including pregnancy), sexual
  orientation, or any other characteristic protected by
  applicable local laws, regulations and ordinances. If you
  need assistance with religious accommodations and/or a
  reasonable accommodation due to a disability during the
  application process, read more about requesting
  accommodations.
