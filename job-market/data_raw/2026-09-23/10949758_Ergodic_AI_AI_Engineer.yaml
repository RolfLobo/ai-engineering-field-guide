description: |
  Company Description

  Ergodic AI is an Artificial Intelligence startup based in
  London that is building an action-oriented AI platform to
  help enterprises move from analysis paralysis to rapid data-
  driven execution.

  Kepler - our AI platform - identifies context, surfaces
  optimal actions and justifies the reasons for their
  execution. We're an early stage startup and are already
  working with multiple F500 enterprises.

  We’re backed by leading VC funds to help further our mission
  and are now on the hunt for the brightest and best to join
  us.

  Our Team

  The founding team is highly experienced across a range of AI
  and commercial work, with careers in world class
  organisations and experience building and exiting $multi-
  million startups previously.

  Process

  As you progress through the process, you’ll meet each of the
  3 founders who will probe you for your motivations,
  experiences and fit for the role.

  Steps:

  - Application / CV screening
  - Interview with CTO
  - Interview with CSO
  - Interview with CEO
  - Decision

  We aim to move quickly through the process and not waste
  your time.

  The Role:

  This is a full-time role for an AI Engineer at ergodic.ai

  As an AI engineer, your mission is to build the foundational
  layer of how different AI models interact with various
  modalities of data, build agentic systems on top of it,
  develop custom-made models for specialised tasks and
  implement newly built solutions in the area of reinforcement
  learning and active inference. We're not in the langchain-
  and-pray business, we're looking for engineers with
  attention to detail, who value elegance and love thinking
  about architectures and data models.

  As an early stage hire, you will bring technical experience
  and hands-on development skills to shape our product as we
  unleash it on the world's most challenging data & AI
  problems.

  You will receive meaningful equity and a competitive salary
  alongside all the tech you need to execute.

  Qualifications

  - Solid understanding of the current AI ecosystem, including
    traditional ML.
  - Hacker mentality - when there's a will, there's a way.
  - Proficiency in Python Web Frameworks such as FastAPI, solid
    engineering skills.
  - (Preferably) Some level of comfort with TypeScript (React /
    Next.js) and ability to quickly put together basic UIs
  - Basic understanding of DevOps practices, including CI/CD
    pipelines, automated testing, and infrastructure as code
    (IaC)
  - Knowledge of cloud platforms and deployment processes
  - Strong problem-solving and analytical skills
  - Ability to work collaboratively in a team environment
  - Excellent communication and interpersonal skills
  - Bachelor's degree in Computer Science, Engineering, or a
    related field
