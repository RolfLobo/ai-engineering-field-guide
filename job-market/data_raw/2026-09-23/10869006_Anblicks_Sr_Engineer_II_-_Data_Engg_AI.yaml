description: |
  About the Role:

  As a Sr. Power BI Engineer at Anblicks, you will be
  responsible for designing, developing, and maintaining
  business intelligence solutions using Power BI. You will
  work closely with stakeholders to transform data into
  actionable insights and support data-driven decision-making
  processes.

  Responsibilities:

  - Data Modeling: Design and develop complex data models to
    support business requirements.
  - ETL Processes: Perform Extract-Transform-Load (ETL)
    processes to prepare data for analysis.
  - Dashboard and Report Creation: Develop interactive and
    visually appealing dashboards and reports using Power BI.
  - Data Analysis: Analyze data to identify trends, patterns,
    and insights that can drive business decisions.
  - Collaboration: Collaborate with stakeholders to understand
    their data needs and ensure the accuracy and reliability
    of the data presented.
  - Performance Optimization: Optimize Power BI solutions for
    performance and scalability.
  - Documentation: Maintain comprehensive documentation of data
    models, ETL processes, and reports.
  - Training and Support: Provide training and support to end-
    users on using Power BI effectively.
  - Stay Updated: Keep up-to-date with the latest Power BI
    features and industry trends.

  Qualifications:

  - Experience: 7-9 years of experience in Power BI development,
    including report and dashboard creation.
  - Technical Skills: Proficiency in Power BI, SQL, DAX (Data
    Analysis Expressions), and data modeling.
  - Analytical Skills: Strong analytical and problem-solving
    skills.
  - Communication Skills: Excellent communication and
    collaboration skills to work with both technical and non-
    technical stakeholders.
  - Education: A bachelor’s degree in Computer Science, Data
    Analytics, or a related field.
  - Certifications: Power BI certifications are a plus.
  - Additional Skills: Familiarity with data warehousing
    concepts and ETL frameworks
