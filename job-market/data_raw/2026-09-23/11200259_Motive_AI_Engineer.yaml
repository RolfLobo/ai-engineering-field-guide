description: |
  Who we are:

  Motive empowers the people who run physical operations with
  tools to make their work safer, more productive, and more
  profitable. For the first time ever, safety, operations and
  finance teams can manage their drivers, vehicles, equipment,
  and fleet related spend in a single system. Combined with
  industry leading AI, the Motive platform gives you complete
  visibility and control, and significantly reduces manual
  workloads by automating and simplifying tasks.

  Motive serves nearly 100,000 customers – from Fortune 500
  enterprises to small businesses – across a wide range of
  industries, including transportation and logistics,
  construction, energy, field service, manufacturing,
  agriculture, food and beverage, retail, and the public
  sector.

  Visit gomotive.com to learn more.

  About the Role:

  As a Software engineer - Machine Learning, you will be a
  part of a passionate team whose mission is to bring
  intelligence to the world’s trucks. The team is focused on
  building technology to understand driving behavior, identify
  risk factors, and intelligently suggest coachable events
  that not only improve the fleet safety and potentially save
  millions of dollars but also contribute to making the roads
  safer. You will have a unique opportunity to work with a
  high-caliber and fast-paced team which consists of
  experienced researchers and engineers in Computer Vision,
  Machine Learning, Deep Learning, and Robotics with a track
  record of previous products and top-tier publications.

  You will play a critical role in building and improving a
  technology that will be used by millions of trucks. In this
  role, you will design and implement complex machine-learning
  systems. You will have the opportunity to build and/or
  improve ML/computer vision systems. Identify where models
  and algorithms are failing, debug issues, propose solutions,
  implement, and deploy them on millions of trucks. You will
  also get exposure to large-scale ML infra and scaling that
  facilitates large amounts of data to train, test, and
  validate computer vision systems.

  What You’ll Do:

  - Evaluate and improve the performance of existing models and
    algorithms already in production
  - Prototype and implement ML modules for complex AI features
  - Build and optimize CV/ML algorithms for real-time
    performance so they can run on our embedded platform,
    i.e., the next-gen AI dashcam
  - Write proficient Python and C++ code to build and improve CV
    algorithms, ML services, training, model compression, and
    porting pipelines
  - Collaborate with cross-functional teams such as Embedded,
    Backend, Frontend, Hardware, QA, and the broader AI team
    to ensure the development of robust and sustainable AI
    systems
  - Build automated deployment, validation, and active learning
    pipelines.

  What We’re Looking For:

  - Bachelor’s Degree in Computer Science, Electrical
    Engineering, or related field. A Master’s degree is a
    plus.
  - 4+ years of machine learning and/or data science experience
  - Solid mathematical foundation in Deep Learning, Machine
    Learning, and optimization approaches.
  - Strong experience in Python or C++
  - Experience in the following tools and technologies is a
    plus. AWS (SageMaker, Lambda, EC2, S3, RDS), CI/CD,
    Terraform, Docker, and Kubernetes.
  - Prior experience with optimizing and deploying ML models on
    embedded devices is a strong plus

  Creating a diverse and inclusive workplace is one of
  Motive's core values. We are an equal opportunity employer
  and welcome people of different backgrounds, experiences,
  abilities and perspectives.

