description: |
  Working within the Finance & Tax platform as part of the
  Azure capability team, you will build next-generation
  business applications leveraging cloud-native technologies,
  microservices architecture, and AI-powered experiences. You
  will design, develop, and deliver end-to-end solutions
  across frontend, backend, and AI agent layers using modern
  AI platforms and Large Language Models.

  Roles and Responsibilities

  - Deliver technical capabilities corresponding to user stories
    defined in the product backlog.
  - Design, develop, and maintain scalable frontend, backend,
    and AI-powered solutions.
  - Build and integrate AI agents using modern frameworks and
    enterprise AI services.
  - Develop intelligent workflows leveraging LLMs, RAG, vector
    databases, and AI orchestration frameworks.
  - Build modern user interfaces using Angular, Vue.js, or
    React.
  - Develop backend services using Java Spring Boot and Python.
  - Utilize AI coding assistants such as GitHub Copilot, Claude,
    Cursor, ChatGPT, or similar tools.

  Required Experience

  - Strong hands-on experience in software development using
    Java and/or Python.
  - Strong frontend development experience using Angular,
    Vue.js, React, JavaScript, HTML, and CSS.
  - Experience developing backend applications using Spring
    Boot, REST APIs, and microservices.
  - Hands-on experience developing AI-powered applications and
    AI agents using LangChain, LangGraph, CrewAI, AutoGen,
    Semantic Kernel or similar frameworks.
  - Experience integrating applications with OpenAI, Azure
    OpenAI, Claude, Gemini, or equivalent LLMs.
  - Experience building conversational assistants, copilots,
    document processing solutions, workflow automation agents,
    and knowledge retrieval solutions.
  - Good understanding of Prompt Engineering, RAG patterns,
    vector databases, and AI orchestration frameworks.
  - Experience with SQL, NoSQL, Kafka, Azure Event Hub, and
    Azure Cloud.
  - Experience with unit testing, integration testing, CI/CD,
    and cloud-native development.

  Preferred Qualifications

  - Experience with Azure AI Services, Azure OpenAI, or AI
    Foundry.
  - Experience deploying AI agents into production environments.
  - Knowledge of Docker and Kubernetes.

