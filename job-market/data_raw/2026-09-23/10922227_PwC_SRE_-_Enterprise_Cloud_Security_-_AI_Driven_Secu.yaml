description: |
  The Opportunity As an SRE - Enterprise & Cloud Security - AI
  Driven Security - Senior Manager, you will play a pivotal
  role in transforming raw data into actionable insights,
  enabling informed decision-making and driving business
  growth. Within our Cyber, Data & Tech Risk practice, you
  will leverage advanced technologies and techniques to design
  and develop robust data solutions for clients. As a Senior
  Manager, you will apply your skills and network to deliver
  quality results, motivating and coaching teams to solve
  complex problems. You will be responsible for crafting and
  conveying clear, impactful messages that tell a holistic
  story, applying systems thinking to identify underlying
  problems and opportunities. In this role at PwC, you will
  lead large projects and innovate processes, focusing on
  achieving results and maintaining operational excellence.
  You will interact with clients at a strategic level, driving
  overall project success. Your ability to develop and sustain
  diverse and inclusive teams, along with your commitment to
  excellence, will contribute to the success of our firm. You
  will validate outcomes with clients, share alternative
  perspectives, and act on client feedback, all while
  navigating complex and uncertain situations with composure.
  Responsibilities
  - Designing and implementing AI-driven security solutions to
    enhance enterprise and cloud security
  - Leading teams in the development and deployment of scalable
    AI systems and machine learning models
  - Utilizing advanced data analysis techniques to transform raw
    data into actionable insights for informed decision-making
  - Integrating data infrastructure and pipelines to support AI
    and machine learning initiatives
  - Applying programming skills in Python, Java, and C++ to
    develop robust AI applications
  - Conducting complex data modeling and analysis to identify
    patterns and optimize security measures
  - Collaborating with stakeholders to validate outcomes and
    incorporate client feedback into security strategies
  - Directing teams through challenging situations,
    demonstrating composure and strategic questioning
  - Promoting the use of open-source software and machine
    learning libraries like TensorFlow and Scikit-Learn
  - Coaching and motivating teams to embrace change and drive
    innovation in AI security solutions
  What You Must Have
  - At least a Bachelor's degree
  - At least 7 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Demonstrating advanced skills in AI implementation and
    machine learning libraries
  - Leading teams through complex cybersecurity and privacy
    challenges
  - Applying systems thinking to identify and solve underlying
    problems
  - Excelling in crafting and conveying clear, impactful
    messages
