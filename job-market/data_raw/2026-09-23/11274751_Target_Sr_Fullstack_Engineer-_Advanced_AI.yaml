description: |
  About Us

  As a Fortune 50 company with more than 400,000 team members
  worldwide, Target is an iconic brand and one of America's
  leading retailers.

  Joining Target means promoting a culture of mutual care and
  respect and striving to make the most meaningful and
  positive impact. Becoming a Target team member means joining
  a community that values different voices and lifts each
  other up. Here, we believe your unique perspective is
  important, and you'll build relationships by being authentic
  and respectful.

  Overview about TII

  At Target, we have a timeless purpose and a proven strategy.
  And that hasn’t happened by accident. Some of the best minds
  from different backgrounds come together at Target to
  redefine retail in an inclusive learning environment that
  values people and delivers world-class outcomes. That
  winning formula is especially apparent in Bengaluru, where
  Target in India operates as a fully integrated part of
  Target’s global team and has more than 5,000 team members
  supporting the company’s global strategy and operations.

  Pyramid Overview

  A role with Target Data Science & Engineering means the
  chance to help develop and manage state of the art
  predictive algorithms that use data at scale to automate and
  optimize decisions at scale. Whether you join our
  Statistics, Optimization or Machine Learning teams, you’ll
  be challenged to harness Target’s impressive data breadth to
  build the algorithms that power solutions our partners in
  Marketing, Supply Chain Optimization, Network Security and
  Personalization rely on.

  Team Overview

  Target’s Advanced AI team builds end-to-end AI/ML systems
  that create meaningful business value across the enterprise.
  These systems may be powered by LLMs, classical machine
  learning, or deep learning models, and are designed as
  scalable, reliable, production-grade applications, including
  agentic architectures where they add clear value.

  Role Overview

  As a Sr Full Stack Engineer for Advanced AI, you will help
  design, build, deploy, and maintain the application layers,
  services, APIs, and user experiences that bring AI/ML
  capabilities into core business workflows. You will work
  closely with AI/ML Engineers, Data Scientists, product
  partners, platform teams, security teams, and business
  stakeholders to turn complex AI capabilities into practical,
  intuitive, and scalable applications.

  In this role, you will provide hands-on technical leadership
  for full-stack engineering initiatives across Advanced AI
  applications. You will contribute to architecture and design
  decisions, build maintainable production-quality code,
  design and develop APIs and services, create user-facing
  application experiences, and help establish strong
  engineering practices across development, testing,
  deployment, observability, documentation, and ongoing
  support. You will help ensure applications are secure,
  reliable, accessible, performant, maintainable, and aligned
  to Target’s enterprise standards for infrastructure,
  platform architecture, data handling, and operational
  readiness.

  You will also partner with AI/ML Engineers, Lead and
  Principal Engineers, and engineering leaders to shape
  technical approaches, identify implementation risks, resolve
  roadblocks, and support the evolution of reusable
  application patterns for AI-powered products. This role
  requires strong product thinking, curiosity, and continuous
  learning, including staying current with modern full-stack
  engineering practices and developments in AI, LLM-powered
  applications, agentic systems, and enterprise AI patterns. .

  About You

  - 4-year degree or equivalent experience.
  - 5+ years of hands-on software engineering experience,
    including experience building and operating production
    applications.
  - Strong experience building full-stack applications,
    including user-facing experiences, backend services, APIs,
    integrations, and data-driven workflows.
  - Strong proficiency with modern backend and frontend
    development. Experience with Python is strongly preferred,
    and experience with TypeScript, JavaScript, Java, Kotlin,
    Go, or similar languages is helpful.
  - Experience with modern web application frameworks, API
    design, service-oriented architectures, data integration
    patterns, and production application development.
  - Experience building applications that integrate with AI/ML
    capabilities, including model APIs, LLM-powered workflows,
    retrieval-augmented generation, agentic systems,
    intelligent automation, or data science outputs.
  - Strong understanding of system design, application
    architecture, security, performance, scalability,
    reliability, accessibility, observability, testing, and
    production deployment considerations.
  - Experience building scalable, maintainable, and well-tested
    services, APIs, data pipelines, integrations,
    applications, or platforms.
  - Experience with version control, CI/CD, code review
    practices, documentation, operational monitoring, and
    production support.
  - Ability to translate ambiguous business and user needs into
    clear technical approaches and collaborate with cross-
    functional partners to deliver practical solutions.
  - Strong communication skills, with the ability to explain
    technical concepts clearly to engineers, AI/ML Engineers,
    Data Scientists, product partners, business stakeholders,
    and leaders.
  - Ability to mentor engineers, contribute to technical
    direction, and raise the quality of full-stack engineering
    practices within a team.
  - Self-driven and results-oriented, with strong ownership,
    sound judgment, and the ability to move quickly while
    maintaining high technical standards.
  - Collaborative team player with a commitment to continuous
    learning, knowledge sharing, and building reliable AI-
    powered applications that create business value.

