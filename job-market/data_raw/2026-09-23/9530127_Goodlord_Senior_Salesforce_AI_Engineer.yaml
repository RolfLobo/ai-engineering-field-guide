description: |
  London or Sheffield - 2 days per week in office, 3 days
  working remotely

  About the Role

  Goodlord’s mission is to be the gold standard platform for
  renting, and we’re on the hunt for a Senior Business Systems
  Analyst to help us achieve this.

  The Business Systems team plays a crucial role in driving
  efficiency across multiple departments including Sales,
  Customer Support, Marketing and Finance by optimising our
  internal processes and connected ecosystem. As a hands-on
  analyst, you will work throughout the full SDLC: partnering
  with cross-functional stakeholders to understand their
  challenges, scoping scalable solutions, and implementing
  them directly in Salesforce.

  Your work will be critical to driving business growth and
  achieving our strategic goals. To accomplish this, you will
  employ advanced automation and Salesforce’s latest AI
  capabilities to solve real business problems rather than
  just completing tasks. You will ensure robust data
  governance, seamless integrations with platforms like
  HubSpot, and disciplined process execution.

  No two days are ever the same at Goodlord so what you’ll be
  up to will vary. The pace we move at also means priorities
  will change and you’ll need to be comfortable with this
  (we’ll support you!). But these are the things that will be
  core to your role and will keep you busy.

  The day-to-day stuff:

  - Flexibly balance a mix of business as usual system admin
    tasks alongside the execution of long-term, strategic
    projects.
  - Partner directly with cross-functional stakeholders to
    understand their operational challenges, gather
    requirements, and translate them into clear, documented
    technical specifications.
  - Own the administration, configuration, and day-to-day
    support of core enablement tools and integrations,
    including GetAccept, Vonage, and HubSpot.
  - Map, manage and continuously improve the operational
    processes underlying our sales cycles.
  - Utilise Salesforce reporting, Data Loader, Import Wizard,
    etc to maintain an accurate database, while building
    visibility (dashboards/reports) for everyone from end-
    users to the executive team.
  - Proactively spot, triage, and systematically debug new
    system, AI, or process issues as they arise, ensuring
    minimal disruption to business operations.

  About You

  You should apply if you:

  - Hands on expertise in Salesforce (Sales Cloud) configuration
    and advanced declarative automation. Deep understanding of
    Lead-to-Cash pipelines, opportunity management, and best-
    practice configuration to prevent over-customisation.
  - Up to date experience on modern Salesforce AI capabilities
    (including Generative and Agentic AI) with a proven
    ability to identify where AI can solve real-world business
    challenges, automate manual tasks, and drive operational
    efficiency.
  - Solid experience partnering with business stakeholders to
    map business processes, challenge assumptions, and
    translate pain points into scalable solutions rather than
    just "taking orders."
  - Solid literacy in integration logic, data sync behaviors,
    and APIs (e.g., interfacing Salesforce with HubSpot and
    plugins like GetAccept).
  - A systematic approach to debugging, documentation, and
    testing. Strict adherence to internal change management
    processes (Sandbox management, UAT, regression testing) to
    ensure updates for one department don't disrupt downstream
    pipelines like Finance.



  Why you'll love being a Goodlordian

  Aside from the role, the people, our culture and our
  mission, we have some other things that make Goodlord a
  pretty awesome place to be. Here’s a few favourites amongst
  Goodlordians (check out our careers page for more info).

  - Grow with Goodlord: your development is important to us,
    that’s why we are Great Place to Work - certified. Have a
    goal in mind? Share it with us so we can use some of our
    annual development fund to support it. We guarantee you’ll
    learn loads and develop both personally and
    professionally!
  - Your well-being matters: bi-weekly coaching with Sanctus to
    provide Goodlordians with a safe place to talk and support
    your mental health
  - 25 days holiday (plus UK Bank holidays) plus 1 day per full
    holiday year up to 32 days: We believe regular breaks are
    essential for well-being and we encourage (some may say
    expect!) all Goodlordians to take full advantage of their
    annual leave entitlement.
  - Supporting your family: we offer Goodlordians of all genders
    a generous 3 months of fully-paid time off to look after
    their new arrivals
  - Our team: we’re an energetic, sociable, and talented bunch
    who are super passionate about what we do and determined
    to make a difference. We’re all in it together, we learn
    from each other, we’re genuine and we don’t have time for
    politics

  What’s next?

  If you’re ready to help us on our mission to be the gold
  standard platform for renting, then click apply (2-3
  minutes)!

  A full job spec is available on request.

  Goodlord wants applicants from all backgrounds and walks of
  life; we are an equal opportunity employer committed to
  creating an inclusive environment.

  Creating a space where everyone feels included is central to
  who we are. Because we're an open book and we learn from
  each other, we actively champion diverse perspectives and
  unique life experiences. If there is anything you need to
  participate fully in the interview process, we'd love to
  hear about that too - please include it in your application.

  ** Please note, as we are regulated by the Financial Conduct
  Authority, all Goodlordians are required to pass a thorough
  referencing check via Experian before joining the team. We
  will only ask for references at the point of making an
  offer.

  No agencies please - we have tried and trusted partners we
  would turn to should we require support.
