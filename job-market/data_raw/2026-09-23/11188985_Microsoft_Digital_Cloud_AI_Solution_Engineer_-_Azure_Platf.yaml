title: "Digital Cloud & AI Solution Engineer - Azure Platform State & Local Government"
company: Microsoft
location: USA
remote: true
work_type: FULL_TIME
description: |
  Overview

  Are you curious, passionate about infrastructure, and ready
  to solve complex challenges in the AI era? Join us as a
  Digital Cloud & AI Solution Engineer – Azure Platform,
  focused on State and Local Government customers at
  Microsoft.In this technical sales role, you’ll help state
  and local government organizations design secure, scalable,
  resilient, and compliant cloud architectures that support
  their modernization and mission objectives. Using Microsoft
  Cloud & AI IaaS and PaaS services, you’ll guide government
  customers through migration, optimization, and
  innovation—translating technical capabilities into
  meaningful outcomes for agencies, employees, constituents,
  and the communities they serve.You’ll collaborate across
  Microsoft teams, partners, and government stakeholders to
  deliver solutions that modernize legacy environments,
  improve operational agility, strengthen security and
  resiliency, optimize costs, and unlock new possibilities
  through AI-powered infrastructure.At Small Medium
  Enterprises and Channel (SME&C), we are leading a high-
  growth, AI-powered global sales organization deeply
  connected to our partners and driven by customer success. By
  bringing together our Small Medium Business, Corporate,
  Strategy, and Partner teams, we are unlocking significant
  customer opportunities backed by substantial investments in
  AI, cloud, security, and our partner ecosystem.Within SME&C,
  this position is specifically aligned to our State and Local
  Government business, providing the opportunity to work with
  public-sector organizations as they modernize critical
  infrastructure, transform citizen and employee experiences,
  and responsibly adopt cloud and AI technologies.SME&C is
  more than a sales organization—it’s a culture of innovation,
  opportunity, and inclusivity. Here, you’ll be part of a
  diverse, high-performing, and customer-obsessed team where
  collaboration, connection, and continuous learning fuel
  everything we do.If you thrive in a fast-paced, digital-
  first environment and want to use technology to make a
  meaningful impact in the public sector, SME&C State and
  Local Government offers an opportunity to help shape the
  future of government services.As a Digital Cloud & AI
  Solution Engineer – Azure Platform for State and Local
  Government, you’ll play a key role in helping government
  customers modernize their infrastructure and unlock the full
  value of Microsoft Cloud & AI. You’ll work directly with
  technical and business stakeholders to design secure,
  scalable, resilient, and compliant architectures supporting
  AI workloads, mission-critical applications, and essential
  government services.You bring deep proficiency in migrating
  core workloads—including Windows, SQL Server, Linux,
  PostgreSQL, and Oracle—to Microsoft Cloud & AI. Beyond
  migration, you’ll lead customers through modernization,
  containerization best practices, and cloud-native services
  such as Azure Kubernetes Service (AKS) and Azure Arc, while
  exploring how AI and intelligent agents can accelerate
  legacy application transformation.You’ll apply strong
  networking knowledge to design hybrid and cloud-native
  solutions, including virtual networks, VPNs, private
  connectivity, and secure routing architectures that meet
  government requirements for performance, resiliency,
  security, and compliance. You’ll complement Microsoft
  technologies with trusted partner solutions such as NetApp,
  VMware, Red Hat, and SAP to deliver secure, optimized, and
  scalable modernization solutions.An understanding of
  Microsoft security capabilities, governance, and compliance
  frameworks will enable you to help State and Local
  Government customers navigate regulatory, security, data
  protection, and resiliency requirements while building cloud
  environments ready for future AI innovation.As you join the
  team, you’ll have the opportunity to grow your technical
  proficiency through a wide range of Microsoft learning
  resources, including support for earning industry-recognized
  certifications across cloud infrastructure, security, and
  AI.This opportunity will allow you to:Drive meaningful
  public-sector outcomes by helping State and Local Government
  customers modernize infrastructure and improve the
  technology foundations supporting critical government
  services. Accelerate your career growth by leading impactful
  engagements involving complex, secure, and highly resilient
  cloud environments. Deepen your technical proficiency
  through hands-on architecture design, migration planning,
  and modernization of hybrid and cloud-native environments.
  Develop strategic influence by guiding government customers
  through infrastructure modernization and shaping technical
  decisions supporting AI and mission-critical workloads.
  Strengthen your collaboration skills by working across
  Microsoft engineering teams, partners, account teams, and
  government stakeholders to deliver successful customer
  outcomes. Build future-ready capabilities through continuous
  learning, certifications, and exposure to Microsoft’s
  evolving cloud infrastructure, security, and AI
  technologies.Microsoft’s mission is to empower every person
  and every organization on the planet to achieve more. As
  employees, we come together with a growth mindset, innovate
  to empower others, and collaborate to realize our shared
  goals. Each day, we build on our values of respect,
  integrity, and accountability to create a culture of
  inclusion where everyone can thrive at work and beyond.

  Responsibilities

  - Drive technical sales by using technical demos, proof of
    concepts, technical architecture accelerator to influence
    solution design and enable deployments.
  - Lead architecture sessions and technical workshops to
    accelerate Cloud & AI adoption.
  - Build trusted relationships with platform leads to co-design
    secure, scalable solutions.
  - Resolve technical blockers by collaborating with engineering
    and sharing customer insights.
  - Maintain expertise in cloud migration (Windows, SQL, Linux,
    PostgreSQL, app workloads), resiliency, security, and
    compliance.
  - Deepen knowledge of enterprise apps (SAP, Oracle) and Cloud
    & AI VMware Solution (AVS).
  - Represent Microsoft in customer forums and technical
    communities through thought leadership.

  Qualifications Required/minimum qualifications

  Bachelor's Degree in Computer Science, Information
  Technology, Engineering or related field AND 2+ years
  technical pre-sales or technical consulting experience OR
  equivalent experience.

  Additional or preferred qualifications

  Bachelor's Degree in Computer Science, Information
  Technology, Engineering or related field AND 5+ years
  technical pre-sales or technical consulting experience OR
  equivalent experience.

  2+ years experience with cloud and hybrid, or on premises
  infrastructures, architecture designs, migrations, industry
  standards, and/or technology management.

  Certification in relevant (Microsoft or industry)
  technologies or disciplines (e.g., Microsoft Office 365,
  Power BI, Azure Architect and Development exams, Cloud
  Platform Technologies, Information Security, Architecture).



  Digital Solution Engineering IC3 - The typical base pay
  range for this role across the U.S. is USD $86,100 -
  $169,800 per year. There is a different range applicable to
  specific work locations, within the San Francisco Bay area
  and New York City metropolitan area, and the base pay range
  for this role in those locations is USD $113,300 - $187,400
  per year.



  Certain roles may be eligible for benefits and other
  compensation. Find additional benefits and pay information
  here: https://careers.microsoft.com/us/en/us-corporate-pay

  This position will be open for a minimum of 5 days, with
  applications accepted on an ongoing basis until the position
  is filled.

