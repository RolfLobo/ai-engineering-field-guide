description: |
  Senior QA Automation Engineer – AI-Driven Automation

  Location: Hyderabad, India

  Experience: 5–9 Years

  No of Positions: 5

  About the Role

  We are looking for a Senior QA Automation Engineer with
  strong experience in Test Automation, API Testing,
  Automation Frameworks, and AI-driven Quality Engineering.

  The ideal candidate should have hands-on experience with any
  modern automation framework such as Selenium, Playwright,
  Cypress, WebdriverIO, etc., along with proficiency in any
  scripting/programming language such as Java, Python,
  JavaScript, TypeScript, C#, etc.

  The role also requires exposure to Generative AI, AI Agents,
  Prompt Engineering, and AI-assisted testing to improve
  automation efficiency, test coverage, and software quality.

  Key Responsibilities

  - Design, develop, and maintain scalable test automation
    frameworks.
  - Build automated tests for web applications, APIs, and end-
    to-end business workflows.
  - Develop and maintain API automation and validation
    solutions.
  - Implement AI-driven testing approaches to improve test
    generation, coverage, execution, and defect analysis.
  - Create and leverage AI Agents for test automation,
    validation, test analysis, and QA workflows.
  - Apply Prompt Engineering and Generative AI to enhance
    testing and quality engineering activities.
  - Integrate automation frameworks with CI/CD pipelines and
    support continuous testing.
  - Collaborate with developers, product managers, and QA teams
    throughout the SDLC.
  - Evaluate and adopt emerging AI and automation technologies
    to improve QA productivity.

  Must-Have Skills

  - 5–9 years of experience in QA Automation / Software Quality
    Engineering.
  - Strong experience in test automation and automation
    framework development.
  - Hands-on experience with any automation framework –
    Selenium, Playwright, Cypress, WebdriverIO, Appium, or
    similar.
  - Strong programming/scripting experience in any language –
    Java, Python, JavaScript, TypeScript, C#, or similar.
  - Experience with API testing/automation and REST APIs.
  - Experience designing, developing, and maintaining reusable
    automation frameworks.
  - Strong understanding of functional, regression, integration,
    and end-to-end testing.
  - Exposure to AI-driven testing or AI-assisted Quality
    Engineering.
  - Experience working with Generative AI, LLMs, AI Agents, or
    Prompt Engineering.
  - Exposure to AI tools such as OpenAI, Azure OpenAI, GitHub
    Copilot, Claude, AutoGen, or similar.
  - Good understanding of CI/CD and DevOps practices.
  - Strong analytical, debugging, problem-solving, and
    communication skills.

  Good to Have

  - Experience with Agentic AI / Multi-Agent systems.
  - Knowledge of RAG and LLM evaluation.
  - Experience with AI-powered test generation, self-healing
    automation, or intelligent test analysis.
  - Exposure to Azure, AWS, or GCP.
  - Knowledge of performance, security, or accessibility
    testing.
  - Experience with tools such as Jira, Azure DevOps, Jenkins,
    GitHub Actions, or similar.

  What We're Looking For

  - Strong automation and quality engineering mindset.
  - Passion for applying AI to solve software testing
    challenges.
  - Ability to learn and work with new automation and AI
    technologies.
  - Ownership of automation initiatives from design through
    implementation.
  - Strong collaboration and communication skills.
