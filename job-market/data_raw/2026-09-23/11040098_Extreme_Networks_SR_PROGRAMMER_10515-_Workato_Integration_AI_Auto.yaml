description: |
  We are looking for an experienced Workato Integration & AI
  Automation Developer to join our team. This role will focus
  on building enterprise integrations, automation solutions,
  and AI-powered workflows across Salesforce and other
  business applications.

  The ideal candidate will have strong hands-on expertise in
  Workato, Python, APIs, integration architecture, and
  AI/GenAI technologies, with working knowledge of Salesforce.



  Experience: 4-7 Years

  Key Responsibilities

  - Design, build, and maintain complex Workato recipes,
    integrations, custom connectors, and automation workflows.
  - Develop integrations between enterprise applications such as
    Salesforce, ServiceNow, Oracle, Snowflake, marketing
    platforms, and other SaaS applications.
  - Build reusable integration components, APIs, and services
    using Python.
  - Design end-to-end integration and automation architecture,
    including system interactions and data flows.
  - Develop AI/GenAI-powered automations using LLMs and
    enterprise data.
  - Build agentic workflows where AI agents can retrieve data,
    reason over information, and execute actions across
    enterprise applications.
  - Build and integrate solutions using MCP (Model Context
    Protocol), AI agents, APIs, and RAG architectures.
  - Develop RAG-based applications that combine enterprise data
    and knowledge sources with LLMs.
  - Work with REST APIs, webhooks, event-driven integrations,
    queues, and asynchronous processing.
  - Develop Python utilities and services for data processing,
    API orchestration, AI integrations, and automation.
  - Implement robust error handling, retry mechanisms, logging,
    monitoring, and integration observability.
  - Troubleshoot complex integration, API, authentication, and
    data-flow issues.
  - Partner with architects, developers, business analysts, and
    business teams to translate requirements into scalable
    automation solutions.
  - Ensure integrations follow enterprise standards for
    security, scalability, performance, and maintainability.

  Required Qualifications

  - 4+ years of strong hands-on Workato experience.
  - Extensive experience developing:
  - Strong hands-on programming experience with Python.
  - Strong understanding of:
  - Experience designing enterprise integration architecture and
    system-to-system data flows.
  - Experience integrating multiple SaaS and enterprise
    applications.
  - Experience with AI/GenAI and Large Language Models (LLMs).
  - Experience with prompt engineering and AI-powered
    automation.
  - Understanding or hands-on experience with:
  - Ability to independently design and implement end-to-end
    automation solutions.
