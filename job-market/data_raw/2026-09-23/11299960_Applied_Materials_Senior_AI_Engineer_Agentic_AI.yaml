description: |
  Who We Are

  Applied Materials is the global leader in materials science
  and engineering solutions that are at the foundation of
  virtually every new semiconductor chip and advanced display
  in the world. The equipment that we create and service is
  essential to advancing AI and accelerating the
  commercialization of next-generation semiconductor chips.
  Join us and push the boundaries of materials science and
  engineering in a company at the foundation of the
  electronics industry. The work we do together advances the
  world’s technology.

  What We Offer

  Location:

  Bangalore,IND

  You’ll benefit from a supportive work culture that
  encourages you to learn, develop, and grow your career as
  you take on challenges and drive innovative solutions for
  our customers. We empower our team to push the boundaries of
  what is possible—while learning every day in a supportive
  leading global company. Visit our Careers website to learn
