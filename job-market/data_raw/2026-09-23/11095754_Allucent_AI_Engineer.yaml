description: |
  At Allucent™, we are dedicated to helping small-medium
  biopharmaceutical companies efficiently navigate the complex
  world of clinical trials to bring life-changing therapies to
  patients in need across the globe.

  Allucent (India) Pvt. Ltd.  is seeking an innovative and
  experienced Senior AI Developer (5–8 years) to join our
  GenAI technology team. This role focuses on building and
  maintaining intelligent, data-driven solutions leveraging
  Python, Fast API, Azure OpenAI, Azure Cognitive Search, and
  RAG-based architectures. The ideal candidate will design and
  implement end-to-end AI-driven applications integrated with
  Cosmos DB, Azure Search, and modern web technologies such as
  React, while also exploring online intelligence sources like
  Perplexity for advanced retrieval and reasoning.



  In this role your key tasks will include:

  - Architect, develop, and deploy scalable AI-driven systems
    using Python, FastAPI, and Azure OpenAI. React JS,
    Typescript, Redux Build and maintain microservices using
    Python, FastAPI for AI and data processing workflows.
  - Design and optimize Retrieval-Augmented Generation (RAG)
    pipelines integrating Azure Cognitive Search and Cosmos
    DB.
  - Integrate advanced search functionalities using Azure
    Cognitive Search and external search APIs (e.g.,
    Perplexity, Bing Search API)
  - Utilize MS Visual Studio Code, Git, and Azure DevOps for
    version control and CI/CD deployment.
  - Prepare detailed documentation of APIs, workflows, and AI
    pipelines for maintainability and scalability.

  Requirements

   To be successful you should possess :

  - Educational Background: BE, B.Tech, MCA, or MSc in Computer
    Science, Artificial Intelligence, or Data Engineering.
  - Experience: 5–8 years of hands-on experience in AI/ML or
    full-stack development with AI integration.
  - Technical Expertise: Python FastAPI, Node.js, React, Azure
    OpenAI, Azure Cognitive Search, Cosmos DB, and RAG
    pipelines. Tools & Technologies: MS Visual Studio Code,
    Git, Azure DevOps, REST APIs, and online AI platforms such
    as Perplexity.
  - Knowledge of: Prompt engineering, vector search, embedding
    management, and generative model optimization.



  Benefits

  Benefits of working at Allucent include:

  - Comprehensive benefits package per location
  - Competitive salaries per location
  - Departmental Study/Training Budget for furthering
    professional development
  - Flexible Working hours (within reason)
  - Leadership and mentoring opportunities
  - Participation in our enriching Buddy Program as a new or
    existing employee
  - Internal growth opportunities and career progression
  - Financially rewarding internal employee referral program
  - Access to online soft-skills and technical training via
    GoodHabitz and internal platforms
  - Eligibility for our Spot Bonus Award Program in recognition
    of going above and beyond on projects
  - Eligibility for our Loyalty Award Program in recognition of
    loyalty and commitment of longstanding employees.

  About Allucent

  Our mission is to help bring new therapies to light. When
  you work at Allucent, that means applying your unique skill
  set, expertise, and knowledge to build partnerships with our
  clients in their pursuit to develop new, life-improving
  treatments.

  If you're passionate about helping customers develop new
  pharmaceuticals and biologics; have an entrepreneurial
  spirit; and ready to join other science, business, and
  operations leaders, we would love to get to learn more about
  how we can help each other grow.

  Together we SHINE. find more information about our values.

  Apply now!

  If you’re ready to bring your passion for clinical
  development and business growth to Allucent, apply today or
  reach out to Naureen Shahdaan
  (naureen.shahdaan@allucent.com) for more information.

  Disclaimers:

  *Our in-office work policy encourages a dynamic work
  environment, prescribing 2 days in office per week for
  employees within reasonable distance from one of our global
  offices. For this role you can be home-based.



