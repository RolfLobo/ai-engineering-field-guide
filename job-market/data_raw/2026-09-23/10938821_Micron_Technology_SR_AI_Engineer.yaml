description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever.

  - Provide technical consulting and hands-on assistance to Fab
    area teams to create and/or identify best solutions,
    troubleshoot existing solutions, and deploy new solutions.
  - Design and build cloud-based data pipelines (ingestion,
    transformation, feature engineering) on GCP and the Micron
    data ecosystem (GDW, BigQuery, Snowflake, GDML/SMAPI).
  - Develop, train, deploy, and monitor machine learning models
    using Vertex AI and modern MLOps practices (pipelines,
    model registry, drift/performance monitoring).
  - Build and integrate APIs for application integration (e.g.,
    Apigee gateway patterns, token authentication,
    routing/proxy).
  - Develop production-grade full-stack applications and
    dashboards - Angular front-ends and rapid prototypes
    (Streamlit / Omelek) - with strong UI/UX.
  - Implement CI/CD pipelines for automated build, test, and
    deployment (Cloud Build, Bitbucket, Jenkins/Azure DevOps,
    container orchestration).
  - Extract data from diverse databases via SQL and other query
    languages; apply data cleansing, outlier identification,
    and missing-data techniques.
  - Apply advanced analytics - statistical modeling, feature
    extraction, and supervised / unsupervised / semi-
    supervised learning - on terabyte- to petabyte-scale
    manufacturing datasets.
  - Contribute to GenAI / Agentic AI initiatives where
    applicable (Gemini LLM APIs, RAG, MCP tooling, multi-agent
    workflows) following Micron's Responsible AI guidelines.
  - Perform data analysis and validation; ensure pipeline
    governance, auditability, and integrity.
  - Work within Agile frameworks and collaborate multi-
    functionally across DS, DE, SWE, and Fab teams.

