title: Software Engineer II (Dot Net+ Palantir/ AI)(5-8 years experience Required)
company: General Mills
location: Powai, IND
work_type: FULL_TIME
company_size: 21,000 Employees
description: |
  COMPANY OVERVIEW

  We exist to make food the world loves. But we do more than
  that. Our company is a place that prioritizes being a force
  for good, a place to expand learning, explore new
  perspectives and reimagine new possibilities, every day. We
  look for people who want to bring their best — bold thinkers
  with big hearts who challenge one another and grow together.
  Because becoming the undisputed leader in food means
  surrounding ourselves with people who are hungry for what’s
  next.

  OVERVIEW

  You will build and enhance end-to-end digital solutions
  supporting the Palantir engineering portfolio at General
  Mills. This role gives you the opportunity to work on
  complex business applications, partner with global teams,
  and contribute to how software solutions are designed,
  developed, tested, and delivered. You will collaborate with
  engineers, architects, and cross-functional partners to
  create scalable, reliable, and high-quality applications. If
  you enjoy hands-on development, solving technical problems,
  and growing into a strong technical leader, this role offers
  strong impact and learning.



  KEY ACCOUNTABILITIES

  - Collaborate with engineers, architects, product partners,
    and business stakeholders to design and deliver business-
    value-driven software solutions.
  - Translate application storyboards and use cases into
    functional, scalable applications using the .NET
    technology stack and modern web frameworks.
  - Ensure code follows current engineering standards, testing
    practices, and maintainability expectations.
  - Write unit and integration tests and contribute to
    automation that improves delivery quality and team
    efficiency.
  - Optimize application performance, quality, responsiveness,
    and reliability across the software lifecycle.
  - Troubleshoot, debug, and resolve production and application
    issues with strong ownership and problem-solving skills.
  - Contribute to technical design reviews, code reviews, work
    planning, estimation, and implementation activities across
    projects.
  - Support the adoption of modern engineering practices,
    emerging technologies, and knowledge-sharing across the
    team.
  - Build strong working relationships and mentor less
    experienced team members through collaboration, informal
    coaching, and technical guidance.



  MINIMUM QUALIFICATIONS

  - Bachelor’s degree from an accredited university.
  - 5 or more years of related software engineering experience.
  - Strong system-level knowledge for building end-to-end
    applications using the .NET technology stack, including
    C#, ASP.NET, ASP.NET Core, and RESTful application
    programming interfaces.
  - Experience with modern JavaScript frameworks such as React,
    Angular, Vue, or similar technologies.
  - Experience designing, developing, testing, troubleshooting,
    and maintaining scalable applications across multiple
    layers of the software stack.
  - Experience with DevOps concepts and tools, including
    continuous integration and continuous delivery practices,
    containers, and source control workflows.
  - Experience with database systems and strong working
    knowledge of SQL and NoSQL platforms.
  - Ability to write effective unit, integration, and automation
    tests and to identify and resolve application performance
    issues.
  - Strong understanding of agile ways of working, including
    sprint planning, task estimation, and iterative delivery.
  - Strong communication skills with the ability to explain
    technical concepts clearly and work effectively with
    business and technical stakeholders.
  - Demonstrated ownership, initiative, and problem-solving
    ability across multiple tasks and project
    responsibilities.



  PREFERRED QUALIFICATIONS

  - Degree in computer science or a related technical
    discipline.
  - Experience with low-code platforms.
  - Experience with cloud technologies such as Google Cloud
    Platform or Microsoft Azure.
  - Experience with Python or data and integration technologies.
  - Experience with modern DevOps tooling such as Jenkins or
    container-based deployment practices.
  - Experience contributing to medium to large projects and
    becoming a go-to technical resource for a team or business
    group.
  - Passion for emerging technologies, experimentation, and
    continuous learning.

  ELIGIBILITY

  Applicants must meet minimum age qualifications in the
  country in which the job is located.
