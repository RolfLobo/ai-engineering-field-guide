description: |
  IFM Investors is a global asset manager, founded and owned
  by pension funds, with capabilities in infrastructure equity
  and debt, private equity, private credit, real estate and
  listed equities.

  Our purpose is to invest, protect and grow the long-term
  retirement savings of working people. We believe healthy
  returns depend on healthy economic, environmental and social
  systems - and these are evolving on a scale never
  experienced before. To find opportunity, build value and
  meet the needs of future generations, you need scale, skill
  and expertise. That’s what IFM Investors has built up over
  30 years.

  With assets under management of approximately $291.1 AUD
  billion (at 30 June 2026), we prioritise the interests of
  over 883 institutional investors worldwide. IFM operates
  from 17 offices across Australia, Europe, North America and
  Asia.

  For more information, visit ifminvestors.com.

  The Opportunity

  At IFM, you’re not just part of an investment company – but
  an invested one. We see the work we do as the chance to take
  sustainable, responsible steps forward for millions of
  people around the world. So, we have made sure to create a
  workplace that’s inclusive, accountable and collaborative.
  Where you’re given the opportunities to make a meaningful
  contribution and grow your skills. All while feeling valued
  and supported for who you are and what you bring to the
  team. Along with the chance to make a meaningful, positive
  difference from day one, we offer a competitive salary and
  generous leave entitlements. Our hybrid and flexible
  approach can vary by team and role, it is built around
  trust. We encourage our people to manage their work life
  rhythm in a way that works best for them and their teams.

  Business Overview

  Our Clients & Strategy team covers Business Development,
  Investor Relations, External Relations, Sustainable
  Investment and Brand, Marketing & Communications, including
  Internal Communications. It is responsible for all
  communications to investor prospects, existing investors and
  their asset consultants, as well as a broad range of other
  stakeholders, including governments and media.



  The Role

  The AI Growth Engineer will sit within Marketing, Brand &
  Communications and work across Clients & Strategy to
  identify, build and scale practical AI-enabled solutions
  that improve client outcomes, commercial effectiveness,
  employee experience and operational efficiency.

  This is a hands-on builder and strategist role. The role
  will help C&S move from AI ideas and pilots to real workflow
  change by partnering with teams to reimagine processes,
  design use cases, build prototypes and minimum viable
  solutions, and support adoption into day-to-day ways of
  working.

  The role will work across MB&C, Global Client Solutions,
  Sustainable Investment, Product Strategy & Innovation,
  Global External Relations and other relevant C&S teams. It
  will convert business problems into AI-enabled workflows,
  using approved enterprise platforms and tools such as
  Microsoft Copilot, Copilot Studio, Power Platform, Power
  Automate, Power BI, Microsoft Fabric and other approved AI
  and automation tools.

  The role will also support the C&S AI Innovation Forum,
  build AI fluency across C&S, maintain a pipeline of AI
  opportunities and ensure AI solutions are developed
  responsibly, securely and in line with IFM governance,
  privacy, compliance and risk settings.



  Your Background and Experience

  •Experience working in AI, automation, data, digital
  transformation, product management, marketing technology,
  analytics, workflow redesign or a related field.

  •Proven ability to translate business problems into
  practical AI, automation or data-enabled solutions.

  •Experience building or configuring AI-enabled tools,
  agents, workflows, dashboards or automations using low-code,
  no-code or technical platforms.

  •Experience designing and delivering pilots, prototypes or
  minimum viable products in a business environment.

  •Strong understanding of how AI can improve business
  processes, knowledge management, reporting, client insight,
  content workflows, productivity and decision support.

  •Experience working with senior stakeholders to define
  problems, design solutions and measure outcomes.

  •Comfortable operating between business teams and
  Technology, with the ability to explain technical concepts
  clearly to non-technical audiences.

  •Strong understanding of responsible AI principles,
  including data privacy, bias, accuracy, governance,
  transparency and human accountability.

  •Desirable: experience in financial services, asset
  management, professional services or another regulated
  environment.

  •Desirable: experience with Microsoft Copilot, Copilot
  Studio, Power Platform, Power Automate, Power BI, Microsoft
  Fabric, APIs, prompt engineering, agentic AI workflows,
  Python or SQL.



  Qualifications

  •Bachelor’s degree or equivalent experience in a relevant
  field such as technology, business, data, marketing,
  computer science, engineering, digital transformation,
  analytics or innovation.

  •Desirable: qualifications or certifications in AI, data
  analytics, automation, product management, agile delivery,
  Microsoft Power Platform, Microsoft Fabric, responsible AI
  or digital transformation.


  Business knowledge

  •Computer science, engineering, digital transformation,
  analytics or innovation.

  •Understanding of how MB&C supports commercial outcomes,
  client engagement, reputation, brand positioning and
  business growth.

  •Understanding of how C&S teams create value through client
  relationships, product development, sustainability, market
  insight, communications and commercial execution.

  •Ability to connect AI opportunities to practical business
  outcomes, including improved speed, quality, consistency,
  client insight, productivity and decision support.

  •Interest in private markets, institutional investors and
  long-term capital.

  •Understanding of working in a regulated environment,
  including the need for strong governance, human judgement
  and careful handling of data.



  Technical Knowledge

  •Understanding of workflow automation and process
  orchestration.

  •Practical understanding of AI tools, large language models,
  prompt engineering and AI-enabled workflows.

  •Experience building solutions with low-code or no-code
  platforms.

  •Studio, Power Platform, Power Automate, Power BI or similar
  tools.

  •Working knowledge of Microsoft 365 and the Microsoft
  ecosystem, including Copilot, Copilot

  •Familiarity with data quality, data governance, structured
  and unstructured data sources.

  •Ability to design, test and refine AI outputs for accuracy,
  usefulness and usability.

  •Understanding of responsible AI, including privacy,
  security, bias, hallucination risk, transparency and human
  review.

  •Desirable: Microsoft Fabric, APIs, data integrations,
  Python, SQL, vector search, knowledge bases, retrieval-
  augmented generation, CRM, martech and client intelligence
  platforms
