  term disability coverage, life insurance as well as 401k
  contribution (all benefits are subject to eligibility
  requirements). Learn more about our benefits by visiting
  Motive Perks & Benefits. The compensation range for this
  position will depend on where you reside. For this role, the
  compensation range is:

  United States

  $140,000—$160,000 USD

