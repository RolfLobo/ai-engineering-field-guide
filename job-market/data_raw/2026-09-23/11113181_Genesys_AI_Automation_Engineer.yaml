  Job Description

  Job Title: AI Automation Engineer Department & Team: IT
  Reports to: Manager, AI Enablement & Automation

  ABOUT THE ROLE

  The AI Automation Engineer designs and delivers intelligent
  automation solutions that eliminate manual toil and
  accelerate how work gets done across Genesys IT. You will
  move the organization's automation capability forward from
  traditional RPA toward modern agentic frameworks, combine
  strong Python engineering with Playwright-based workflows,
  and AI-driven process automation — applying engineering
  discipline at every stage from discovery through production.

  The automation landscape here is a mix of existing RPA
  implementations that need to be kept running reliably and a
  growing body of new work built on modern tooling. You will
  contribute to both — supporting what's already deployed
  while building new solutions that raise the bar on what
  automation can do at Genesys.

  WHAT YOU'LL DO

  Automation Design & Development

  - Design, build, and deploy automation solutions — ranging
    from Playwright-based browser workflows to API-driven
    integrations and AI-augmented pipelines — that measurably
    reduce manual effort in IT and business operations.

  - Maintain and support existing RPA automations, diagnosing
    failures, handling changes to dependent systems, and
    keeping deployed solutions running reliably for the teams
    that depend on them.

  - Translate process maps and business requirements into well-
    structured, maintainable automation code with clear error
    handling, logging, and recovery logic.

  - Establish and maintain a sustainable support model for
    deployed automations, including documentation, version
    control, and change management practices.



  Agentic & AI-Driven Automation

  - Prototype and productionize agentic workflows using modern
    frameworks (e.g., LangChain, CrewAI, AutoGen, or similar),
    integrating LLM capabilities where they add precision or
    flexibility beyond rule-based automation.

  - Connect automation workflows with enterprise AI platforms
    (Claude, ChatGPT Enterprise, Amazon Q) via APIs to enable
    intelligent, context-aware process execution.

  - Evaluate the team's automation stack and contribute to
    discussions about where legacy RPA approaches should be
    augmented with AI-native tooling, backed by concrete
    performance comparisons.



  Discovery, Delivery & Continuous Improvement

  - Partner with IT and business stakeholders to identify and
    prioritize automation opportunities, using process
    analysis and effort/impact scoring to focus engineering
    capacity where it delivers the most value.

  - Instrument deployed automations with telemetry that tracks
    execution volume, error rates, and time saved — feeding
    data back into prioritization and optimization decisions.

  - Contribute to team standards for automation architecture,
    code quality, and governance, helping establish patterns
    the broader team can reuse and build on.



  WHAT YOU BRING

  Required Qualifications

  - 3+ years building automation solutions in a professional
    context — including scripted workflows, RPA
    implementations, or API integrations delivered to
    production.

  - Hands-on experience with at least one RPA platform
    (Automation Anywhere, Power Automate, UiPath, or
    equivalent), including maintaining live automations and
    diagnosing failures.

  - Proficiency in Python or JavaScript/TypeScript for
    automation engineering, with a track record of writing
    readable, maintainable code.

  - Demonstrated ability to work with REST APIs — including
    authentication, rate limiting, error handling, and
    chaining multi-step API workflows.

  - Experience mapping and decomposing business processes to
    identify automation fit and design solution architecture
    before writing code.

  Preferred Qualifications

  - Experience with Playwright or similar browser automation
    tools — or a demonstrated ability to pick up new
    automation frameworks quickly.

  - Experience building or experimenting with agentic automation
    frameworks (LangChain, CrewAI, AutoGen, or similar).

  - Familiarity integrating LLM APIs (OpenAI, Anthropic, or
    similar) into workflow automation to handle unstructured
    data or decision logic.

  - Exposure to CI/CD practices for automation deployment —
    version control, testing pipelines, and change management.



  KEY SKILLS

  - RPA platform experience and automation lifecycle management

  - Automation engineering and workflow development

  - Python or JavaScript/TypeScript scripting

  - Agentic and LLM-integrated automation design

  - API integration and REST workflow orchestration

  - Process analysis and opportunity identification



  BUSINESS IMPACT

  - Keeps existing automation running reliably while delivering
    new solutions that reduce manual toil across IT and
    business operations.

  - Advances Genesys's automation maturity from legacy RPA
    toward AI-native, agentic workflows — increasing the
    complexity and business value of problems the team can
    address.

  - Creates a measurable, data-backed automation portfolio: each
    deployment tracked by execution volume, error rate, and
    hours saved — giving leadership clear visibility into ROI.

  Working hours: 3:00 PM-11:00 PM

