description: |
  Company Description

  Ubisoft is a global leader in gaming with teams across the
  world creating original and memorable gaming experiences,
  from Assassin’s Creed, Rainbow Six to Just Dance and more.
  We believe diverse perspectives help both players and teams
  thrive. If you’re passionate about innovation and pushing
  entertainment boundaries, join our journey and help us
  create the unknown!



  Job Description

  Job Purpose:

  The Junior R&D Engineer supports the development of designs,
  prototypes, and implements tools, frameworks, and automation
  solutions that improve game testing and quality control
  workflows. Under guidance from the R&D Manager and senior
  engineers, the role translates validated ideas into
  functional components and integrations within the QC domain.

  IMPACT:

  • Develop and integrate automation tools, frameworks, and
  prototypes into existing testing systems, applying validated
  R&D concepts. • Build applied automation solutions across
  use cases including automation tests, engine-level
  utilities, and early AI/ML-driven tools, improving test
  efficiency and reducing manual effort. • Debug,
  troubleshoot, and refine R&D solutions, stabilizing
  functionality and increasing usability for QC teams. •
  Deliver iterative development outputs by incorporating
  feedback and aligning solutions with product and FQC
  requirements. • Document technical findings and learnings to
  strengthen knowledge continuity, reuse, and long-term
  maintainability.

  INNOVATION :

  • Evaluate new technical approaches, tools, and frameworks
  that enhances QA/QC automation, leveraging exposure to
  automation, engine tooling, and AI/ML concepts. • Propose
  improvements to existing automation systems, integrations,
  and workflows based on hands-on development and debugging
  experience. • Build functional components from exploratory
  prototypes, validating feasibility in real testing
  environments. • Analyse moderately complex, multi-
  dimensional problems, balancing technical feasibility,
  integration constraints, and QC usability under senior
  guidance.

  KNOWLEDGE :

  **Core Competencies** • Rapid learning agility and
  motivation to master new concepts • Analytical problem-
  solving with creative and structured approaches •
  Collaborative communication across cross-functional teams •
  Adaptability to evolving priorities and iterative workflows

  **Technical Competencies** • Foundational proficiency in
  Python for scripting and automation • Working understanding
  of AI/ML concepts and Gen-AI/RAG fundamentals • Knowledge of
  software development and testing lifecycles • Familiarity
  with debugging and troubleshooting techniques • Exposure to
  version control systems (e.g., Git)

  **Behavioral Competencies** • Intellectual curiosity and
  drive to explore emerging technologies • Proactive teamwork
  and willingness to collaborate across disciplines

  **Nice to Have:** • Exposure to C++ or C# programming •
  Familiarity with CI/CD tools (e.g., Jenkins, TeamCity)

  Qualifications

  B.E/BTech/MTech/MS Computer Science in computer science or
  equivalent.
