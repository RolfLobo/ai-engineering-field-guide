description: |
  We’re seeking a future team member for the role of Director,
  AI / Machine Learning Software Engineer to join our team.
  This role is located in Manchester or London.

  Role Summary:

  The AI/ML Software Engineering within the Enterprise
  Transformation Hub will help drive the acceleration of AI-
  enabled solution delivery across the ecosystem. This role is
  responsible for designing and building high-quality, usable
  solutions that strengthen connectivity across platforms,
  data sets, and AI capabilities. The individual will create
  linkages that improve context, reuse, and scalability, while
  applying strong technical judgement and strategic vision to
  move solutions forward. They will play a key role in shaping
  reusable skills, patterns, and engineering practices that
  help BNY deliver more integrated and effective AI outcomes.

  In this role, you’ll make an impact in the following ways:

  - Leads complex machine learning initiatives with direct
    strategic impact, applying deep knowledge of machine
    learning concepts and their practical business
    applications
  - Directly contributes to strategic goals and corporate
    direction through innovative AI and machine learning
    solutions
  - Provides organizational leadership and develops proposals
    that help move the business forward.
  - Builds and strengthens partnerships with internal and
    external stakeholders across BNY
  - Conducts studies and analysis to provide the facts needed to
    support informed strategic decisions.
  - Builds AI-enabled solutions that move from concept to
    production use
  - Connects data, models, and systems to ensure solutions
    operate effectively within the broader technology
    ecosystem
  - Improves quality, usability, and reliability so outcomes are
    practical, trusted, and effective for users.
  - Creates reusable components and patterns that accelerate
    future delivery
  - Drives innovation by identifying opportunities where AI can
    create meaningful value

  To be successful in this role, we’re seeking the following:

  - Bachelor’s degree in computer science, engineering, or a
    related discipline, or equivalent work experience
    required; advanced degree is beneficial
  - Significant related experience required; experience in the
    securities or financial services industry is a plus.
  - Strong proficiency in Python and SQL required, with working
    knowledge of JavaScript/TypeScript; knowledge of Angular
    is beneficial
  - Strong communication, organization, teamwork, and
    interpersonal skills, with the ability to support
    mentoring and collaborate effectively with cross-
    functional teams
  - Advanced degree in STEM, Engineering, or a related field, or
    equivalent work experience preferred
  - Expertise in AI and machine learning software development
  - Strong problem-solving skills with the ability to manage
    complex data processes

