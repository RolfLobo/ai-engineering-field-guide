description: |
  We’re not just building tech - we’re building smart,
  scalable solutions that make a real impact. We’re on the
  lookout for a curious and driven AI/ML Engineer - Senior
  who’s excited about pushing the boundaries of what AI and
  machine learning can do. If you love working on real-world
  challenges, experimenting with the latest in generative AI,
  and mentoring a talented team, this role is for you.

  Requirements

  - 3-5 years of experience shipping ML systems in production
  - Build classical ML models such as XGBoost, ensembles, and
    time-series methods for fall detection and health risk
    scoring
  - Engineer features from raw and sparse radar signal and
    point-cloud data
  - Contribute to CV-adjacent work such as pose and skeleton
    estimation from radar
  - Build data pipelines on Databricks for training and
    inference
  - Own model evaluation, including precision, recall, and
    false-alarm reduction, for a safety-critical system
  - Deploy and monitor models in production
  - Strong Python and classical ML fundamentals
  - Some exposure to computer vision or sensor and spatial data
  - Working knowledge of data engineering and Databricks
  - Comfortable working with ambiguity in a small, fast-moving
    team
  - Bonus: Health tech or IoT experience, and MLOps experience
    with ONNX or quantization

  Benefits

  - Comprehensive insurance coverage that gives you peace of
    mind, so you can focus on doing your best work
  - Flexible work arrangements designed to support sustained
    productivity, personal well-being, and work-life balance
  - Continuous learning and accelerated skill development
    through hands-on projects and mentorship from experienced
    industry leaders
  - Global client exposure across 20+ countries, offering real-
    world experience with diverse markets and business
    environments
  - Opportunity to work on high-impact, large-scale projects
    that have collectively generated over $1B in measurable
    business value
  - Competitive, market-aligned compensation packages that
    recognize performance, expertise, and long-term
    contribution
  - Monthly demo days that celebrate innovation, showcase your
    work, and give you a real voice in what we build
  - Annual recognition programs and performance-driven awards in
    a truly meritocratic environment
  - Referral bonuses that reward you for helping grow a strong,
    like-minded team
  - A strong problem-solving culture with opportunities to
    tackle meaningful, real-world challenges
  - A positive, people-first workplace that supports happiness,
    balance, and long-term growth
