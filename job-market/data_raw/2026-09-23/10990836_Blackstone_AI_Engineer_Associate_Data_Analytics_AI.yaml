description: |
  Blackstone is the world’s largest alternative asset manager.
  Blackstone seeks to deliver compelling returns for
  institutional and individual investors by strengthening the
  companies in which the firm invests. Blackstone’s over $1.3
  trillion in assets under management include global
  investment strategies focused on real estate, private
  equity, credit, infrastructure, life sciences, growth
  equity, secondaries and hedge funds. Further information is
  available at www.blackstone.com. Follow @blackstone on
  LinkedIn, X (Twitter), and Instagram.

  BXTI is fast paced and entrepreneurial – our open, iterative
  design processes and rapid pace of development means that
  everyone on the team has the opportunity to make an impact
  from day one. We are problem solvers who can take projects
  from idea to implementation. We believe in active mentoring
  and developing excellence. We collaborate to find the best
  answers for our customers and for Blackstone. We are
  critical to the firm maintaining its competitive edge.

  We are seeking an AI Engineer to join BXTI’s Alternative
  Asset Management Technology’s Data Analytics & AI team,
  supporting BXMA, Private Equity, Real Estate, and Private
  Wealth. This role aims to accelerate AI adoption through
  discovery, enablement, and execution – co-locating with the
  business, shadowing live workflows, and shipping solutions
  against the use cases they uncover. You will work at the
  intersection of engineering and the business, closing the
  last-mile gap between enterprise AI capability and the
  workflows our people rely on every day.

  Responsibilities:

  - Embed with business units – shadowing live workflows,
    engaging AI power users and champions, and developing
    functional fluency in how the business raises, services,
    and reports on capital.
  - Translate observed workflow friction into a prioritized
    pipeline of self-service quick wins and larger platform
    initiatives, validating demand across teams before
    committing to build.

  - Develop and maintain production software solutions using
    Python and SQL, ensuring code quality, scalability,
    reliability, and security.
  - Use code deployment best practices, including the use of
    change control (e.g., Git), CI/CD tooling,
    containerization (e.g., Docker), and cloud deployment
    technologies (e.g., Terraform).
  - Build and extend applied AI solutions – agentic workflows,
    retrieval pipelines, and evaluation tooling – and scale
    adoption through validated self-service runbook and prompt
    libraries released to the business.
  - Promote and cultivate a culture of data analytics, science,
    and AI within the firm, including leading talks and
    training sessions for both technology and business teams.
  - Lead multiple concurrent projects and collaborate
    effectively with the broader BXTI organization to
    transition proofs of concept into supported production
    deployments.

  Qualifications:

  - 3+ years in an AI engineering, software engineering, or data
    analysis role, with fluency in Python and SQL for
    interacting with data and data warehouses.
  - Applied experience with LLMs and AI tooling, including fine-
    tuning, prompt engineering, agentic workflows, retrieval,
    or model evaluation and benchmarking.
  - Demonstrated experience shipping and maintaining production
    systems under real user load, rather than prototypes or
    scripts.
  - Proficiency in developing within proper software development
    lifecycle tools, such as version control, CI/CD tools,
    containerization, and cloud deployment technologies.
  - Demonstrated experience to ramp quickly on unfamiliar tools
    and technology stacks with minimal supervision.
  - Experience working directly with non-technical business
    stakeholders to elicit requirements, understand existing
    processes, and shape solutions collaboratively before
    building.
  - Experience working within a technology team for a financial
    firm, with a preference for alternative asset management,
    private wealth, or fund distribution.
  - Strong communication skills, both verbal and written,
    including experience communicating to both business and
    technical coworkers, and author documentation appropriate
    for the user community, development teams, and upper
    management.
  - Experience defining project scope and manage and communicate
    scope changes.
  - Experience managing multiple priorities and raise issues in
    a timely and productive fashion.
  - Bachelor's or Master's degree in Computer Science,
    Engineering, Finance, or Economics.

  The duties and responsibilities described here are not
  exhaustive and additional assignments, duties, or
  responsibilities may be required of this position.
  Assignments, duties, and responsibilities may be changed at
  any time, with or without notice, by Blackstone in its sole
  discretion.

  Expected annual base salary range:

  $110,000 - $170,000

  Actual base salary within that range will be determined by
  several components including but not limited to the
  individual's experience, skills, qualifications and job
  location. For roles located outside of the US, please
  disregard the posted salary bands as these roles will follow
  a separate compensation process based on local market
  comparables. Additional compensation and benefits offered in
  connection with the role consist of comprehensive health
  benefits, including but not limited to medical, dental,
  vision, and FSA benefits; paid time off; life insurance;
  401(k) plan; and discretionary bonuses. Certain employees
  may also be eligible for equity and other incentive
  compensation at Blackstone’s sole discretion.

  Blackstone is committed to providing equal employment
  opportunities to all employees and applicants for employment
  without regard to race, color, creed, religion, sex,
  pregnancy, national origin, ancestry, citizenship status,
  age, marital or partnership status, sexual orientation,
  gender identity or expression, disability, genetic
  predisposition, veteran or military status, status as a
  victim of domestic violence, a sex offense or stalking, or
  any other class or status in accordance with applicable
  federal, state and local laws. This policy applies to all
  terms and conditions of employment, including but not
  limited to hiring, placement, promotion, termination,
  transfer, leave of absence, compensation, and training.  All
  Blackstone employees, including but not limited to
  recruiting personnel and hiring managers, are required to
  abide by this policy.

  If you need a reasonable accommodation to complete your
  application, please contact Human Resources at 212-583-5000
  (US), +44 (0)20 7451 4000 (EMEA) or +852 3656 8600 (APAC).

  Depending on the position, you may be required to obtain
  certain securities licenses if you are in a client facing
  role and/or if you are engaged in the following:

  - Attending client meetings where you are discussing
    Blackstone products and/or and client questions;
  - Marketing Blackstone funds to new or existing clients;
  - Supervising or training securities licensed employees;
  - Structuring or creating Blackstone funds/products; and
  - Advising on marketing plans prepared by a sales team or
    developing and/or contributing information for marketing
    materials.

  Note: The above list is not the exhaustive list of
  activities requiring securities licenses and there may be
  roles that require review on a case-by-case basis.  Please
  speak with your Blackstone Recruiting contact with any
  questions. To submit your application please complete the
  form below. Fields marked with a red asterisk * must be
  completed to be considered for employment (although some can
  be answered "prefer not to say"). Failure to provide this
  information may compromise the follow-up of your
  application. When you have finished click Submit at the
  bottom of this form.
