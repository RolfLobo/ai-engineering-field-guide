description: |
  About Us:

  ClearRoute is an engineering consultancy bridging Quality
  Engineering, Cloud Platforms and Developer Experience. We
  help enterprises reliably bring high-impact digital products
  to market faster, cheaper, and safer, working with
  technology leaders facing complex business challenges.

  We take as much pride in our people, culture and work-life
  balance as we do in making better software. We’re not just
  making better software. We’re making the making of software
  better. Collaborative, entrepreneurial and dedicated to
  problem solving, we bring the step change our customer need
  to sustain innovation. Our values challenge us to do the
  best we can for ClearRoute, our customers and most
  importantly our team. This is an opportunity for you to
  build the organisation from the ground up, use your voice to
  drive change and help transform organisations and problem
  domains.

  Role:

  We are looking for a Cloud Engineer with strong software
  engineering fundamentals and an interest in building modern
  platform and AI-enabled capabilities.

  You will work as part of an engineering team developing
  reusable services, APIs, automation and cloud-native
  capabilities that support application modernisation and AI-
  enabled workflows.

  Engineers may bring greater depth in software and AI
  engineering, platform and cloud engineering, or full-stack
  development. Strong candidates will demonstrate depth in at
  least one of these areas, supported by solid engineering
  fundamentals and the ability to contribute across adjacent
  parts of the technology stack.

  Key Responsibilities:

  - Design, build and maintain reliable, testable, production-
    quality software
  - Develop APIs, services and automation that support
    engineering and business workflows
  - Contribute to cloud-native applications and internal
    platform capabilities
  - Build integrations between applications, APIs, developer
    tooling and external services
  - Contribute to automated delivery through CI/CD pipelines
  - Work with engineers to design reusable capabilities that can
    be consumed by other teams
  - Contribute to AI-enabled solutions including LLM
    integrations, RAG, agentic workflows and supporting
    services where relevant
  - Apply good engineering practices across testing,
    observability, security, reliability and maintainability
  - Participate in technical design, problem-solving and
    architecture discussions
  - Learn new technologies and contribute across different parts
    of the engineering stack as the platform evolves

  Required Experience:

  - 3–6 years of professional software engineering experience,
    with strong engineering fundamentals, hands-on experience
    building reusable platform capabilities or services on
    AWS, and the ability to write clean, maintainable and
    testable code."
  - Experience in at least one modern programming language, with
    Python particularly relevant
  - Experience building backend services, APIs, applications or
    automation
  - Understanding of software design principles, testing and
    production engineering practices
  - Experience working with Git and modern software delivery
    practices
  - Exposure to CI/CD and automated deployment
  - Understanding of cloud-native application and infrastructure
    concepts
  - Ability to diagnose problems, work through technical
    ambiguity and contribute effectively within an engineering
    team
  - Genuine interest in AI, platform engineering and modern
    developer tooling

  Areas of Technical Strength

  AI & Software Engineering

  - Python application or service development

  - LLM integrations and APIs

  - Retrieval-Augmented Generation (RAG)

  - Agentic workflows and tool integration

  - Building or integrating RESTful APIs

  - Workflow automation or orchestration

  - Experience taking AI-enabled capabilities into working
    applications or production services

  Platform & Cloud Engineering

  - Building reusable services, automation or internal
    capabilities for engineering teams

  - Cloud platforms such as Azure, AWS or GCP

  - Containers and Kubernetes

  - Infrastructure as Code, including Terraform

  - CI/CD platforms such as GitHub Actions, Azure DevOps, GitLab
    or Jenkins

  - Observability, deployment automation and production
    operations

  Full-Stack Engineering

  - Strong backend and API development

  - Modern frontend frameworks such as React, Vue or similar

  - Building user-facing applications that integrate with
    backend services and APIs

  - Experience working across application, automation and cloud
    environments

  Strong Advantage

  - Hands-on experience with LLM-powered applications or agentic
    systems

  - Experience with MCP or other tool-serving and integration
    patterns

  - Exposure to AI development frameworks such as LangChain,
    LlamaIndex or equivalent

  - Experience with Azure OpenAI, Google Vertex AI or comparable
    AI services

  - Kubernetes or Terraform experience

  - Experience building developer platforms, internal tooling or
    self-service engineering capabilities

  - GitHub or GitLab API and workflow automation experience

  - Understanding of how software and AI systems are deployed,
    monitored and operated in production

  What We’re Looking For

  Strong candidates will bring depth in at least one relevant
  engineering area, supported by solid software engineering
  fundamentals and the ability to contribute across adjacent
  technologies.

  You should be curious, comfortable learning unfamiliar
  technologies and keen to develop deeper capability in AI and
  modern platform engineering.

  Working at ClearRoute We have grown from six founders to
  180+ people across five countries in three years, and what
  sets us apart isn't the pace, it's how we grow.

  - Real flexibility, in practice. We trust you to perform at
    your best and still have a life outside of work, with
    genuine hybrid working, a home office budget, an open
    feedback culture where your voice shapes decisions, and
    time off when life needs it (birthday included).
  - When ClearRoute wins, you win. We offer profit share so
    success is shared, meaningful recognition for great work,
    and benefits that look after you and your family,
    including private healthcare, competitive salary
    benchmarking, and a confidential employee assistance
    program covering counselling, mental health support, and
    financial wellbeing.
  - A community you'll genuinely want to be part of. Interest
    based communities like running and book clubs, Women in
    Tech group, monthly socials, and cross regional events
    bring people together across the company. An inclusive,
    collaborative culture where you don't need to conform to
    succeed, where people support one another and feel
    comfortable being themselves.
  - Where meaningful work meets real growth. You will tackle
    complex, real world problems at the forefront of platform
    engineering, AI, security, and scalable systems. Your
    growth is supported by learning budgets, Udemy access, a
    clear career framework, internal mobility, and thought
    leadership opportunities that take your impact beyond
    ClearRoute.

  At ClearRoute, we believe diverse perspectives lead to
  better outcomes, and inclusion creates the conditions for
  everyone to thrive. We are proud to have built a family
  friendly working environment and have many employees who
  have caring responsibilities alongside work. We welcome
  applications from people who require flexibility and will be
  happy to discuss needs on an individual basis.

  We are committed to fostering a culture where all team
  members feel respected, supported, and empowered to do their
  best work. We celebrate individuality and our differences
  and understand that some differences may mean that you
  require changes made to the interview process. We are happy
  to cater to your needs to make the interview accessible, if
  this is something you require please let us know by emailing
  us at join@clearroute.io
