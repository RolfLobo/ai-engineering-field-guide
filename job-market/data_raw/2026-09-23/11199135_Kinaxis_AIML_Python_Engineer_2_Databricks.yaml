description: |
  About Kinaxis

  Are you looking to join an innovative, market-leading
  company where you can truly elevate your career? At Kinaxis
  we are serious about culture, we are serious about
  technology, we are serious about customers, and we are
  serious about not taking ourselves too seriously. If you are
  looking to be part of an incredible growth story, then we
  might just be the place for you!

  In 1984, we started out as a team of three engineers. Today,
  we have grown to become a global organization with over 2000
  employees around the world, 6 global office and a best-in-
  class HQ in Ottawa, Canada. As winners of several Top
  Employer awards globally, we are proud to work with our
  customers and employees towards solving some of the biggest
  challenges facing supply chains today.

  Kinaxis is a global leader in modern supply chain
  orchestration, powering complex global supply chains, and
  supporting the people who manage them. Our powerful, AI
  infused platform provides full transparency and visibility
  across end-to-end supply chains, enabling our customers to
  make faster, better decisions. We are trusted by renowned
  global brands to provide the agility and predictability
  needed to navigate today’s volatility and disruption. With
  more than 40,000 users in over 100 countries, we are
  expanding our team as we continue to innovate and
  revolutionize how we support our customers.

  Location :

  Bangalore or Chennai, India (Hybrid)

  About the team

  The Data Platform team is responsible for building and
  operating the foundation that powers data and AI products
  across Kinaxis. We provide scalable, secure, and governed
  data infrastructure that enables analytics, AI, and product
  innovation across multiple business domains.

  Our platform is built around modern cloud-native
  technologies including Databricks, Spark, Unity Catalog,
  Delta Lake, and cloud platforms such as Azure and GCP. We
  work closely with AI/ML, product, and engineering teams to
  ensure data is discoverable, trustworthy, secure, and
  accessible at scale.

  As part of the team, you will help shape the future of our
  data platform, enabling teams across the organization to
  build high-impact data and AI solutions.

  What you will do

  If you enjoy building scalable platforms, solving complex
  data engineering challenges, automating infrastructure, and
  enabling developers to move faster, this role is for you.

  - As a Software Developer 2, you will design, build, and
    operate large-scale data platform capabilities while
    balancing long-term maintainability, scalability,
    security, and developer experience.
  - Engineer and evolve our Databricks platform across Azure and
    GCP, including workspace lifecycle management,
    infrastructure automation, governance, and platform
    reliability.
  - Build and maintain data platform services, tooling, and
    infrastructure that enable reliable data ingestion,
    processing, sharing, and discovery.
  - Drive platform engineering best practices through
    Infrastructure-as-Code, CI/CD automation, observability,
    and automated testing.
  - Partner with AI/ML, product, and engineering teams to enable
    data-driven and AI-powered product capabilities.
  - Leverage AI-assisted development tools and agentic coding
    workflows to accelerate software delivery while
    maintaining high engineering quality standards.
  - Troubleshoot complex production issues, identify root
    causes, and drive preventative solutions that improve
    platform reliability and customer experience.

  What we are looking for

  Education & Experience

  - Bachelor's or Master's degree in Computer Science, Software
    Engineering, or a related field, or equivalent practical
    experience.
  - 5+ years of relevant industry experience building and
    operating production software systems.
  - Experience designing and supporting large-scale data
    platforms or distributed systems in cloud environments.

   Technical Skills

  - Strong programming skills in Python, including experience
    building production-grade backend services and platform
    tooling.
  - Strong SQL skills and deep understanding of data modeling,
    query optimization, and large-scale data processing.
  - Strong knowledge of Databricks platform technologies
    including Unity Catalog, Delta Lake, Delta Sharing,
    Structured Streaming, data governance (RBAC/PII),  data
    lineage, and enterprise-scale data management practices.
  - Experience with REST API development using FastAPI, Flask,
    or similar frameworks.
  - Experience with Terraform, CI/CD pipelines, Docker,
    Kubernetes, and modern software engineering practices.
  - Strong understanding of cloud platforms such as Azure, GCP,
    or AWS.
  - Comfortable working with AI-assisted software development
    tools such as GitHub Copilot, Claude Code, Cursor, or
    similar technologies.
  - Ability to identify and implement opportunities to
    accelerate the SDLC through AI-driven tooling and
    automation.
  - Strong judgement when reviewing AI-generated code, ensuring
    correctness, maintainability, security, and architectural
    consistency.

  Soft Skills

  - Excellent communication and collaboration skills.
  - Strong ownership, problem-solving, and troubleshooting
    abilities.
  - Comfortable working in ambiguous environments and driving
    outcomes independently.

  Nice to Have

  - Experience operating multi-tenant SaaS data platforms.
  - Familiarity with event-driven architectures, Kafka,
    streaming platforms, or real-time data processing.
  - Experience implementing platform observability, cost
    optimization, and governance at scale.
  - Exposure to supply chain, planning, analytics, or enterprise
    SaaS domains.

