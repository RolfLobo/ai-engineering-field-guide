  years, in accordance with our UK Recruitment Privacy Notice
  / EU Recruitment Privacy Notice, to evaluate your
  application and meet our legal and reporting obligations. In
  line with the General Data Protection Regulation (GDPR), you
  have the right to request access to, rectification, or
  erasure (subject to legal limitations) of your personal
  data. For more information, please contact us at
  privacy@baringa.com

  For the USA

  Your personal data may be retained by Baringa for up to two
  years, as outlined in our Recruitment Privacy Notice (AMER &
