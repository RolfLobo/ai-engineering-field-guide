  reporting requirements. Where applicable, and in accordance
  with relevant federal and state laws, you may have the right
  to request access to or correction of your personal
  information. For further details, please contact
  privacy@baringa.com

  For Australia & Singapore

  Your personal data will be retained by Baringa for up to two
  years, in accordance with our Recruitment Privacy Notice
  (AMER & APAC), to assess your application and meet
  applicable reporting and legal obligations. In line with the
  Australian Privacy Act and Singapore’s Personal Data
  Protection Act (PDPA), you may have rights to access,
  correct, or request limited deletion of your personal data.
  For more information, please contact us at
  privacy@baringa.com
