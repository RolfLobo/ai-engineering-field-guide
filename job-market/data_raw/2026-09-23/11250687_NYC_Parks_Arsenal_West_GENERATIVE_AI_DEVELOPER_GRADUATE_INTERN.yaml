description: |
  Job Description

  The Department of Social Services (DSS) is comprised of the
  administrative units of the New York City Human Resources
  Administration (HRA) and the Department of Homeless Services
  (DHS). HRA is dedicated to fighting poverty and income
  inequality by providing New Yorkers in need with essential
  benefits such as Food Assistance and Emergency Rental
  Assistance. DHS is committed to preventing and addressing
  homelessness in New York City by employing a variety of
  innovative strategies to help families and individuals
  successfully exit shelter and return to self-sufficiency as
  quickly as possible.  Information Technology Services (ITS)
  is DSS’s technology services organization. ITS mission is to
  support the daily, emergent, and long-term needs of both
  agencies. ITS creates and enhances the technology
  infrastructure and computer applications that support HRA
  and DHS and develops applications, including a variety of
  client eligibility and recertification systems, case
  management systems, housing systems, employment/work
  engagement services, revenue producing computer matches,
  claiming systems, and personnel systems. Information
  Technology Services, IT Service Management is recruiting for
  one (1) College Aide-III to function as a Generated AI
  Developer Graduate Intern who will:
  - Evaluate model responses for quality, safety, accuracy, and
    performance, and suggest improvements.
  - Participate in debugging, troubleshooting, and optimizing
    Gen AI-enabled applications, update project documentation,
    meeting notes, and technical guides for the team and track
    assigned tasks and provide status updates to the team.
  - Assist with data preparation, annotation, and validation for
    AI use cases where needed
  - Help design and architect robust, scalable, and secure GenAI
    solutions utilizing AWS Bedrock and Anthropic Claude
    models.
  - Review and write Python and/or ReactJS code to support
    building additional application features and document all
    the code, configuration, and other development and
    infrastructure artifacts.
  - Conduct research, attend meetings, and other work as
    assigned.
  Work Location: 375 PEARL STREET COLLEGE AIDE - ASSIGNMENT
  LEVE - 1020B

  Qualifications

  For Assignment Level I: Matriculation at an accredited
  college or graduate school. Employment is conditioned upon
  continuance as a student in a college or graduate school.
  For Assignment Level II (Information Technology):
  Matriculation at an accredited college or graduate school.
  Employment is conditioned upon continuance as a student in a
  college or graduate school with a specific course of study
  in information technology, computer science, management
  information systems, data processing, or closely related
  field, including or supplemented by 9 semester credits in an
  acceptable course of study. For Assignment Level III
  (Information Technology Fellow): Matriculation at an
  accredited college or graduate school. Employment is
  conditioned upon continuance as a student in a college or
  graduate school with a specific course of study in
  information technology, computer science, management
  information systems, data processing, or other area relevant
  to the information technology project(s) assigned, including
  or supplemented by 9 semester credits in an acceptable
  course of study. Appointments to this Assignment Level will
  be made by the Technology Steering Committee through the
  Department of Information Technology and Telecommunications.
  SPECIAL NOTE Maximum tenure for all Assignment Levels in the
  title of College Aide is 6 years. No student shall be
  employed more than half-time in any week in which classes in
  which the student is enrolled are in session. Students may
  be employed full-time during their vacation periods.

  Additional Information

  The City of New York is an inclusive equal opportunity
  employer committed to recruiting and retaining a diverse
  workforce and providing a work environment that is free from
  discrimination and harassment based upon any legally
  protected status or protected characteristic, including but
  not limited to an individual's sex, race, color, ethnicity,
  national origin, age, religion, disability, sexual
  orientation, veteran status, gender identity, or pregnancy.
