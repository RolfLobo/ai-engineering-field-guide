description: |
  Requisition Number: 2374704 Optum is a global organization
  that delivers care, aided by technology to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. Primary Responsibilities:

  - The Senior AI/ML Engineer will contribute to the design and
    delivery of AI-enabled solutions supporting Sales and
    Distribution modernization, including integration across
    employer, broker, and enrollment ecosystems
  - This role focuses on building and enhancing scalable
    components for sales workflows, distribution platforms,
    API integrations, and automation pipelines, including AI-
    driven and agentic workflow capabilities
  - The engineer will develop and deploy machine learning
    models, generative AI solutions, and RAG-based systems
    that improve sales intelligence, operational efficiency,
    and decision-making
  - Working closely with product, engineering, and operations
    teams, the role will translate business requirements into
    technical solutions and ensure seamless integration with
    existing enterprise systems
  - The Senior Engineer will support system performance,
    reliability, and scalability, contribute to model
    evaluation and monitoring, and ensure adherence to
    Responsible AI, governance, and security standards
  - Additionally, the role collaborates with offshore teams,
    participates in design and code reviews, and drives high-
    quality execution within defined project scope
  - Design, develop, and deploy AI-powered solutions using no-
    code, low-code, and advanced platforms, translating
    business needs into scalable applications that enhance
    products, workflows, and decision-making
  - Comply with the terms and conditions of the employment
    contract, company policies and procedures, and any and all
    directives (such as, but not limited to, transfer and/or
    re-assignment to different work locations, change in teams
    and/or work shifts, policies in regards to flexibility of
    work benefits and/or work environment, alternative work
    arrangements, and other decisions that may arise due to
    the changing business environment). The Company may adopt,
    vary or rescind these policies and directives in its
    absolute discretion and without any limitation (implied or
    otherwise) on its ability to do so

  Required Qualifications:

  - A bachelor's or master's degree in computer science,
    engineering, or a related field
  - 8+ years of experience in software engineering, with 2+
    years of hands-on experience building and deploying AI/ML
    systems in production environments
  - Experience with model evaluation, performance monitoring,
    and MLOps practices
  - Solid expertise in developing scalable enterprise
    applications, including API integrations, microservices
    architectures, and workflow automation frameworks, along
    with working experience in machine learning, generative AI
    (GPT-based models), RAG pipelines, or agentic workflows
  - Solid understanding of sales and distribution systems or
    enterprise platform integrations, including CRM,
    enrollment, or broker ecosystem integration patterns
  - Demonstrated solid problem-solving skills, the ability to
    translate business requirements into technical solutions,
    and effective collaboration with cross-functional teams

  Preferred Qualifications:

  - Experience working in distributed or offshore team
    environments
  - Familiarity with enterprise AI governance, Responsible AI
    principles, and security/compliance requirements

  At UnitedHealth Group, our mission is to help people live
  healthier lives and make the health system work better for
  everyone. We believe everyone-of every race, gender,
  sexuality, age, location and income-deserves the opportunity
  to live their healthiest life. Today, however, there are
  still far too many barriers to good health which are
  disproportionately experienced by people of color,
  historically marginalized groups and those with lower
  incomes. We are committed to mitigating our impact on the
  environment and enabling and delivering equitable care that
  addresses health disparities and improves health outcomes -
  an enterprise priority reflected in our mission.
