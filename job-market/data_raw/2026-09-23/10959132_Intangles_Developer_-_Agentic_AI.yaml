description: |
  Job Role:

  Designing, developing, and deploying autonomous AI systems
  that can reason, make decisions, interact with tools, and
  execute tasks with minimal human intervention. This role
  combines expertise in AI engineering, large language models
  (LLMs), automation, and system orchestration to build
  intelligent agents capable of solving complex business
  problems.

  Key Responsibilities:

  - Design and develop autonomous AI agents capable of
    reasoning, planning, and task execution.
  - Integrate LLMs, APIs, databases, and external tools into
    agent workflows.
  - Develop memory, context management, and tool-calling
    capabilities using MCP and related protocols.
  - Monitor, evaluate, and optimize agent performance using
    agentic evaluation techniques.
  - Implement AI governance, security, compliance, and risk
    management controls.
  - Collaborate with product, DevOps, and business teams to
    automate enterprise workflows.
  - Deploy and maintain scalable agentic AI systems in
    production environment.

  Qualification:

  - Master's/PhD degree in Computer Science, Artificial
    Intelligence, Data Science, or a related field.
  - Bachelors with relevant experience will be considered.
  - Strong proficiency in Python and modern software engineering
    practices.
  - Experience with machine learning, deep learning, and large
    language models.
  - Understanding of APIs, cloud platforms, and distributed
    systems.
  - Ability to build and deploy production-ready AI
    applications.
