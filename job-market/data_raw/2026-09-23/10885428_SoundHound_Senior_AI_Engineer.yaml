description: |
  Your Career, our Future—Together.

  Ready to join something big? At SoundHound AI, we bring
  voice, generative, and conversational AI together to
  transform how people interact with products and services.
  From voice-enabled vehicles to food ordering and customer
  support, our multilingual, omnichannel technology already
  impacts hundreds of millions worldwide.

  The Opportunity

  As a cognitive technical lead, you will be an established
  partner to our enterprise customers and a lead on AI
  projects. You will work closely with R&D and our customers
  to ensure integrations and implementation requirements are
  met to the highest standard.

  You'll handle new customer integrations ranging from wide
  scale environments and you will also be an internal advisor
  to our R&D teams to interpret all customer needs

  What You'll Do

  - Assist in delivering large scale AI projects
  - Collaborate to create well engineered, tested and documented
    software libraries and applications in Java 8, Linux and
    MySQL.
  - Provide engineers with architecture designs and guidance to
    implement use cases.
  - Responsible for the team's code promotion through all
    environments and provide release notes to clients on a
    weekly basis.
  - Develop shell scripts that assists engineers in searching
    for log errors across multiple nodes.
  - Act as central coordinator for all activities related to
    technical elements of the project, and is the interaction
    point between global Amelia teams and the client.
  - Run the client configuration and Integration streams with
    the on-site team and liaise with global Amelia teams (i.e.
    Configuration & Implementation, Architects, Operations,
    RnD, InfoSec), to address client’s requirements.
  - Support global Amelia teams by linking with Client's IT
    teams
  - Gather client training requirements for post-roll out
    platform operation and aspects and direct client
    capability building
  - Understand and convert use cases into sound requirements
    prior to each sprint, based on value maximization and
    strengths of Amelia technology
  - Document conclusions of the deployment, setting the general
    direction for each of the work streams launching next
  - Prepare training materials for client capability building,
    end user education, and platform usability by customizing
    sanitized documents and administering web-based
    training/instructor-led training sessions
  - Track and continue to set client expectation on all
    applicable work streams throughout life of the project and
    operations
  - Track CSAT, MTTD, velocity and delivered business value to
    achieve the business case objectives

  What You'll Bring

  - At least 5+ years of experience with a Bachelor's degree in
    Computer Science or an equivalent field, or 3 years of
    experience with an advanced degree
  - 3+ years of (similar) experience leading and implementing
    software or virtual infrastructure projects
  - Experience with Java/Groovy, Linux and MySQL is a must.
  - Solid knowledge of conversational AI, NLU/NLP, and related
    tooling
  - Deep knowledge of Prompt engineering
  - Ability to solve complex technical problems via the
    application of solution/design thinking
  - Ability to manage daily work efforts and risk via exceptions
    and thoughtful escalations
  - End-to-end technical experience in design, engineering,
    testing, dev ops, support
  - Demonstrated ability to lead teams and own project delivery
  - Demonstrated Leadership Capabilities
  - Ability to communicate to both technical and non-technical
    audiences
  - Understanding and ability to deliver stakeholder reports
  - Understanding and ability to create client-facing documents
  - Languages: fluent English, written and spoken

  Workplace & Compensation

  This role is available in India and will be hired into
  Amelia Global Services, a subsidiary of SoundHound AI.

  Let's Start the Conversation

  Join SoundHound AI and collaborate with colleagues worldwide
  who are shaping the future of voice AI. Guided by our
  values—supportive, open, undaunted, nimble, and determined
  to win—we strive to build breakthrough AI experiences
  together.

  We provide reasonable accommodations for individuals with
  disabilities throughout the hiring process and employment.
  To view our job applicant privacy policy, please visit https
  ://static.soundhound.com/corpus/ta/applicantprivacynotice.ht
  ml.

  Discover more about our philosophy, benefits, and culture at
  https://www.soundhound.com/careers.

