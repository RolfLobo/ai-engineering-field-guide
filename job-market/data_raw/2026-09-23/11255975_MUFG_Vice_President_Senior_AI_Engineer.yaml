description: |
  Do you want your voice heard and your actions to count?

  Discover your opportunity with Mitsubishi UFJ Financial
  Group (MUFG), one of the world’s leading financial groups.
  Across the globe, we’re 150,000 colleagues, striving to make
  a difference for every client, organization, and community
  we serve. We stand for our values, building long-term
  relationships, serving society, and fostering shared and
  sustainable growth for a better world.

  With a vision to be the world’s most trusted financial
  group, it’s part of our culture to put people first, listen
  to new and diverse ideas and collaborate toward greater
  innovation, speed and agility. This means investing in
  talent, technologies, and tools that empower you to own your
  career.

  Join MUFG, where being inspired is expected and making a
  meaningful impact is rewarded.

  MUFG, a global leader in financial services, is seeking a
  Vice President Senior Artificial Intelligence Engineer to
  join their Corporate Technology team in London. This is an
  exceptional opportunity for you to play a pivotal role in
  embedding advanced AI technologies across the EMEA region,
  working within a highly supportive and inclusive environment
  that values collaboration, knowledge sharing, and
  professional growth. As part of the Architecture,
  Middleware, Development (AMD) division, you will be at the
  forefront of designing, delivering, and supporting
  innovative AI solutions, including retrieval augmented
  generation (RAG) and agentic models that drive digital
  transformation and business value.

  - Join a globally respected financial institution with a
    strong commitment to inclusivity, diversity, and flexible
    working opportunities, where your expertise will be valued
    and nurtured.
  - Take ownership of high-impact AI projects across multiple
    business areas in EMEA, collaborating closely with
    stakeholders to deliver solutions that transform
    operations and realise measurable business value.
  - Benefit from generous training opportunities, supportive
    leadership, and a culture that encourages coaching,
    mentoring, and continuous improvement, ensuring your
    professional development is always prioritised.

  What you'll do:

  As a Vice President Senior Artificial Intelligence Engineer
  at MUFG in London, you will immerse yourself in a dynamic
  environment where your technical acumen is matched by your
  ability to connect with stakeholders across the EMEA region.
  Your day-to-day responsibilities will involve collaborating
  with cross-functional teams to identify opportunities for
  AI-driven transformation; evaluating cutting-edge
  technologies; adhering to rigorous delivery lifecycle
  processes; providing expert guidance on architectural
  standards; delivering reliable support services; tracking
  project outcomes; ensuring compliance; promoting an
  inclusive culture; coaching colleagues; embedding new
  disciplines; sharing expertise; building capability across
  teams; improving ways of working; driving cross-team
  initiatives; establishing strong peer networks; aligning
  delivery efforts globally, all while championing MUFG’s
  values-led approach. Success in this role requires not only
  deep technical knowledge but also outstanding interpersonal
  skills that foster trustful relationships throughout the
  organisation.

  - Collaborate extensively with Digital Transformation teams
    and business stakeholders to understand requirements,
    contribute to opportunity pipeline prioritisation, and
    define success measures for AI initiatives.
  - Evaluate technology options, including models and platforms,
    making clear recommendations based on business value, cost
    efficiency, risk mitigation, strategic alignment, and
    long-term supportability.
  - Adhere strictly to MUFG’s Systems Delivery Lifecycle (SDLC)
    process and governance standards by ensuring comprehensive
    planning, documentation, release readiness, risk
    management, and reporting for all AI projects.
  - Provide leadership in establishing architectural principles,
    engineering standards, reusable patterns, and quality
    controls for AI solutions throughout the organisation.
  - Deliver high-quality L1, L2, and L3 support across all
    services owned by the AI Engineering team to ensure
    operational excellence and reliability.
  - Work closely with Digital Transformation teams and business
    owners to track outcomes, costs, and return on investment
    using evidence-based approaches to improve or scale
    solutions as needed.
  - Ensure all activities comply fully with relevant policies,
    procedures, controls, including strict adherence to change
    management protocols and privileged production access
    management processes.
  - Promote MUFG’s values-led culture by fostering an inclusive
    environment that strengthens business relationships and
    delivers solutions aligned with organisational goals.
  - Coach and mentor AI Engineering colleagues to build strong
    engineering discipline within the team while proactively
    identifying new technologies and best practices for
    adoption.
  - Establish robust peer networks across the business to share
    ideas, align delivery efforts globally, and drive
    successful outcomes through collaborative initiatives.

  What you bring:

  To excel as Vice President Senior Artificial Intelligence
  Engineer at MUFG you will bring proven experience in
  delivering sophisticated AI solutions within large-scale
  enterprise environments, preferably regulated financial
  institutions. Your interpersonal skills are exceptional, you
  communicate complex ideas simply/connect with
  stakeholders/build trust/share expertise/nurture
  talent/promote values-led culture. You are degree-educated
  or possess equivalent experience demonstrating advanced
  technical proficiency.

  - Extensive experience in technology delivery or operations
    within AI engineering, machine learning or data science
    environments - ideally in regulated industries such as
    financial services.
  - Proven track record of building custom Generative AI
    solutions on Azure (preferred) or AWS platforms with deep
    familiarity in RAG architectures, vector databases, prompt
    engineering and model evaluation frameworks.
  - Strong background in structured systems development
    lifecycle (SDLC), including Secure by Design (SbD),
    Architecture Review Board (ARB), Data Protection Impact
    Assessment (DPIA), CI/CD pipelines and related governance
    processes.
  - Ability to define technical standards and reference patterns
    while documenting architectural decisions clearly,
    assessing alternative technologies/vendors/delivery
    approaches effectively.
  - Comprehensive understanding of security/privacy/responsible
    AI/data governance/model risk considerations relevant to
    global financial organisations or equivalent regulated
    sectors.
  - Excellent communication skills enabling you to simplify
    complex technical concepts for diverse audiences while
    engaging business stakeholders meaningfully.
  - Experience defining measurable outcomes/return on investment
    for AI projects. using evidence-based methods to assess
    impact/improve scalability.
  - Expertise across orchestration/governance/development tools
    such as LangChain/LangGraph/Azure Foundry/Azure
    AI/MCP/Python/vector databases.
  - Experience providing effective 1st/2nd/3rd line support
    across multiple business areas, ensuring operational
    reliability for mission-critical services.
  - Degree-educated in Computer Science/Data Science or related
    discipline or equivalent practical experience
    demonstrating advanced technical proficiency.

  What sets this company apart:

  MUFG stands out as one of the world’s most respected
  financial institutions. a place where tradition meets
  forward-thinking innovation. The company is deeply committed
  to fostering an inclusive workplace that celebrates
  diversity at every level. Employees benefit from flexible
  working arrangements designed around their needs as well as
  generous training opportunities that encourage continuous
  learning. Supportive leadership ensures every team member
  feels valued while collaborative networks empower
  individuals to share ideas freely across departments. At
  MUFG you’ll find a nurturing environment where your
  contributions are recognised and where you can grow both
  personally and professionally alongside knowledgeable
  colleagues who share your passion for technology-driven
  transformation. The organisation’s dedication to responsible
  innovation means you’ll be part of projects that have real
  impact, not just within MUFG but across the wider industry.
  With its strong values-led culture focused on
  integrity/trust/supportiveness/inclusivity/growth
  leadership/network-building, the company offers an
  unparalleled platform for talented professionals seeking
  meaningful careers in artificial intelligence engineering
  within financial services.

  What's next:

  If you are ready to make a lasting impact at one of the
  world’s leading financial institutions—and want your
  expertise in artificial intelligence engineering to shape
  the future of digital transformation—this is your moment!

  Apply today by clicking on the link provided. Take the next
  step towards joining MUFG’s talented Corporate Technology
  team in London.

  We are open to considering flexible working requests in line
  with organisational requirements.

  MUFG is committed to embracing diversity and building an
  inclusive culture where all employees are valued, respected
  and their opinions count. We support the principles of
  equality, diversity and inclusion in recruitment and
  employment, and oppose all forms of discrimination on the
  grounds of age, sex, gender, sexual orientation, disability,
  pregnancy and maternity, race, gender reassignment, religion
  or belief and marriage or civil partnership.

  We make our recruitment decisions in a non-discriminatory
  manner in accordance with our commitment to identifying the
  right skills for the right role and our obligations under
  the law.
