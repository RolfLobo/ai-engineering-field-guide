  GenAI / Agent Platform Engineer Experience



  6-10 Years



  Job Title



  GenAI / Agent Platform Engineer



  Job Summary



  We are seeking an experienced GenAI / Agent Platform
  Engineer to design, develop, and operate enterprise-grade AI
  agent platforms that enable the deployment of intelligent,
  scalable, and secure Generative AI solutions. The ideal
  candidate will have expertise in AI agent orchestration,
  Large Language Model (LLM) integration, tool and API
  invocation frameworks, prompt engineering, policy
  enforcement, observability, and platform reliability.



  This role focuses on building the foundational platforms,
  services, and governance frameworks that power AI agents,
  copilots, and autonomous workflows across the enterprise
  while ensuring security, compliance, and operational
  excellence.



  Key Responsibilities



  - Design and develop scalable platforms for deploying and
    managing AI agents and GenAI applications.
  - Build and maintain agent orchestration frameworks supporting
    multi-agent workflows and autonomous task execution.
  - Integrate Large Language Models (LLMs), foundation models,
    and AI services from cloud and third-party providers.
  - Develop secure mechanisms for tool invocation, API
    integrations, and workflow automation.
  - Implement prompt management, prompt versioning, and prompt
    optimization strategies.
  - Establish AI governance controls, policy enforcement, and
    safety guardrails to ensure responsible AI usage.
  - Design and implement telemetry, monitoring, and
    observability solutions for AI platform operations.
  - Develop evaluation frameworks to measure model quality,
    latency, accuracy, cost, and reliability.
  - Collaborate with engineering, security, product, and data
    teams to deliver AI-powered solutions.
  - Optimize platform performance, scalability, and operational
    efficiency.
  - Support AI model deployment, testing, troubleshooting, and
    lifecycle management.
  - Create technical documentation, architecture diagrams, and
    platform standards.



  Required Qualifications



  - Bachelor's or Master's degree in Computer Science,
    Artificial Intelligence, Data Science, Engineering, or a
    related field.
  - 6-10 years of software engineering, platform engineering, AI
    engineering, or cloud engineering experience.
  - Strong understanding of Generative AI, LLMs, and AI agent
    architectures.
  - Experience building enterprise-grade APIs, microservices,
    and distributed systems.
  - Hands-on experience integrating and managing AI models and
    AI service platforms.
  - Knowledge of prompt engineering, prompt lifecycle
    management, and AI safety principles.
  - Experience with cloud-native application development and
    containerized environments.
  - Strong problem-solving, analytical, and troubleshooting
    skills.
  - Excellent communication and stakeholder management
    capabilities.







   Compensation, Benefits and Duration

                    Minimum Compensation: USD 37,000

                    Maximum Compensation: USD 132,000

                    Compensation is based on actual experience
  and qualifications of the candidate. The above is a
  reasonable and a good faith estimate for the role.

                    Medical, vision, and dental benefits, 401k
  retirement plan, variable pay/incentives, paid time off, and
  paid holidays are available for full-time employees.

                    This position is not available for
  independent contractors

                    No applications will be considered if
  received more than 120 days after the date of this post
