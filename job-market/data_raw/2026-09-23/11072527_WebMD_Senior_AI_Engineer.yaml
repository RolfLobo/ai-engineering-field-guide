description: |
  Senior Fullstack Engineer: Agentic Infrastructure Team

  Internet Brands is looking for a Senior Fullstack Engineer
  to join our Agentic AI team. You'll help build our AI
  capabilities from the ground up, designing and shipping
  tools, services, and intelligent agents that power AI
  experiences across our entire product ecosystem.

  What You'll Do

  - Build and ship full-stack AI applications: Create frontend
    experiences and backend systems that power real AI
    capabilities, iterating based on performance and user
    feedback
  - Own the full lifecycle: Take projects from idea through
    production deployment, ensuring quality, reliability, and
    scalability
  - Build foundational infrastructure: Develop search/retrieval
    services, tool execution layers (MCP servers), workflows,
    and intelligent agents
  - Establish measurement systems: Create feedback loops and
    performance tracking to continuously improve AI system
    behavior
  - Solve complex problems: Debug issues across the stack,
    identify root causes, and implement robust solutions

  What We're Looking For

  Foundation (Required):

  - 5+ years shipping production code (frontend and backend)
  - Strong programming fundamentals: We’ll primarily use
    JavaScript, Python and PHP, but value problem-solving
    skills over specific language expertise
  - Backend development experience: Building workflows, APIs,
    state management, and async systems
  - Database knowledge: Working with both SQL and NoSQL
    databases
  - Frontend skills: Building responsive interfaces with modern
    frameworks (React, Vue, Angular, Svelte, etc.)
  - Experience applying AI/ML in production: You've worked with
    LLMs or ML models in real applications, not just tutorials

  Working Style:

  - Ownership mindset: You identify problems, take initiative,
    and see things through
  - Pragmatic and adaptable: You choose the right tool for the
    job and aren't afraid to learn new technologies
  - Systematic problem-solver: You can debug complex systems and
    think through tradeoffs

  Good to Have:

  - Knowledge of AI evaluation, error analysis, and building
    feedback loops
  - Experience with agentic frameworks (LangGraph, Google ADK)
    or Model Context Protocol (MCP)
  - Background in information retrieval or search systems

  Sound Like You? Even if you don't check every box, we
  encourage you to apply. We value problem-solving ability,
  learning agility, and ownership over perfect resume matches.
  If you're excited about building production AI systems and
  have strong fullstack fundamentals, we want to hear from
  you.

  At Internet Brands, we carefully consider a wide range of
  factors when determining compensation, including your
  background and experience. These considerations can cause
  your compensation to vary. We expect the compensation for
  this role to be in the low $100ks

  In addition to our awesome culture, we offer a comprehensive
  benefits package designed to support the health and well-
  being of you and your family. Our benefits include health
  insurance options such as medical, dental, and vision
  coverage, flexible spending accounts (FSA) for medical and
  dependent care, short-term and long-term disability
  insurance, and life and AD&D insurance. We also provide a
  401(k) retirement savings plan with a company match, paid
  time off (PTO), paid holidays, commuter benefits as well as
  access to our Employee Assistance Program (EAP) and well-
  being coaching services. In addition, employees can take
  advantage of voluntary benefits such as home, auto and pet
  insurance, and discounted legal and financial services. For
  more details, feel free to inquire during the interview
  process.

  Internet Brands®, headquartered in El Segundo, Calif, is a
  fully integrated online media and software services company
  focused on four high-value vertical categories: Health,
  Automotive, Legal, and Home/Travel. The company's properties
  and platforms include the WebMD, Medscape, and Henry Schein
  ONE networks, which are the global leaders in their markets;
  Nolo, Avvo, and Martindale, which form the largest consumer
  information provider in the legal market; and CarsDirect,
  Fodor's Travel, and many others which are leaders in their
  key vertical markets. Internet Brands' award-winning
  consumer websites lead their categories and serve more than
  250 million monthly visitors, while a full range of web
  presence offerings has established deep, long-term
  relationships with SMB and enterprise clients. The company's
  powerful, proprietary operating platform provides the
  flexibility and scalability to fuel the company's continued
  growth. Internet Brands is a portfolio company of KKR and
  Warburg Pincus.

  Internet Brands is an equal opportunity employer, and we
  welcome applicants from all backgrounds. We comply with all
  applicable laws and regulations, including the City of Los
  Angeles Fair Chance Initiative for Hiring Ordinance (FCIHO).

  Notice to California residents: you can find information
  about our privacy practices, on:
  https://www.internetbrands.com/work-with-us/cpra
