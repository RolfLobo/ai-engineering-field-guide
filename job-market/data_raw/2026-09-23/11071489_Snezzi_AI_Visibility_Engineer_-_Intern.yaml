description: |
  What we do

  Snezzi helps brands show up in AI answers on ChatGPT,
  Perplexity, Google AI Mode, and others. We handle everything
  end to end: audits, content, technical fixes, backlinks, and
  measurement. Fully done for you.

  We're a small team of second-time founders. We ship weekly.
  We run AI agents for most of our internal work. And we're
  growing fast enough that we need sharp people who want to
  learn this space by doing real work, not by watching from
  the sidelines.

  What this internship actually is

  You'll work on live client accounts from week one. That
  means real audits, real fixes, real reporting. Not
  shadowing. Not slide decks. Not busywork.

  By the end of the engagement, you'll have shipped actual
  work, built skills that are genuinely hard to find right
  now, and have a portfolio that proves it.

  Strong performers convert to full-time. We'll tell you early
  if we see that path for you.

  What you'll do

  - Run AI visibility audits across ChatGPT, Perplexity, and
    Google AI Mode
  - Help identify gaps and assist with fixes: content updates,
    schema, technical cleanup
  - Use Claude Code and other AI tools to build and run scripts
    (no prior coding required — you learn by doing)
  - Help prepare client reports, weekly updates, and pre-reads
  - Document and templatize every process you touch so the next
    person can use it

  Tools you'll use

  Claude Code, ChatGPT, Perplexity, Google Search Console,
  GA4, Ahrefs, Shopify, WordPress. You'll learn them on the
  job. What matters is how fast you pick things up.

  Who we're looking for

  You don't need a specific degree or years of experience. You
  need the right instincts.

  Must-haves:

  - You use AI tools a lot, out of curiosity, not just to finish
    assignments
  - You write clearly. Most of this job is communication: with
    clients, with AI agents, with your team.
  - A terminal or a code file doesn't scare you. You don't need
    to write code, but if Claude generates a script, you can
    run it, read the output, and ask Claude to fix what broke.
  - You try before you ask. "I don't know" is a starting point,
    not an excuse.
  - You want to ship things, not just observe them.

  Moves you to the top of the pile:

  - You've built or shipped anything on the internet: a blog, a
    store, a tool, a side project, a newsletter
  - You've poked around GA4 or Search Console before
  - You've written content for a brand or website
  - You've done any kind of SEO, growth, or content work

  Not a fit if:

  - You think prompting an AI handles everything. Taste and
    judgment still matter.
  - You want clean handoffs and tightly scoped tasks
  - Client-facing work makes you uncomfortable
