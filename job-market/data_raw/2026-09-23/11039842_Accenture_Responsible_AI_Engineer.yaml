description: |
  Project Role : Responsible AI Engineer Project Role
  Description : Assess AI systems for adherence to predefined
  thresholds and benchmarks related to responsible, ethical
  and sustainable practices. Design and implement technology
  mitigation strategies for systems to ensure ethical and
  responsible standards are achieved. Must have skills :
  Responsible AI Good to have skills : NA Minimum 3 year(s) of
  experience is required Educational Qualification : 15 years
  full time education Summary: As a Responsible AI Engineer,
  your typical day involves evaluating artificial intelligence
  systems to ensure they meet established criteria for
  ethical, responsible, and sustainable operation. You will be
  engaged in designing and applying technological strategies
  to address potential risks and challenges, ensuring that AI
  solutions align with organizational and societal standards.
  Collaboration with various teams to monitor and improve AI
  system performance in line with responsible practices is a
  key aspect of your role, fostering an environment where
  innovation and accountability coexist.

  Roles & Responsibilities:
  - Expected to perform independently and become an SME.
  - Required active participation/contribution in team
    discussions.
  - Contribute in providing solutions to work related problems.
  - Collaborate with cross-functional teams to integrate
    responsible AI principles into project workflows.
  - Continuously monitor AI system outputs to identify and
    mitigate ethical risks.
  - Document and communicate findings and recommendations to
    stakeholders to promote transparency.
  - Support junior team members by sharing knowledge and best
    practices related to responsible AI.

  Professional & Technical Skills:
  - Must To Have Skills: Proficiency in Responsible AI.
  - Strong understanding of ethical frameworks and guidelines
    applicable to artificial intelligence.
  - Experience in designing and implementing mitigation
    strategies for AI systems to address bias and fairness.
  - Ability to assess AI models against sustainability and
    accountability benchmarks.
  - Familiarity with tools and methodologies for auditing AI
    systems and ensuring compliance with responsible AI
    standards.
  - Excellent analytical and problem-solving skills focused on
    ethical AI deployment.

  Additional Information:
  - The candidate should have minimum 3 years of experience in
    Responsible AI.
  - This position is based at our Bengaluru office.
  - A 15 years full time education is required.


  15 years full time education

