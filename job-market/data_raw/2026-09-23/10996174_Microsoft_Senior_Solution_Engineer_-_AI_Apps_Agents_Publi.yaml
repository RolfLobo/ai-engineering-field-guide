description: |
  Overview

  The Dutch public sector faces pressure technology alone has
  never solved: labour shortages, rising citizen expectations,
  institutional knowledge walking out the door, all under a
  mandate to stay transparent, explainable and sovereign. AI
  is the first capability in a generation that credibly bends
  that curve. Very few roles let you shape how an entire
  society adopts it.

  Your purpose in this role is simple: empower these
  organisations to achieve more. You do that by becoming their
  trusted advisor — the engineer they call first — and by
  taking real accountability for the impact that follows, not
  just the advice you gave. That accountability is what
  ultimately earns you the technical decision.

  You'll be hands-on-keyboard, building and proving agentic
  applications on Azure AI Foundry, the Azure app platform and
  Copilot Studio alongside the architects, CTOs and CISOs of
  the organisations that run the country. The Specialist owns
  the forecast; you own the technical outcome.

  Patterns you set get reused across the sector, because
  public sector organisations learn from each other in a way
  commercial markets rarely do. Build it well once, and it
  scales to millions of people.

  You won't know all of it on day one — nobody does. This
  field reinvents itself every few months, so a growth mindset
  is the core competency of this role, not a nice-to-have.
  We're looking for learn-it-alls: curious, comfortable being
  wrong in public, quick to say “I don't know yet — let me
  find out,” and generous with what they learn.

  Location: Netherlands (Amsterdam/Schiphol), hybrid, with
  regular on-site time at customers.

  Responsibilities

  - Own the technical decision by guiding customers from vision
    and architecture through proof of value and deployment
    planning.
  - Build and deliver demos, prototypes, proofs of concept and
    pilots that demonstrate the value of AI Apps and Agents
    solutions.
  - Lead architecture workshops and technical engagements,
    translating complex concepts into clear and actionable
    outcomes.
  - Act as the trusted technical advisor to customers,
    connecting technology decisions to business value,
    security, risk and operational impact.
  - Collaborate across Solution Engineering, Customer Success,
    partners and account teams to drive successful customer
    outcomes.
  - Capture and scale reusable solution patterns, competitive
    insights and customer success stories across the market.
  - Continuously build your expertise, mentor others and
    contribute to technical communities both within Microsoft
    and across the industry.

  Qualifications

  Required qualifications

  - Experience in technical pre-sales, solution engineering,
    consulting or a similar customer-facing technical role.
  - Hands-on experience designing, building or implementing AI
    and cloud-based applications.
  - Strong understanding of modern application architecture and
    Microsoft Azure.
  - Professional fluency in Dutch and English (required).

   Preferred qualifications

  - Experience with generative AI, agentic applications, RAG and
    AI governance.
  - Experience with software development, APIs, containers and
    DevOps practices.
  - Experience working with public sector organisations or
    regulated industries.
  - Relevant Azure, AI or architecture certifications.

   What will help you succeed

  - Growth mindset and passion for continuous learning.
  - Ability to explain complex technical concepts to both
    technical and business stakeholders.
  - Strong relationship-building and trusted-advisor skills.
  - Collaborative, proactive and customer-focused approach.
  - Knowledge of the Dutch public sector, including security,
    compliance and sovereign cloud considerations.



