  Job Description:

  Job Title: Senior AI/ML Engineer

  Job Grade: C15

  Salary:  £48,200.00 DOE and location + Fantastic benefits
  Location status: Hybrid (flexible working options available)
  3 days WFH Location: Bupa Place, Salford – Willow House,
  Staines – Angel Court, London

  Permanent/fixed term contract: Permanent


  About the Role

  We Make Health Happen

  At Bupa, we're transforming the way we deliver healthcare
  and insurance through the power of Artificial Intelligence.
  We're looking for a Senior AI/ML Engineer to join our
  growing Applied AI team and play a pivotal role in
  developing, scaling and operationalising AI solutions that
  create real business value.

  This is an exciting opportunity for an experienced AI
  professional who is passionate about Machine Learning,
  Generative AI and Agentic AI, and thrives on taking
  innovative ideas from concept through to enterprise-scale
  production.

  You'll work at the forefront of AI innovation, partnering
  with stakeholders across Customer, Commercial, Operations
  and Healthcare Management functions to design and deploy
  intelligent solutions that improve experiences for our
  customers and colleagues.

  What You'll Be Doing

  As a Senior AI/ML Engineer, you'll be responsible for
  bridging the gap between experimentation and production,
  ensuring AI solutions are scalable, reliable, secure and
  aligned with business objectives.

  Key responsibilities include:

  - Collaborating with product leaders, business analysts and
    subject matter experts to identify and shape high-value AI
    opportunities.
  - Designing and delivering end-to-end AI and Machine Learning
    solutions, from data preparation and model development
    through to deployment and monitoring.
  - Building and maintaining robust MLOps frameworks, governance
    processes and engineering best practices.
  - Developing cutting-edge Generative AI and Agentic AI
    solutions, including:
    - Retrieval-Augmented Generation (RAG)
    - Semantic search
    - AI agents and multi-agent workflows
    - LLM orchestration frameworks
  - Working with modern AI technologies such as LangGraph,
    Google ADK, Microsoft Agent Framework, LlamaIndex and
    similar tools.
  - Deploying AI solutions across cloud platforms including
    Azure, GCP and Snowflake.
  - Embedding responsible AI principles, evaluation frameworks,
    safety controls and assurance mechanisms throughout the AI
    lifecycle.
  - Integrating external AI services and APIs into enterprise
    applications.
  - Acting as an AI ambassador within the business, helping to
    build Bupa's reputation as a centre of AI excellence.
  - Coaching and mentoring junior colleagues and supporting
    capability development across the team.
  - Promoting engineering standards, quality assurance and
    coding best practice.
  - Working within Agile delivery teams where appropriate.
  - Ensuring compliance with regulatory requirements and
    maintaining the highest standards of data security and
    governance.

  What We're Looking For

  We're looking for someone who combines strong technical
  expertise with excellent stakeholder engagement skills and a
  passion for driving innovation.

  Essential Experience

  - Proven experience designing, building and deploying AI/ML
    solutions from concept through to production.
  - Strong experience implementing MLOps strategies, frameworks
    and operational best practices.
  - Deep understanding of Generative AI and Agentic AI concepts,
    including:
    - RAG architectures
    - Embeddings and vector search
    - Evaluation frameworks
    - LLM orchestration
  - Hands-on experience with frameworks such as:
    - LangChain
    - LangGraph
    - LlamaIndex
    - CrewAI
    - Autogen
    - Google ADK
    - Similar modern AI frameworks
  - Experience developing and deploying AI solutions on cloud
    platforms such as:
    - Azure AI Foundry, Azure AI Studio and AKS
    - Google Vertex AI and Cloud Run
    - Snowflake Cortex AI and Snowpark
  - Strong software engineering skills including:
    - Python
    - CI/CD pipelines
    - GitHub Actions
    - Azure DevOps
    - Docker
    - Kubernetes
  - Experience working with APIs and integrating external AI
    services.
  - Ability to engage, influence and build strong relationships
    with both technical and non-technical stakeholders.
  - Experience mentoring and developing colleagues.
  - Familiarity with Agile delivery methodologies and tools such
    as Azure DevOps.

  Desirable

  - Bachelor's degree in Computer Science, Mathematics,
    Statistics or another quantitative discipline.
  - Master's degree in Data Science, Statistics, Epidemiology or
    a related field.
  - Experience working within healthcare, insurance or other
    highly regulated industries.

  About You

  You'll be someone who:

  - Can independently drive initiatives from idea to delivery.
  - Makes pragmatic decisions balancing innovation, scalability
    and cost.
  - Takes ownership of outcomes and proactively manages risks
    and dependencies.
  - Communicates complex technical concepts clearly to a wide
    range of audiences.
  - Is passionate about advancing the responsible use of AI.
  - Enjoys mentoring others and helping create a culture of
    continuous learning and improvement.



  Benefits

  Our benefits are designed to make health happen for our
  people. Viva is our global wellbeing programme and includes
  all aspects of our health – from mental and physical, to
  financial, social, and environmental wellbeing. We support
  flexible working and have a range of family friendly
  benefits.

  Joining Bupa in this role you will receive the following
  benefits and more:

  • 25 days holiday, increasing through length of service,
  with option to buy or sell

  • Bupa health insurance as a benefit in kind

  • An enhanced pension plan and life insurance

  • Annual performance-based bonus

  • Onsite gyms or local discounts where no onsite gym
  available

  • Various other benefits and online discounts

  Why Bupa?

  We’re a health insurer and provider. With no shareholders,
  our customers are our focus. Our people are all driven by
  the same purpose – helping people live longer, healthier,
  happier lives and making a better world. We make health
  happen by being brave, caring and responsible in everything
  we do.

  We encourage all of our people to “Be you at Bupa”, we
  champion diversity, and we understand the importance of our
  people representing the communities and customers we serve.
  That’s why we especially encourage applications from people
  with diverse backgrounds and experiences.

  Bupa is a Level 2 Disability Confident Employer. This means
  we aim to offer an interview/assessment to every disabled
  applicant who meets the minimum criteria for the role. We’ll
  make sure you are treated fairly and offer reasonable
  adjustments as part of our recruitment process to anyone
  that needs them.

