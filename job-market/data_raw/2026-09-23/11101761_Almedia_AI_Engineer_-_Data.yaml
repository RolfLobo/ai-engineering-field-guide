description: |
  This isn’t your regular job. Almedia is a place where those
  who want to push harder can accelerate their careers faster
  than anywhere else. We’re aiming to become Germany’s second
  bootstrapped unicorn. Almedia is already Europe’s #3
  fastest-growing company in 2025 (FT1000).

  We are building the future of marketing by rewarding our
  community of over 80 million users for engaging with our
  advertisers’ products. We are offering a new way to acquire
  users for the biggest companies in the world.

  AI Engineer - Data

  This is our first dedicated AI Engineer in the data team: a
  hands-on, build-and-ship role with unusually broad scope,
  right at the core of how our product works.

  What you'll own

  - The AI behind our rewards engine. We want to create our next
    generation of reward design system fully agentically. We
    want AI to look into the games, generate tailored offers,
    and evaluate them before they go live, replacing our
    current inflexible design.
  - Open-ended AI problems, end to end. Across the data org's
    verticals, from payer structures to user acquisition and
    beyond, you'll take the fuzzy "could AI help
    here?"problems, deeply understand the underlying business
    logic and turn them into shipped agentic systems, working
    directly with our Staff Data Scientists, our CTO, and
    leadership.
  - Genuinely agentic systems: We want agents, pipelines,
    retrieval and evaluation, basically a claude code for
    reward design. You'll decide where AI belongs and, just as
    importantly, where it doesn't.
  - The standard for how AI gets built here. As our first
    dedicated AI Engineer, the patterns, tooling and judgement
    you set become how AI-fluent data scientists across the
    team work.

  What you'll bring

  - Own everything, take initiative: you take AI problems from a
    vague brief to a shipped, working system without being
    asked — "not my job" isn't in your vocabulary.
  - Move fast: you start before you're ready, ship the small
    test, and iterate against real data.
  - Raise the bar: your standards show up in the systems you
    ship, not in what you say.
  - Focus on impact: you know when not to reach for AI, and can
    name the simpler thing you chose instead to protect what
    mattered most.
  - AI-native: agents, LLM pipelines, RAG and modern AI tooling
    are already part of how you build — and you can explain
    exactly how you've used them.
  - You've built real AI systems: you can code (Python), and
    you've shipped something genuinely agentic — an agent, an
    LLM pipeline, at minimum a real RAG system — that got
    used, with solid engineering or applied-ML foundations
    underneath, not just LLM calls.
  - Bonus: adtech, marketplaces, recommendations/ranking, or
    high-scale consumer products.

  How we work

  - Ownership from day one. You'll be trusted with real
    responsibility fast, and held to it.
  - Intensity, rewarded. We move quicker than almost anyone, and
    pay, bonuses and progression reflect it.
  - AI without limits. Best-in-class AI tooling, company-paid,
    built into every team's workflow. Few companies give you
    this level of access.
  - In person. We're 5 days a week in the office. Not local yet?
    We support your relocation to London or Berlin.

  Tech stack

  - Language: Python — the non-negotiable.
  - AI / LLM: modern LLM APIs and open models; agentic
    frameworks and orchestration (e.g. LangChain / LangGraph /
    LlamaIndex); RAG and vector search; evaluation frameworks
    / eval-driven development; prompt and context engineering.
  - Data & infra: BigQuery and SQL over large behavioural
    datasets; cloud (AWS / GCP), containers, CI/CD.

  Why Almedia?

  - Own Our Growth: We offer all Berlin-based employees equity
    in Almedia to truly be a part of our success.
  - Scale With Almedia: Grow alongside a startup that has been
    profitable from day one.
  - Central Berlin Office: Work from a fully-stocked modern
    office built for collaboration, accessible from all around
    Berlin.
  - Other Benefits: Transport subsidy, breakfasts and lunches,
    language learning, Urban Sports Club, and more.

  We believe in fostering talent, evaluating all skill levels
  during the hiring process, and providing a clear path for
  growth. Almedia is an equal opportunity employer. We embrace
  and celebrate diversity, and encourage individuals from all
  backgrounds to apply.
