description: |
  About Us

  Legora is redefining how legal work gets done. Not built for
  lawyers, built with them. We work alongside the world’s best
  legal teams, who expect excellence, precision, and speed,
  and we hold ourselves to the same bar. Our AI-native
  workspace lets legal professionals move faster, think more
  clearly, and operate with sharper precision. By analysing
  thousands of documents in minutes and powering end-to-end
  workflows, we cut through complexity, teams can focus on
  what matters: judgment, strategy, and outcomes. 1,000+
  customers across 50+ countries trust us, including Cleary
  Gottlieb, Goodwin, Linklaters, White & Case, Dentons, and
  Barclays. We’ve scaled to $100M+ in ARR, with teams across
  Europe, North America and APAC, and continue to expand
  through acquisitions including Qura, Walter AI and
  Graceview. We partner with world-class performers: including
  Aaron Judge and the New York Yankees, Ludvig Åberg (and his
  caddie), and campaigns featuring Jude Law. Joining Legora
  means three things.

  - We lean in: ownership over titles, outcomes over intentions.
  - We fight for excellence: high standards, direct, ego-free
    feedback.
  - We grow together: as a team and with our customers.

  Mission before ego. Everyone contributes. No one coasts.

  If you’re driven by impact, pace, and raising the bar. This
  is the place.

  What you'll do

  Legal AI is inventing its best practices in real time, and
  this role sits where that happens. You'll sit within the
  Legal Engineering team and work hand in hand with Product at
  one of the fastest-growing legal AI companies in the world,
  seeing new capabilities before almost anyone else,
  experimenting with them against real legal work, and turning
  what you learn into the standards a global function runs on.
  In a year here, you will see and vet more legal AI use cases
  than most people in the industry see in a career, working
  directly with some of the best legal engineers in the
  industry.

  This is a judgement role, not a filing one. You'll be the
  person who vets the skills, workflows and use cases the
  function ships: testing them hands-on, separating the
  genuinely strong from the merely plausible, and quality-
  controlling practice-area workflows so that what carries the
  Legora name is consistently excellent. You'll research and
  experiment with prompting techniques and applied AI methods,
  author the exemplar use cases the rest of the function
  copies, and teach what you learn: delivering technical
  onboarding for new Legal Engineers in your region and
  broadcasting best practices to the team worldwide. And
  because judgement needs grounding, around 30% of your time
  stays on live client work, chosen for what it teaches.

  Specifically, you will

  • Vet the Skills Library and Legal Engineering outputs
  against the quality bar: review skills, workflows and use
  cases hands-on before they go live, and quality-control
  practice-area workflows for consistency.

  • Research and experiment with prompting techniques, skill
  patterns and emerging AI methods, and turn what works into
  best practices the whole function adopts.

  • Author the reference use cases that show what great looks
  like, published as the exemplars others copy.

  • Work closely with the Product team on up-and-coming
  capabilities: early hands-on testing, the first best
  practices for new features, and structured feedback from
  real use.

  • Produce materials that would support the technical
  onboarding and training for new Legal Engineers in your
  region, such as best practices to create use cases etc.

  • Communicate new best practices, exemplars and platform
  changes to the Legal Engineering team worldwide.

  • Support the flagship demos our CEO and C-suite take on
  stage at the industry’s biggest events: use case
  preparation, fixtures and rehearsal support.

  • Oversee the quality and currency of the use case and
  skills libraries, including coordination across regions

  • Spend roughly 30% of your time on live client work,
  selected for what it feeds back into the standards and
  libraries.

  What you bring

  You're a lawyer with real practice experience who has become
  genuinely technical: maybe you did a coding bootcamp, maybe
  you taught yourself, but either way you're the person
  colleagues ask how something actually works. You live in AI
  tools, and it shows: you can tell a strong use case from a
  plausible-sounding weak one, you know why a prompt
  underperforms before you've finished reading it, and you
  hold both halves of the judgement this role needs: what
  makes a prompt run well, and what makes a legal output
  substantively right rather than merely fluent. When you vet,
  you vet properly: line by line against the source, with the
  discipline to put the AI down when the job calls for your
  own eyes.

  We're looking for

  • A qualified lawyer with solid practice experience at a
  leading firm or in-house team, or equivalent: enough
  substantive judgement to vet outputs across practice areas.

  • Real technical prowess: comfortable with code or scripting
  (a bootcamp or self-taught background counts entirely), and
  fluent in the mechanics of how AI tools actually behave.

  • A heavy, habitual user of AI, ideally legal AI, with sharp
  prompt and use case discernment: able to rank a strong
  prompt against a mediocre one, articulate exactly why, and
  improve it.

  • Visible pride in the craft of prompting and use case
  design: someone who wants to be the reference point for what
  good looks like.

  • Rigour in review: line-by-line verification against
  source, and the judgement to know exactly when not to use
  AI.

  • Comfortable running high-throughput workstreams: you
  triage well, keep many threads moving, and build process
  where volume demands it.

  • Experience building skills, workflows or automations in a
  legal AI platform is a strong plus.

  • Good to have: an M&A or wider transactional background, or
  deal coordination experience.

  Where this role can go

  This role is built to grow with the field itself. Applied
  legal AI knowledge barely exists as a discipline yet, and
  nobody accumulates evidence faster than the person vetting
  and testing the entire output of a global function. Do this
  job well and you are positioned to become one of the
  industry’s recognised voices on what good looks like. Inside
  Legora, the role is designed to grow into owning applied AI
  knowledge globally: the standards, techniques and systems
  every region operates on. Growth is subject to performance
  and company need, but the direction is deliberate: master
  the material here first, then define the standard for the
  industry.

  Legora is an Equal Opportunity Employer

  At Legora, we believe great teams are built on diversity of
  thought and experience. We’re proud to be an equal
  opportunity employer and committed to creating an inclusive,
  high-performance culture where everyone can do their best
  work. We welcome people of all backgrounds and don’t
  discriminate based on race, color, religion, national
  origin, gender, gender identity or expression, sexual
  orientation, age, disability, veteran status, or any other
  characteristic protected by law.
