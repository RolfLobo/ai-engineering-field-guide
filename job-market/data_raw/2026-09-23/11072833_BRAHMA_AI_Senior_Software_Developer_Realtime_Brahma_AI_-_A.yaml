description: |
  Senior Software Developer, Realtime



  The Technology department at Brahma DDU is responsible for
  creating and supporting the infrastructure that powers
  DNEG’s multi-site, global VFX and Feature Animation studio.
  With thousands of artists producing tens of thousands of
  shots across film, TV, and immersive experiences, we face
  complex scaling and workflow challenges.



  As a Senior Realtime Software Developer, you will take on a
  leadership role within the Realtime Technologies team. While
  remaining a hands-on technical expert, you will work
  alongside other leads to guide developers, manage project
  lifecycles, and act as a bridge between production
  stakeholders and technical implementation.



  The Role

  You will help drive the integration of Unreal Engine into
  Brahma DDU’s proprietary pipeline, contributing to a
  realtime strategy that aligns with the goals of Visual
  Effects, Feature Animation, and Virtual Production. Beyond
  writing code, you will focus on architecting sustainable
  solutions and mentoring other developers within the team.



  Your key responsibilities will include:

  - Architectural Contribution: Collaborate with other team
    leads to design and implement robust, scalable methods for
    integrating Unreal Engine with our proprietary global
    pipeline.
  - Tool Development: Design, develop, and deliver high-quality
    tools for artists across various disciplines, from layout
    to final pixels.
  - Pipeline Integration: Create and maintain robust methods for
    integrating Unreal Engine with our proprietary global
    studio pipeline.
  - Team Leadership & Mentorship: Lead a small, agile sub-team
    of developers, providing technical guidance and conducting
    code reviews to foster a high-performance culture.
  - Project Management: Oversee the development lifecycle for
    specific realtime tools - from requirements gathering and
    scoping to delivery - ensuring milestones are met.
  - Stakeholder Involvement: Act as a technical liaison for
    production VFX Supervisors and HODs, translating creative
    requirements into actionable technical tasks.
  - Cross-Department Collaboration: Partner with other
    Technology groups to ensure realtime initiatives are
    integrated seamlessly into the studio's broader software
    infrastructure.
  - Quality & Standards: Promote best practices for technical
    documentation, testing protocols, and CI/CD workflows to
    ensure the stability of production-critical tools.



  Must Have

  - Leadership Experience: Proven track record of leading small
    technical teams or acting as a Lead Developer on complex,
    multi-person projects.
  - Advanced Technical Proficiency: Expert-level knowledge of
    Unreal Engine (C++ and Blueprints) and a solid
    understanding of the Engine's inner workings.
  - Programming Skills: Extensive professional experience in C++
    and Python within a Linux and Windows environment.
  - Project Management Skills: Experience working in (and
    leading) Agile/Scrum environments, with the ability to
    manage competing priorities and stakeholder expectations.
  - Communication: Exceptional ability to communicate complex
    technical concepts to non-technical stakeholders and
    artists.
  - Problem Solving: A proactive mindset with the ability to
    navigate ambiguity and provide stable solutions under
    production pressure.



  Nice to Have

  - Industry Context: Experience with Virtual Production, VFX,
    or Feature Animation workflows (e.g., USD, OpenColorIO).
  - Tooling Expertise: Experience developing artist-facing tools
    for packages like Houdini, Maya, Nuke, or Katana.
  - Systems Knowledge: Experience with multi-user Unreal
    development and large-scale version control (Perforce/Git)
    at a studio level.
  - Education: A degree in Computer Science, Computer
    Engineering, or a related field.



  Why Join Us?

  This is a high-impact leadership role where you will shape
  the future of realtime technology at one of the world's
  leading studios. You will have the autonomy to drive
  innovation while collaborating with world-class artists on
  the most ambitious projects in the industry.



  We would not be able to produce award-winning work without
  our Technology department, which is committed to nurturing a
  diverse and exciting workplace. Our teams have a variety of
  backgrounds and originate from a number of different
  countries, working across the globe at the forefront of
  technology in the industry.



  Brahma AI & DDU

  DDU (DNEG Dedicated Unit) operates within BRAHMA AI and
  works closely with DNEG to develop technology used directly
  in production. The team builds tools, platforms and
  workflows that support VFX and Feature Animation pipelines
  across DNEG’s global studios. Much of the work focuses on
  artist-facing tools, large production pipelines, simulation
  and rendering workflows, and systems that need to run
  reliably across distributed teams.
