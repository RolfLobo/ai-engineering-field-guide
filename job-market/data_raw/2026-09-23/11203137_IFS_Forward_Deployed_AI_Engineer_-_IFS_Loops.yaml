  Job Description

  About the Role

  As a Forward Deployed AI Engineer, you’ll work directly with
  enterprise customers to deliver custom, production-ready AI
  solutions that solve real-world problems. You’ll lead the
  design and deployment of intelligent agents across customer
  workflows—owning everything from discovery and prototyping
  to configuration, testing, and launch.

  This is a fast-paced, hands-on role that combines
  engineering, customer collaboration, and applied AI. You
  will serve as a critical link between our product and the
  customer’s needs—ensuring rapid value delivery and laying
  the foundation for long-term success.

  What You’ll Do

  - Partner with enterprise customers to scope and implement AI
    Agent use cases across complex workflows
  - Integrate IFS Loops platform with customer systems
  - Tune agent behavior and logic to deliver measurable outcomes
    (e.g., lower costs, increase in efficiency,  fewer errors)
  - Troubleshoot deployments and iterate quickly to ensure
    performance, accuracy, and user adoption
  - Collaborate closely with Product, Engineering, and Customer
    Success to feed customer insights into the roadmap
  - Document technical decisions and hand off stable deployments
    to customer engineering or support teams

  Qualifications

  What We’re Looking For

  - 2–5 years of experience in a software engineering, solutions
    engineering, or ML deployment role
  - Proficiency in Python and working knowledge of AI/ML
    frameworks (e.g. OpenAI, Hugging Face, LangChain,
    Pinecone, Weaviate, etc.)
  - Familiarity with building LLM applications, RAG systems, or
    conversational AI workflows
  - Experience integrating with enterprise systems via APIs or
    middleware (e.g. Salesforce, ServiceNow, SAP,  Oracle)
  - Ability to translate business problems into technical
    solutions—and deliver them fast
  - Strong interpersonal skills; you’re just as comfortable on a
    whiteboard with a customer as you are in code
  - Bias toward action, ownership, and continuous learning in
    dynamic environments

  Nice to Have

  - Background in SaaS, customer experience, support operations,
    or manufacturing systems
  - Experience deploying AI in mission-critical environments
  - Prior work with enterprise AI platforms or multi-agent
    orchestration

  Additional Information

  We embrace flexibility and hybrid work opportunities to
