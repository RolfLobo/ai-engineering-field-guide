description: |
  McKesson is an impact-driven, Fortune 10 company that
  touches virtually every aspect of healthcare. We are known
  for delivering insights, products, and services that make
  quality care more accessible and affordable. Here, we focus
  on the health, happiness, and well-being of you and those we
  serve – we care.

  What you do at McKesson matters. We foster a culture where
  you can grow, make an impact, and are empowered to bring new
  ideas. Together, we thrive as we shape the future of health
  for patients, our communities, and our people. If you want
  to be part of tomorrow’s health today, we want to hear from
  you.

  We are seeking a highly skilled and motivated AI Full Stack
  Software Engineer to join our innovative team at CMM. In
  this role, you will be instrumental in designing,
  developing, and deploying end-to-end AI-powered solutions
  that enhance our healthcare products and services. You will
  work across the full stack, from front-end user interfaces
  to back-end AI model integration and data pipelines.


  Responsibilities

  - Develop and deliver AI-driven enterprise quality software
    applications.
  - Build scalable applications integrating Large Language
    Models and other AI tools (e.g. voice recognition,
    document parsing, image parsing, text to speech, RAG) into
    new and legacy codebases
  - Design and optimize data pipelines and datasets for AI
    system development and testing.
  - Communicate modern AI concepts (LLMs, vector databases etc.)
    to non-technical audiences
  - Iteratively craft effective prompts to maximize LLM
    performance and implement prompt caching strategies
  - Maintain prompt libraries & benchmark performance
  - Fine-tune & serve GPT-family, Llama
  - Develop AI agents Semantic Kernel
  - Prototype co-pilot experiences & autonomous workflows
  - Fully document all work at both the code level and
    application level.
  - The ability to learn and adapt in a changing environment.
  - Collaborate with other staff and outside stakeholders on
    large projects.
  - Must be passionate about creating solutions and solving
    complex problems.

  Priority will be given to candidates who reside in the
  Atlanta, GA, and Columbus, OH metropolitan areas.

  We are unable to provide sponsorship for this role presently
  or in the future.

  Minimum Qualifications

  - Minimum 4+ years of experience in Software development.
  - B.S. degree in Computer Science or related engineering
    discipline, or equivalent experience

  Critical Skills

  - Minimum 4+ years of experience in developing AI-enhanced
    applications using LLMs, voice, image, or speech models.
  - Proficiency in Python and AI related python libraries such
    as openai, tensorflow, pytorch
  - AI System Evaluation & Optimization: Proficient in
    sensitivity metrics (precision, recall, F1-score, AUC-ROC)
    and MLOps for scalable, cost-efficient AI deployment.
  - RAG Development: Skilled in building RAG systems from
    scratch or with LangChain/LlamaIndex, using vector
    databases for context-aware LLM applications.
  - Experience using AI coding tools (e.g. Github Copilot,
    Cursor, Codeium/Windsurf)
  - LLM Cost Optimization: Expert in managing LLM costs (token
    pricing, input/output rates) via prompt caching, batching,
    and quantization.
  - LLM Knowledge: Deep understanding of LLM advancements
    (GPT-3.5 vs GPT-4 vs o1/”thinking” models) for informed
    model selection and tuning.

  Preferred Skills

  - Exceptional analytical skills to extract actionable insights
    from data
  - Healthcare Domain Expertise, Translate clinical/business
    needs into AI solutions
  - Proficiency in creating Node.js web apps (e.g. Express.js)
  - Experience with cloud (AWS/GCP/Azure)
  - Effective communication skills to collaborate with
    technical, DevOps and product management teams.
  - Experience with Git, Docker, and Kubernetes



