  As your initial project assignment, you will support the
  unique needs of our client as a AI Foundry Platform
  Engineer.

  Project Summary

  AIS is seeking an AI Foundry Platform Engineer to build,
  secure, and operate the Azure Government AI platform that
  enables governed use of Azure AI Foundry and approved
  generative AI models. This engineer converts architecture
  into repeatable platform capabilities and reliable developer
  experiences.

  Key Responsibilities

  - Configure and support Azure AI Foundry projects, model
    deployments, quotas, access controls, and telemetry.
  - Implement private networking, private endpoints, DNS,
    managed identities, Key Vault integration, and role-based
    access.
  - Build monitoring and reporting for usage, token consumption,
    capacity, cost allocation, safety events, and service
    health.
  - Support secure integration between AI services, developer
    tools, AVD/Codex access patterns, and approved enterprise
    systems.
  - Automate environment configuration and promote repeatable
    deployment patterns using approved infrastructure and
    release practices.
  - Create operational runbooks, troubleshooting guides, and
    knowledge-transfer materials for platform support teams.

  Required For This Opportunity

  - 5+ years of Azure engineering experience, including
    networking, identity, monitoring, and secure PaaS
    delivery.
  - Hands-on experience with Azure AI Foundry, Azure OpenAI,
    Azure Machine Learning, or similar AI application
    platforms.
  - Experience with Entra ID, managed identities, private
    endpoints, Key Vault, Log Analytics, and Azure Cost
    Management.
  - Ability to troubleshoot across application, network,
    identity, and cloud-platform layers.
  - Strong scripting or automation capability using PowerShell,
    Azure CLI, Python, or equivalent.

  Nice to Have Skills

  - Azure Government or regulated-environment delivery
    experience.
  - Experience with LLM observability, AI safety controls,
    prompt management, or token governance.
  - Azure Administrator or Azure Developer certification.

  At AIS, we are committed to offering competitive and fair
