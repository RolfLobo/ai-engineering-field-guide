description: |
  About Huzzle

  At Huzzle, we connect high-performing professionals with
  global companies across the UK, US, Canada, Europe, and
  Australia. Our clients include startups, digital agencies,
  and tech platforms in industries like SaaS, MarTech,
  FinTech, and EdTech. We match top talent to full-time remote
  roles where they’re hired directly into client teams and
  provided ongoing support by Huzzle.

  Role Type: Full-time

  Engagement: Independent Contractor

  Job Summary

  We are seeking a high-caliber Senior AI/ML & Optimization
  Engineer to join the core team at Loop Optimizations. This
  is not a project-based role; it is a mission-critical
  position focused on building and refining an autonomous AI
  marketing platform that continuously creates, tests, and
  improves full-funnel marketing assets. You will be
  responsible for the "brain" of our system, ensuring our
  algorithms make smarter decisions, drive higher revenue for
  customers, and operate with maximum efficiency. If you are
  passionate about building self-improving systems that bridge
  the gap between complex data and real-world business
  outcomes, we want to hear from you. Key Responsibilities

  - Architect and refine optimization algorithms that drive
    autonomous marketing decisions
  - Analyze experiment performance and A/B test results to
    iterate on system logic
  - Evaluate and integrate cutting-edge AI models to enhance
    creative generation and predictive capabilities
  - Develop and improve multi-touch attribution models to ensure
    accurate revenue reporting
  - Scale the platform to support new advertising channels and
    complex customer journeys
  - Optimize system performance and reduce inference costs
    without sacrificing output quality
  - Incorporate customer feedback and behavioral data to improve
    the platform's autonomous reasoning
  - Monitor and improve the overall reliability and speed of the
    optimization loops

  Requirements

  - Develop and refine autonomous optimization algorithms that
    manage ads, websites, and email marketing sequences
  - Analyze experiment performance and A/B test results to drive
    continuous system improvement
  - Evaluate and integrate the latest AI models and creative
    generation tools to maintain a competitive edge
  - Improve multi-touch attribution models and autonomous
    decision-making logic
  - Expand the platform’s reach by introducing and optimizing
    new advertising channels
  - Focus on system performance by reducing inference costs and
    latency
  - Incorporate direct customer feedback into the development of
    new optimization methodologies
  - Monitor long-term system health to ensure the platform
    remains a robust, continuously improving engine

  Nice-to-Haves

  - Experience in the SaaS or AdTech industries.
  - Advanced proficiency in A/B testing frameworks and
    experimental design.
  - Familiarity with Slack for team communication and workflow
    integration.
  - Strong English communication skills

  Benefits

  💰 Competitive base salary

  🌎 Fully remote work environment (Offshore)

  🚀 Opportunity to build a category-defining autonomous
  platform

  📈 Long-term stability as an integral, ongoing teammate

  🕒 Flexible working hours with consistent core overlap

  🛠️ Work with the latest AI/ML models and technologies
