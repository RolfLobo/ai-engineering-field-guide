description: |
  As the most trusted global leader in data-first contract
  lifecycle management (CLM) software, Agiloft helps
  organizations manage the end-to-end process of proposing,
  negotiating, signing, and leveraging contracts using our
  flexible Data-first Agreement Platform (DAP). With contract
  data as the foundation, customers quickly and
  collaboratively reach agreement and leverage contract
  visibility to thrive with competitive advantage. Employing
  powerful, pragmatic artificial intelligence as a legal force
  multiplier, and robust integration capabilities as a data
  liberator, organizations around the world trust Agiloft’s
  certified implementers to deliver connected, intelligent,
  and autonomous solutions across the entire contract
  lifecycle.

  Top analysts like Gartner, Forrester, and IDC agree, all
  showing Agiloft as a leader in the CLM space. Our no code
  platform is easily managed and administered by business
  users, which is why Agiloft is the contract you keep: nearly
  a full 100% of new customers are satisfied with their
  initial implementations, and some 97% of customers renew
  every year. Ours is a growing, vibrant, successful company
  that is at the forefront of a market that is becoming a
  must-have for all organizations.

  We believe that the way to build the strongest, most vibrant
  place to work is to bring in individuals from all walks of
  life, and to support them in bringing their authentic selves
  to their day, every day. Our working philosophy is that “EX
  = CX”: when employee experience is excellent, so is customer
  experience. We support multiple Employee Resource Groups
  (ERGs), and offer a working environment that supports
  healthy work/life balance, including floating holidays and a
  quarterly, no-questions-asked wellness day.

  Position Overview

  The AI Ops Engineer, GTM is Agiloft's dedicated AI
  practitioner for the go-to-market organization, shaping and
  executing the AI vision across Sales, Marketing, Customer
  Success, Revenue Operations, and the broader revenue
  function. Equal parts strategist and builder, this person
  understands how GTM teams win, where they lose time, and
  where AI can create meaningful leverage.

  Customer and market proximity is a core requirement. The
  role stays actively involved with customers and the sales
  process to understand what it takes to sell Agiloft, retain
  customers, and grow accounts, then uses that insight to
  experiment, measure outcomes, and scale successful AI-
  powered GTM patterns.

  Reporting to the SVP GTM Intelligence with a dotted line to
  the VP AI Operations, this role partners with GTM leadership
  for strategic direction while AI Operations provides
  architectural standards, governance, tooling access, and
  organizational alignment. Working with the GTM AI Builders
  community, the AI Ops Engineer prioritizes and delivers
  solutions that move the revenue needle while continuously
  developing AI engineering skills and helping transform how
  Agiloft goes to market.

