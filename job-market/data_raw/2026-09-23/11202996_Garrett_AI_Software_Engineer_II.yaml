description: |
  Responsible for the development of technology solutions
  through the creation of new applications and enhancement of
  existing software, with mandatory and extensive use of
  Artificial Intelligence (AI) throughout the software
  development lifecycle. Designs, prototypes, develops, tests,
  debugs, documents, and implements software applications in
  accordance with business and technical requirements.
  Leverages AI-assisted development tools and practices to
  improve productivity, code quality, innovation, and delivery
  speed. Ensures all applications are developed in compliance
  with applicable Garrett development standards, architecture
  guidelines, and best practices. Builds and maintains strong
  collaborative relationships with the Team Lead and team
  members to effectively develop, deliver, and continuously
  improve technology solutions.  Key Job Areas of
  Responsibilities

  - Develop and enhance software applications using AI-assisted
    development tools and practices.
  - Analyze business requirements and translate them into
    technical solutions.
  - Create prototypes, write code, perform testing, debugging,
    and deployment activities.
  - Generate and maintain technical documentation.
  - Ensure compliance with Garrett development, quality,
    security, and coding standards.
  - Leverage AI to improve development productivity, code
    quality, and delivery efficiency.
  - Collaborate with team leads, business stakeholders, and team
    members to deliver solutions.
  - Support application maintenance, troubleshooting, and
    continuous improvement initiatives.
  - Participate in code reviews and knowledge-sharing
    activities.
  - Perform unit, integration, functional, and non-functional
    testing using AI-assisted tools to ensure solution quality
    before release.
  - Troubleshoot and resolve application issues using AI-enabled
    analysis and debugging techniques.
  - Deliver high-quality solutions on time, following Team Lead
    guidance and development standards.
  - Create and maintain accurate technical documentation,
    leveraging AI tools where appropriate.
  - Review and validate AI-generated code, tests, and
    documentation to ensure quality, security, and compliance.
  - Support, update, repair, modify and develop existing
    software and generic applications as per ITOM
  - Write detailed documentation for the operation of the
    program by users and computer operators.
  - Consult manuals, periodicals and technical reports to learn
    new ways to develop programs with use of AI and maintain
    existing skills and knowledge,Update, repair, modify and
    develop
  - Harden application with automated AI assisted testing,
    secure coding, and peer reviews that satisfy plant IT/OT
    audit expectations.
  - Lead complex incident resolution, root-cause analysis, and
    permanent fixes for production issues affecting
    application availability.
  - Document architecture decisions, deployment runbooks, and
    knowledge articles that keep shop-floor support teams
    aligned.
  - Collaborate with business stakeholders teams across globe,
    and IT stakeholders to translate operational needs into
    actionable application backlog
  - Collaborate with external SAAS application support teams for
    incident, request and change tickets

  Education/Qualifications

  'Bachelor’s degree in Information Technology / Computer
  science / Electronics stream or Master of Computer
  applications.

  Experience Required

  3 to 5 year of experience in software development

  Key Skills and Knowledge

  - Strong experience in designing, developing, and supporting
    enterprise applications across diverse platforms using
    modern development tools and frameworks.
  - Strong knowledge with AI assisted coding and software
    development testing
  - Excellent understanding of software architecture, design
    patterns, object-oriented design principles, and scalable
    application development.
  - Strong knowledge of database design, SQL, Angular,
    normalization, performance tuning, and data integration
    concepts.
  - Hands-on experience with technologies such as C#, .NET,
    Cursor, APIs, and data structures, with the ability to
    evaluate and apply the right technology for business
    needs.
  - Strong analytical and problem-solving skills, with the
    ability to quickly understand complex business processes,
    identify root causes, and provide effective solutions.
  - Experience in solution design, system integration, and
    application support within enterprise planning and supply
    chain environments.
  - Deep understanding of high-level design, application
    architecture, and best practices for maintainable, secure,
    and reliable systems.
  - Working knowledge of DevOps practices including CI/CD
    pipelines, version control, release management, and
    deployment support.
  - Sound knowledge of AI and Generative AI trends, including
    intelligent automation, copilots, prompt engineering,
    document intelligence, and AI-assisted decision support in
    enterprise applications.
  - Critical understanding of AI/ML integration concepts, data-
    driven analytics, and opportunities to apply AI solutions
    to improve business processes and user productivity.
  - Strong Experience in stakeholder collaboration, knowledge
    transfer, and coordinating with cross-functional teams to
    deliver business and IT solutions.
  - Ability to mentor CSW team members, drive technical
    discussions, and contribute effectively in a lead role.

