  EMCOR Group Inc. (NYSE:EME), a Fortune 500® company with
  2025 revenues of almost $17B, is a leader in mechanical and
  electrical construction, industrial and energy
  infrastructure, and building services.

   A provider of critical infrastructure systems, EMCOR
  companies give life to new structures and sustains life in
  existing ones by its planning, installing, operating,
  maintaining and protecting the sophisticated and dynamic
  systems that create facility environments—such as
  electrical, mechanical, lighting, air conditioning, heating,
  security, fire protection and power generation systems—in
  virtually every sector of the economy and for a diverse
  range of businesses, organizations and government.

   EMCOR’s strong financial position has enabled us to attract
  and retain among the best local and regional talent, to
  undertake and complete the most ambitious projects, and to
  redefine and shape the future of the construction and
  facilities services industry.

  Here are EMCOR, we're driven by values. We use them as a
  metric, a guideline, a way to ensure that each activity we
  engage in is aligned with the principles we believe in.  We
  are mission first, people always, and we hope you join our
  team!

  General Summary

  As part of the Corporate IT team, the AI Engineer is
  responsible for designing, developing, implementing, and
  supporting practical artificial intelligence solutions that
  improve business processes, increase productivity, and
  enable responsible AI adoption across EMCOR. This hands-on
  role will build and integrate AI capabilities, including
  generative AI applications, automation workflows, retrieval
  augmented generation solutions, AI agents, and model-enabled
  business processes. The AI Engineer will partner directly
  with EMCOR Operating Companies and corporate departments to
  identify use cases, develop reusable patterns, support
  implementation efforts, and help teams adopt AI capabilities
  in a secure, scalable, and supportable manner. This role
  will also work closely with the AI Security Engineer to
  ensure AI solutions follow approved security architecture,
  data protection requirements, governance processes, and
  responsible AI standards.

  Principal Duties and Responsibilities

  • Design, develop, test, deploy, and support AI-enabled
  solutions that address business needs across EMCOR and its
  Operating Companies

  • Build practical AI capabilities including generative AI
  applications, AI agents, workflow automation, document
  intelligence, natural language interfaces, and retrieval-
  augmented generation solutions

  • Partner with Operating Company leaders, corporate
  departments, and IT teams to identify high-value AI use
  cases, define requirements, prototype solutions, and support
  implementation

  • Create reusable AI solution patterns, implementation
  guidance, technical documentation, and reference examples
  that Operating Companies can adopt and extend

  • Integrate AI capabilities with approved enterprise
  platforms, applications, APIs, data sources, and automation
  tools

  • Develop and maintain prompt engineering standards,
  evaluation approaches, testing routines, and quality
  controls for AI outputs

  • Work with the AI Security Engineer to ensure AI solutions
  meet EMCOR security requirements, including data protection,
  access control, logging, monitoring, prompt and response
  filtering, and approved architecture patterns

  • Ensure AI solution development follows EMCOR Secure
  Software Development Lifecycle guidelines, including
  security requirements, design reviews, secure coding
  practices, testing, validation, documentation, and release
  readiness

  • Support AI governance processes by documenting solution
  purpose, data sources, risks, controls, expected outputs,
  limitations, and operational ownership

  • Monitor implemented AI solutions for performance,
  reliability, usage, cost, quality, and business value;
  recommend improvements as needed

  • Stay current on emerging AI technologies, enterprise AI
  platforms, development frameworks, and implementation best
  practices; translate relevant advancements into practical
  EMCOR use cases

  • Provide training, guidance, and practical support to EMCOR
  employees on the effective and responsible use of approved
  AI tools, including appropriate use cases, prompting and
  development, productivity best practices, and data
  protection requirements.

  Job Specifications

  • Five years minimum experience in software engineering,
  application development, data engineering, automation, or
  related technology implementation roles

  • Two years minimum hands-on experience developing or
  implementing AI, machine learning, generative AI,
  automation, or advanced analytics solutions

  • Experience with one or more programming or scripting
  languages such as Python, JavaScript, TypeScript,
  PowerShell, or SQL

  • Working knowledge of generative AI concepts, large
  language models, prompt engineering, retrieval-augmented
  generation, APIs, and AI solution evaluation

  • Experience integrating applications, data sources, APIs,
  automation workflows, and cloud services

  • Familiarity with Microsoft 365, Azure, Power Platform,
  Copilot Studio, GitHub, M365 Copilot and Agents or
  comparable enterprise AI and development platforms preferred

  • Understanding of data protection, access control, Secure
  Software Development Lifecycle guidelines, secure
  development practices, and responsible AI principles

  • Ability to translate business requirements into practical
  technical solutions and explain AI capabilities,
  limitations, and risks to technical and non-technical
  stakeholders

  • Ability to effectively communicate and interact with
  personnel at all levels, including EMCOR executive
  management, operating company leadership, IT teams,
  Security, Legal, Risk, and other business users

  • Must be capable of delivering a very high level of
  customer service

