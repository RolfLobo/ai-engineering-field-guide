description: |
  POSITION OVERVIEW

  MCI is one of the fastest-growing tech-enabled business
  services companies in the USA, with a strong call center
  footprint and operations that extend across multiple
  countries. We deliver Customer Experience (CX), Business
  Process Outsourcing (BPO), and Anything-as-a-Service (XaaS)
  cloud technology solutions across a wide range of
  industries, including healthcare, retail, government,
  education, telecom, technology e-commerce, and financial
  services. Our contact centers are powered by both on-site
  and remote agents, leveraging advanced technologies to
  enhance customer journeys, drive scalability and reduce
  costs.

  At MCI we are committed to fostering an environment where
  professionals can build meaningful careers, access
  continuous learning and development opportunities and
  contribute to the success of a globally expanding, industry-
  leading organization.

  We are seeking an innovative and technically skilled
  Generative AI Engineer to join our growing AI team. In this
  role, you will design, develop, and deploy cutting-edge AI
  solutions powered by Large Language Models (LLMs) and
  generative technologies. You will work closely with product
  managers, software engineers, and business stakeholders to
  build intelligent applications that improve customer
  experiences, automate complex workflows, and drive business
  value.

  This is an exciting opportunity for someone passionate about
  emerging AI technologies and eager to help shape the future
  of AI-powered products and services.

  To be considered for this role, you must complete a full
  application on our company careers page, including all
  screening questions and a brief pre-employment test.

  POSITION RESPONSIBILITIES

  Key Responsibilities:

  AI Solution Development

  - Design, build, and deploy Generative AI applications that
    solve business challenges and enhance customer
    experiences.
  - Develop AI-powered applications using Large Language Models
    (LLMs) and Generative AI frameworks.
  - Build scalable services and APIs that integrate AI
    capabilities into products and business processes.
  - Translate business requirements into practical AI solutions.
  - Collaborate with cross-functional teams to deliver high-
    impact AI initiatives.

  Model Integration & Optimization

  - Ensure AI models are effectively integrated, monitored, and
    continuously improved.
  - Integrate foundation models and third-party AI platforms
    into enterprise systems.
  - Optimize prompts, workflows, and model configurations to
    improve performance.
  - Evaluate output quality and implement enhancements to
    increase accuracy and reliability.
  - Conduct testing and experimentation to improve model
    effectiveness.

  AI Workflow Automation

  - Develop intelligent workflows that improve operational
    efficiency and productivity.
  - Design automated AI processes that reduce manual effort and
    increase scalability.
  - Connect AI solutions with internal systems, APIs, and data
    sources.
  - Support orchestration of AI-driven business processes.
  - Identify opportunities for automation and process
    optimization.

  Quality, Governance & Security

  - Ensure AI solutions operate responsibly and comply with
    organizational standards.
  - Implement monitoring and quality assurance processes.
  - Support AI governance, security, and compliance
    requirements.
  - Maintain documentation and technical standards.
  - Assist with risk identification and mitigation activities.

  Innovation & Continuous Improvement

  - Drive innovation and stay at the forefront of AI
    advancements.
  - Evaluate emerging AI technologies and frameworks.
  - Recommend improvements to architecture, tooling, and
    development practices.
  - Share knowledge and contribute to AI best practices across
    the organization.
  - Support proof-of-concept and experimentation initiatives.

  CANDIDATE QUALIFICATIONS

  WONDER IF YOU ARE A GOOD FIT FOR THIS POSITION?

  All positive, and driven applicants are encouraged to apply.
  The Ideal candidates for this position are highly motivated
  and dedicated and should possess the below qualities:

  - Bachelor’s degree in Computer Science, Information
    Technology, Data Engineering, or a related field.
  - 2+ years of experience in systems administration, DevOps, or
    infrastructure management (AI/ML environment experience
    preferred).
  - Strong understanding of cloud platforms (AWS, Azure, GCP)
    and containerization technologies (Docker, Kubernetes).
  - Experience with Linux/Unix administration, Python/Bash
    scripting, and automation tools (Terraform, Ansible,
    Jenkins).
  - Familiarity with machine learning frameworks (TensorFlow,
    PyTorch) and AI model deployment pipelines.
  - Understanding of networking, security, and storage in
    distributed computing environments.
  - Experience with GPU-based computing and performance
    optimization for AI workloads.
  - Excellent problem-solving, troubleshooting, and
    documentation skills.
  - Strong collaboration and communication abilities to work
    with cross-functional AI and engineering teams.

  PHYSICAL REQUIREMENTS

  This job operates in a professional office environment.
  While performing the duties of this job, the employee will
  be largely sedentary and will be required to sit/stand for
  long periods while using a computer and telephone headset.
  The employee will be regularly required to operate a
  computer and other office equipment, including a phone,
  copier, and printer. The employee may occasionally be
  required to move about the office to accomplish tasks; reach
  in any direction; raise or lower objects, move objects from
  place to place, hold onto objects, and move or exert force
  up to forty (40) pounds.

  CONDITIONS OF EMPLOYMENT

  All MCI Locations

  - Must be authorized to work in the country where the job is
    based.

  Subject to the program and location of the position

  - Must be willing to submit up to a LEVEL II background and/or
    security investigation with a fingerprint.  Job offers are
    contingent on background/security investigation results.
  - Must be willing to submit to drug screening.  Job offers are
    contingent on drug screening results. (Does not apply in
    Canada)

