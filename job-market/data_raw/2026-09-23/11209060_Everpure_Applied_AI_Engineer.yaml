description: |
  Everpure (NYSE: P) has evolved from storage pioneer to data
  platform, closing fiscal 2026 with $3.7 billion in revenue,
  its first billion-dollar quarter, and accelerating growth
  into FY27. Our strategic agenda spans the companies defining
  the next era of technology - hyperscalers, AI labs, the AI
  hardware supply chain, data platform providers, and the
  broader AI ecosystem.

  This type of work—work that changes the world—is what the
  tech industry was founded on. So, if you're ready to seize
  the endless opportunities and leave your mark, come join us.

  THE ROLE

  Despite the "Engineer" title, this isn't a typical back-end
  coding job. This is a pre-sales and architectural advisory
  role for someone who is part scientist, part consultant, and
  part communicator. At the Staff / Principal level, you are
  expected to be a hybrid heavy hitter — someone who can talk
  shop with PhD data scientists and then walk into a boardroom
  and explain the ROI to a CEO.

  We aren't looking for your average expert. We're building a
  team of T-shaped professionals with:

  - Deep Technical Roots — You know PyTorch, Kubernetes, and GPU
    clusters (NVIDIA/AMD) inside and out, and you know when
    XGBoost is a better choice than the latest frontier model.
  - Broad Business Acumen — You understand verticals, e.g. how a
    hospital's AI needs differ from a hedge fund's, and can
    navigate both conversations with credibility.
  - Collaborative Autonomy — With a global remit and potential
    for 30-60% travel, you are in charge of driving results
    within diverse collaborations.

  We're building a small, global Applied AI team to work
  directly with enterprise customers and partners — helping
  them turn AI ambitions into production outcomes on Pure's
  platform. This team brings genuine research and production
  depth to customer-facing engagements: leading technical
  advisory sessions, shaping AI strategy for some of the
  world's largest companies, and contributing to Pure's
  growing reputation in AI through publications, conferences,
  and thought leadership.

  The team also ensures Pure's account teams can effectively
  qualify and position AI advisory opportunities across their
  territories, and provides enablement to our internal field
  and channel partner communities. The role requires working
  cross-functionally across Solutions, Marketing, Alliances,
  Engineering, Enablement, and Sales to align initiatives and
  go-to-market campaigns — all while maintaining genuine
  technical depth in enterprise AI.

  If this sounds like you, come join one of the most exciting
  teams at Pure.

  WHAT YOU'LL DO:

  - Lead technical discovery and advisory engagements with
    customers to identify high-value AI use cases relevant to
    their industry and data
  - Advise on end-to-end AI deployment — model selection,
    training/fine-tuning strategies, inference optimization,
    data pipeline design, and evaluation/alignment/safety
    frameworks — optimized for Pure's platform
  - Collaborate cross-functionally to qualify and position AI
    opportunities, and develop proof-of-value prototypes that
    translate technical performance into business outcomes
  - Create AI enablement content for field teams, partners, and
    customers — technical walkthroughs, qualification guides,
    workshops, and vertical-specific use case frameworks
  - Present at industry conferences, publish technical content
    and peer-reviewed research, and represent Pure in
    engagements with strategic technology partners (NVIDIA,
    AMD, cloud providers, MSPs)
  - Operate autonomously in ambiguous environments —
    independently scoping high-impact initiatives and driving
    them to completion at the right pace

  WHAT YOU BRING:

  - Advanced degree in a quantitative field (Computer Science,
    Physics, Mathematics, Engineering, or related), or
    equivalent demonstrated through publications and
    production system experience
  - 8+ years building and deploying AI/ML systems in cloud or
    on-prem environments
  - Deep expertise in modern AI/ML — large language models,
    distributed training, inference optimization, agentic
    systems, evaluation/alignment frameworks, and classical ML
  - Fluency with the modern AI stack (PyTorch, vLLM, Ray,
    Kubernetes) and data platforms (Spark, Snowflake, Kafka,
    etc.)
  - Able to scope and carry out research projects that support
    critical business objectives, both independently and
    collaboratively
  - Excellent written, verbal, and presentation skills — equally
    clear with hands-on data scientists and C-suite decision-
    makers

  WHAT SETS YOU APART:

  - Experience with large-scale AI infrastructure: GPU clusters,
    high-performance storage, containerized deployments
  - Experience in customer-facing technical advisory or
    consulting roles with enterprise accounts
  - Experience leading independent, multi-year research from
    concept to publication or large-scale production
    deployment
  - Exposure to multiple industry verticals (financial services,
    healthcare, telco, manufacturing)
  - Publication record, conference presentations, or recognized
    technical presence
  - Background combining applied research with shipping
    production systems
  - Familiarity with CRM/opportunity management systems
    (Salesforce preferred)

  #LI-REMOTE

  #LI-JL4

  Salary ranges are determined based on role, level and
  location. For positions open to candidates in multiple
  geographical locations, the base salary range is reflective
  of the labor market across the applicable locations.

  This role may be eligible for incentive pay and/or equity.

  There is no application deadline and we accept applications
  on an ongoing basis until the job is filled.

  The annual base salary range is:

  $171,500—$257,600 USD

  WHAT YOU CAN EXPECT FROM US:

  - Innovation: We celebrate those who think critically, like a
    challenge, and aspire to be trailblazers.
  - Growth: We give you the space and support to grow along with
    us and to contribute to something meaningful. We have been
    named Fortune's Best Workplaces in Technology™, Fortune's
    Best Workplaces in the Bay Area™, and certified as a Great
    Place to Work®!
  - Team: We build each other up and set aside ego for the
    greater good.

  And because we understand the value of bringing your full
  and best self to work, we offer a variety of perks to manage
  a healthy balance, including flexible time off, wellness
  resources, and company-sponsored team events. Check out
  http://benefits.everpuredata.com/ for more information.

  ACCOMMODATIONS AND ACCESSIBILITY:

  Candidates with disabilities may request accommodations for
  all aspects of our hiring process. For more on this, contact
  us at TA-Ops@purestorage.com if you’re invited to an
  interview.

  OUR COMMITMENT TO A STRONG AND INCLUSIVE TEAM:

  We’re forging a future where everyone finds their rightful
  place and where every voice matters. Where uniqueness isn’t
  just accepted but embraced. That’s why we are committed to
  fostering the growth and development of every person,
  cultivating a sense of community through our Employee
  Resource Groups and advocating for inclusive leadership.

  Everpure is proud to be an equal opportunity employer. We do
  not discriminate based upon race, religion, color, national
  origin, sex (including pregnancy, childbirth, or related
  medical conditions), sexual orientation, gender, gender
  identity, gender expression, transgender status, sexual
  stereotypes, age, status as a protected veteran, status as
  an individual with a disability, or any other characteristic
  legally protected by the laws of the jurisdiction in which
  you are being considered for hire.

  Join us and bring your best.

  Bring your bold.

  Pure and simple.
