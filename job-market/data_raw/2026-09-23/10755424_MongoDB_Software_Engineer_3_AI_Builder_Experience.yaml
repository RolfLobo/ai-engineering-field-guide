description: |
  AI agents are transforming the way developers interact with
  software - and databases are no exception. We're seeking a
  Software Engineer to join our AI Interfaces team within AI
  Builder Experience (ABX), where you'll provide technical
  direction, shape architecture, and build the core products
  that make it seamless for developers and AI agents to work
  with MongoDB. Our team owns the surfaces through which
  humans and agents connect to MongoDB - including the MongoDB
  MCP Server, Agent Skills, our Intelligent Assistant
  Platform, and purpose-built agents. In short: if it's how an
  agent talks to MongoDB, we're building it.

  This is a new team charting new territory, and as a Software
  Engineer here, you'll be right at the frontier - building
  the technologies that let AI applications and agentic
  workflows work seamlessly with MongoDB at scale. You'll
  integrate with fast-moving, often unproven technologies,
  make pragmatic calls in the face of ambiguity, and own high-
  visibility projects end to end with minimal guidance. We're
  looking for product-minded engineers who thrive on autonomy
  and take pride in shipping. MongoDB engineering teams pride
  themselves on building high-quality software and living our
  cultural values every day - we value intellectual curiosity
  and honesty, and building together in an environment that
  prioritizes collaboration over competition.

  This position requires participation in a 24/7 on-call
  rotation to ensure business continuity and incident response
  capabilities.

  We are looking to speak to candidates who are based in
  Gurugram for our hybrid working model.

  Position Expectations

  - Work closely with research, product management, product
    engineering, product design, peers, as well as other teams
    within the company to define the first version and future
    evolution of our AI interfaces
  - Design, build, and deliver well-tested core pieces of the
    platform - including the MongoDB MCP Server, Agent Skills,
    the Intelligent Assistant Platform, and purpose-built
    agents - in collaboration with other vested parties
  - Take ownership of ambiguous problems and drive them to
    completion independently, making sound decisions as
    requirements evolve
  - Contribute to shaping architecture, code reviews, and
    development practices, as well as developer experience, as
    the teams and product grow
  - Mentor fellow engineers and assume ownership and
    accountability of projects

  Qualifications

  - Strong background in building core components for scalable,
    high-availability web applications and services
  - 3+ years of experience building backend systems, primarily
    in Node.js and TypeScript, with an interest in working
    across a polyglot codebase
  - Track record of identifying problems, implementing
    solutions, and working on complex projects
  - A product-minded approach to engineering, with the judgment
    to make pragmatic tradeoffs and the comfort to operate
    amid ambiguity and rapidly evolving technologies
  - Enjoys collaboration and being part of a team; is
    approachable, curious, and intellectually honest
  - Excellent verbal and written technical communication skills,
    and a desire to collaborate with colleagues
  - Eager to learn, with a strong technical background

  Nice to Haves

  - Experience building MCP servers, agent skills, or plugins
    for agentic applications
  - Familiarity with the agentic AI tooling ecosystem (AI IDEs,
    CLIs, and assistants) and how developers integrate with it
  - Working knowledge of Java and/or Python
  - Experience with OAuth and authentication infrastructure for
    developer-facing services
  - Experience working with databases and knowledge of database
    internals
  - Bonus points for experience with containerization and
    orchestration platforms (e.g. Kubernetes) and AI
    frameworks and tools

  About MongoDB

  MongoDB is built for change, empowering our customers and
  our people to innovate at the speed of the market. We have
  redefined the data platform for the AI era, enabling
  builders to create, transform, and disrupt industries with
  software. MongoDB’s unified data platform, the most widely
  available, globally distributed data platform on the market,
  helps organizations modernize legacy workloads, embrace
  innovation, and unleash AI. Our cloud-native platform,
  MongoDB Atlas, is the only globally distributed, multi-cloud
  data platform and is available across AWS, Google Cloud, and
  Microsoft Azure.

  With offices worldwide and over 67,000 customers, including
  75% of the Fortune 100 and AI-native startups, relying on
  MongoDB for their most important applications, we’re
  powering the next era of software.

  Our compass at MongoDB is our Leadership Commitment, guiding
  how and why we make decisions, show up for each other, and
  win. It’s what makes us MongoDB.

  To drive the personal growth and business impact of our
  employees, we’re committed to developing a supportive and
  enriching culture for everyone. From employee affinity
  groups, to fertility assistance and a generous parental
  leave policy, we value our employees’ wellbeing and want to
  support them along every step of their professional and
  personal journeys. Learn more about what it’s like to work
  at MongoDB, and help us make an impact on the world!

  MongoDB is committed to providing any necessary
  accommodations for individuals with disabilities within our
  application and interview process. To request an
  accommodation due to a disability, please inform your
  recruiter.

  MongoDB is an equal opportunities employer.

