title: "Founding Engineer: AI Native HealthTech Startup"
company: Kubera Health
location: New York, USA
work_type: FULL_TIME
company_size: 4 Employees
description: |
  What we're looking for

  We need a Founding Software Engineer with 2+ years of full-
  stack TypeScript experience, preferably in a healthcare or
  fintech startup. This is a super exciting and mission-driven
  role at a well funded startup ($6.5M raised), where you can
  shape engineering and broader culture.

  What you'll do

  - Develop, test, and release new features, shipping production
    code from day one.
  - Work across the full stack: backend, frontend,
    infrastructure, architecture, analytics, and integrations.
  - Design and work with data structures, analytics modeling,
    and parsing complex healthcare datasets to surface
    actionable insights.
  - Participate in code reviews, architecture discussions, and
    technical decision-making to ensure a clean, stable, and
    maintainable codebase.
  - Opportunity to own problems end-to-end and wear multiple
    hats—whether that's working directly with customers,
    shaping product roadmaps, or iterating on UX design.
  - Work in a hybrid environment in NYC, collaborating closely
    with the team in person.

  Requirements

  - 2+ years of experience as a full-time full-stack TypeScript
    software engineer (back-end leaning)
  - Experience with React, TypeScript, Node.js
  - Experience in healthcare and fintech preferred
  - Extremely high competency with AI coding tools (e.g. Claude
    Code, Cursor)
  - Ideally 1+ year at a venture-backed startup (pre Series B)
  - Experience turning unstructured, complex datasets into
    business insights
  - Familiarity with infrastructure-as-code, LLMs, and cloud-
    based data pipelines
  - Able to work on-site in a hybrid environment (4 days/wk in
    NYC, Union Square)
  - Authorized to work in the U.S.

  Compensation & Benefits

  - Salary bands: $130-200K (includes mid level and senior
    bands; candidates with higher YOE may be considered for
    principal level)
  - Competitive equity package
  - Fully covered health insurance and competitive stipend to
    cover dental, co-pays etc (ICHRA)
  - 401(k)
  - Flexible PTO that we actually take (encouraged minimum of 15
    days)
  - Lunch provided in office Mon-Thurs
  - Commuter benefits, new work equipment and workstation set
    up, etc.

  Interview Process

  - Interview with Head of Engineering (30 minutes)
  - Interview with Founder/CEO (30 minutes)
  - Technical interview / practical technical conversation (1
    hour)
  - (Optional) Onsite & lunch with team (~2 hours)
