description: |
  Job Description:

  Dentsu is operationalizing AI at scale. Across every brand
  and practice, business teams are identifying AI-powered
  tools, platforms, and vendors they want to deploy — and they
  need a fast, expert path through the governance process to
  do it safely.

  The AI Governance Concierge Service is dentsu's answer to
  that challenge — a dedicated, end-to-end service that gives
  any Americas business team a single expert point of contact
  for AI product adoption. The AI Governance Engineer is the
  process navigator, program manager, and technical
  implementer of the service.

  Working in close coordination with the AI Governance Service
  Lead, the Governance Engineer receives each submission
  package approved by the Lead, thoroughly understands its
  contents — the business case, the vendor research, the risk
  profile, and the policy alignment — and takes full ownership
  of driving it through the cross-functional review process.
  The Engineer is expected to speak to the details of every
  submission they manage, serve as the knowledgeable point of
  contact for all reviewing functions, coordinate with the
  Analyst when additional research or documentation is needed,
  and own the end-to-end implementation once approval is
  granted. This role ensures nothing stalls, nothing is lost,
  and every engagement crosses the finish line.

  The AI Governance Concierge Service is not simply an
  approval function — it is a service built around bringing
  every engagement to a successful conclusion. That means
  approving solutions that meet dentsu's standards,
  identifying alternative products or approaches that address
  the business need within governance requirements, and
  providing solutions that facilitate approval where possible.
  When risks are identified that prevent approval, the
  service's role is to clearly document and communicate those
  risks and leave the decision to the business to weigh the
  risk and reward. Success is a business team that always has
  a clear path forward — not just a ruling.

  What You Will Do

  Submission Intake & Program Management

  - Receive and thoroughly review each submission package
    approved by the Service Lead — developing a deep
    understanding of the business case, vendor research, risk
    profile, and policy rationale before the review process
    begins.

  - Project-manage each submission through the full review
    lifecycle in AIRS and TPSA — tracking every open item,
    deadline, and reviewer action from submission to final
    determination.

  - Set and communicate the review schedule for each submission
    based on priorities identified and communicated by the
    Lead; maintain that schedule actively throughout the
    review and implementation phases.

  - Update the AI Concierge Program Tracker with accurate, real-
    time progress during the review and implementation phases,
    ensuring the Service Lead always has a current view across
    all active engagements.

  - Work closely with the Analyst when reviewers require
    additional research, documentation, or clarification —
    coordinating the request clearly, reviewing what comes
    back for completeness, and routing it to the appropriate
    reviewing function without delay.

  - Report status, progress, and blockers to the Service Lead on
    a regular cadence, enabling the Lead to keep the business
    team accurately informed at all times.

  Cross-Functional Review & Relationships

  - Build and maintain trusted working relationships with
    counterparts in Legal, Information Security, Data Privacy,
    Emerging Technology, and Procurement — positioning the
    Concierge Service as an organized, reliable partner that
    makes their review process easier, not harder.

  - Shepherd each submission through the full cross-functional
    review process — serving as the knowledgeable, primary
    point of contact for all reviewing functions, engaging
    each group with the context and detail they need to review
    confidently.

  - Partner with Global Enterprise Technology to shepherd each
    request through the review process, ensure Global
    Enterprise Technology's requirements are met at the
    engagement level, and coordinate the technical backend of
    implementation.

  - Translate technical and legal concerns from reviewers back
    to the Service Lead and Analyst in plain language —
    enabling accurate communication to the business team and
    ensuring the Analyst has what they need to produce any
    required follow-up documentation.

  Escalation & Risk Management

  - Identify blockers within the governance or review process
    and surface them to the Service Lead immediately with
    clear context and recommended resolution paths.

  - Own the follow-through on blockers — actively working to
    resolve open items, maintaining momentum on stalled
    submissions, and not waiting for issues to resolve
    themselves.

  - Escalate risk-flagged items to the Service Lead and relevant
    stakeholders; document disposition rationale for all
    escalated items.

  Implementation & Delivery

  - Upon approval, own and coordinate the full implementation of
    each approved solution — working with Cloud, Okta,
    ServiceNow, End User Computing, and Global Enterprise
    Technology to ensure a complete and properly configured
    onboarding.

  - Ensure every approved AI product is registered in the Common
    Services Data Model (CSDM) as part of the onboarding
    process, maintaining an accurate and up-to-date record of
    the AI product landscape.

  - Confirm that all required data processing agreements, ICPAs,
    and procurement steps are completed before rollout.

  - Conduct a post-implementation check-in to confirm the
    solution is live, stable, and operating within approved
    parameters — and report findings to the Service Lead to
    close the loop with the business team.

  Program Development — Process & Implementation

  - Own the continuous improvement of the review orchestration
    process and implementation methodology — identifying
    friction points, proposing solutions, and driving adoption
    across the team.

  - Document implementation patterns and onboarding playbooks
    for common tool categories to reduce repetitive effort and
    accelerate future engagements.

  - Serve as an active member of AI communities and working
    groups within dentsu — staying current on emerging tools,
    enterprise deployment patterns, and governance
    developments and bringing relevant insights back to the
    team.

  - Help identify integration opportunities with AIRS,
    ServiceNow, Coupa, and other enterprise platforms to drive
    efficiency and reduce manual effort across the governance
    lifecycle.

  Required Qualifications

  - 5+ years of experience in IT governance, enterprise
    technology delivery, program or project management, or a
    role that spans compliance and technical implementation
    within a large organization.

  - Demonstrated ability to navigate cross-functional review
    processes involving Legal, Data Privacy, Information
    Security, Emerging Technology, and Procurement
    stakeholders simultaneously.

  - Strong program management skills; able to own and drive a
    review schedule across multiple concurrent submissions
    with competing priorities and stakeholders who have
    different risk tolerances.

  - Solid understanding of AI/ML concepts, generative AI
    capabilities, and the risk and compliance landscape around
    AI adoption — sufficient to engage substantively with
    reviewing functions on technical questions without
    routinely deferring to others.

  - Technical fluency to coordinate complex enterprise
    onboarding across platforms including cloud
    infrastructure, SSO/identity (Okta), ITSM (ServiceNow),
    CMDB/CSDM tooling, and AI governance workflow systems.

  - Strong relationship-building skills; able to earn the trust
    of Legal, Security, Data Privacy, and technical teams
    through consistent reliability, preparation, and clear
    communication.

  - Clear, precise communicator — able to translate between
    technical, legal, and business audiences without losing
    accuracy in either direction.

  Preferred Qualifications

  - Experience in a media, marketing, advertising, or
    professional services organization.

  - Familiarity with GenAI governance frameworks (NIST AI RMF,
    EU AI Act, ISO 42001) or data privacy regulations (GDPR,
    CCPA).

  - Hands-on experience with enterprise AI platforms (Claude
    Enterprise, Microsoft Copilot, Google Gemini, or similar)
    and their enterprise deployment requirements.

  - Background in vendor risk assessment, third-party due
    diligence, or enterprise technology procurement.

  - Experience with Coupa, ServiceNow, OneTrust, or similar
    enterprise workflow and compliance platforms.

  - IAPP AIGP, CIPP, CISSP, PMP, or equivalent certification is
    a plus.

  The annual salary range for this position is $82,500 -
  $130,000. Placement within the salary range is based on a
  variety of factors, including relevant experience,
  knowledge, skills, and other factors permitted by law.

  Benefits available with this position include:

  • Medical, vision, and dental insurance,

  • Life insurance,

  • Short-term and long-term disability insurance,

  • 401k,

  • Flexible paid time off,

  • At least 15 paid holidays per year,

  • Paid sick and safe leave, and

  • Paid parental leave.



  Dentsu also complies with applicable state and local laws
  regarding employee leave benefits, including, but not
  limited to providing time off pursuant to the Colorado
  Healthy Families and Workplaces Act, in accordance with its
  plans and policies.  For further details regarding Dentsu
  benefits, please visit www.dentsubenefitsplus.com.

  At dentsu, we believe great work happens when we’re
  connected. Our hybrid way of working combines remote
  flexibility with regular in-person collaboration to spark
  ideas and strengthen our teams. Many of our employees who
  live within commuting distance (90 minutes) from one of our
  Headquarter or Hub Offices (New York, Chicago, Detroit, Los
  Angeles) are required to work in the office 2-3 days per
  week including one Team Day. The minimum number of days may
  vary by office and role. Dentsu may designate other HQ or
  Hub offices at any time. Those who do not live near an
  office may be designated as a remote employee, depending on
  the role and business needs. Regardless of your work
  location, we expect you to be flexible to meet the needs of
  our Company and clients, which may include attendance in an
  office from time to time.

