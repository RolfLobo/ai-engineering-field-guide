description: |
  Where Ambition Meets Innovation

  Build a career that matches all your initiative with an
  impressive dose of innovation. From cutting-edge resources
  and a collaborative environment to the freedom to make an
  impact and more, you’ll find the ingredients you need at LPL
  Financial to shape your success while helping clients pursue
  their financial goals.

  Job Overview:

  The Principal Engineer, AI Retrieval & Knowledge Platform
  will design and build core AI knowledge infrastructure that
  powers intelligent applications across the enterprise.

  This role focuses on distributed systems, retrieval
  architectures, and AI platform services, enabling
  applications and agents to discover, retrieve, and reason
  over large-scale enterprise data. You will work at the
  intersection of search, vector retrieval, LLMs, and real-
  time data systems, building high-performance platforms used
  by AI and application teams.

  The ideal candidate is a strong backend/platform engineer
  with deep experience in building scalable systems and modern
  AI-powered retrieval architectures.

  Responsibilities:

  AI Retrieval & Search Platform

  - Design and build high-scale retrieval systems combining
    keyword search, semantic search, and vector-based
    retrieval.
  - Develop RAG (Retrieval-Augmented Generation) infrastructure
    including indexing, retrieval, ranking, and context
    assembly.
  - Build and optimize search indices, vector stores, and hybrid
    retrieval systems for relevance, latency, and scale.
  - Implement advanced ranking, relevance tuning, and
    personalization pipelines.

  Data Pipelines & Indexing Systems

  - Build streaming and batch pipelines for ingesting and
    transforming structured and unstructured data.
  - Develop enrichment pipelines (chunking, embeddings, metadata
    extraction, classification).
  - Design systems for real-time indexing, incremental updates,
    and freshness guarantees.
  - Optimize data flow, storage, and compute efficiency at
    scale.

  AI Platform Services & APIs

  - Build low-latency, highly available APIs that expose
    retrieval and knowledge services to applications and AI
    agents.
  - Develop reusable SDKs and service abstractions for easy
    integration into product teams.
  - Enable context retrieval, query understanding, and response
    augmentation for downstream AI systems.
  - Establish patterns for multi-tenant, scalable platform
    services.

  LLM & Intelligent Systems Integration

  - Integrate LLMs with retrieval systems to enable grounded,
    context-aware experiences.
  - Build systems for context construction, prompt augmentation,
    and response orchestration.
  - Implement evaluation frameworks for relevance, grounding
    quality, and user experience.
  - Support use cases like AI assistants, copilots, search
    experiences, and automation agents.

  Performance, Scalability & Reliability

  - Design for low-latency (<100ms retrieval), high-throughput,
    and horizontal scalability.
  - Implement caching, sharding, and distributed query execution
    strategies.
  - Build observability pipelines (metrics, logs, tracing) for
    system performance and usage insights.
  - Drive resiliency, fault tolerance, and system reliability at
    scale.

  Technical Leadership

  - Lead design and architecture of large-scale AI platform
    components.
  - Mentor engineers on distributed systems, retrieval
    architectures, and AI engineering practices.
  - Drive adoption of modern engineering practices (CI/CD,
    infrastructure-as-code, automated testing).
  - Partner with AI, data, and product teams to shape next-gen
    intelligent platform capabilities.

  What are we looking for?

  We’re looking for strong collaborators who deliver
  exceptional client experiences and thrive in fast-paced,
  team-oriented environments. Our ideal candidates pursue
  greatness, act with integrity, and are driven to help our
  clients succeed. We value those who embrace creativity,
  continuous improvement, and contribute to a culture where we
  win together and create and share joy in our work.

  Requirements:

  - Minimum of 8 years building large-scale backend, platform,
    or distributed systems.
  - Hands-on experience building search platforms, retrieval
    systems, indexing pipelines, knowledge systems, or
    recommendation platforms.
  - Strong knowledge of APIs, microservices, Kubernetes,
    containers, CI/CD, and distributed data
    processing.Experience programming skills in Java, Python,
    or Go.
  - Experience building enterprise platforms in highly regulated
    environments such as:Wealth ManagementBrokerage / Broker-
    DealerBankingCapital MarketsInsuranceFinTechHealthcare
    - Wealth Management
    - Brokerage / Broker-Dealer
    - Banking
    - Capital Markets
    - Insurance
    - FinTech
    - Healthcare

  Core Competencies:

  - RAG (Retrieval Augmented Generation)
  - Semantic Search
  - Vector Databases
  - Embeddings
  - LLM Integration Patterns
  - Knowledge Graphs
  - Real-Time Data Platforms
  - Kafka / Streaming Systems
  - Observability and Monitoring
  - Platform APIs
  - Event-Driven Architecture
  - Multi-Tenant Platform Design

  Preferences:

  - Experience building AI platforms, copilots, or agent-based
    systems.
  - Experience with cloud platforms and containerized
    environments (Kubernetes).
  - Experience with Elasticsearch/OpenSearch, vector databases,
    or hybrid retrieval architectures.
  - Familiarity with RAG systems, embeddings, and LLM
    integration patterns.
  - Experience with real-time data systems (Kafka, streaming
    pipelines).
  - Strong understanding of performance optimization in
    distributed systems.
  - Financial Services, Wealth Management, Brokerage, or Advisor
    Technology experience.



