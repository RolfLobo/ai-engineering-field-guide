description: |
  POSITION OVERVIEW

  MCI is one of the fastest-growing tech-enabled business
  services companies in the USA, with a strong call center
  footprint and operations that extend across multiple
  countries. We deliver Customer Experience (CX), Business
  Process Outsourcing (BPO), and Anything-as-a-Service (XaaS)
  cloud technology solutions across a wide range of
  industries, including healthcare, retail, government,
  education, telecom, technology e-commerce, and financial
  services. Our contact centers are powered by both on-site
  and remote agents, leveraging advanced technologies to
  enhance customer journeys, drive scalability and reduce
  costs.

  At MCI we are committed to fostering an environment where
  professionals can build meaningful careers, access
  continuous learning and development opportunities and
  contribute to the success of a globally expanding, industry-
  leading organization.

  We are seeking a creative, analytical, and detail-oriented
  Prompt Engineer to design, test, and refine prompts that
  enable Generative AI systems to generate accurate, relevant,
  and high-quality outputs. This role focuses on helping AI
  models understand user intent and perform effectively across
  a variety of business use cases, including customer support,
  content generation, workflow automation, knowledge
  management, and productivity solutions.

  The successful candidate will work closely with AI
  Engineers, Product Teams, Data Scientists, and Senior Prompt
  Engineers to improve AI interactions and support the
  development of innovative AI-powered products and services.

  This role is ideal for someone who is passionate about
  Generative AI, enjoys experimentation and problem-solving,
  and wants to build expertise in one of the fastest-growing
  areas of technology.

  To be considered for this role, you must complete a full
  application on our company careers page, including all
  screening questions and a brief pre-employment test.

  POSITION RESPONSIBILITIES

  Key Responsibilities:

  Prompt Development & Testing

  - Design and refine prompts that improve AI-generated outputs.
  - Create prompts for a variety of business and customer-facing
    use cases.
  - Develop prompt templates and reusable prompting structures.
  - Test prompt variations and evaluate performance outcomes.
  - Refine prompts to improve accuracy, relevance, and
    consistency.

  AI Output Evaluation

  - Assess AI responses and identify opportunities for
    improvement.
  - Review AI-generated content against quality standards.
  - Evaluate outputs for accuracy, usefulness, tone, and
    alignment with user requirements.
  - Identify recurring issues and recommend prompt enhancements.
  - Document findings and optimization opportunities.

  Collaboration & Support

  - Work with technical and business teams to support AI
    initiatives.
  - Collaborate with AI Engineers, Product Managers, and
    Business Stakeholders.
  - Assist in translating business requirements into prompting
    solutions.
  - Support AI testing and implementation activities.
  - Contribute to prompt optimization projects and initiatives.

  Documentation & Knowledge Management

  - Maintain prompting resources and documentation.
  - Create and update prompt documentation and libraries.
  - Document prompt testing results and lessons learned.
  - Support the development of prompting guidelines and
    standards.
  - Assist with knowledge-sharing initiatives across teams.

  Research & Continuous Learning

  - Stay informed about developments in AI and prompting
    techniques.
  - Research emerging prompting methodologies and best
    practices.
  - Explore new AI tools, models, and capabilities.
  - Participate in experimentation and learning activities.
  - Contribute ideas for improving AI performance and user
    experiences.

  CANDIDATE QUALIFICATIONS

  WONDER IF YOU ARE A GOOD FIT FOR THIS POSITION?

  All positive, and driven applicants are encouraged to apply.
  The Ideal candidates for this position are highly motivated
  and dedicated and should possess the below qualities:

  - Bachelor's Degree in Computer Science, Data Analytics,
    Information Technology, Artificial Intelligence, Data
    Science, Linguistics, Communications, Psychology,
    Cognitive Science, or a related field.
  - Minimum 3 years of experience in AI, content optimization,
    research, analytics, quality assurance, technology, or a
    related field.
  - Interest in and understanding of Large Language Models
    (LLMs) and Generative AI technologies.
  - Familiarity with prompt engineering concepts and AI model
    interactions.
  - Strong analytical and problem-solving abilities.
  - Excellent written and verbal communication skills.
  - Ability to evaluate content and identify improvement
    opportunities.
  - Strong attention to detail and commitment to quality.
  - Experience creating documentation, reports, or structured
    content.
  - Basic knowledge of Natural Language Processing (NLP)
    concepts.
  - Basic programming knowledge in Python, JavaScript, SQL, or
    similar technologies is advantageous.
  - Ability to work independently while collaborating
    effectively within a team environment.
  - Strong organizational and time-management skills.
  - Curiosity and willingness to learn new technologies and
    methodologies.

  Nice to Have

  - Experience using OpenAI GPT, Anthropic Claude, Google
    Gemini, or similar AI platforms.
  - Exposure to prompt testing, AI evaluation, or chatbot
    development.
  - Familiarity with Retrieval-Augmented Generation (RAG)
    concepts.
  - Knowledge of conversational AI or virtual assistant
    technologies.
  - Experience working with content creation, research, or
    customer experience initiatives.
  - Understanding of AI governance and responsible AI
    principles.
  - Exposure to workflow automation or AI-powered productivity
    tools.
  - Experience within technology, SaaS, or BPO environments.

  PHYSICAL REQUIREMENTS

  This job operates in a professional office environment.
  While performing the duties of this job, the employee will
  be largely sedentary and will be required to sit/stand for
  long periods while using a computer and telephone headset.
  The employee will be regularly required to operate a
  computer and other office equipment, including a phone,
  copier, and printer. The employee may occasionally be
  required to move about the office to accomplish tasks; reach
  in any direction; raise or lower objects, move objects from
  place to place, hold onto objects, and move or exert force
  up to forty (40) pounds.

  CONDITIONS OF EMPLOYMENT

  All MCI Locations

  - Must be authorized to work in the country where the job is
    based.

  Subject to the program and location of the position

  - Must be willing to submit up to a LEVEL II background and/or
    security investigation with a fingerprint.  Job offers are
    contingent on background/security investigation results.
  - Must be willing to submit to drug screening.  Job offers are
    contingent on drug screening results. (Does not apply in
    Canada)

