description: |
  At Precisely, we're not just building software — we're
  shaping the future of data integrity. As a global leader in
  data quality, data enrichment, and location intelligence,
  Precisely helps thousands of the world's most trusted brands
  make confident decisions with data they can rely on. We're
  an AI-first organization, which means artificial
  intelligence isn't a buzzword here — it's woven into how we
  build products, how we work, and how we think about solving
  complex problems for our customers. When you join Precisely,
  you join a team of curious, driven innovators who believe
  that better data makes the world run better. If you're ready
  to do meaningful work at the intersection of AI and data —
  and help define what's possible — we'd love for you to
  apply!

  This position is 100% remote anywhere in the US

  Overview:

  We are seeking a passionate Associate Python Developer (AI)
  to join our engineering team building scalable Python
  applications. This opportunity is ideal for a candidate
  eager to learn, contribute, and grow in a collaborative,
  fast-paced environment. You will work under the guidance of
  experienced developers, participate in real projects, and
  develop your skills with modern Python tools and practices.

  What you will do:

  - Assist in designing, developing, and maintaining Python-
    based AI applications.
  - Work with team members to understand requirements and
    implement features.
  - Learn to use Pydantic for defining and validating data
    models.
  - Write clean, well-documented code with guidance.
  - Participate in code reviews and incorporate feedback.
  - Help troubleshoot and resolve basic technical issues.
  - Support testing and CI/CD processes.

  What we are looking for:

  - Bachelor’s degree in Computer Science, Engineering, or a
    related technical field, or similar.
  - At least 1 years experience building enterprise level
    software.
  - Good knowledge of Python programming.
  - Experience with TypeScript, JavaScript, or Node.js is a
    plus.
  - Eagerness to learn about the Python ecosystem, frameworks,
    and libraries.
  - Knowledge of object-oriented programming and REST APIs.
  - Strong problem-solving and communication skills.
  - Willingness to take initiative and accept feedback.
  - Ability to work effectively in a team and follow
    instructions.

  AI Skills/Knowledge:

  - Knowledge of large language models (LLMs) and AI coding
    harnesses such as Claude Code or GitHub Copilot.

  Preferred Skills (a plus but not required):

  - Exposure to version control (Git) and testing concepts.
  - Exposure to backend development or data engineering
    concepts.
  - Familiarity with cloud platforms (AWS, GCP, or Azure).

