description: |
  Make an impact with NTT DATA Join a company that is pushing
  the boundaries of what is possible. We are renowned for our
  technical excellence and leading innovations, and for making
  a difference to our clients and society. Our workplace
  embraces diversity and inclusion – it’s a place where you
  can grow, belong and thrive.

  About the Role

  We are seeking an experienced ServiceNow Developer to
  design, build, and implement solutions on ServiceNow AI
  Control Tower (AICT) — our enterprise platform for
  governing, securing, and managing AI agents, models, and
  workflows across the organization. You'll work at the
  intersection of platform development, AI governance, and
  enterprise architecture, helping us discover, govern, and
  scale AI initiatives responsibly.

  Responsibilities

  - Design, configure, and extend ServiceNow AI Control Tower to
    support enterprise-wide AI governance and lifecycle
    management
  - Build and maintain custom AI agents, skills, flow actions,
    and subflows using the Now Assist Skill Kit and Build
    Agent
  - Develop and maintain integrations with third-party AI
    platforms (e.g., AWS Bedrock, Azure AI Foundry, GCP Vertex
    AI, Copilot Studio) via the Service Graph Connector
    framework
  - Manage CMDB and CSDM data models to ensure accurate tracking
    of AI assets as configuration items
  - Configure and troubleshoot plugin activation sequences,
    scopes, dependencies, and access controls
  - Collaborate with AI Stewards, Risk & Compliance Managers,
    and Platform Administrators to implement risk assessments,
    compliance frameworks, and governance policies
  - Monitor and support AI Agent Fabric protocols (MCP, A2A) for
    secure cross-agent communication
  - Manage the full AI asset lifecycle from intake and
    assessment through deployment and retirement
  - Write clean, maintainable scripts and workflows (business
    rules, script includes, client scripts, Flow Designer,
    IntegrationHub)
  - Support version control, rollback, and quality assurance
    processes for custom AI skills

  Required Qualifications

  - 5+ years of ServiceNow development experience, including
    scripting and Studio/App Engine
  - Strong working knowledge of CMDB and CSDM, including CI
    classes, relationships, and data health management
  - Experience with Flow Designer, IntegrationHub, and Service
    Graph Connectors
  - Hands-on experience with ACLs, role design, and persona-
    based access control
  - Experience with plugin/scope management, including
    activation sequencing and dependency mapping
  - Understanding of AI/agentic concepts: AI agents, LLMs,
    skills, and orchestration frameworks
  - Familiarity with Now Assist Skill Kit and/or Build Agent for
    creating custom skills and agents
  - Strong analytical and troubleshooting skills across complex,
    multi-system integrations
  - Excellent communication skills, with the ability to work
    cross-functionally with governance, risk, security, and
    compliance stakeholders

  Preferred Qualifications

  - Direct experience implementing or administering ServiceNow
    AI Control Tower (AICT)
  - Knowledge of AI governance, risk, and compliance (IRM/GRC)
    concepts
  - Familiarity with AI Agent Fabric protocols (MCP, A2A)
  - Experience integrating with third-party AI/ML platforms
    (Azure OpenAI, AWS Bedrock, GCP Vertex AI, etc.)
  - ServiceNow certifications (e.g., Certified System
    Administrator, Certified Application Developer, Certified
    Implementation Specialist)
  - Completion of ServiceNow's AI Control Tower Implementation
    Bootcamp or equivalent training

  Workplace type:

  Remote Working

