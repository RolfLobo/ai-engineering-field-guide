description: |
  Who We Are; What We Do; Where We’re Going



  Magnet Forensics is a global leader in the development of
  digital investigative software that acquires, analyzes, and
  shares evidence from computers, smartphones, tablets, and
  IoT-related devices. We are continually innovating so our
  customers can deploy advanced and effective tools to protect
  their companies, communities, and countries.



  Serving thousands of customers globally, our solutions are
  playing a crucial role in modernizing digital
  investigations, helping investigators fight crime, protect
  assets, and guard national security.



  With employees based around the world, Magnet Forensics has
  been expanding our global presence. As a part of Magnet
  Forensics, you can expect to make a difference in the world,
  no matter what role you play. You’ll be supported through
  learning and development, not to mention an incredible team
  with unbelievable talent and integrity.



  If you think you would be the right person to join our team
  working towards this goal, we would love to hear from you!

  Role Overview

  The AI & Automation Engineer helps teams work smarter by
  identifying opportunities to automate manual processes and
  apply AI where it can add meaningful value. Working across
  Business Applications, Data & Analytics, and IT, you will
  build practical solutions that simplify work, improve
  efficiency, and support business outcomes.

  This role reports to the VP of Business Systems.

  Please note: This role requires hands-on coding experience,
  and candidates should be prepared to demonstrate their
  technical skills during the interview process.

  What You'll Do

  What We're Looking For

  - 4+ years of experience designing and delivering automation,
    integration, or AI-enabled solutions in a business or
    enterprise environment.
  - Experience applying AI to business workflows using platforms
    such as Claude, Copilot, Gemini, or similar tools, with
    the ability to evaluate where AI adds value and an
    understanding of risks related to accuracy, data handling,
    and appropriate use.
  - Hands-on experience with automation platforms, enterprise
    business systems (e.g., Salesforce, NetSuite, Jira Service
    Management, Microsoft 365), APIs, integrations, and at
    least one scripting or programming language (Python,
    PowerShell, JavaScript/TypeScript, C#, or Bash ), along
    with working knowledge of SQL and structured data formats
    such as JSON and YAML.
  - Strong process analysis skills, with the ability to identify
    opportunities for automation, simplification, and
    operational improvement.
  - Experience testing, deploying, documenting, and supporting
    solutions in a production environment.
  - Ability to communicate effectively with both technical and
    non-technical stakeholders and translate business needs
    into practical solutions.
  - Strong problem-solving skills and the ability to manage
    multiple priorities independently.

  Compensation & Benefits

  The Compensation Range is for the primary location for which
  the job is posted. Please note that the actual compensation
  may vary depending on location and job-related factors such
  as qualifications, experience, knowledge and skills. If you
  are applying for this role outside of the primary location
  and you are selected for an interview, the Talent
  Acquisition Partner can share more information with you. If
  the compensation structure for the role includes an
  incentive component (i.e. most Sales roles) the range below
  represents total target compensation (TTC) (base salary +
  variable).



  $80,000 to $95,000 (USD) a year



  Salary range (min - max)



  Position Type: Current Vacancy

  Magnet is proud to offer benefits such as:



  - Generous time off policies

  - Competitive compensation

  - Volunteer opportunities

  - Reward and recognition programs

  - Employee committees & resource groups

  - Healthcare and retirement benefits



  Indicators of Success



  We’re looking for someone who checks off most, but not all,
  of the boxes listed in “skills and experiences”.  It’s more
  important to us to find candidates who can display
  indicators of success through skills they have developed and
  experiences they have been a part of, than to find folks who
  have “been there, done that”.  We want to be part of your
  development journey, and we’ll learn as much from you as you
  learn from us.



  How We Work



  At Magnet Forensics, we take a hybrid-flexible approach to
  support your productivity and work-life balance. If you’re
  within a comfortable travel distance to one of our offices,
  you’ll occasionally join us in person. How often you’ll come
  in depends on your department and team needs, typically
  ranging from weekly to monthly. These in-person moments help
  us build stronger connections, spark new ideas, and
  celebrate our successes together. Most days, you can choose
  what works best for you, while staying in tune with your
  team’s goals.



  We’re excited to welcome you to our team and look forward to
  achieving great things together - both in the office and
  wherever you work best!



  The Most Important Thing



  We’re looking for candidates that can provide examples of
  how they have demonstrated Magnet CODE in their previous
  experiences:



  CARE – We care about each other and our mission to make a
  difference in the world.

  OWN – We are accountable for our results – while never
  forgetting to act with integrity, empathy, and respect.

  DEDICATE – We put our heart and soul into meeting the needs
  of our customers and helping them serve the people they
  protect.

  EVOLVE – We are constantly innovating and exploring new ways
  to work together to make an impact with our work.



  Here at Magnet Forensics, we are committed to continuous
  learning and are focused on building a diverse and inclusive
  workforce. This commitment will be reflected in our hiring
  processes and embedded in our values and how we treat one
  another. If you’re interested in this role, but do not meet
  all of the qualifications listed above, we encourage you to
  apply anyways.



