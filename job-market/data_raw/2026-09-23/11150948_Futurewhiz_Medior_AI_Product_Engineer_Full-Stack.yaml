description: |
  📍 Amsterdam - Hybrid (minimum 50% at the office)

  ⏱️ 36-40 hours per week

  💰 €3,800–€4,800 gross per month, based on 40 hours and
  depending on experience

  🌍 Futurewhiz is a B Corp

  Just a small heads-up regarding logistics: we aren't able to
  offer visa sponsorship for this role, so we can only
  consider candidates who already hold a valid work permit for
  the Netherlands or the EU.

  Generative AI can create textbook content in seconds.
  Producing content that is accurate, curriculum-aligned,
  editable and trusted by authors and editors, and doing so
  reliably at scale, is much harder. That is the challenge you
  will help us solve.

  Futurewhiz is looking for a Medior AI Product Engineer to
  build practical AI-powered tools for educational content
  creation. You will turn promising experiments into
  dependable software that people can use in real publishing
  workflows. This is primarily a software engineering role,
  but not one where you wait for fully specified tickets: you
  will help investigate problems, shape solutions, test ideas
  and decide what is worth building.

  You do not need to be an expert in every part of the stack.
  You do need enough practical experience to own and ship
  software with a good degree of independence, plus the
  curiosity to use AI tools thoughtfully when working beyond
  the edges of your existing expertise.

  🏰 About Futurewhiz

  For nearly 15 years, Futurewhiz has been the market leader
  in EdTech in the Netherlands. Our brands – including Squla
  and StudyGo – help children and teenagers aged 3 to 18 learn
  and grow at their own level and pace. Our mission is clear:
  "Empowering every child to grow." We’ve been a certified B
  Corp since 2020, which means we strive for a strong balance
  between purpose and profit.

  🎮 Your role as Medior AI Product Engineer

  You will join the Futurewhiz Content Automation team and
  work closely with software engineers, editorial specialists
  and colleagues at a major educational publisher. Together,
  you will improve the workflows used to create and maintain
  high-quality learning materials, including textbooks and
  digital content.

  Each cross-functional team focuses on a particular part of
  the publishing workflow. The team studies where time,
  quality or cost is being lost; tests possible improvements
  with users; and builds the solutions that show the most
  promise. Once the best opportunities in one area have been
  addressed, the team may move to another part of the
  workflow.

  Your editorial colleague will lead much of the specialist
  research, such as interviewing authors and editors, testing
  editorial concepts and mapping publishing workflows. You
  will participate where technical understanding or rapid
  prototyping is valuable, but your primary responsibility is
  to design, build and operate the software.

  Specifically, you will:

  - Build and own AI-assisted applications from early prototype
    through to reliable production use
  - Develop across the stack: Python services and APIs, data
    flows, user-facing interfaces and the infrastructure
    needed to run them
  - Build and improve LLM and agent-based workflows, including
    prompts, evaluations, feedback loops and safeguards
  - Turn findings from editorial research and user testing into
    practical technical approaches
  - Create small experiments to resolve uncertainty before
    committing to larger builds
  - Integrate new tools into existing publishing systems and
    contribute reusable components to our content-automation
    platform
  - Use AI coding tools as part of your everyday work while
    reviewing, testing and taking responsibility for the
    resulting software
  - Deploy, monitor and troubleshoot what you build, balancing
    quality, reliability, speed and cost
  - Contribute to architecture, CI/CD, security, code quality
    and technical decision-making within the team
  - Travel to Groningen for one or two days approximately once
    every two months to work with colleagues there

  There is no separate team waiting to take over UX,
  infrastructure or operations. You will have support from
  experienced colleagues, but the product team owns its
  solutions end to end and deliberately keeps them as simple
  as possible.

  🌟 What success looks like

  In your first three months, we would expect you to:

  - Understand the users, workflow and technical environment in
    your initial problem area
  - Ship a useful prototype or product improvement and evaluate
    it with real users
  - Take ownership of a defined part of the product, including
    its deployment and operation
  - Build productive working relationships with both technical
    and publishing colleagues

  As you become established, success means being able to take
  a validated idea from prototype to dependable everyday use
  with increasing independence. The clearest measure of your
  work will be whether the tools you build help the team
  generate high-quality educational content more reliably,
  quickly or efficiently.

  🔥 Who are you?

  We care more about what you can own and build than about a
  particular number of years. This role could suit an early-
  career or medior engineer who has already shipped real
  software and is ready for meaningful independence. It is not
  a traineeship, and we do not expect to provide step-by-step
  technical direction.

  You are likely to thrive here if you:

  - Have hands-on experience building and shipping web
    applications or software products
  - Are confident with Python and comfortable moving between
    backend, frontend and infrastructure work
  - Use AI tools actively and critically to develop faster,
    learn unfamiliar areas and improve your work
  - Are interested in LLM-powered products and have experimented
    with model APIs, agent workflows or similar technology
  - Think like a product builder: you clarify the problem,
    suggest options and test assumptions rather than waiting
    for a detailed specification
  - Can move quickly when exploring an idea and apply sound
    engineering judgement when it is time to make the solution
    durable
  - Can independently own a well-defined problem while
    recognising when input from colleagues will improve the
    outcome
  - Enjoy collaborating with non-technical specialists and can
    explain technical choices in plain language
  - Stay pragmatic and constructive when priorities are
    uncertain or several stakeholders have different views
  - Have an affinity for education and want your work to improve
    how learning materials are made

  Experience with React or TypeScript, cloud infrastructure,
  containers, CI/CD, LLM evaluation, data analysis or applied
  machine learning would be useful, but none is an absolute
  requirement. Experience in education, publishing or content
  systems is welcome but not expected.

  💰What do we offer?

  - A gross monthly salary of €3,800–€4,800, based on 40 hours
    and depending on experience
  - 24 vacation days + 3 assigned days off + 1 skipping school
    day
  - Collective pension and health insurance
  - A €600 annual learning budget for your professional
    development
  - Unlimited access to external coaches through Inuka Coaching
  - Unlimited access to Goodhabitz training programs for
    professional and personal growth

  Additionally:

  - Lifetime access to StudyGo and Squla accounts
  - Office next to Bijlmer Arena station (with the possibility
    of getting a Swapfiets or an OV business card if you live
    over 7km from the office)
  - A MacBook for work
  - Payroll Giving option to contribute to a good cause
  - Healthy lunches at the office, unlimited good coffee, fresh
    fruit, and snacks
  - A Culture Crew that organizes fun activities like outings,
    pub quizzes, ski trips, and laser tag

  😻 Who are we?

  We are a passionate and diverse team united by a shared
  mission: helping children thrive in their learning journey
  and empowering them to grow through personalised education.

  Our culture is welcoming and authentic. We believe people do
  their best work when they can be themselves, and we actively
  value different backgrounds, ideas, experiences and
  perspectives. This diversity helps us serve young learners
  more effectively, regardless of who they are.

  Our platforms are for everyone, and the same applies to our
  workplace. Everyone is welcome on this journey.

  🤖 How we work with AI

  At Futurewhiz, AI is not a side project. We use it
  throughout our work to move faster, explore more
  possibilities and improve the support we provide to
  children, parents, teachers, authors and editors.

  For this role, being AI-native means more than using ChatGPT
  occasionally. It means knowing how to collaborate
  effectively with AI tools, verify their output, protect
  sensitive information and remain accountable for the quality
  of what you ship.

  Do you have any questions about AI and our use of it in the
  recruitment process? Send us a message to
  recruitment@futurewhiz.com

  Will you be our new Medior AI Product Engineer?

  We would love to hear from you even if you do not check
  every box. If the challenge excites you and you have
  evidence that you can build and own useful software, be
  yourself and go for it.

  Upload your CV and a short motivation through the
  application button. In your motivation, we would especially
  like to hear about one product, prototype or tool you helped
  build: what problem it addressed, what you personally owned
  and how you knew it was useful.

  Applicants must already have the right to work in the
  Netherlands. We are unable to provide visa sponsorship or
  relocation support for this vacancy.
