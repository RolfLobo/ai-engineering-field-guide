description: |
  AI Systems Researcher / Research Engineer

  London (Preferred) - Hybrid, or Remote in North America, EU,
  UK

  About Brave

  Brave is on a mission to protect the human right to privacy
  online. We’ve built a free web browser that blocks creepy
  ads and trackers by default, a private search engine with a
  truly independent index, private AI assistant, latest
  privacy and security features, and a private ad network
  (opt-in!) that directly rewards you for your attention.
  Already over 120 million people regularly use Brave for a
  faster, more private web. Millions more switch every month.

  The internet is a sea of ads, hackers, and echo chambers.
  Big Tech makes huge profits off our data, and tells us
  what’s true and what’s not. Brave is fighting back. Join us!

  Summary

  Join us at Brave as we redefine the future of online
  experiences with a range of cutting-edge, top-performing
  products. We’re seeking an experienced AI Systems and
  Performance Researcher/Engineer to shape and improve our
  performance evaluations and optimizations across desktop and
  mobile. If you’re passionate about innovation, privacy, and
  delivering impactful AI solutions, this is your opportunity
  to make a difference. We need you to help with a wide range
  of key products, ranging from our browser ML models, novel
  applications, on-device AI agents, performance evaluations,
  and collaborating closely with privacy and security
  researchers to protect the users from AI risks.

  About you

  An ideal candidate will have a mix of skills that include
  the following:

  - Demonstrates a high level of initiative and consistently
    delivers high-quality solutions
  - Has an enquiring mind and a disciplined scientific approach
    to extracting facts and understanding observed behavior
  - Is excited by the potential of realizing high-value
    commercial outcomes and change the way that the
    advertising business operates
  - Want to be part of a high-growth startup company with global
    ambitions
  - Experience with software development practices (Python, C++,
    JavaScript and/or Rust)
  - Has a proven track record implementing data driven products
    and a broad understanding of the state of the art in
    systems and networks
  - Comfortable working in an open-source setting
  - Able to create and deploy mobile/desktop applications and
    systems
  - Has a passion for helping protect users’ privacy and
    security
  - A Ph.D. in computer science is highly preferred, but we may
    consider some exceptions with industry experience

  Specific Skills

  - Background and/or previous work in AI systems research and
    performance evaluation.
  - Expertise in optimizing and evaluating ML models and/or
    privacy & security technologies for on-device performance.
  - Experience with modern Machine Learning (ML) frameworks
    (e.g., Pytorch, TensorFlow, MLX, ONNX Runtime, Core ML,
    TensorRT, etc.).

  Skills That Will Set You Apart from the Competition

  - ML Systems (pipelines, performance evaluation, etc.)
  - Open source projects on mobile/desktop systems optimization
  - Experience with confidential computing and security/privacy
    protocols
  - Ph.D. in computer science from a top-tier school
  - A strong publication record in premier systems, performance,
    or ML
  - Work experience in industry is desirable

  Working at Brave - What we offer

  - Ability to work at an exciting and well-funded international
    startup headquartered in San Francisco
  - Cutting-edge technology, allowing you to work with state-of-
    the-art tools and software solutions
  - Competitive compensation and plenty of room for personal
    growth
  - Great international exposure and team atmosphere

  We are looking to hire in London but would consider an
  exceptional candidate in the rest of Europe.

  NO AGENCIES or RECRUITERS PLEASE - Unfortunately, we cannot
  work with third parties on these searches.
