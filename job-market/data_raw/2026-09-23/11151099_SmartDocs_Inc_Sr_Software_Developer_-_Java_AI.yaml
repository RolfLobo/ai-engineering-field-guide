description: |
  SmartDocs Business Solutions

  Job Title: Software Developer – Java & AI Experience: 3–6
  Years | Full-time | Product Engineering Team

  About SmartDocs Business Solutions

  SmartDocs Business Solutions is a product-first technology
  company where creativity, collaboration, and continuous
  learning are built into the culture. We build innovative,
  scalable software products and actively integrate AI into
  real-world workflows — giving developers the opportunity to
  work at the intersection of modern engineering and emerging
  intelligence.

  Role Overview

  We are looking for a highly skilled Software Developer to
  join our product engineering team. You will design and
  deliver scalable Java applications, integrate AI
  capabilities into our products, and use next-generation
  tools like Claude Code and Lovable as part of your daily
  development workflow.

  What You'll Do

  - Design, develop, and deploy scalable, high-performance Java
    applications across the full SDLC — from requirements to
    production
  - Build with Core Java, Spring, and Spring Boot; develop and
    maintain microservices and RESTful APIs
  - Integrate AI capabilities into applications — including AI
    APIs (OpenAI, Claude, etc.), automation pipelines, and
    intelligent feature development
  - Use Claude Code for AI-assisted development workflows, code
    review, and rapid feature iteration
  - Use Lovable to rapidly prototype and ship frontend UI
    components and product interfaces
  - Collaborate with product, QA, and support teams through the
    full development lifecycle
  - Troubleshoot, debug, and continuously improve existing
    systems and codebases
  - Mentor junior developers and contribute to team best
    practices and engineering culture
  - Communicate clearly with both technical and non-technical
    stakeholders

  Core Tech Stack

  Java & Backend: Java, Advanced Java / J2EE, Spring, Spring
  Boot, Microservices, JSP, RESTful APIs

  Frontend & Web: HTML, CSS, JavaScript, XML, Lovable (UI
  prototyping)

  Databases & Infrastructure: MongoDB, SQL / NoSQL Databases,
  Linux Environments

  AI Tools & Integrations: Claude Code, Lovable, OpenAI APIs,
  AI/ML Frameworks, Automation Tools, Data-driven Models

  You'll Thrive Here If You Have

  - Strong Java fundamentals — deep expertise in full-stack
    development with hands-on Spring / Spring Boot experience
    and a passion for writing clean, maintainable code
  - AI fluency — experience integrating AI tools or APIs into
    real applications, and comfort using Claude Code and
    Lovable in daily development workflows
  - Clear communication — ability to articulate technical
    concepts to non-technical stakeholders and collaborate
    effectively across cross-functional product teams
  - Ownership mindset — high accountability, a bias toward
    action, and prior experience mentoring engineers or
    leading small teams in a product-based environment

  Qualifications

  - Bachelor's or Master's degree in Computer Science, IT, MCA,
    or a related engineering field
  - 3–6 years of professional software development experience,
    ideally in a product-based company
  - Demonstrated ability to design and deliver production-grade
    Java applications
  - Hands-on experience or working knowledge of AI tools, APIs,
    or frameworks

  Why SmartDocs

  - Innovative Products — work on real-world AI-integrated
    products using modern technology stacks
  - Career Growth — continuous learning culture with clear paths
    to seniority and leadership
  - AI-First Workflows — use tools like Claude Code and Lovable
    as part of your everyday development
  - Inclusive Culture — collaborative, diverse, and
    psychologically safe team environment

  Equal Opportunity Statement

  SmartDocs is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees, regardless of race, caste,
  religion, gender, age, nationality, or disability.
