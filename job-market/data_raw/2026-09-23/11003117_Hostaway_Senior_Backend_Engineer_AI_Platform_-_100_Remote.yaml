description: |
  NOTE: This is a FULLY remote role, but the candidate must be
  within EMEA to collaborate with their team, peers, and
  internal customers. You do not have to be in the specific
  country or city shown in this listing, but please only apply
  if you are physically based within EMEA.

  Trusted by 20,000+ property managers worldwide, Hostaway is
  an industry leading, AI-powered vacation rental management
  platform designed for professional short-term rental
  operators. Hostaway brings everything together for greater
  efficiency and faster growth.

  Profitable, high-growth, and the first short-term rental
  Property Management System unicorn 🦄. Join us at our most
  exciting stage yet! Learn more about our recent valuation
  and story here.

  About the role

  As a Senior Backend Engineer on our AI Team, you’ll focus on
  integrating AI services into Hostaway’s product. You’ll turn
  raw data and models into polished, customer-facing features
  by working in Python, building APIs, services, and UIs
  together with the Frontend engineers that make AI useful for
  property managers and guests.

  You’ll work closely with product and platform teams to
  ensure AI components slot seamlessly into our SaaS ecosystem
  - from automation workflows to customer insights dashboards.

  What you’ll do:

  - Design and build services that integrate AI into customer-
    facing features.
  - Develop performant and scalable APIs and backend services
    that connect AI outputs to SaaS functionality.
  - Collaborate with product and design teams to create
    intuitive AI-driven user experiences.
  - Partner with platform and integration teams to embed AI into
    existing systems and workflows.
  - Implement observability, monitoring, and error handling for
    AI services in production.
  - Contribute to evolving our AI integration stack (Python
    SDKs, MCP servers, LLM orchestration).

  - 5+ years in backend engineering, ideally SaaS.
  - Strong Python proficiency
  - Experience with REST APIs and SaaS integrations.
  - Familiarity with LLM/AI tools (LangChain, Vercel AI SDK, MCP
    servers).

  - Comfortable working alongside Python-based AI services and
    bridging stacks.
  - Nice to have: experience with PHP + Golang
  - Strong collaboration skills - able to integrate work with
    platform and product teams.

  What success looks like:

  - AI-powered features are seamlessly embedded into Hostaway’s
    SaaS product.
  - Customer workflows feel smarter, faster, and more
    personalized thanks to your integrations.
  - AI services are stable, observable, and easy to maintain.
  - You become a go-to engineer for AI product integration
    across Hostaway.

  What we offer

  - Competitive Compensation: We offer competitive pay based on
    market rates in the country of the applicant.
  - 100% Remote: Enjoy the freedom to work from anywhere within
    your country of residence—be it a co-working space, your
    home office, or even your dining room table. The choice is
    yours. Just don’t ask to work in our office (we don’t have
    one).
  - Equity: Every role in our company comes with valuable stock
    options in a fast-growing and profitable company. This
    ensures we all share in the company’s success.
  - Values-Driven Leadership: Our Core Values are not just words
    we’ve written to make us feel good. We leverage them daily
    when making strategic and tactical decisions.
  - Professional Growth: Our rapid growth offers unparalleled
    learning and development opportunities, along with a
    multitude of career advancement opportunities.
  - Annual Paid Leave: The specific amounts vary by country and
    are aligned with country and/or contract-specific norms.
  - Geographic Specific Benefits: As an international employer,
    we offer different country-specific benefits such as
    Health Insurance and Pensions in countries where these
    perks are customary. The specifics depend on the country
    of the applicant.
  - Dynamic Team Culture: As a global company with team members
    in over 40 countries, our diverse and international
    culture fuels our innovation and creativity, providing a
    key pillar to our success (and making it a lot of fun to
    work here).

  Thank you for your interest. If you apply for this role, you
  will receive an email from our Talent Acquisition team after
  your application has been reviewed alongside the
  qualifications for this role and the qualifications of
  others who have applied.
