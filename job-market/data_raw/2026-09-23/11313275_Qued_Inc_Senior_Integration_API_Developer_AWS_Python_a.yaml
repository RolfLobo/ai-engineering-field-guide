   Senior Integration & API Developer – AWS, Python and AI
  Agents


  We are looking for a Senior Integration & API Developer to
  join our team. The ideal candidate has strong experience in
  designing and developing APIs, building system integrations,
  and integrating AI agents into enterprise applications and
  business workflows. This is a client-facing role, requiring
  excellent communication, problem-solving, and collaboration
  skills.




  Responsibilities:



  - Design and develop APIs to support integrations and business
    processes , and AI-powered applications..
  - Build and maintain integrations between internal systems and
    external platforms (e.g., Salesforce, REST APIs, third-
    party services).
  - Design and implement AI agent integrations that can interact
    with APIs, databases, enterprise applications, and
    business workflows.



  - Develop AI-powered workflows and automation using LLMs, AI
    agents, tool/function calling, and API-based integrations.
  - Work directly with clients to gather requirements and
    deliver technical solutions.
  - Deploy, monitor, and support solutions in AWS.
  - Troubleshoot, optimize, and ensure reliability of
    integrations.
  - Collaborate with cross-functional teams and mentor junior
    developers.



  Requirements:



  - 5+ years of professional development experience.
  - Strong expertise in API design, development and integration
  - Proven experience in system and API integration.
  - Hands-on experience with AWS services (API Gateway, Lambda,
    ECS, RDS, SQS or similar services).
  - Proficiency in Python.
  - Experience working with AI/LLM technologies and AI agents.
    Experience designing applications where AI agents can
    retrieve information, invoke APIs/tools, make decisions,
    and execute multi-step workflows
  - Excellent client-facing and communication skills.



  Nice to Have:



  - Salesforce integration experience.
  - Knowledge of event-driven systems (SQS, SNS).
  - Infrastructure as Code (Terraform).
