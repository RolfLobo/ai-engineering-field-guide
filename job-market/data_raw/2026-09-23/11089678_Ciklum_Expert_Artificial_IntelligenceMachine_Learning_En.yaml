description: |
  Ciklum is looking for an Expert Artificial
  Intelligence/Machine Learning Engineer to join our team
  full-time in the US. We are a custom product engineering
  company that supports both multinational organizations and
  scaling startups to solve their most complex business
  challenges. With a global team of over 4,000 highly skilled
  developers, consultants, analysts and product owners, we
  engineer technology that redefines industries and shapes the
  way people live.

  About the role: As an Expert Artificial Intelligence/Machine
  Learning Engineer, become a part of a cross-functional
  development team engineering experiences of tomorrow.

  Builds the agents, models, and integrations on the
  platform's templates — the hands that turn use cases into
  production systems.

  Responsibilities:

  - Build and ship LLM-powered agents and workflows on the paved
    path (templates, pipeline, guardrails)
  - Write and run evals for everything built; no system ships
    without passing its suite
  - Integrate with company systems and data sources; instrument
    for cost and quality telemetry
  - Pair with business users to iterate quickly inside bounded
    scopes

  Requirements:

  - 8+ years software engineering; 2.5+ building LLM
    applications in production (agents, RAG, tool use)
  - Strong Python/TypeScript; API craftsmanship; prompt and
    context engineering that survives contact with users
  - Can write LLM evals as part of building — non-negotiable
  - Ships fast without skipping guardrails

  Desirable:

  - Retrieval/IR depth (for assistant-facing work); healthcare
    data handling; cost-optimization experience

  What’s in it for you?

  - Strong community: Work alongside top professionals in a
    friendly, open-door environment
  - Growth focus: Take on large-scale projects with a global
    impact and expand your expertise
  - Tailored learning: Boost your skills with internal events
    (meetups, conferences, workshops), Udemy access, language
    courses, and company-paid certifications
  - Endless opportunities: Explore diverse domains through
    internal mobility, finding the best fit to gain hands-on
    experience with cutting-edge technologies
  - Care: Healthcare, Basic Life Insurance, Short and Long-term
    disability insurance according to the Company’s Benefit
    Plans

  About us:

  At Ciklum, we are always exploring innovations, empowering
  each other to achieve more, and engineering solutions that
  matter. With us, you’ll work with cutting-edge technologies,
  contribute to impactful projects, and be part of a One Team
  culture that values collaboration and progress. In the US,
  Ciklum is growing fast—inviting experienced professionals to
  lead digital transformation alongside Fortune 500 clients.
  Be part of a company where innovation and impact go hand in
  hand.

  Explore, empower, engineer with Ciklum!

  Interested already? We would love to get to know you! Submit
  your application. We can’t wait to see you at Ciklum.

