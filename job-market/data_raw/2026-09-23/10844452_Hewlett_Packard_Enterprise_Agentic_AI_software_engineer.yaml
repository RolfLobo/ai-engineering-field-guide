description: |
  Agentic AI software engineer



  This role has been designed as 'Hybrid' with a requirement
  that you will work on average 2 days per week from an HPE
  office.

  Who We Are:

  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.

  Job Description:



  Job Family Definition:

  Develops and programs integrated software algorithms to
  structure, analyze and leverage structured and unstructured
  data in product and systems applications. Can work with
  large scale computing frameworks, data analysis systems, and
  modeling environments. Uses machine learning and statistical
  modeling techniques to improve product/system performance,
  data management, quality, and accuracy. Formulates
  descriptive, diagnostic, predictive and prescriptive
  insights/algorithms and translates technical specifications
  into code. Applies, optimizes and scales deep learning
  technologies and algorithms to give computers the capability
  to visualize, learn and respond to complex situations.
  Documents procedures for installation and maintenance,
  completes programming, performs testing and debugging,
  defines and monitors performance metrics. Contributes to the
  success of HPE by translating customer requirements and
  industry trends into AI/ML products, solutions, and systems
  improvement projects.

  Management Level Definition:

  Contributions include applying intermediate level of subject
  matter expertise to solve common technical problems. Acts as
  an informed team member providing analysis of information
  and recommendations for appropriate action. Works
  independently within an established framework and with
  moderate supervision.

  What you will Do

  - Build the agentic harness for Routing Director's
    Conversational Interface, powered by frontier or open-
    weight LLMs, based on a Bring Your Own LLM
  - Apply your knowledge of AI agents, MCP servers/tools,
    skills, semantic retrieval, to develop the agentic
    platform
  - Deliver reliable and performant solutions while following
    safety and security standards
  - Collaborate with multi-functional teams to develop use
    cases, and implement agentic workflows to deliver these
    use cases
  - Take initiative to solve complex problems
  - Contribute to small sections of design review sessions,
    presenting your work and gathering feedback from the team
    leader
  - Partner with Product and QA team members to align feature
    delivery with release milestones

  What you need to Bring

  - Experience building agentic systems, including memory, tool
    execution, monitoring, and workflow automation
  - Proficiency in Python, along with familiarity with their
    surrounding tooling ecosystems
  - Experience designing scalable platform APIs and integrations
    that enable product teams to build and operate agentic
    applications safely and efficiently
  - Hands-on experience with OpenAI APIs, model capabilities,
    and orchestrating agentic workflows
  - Proficiency in software engineering principles and practices
    is valuable. Experience with version control systems
    (e.g., Git), software development methodologies, and
    deploying features in production environments is
    advantageous
  - Experience with Kubernetes and modern deployment strategies
  - Strong understanding of software development practices,
    including automated testing and code reviews

  Education and Experience Required:

  - Bachelor’s degree or higher in Computer Science,
    Engineering, or related technical field.
  - Typically, 2-4 years’ experience.

  Preferred

  - Prior experience working with large language models or
    conversational AI
  - Background in research and development of AI alignment or
    safety techniques
  - Experience with developer tools and APIs for AI integration

