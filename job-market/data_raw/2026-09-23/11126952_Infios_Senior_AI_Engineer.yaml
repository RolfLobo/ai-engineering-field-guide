description: |
  If you are looking for a meaningful career where people work
  and act with passion, rethink the existing and always strive
  to find the best solution - you have come to the right
  place. We develop future technologies to relentlessly make
  supply chains better.

  We are a leader in supply chain software solutions, helping
  organizations streamline operations, reduce costs, and
  improve efficiency.

  We are looking for an experienced and ambitious Senior
  Software Engineer with Python & GenAI skills to join our
  growing global and distributed product development team. As
  a tech savvy AI software craftsman, you must have a deep
  understanding of coding principles, understand object-
  oriented programming and appreciate the agile development
  way of working. All developers are encouraged to
  consistently assist in innovation of the software
  development in terms of agility, DevOps and modern
  development technologies.

  This role is anything but your average Senior Software
  Engineer job, you will have the opportunity to work on
  exciting new solutions by using LLM models to improve the
  user experience in our warehouse management product. We
  operate daily stands ups, sprint retro and SCRUM tactics. We
  pride ourselves as being an innovative company and provide
  you with all the modern tools that you will need to be
  successful in your lifelong career with us.

  What a day in the life looks like:

  - Design, develop & maintain AI-driven solutions using Python,
    LLM frameworks, APIs and modern AI tooling
  - Build and evolve generative AI and agentic systems,
    including architecture design, technical specs & design
    reviews
  - Collaborate cross-functionally with product, data &
    engineering teams to deliver scalable, reliable AI
    solutions
  - Deliver high-quality, unit- & integration-tested components
    following best practices and Agile methodologies
    (Scrum/Kanban)
  - Contribute to feature estimation, system enhancements and
    continuous optimisation of algorithms and AI performance
  - Work in a fast-paced, agile environment, taking ownership
    beyond your core scope and supporting broader team
    initiatives

  What you bring to the team:

  - 5+ years in software engineering with strong Python skills
    and experience in AI/GenAI (LangChain, Google ADK, LLMs,
    agentic systems)
  - Hands-on experience building & deploying AI solutions (RAG,
    embeddings, fine-tuning, AI APIs & web services)
  - Strong data skills (PostgreSQL, vector DBs) and
    understanding of software architecture, design patterns &
    microservices
  - Experience with CI/CD (Azure DevOps), testing
    (unit/integration), Git, containers (Docker/Kubernetes)
    and development tools (VS Code, PyCharm)
  - Solid analytical mindset, strong problem-solving skills,
    prompt engineering expertise and understanding of
    responsible AI (bias/safety)
  - Strong communication & collaboration skills; ideally
    mentoring experience, Agile mindset and domain exposure
    (retail/logistics/supply chain)

  #LI-REMOTE

