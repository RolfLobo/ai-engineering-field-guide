  Job Description:



  The role:

  Provides customer support for HPE's Slingshot software
  products and collaborates with R&D on issues.
  Responsibilities may include leading customer
  troubleshooting meetings, system testing and upgrades, and
  monitoring issue tickets. Candidate is expected to analyze
  software issues and provide final resolutions or workarounds
  when possible. This may also include managing escalations to
  the next level of engineering and ensuring issues are
  documented completely and are technically sound.

  Responsibilities:

  - Analyze, reproduce, isolate and resolve issues pertaining to
    Slingshot Software.
  - Provide technical support for customer reported issues
    escalated to Level 3 support.
  - Escalate unresolved issues internally to HPE R&D.
  - Perform selected product pre-release testing.
  - Document/communicate throughout the whole process of working
    an issue until closure.
  - Create and review selected customer documentation and
    notices.
  - Must be able to provide after-hours support when necessary.
  - Provides guidance and mentoring to less-experienced staff
    members.

  Education and Experience Required:

  - Bachelor's or Master's degree in Computer
    Science/Engineering, Information Systems, or equivalent.
  - Typically 6-10 years experience.

  Knowledge and Skills:

  - Hands-on experience supporting HPE Cray EX systems, HPE Cray
    Supercomputing platforms, or other leadership-class and
    exascale supercomputing environments.
  - Experience with HPE Slingshot interconnects, InfiniBand
    fabrics, high-speed Ethernet, or other large-scale HPC
    networking technologies.
  - Can independently perform enterprise Linux diagnostics and
    administration involving system services, network
    troubleshooting, log correlation, performance analysis,
    system-health assessment, and automation using Bash,
    Python, or comparable scripting tools.
  - Experience supporting parallel filesystems, enterprise
    storage platforms, cluster-management services, or HPC
    monitoring systems.
  - Prior involvement in system upgrades, installations,
    maintenance windows, acceptance activities, or multi-party
    technical projects.
  - Willingness to participate in an on-call rotation, planned
    after-hours maintenance, and additional onsite support
    during major incidents or system outages.
  - Ability to gather data, perform analysis, reproduce and
    resolve issues or escalate to HPE R&D or external
    partners, working with them until closure.
  - Knowledge and experience with working with 3rd party
    suppliers.
  - Ability to multi-task and prioritize, switching between
    working several issues at once.
  - Ability to work effectively in a team environment to
    investigate and resolve complex problems as part of a
    team.
  - Good communication skills, internally within HPE and
    externally with customers and suppliers, both verbal and
    written

