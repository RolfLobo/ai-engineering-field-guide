  TRAVEL: Yes, 25% of the TimeDescription

  At Northrop Grumman, our employees have incredible
  opportunities to work on revolutionary systems that impact
  people's lives around the world today, and for generations
  to come. Our pioneering and inventive spirit has enabled us
  to be at the forefront of many technological advancements in
  our nation's history - from the first flight across the
  Atlantic Ocean, to stealth bombers, to landing on the moon.
  We look for people who have bold new ideas, courage and a
  pioneering spirit to join forces to invent the future, and
  have fun along the way. Our culture thrives on intellectual
  curiosity, cognitive diversity and bringing your whole self
  to work — and we have an insatiable drive to do what others
  think is impossible. Our employees are not only part of
  history, they're making history.

  Northrop Grumman’s Aeronautics Systems – Research & Advanced
  Design (R&AD) transforms breakthrough ideas into mission-
  ready capabilities through intelligent anticipation. We’re
  the front-end design engine, defining what comes next. From
  developing cutting-edge next-generation future aircraft to
  trailblazing collaborative autonomous platforms, we push the
  boundaries of technology and forge industry-leading
  partnerships that set new standards for what’s possible.

  Our team owns the full lifecycle of advanced concept
  creation, from visionary early-stage designs and rapid
  prototyping to high-impact demonstrations and solving the
  toughest technical challenges in survivability, autonomy,
  and battle management. We seek curious, adaptable people who
  thrive on turning intuition into breakthrough solutions. If
  you’re driven to invent the future, build what’s next, and
  shape the landscape of national security, this is where you
  belong.

  The Northrop Grumman Research & Advanced Design organization
  is seeking a highly motivated Sr. Staff Software Engineer to
  join our team onsite in El Segundo, CA or Melbourne, FL.

  We invite you to apply for this requisition so you can learn
  about the exciting research we do and tell us about how you
  can help our team!

  Accomplish

  We are looking at ways to include Large Language Models
  (LLMs), advanced AI-based natural language processing (NLP),
  natural language understanding (NLU), Natural Language
  Generation (NLG), AI-based decision-making, sensor fusion,
  data fusion, computer vision, and image processing into our
  software development workflows.  We are on the cutting edge
  of responsible AI and explainable AI adoption.

  You must demonstrate a broad skill set balanced between
  interpersonal and technical capabilities developing
  sustainable quality products. You must have a track record
  as an effective communicator and problem solver who can
  develop and maintain good working relationships with
  internal and external stakeholders.



  Essential Functions:



  You will work closely with other AI/ML and software
  engineers to accomplish the following:

  - Design, develop, document, test, debug, and deploy state-of-
    the-art AI/ML applications.
  - Collaborate with cross-functional team to deploy AI/ML
    solutions in development and production environments.
  - Design and develop requirements for software development and
    software testing environments.

  Succeed

  The individual we seek will be self-motivated, proactive,
  goal-oriented to help us grow our services, become even
  better at what we do and will possess the following
  qualifications.



  Basic Qualifications:

  - Bachelor’s Degree in Computer Science or a Science,
    Technology, Engineering or Mathematics (STEM) discipline
    from an accredited university with 14 years of experience;
    OR Master’s Degree in Computer Science or a STEM related
    discipline from an accredited university with 12 years of
    experience; OR PhD Degree in Computer Science or a STEM
    related discipline from an accredited university with 10
    years of experience.
  - Experience with one of more AI models and algorithms: LLMs,
    DNN, genetic algorithms, embedding models, deep learning,
    etc.
  - Experience with using and deploying AI LLM tools such as:
    coding assistants (Devin/Windsurf,
    Continue/aider/opencode, etc.), infrastructure (vLLM,
    Azure OpenAI, LM Studio, etc.), or similar tools.
  - Experience with working in large code bases containing
    multiple languages (e.g. monorepos).
  - Experience with developing requirements and working with
    software in an integration/requirement
    verification/testing environment.
  - Ability to carry out rapid prototyping and proof-of-concept
    demonstrations.
  - Understanding of software engineering best practices
    including source control and software architecture.
  - Must have an active US Government Secret clearance (with a
    background investigation within the past 6 years or
    enrolled into Continuous Evaluation).



  Preferred Qualifications:

  - Familiarity with AI models and their limitations.
  - Familiarity with DevOps/DevSecOps/MLOps concepts.
  - Proficient in Python, C++, and Java.
  - Familiarity with Linux-based operating systems.
  - Demonstrated ability to work independently.
  - Experience in working with LLMs (e.g. prompt engineering,
    LLM development frameworks, fine tuning, quantization).
  - Ability to obtain and maintain US Government Top Secret
    clearance.
  - A robust history of research excellence, such as peer-
    reviewed publications or significant contributions to
    open-source ML libraries.

  Thrive with Us

  At Northrop Grumman we are invested in the growth and well-
  being off all our employees. We offer flexible work
  arrangements, phenomenal learning opportunities, exposure to
  a wide variety of projects and customers, and a very
  friendly team environment.

  Our Total Rewards Program offers a comprehensive employee
  benefits package, including a Retirement and Savings Plan,
  group medical, dental and vision coverage, life and
  disability insurance, and flexible spending accounts.

  If you are ready to join us in defining possible, apply now.

  Primary Level Salary Range: $192,800.00 - $289,200.00

  The above salary range represents a general guideline;
  however, Northrop Grumman considers a number of factors when
  determining base salary offers such as the scope and
  responsibilities of the position and the candidate's
  experience, education, skills and current market conditions.

  Depending on the position, employees may be eligible for
  overtime, shift differential, and a discretionary bonus in
  addition to base pay. Annual bonuses are designed to reward
  individual contributions as well as allow employees to share
  in company results. Employees in Vice President or Director
  positions may be eligible for Long Term Incentives. In
  addition, Northrop Grumman provides a variety of benefits
  including health insurance coverage, life and disability
  insurance, savings plan, Company paid holidays and paid time
  off (PTO) for vacation and/or personal business.

  The application period for the job is estimated to be 20
  days from the job posting date. However, this timeline may
  be shortened or extended depending on business needs and the
  availability of qualified candidates.

