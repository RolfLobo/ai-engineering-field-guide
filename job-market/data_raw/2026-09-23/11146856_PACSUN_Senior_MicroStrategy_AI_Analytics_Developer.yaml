  About the Job:

  The Senior MicroStrategy & AI Analytics Developer is a
  hands-on technical expert responsible for designing,
  building, and optimizing Pacsun's enterprise MicroStrategy
  environment while extending it with AI and generative-AI-
  powered analytics capabilities. This role owns the
  development of dashboards, dossiers, and reports that power
  merchandising, retail operations, and customer experience
  decisions, and partners closely with the Director, System
  Integration and AI Analytics to embed machine learning,
  predictive analytics, and natural-language/GenAI features
  into the BI platform. The ideal candidate combines deep
  MicroStrategy schema and development expertise with a strong
  working knowledge of Snowflake, modern data architecture,
  and emerging AI tools, and is comfortable translating
  ambiguous business questions into scalable, trustworthy
  analytics solutions.

  A day in the life, what you’ll be doing:

  - Design, develop, and maintain MicroStrategy schema objects
    (attributes, facts, hierarchies, transformations),
    reports, dossiers, and dashboards that support
    merchandising, retail operations, and executive reporting.
  - Build and optimize the MicroStrategy semantic layer, cubes,
    and metadata architecture to ensure accurate, performant,
    and scalable self-service analytics across the enterprise.
  - Integrate AI and generative AI capabilities into the BI
    platform, including natural language query (NLQ), AI-
    generated insights and narratives, anomaly detection, and
    predictive/prescriptive analytics features within
    MicroStrategy dashboards.
  - Partner with data science and the Director, System
    Integration and AI Analytics to prepare data models,
    feature sets, and semantic layers that support AI/ML use
    cases, RAG pipelines, and vector-enabled analytics.
  - Write and optimize complex SQL against Snowflake and other
    enterprise data sources; design and tune ETL/ELT and OLAP
    processes feeding both traditional BI and AI/ML workloads.
  - Leverage GenAI tools (e.g., Copilot, ChatGPT, MicroStrategy
    AI features) to accelerate report development, automate
    documentation, and improve developer and analyst
    productivity.
  - Collaborate with business stakeholders across merchandising,
    planning, marketing, and finance to gather requirements
    and translate them into performant BI and AI-enabled
    analytics solutions.
  - Ensure data governance, security, and responsible AI
    practices are followed within all reporting and analytics
    deliverables, including row-level security, access
    controls, and model/output accuracy monitoring.
  - Troubleshoot and resolve data, performance, and reporting
    issues across the MicroStrategy environment, including
    upgrades, migrations, and platform administration support.
  - Create and maintain technical documentation, including data
    flow diagrams, schema documentation, and dashboard/report
    specifications.
  - Mentor junior BI developers and analysts, sharing best
    practices in MicroStrategy development and the adoption of
    AI-assisted analytics techniques.
  - Stay current on MicroStrategy platform updates (including
    MicroStrategy ONE / AI features) and emerging AI analytics
    trends, recommending enhancements that improve business
    impact.

  What it takes to Join:

  - Bachelor's degree in Computer Science, Information Systems,
    Data Analytics, or a related field, or equivalent
    practical experience.
  - Minimum of 5 years of hands-on MicroStrategy development
    experience, including schema design, dossier/dashboard
    development, and performance tuning; MicroStrategy
    Certification (Developer or Architect level) strongly
    preferred.
  - Demonstrated experience applying AI or generative AI tools
    within a BI/analytics context (e.g., NLQ, AI-generated
    narratives, automated insight generation, or AI-assisted
    development).
  - Strong SQL skills and hands-on experience with Snowflake or
    comparable cloud data warehouse platforms.
  - Experience with dimensional data modeling (star/snowflake
    schemas), ETL/ELT processes, and enterprise data warehouse
    concepts.
  - Retail industry experience required.
  - Familiarity with AI governance, data privacy, and
    responsible AI practices as they apply to analytics and
    reporting.
  - Strong communication and problem-solving skills, with the
    ability to manage multiple projects and work independently
    in a fast-paced environment.

  Developing the Community/ Leadership Qualities:

  - Operate with the highest level of conduct, integrity, and
    confidentiality; setting the example for leaders and
    associates.
  - Develop and nurture strong cross functional partnerships;
    driving business results and inspiring a culture of
    transparency, collaboration, and accountability.
  - Serve as a Pacsun advocate in the industry and marketplace.
  - Recruit, identify, develop, and retain talent that delivers
    performance excellence.
  - As a manager, serve as a leader of company culture, norms,
    and conduct.
  - Ability to balance a strong management presence with a high
    level of approachability, encouraging and eliciting
    associate feedback and interaction.



