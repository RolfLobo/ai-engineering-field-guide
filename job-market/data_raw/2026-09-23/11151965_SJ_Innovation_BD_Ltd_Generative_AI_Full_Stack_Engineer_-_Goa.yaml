description: |
  We are looking for an AI & Full Stack Solutions Engineer
  with 2–5 years of experience to build scalable web
  applications and integrate Generative AI into real-world
  business solutions. The role combines hands-on full-stack
  development with practical AI implementation and solution
  problem-solving.

  Key Responsibilities

  - Build AI-powered applications using APIs and tools such as
    OpenAI, Anthropic, Hugging Face, LangChain, or LlamaIndex.
  - Develop scalable applications using React.js, Node.js, and
    MongoDB.
  - Build chatbots, AI agents, automation workflows, RAG-based
    applications, and other AI-driven features.
  - Write clean, secure, maintainable code and contribute to
    application architecture and technical decisions.
  - Evaluate new AI tools, models, and frameworks and identify
    practical opportunities for implementation.
  - Work closely with Product, QA, DevOps, Design, and other
    development teams.
  - Participate in code reviews, testing, debugging,
    documentation, and continuous improvement.

  Required Qualifications

  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field.
  - 2–5 years of professional software development experience.
  - Strong hands-on experience with React.js, Node.js, and
    MongoDB.
  - Practical experience working with Generative AI APIs,
    preferably OpenAI, Anthropic, or similar platforms.
  - Working knowledge of JavaScript/TypeScript.
  - Basic to intermediate Python knowledge is an advantage.
  - Understanding of REST APIs, databases, Git, and software
    development practices.

  What We Look For

  - Strong analytical and problem-solving skills.
  - Ability to convert business requirements into practical
    technical solutions.
  - Good communication and teamwork.
  - Curiosity and willingness to continuously learn new AI
    technologies.
  - Ability to take ownership of tasks and deliver with minimal
    supervision.

  Important Information for Candidates

  SJ Innovation does not ask for any payment at any stage of
  the recruitment process.

  We do not charge fees for job applications, interviews,
  offer letters, training, or onboarding.

  If you receive any suspicious call, message, or email
  claiming to represent SJI, please report it immediately to
  job@sjinnovation.com.
