title: Senior AI Engineer – Human Capital
company: The D. E. Shaw Group
location: NY, USA
work_type: FULL_TIME
company_size: 2,500 Employees
description: |
  OVERVIEW:  The D. E. Shaw group seeks a senior engineer with
  a deep interest in artificial intelligence (AI) to help lead
  its Human Capital (HC) team’s AI initiatives. This
  individual will play a central role in guiding the
  development and implementation of AI solutions that enhance
  the firm’s approach to attracting, assessing, and developing
  talent. The position offers the opportunity to lead
  strategic initiatives at the intersection of technology,
  people strategy, and product innovation, collaborating with
  colleagues across HC, product management, and software
  engineering.

  WHAT YOU'LL DO DAY-TO-DAY:

  - Collaborate with internal stakeholders to identify where AI
    can transform work, translating business needs into
    practical, well-scoped solutions.
  - Own the design and delivery of prototype solutions for high-
    impact use cases using Python.
  - Drive integration of AI features across product and
    engineering teams, aligning with the firm's technical
    architecture and governance standards.
  - Lead the evaluation and continuous refinement of AI tools by
    gathering feedback, monitoring outcomes, and recommending
    improvements.
  - Set the team's point of view on the evolving AI landscape,
    guiding strategic and tactical decisions on new models,
    tooling, and best practices.
  - Mentor and guide junior team members, setting technical
    direction and fostering a culture of learning.

  WHAT WE’RE LOOKING FOR:

  - A bachelor’s degree and at least six years of experience in
    human capital, data science, or technology development,
    with exposure to AI technologies; managerial experience is
    preferred.
  - Demonstrated fluency in Python, sound data fluency, and
    familiarity with LLMs and AI tools, including prompt
    design, Cursor, and Claude Code, as well as concepts like
    RAG and agentic architectures.
  - Solid knowledge of statistical methods; experience in social
    science research methods is preferred.
  - Proven ability to operate effectively in ambiguous
    environments, manage multiple workstreams, navigate cross-
    functional dependencies, and drive work forward with speed
    and ownership.
  - Excellent organizational, interpersonal, and written
    communication skills, with a collaborative and proactive
    approach to problem-solving.
  - Demonstrated ability to translate business needs into
    practical AI-driven solutions, influence stakeholders, and
    communicate effectively with both technical and non-
    technical audiences.
  - The expected annual base salary for this position is
    $175,000 to $250,000. Our compensation and benefits
    package includes variable compensation in the form of a
    year-end bonus, guaranteed in the first year of hire, and
    benefits including medical and prescription drug coverage,
    401(k) contribution matching, wellness reimbursement,
    family building benefits, and a charitable gift match
    program.

  Please note that this post is not an application. Please
  navigate to our website to apply: https://www.deshaw.com/rec
  ruit/jobs/Ads/BuiltIn/AISpecHCMar26

  The D. E. Shaw group is an equal opportunity employer.
