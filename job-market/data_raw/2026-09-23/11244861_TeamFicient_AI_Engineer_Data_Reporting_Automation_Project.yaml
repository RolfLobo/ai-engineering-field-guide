   AI Engineer — Data & Reporting Automation (Project Based)
  Covers: AI Accounts Reporting + AI Internal Report Company:
  TeamFicient Location: Remote Employment Type: Contract —
  Project-Based, Fixed-Scope Rate: Proposed by candidate via
  RFQ (rate, timeline, and estimated hours) Work Schedule:



  - Self-directed, solo execution of the full project scope
  - IT agent touchpoints and management check-ins only as needed
    to review progress
  - Timeline and hours are proposed by the candidate in their
    RFQ



  Why Join Us?  At TeamFicient, our team spans multiple
  countries and regions, and we stay connected by operating
  within EST, CST, and PST time zones.



  - Work Without Borders: Collaborate daily with experts from
    worldwide and gain international exposure.
  - Built for Remote: Join a fully remote culture designed for
    autonomy, flexibility, and trust.
  - Diverse Perspectives: Be part of a multicultural team where
    different backgrounds are our greatest strength.
  - Grow Globally: Expand your career on a global stage,
    learning how business works across different cultures and
    continents.



  About the Role  TeamFicient is looking for an AI Engineer to
  build automated, AI-assisted reporting environments —
  covering account-level and internal/management reporting —
  that consolidate data, validate KPIs, and produce recurring
  dashboards with minimal manual work. This is a two-project
  track, and a strong candidate can run both. This is a solo,
  fixed-scope engagement: you own execution end to end, with
  IT touchpoints and management check-ins only as needed.
  You'll submit your own RFQ (proposed approach, timeline,
  hours, and cost) as part of the process.



  Core Responsibilities  Reporting & Data Integration



  - Integrate and consolidate data across multiple account/data
    sources into a unified reporting engine
  - Gather requirements and build dashboards for account-level
    and internal/management reporting
  - Validate KPI calculations against source data and build
    exception/error handling for bad data



  Automation & AI




  - Automate data refreshes, recurring report production, and
    delivery scheduling
  - Generate AI-assisted summaries and management insights where
    appropriate



  Documentation




  - Document data sources, refresh logic, dependencies, and
    maintenance procedures



  Candidate Qualifications  Must-Haves



  - Strong hands-on experience with Google Sheets, Looker
    Studio, and Google Workspace automation
  - Experience integrating an AI/LLM service into a reporting or
    summarization workflow
  - Proven ability to design, validate, and document a
    KPI/reporting pipeline independently
  - Comfortable separating one-time build costs from
    recurring/usage-based costs (APIs, hosting)



  Good to Haves




  - Experience with Asana or similar project-data integrations
  - Background in BI/dashboard work across multiple accounts or
    business units



  Application Requirements  To apply for this project, please
  be prepared to submit:



  - A portfolio of relevant, comparable work
  - An RFQ (Request for Quotation) covering:
  - Willingness to sign an NDA and Project Agreement before
    receiving full project details and credentials
  - Willingness to undergo a background check



