description: |
  Forward Deployed Engineer (Python, AI/ML, Generative
  AI)About Us

  Founded in 2011, Modus is a global, fully remote team of
  world-class technologists who thrive in a collaborative,
  innovative environment. We’re a digital product engineering
  partner for forward-thinking businesses. Our global teams
  work side-by-side with clients to design, build, and scale
  custom solutions that achieve real results and lasting
  change, partnering with industry leaders including AWS,
  GitHub, and Atlassian.

  We were fully remote before it was cool! Recognized as one
  of the Inc. 5000 Fastest Growing Private Companies for nine
  years and a top remote work company by FlexJobs, we have
  helped some of the world’s largest brands deliver powerful
  digital experiences.

  As an award-winning Atlassian partner with a world-class
  team, we help organizations innovate and solve complex
  challenges for Fortune 500 companies and beyond, we want to
  hear from you.

  Opportunity!

  We are looking for a Forward Deployed Engineer to work at
  the intersection of engineering, AI, and customer delivery.
  You’ll partner directly with clients to understand complex
  business and technical challenges, rapidly design and build
  solutions, and integrate modern AI capabilities into real-
  world applications and systems.

  This role is ideal for an engineer who combines strong
  application development skills with a customer-focused
  mindset and enjoys taking solutions from initial discovery
  and architecture through implementation and deployment.

  Requirements:

  - Strong proficiency in Python and experience building
    production-ready applications and services.
  - Solid application engineering experience, including
    designing, developing, testing, and deploying scalable
    software solutions.
  - Hands-on experience integrating AI/ML capabilities into
    applications and existing technology ecosystems.
  - Strong experience designing and integrating APIs and
    distributed systems, including third-party services and
    enterprise platforms.
  - Experience building solutions using Large Language Models
    (LLMs) and Generative AI technologies.
  - Experience working with major cloud platforms such as AWS,
    Azure, and/or GCP.
  - Proficiency with TypeScript and modern application
    development frameworks.
  - Experience with agent orchestration, AI workflows, tool
    calling, or similar agentic architectures.
  - Strong customer-facing and consulting skills, with the
    ability to understand business requirements and translate
    them into technical solutions.
  - Experience with solution architecture, including designing
    scalable systems and making technical decisions based on
    customer and business requirements.
  - Ability to work closely with customer stakeholders, product
    teams, and engineers throughout the solution lifecycle.
  - Strong problem-solving skills and the ability to operate
    effectively in fast-moving, ambiguous environments.

  Bonus points:

  - Experience delivering technical solutions directly within
    customer environments.
  - Experience designing or implementing RAG, AI agents, or
    multi-agent systems.
  - Exposure to MLOps, model deployment, and AI observability.
  - Experience working in consulting, professional services,
    solutions engineering, or similar customer-facing
    technical roles.
  - Experience rapidly building prototypes and proofs of concept
    and evolving them into production-ready solutions.
  - Familiarity with modern data platforms, vector databases,
    and AI infrastructure.

  You’ll Love:

  - Working directly with customers to solve complex, real-world
    technical challenges.
  - Building and deploying AI-powered solutions that move
    quickly from concept to production.
  - Combining hands-on engineering with solution architecture
    and customer collaboration.
  - Working across application engineering, cloud technologies,
    and modern AI systems.
  - Exploring emerging AI technologies and finding practical
    ways to apply them to meaningful business problems.

  By joining our team, you’ll be part of a winning squad that
  plays to each other’s strengths and celebrates every success
  together.
