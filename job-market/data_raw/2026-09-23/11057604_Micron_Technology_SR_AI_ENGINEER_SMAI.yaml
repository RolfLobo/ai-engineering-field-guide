description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever. Senior AI Engineer - SMAI, Micron Technology,
  Inc. As a Senior AI Engineer within Micron's Smart
  Manufacturing & AI (SMAI) organization, you will design,
  develop, and deploy AI-enabled enterprise solutions that
  drive manufacturing efficiency, quality, productivity, and
  digital transformation. You will leverage technologies such
  as Generative AI, .NET, Angular, JavaScript, SQL, Azure
  Cloud, and DevOps to build scalable, secure, and high-impact
  business applications. Key Responsibilities

  - Design and develop AI-powered, cloud-enabled, and full-stack
    enterprise applications.
  - Integrate Generative AI, machine learning, and intelligent
    automation capabilities into business solutions.
  - Build modern, intuitive, and responsive user interfaces
    using Angular, JavaScript, HTML5, and CSS.
  - Develop secure and scalable backend services, APIs, and
    microservices using .NET technologies.
  - Collaborate with business stakeholders to identify
    opportunities for automation and process improvement.
  - Contribute to enterprise architecture, application
    modernization, and technology roadmap initiatives.
  - Implement DevOps best practices including CI/CD, automated
    testing, monitoring, and deployment automation.
  - Analyze application performance, usage metrics, and system
    health to improve scalability and reliability.
  - Partner with architecture, security, infrastructure, and
    operations teams to ensure compliance with enterprise
    standards.
  - Mentor team members and promote engineering excellence,
    innovation, and continuous improvement.

  Required Qualifications

  - Bachelor's degree in Computer Science, Computer Engineering,
    Information Technology, or a related field.
  - Strong experience in C#, .NET, Web APIs , and enterprise
    application development.
  - Proficiency in Angular, TypeScript, JavaScript, HTML5, CSS,
    Bootstrap, and Material Design .
  - Experience with SQL and NoSQL databases such as SQL Server,
    Cosmos DB, or MongoDB.
  - Knowledge of Azure Cloud Services, DevOps practices, CI/CD
    pipelines, and source control systems .
  - Familiarity with Generative AI, AI/ML concepts, LLMs, AI
    services, or intelligent automation solutions .
  - Experience with Azure or Google AI Services, OpenAI, Agentic
    AI, MCP, or modern AI frameworks.
  - Understanding of application security, performance
    optimization, and cloud-native architectures.

  Preferred Qualifications

  - Experience with ETL and integration tools such as NiFi,
    SSIS, or similar technologies.
  - Knowledge of semiconductor manufacturing, engineering,
    quality, or operations domains.
  - Experience with containerization and microservices
    architectures (Docker/Kubernetes).
  - Strong problem-solving, communication, and stakeholder
    management skills.

