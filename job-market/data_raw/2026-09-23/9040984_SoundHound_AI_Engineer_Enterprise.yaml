description: |
  Your Career, our Future—Together.

  Ready to join something big? At SoundHound AI, we bring
  voice, generative, and conversational AI together to
  transform how people interact with products and services.
  From voice-enabled vehicles to food ordering and customer
  support, our multilingual, omnichannel technology already
  impacts hundreds of millions worldwide.

  The Opportunity

  The cognitive engineer is a core member of the agile teams
  implementing cognitive solutions. These cognitive solutions
  are to be fit-for-purpose, efficient, and of high quality

  The responsibility of the cognitive engineer is to build and
  implement new cognitive functionalities based on extensive
  Transversal Analysis and Architecture blueprint for clients

  What You'll Do

  - Responsible for configuring cognitive modules of Amelia – or
    creating new customized modules with help of Product
    Engineering – to ensure Amelia can address required
    functionality
  - Review outcome of the Transversal Analysis and target
    Architecture blueprint
  - Configure (‘train’) Amelia for the agreed use cases
  - Test Amelia against concrete cases and implement refinements
  - Discuss with Technical Architect and Cognitive Project Leads
    approaches to each technical challenge and agree on
    technical solution
  - Develop and test each module functionally until it reaches
    expected behavior
  - Work with integration experts to connect developed
    functional solutions to the Automatons that communicate
    with back-end systems
  - After project execution, review ‘structural’ changes and
    developed APIs and decide with R&D if any should be
    standardized in Amelia
  - Reuse APIs and automatas or create new APIs and automatas to
    integrate Amelia with relevant client systems and security
    framework
  - Create agile work plan for agreed functionality and validate
    with cognitive project lead
  - Configure Amelia ontologies to address required
    functionality in agile sprints
  - Create reusable Amelia ‘modules’ (e.g. BPNs) in local
    language
  - Create reusable Amelia ontologies in local languages
  - Stress test new/modified pieces to ensure they can withstand
    technical end user requirements

  What You'll Bring

  - Master's / Bachelor's degree in computer science or
    equivalent
  - 2+ years of experience with Java, JavaScript, and/or Groovy
    Scripting

  Workplace & Compensation

  This role is available in India and will be hired into
  Amelia Global Services, a subsidiary of SoundHound AI.

  The estimated salary for this position is [replace with MIN
  and MID of range of JOB LEVEL for all applicable LOCATION
  TIERS] plus equity. In addition to salary and equity, you
  will receive comprehensive healthcare, paid time off, and
  other benefits. Our recruiting team will provide a specific
  salary range based on location and years of experience.

  Let's Start the Conversation

  Join SoundHound AI and collaborate with colleagues worldwide
  who are shaping the future of voice AI. Guided by our
  values—supportive, open, undaunted, nimble, and determined
  to win—we strive to build breakthrough AI experiences
  together.

