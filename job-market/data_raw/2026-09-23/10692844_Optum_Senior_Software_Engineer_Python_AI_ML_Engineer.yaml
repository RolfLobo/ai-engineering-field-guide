    otherwise) on its ability to do so

  Required Qualifications:

  - Graduate degree or equivalent experience
  - Bachelor's degree in Computer Science, Engineering, Data
    Science, or related field (or equivalent practical
    experience)
  - 3+ years of software engineering experience in Java, Python,
    JavaScript/TypeScript, or similar languages
  - 2+ years of hands-on experience building AI, ML, Generative
    AI, or LLM-based applications
  - Experience with modern AI frameworks such as LangChain,
    Semantic Kernel, LangGraph, CrewAI, or equivalent
  - Experience integrating AI services from Azure OpenAI,
    OpenAI, Anthropic, Google Gemini, or similar platforms
  - Experience with REST APIs, microservices, cloud-native
    development, and container technologies
  - Knowledge of prompt engineering, RAG architecture,
    embeddings, vector databases, and AI evaluation techniques
  - Solid understanding of software engineering fundamentals,
    design patterns, testing, and secure coding practices
  - Experience using Git, GitHub, CI/CD pipelines, and DevOps
    practices
  - Proven solid analytical, troubleshooting, and problem-
    solving skills
  - Proven excellent verbal and written communication skills
    with the ability to explain technical concepts to non-
    technical stakeholders

