description: |
  At Wasabi, we’re a proven collection of pioneers,
  visionaries and disruptive doers. We see things differently
  than our competitors, and we make our mark in the industry
  by challenging the norm and delivering the unexpected and
  improbable. We’re a fast-growing company taking the Cloud
  Storage industry by storm and recognized as one of the best
  places to work in Boston.

  Wasabi hot cloud storage is a new class and category of
  cloud storage, breaking all traditional barriers and
  boundaries of storage with a disruptive value proposition of
  being 1/5th the cost of AWS S3, faster than the competition,
  with no fees for egress or API requests. Cloud storage has
  never been so simple, so fast and so inexpensive. It’s all
  part of our vision to make cloud storage the next great
  global utility, just like electricity.

  Role Description: Senior Alliance Manager, AI
  Infrastructure, Data Factory & Developer Partnerships



  Role Purpose:

  AI infrastructure is one of the fastest-growing areas of our
  business, and we're looking for a senior alliance leader to
  build our partner strategy across it from the ground up.
  This is a hunter's role as much as a strategist's: you'll
  spend real time identifying and pursuing prospective
  partners who don't yet know Wasabi, as well as managing
  relationships that already exist. The mandate spans three
  connected areas: AI infrastructure partnerships, AI data
  factory partnerships (the storage and data layer powering AI
  training and inference), and the emerging AI developer
  ecosystem.

  This role calls for an AI industry veteran who already has
  credibility in the AI infrastructure and storage industry —
  with a network of relationships. You'll own the strategy,
  and the go-to-market for this motion end to end: evaluating
  who we partner with, originating those relationships
  yourself, structuring how the partnership creates revenue,
  and representing Wasabi commercially and technically with
  the companies building the AI infrastructure stack. You'll
  work in close partnership cross functionally with product
  teams and with our Business Development team to evaluate and
  pursue neocloud providers, and other AI-native companies as
  the landscape evolves.

  *Principals only. No recruiters.

  Responsibilities:

  Requirements:

  OTE - $170,000 – $210,000

  The OTE range reflects the full range for this position at
  Wasabi Technologies. At Wasabi, we believe in paying fairly
