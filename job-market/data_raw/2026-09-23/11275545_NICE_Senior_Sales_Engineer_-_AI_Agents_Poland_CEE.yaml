description: |
  At NiCE, we don’t limit our challenges. We challenge our
  limits. Always. We’re ambitious. We’re game changers. And we
  play to win. We set the highest standards and execute beyond
  them. And if you’re like us, we can offer you the ultimate
  career opportunity that will light a fire within you.

  Join the recognized leader in AI-first CX

  NiCE Cognigy is building the Agentic AI Workforce of the
  future for enterprise customer service — named a Leader in
  the Forrester Wave™ 2026 and a three-time Leader in the
  Gartner® Magic Quadrant™. We already power AI Agents for
  1,250+ brands worldwide, and with NiCE investing heavily in
  AI, the opportunity ahead of us has never been bigger.

  Eastern Europe is one of our biggest growth opportunities —
  a region of sophisticated enterprises ready for agentic AI,
  and largely still to be won. We're looking for a seasoned,
  senior presales professional, based in Germany, to own the
  technical narrative on our most complex enterprise deals
  across the Eastern European markets, from Poland to the
  wider CEE region, while supporting our established DACH
  business.

  So, what's the role all about?

  You'll be the trusted technical advisor on our most
  strategic and complex enterprise opportunities across
  Eastern Europe — anchored in Germany, working closely with
  our DACH team, but with your primary focus on opening and
  growing the CEE markets. This is a position for a tenured
  consultant who can own the technical narrative in front of
  enterprise buyers, navigate sophisticated stakeholder
  landscapes, and shape solutions that close seven-figure
  deals.

  Beyond the deal cycle, you'll be a visible voice for NiCE
  Cognigy in the market — representing us through thought
  leadership at customer and marketing events, and helping
  drive awareness across the region.

  How will you make an impact?

  - Partner with the sales team to plan, prepare and execute on
    complex, strategic enterprise deals across the Eastern
    European markets, with support to the wider DACH business.
  - Lead discovery calls and technical deep dives with
    enterprise stakeholders, uncovering pain points and
    business requirements.
  - Create and deliver powerful, customized product
    demonstrations and presentations that resonate with both
    technical and business audiences.
  - Design and recommend solutions tailored to customer needs,
    articulating the capabilities and value proposition of
    NiCE Cognigy.
  - Run and support POCs/POVs that prove value in real
    enterprise environments.
  - Be a visible voice for NiCE Cognigy in the market —
    representing us through thought leadership at customer
    events, webinars, trade shows and marketing activities
    across the region to build awareness.
  - Stay ahead of the competitive landscape and deliver credible
    technical comparisons against other AI Agent and agentic
    AI platforms.
  - Collaborate with product and other internal teams to feed
    back customer requirements and deliver internal
    enablement.

  Have you got what it takes?

  - Senior Presales / Sales Engineering Expertise: A tenured
    track record in presales, sales engineering, or solution
    consulting — ideally managing complex enterprise deals end
    to end.
  - Enterprise Software Proficiency: Deep background in the
    enterprise software space, particularly contact center
    (CCaaS) or automation technologies.
  - AI Agents & Generative AI Experience: Hands-on experience
    presenting AI Agents for voice and chat, agentic AI, voice
    and text conversational and generative AI technologies.
  - AI-Native Way of Working: You actively use LLMs and AI tools
    in your daily work to move faster and build better.
    Whether it's agentic coding assistants like Claude Code,
    Cursor, or GitHub Copilot, AI app builders like v0,
    Lovable or Replit Agent, or general assistants like Claude
    and ChatGPT, you know how to put these tools to work —
    "vibe coding" tailored demo environments, prototyping
    integrations, and accelerating POCs that wow customers.
  - Contact Center Knowledge: Understanding of contact center
    technology (SIP, SBCs, ACD, ASR, TTS, etc.) and experience
    with conversation, IVR or chatbot design.
  - Thought Leadership & Presence: A confident, engaging
    presenter comfortable on stage at customer and industry
    events.
  - Technical Depth: Strong grasp of NLU/NLP, conversational AI
    technologies, STT, TTS and LLMs
  - Sales Acumen: Able to translate complex technology into
    clear business value and build rapport with senior
    enterprise stakeholders.
  - Location & Languages: Based in Germany, with the flexibility
    to travel across the region. Fluent in English and Polish
    to engage customers and partners across the Eastern
    European markets; German and additional CEE languages a
    strong plus.
  - Communication & Collaboration: Excellent communication
    skills and cross-functional collaboration across countries
    and cultures.

  What's in it for you?

  Join an ever-growing, market-disrupting, global company
  where the teams — comprised of the best of the best — work
  in a fast-paced, collaborative, and creative environment! As
  the market leader, every day at NiCE is a chance to learn
  and grow, and there are endless internal career
  opportunities across multiple roles, disciplines, domains,
  and locations. If you are passionate, innovative, and
  excited to constantly raise the bar, you may just be our
  next NiCEr!

  About Cognigy

  NiCE Cognigy delivers AI that works — fast, human, and
  enterprise-ready. As the leading AI-first CX platform built
  for real-world scale, we combine Generative and
  Conversational AI through orchestration, tools, and
  enterprise systems to power Agentic AI. Backed by global CX
  leader NiCE, we empower brands with AI Agents that redefine
  customer experiences and achieve measurable ROI — instantly,
  across every channel and in 100+ languages.

