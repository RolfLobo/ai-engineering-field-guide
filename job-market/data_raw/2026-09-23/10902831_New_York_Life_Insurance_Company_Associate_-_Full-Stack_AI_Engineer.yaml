description: |
  Location Designation: Hybrid - 3 days per week  Technology,
  Data, AI and Ventures: Within the Tech, Data, AI, Ventures
  (TDAV) organization, our work is guided by a shared vision:
  deploying the power of technology, data, AI and ventures to
  accelerate sustainable competitive advantage for New York
  Life's businesses. We build solutions that power how we
  serve policy owners, agents, advisors and employees while
  delivering measurable business outcomes. Across technology,
  data, AI, cyber, product, digital experience, architecture
  and infrastructure, TDAV combines the scale and investment
  of an industry leader, access to leading-edge technologies
  and the opportunity to help shape how a world-class
  financial services company competes in the AI era - all
  backed by the stability and purpose of a mutual company
  built to last. Role Overview We are building a small, highly
  technical AI engineering team responsible for creating New
  York Life's enterprise AI platform and the first generation
  of agentic AI solutions that run on it. As an Associate AI
  Engineer, you will contribute to both platform and product
  development while working alongside senior engineers to
  build production-quality AI systems. You will gain hands-on
  experience across the AI engineering stack, including cloud
  infrastructure, platform services, retrieval systems,
  developer tooling, multi-agent workflows, and enterprise AI
  applications. Success in this role requires strong software
  engineering fundamentals, curiosity around AI technologies,
  and a passion for building scalable solutions that create
  business value. What You'll Do • Contribute to the
  development and enhancement of enterprise AI platform
  capabilities, including agent lifecycle services, developer
  tooling, runtime orchestration, workflow management, and
  governance features. • Build and support production-ready AI
  applications and agentic workflows that leverage retrieval,
  tool integration, memory, and human-in-the-loop processes. •
  Implement and maintain enterprise knowledge systems using
  semantic search, vector databases, embeddings, and
  retrieval-augmented generation (RAG). • Develop cloud-native
  services and infrastructure using Google Cloud Platform,
  Kubernetes, CI/CD pipelines, and Infrastructure as Code. •
  Support deployment, monitoring, testing, and operational
  management of AI models and agent-based systems. •
  Collaborate with senior engineers to incorporate responsible
  AI, security, governance, and compliance controls into
  solutions. • Leverage AI-assisted engineering tools such as
  GitHub Copilot, Cursor, Claude Code, or similar technologies
  as part of daily development work. What You'll Bring • 1-3
  years of software engineering experience. • Experience with
  Python and familiarity with modern application development.
  • Exposure to cloud technologies, APIs, CI/CD, testing, and
  distributed systems concepts. • Familiarity with AI/ML
  concepts, LLMs, RAG, embeddings, or agent frameworks through
  coursework, projects, internships, or professional
  experience. • Strong problem-solving skills and desire to
  learn emerging AI technologies. • Effective communication
  and collaboration skills. Job Level: LEVELPF2 Pay
  Transparency Salary Range: $81,000-$115,500 Overtime
  eligible: Exempt Discretionary bonus eligible: Yes Sales
  bonus eligible: No Actual base salary will be determined
  based on several factors but not limited to individual's
  experience, skills, qualifications, and job location.
  Additionally, employees are eligible for an annual
  discretionary bonus. In addition to base salary, employees
  may also be eligible to participate in an incentive program.
