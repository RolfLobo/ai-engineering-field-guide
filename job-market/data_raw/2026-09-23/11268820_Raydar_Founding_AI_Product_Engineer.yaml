description: |
  About the company

  Our client is an industrial software company.

  The role

  Raydar is recruiting for this opportunity through the
  Paraform network. The position is with our client. Build
  reusable backend and AI product infrastructure, turning
  customer-specific solutions into a platform used across
  deployments.

  What you'll do

  - Own a platform area such as agent execution, extraction
    pipelines, integrations, or evaluation systems.

  - Consolidate overlapping implementations into reusable
    services.

  - Partner with customer-facing engineers on requirements that
    need new capabilities.

  - Build production AI workflows and cloud infrastructure.

  - Visit customer facilities to understand users and improve
    the product.

  Requirements

  What we're looking for

  - 3 to 6 years of product, backend, or full-stack engineering
    experience.

  - End-to-end ownership of shipped products across at least two
    companies.

  - Production AI experience with agents, retrieval, extraction,
    or evaluation systems.

  - Strong Python and architectural experience across backend,
    data, and cloud systems.

  - A bachelor of science degree in computer science or a
    related STEM field.

  - Ability to meet the stated U.S.-person eligibility
    requirement, including citizens, permanent residents,
    refugees, or asylees.

  Bonus points

  - Next.js, React, PostgreSQL, reinforcement learning, or cloud
    AI tooling.

  - Founder, CTO, or early-stage engineering experience.

  Benefits

  Compensation and benefits

  - Base salary: USD 215,000 to 235,000 per year.

  - Equity: 0.25-0.5%.

  - Equity vests over four years with a one-year cliff.

  - Medical, dental, and vision coverage fully paid.

  - 20 days of paid time off.

  - Relocation assistance up to USD 10,000.

  - Customer travel expenses covered and paid work trials.

  Location and work model

  - Five days per week onsite in New York, with customer travel
    approximately four to six days per month.

  - New visa sponsorship is not available for this role.
