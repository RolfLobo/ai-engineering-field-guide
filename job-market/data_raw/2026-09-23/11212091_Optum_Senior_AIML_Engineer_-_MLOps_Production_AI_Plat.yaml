  - 6+ years in AI/ML Engineering, Data Engineering, or MLOps
  - Solid Python and ML platform experience
  - Hands-on experience with:
    - Azure ML
    - Databricks
    - MLflow
    - CI/CD for ML
    - AI Observability
    - Model Monitoring
  - Experience deploying and operating ML systems at enterprise
    scale
  - Experience with cloud platforms (Azure preferred)

  Preferred Qualifications:

  - Healthcare AI, Prior Authorization, Claims, RCM, or EHR
    experience
  - Experience building governance and Responsible AI controls
  - FHIR, HL7, Epic integration knowledge
  - Exposure to GenAI, LLMOps, and AI monitoring frameworks

