description: |
  At Armanino, you determine your career path. This means it's
  possible to pursue challenges you are passionate about, in
  industries you care about.

  Armanino is proud to be Among the top 20 Largest Firms in
  the Nation and one of the Best Places to Work. We have a
  community of resources that are ready and willing to support
  your ideas, build your skills and expand your professional
  network. We want you to integrate all aspects of your life
  with your career. At Armanino, we know you don’t check-out
  of life when you check-in at work. That’s why we’ve created
  a unique work environment where your passions, work, and
  family & friends can overlap. We want to help you achieve
  growth by giving you access to a network of smart and
  supportive people, willing to listen to your ideas.

  Job Responsibilities

  - Design, build, test, and support ServiceNow automation
    solutions for ITSM, End User Support, and infrastructure
    operations
  - Develop workflows, integrations, catalog automations,
    scripts, and reusable components using ServiceNow tools
  - Automate enterprise IT processes across provisioning, access
    management, endpoint services, cloud operations,
    monitoring, patching, backup, and security workflows
  - Partner with ITSM and End User Support teams to identify and
    implement automation opportunities that improve service
    delivery
  - Apply AI and automation technologies to improve triage,
    routing, knowledge management, fulfillment, reporting, and
    operational decision-making
  - Integrate ServiceNow with enterprise platforms including
    cloud, identity, endpoint, monitoring, HR, CRM, and
    financial systems
  - Utilize APIs, IntegrationHub, MID Server, and automation
    tools to enable seamless system orchestration
  - Improve automation reliability through error handling,
    logging, retry logic, operational reporting, and data
    quality controls
  - Ensure CMDB alignment, ownership tracking, and
    supportability of automated solutions
  - Follow established standards for solution design,
    development, testing, peer review, documentation, change
    control, and release management
  - Maintain alignment with ServiceNow architecture standards,
    security models, governance practices, and long-term
    platform maintainability
  - Document automation solutions, troubleshooting procedures,
    and operational support processes
  - Monitor and optimize automation performance, scalability,
    and user adoption
  - Support production environments by troubleshooting issues
    and implementing continuous improvements
  - Collaborate with cross-functional teams to deliver scalable
    and secure automation solutions across the enterprise

  Requirements

  - Bachelor’s degree in Information Technology, Computer
    Science, Information Systems, or a related field, or
    equivalent practical experience
  - Minimum of 5 years of experience in infrastructure
    engineering, cloud operations, ServiceNow development, IT
    operations, AI automation, or infrastructure automation
  - Hands-on ServiceNow experience including Flow Designer,
    IntegrationHub, MID Server, ITSM, Service Catalog,
    scripting, APIs, and integrations
  - Strong experience supporting enterprise infrastructure,
    cloud platforms, identity management, endpoint
    technologies, monitoring, and security operations
  - Experience leveraging automation technologies, AI tools,
    low-code/no-code platforms, scripting, or APIs to improve
    operational processes
  - Experience supporting End User Support, ITSM, service desk,
    or enterprise operations teams
  - Experience with Azure, Microsoft 365, Entra ID, Intune, and
    enterprise cloud platforms
  - Strong understanding of CMDB, asset management, governance,
    and change management processes
  - Experience integrating ServiceNow with enterprise
    applications using APIs and orchestration tools
  - Knowledge of AI-driven automation, copilots, agents, and
    workflow automation platforms

  Preferred Qualifications

  - ServiceNow Certified System Administrator (CSA)
  - ServiceNow Certified Application Developer (CAD), ITSM,
    ITOM, IntegrationHub, or related ServiceNow certifications
  - Experience working in large enterprise environments with
    standardized operational and governance practices
  - Strong documentation, troubleshooting, and process
    improvement skills
  - Experience supporting infrastructure, cloud, identity,
    endpoint, or security operations environments

