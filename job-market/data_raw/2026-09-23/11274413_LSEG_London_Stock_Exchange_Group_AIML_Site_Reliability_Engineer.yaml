description: |
  Corporate Engineering AI (CE AI) Team

  The Corporate Engineering AI team is the central enablement
  and platform delivery function for LSEG’s internal agentic
  AI ecosystem. The team’s mission is to scale safe,
  high‑quality AI capabilities across the enterprise by
  providing shared platforms, patterns, governance, and
  delivery support.

  CE AI owns and operates core AI platforms including LSEG AI
  Assist, the Question Answering Service (QAS), and the
  Internal MCP Gateway. Rather than delivering individual
  business use cases end‑to‑end, the team enables product
  engineering groups across LSEG to expose knowledge, data,
  and actions to AI agents in a consistent, governed, and
  repeatable way.

  The team operates a Central MCP Delivery model: building
  critical MCP tools and services “for” product teams where
  required, while simultaneously defining standards, patterns,
  and platform capabilities that allow teams to progressively
  move towards self‑service contribution.

  LSEG AI Assist / Internal MCP Programme of Work

  This programme delivers an LSEG‑owned, production‑grade
  agentic AI platform with MCP as its extensibility layer.

  The scope of work includes:

  *   Building and operating LSEG AI Assist, an in‑house
  agentic experience capable of reasoning, planning, and
  tool‑calling.

  *   Operating QAS, the enterprise RAG and search layer used
  to ground agent responses in approved data sources.

  *   Delivering a production Internal MCP Gateway providing
  discovery, security, policy enforcement, observability, and
  lifecycle management for MCP tools and Skills.

  *   Designing and building MCP servers and Skills that
  expose internal and vendor systems safely to agents.

  *   Establishing evaluation, quality control, and governance
  mechanisms so MCP tools and Skills can be promoted through
  PTB/PTO and operated with confidence at scale.

  The programme follows a “build for” model today, with a
  strong emphasis on defining the future product and platform
  experience, patterns, and contribution pathways that will
  enable federated scale over time. Site Reliability Engineers
  – Responsibilities & Skills

  Responsibilities

  *   Build, operate, and harden the Internal MCP Gateway and
  related platform services.

  *   Define and implement observability, monitoring, and
  audit capabilities for agent tool‑calling and MCP traffic.

  *   Ensure MCP platform components meet availability,
  performance, and reliability targets.

  *   Support secure hosting and runtime environments for MCP
  servers and related services.

  *   Partner with ML and Quality Engineers to support
  testing, evaluation, and safe rollout of platform changes.

  *   Contribute to service management, incident response, and
  operational readiness for production AI platforms.

  *   Help shape the long‑term platform architecture
  supporting federated MCP scale.

  Skills

  *   Strong Python experience for platform services and
  operational tooling.

  *   Experience with observability and monitoring stacks
  (metrics, tracing, logging, dashboards).

  *   SQL skills for operational analysis, reporting, and
  audit queries.

  *   Hands‑on experience operating services on AWS.

  *   Knowledge of cloud‑native reliability patterns and
  service lifecycle management.

  *   Experience supporting platforms subject to audit,
  compliance, and regulated delivery processes.

