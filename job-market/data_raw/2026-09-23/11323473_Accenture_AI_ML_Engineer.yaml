description: |
  Project Role : AI / ML Engineer Project Role Description :
  Develops applications and systems that utilize AI tools,
  Cloud AI services, with proper cloud or on-prem application
  pipeline with production ready quality. Be able to apply
  GenAI models as part of the solution. Could also include but
  not limited to deep learning, neural networks, chatbots,
  image processing. Must have skills : Large Language Models
  (LLMs), Generative AI, Agentic AI Good to have skills : NA
  Minimum 7.5 year(s) of experience is required Educational
  Qualification : 15 years full time education Summary: As an
  LLM - Agentic AI Developer/ Engineer, a typical day involves
  designing and building advanced applications and systems
  that leverage artificial intelligence technologies. This
  role requires integrating cloud-based or on-premises
  pipelines to ensure solutions are production-ready and
  scalable. The work often includes applying generative
  artificial intelligence models to enhance system
  capabilities. Responsibilities may extend to developing deep
  learning frameworks, neural network architectures,
  conversational agents, and image processing tools, all aimed
  at delivering innovative and efficient AI-driven solutions
  within a collaborative environment.

  Roles & Responsibilities:
  - Expected to be an SME, collaborate and manage the team to
    perform.
  - Responsible for team decisions.
  - Engage with multiple teams and contribute on key decisions.
  - Provide solutions to problems for their immediate team and
    across multiple teams.
  - Lead the design and implementation of AI-driven projects
    ensuring alignment with organizational goals.
  - Mentor junior team members to foster skill development and
    knowledge sharing.
  - Coordinate cross-functional efforts to integrate AI
    solutions seamlessly into existing systems.

  Professional & Technical Skills:
  - Must To Have Skills: Proficiency in Large Language Models
    (LLMs), Generative AI, Agentic AI.
  - Strong expertise in developing and deploying AI applications
    using cloud AI services and on-premises infrastructure.
  - Experience with deep learning techniques including neural
    networks and model optimization.
  - Ability to design and implement production-quality AI
    pipelines ensuring scalability and reliability.
  - Familiarity with chatbot development and natural language
    processing frameworks.
  - Knowledge of image processing methodologies and their
    integration into AI solutions.

  Additional Information:
  - The candidate should have minimum 7.5 years of experience in
    Large Language Models (LLMs).
  - This position is based at our Bengaluru office.
  - A 15 years full time education is required.

  15 years full time education

