  HIRING | AI PLATFORM ENGINEER (FDE)

   Bangalore | Hybrid

   Experience: 5–8 Years

   CTC: Up to ₹28 LPA

   ROLE OVERVIEW

  We are looking for an AI Platform Engineer to own and
  enhance enterprise Data & AI platforms covering compute,
  storage, orchestration, semantic layers, AI services and
  platform infrastructure. The role focuses on automation, AI
  enablement, governance, observability and cloud
  optimization.? MUST-HAVE SKILLS

  • Enterprise Data & AI Platform Architecture

  • Python / PySpark / SQL

  • AWS / Azure / GCP

  • Airflow / Astronomer

  • Snowflake / Databricks / Spark / Microsoft Fabric /
  BigQuery

  • Data Modeling, Metadata & Data Quality

  • CI/CD, Git & Infrastructure as Code

  • Data & AI Governance

  • RBAC, Security, Privacy & Compliance

  • Semantic Layer & AI Cost Management

  • Agentic AI, MCP, APIs & AI Integration

  • Observability, Monitoring & Troubleshooting

   KEY RESPONSIBILITIES

  • Build and operate scalable Data & AI platforms

  • Develop batch, streaming and AI-enabled pipelines

  • Enable semantic models, AI agents, MCP integrations and
  reusable services

  • Automate infrastructure using IaC, CI/CD and DevOps

  • Drive platform upgrades, migrations and performance
  optimization

  • Implement security, governance, compliance and audit
  controls

  • Enable secure self-service through data products and RBAC

  • Monitor platform health, SLAs and operational performance

  • Optimize cloud and AI usage costs

  • Support incident management, RCA and capacity planning

  • Collaborate with Data, AI, Analytics and business teams

  • Evaluate and operationalize emerging AI technologies

   GOOD TO HAVE

  • Power BI / MicroStrategy

  • Retail domain experience
