description: |
  Description

  As an Outbound AI Engineer at Nimble, you’ll support a
  focused Enterprise pod and help that pod create pipeline and
  ARR. You’ll own the work traditionally associated with top-
  of-funnel, but your role will not stop at booking meetings.

  You’ll use AI agents, automation, account research, GTM
  assets, and follow-up support to help the pod open doors,
  progress opportunities, and generate revenue.

  The goal is simple: help the pod create more pipeline and
  ARR from the accounts we care about.

  You do not need to be a software engineer.

  You do need to be resourceful, AI-native, and comfortable
  using modern AI tools to replace manual BDR work with better
  research, stronger personalization, faster execution, and
  more useful sales support.

  Being good at prompting is helpful, but it is not enough.

  We’re looking for someone who understands how to connect AI
  into actual GTM workflows and can think in terms of agents,
  workflows, tools, and repeatable systems.

  What Makes This Role Different

  Most BDR roles are built around activity volume.

  This role is built around pod outcomes.

  You’ll be expected to open doors and book meetings, but also
  to help the pod create better account strategies, better
  messaging, better assets, better follow-up, and better ways
  to engage the accounts we care about.

  You are not just passing meetings to AEs and moving on.

  You are part of the Enterprise pod and share the goal of
  creating pipeline and ARR from the accounts assigned to that
  pod.

  The role combines the accountability of outbound with the
  leverage of AI, agents, automation, and GTM tooling.

  Responsibilities

  - Support a pod of 2–3 Enterprise AEs
  - Research accounts, stakeholders, buying committees, market
    signals, and relevant business initiatives
  - Build AI-executed outbound campaigns across email, LinkedIn,
    phone, and other channels
  - Book qualified meetings with target accounts
  - Use AI agents, workflows, and automation to improve account
    research, personalization, messaging, sequencing, and
    follow-up
  - Build repeatable account research workflows for assigned
    accounts and segments
  - Build lightweight tools, workflows, dashboards, and
    automations that help the pod prioritize accounts and
    execute faster
  - Create account-specific or segment-specific GTM assets that
    help AEs open and progress conversations
  - Support post-meeting follow-up, stakeholder mapping, and
    multi-threading
  - Partner closely with AEs to help move opportunities from
    first meeting to pipeline and ARR
  - Stay focused on assigned accounts and strategic GTM
    priorities rather than chasing easy meetings outside the
    target list

  How We Expect AI to Be Used

  This role is not about occasionally using ChatGPT or Claude
  to write outbound emails.

  We’re looking for someone who can use AI agents, workflows,
  automation, and agentic loops to make outbound faster,
  sharper, and more scalable across a focused set of target
  accounts.

  You should be comfortable using AI as a research, workflow,
  automation, and GTM execution layer.

  That means using LLMs where useful, but also connecting them
  to tools, data sources, workflows, and repeatable processes
  that help the pod operate more effectively.

  Examples of how you might use AI in this role:

  - Build repeatable account research agents for assigned
    accounts and segments
  - Create agentic workflows that gather, summarize, and
    structure public web signals across accounts
  - Build account briefs that summarize company priorities,
    business model, public web presence, competitive
    landscape, and relevant business initiatives
  - Identify relevant stakeholders and buying committees across
    target accounts
  - Turn account research into relevant outbound angles by
    persona, account, and use case
  - Build repeatable messaging frameworks for different
    segments, buyer types, and use cases
  - Create personalized outreach based on account-specific
    signals, not generic AI-written copy
  - Use AI agents to analyze websites, documentation, product
    pages, job postings, news, company updates, customer
    stories, technical content, and other public web signals
  - Build lightweight workflows, automations, dashboards, and
    internal tools that help the pod prioritize accounts and
    execute faster
  - Connect AI tools like Claude to external tools, data
    sources, workflows, and internal systems through Skills,
    APIs, automations, or similar approaches
  - Use agentic loops to monitor accounts, surface changes,
    identify triggers, and suggest next actions
  - Use AI to create GTM assets that help AEs open conversations
    and move opportunities forward
  - Improve follow-up after meetings by summarizing context,
    identifying next stakeholders, creating tailored follow-up
    assets, and helping the AE multi-thread the account
  - Continuously test and improve outbound messaging, targeting,
    and account strategy based on what is converting

  Success in this role means contributing to:

  - Pipeline created by the pod
  - ARR generated by the pod
  - High-quality account engagement
  - Opening doors in strategic target accounts
  - Supporting AEs with research, assets, tools, and follow-up
  - Stronger pipeline creation and deal progression

  You will not be measured by activity volume, emails sent, or
  meetings booked for the sake of meetings.

  Requirements

  We’re looking for someone who can combine outbound execution
  with AI-native thinking.

  You should be comfortable doing the hard parts of outbound,
  but also curious enough to build better ways of doing the
  work.

  You are:

  - Commercially minded and revenue-oriented
  - Comfortable with outbound prospecting, including email,
    LinkedIn, and phone
  - Strong at account research and business writing
  - Able to understand business problems and turn them into
    relevant outreach
  - Able to use AI as a workflow and research engine, not just
    as a copywriting tool
  - Comfortable connecting AI tools like Claude to external
    tools, data sources, workflows, and internal systems
  - Familiar with Skills, APIs, automations, no-code / low-code
    tools, or similar ways to extend AI beyond a chat
    interface
  - Able to build repeatable processes with AI, automation,
    spreadsheets, enrichment tools, and lightweight dashboards
  - Able to turn public web data and account signals into
    specific outbound angles
  - Aware that good AI-assisted outbound still requires
    judgment, business context, and strong sales instincts
  - Disciplined about working assigned target accounts and GTM
    priorities
  - Strong at follow-up, organization, and CRM hygiene
  - Able to work closely with AEs and support opportunities
    after the first meeting
  - Excited by a role that blends outbound, AI, GTM strategy,
    and sales execution

  Helpful Background

  You may be a fit if you have experience in one or more of
  the following:

  - BDR / SDR / outbound sales
  - Enterprise sales development
  - AI-assisted prospecting or GTM automation
  - Sales tools, workflow automation, or no-code / low-code
    systems
  - Account-based outbound or strategic account prospecting
  - Working with assigned target accounts or named account lists
  - Selling or prospecting into technical, product, data,
    operations, strategy, or revenue buyers
  - Building workflows, internal tools, automations, or agent-
    based research processes

  On-Target Earnings (OTE): 75,000$ - 90,000$

  About us

  Nimble is the real-time web search platform built for
  enterprise accuracy, completeness, and trust. We run Web
  Search Agents that actively navigate live websites using
  real browsers and reasoning, turning the public web into
  governed, decision-grade data for AI systems and high-stakes
  business use.

  Unlike index-based “AI search” tools or brittle legacy
  scraping, Nimble makes the live web queryable on demand,
  delivering structured outputs that teams can verify and rely
  on. Our platform powers use cases where correctness matters:
  financial due diligence, real-time pricing and promotions,
  market intelligence, and AI systems that depend on fresh,
  complete data.

  Trusted by leading enterprises like Home Depot, Uber, and
  Coca-Cola and backed by top-tier investors, Nimble sits at
  the intersection of AI, automation, and real-time web
  intelligence.

  As demand accelerates across AI, LLMs, and data-driven
  decisioning, we’re scaling quickly and looking for high-
  energy, driven teammates who thrive in fast-moving
  environments and want to help define a new category.

  Why join Nimble?

  - Work on a deeply technical platform powering real-time AI
    and enterprise decisions
  - Help define the future of Web Search Agents and live web
    intelligence
  - Build alongside a sharp, mission-driven team that moves
    fast, ships often, and takes ownership
