  Agentic AI Engineer / Software Engineer - AI Applications
  (Remote US)

  ***US Citizenship or Greencard is required due to US
  Government contract requirements***

  ***You must be domiciled in the U.S. (must live permanently
  and maintain home address in the US)***

  ***As a step in the application process you will be required
  to provide legally authorized Identification to show
  verification of eligibility through third party provider
  CLEAR ID***

  Job Summary:

  We're looking for an Agentic Engineer to bridge the gap
  between our AI platform and customer outcomes. You'll take
  the platform capabilities our engineering teams
  build—agents, workflows, memory, reasoning, integrations,
  and tools—and turn them into polished, customer-ready
  applications that demonstrate immediate value.

  This is an engineering role for someone who enjoys building
  end-to-end experiences. You'll work directly with product
  and platform engineers to rapidly build, iterate, and ship
  AI applications that align with real operational value.

  Responsibilities:

  - Build agentic applications that solve real customer use
    cases using our platform capabilities.
  - Design agentic workflows, plugins, and tool integrations
    that deliver measurable customer value.
  - Translate ambiguous problems into intuitive AI experiences.
  - Rapidly build new applications, gather feedback, and iterate
    into production-ready solutions.
  - Partner closely with platform engineers to inform
    abstractions and reusable components.
  - Identify common patterns across customer deployments and
    help evolve them into reusable products.
  - Own customer-facing quality—from UX and reliability to
    performance and evaluation.

  Required Skills and Qualifications:

  - Bachelor’s or Master’s degree in Computer Science,
    Artificial Intelligence, Engineering, or related
    discipline.
  - 3-5 years of software engineering experience
  - Experience building production-ready agentic AI applications
    using AI agents, workflows, MCP, and tool orchestration.
  - Ability to move quickly from idea to working product while
    maintaining high engineering quality.
  - Strong product instincts—you care about whether something is
    useful, not just technically impressive.
  - Experience integrating APIs, enterprise systems, and
    external data sources.
  - Excellent communication and collaboration across engineering
    and product teams
  - Growth mindset and low ego- you’re eager to pick up new
    tools and technologies, learn from others, and be open to
    changing course when it’s right.
  - Drive to foster a culture of collaboration, psychological
    safety, and technical excellence.
  - Strong advocate for inclusion in technical discussions at
    all levels.

  Preferred Qualifications:

  - Start-up experience or comfort in 0→1 product environments.
  - Solid understanding of AI security practices including
    RBAC/ABAC, audit logging, and prompt-level safeguards
  - Exposure to regulated or sensitive industry environments
    (finance, healthcare, telecoms)

  #LI-REMOTE

  Compensation Information

  $170,000—$200,000 USD

