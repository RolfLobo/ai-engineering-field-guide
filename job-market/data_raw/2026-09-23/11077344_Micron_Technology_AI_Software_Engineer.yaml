description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever. Key Responsibilities

  - Develop software features and services supporting AI
    applications and intelligent automation platforms.
  - Build and maintain Generative AI and LLM-based applications
    using modern orchestration frameworks.
  - Implement Retrieval-Augmented Generation (RAG) solutions,
    vector database pipelines, and semantic search systems.
  - Design and integrate agentic workflows supporting autonomous
    task execution and multi-agent collaboration.
  - Build speech-to-text pipelines, voice-enabled AI assistants,
    and audio analytics applications.
  - Develop signal processing components for time-series
    analysis, sensor data, and industrial telemetry workloads.
  - Deploy and optimize AI models on edge devices and embedded
    systems for real-time low-latency inference.
  - Develop and deploy cloud-native AI solutions on AWS
    including serverless, event-driven, and microservices
    architectures.
  - Develop APIs, backend services, and AI integrations
    supporting enterprise AI platforms.
  - Perform model evaluation, testing, prompt engineering, and
    performance optimization.
  - Collaborate with engineering teams on architecture reviews
    and code quality initiatives.

  Participate in Agile software development activities
  including sprints, stand-ups, and technical reviews. About
